یم؛ اگر مذکر بود می‌گفتیم His name is .... معنی: این خواهرم است. اسمش زهرا است."},{"type":"exam","title":"سوال امتحانی: پرسش درباره نام پدر","body":"سوال What is your father's name? چه پاسخی دارد؟\nپاسخ درست: His name is Reza.\nتوضیح: با افزودن 's به اسم، ملکیت می‌سازیم؛ father's name یعنی نام پدر. پاسخ با his شروع می‌شود چون پدر مذکر است. معنی: نام پدرت چیست؟ نامش رضا است."}]},{"number":4,"title":"My Friends","pages":"۵۱ تا ۶۴","contents":[{"type":"answer","title":"مکالمه درس چهارم: بهترین دوست","body":"A: Who is your best friend?\nB: My best friend is Amir.\nA: How old is he?\nB: He is thirteen years old.\nA: Is he tall?\nB: Yes, he is very tall.\nترجمه: بهترین دوستت کیست؟ / دوست خوبم امیر است. / او چند سالش است؟ / سیزده سالش است. / آیا قدبلند است؟ / بله، خیلی قدبلند است.","pageRef":"صفحه ۵۱"},{"type":"answer","title":"تمرین گفت‌وگو: توصیف دوست","body":"A: Look at that boy! Is he your friend?\nB: Yes, he is my classmate.\nA: Is he short?\nB: No, he is not. He is tall and kind.\nترجمه: آن پسر را نگاه کن! دوست توست؟ / بله، هم‌کلاسی من است. / آیا کوتاه‌قد است؟ / نه، قدبلند و مهربان است.","pageRef":"صفحه ۵۶"},{"type":"note","title":"پرسیدن سن با How old","body":"برای پرسیدن سن از How old استفاده می‌کنیم.\nمثال: How old are you? I am thirteen years old. (چند سالت است؟ سیزده سال دارم.)\nHow old is your sister? She is twelve. (خواهرت چند سالش است؟ دوازده سال.)"},{"type":"note","title":"صفت‌های توصیف ظاهر و شخصیت","body":"tall (قدبلند)، short (کوتاه‌قد)، young (جوان)، old (بزرگسال)، kind (مهربان)، happy (خوشحال).\nمثال: My friend is tall and kind. (دوست من قدبلند و مهربان است.)\nصفت قبل از اسم یا بعد از فعل is و are می‌آید."},{"type":"exam","title":"سوال امتحانی: پاسخ به سوال سن","body":"سوال How old is your brother? را پاسخ دهید.\nپاسخ نمونه: He is fourteen years old.\nتوضیح: برای شخص مذکر پاسخ با He is شروع می‌شود و سن با حروف انگلیسی نوشته می‌شود؛ fourteen یعنی ۱۴. معنی: برادرت چند سالش است؟ چهارده سالش است."},{"type":"exam","title":"سوال امتحانی: انتخاب is یا are","body":"شکل درست فعل را انتخاب کنید:\n۱) How old ....... your brother? (is / are)\n۲) How old ....... you? (is / are)\nپاسخ: ۱) is ۲) are\nتوضیح: با he و she و it فعل is و با you و we و they فعل are به کار می‌رود."}]},{"number":5,"title":"My House","pages":"۶۵ تا ۷۹","contents":[{"type":"answer","title":"مکالمه درس پنجم: جای زندگی","body":"A: Where do you live, Mina?\nB: I live in Shiraz, on Bahar Street.\nA: Is your house big?\nB: Yes, it is. It has a living room, two bedrooms and a kitchen.\nترجمه: کجا زندگی می‌کنی، مینا؟ / در شیراز، در خیابان بهار. / خانه‌ات بزرگ است؟ / بله. یک اتاق نشیمن، دو اتاق خواب و آشپزخانه دارد.","pageRef":"صفحه ۶۵"},{"type":"answer","title":"تمرین گفت‌وگو: کجای خانه‌ای؟","body":"A: Where is your mother?\nB: She is in the kitchen.\nA: Where is your little brother?\nB: He is in the bedroom.\nترجمه: مادرت کجاست؟ / او در آشپزخانه است. / برادر کوچکت کجاست؟ / او در اتاق خواب است.","pageRef":"صفحه ۷۰"},{"type":"note","title":"پرسش Where do you live؟ و پاسخ آن","body":"برای پرسیدن محل زندگی از Where do you live? استفاده می‌کنیم.\nپاسخ: I live in + نام شهر یا کشور و I live on + نام خیابان.\nمثال: I live in Tehran. I live on Azadi Street.\n(من در تهران زندگی می‌کنم. در خیابان آزادی.)"},{"type":"note","title":"واژه‌های اتاق‌های خانه","body":"living room (اتاق نشیمن)، bedroom (اتاق خواب)، kitchen (آشپزخانه)، bathroom (حمام)، yard (حیاط).\nمثال: My mother is in the kitchen. (مادرم در آشپزخانه است.)\nOur house has two bedrooms. (خانه ما دو اتاق خواب دارد.)"},{"type":"exam","title":"سوال امتحانی: حرف اضافه in یا on","body":"جای خالی را کامل کنید:\nI live ....... Mashhad. I live ....... Valiasr Street.\nپاسخ: در جای اول in و در جای دوم on.\nتوضیح: قبل از نام شهر از in و قبل از نام خیابان از on استفاده می‌شود. معنی: در مشهد زندگی می‌کنم. در خیابان ولی‌عصر."},{"type":"exam","title":"سوال امتحانی: پاسخ به سوال مکان","body":"سوال Where is your father? را با کلمه bedroom پاسخ دهید.\nپاسخ درست: He is in the bedroom.\nتوضیح: برای پاسخ به where از عبارت مکان با حرف اضافه in استفاده می‌کنیم. معنی: پدرت کجاست؟ او در اتاق خواب است."}]},{"number":6,"title":"My School","pages":"۸۰ تا ۹۴","contents":[{"type":"answer","title":"مکالمه درس ششم: مدرسه ما","body":"A: Is your school big?\nB: Yes, it is. It has twenty classrooms, a library and a big yard.\nA: Where is your classroom?\nB: It is near the library.\nترجمه: مدرسه‌ات بزرگ است؟ / بله. بیست کلاس، یک کتابخانه و حیاط بزرگی دارد. / کلاس تو کجاست؟ / نزدیک کتابخانه است.","pageRef":"صفحه ۸۰"},{"type":"answer","title":"تمرین گفت‌وگو: کلاس ما","body":"A: Is your classroom big?\nB: Yes, it is. It has ten desks and ten chairs.\nA: Where do you sit?\nB: I sit near the window.\nترجمه: کلاس شما بزرگ است؟ / بله. ده میز و ده صندلی دارد. / کجا می‌نشینی؟ / نزدیک پنجره می‌نشینم.","pageRef":"صفحه ۸۵"},{"type":"note","title":"واژه‌های مدرسه","body":"school (مدرسه)، classroom (کلاس)، library (کتابخانه)، yard (حیاط)، desk (میز)، chair (صندلی)، teacher (معلم)، student (دانش‌آموز).\nمثال: Our classroom has ten desks. (کلاس ما ده میز دارد.)"},{"type":"note","title":"جمع بستن اسم‌ها با s","body":"برای جمع کردن بیشتر اسم‌های انگلیسی s به آخر آن‌ها اضافه می‌کنیم.\nمثال: one desk, ten desks (یک میز، ده میز)\none book, two books (یک کتاب، دو کتاب)\nجمله: Our school has many classrooms. (مدرسه ما کلاس‌های زیادی دارد.)"},{"type":"exam","title":"سوال امتحانی: شکل جمع اسم","body":"شکل درست کلمه داخل پرانتز را بنویسید:\nThere are ten ....... (chair) in our classroom.\nپاسخ: chairs\nتوضیح: چون ده صندلی داریم، اسم باید جمع باشد و s بگیرد. معنی: ده صندلی در کلاس ما هست."},{"type":"exam","title":"سوال امتحانی: ترجمه و تکمیل جمله","body":"جمله «این کتابخانه ماست» را به انگلیسی بنویسید.\nپاسخ: This is our library.\nتوضیح: our صفت ملکی برای «ما» است و قبل از اسم می‌آید. برای معرفی یک چیز از This is استفاده می‌کنیم. معنی دقیق: این کتابخانه ماست."}]},{"number":7,"title":"Colors and Shapes","pages":"۹۵ تا ۱۰۸","contents":[{"type":"answer","title":"مکالمه: رنگ وسایل","body":"A: What color is your bag?\nB: It is blue.\nA: What color is your pen?\nB: It is black and white.\nترجمه: کیف تو چه رنگی است؟ / آبی است. / خودکارت چه رنگی است؟ / سیاه و سفید است.","pageRef":"صفحه ۹۵"},{"type":"answer","title":"مکالمه: پرسش درباره شکل‌ها","body":"A: What is this?\nB: It is a circle.\nA: What color is it?\nB: It is red.\nA: And what is that?\nB: That is a green triangle.\nترجمه: این چیست؟ / یک دایره است. / چه رنگی است؟ / قرمز است. / و آن چیست؟ / یک مثلث سبز است.","pageRef":"صفحه ۹۹"},{"type":"note","title":"واژه‌های رنگ‌ها","body":"red (قرمز)، blue (آبی)، green (سبز)، yellow (زرد)، black (سیاه)، white (سفید)، brown (قهوه‌ای)، pink (صورتی)، purple (بنفش).\nمثال: My school bag is green. (کیف مدرسه‌ام سبز است.)"},{"type":"note","title":"واژه‌های شکل‌های هندسی","body":"circle (دایره)، square (مربع)، triangle (مثلث)، rectangle (مستطیل)، star (ستاره)، heart (قلب).\nمثال: The clock is a circle. (ساعت دیواری دایره است.)\nA triangle has three sides. (مثلث سه ضلع دارد.)"},{"type":"exam","title":"سوال امتحانی: تکمیل جمله با رنگ","body":"با کلمه داخل پرانتز جای خالی را پر کنید:\nThe light is ....... . (قرمز)\nپاسخ: red\nتوضیح: red به معنی قرمز است و رنگ‌ها بعد از فعل is می‌آیند. معنی: چراغ قرمز است."},{"type":"exam","title":"سوال امتحانی: پرسش رنگ کتاب","body":"سوال What color is your English book? را پاسخ دهید.\nپاسخ نمونه: It is blue and white.\nتوضیح: ساختار پرسش رنگ What color is + فاعل است و پاسخ با It is شروع می‌شود. معنی: کتاب انگلیسی‌ات چه رنگی است؟ آبی و سفید است."}]},{"number":8,"title":"Numbers and Time","pages":"۱۰۹ تا ۱۲۲","contents":[{"type":"answer","title":"مکالمه: پرسیدن ساعت","body":"A: What time is it?\nB: It is ten o'clock.\nA: Thank you very much.\nB: You are welcome.\nترجمه: ساعت چند است؟ / ساعت ده است. / خیلی ممنون. / خواهش می‌کنم.","pageRef":"صفحه ۱۰۹"},{"type":"answer","title":"مکالمه: دیر رسیدن به مدرسه","body":"A: Excuse me, what time is it?\nB: It is half past seven.\nA: Oh, it is late! Let us go to school.\nB: OK. Hurry up!\nترجمه: ببخشید، ساعت چند است؟ / ساعت هفت و نیم است. / وای دیر شد! برویم مدرسه. / باشه، عجله کن!","pageRef":"صفحه ۱۱۴"},{"type":"note","title":"اعداد ۱ تا ۲۰ انگلیسی","body":"one (۱)، two (۲)، three (۳)، four (۴)، five (۵)، six (۶)، seven (۷)، eight (۸)، nine (۹)، ten (۱۰)، eleven (۱۱)، twelve (۱۲)، thirteen (۱۳)، fourteen (۱۴)، fifteen (۱۵)، twenty (۲۰).\nمثال: I have fifteen books. (پانزده کتاب دارم.)"},{"type":"note","title":"گفتن ساعت به انگلیسی","body":"برای ساعت کامل می‌گوییم It is + عدد + o'clock.\nمثال: It is six o'clock. (ساعت شش است.)\nبرای نیم ساعت می‌گوییم half past + عدد.\nمثال: It is half past eight. (ساعت هشت و نیم است.)"},{"type":"exam","title":"سوال امتحانی: گفتن ساعت ۹","body":"ساعت نه را به انگلیسی بنویسید.\nپاسخ: It is nine o'clock.\nتوضیح: برای ساعت کامل اول عدد و سپس o'clock می‌آید؛ nine یعنی ۹. معنی: ساعت نه است."},{"type":"exam","title":"سوال امتحانی: نوشتن اعداد با حروف","body":"اعداد ۱۲ و ۱۵ و ۲۰ را با حروف انگلیسی بنویسید.\nپاسخ: twelve، fifteen، twenty\nتوضیح: اعداد ۱۳ تا ۱۹ به teen ختم می‌شوند مثل fifteen؛ اما ۱۲ و ۲۰ شکل خاص خود را دارند. معنی: دوازده، پانزده، بیست."}]},{"number":9,"title":"Food and Drinks","pages":"۱۲۳ تا ۱۳۶","contents":[{"type":"answer","title":"مکالمه: غذای مورد علاقه","body":"A: What is your favorite food?\nB: My favorite food is pizza.\nA: And what is your favorite drink?\nB: I like orange juice.\nترجمه: غذای مورد علاقه‌ات چیست؟ / غذای مورد علاقه‌ام پیتزا است. / و نوشیدنی مورد علاقه‌ات چیست؟ / آب‌پرتقال دوست دارم.","pageRef":"صفحه ۱۲۳"},{"type":"answer","title":"مکالمه: تشنگی در خانه","body":"A: I am thirsty, Mom.\nB: Drink some water, dear.\nA: Thank you, Mom.\nB: You are welcome.\nترجمه: مامان، تشنه‌ام. / عزیزم، کمی آب بخور. / ممنون مامان. / خواهش می‌کنم.","pageRef":"صفحه ۱۲۸"},{"type":"note","title":"واژه‌های غذا و نوشیدنی","body":"bread (نان)، rice (برنج)، apple (سیب)، milk (شیر)، water (آب)، tea (چای)، juice (آب‌میوه)، cheese (پنیر).\nمثال: I drink milk every morning. (هر صبح شیر می‌نوشم.)\nI eat bread and cheese. (نان و پنیر می‌خورم.)"},{"type":"note","title":"بیان علاقه با I like","body":"برای گفتن علاقه از I like + اسم استفاده می‌کنیم و برای محبوب‌ترین چیز می‌گوییم My favorite ... is ...\nمثال: I like apples. (سیب دوست دارم.)\nMy favorite drink is tea. (نوشیدنی مورد علاقه‌ام چای است.)"},{"type":"exam","title":"سوال امتحانی: ترجمه جمله","body":"جمله «من چای دوست دارم» را به انگلیسی بنویسید.\nپاسخ: I like tea.\nتوضیح: ساختار I like + اسم است؛ چای tea نام دارد. برای چیزهای غیرقابل شمارش مثل tea و milk اسم مفرد می‌آید. معنی: من چای دوست دارم."},{"type":"exam","title":"سوال امتحانی: تکمیل جمله با drink","body":"جای خالی را با کلمه مناسب پر کنید:\nMy favorite ....... is water.\nپاسخ: drink\nتوضیح: آب نوعی نوشیدنی است؛ drink به معنی نوشیدنی و نوشیدن است. معنی: نوشیدنی مورد علاقه‌ام آب است."}]},{"number":10,"title":"Weather","pages":"۱۳۷ تا ۱۵۰","contents":[{"type":"answer","title":"مکالمه: هوای امروز","body":"A: How is the weather today?\nB: It is sunny.\nA: Let us play football in the yard.\nB: Good idea!\nترجمه: امروز هوا چطور است؟ / آفتابی است. / بیا در حیاط فوتبال بازی کنیم. / فکر خوبی است!","pageRef":"صفحه ۱۳۷"},{"type":"answer","title":"مکالمه: هوای تابستان و زمستان","body":"A: How is the weather in Tabriz in winter?\nB: It is cold and snowy.\nA: And how is it in summer?\nB: It is warm.\nترجمه: هوای تبریز در زمستان چطور است؟ / سرد و برفی است. / و در تابستان چطور؟ / معتدل است.","pageRef":"صفحه ۱۴۲"},{"type":"note","title":"واژه‌های آب‌وهوا","body":"sunny (آفتابی)، rainy (بارانی)، snowy (برفی)، windy (بادی)، cloudy (ابری)، cold (سرد)، hot (گرم)، warm (معتدل)، cool (خنک).\nمثال: It is rainy today. (امروز هوا بارانی است.)"},{"type":"note","title":"ساختار پرسش How is the weather؟","body":"برای پرسیدن هوا می‌گوییم How is the weather? و می‌توانیم نام شهر را اضافه کنیم.\nمثال: How is the weather in Tehran? It is cloudy.\n(هوای تهران چطور است؟ ابری است.)\nپاسخ همیشه با It is شروع می‌شود."},{"type":"exam","title":"سوال امتحانی: تکمیل جمله هوایی","body":"جای خالی را با کلمه مناسب پر کنید:\nIt is ....... today. Take your umbrella!\nپاسخ: rainy\nتوضیح: وقتی باران می‌بارد هوا rainy است و چتر می‌خواهیم؛ umbrella یعنی چتر. معنی: امروز هوا بارانی است. چترت را بردار!"},{"type":"exam","title":"سوال امتحانی: پرسش هوای شهرها","body":"سوال How is the weather in Ardabil in winter? را پاسخ دهید.\nپاسخ نمونه: It is cold and snowy.\nتوضیح: اردبیل شهری سردسیر است؛ پاسخ با It is و صفت هوایی داده می‌شود. معنی: هوای اردبیل در زمستان چطور است؟ سرد و برفی است."}]},{"number":11,"title":"My Day","pages":"۱۵۱ تا ۱۶۵","contents":[{"type":"answer","title":"مکالمه: ساعت بیدار شدن","body":"A: What time do you get up?\nB: I get up at six o'clock.\nA: And what time do you go to school?\nB: I go to school at half past seven.\nترجمه: چه ساعتی بیدار می‌شوی؟ / ساعت شش بیدار می‌شوم. / و چه ساعتی به مدرسه می‌روی؟ / ساعت هفت و نیم به مدرسه می‌روم.","pageRef":"صفحه ۱۵۱"},{"type":"answer","title":"توصیف روز خود به انگلیسی","body":"I get up at six. I eat breakfast at half past six. I go to school at seven. I study in the afternoon. I go to bed at nine.\nترجمه: ساعت شش بیدار می‌شوم. ساعت شش و نیم صبحانه می‌خورم. ساعت هفت به مدرسه می‌روم. بعدازظهر درس می‌خوانم. ساعت نه می‌خوابم.","pageRef":"صفحه ۱۵۶"},{"type":"note","title":"افعال کارهای روزمره","body":"get up (بیدار شدن)، eat breakfast (صبحانه خوردن)، go to school (به مدرسه رفتن)، study (درس خواندن)، go to bed (به رختخواب رفتن).\nمثال: I study in the evening. (عصر درس می‌خوانم.)"},{"type":"note","title":"حرف اضافه at برای ساعت","body":"برای گفتن زمان انجام کار از at قبل از ساعت استفاده می‌کنیم.\nمثال: I get up at six o'clock. (ساعت شش بیدار می‌شوم.)\nI go to bed at ten. (ساعت ده می‌خوابم.)"},{"type":"exam","title":"سوال امتحانی: حرف اضافه at","body":"جای خالی را کامل کنید:\nI go to school ....... seven o'clock.\nپاسخ: at\nتوضیح: قبل از زمان مشخص مثل ساعت از at استفاده می‌شود. معنی: ساعت هفت به مدرسه می‌روم."},{"type":"exam","title":"سوال امتحانی: پاسخ درباره زمان مدرسه","body":"سوال What time do you go to school? را پاسخ دهید (ساعت ۷ و نیم).\nپاسخ نمونه: I go to school at half past seven.\nتوضیح: پاسخ شامل فعل، حرف اضافه at و ساعت است؛ half past seven یعنی هفت و نیم. معنی: چه ساعتی به مدرسه می‌روی؟"}]},{"number":12,"title":"Review","pages":"۱۶۶ تا ۱۸۰","contents":[{"type":"answer","title":"مکالمه مرور: آشنایی دوباره","body":"A: Hi, Reza! How are you?\nB: Fine, thanks. This is my friend, Ali.\nA: Nice to meet you, Ali. Where do you live?\nB: I live in Qom.\nترجمه: سلام رضا، حالت چطور است؟ / خوبم ممنون. این دوستم علی است. / از آشنایی‌ات خوشبختم علی. کجا زندگی می‌کنی؟ / در قم زندگی می‌کنم.","pageRef":"صفحه ۱۶۶"},{"type":"answer","title":"مرور پرسش و پاسخ‌های کلیدی","body":"A: What color is your bag?\nB: It is black.\nA: What time is it?\nB: It is half past ten.\nA: How is the weather?\nB: It is sunny.\nترجمه: کیف تو چه رنگی است؟ / سیاه است. / ساعت چند است؟ / ساعت ده و نیم است. / هوا چطور است؟ / آفتابی است.","pageRef":"صفحه ۱۷۰"},{"type":"note","title":"مرور ساختارهای مهم کتاب","body":"در این کتاب یاد گرفتیم: معرفی خود با My name is ...، معرفی دوست با This is ...، پرسش سن با How old ...؟، محل زندگی با I live in ... و پرسش ساعت با What time is it؟\nمثال: My name is Sara. I live in Yazd."},{"type":"note","title":"مرور واژه‌های پایانی","body":"خانواده: father, mother, sister. رنگ‌ها: red, blue, green. هوا: sunny, rainy. غذاها: bread, milk, tea. مدرسه: classroom, library.\nمثال: I like tea and bread. (من چای و نان دوست دارم.)"},{"type":"exam","title":"سوال امتحانی مرور: جای خالی ترکیبی","body":"جای خالی‌ها را پر کنید:\nThis ....... my friend. ....... name is Sam.\nپاسخ: جای اول is و جای دوم His.\nتوضیح: برای معرفی یک نفر This is به کار می‌رود و برای دوست پسر از His استفاده می‌کنیم. معنی: این دوستم است. اسمش سم است."},{"type":"exam","title":"سوال امتحانی مرور: پاسخ کوتاه","body":"به دو سوال پاسخ دهید: How old are you? و Where do you live?\nپاسخ نمونه: I am thirteen years old. I live in Isfahan.\nتوضیح: پاسخ سن با I am و محل زندگی با I live in داده می‌شود. معنی: سیزده سال دارم و در اصفهان زندگی می‌کنم."}]}]},{"title":"پیام‌های آسمان هفتم","subject":"پیام‌های آسمان","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب پیام‌های آسمان هفتم","color":"amber","icon":"sparkles","chapters":[{"number":1,"title":"هُوَ الله","pages":"۱ تا ۱۴","contents":[{"type":"answer","title":"خداوند چه صفاتی دارد؟ چهار صفت از صفات الهی را با معنا بنویسید.","body":"خداوند صفات بی‌نهایت دارد. حیّ یعنی زنده و بخشنده زندگی؛ عالم یعنی دانای همه چیز؛ قادر یعنی توانا بر هر کاری؛ قیوم یعنی نگهدارنده همه جهان. خداوند دانا و بینای اعمال ماست و از آنچه در دل داریم آگاه است. هیچ چیز شبیه او نیست و صفات او نیز مانند خود او بی‌نهایت است.","pageRef":"صفحه ۴"},{"type":"answer","title":"از نظم و زیبایی آفرینش چه نتیجه‌ای می‌گیریم؟","body":"آسمان و ستاره‌ها، بدن انسان و موجودات زنده همه نظمی شگفت‌انگیز دارند. نظم به نظم‌دهنده نیاز دارد و هیچ سازه‌ای بدون سازنده پدید نمی‌آید؛ پس جهان آفریننده‌ای دانا و توانا دارد. قرآن می‌فرماید: «إِنَّ فِي خَلْقِ السَّماواتِ وَ الْأَرْضِ لَآياتٍ»؛ در آفرینش آسمان‌ها و زمین نشانه‌هایی برای خردمندان است.","pageRef":"صفحه ۸"},{"type":"note","title":"توحید، بنیاد زندگی","body":"توحید یعنی دیدن همه جهان به دست یک خدا؛ او یگانه است و شریک ندارد. سوره توحید می‌فرماید: «قُلْ هُوَ اللهُ أَحَدٌ»؛ بگو او خدای یگانه است. توحید به انسان آرامش می‌بخشد، ترس از غیر خدا را از دل می‌برد و زندگی او را هدفمند می‌کند."},{"type":"note","title":"خداوند ناظر بر اعمال ماست","body":"خداوند از ریزترین حرکات ما آگاه است و از آنچه در دل داریم خبر دارد. پیامبر اکرم (ص) فرمود: «اُعْبُدُ اللهَ كَأَنَّكَ تَراهُ»؛ خدا را عبادت کن چنان‌که گویی او را می‌بینی. اگر هم ما او را نمی‌بینیم، او ما را می‌بیند. حضور خدا در ذهن، انسان را از گناه بازمی‌دارد."},{"type":"exam","title":"سه صفت از صفات خداوند را نام ببرید و برای یکی از آن‌ها توضیح بنویسید.","body":"صفات خداوند: حیّ، عالم، قادر، قیوم و سماد. قیوم یعنی نگهدارنده و برپادارنده همه جهان؛ یعنی هستی هر موجودی به اراده خدا برقرار است و اگر لحظه‌ای نگهداری او نباشد، جهان از میان می‌رود. خدا برای ادامه هستی به هیچ‌کس نیاز ندارد و همه به او محتاج‌اند."},{"type":"exam","title":"آیه «قُلْ هُوَ اللهُ أَحَدٌ» درباره کدام اصل دین است؟ آن را توضیح دهید.","body":"این آیه درباره اصل توحید است. توحید یعنی یگانگی خداوند؛ او یکی است و شریک و همتا ندارد. خدای یگانه آفریننده و پروردنده همه موجودات است و تنها سزوار پرستش است. یگانگی خدا به انسان آرامش و استقلال می‌بخشد و انسان جز به خدا به هیچ قدرتی دل نمی‌بندد."}]},{"number":2,"title":"راهنمایان الهی","pages":"۱۵ تا ۲۷","contents":[{"type":"answer","title":"چرا خداوند پیامبران را برای هدایت انسان‌ها فرستاد؟","body":"انسان برای شناخت راه درست زندگی به راهنمای معصوم نیاز دارد. خداوند بهترین انسان‌ها را برگزید تا فرمان او را بدون کم‌وزیادی برسانند. پیامبران بشارت‌دهنده پاداش و هشداردهنده عذاب‌اند و خود الگوی کامل زندگی‌اند. آخرین آن‌ها حضرت محمد (ص) است و پس از او امامان معصوم (ع) هدایت را ادامه دادند.","pageRef":"صفحه ۱۸"},{"type":"answer","title":"امام پس از پیامبر چه وظایفی دارد؟","body":"امام، رهبر و پیشوای مسلمانان پس از پیامبر است. او دین خدا را از تغییر و تحریف نگه می‌دارد و مردم را به راه درست راهنمایی می‌کند. پیامبر (ص) فرمود: «إِنِّي تَارِكٌ فِيكُمُ الثَّقَلَيْنِ»؛ من دو یادگار گران‌بها در میان شما می‌گذارم: کتاب خدا و اهل بیت من. امام در کنار قرآن، پناه ماست.","pageRef":"صفحه ۲۳"},{"type":"note","title":"عدالت و عصمت، شرط پیامبری","body":"پیامبر خدا باید عادل و معصوم باشد؛ یعنی از اشتباه و گناه دور است تا سخن خدا را درست برساند. قرآن می‌فرماید: «رُسُلاً مُبَشِّرِينَ وَ مُنْذِرِينَ»؛ پیامبرانی که مردم را بشارت و هشدار می‌دهند. به همین دلیل تنها انسان‌های پاک و برگزیده به پیامبری برمی‌خیزند."},{"type":"note","title":"حدیث ثقلین","body":"پیامبر اکرم (ص) فرمود: «إِنِّي تَارِكٌ فِيكُمُ الثَّقَلَيْنِ، كِتَابَ اللهِ وَ عِتْرَتِي»؛ من دو چیز گران‌بها میان شما به یادگار می‌گذارم: کتاب خدا و اهل بیت من. هر کس به این دو چنگ زند هرگز گمراه نمی‌شود. چنگ زدن یعنی خواندن قرآن و پیروی از راه اهل بیت (ع) در همه زندگی."},{"type":"exam","title":"دو دلیل لزوم فرستادن پیامبران را بنویسید.","body":"نخست، انسان برای شناخت خدا، هدف آفرینش و راه درست زندگی به راهنمای معصوم نیاز دارد؛ زیرا عقل به‌تنهایی همه نیازهای زندگی را روشن نمی‌کند. دوم، خداوند به بندگان خود مهربان است و سعادت آنان را می‌خواهد؛ پس باید پیامبر بفرستد تا راه نجات را نشان دهد و کسی در روز قیامت بهانه نداشته باشد."},{"type":"exam","title":"امام زمان (عج) کیست و وظیفه ما در زمان غیبت چیست؟","body":"امام زمان حضرت مهدی (عج)، دوازدهمین امام و فرزند امام حسن عسکری (ع) است. خداوند او را ناپیدا کرده تا روزی جهان را پر از عدل و داد کند. وظیفه ما در زمان غیبت، انتظار واقعی است؛ یعنی دوری از گناه، انجام کارهای نیک، خواندن نماز و آمادگی برای ظهور آن حضرت."}]},{"number":3,"title":"نور هدایت","pages":"۲۸ تا ۴۰","contents":[{"type":"answer","title":"چرا قرآن کریم معجزه جاودانه پیامبر (ص) است؟","body":"قرآن کلام خدا و معجزه پیامبر اکرم (ص) است. آن حضرت درس نخوانده بود، اما قرآن با آهنگ و محتوای شگفت خود همه سخنوران عرب را شگفت‌زده کرد. قرآن در گذر زمان تغییر نکرده و همچنان راهنمای انسان‌هاست. خدا می‌فرماید: «إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَ إِنَّا لَهُ لَحَافِظُونَ»؛ ما قرآن را نازل کردیم و خود نگهبان آنیم.","pageRef":"صفحه ۳۱"},{"type":"answer","title":"آداب قرائت قرآن را بنویسید.","body":"پیش از خواندن قرآن وضو بگیریم و رو به قبله در جای پاکیزه بنشینیم. آیات را آهسته و شمرده بخوانیم و هنگام شنیدن قرآن، سکوت کنیم و گوش بسپاریم. قرآن را به زمین نیندازیم و بر آن دست نکشیم؛ هنگام رد شدن از کنار آن، به نشانه احترام بوسه بزنیم. این آداب نشانه ادب در برابر سخن خداست.","pageRef":"صفحه ۳۶"},{"type":"note","title":"قرآن، معجزه جاودانه","body":"معجزه کاری شگفت است که پیامبر به اذن خدا انجام می‌دهد تا حقانیت خود را نشان دهد. معجزه پیامبر اکرم (ص) قرآن است. خدا می‌فرماید: «فَأْتُوا بِسُورَةٍ مِنْ مِثْلِهِ»؛ اگر در حقانیت قرآن شک دارید، حتی یک سوره مانند آن بیاورید. تا امروز هیچ‌کس نتوانسته است."},{"type":"note","title":"تدبر در قرآن","body":"خداوند می‌فرماید: «أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ»؛ آیا در قرآن نمی‌اندیشند؟ تدبر یعنی فکر کردن به معنی آیه و راه استفاده از آن در زندگی. خواندن قرآن خوب است، اما بهتر آن است که با فهم بخوانیم و به دستورهای آن عمل کنیم تا قرآن روز قیامت شفیع ما باشد."},{"type":"exam","title":"آیه «إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَ إِنَّا لَهُ لَحَافِظُونَ» به کدام ویژگی قرآن اشاره دارد؟ شرح دهید.","body":"به پاسداری الهی از قرآن. خداوند خود نگهبان قرآن است؛ یعنی این کتاب از تغییر و تحریف در امان مانده است. از زمان نزول تا امروز یک حرف آن عوض نشده و همه قرآن‌های جهان یکی است. این ویژگی نشانه حقانیت قرآن و معجزه بودن آن است و تفاوت آن با کتاب‌های ساخته انسان را نشان می‌دهد."},{"type":"exam","title":"چرا در برابر قرآن باید احترام داشت؟ دو آداب قرائت را بنویسید.","body":"قرآن کلام خداوند است و سخن خدا سزوار بزرگ‌داشت است؛ احترام به قرآن نشانه محبت به خدا و پیامبر (ص) است. دو آداب: نخست، خواندن قرآن با وضو و رو به قبله؛ دوم، سکوت و گوش سپردن هنگام شنیدن آیات. همچنین نباید در حال غفلت و خنده، آیات الهی را بخوانیم یا به آن گوش بسپاریم."}]},{"number":4,"title":"دنیا و آخرت","pages":"۴۱ تا ۵۳","contents":[{"type":"answer","title":"آیا زندگی انسان با مرگ پایان می‌یابد؟ توضیح دهید.","body":"نه؛ مرگ پایان زندگی نیست، بلکه دروازه گذر از این جهان به جهان جاودان است. انسان پس از مرگ زنده است و اعمال خود را می‌بیند. قرآن می‌فرماید: «كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ»؛ هر نفری طعم مرگ را می‌چشد، اما زندگی حقیقی در سرای آخرت است؛ پس باید برای آن خانه کار و توشه بفرستیم.","pageRef":"صفحه ۴۴"},{"type":"answer","title":"چرا خداوند اعمال ما را ثبت می‌کند؟","body":"خداوند فرشتگانی برای ثبت اعمال ما گمارده است تا در روز قیامت جزای هر کس بر پایه کارهای خودش داده شود. قرآن می‌فرماید: «وَ إِنَّ عَلَيْكُمْ حَافِظِينَ كِرَاماً كَاتِبِينَ»؛ فرشتگانی گرامی اعمال شما را می‌نویسند. پس هیچ نیکی و بدی گم نمی‌شود و انسان با عادلانه‌ترین حساب به نتیجه کارهای خود می‌رسد.","pageRef":"صفحه ۴۹"},{"type":"note","title":"دنیا، کشتزار آخرت","body":"مرگ، نابودی انسان نیست؛ گذر از این خانه به خانه جاودان است. پیامبر (ص) فرمود: «الدُّنْيَا مَزْرَعَةُ الْآخِرَةِ»؛ دنیا کشتزار آخرت است. هرچه در این کشتزار بکاریم، در آخرت درو می‌کنیم؛ دنیا جای کار و آخرت جای برداشت پاداش است. پس باید کار نیک بکاریم تا در آخرت میوه شیرین بچینیم."},{"type":"note","title":"فرشتگان ثبت اعمال","body":"بر شانه هر انسان دو فرشته گرامی قرار دارند؛ یکی کارهای نیک و دیگری کارهای بد را می‌نویسند. قرآن می‌فرماید: «مَا يَلْفِظُ مِنْ قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌ»؛ هیچ سخنی نمی‌گوید مگر آنکه ناظری آماده ثبت آن است. آگاهی از این ثبت، ما را از گناه دور و به کارهای نیک تشویق می‌کند."},{"type":"exam","title":"معاد یعنی چه؟ ایمان به معاد چه اثری در زندگی دارد؟","body":"معاد یعنی بازگشت انسان پس از مرگ به زندگی دوباره و پاسخ گویی درباره اعمال. کسی که به معاد ایمان دارد می‌داند هیچ خوبی بی‌پاداش و هیچ بدی بی‌کیفر نمی‌ماند؛ پس برای خشنودی خدا کار می‌کند، در سختی‌ها صبور است و دنیا را همه چیز زندگی نمی‌داند. ایمان به معاد انگیزه نیکی و بازدارنده از گناه است."},{"type":"exam","title":"دو نشانه از توان خداوند در زنده کردن مردگان را از قرآن بنویسید.","body":"نشانه نخست: آفرینش نخستین انسان؛ قرآن می‌فرماید: «قُلْ يُحْيِيهَا الَّذِي أَنْشَأَهَا أَوَّلَ مَرَّةٍ»؛ بگو همان که بار نخست شما را آفرید، دوباره زنده می‌کند. نشانه دوم: زنده شدن زمین مرده؛ خدا با باران، خاک بی‌گیاه را سبز و پربار می‌کند. آن که می‌تواند مرده را زنده کند، مردگان را نیز برمی‌انگیزد."}]},{"number":5,"title":"روزه، سنگر خدایی","pages":"۵۴ تا ۶۶","contents":[{"type":"answer","title":"حکمت و هدف روزه چیست؟","body":"خداوند می‌فرماید: «يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ»؛ روزه بر شما واجب شد تا پرهیزگار شوید. روزه‌دار با ترک خوردن و آشامیدن حلال، اراده خود را نیرومند می‌کند تا ترک گناه برایش آسان شود. پس روزه باشگاه اراده است.","pageRef":"صفحه ۵۷"},{"type":"answer","title":"آیا روزه فقط ترک خوردن و آشامیدن است؟ توضیح دهید.","body":"نه؛ روزه دو بخش دارد: ترک خوردن و آشامیدن از اذان صبح تا اذان مغرب و پرهیز زبان و چشم و گوش و دل از گناه. پیامبر (ص) فرمود: «كَمْ مِنْ صَائِمٍ لَيْسَ لَهُ مِنَ الصِّيَامِ إِلَّا الْجُوعُ»؛ چه بسا روزه‌داری که از روزه‌اش جز گرسنگی بهره‌ای ندارد. پس روزه واقعی، روزه‌ای است که همه اندام از گناه پاک بماند.","pageRef":"صفحه ۶۱"},{"type":"note","title":"روزه، سپر در برابر آتش","body":"پیامبر اکرم (ص) فرمود: «الصَّوْمُ جُنَّةٌ مِنَ النَّارِ»؛ روزه سپر و پوششی در برابر آتش دوزخ است. سپر، انسان را از آسیب نگه می‌دارد و روزه نیز دل را از آتش خشم و حسادت و شهوت پاکیزه می‌کند. پیامبر (ص) فرمود: روزه نصف صبر است."},{"type":"note","title":"ماه رمضان، بهار قرآن","body":"ماه رمضان میهمانی خدا و بهار قرآن است. خدا می‌فرماید: «شَهْرُ رَمَضَانَ الَّذِي أُنْزِلَ فِيهِ الْقُرْآنُ»؛ رمضان ماهی است که قرآن در آن نازل شد. روزه‌دار در این ماه با خواندن قرآن، دعا و صدقه جان خود را پاکیزه می‌کند و شب قدر با دعا، تقدیر سال آینده خود را به دست می‌گیرد."},{"type":"exam","title":"آیه «لَعَلَّكُمْ تَتَّقُونَ» چه هدفی از روزه را بیان می‌کند؟ شرح دهید.","body":"هدف اصلی روزه، رسیدن به تقواست. تقوا یعنی پرهیز از گناه به خاطر حضور خدا در دل. روزه‌دار با گرسنگی کشیدن بر خواهش‌های نفس مسلط می‌شود و اراده‌اش نیرومند می‌گردد؛ آن‌گاه ترک گناه برایش آسان است. پس روزه، تمرین پرهیزگاری و نسخه‌ای برای سلامت جان است."},{"type":"exam","title":"فواید روزه را در دو بخش جسمی و روحی بنویسید.","body":"فواید جسمی: استراحت دستگاه گوارش، پاک شدن بدن از مواد اضافی و تقویت سلامتی. فواید روحی: پرورش تقوا و اراده، دوری از گناه، یاد حال گرسنگان و شکر نعمت‌های خدا. روزه‌دار با تجربه گرسنگی، رحمت آوردن به فقرا را می‌آموزد و با آنان همدردی می‌کند."}]},{"number":6,"title":"پیامبر رحمت","pages":"۶۷ تا ۷۹","contents":[{"type":"answer","title":"چرا خداوند پیامبر (ص) را رحمت برای جهانیان نامید؟","body":"خداوند می‌فرماید: «وَ مَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ»؛ تو را جز رحمت برای جهانیان نفرستادیم. پیامبر (ص) دل‌ها را با مهربانی جذب کرد، به یتیمان و فقرا نیکی می‌کرد و حتی با دشمنان خود با عفو رفتار می‌کرد. برنامه او، سعادت همه انسان‌ها در دنیا و آخرت بود.","pageRef":"صفحه ۷۰"},{"type":"answer","title":"رسالت پیامبر اکرم (ص) چه بود؟","body":"رسالت آن حضرت، آموزش توحید، معاد و اخلاق نیک بود. او در مدینه جامعه اسلامی را بنا نهاد، مسجد ساخت و میان مهاجران و انصار پیمان برادری برقرار کرد. قرآن می‌فرماید: «لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ»؛ پیامبری از جنس خودتان که رنج شما بر او دشوار است.","pageRef":"صفحه ۷۴"},{"type":"note","title":"پیامبر، کامل‌کننده اخلاق نیک","body":"پیامبر (ص) فرمود: «إِنَّمَا بُعِثْتُ لِأُتَمِّمَ مَكَارِمَ الْأَخْلَاقِ»؛ من برانگیخته شدم تا اخلاق نیک را کامل کنم. ایشان هرگز دروغ نگفت، با کودکان مهربان بود و به بزرگ‌ترها احترام می‌گذاشت. اخلاق نیک، بزرگ‌ترین سرمایه انسان است و مایه نزدیکی به خدا."},{"type":"note","title":"سیره پیامبر در خانه","body":"پیامبر (ص) در خانه دست به کار می‌شد، لباس خود را وصله می‌کرد، شیر می‌دوشید و با خانواده با نرمی سخن می‌گفت. فرمود: «خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ»؛ بهترین شما کسی است که با خانواده خود بهتر رفتار کند. کمک در کار خانه و ادب با خانواده، از سیره ایشان است."},{"type":"exam","title":"دو صفت پیامبر (ص) را با ذکر مثال توضیح دهید.","body":"صفت نخست: عفو و گذشت؛ در فتح مکه به کسانی که سال‌ها او را آزار داده بودند گفت: بروید که همه شما آزادید. صفت دوم: مهربانی با کودکان؛ در نماز، نوه کوچک خود را در آغوش می‌گرفت و پس از سجده برمی‌داشت تا خسته نشود. این رفتارها نشان می‌دهد پیامبر (ص) رحمت برای جهانیان است."},{"type":"exam","title":"پیامبر (ص) پیش از بعثت چه لقبی داشت و چرا؟","body":"ایشان پیش از بعثت «امین» لقب داشت. مردم مکه امانت‌های خود را نزد او می‌گذاشتند زیرا او هرگز خیانت نمی‌کرد و راست می‌گفت. حتی در دوران جاهلیت نیز از شراب و بت‌پرستی دور بود. این لقب نشان می‌دهد پیامبر (ص) پیش از دعوت، نمونه کامل صداقت و امانت‌داری بود."}]},{"number":7,"title":"همراهان دو شهر","pages":"۸۰ تا ۹۲","contents":[{"type":"answer","title":"انصار چه کسانی بودند و چه خدمتی به اسلام کردند؟","body":"انصار، مسلمانان یثرب (مدینه) بودند که به پیامبر (ص) و مهاجران پناه دادند. آنان خانه، باغ و نیمی از اموال خود را با مهاجران سهیم کردند و آنان را برادر خواندند. قرآن می‌فرماید: «يُؤْثِرُونَ عَلَى أَنْفُسِهِمْ وَ لَوْ كَانَ بِهِمْ خَصَاصَةٌ»؛ با آنکه خود نیازمند بودند، دیگران را بر خود مقدم داشتند.","pageRef":"صفحه ۸۳"},{"type":"answer","title":"پیمان برادری میان مهاجران و انصار چه فایده‌ای داشت؟","body":"پس از هجرت، پیامبر (ص) میان مهاجران مکه و انصار مدینه پیمان برادری بست. انصار مهاجران را به خانه‌های خود بردند و در کار و زندگی سهیمشان کردند. این برادری، جامعه نوپای اسلامی را از جدایی و کینه نجات داد و نشان داد محور برادری، ایمان است نه قبیله و ثروت.","pageRef":"صفحه ۸۸"},{"type":"note","title":"هجرت، آغاز سال‌شماری مسلمانان","body":"هجرت پیامبر (ص) از مکه به مدینه، آغاز سال‌شماری مسلمانان است. مهاجران خانه و سرمایه خود را برای خدا رها کردند. قرآن می‌فرماید: «وَ الَّذِينَ هَاجَرُوا فِي اللهِ مِنْ بَعْدِ مَا ظُلِمُوا»؛ خداوند به مهاجران سرای نیکویی در آخرت وعده داد. هجرت یعنی فداکاری برای دین و گذشتن از محبوب‌ها برای خدا."},{"type":"note","title":"مؤمنان برادر یکدیگرند","body":"قرآن می‌فرماید: «إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ»؛ مؤمنان برادر یکدیگرند. برادری ایمانی از خویشاوندی نیز مهم‌تر است؛ زیرا بر پایه ایمان و محبت خداست. پیامبر (ص) فرمود: «الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ»؛ مؤمنان نسبت به یکدیگر مانند دیوارهای یک ساختمان‌اند که یکدیگر را استوار نگه می‌دارند."},{"type":"exam","title":"مهاجران و انصار چه تفاوتی داشتند و چرا پیامبر (ص) آنان را برادر کرد؟","body":"مهاجران مسلمانانی بودند که برای حفظ ایمان مکه را ترک کردند و انصار اهل مدینه بودند که به پیامبر (ص) پناه دادند. پیامبر (ص) میان آنان پیمان برادری بست تا مهاجران بی‌خانه نمانند، کینه‌های قبیله‌ای از میان برود و مسلمانان یک امت شوند؛ محور وحدت آنان ایمان و قرآن بود."},{"type":"exam","title":"از آیه «يُؤْثِرُونَ عَلَى أَنْفُسِهِمْ» چه خصلتی فهمیده می‌شود؟ توضیح دهید.","body":"این آیه درباره انصار است و به ایثار اشاره دارد. ایثار یعنی دیگران را بر خود مقدم داشتن، حتی وقتی خود نیازمندیم. انصار با آنکه در مدینه نیاز داشتند، نیمی از اموال و خوراک خود را به مهاجران دادند. ایثار نشانه ایمان قوی و از زیباترین اخلاق اسلامی است و زندگی را پر از مهر می‌کند."}]},{"number":8,"title":"هفده رکعت","pages":"۹۳ تا ۱۰۶","contents":[{"type":"answer","title":"نمازهای واجب روزانه چند رکعت است؟ نام و تعداد آن‌ها را بنویسید.","body":"نمازهای واجب روزانه ۱۷ رکعت است: نماز صبح ۲ رکعت، نماز ظهر ۴ رکعت، نماز عصر ۴ رکعت، نماز مغرب ۳ رکعت و نماز عشا ۴ رکعت. مجموع این پنج نماز، هفده رکعت می‌شود که خواندن آن‌ها بر هر مسلمان واجب است و ترک عمدی آن گناهی بزرگ است.","pageRef":"صفحه ۹۶"},{"type":"answer","title":"شروط نماز را نام ببرید و یکی را توضیح دهید.","body":"شروط نماز: طهارت یعنی وضو یا غسل داشتن، پاک و مباح بودن لباس و جای نماز، رو به قبله ایستادن و فرا رسیدن وقت نماز. طهارت یعنی پاکیزگی ظاهری و باطنی؛ با وضو بدن از نجاست و با نیت خالص، دل از ریا پاک می‌شود. اگر یکی از شروط نباشد، نماز صحیح نیست.","pageRef":"صفحه ۱۰۱"},{"type":"note","title":"نماز، ستون دین","body":"پیامبر (ص) فرمود: «الصَّلَاةُ عَمُودُ الدِّينِ»؛ نماز ستون دین است. ستون، خانه را برپا می‌دارد و نماز نیز ایمان را نگه می‌دارد؛ اگر ستون فروریزد، خانه خراب می‌شود. خدا می‌فرماید: «أَقِمِ الصَّلَاةَ لِذِكْرِي»؛ نماز را برای یاد من برپا دار. نماز، پیوند انسان با خداست."},{"type":"note","title":"نماز در اول وقت","body":"پیامبر (ص) فرمود: «خَيْرُ الْأَعْمَالِ الصَّلَاةُ عَلَى وَقْتِهَا»؛ بهترین کارها، نماز خواندن در وقت آن است. خواندن نماز در اول وقت، نشانه اهمیت دادن به خداست و انسان را منظم و وقت‌شناس می‌کند. بهتر است نماز را با جماعت در مسجد بخوانیم تا هم ثواب بیشتر باشد و هم وحدت مسلمانان تقویت شود."},{"type":"exam","title":"هر یک از نمازهای واجب روزانه چند رکعت دارند؟","body":"نماز صبح ۲ رکعت، نماز ظهر ۴ رکعت، نماز عصر ۴ رکعت، نماز مغرب ۳ رکعت و نماز عشا ۴ رکعت دارد و مجموع آن‌ها ۱۷ رکعت است. در سفر، نمازهای چهار رکعتی شکسته می‌شوند و دو رکعت خوانده می‌شوند؛ بنابراین نماز صبح و مغرب در سفر شکسته نمی‌شوند."},{"type":"exam","title":"نماز چه اثری در زندگی انسان دارد؟ توضیح دهید.","body":"نماز یاد خداست و بازدارنده از زشتی‌ها. خدا می‌فرماید: «إِنَّ الصَّلَاةَ تَنْهَى عَنِ الْفَحْشَاءِ وَ الْمُنْكَرِ»؛ نماز از زشتی و ناپسندی بازمی‌دارد. نمازگزار پنج بار در روز با خدا سخن می‌گوید، دلش پاکیزه می‌شود، منظم می‌گردد و از گناه دور می‌ماند. نماز کلید پذیرش کارهای نیک و چراغ زندگی مؤمن است."}]},{"number":9,"title":"علی (ع) و عدالت","pages":"۱۰۷ تا ۱۲۰","contents":[{"type":"answer","title":"چرا امام علی (ع) نمونه کامل عدالت است؟","body":"امام علی (ع) در حکومت خود میان مردم هیچ فرقی نمی‌گذاشت. به برادرش عقیل که از بیت‌المال خواسته بود فرمود: تو در آتش می‌سوزی. شب‌ها با انبان خرما به خانه نیازمندان می‌رفت و در تقسیم بیت‌المال، سهم همه مردم برابر بود. عدالت ایشان حتی دشمنان را به شگفتی می‌آورد.","pageRef":"صفحه ۱۱۰"},{"type":"answer","title":"رویداد غدیر خم چه بود؟","body":"در بازگشت از حج وداع، پیامبر (ص) به فرمان خدا در محلی به نام غدیر خم فرمان داد و فرمود: «مَنْ كُنْتُ مَوْلَاهُ فَهَذَا عَلِيٌّ مَوْلَاهُ»؛ هر کس من رهبر و سرپرست او هستم، علی (ع) سرپرست اوست. با این سخن، امامت حضرت علی (ع) پس از پیامبر اعلام شد و حاضران با او بیعت کردند.","pageRef":"صفحه ۱۱۵"},{"type":"note","title":"دروازه شهر علم","body":"پیامبر (ص) فرمود: «أَنَا مَدِينَةُ الْعِلْمِ وَ عَلِيٌّ بَابُهَا»؛ من شهر دانش هستم و علی (ع) دروازه آن. شناخت حقایق دین، از راه سرچشمه اهل بیت (ع) ممکن است. امام علی (ع) پیشوای عارفان، الگوی عدالت و شجاعت و یاری‌گر حق در همه روزهای زندگی خود بود."},{"type":"note","title":"سادگی و قناعت در زندگی","body":"امام علی (ع) نان و نمک می‌خورد و جامه خود را وصله می‌زد تا برای یتیمان و مستمندان جای آزاد شود. فرمود: «الْقَنَاعَةُ مَالٌ لَا يَنْفَدُ»؛ قناعت، ثروتی است که هرگز تمام نمی‌شود. کسی که به کم قانع باشد، همیشه بی‌نیاز است و به حرام دست نمی‌یازد."},{"type":"exam","title":"جایگاه امام علی (ع) پس از پیامبر (ص) را توضیح دهید.","body":"امام علی (ع) نخستین امام و جانشین پیامبر (ص) است. در غدیر خم پیامبر (ص) به فرمان خدا امامت او را اعلام کرد. ایشان پرچمدار عدالت، دانش‌مندترین امت و شجاع‌ترین مدافع اسلام بود. نامه‌ها و سخنان ایشان در نهج‌البلاغه، راهنمای همه انسان‌های آزاده است."},{"type":"exam","title":"دو نمونه از رفتار امام علی (ع) در حکومت خود را که نشانه عدالت است، بنویسید.","body":"نمونه نخست: به فرمانده خود که دشمن مسلمان را پیش از دعوت او به اسلام کشته بود، گفت: آیا انسان را کشتی زیرا خدا را نمی‌پرستید؟ و از بیت‌المال به او چیزی نداد. نمونه دوم: برابر قرار دادن سهم همه مردم در بیت‌المال، بدون توجه به جایگاه خانوادگی و قومی آنان."}]},{"number":10,"title":"محبت به اهل بیت","pages":"۱۲۱ تا ۱۳۴","contents":[{"type":"answer","title":"اهل بیت پیامبر (ص) چه کسانی هستند؟","body":"اهل بیت پیامبر (ص) پنج تن آل عبا هستند: پیامبر اکرم (ص)، حضرت فاطمه (س)، امام علی (ع)، امام حسن (ع) و امام حسین (ع) و پس از آنان، امامان معصوم از نسل امام حسین (ع) تا امام زمان (عج). خداوند درباره آنان آیه تطهیر را نازل کرد: «إِنَّمَا يُرِيدُ اللهُ لِيُذْهِبَ عَنْكُمُ الرِّجْسَ أَهْلَ الْبَيْتِ».","pageRef":"صفحه ۱۲۴"},{"type":"answer","title":"چرا باید با اهل بیت (ع) دوست باشیم؟","body":"اهل بیت (ع) پس از پیامبر (ص) راهنمایان دین و معصوم از گناه‌اند. پیامبر (ص) فرمود: «مَنْ أَحَبَّهُمْ فَقَدْ أَحَبَّنِي»؛ هر کس آنان را دوست بدارد، مرا دوست داشته است. محبت آنان ما را به قرآن و سیره پیامبر می‌کشاند و مایه نجات در آخرت است. دوستی واقعی یعنی عمل به راه آنان.","pageRef":"صفحه ۱۲۹"},{"type":"note","title":"آیه تطهیر","body":"خداوند در آیه ۳۳ سوره احزاب می‌فرماید: «إِنَّمَا يُرِيدُ اللهُ لِيُذْهِبَ عَنْكُمُ الرِّجْسَ أَهْلَ الْبَيْتِ وَ يُطَهِّرَكُمْ تَطْهِيراً»؛ خدا فقط می‌خواهد آلودگی را از شما اهل بیت بردارد و شما را پاک گرداند. این آیه درباره پیامبر، فاطمه، علی، حسن و حسین (ع) نازل شد و نشانه عصمت آنان است."},{"type":"note","title":"مودّت در قرآن","body":"خداوند پاداش رسالت پیامبر (ص) را محبت به نزدیکان او قرار داد؛ قرآن می‌فرماید: «قُلْ لَا أَسْأَلُكُمْ عَلَيْهِ أَجْرًا إِلَّا الْمَوَدَّةَ فِي الْقُرْبَى»؛ بگو پاداش رسالت من چیزی جز محبت به نزدیکانم نیست. محبت به اهل بیت (ع) مایه آرامش دل و راهنمای رفتار ما در زندگی است."},{"type":"exam","title":"داستان کساء را کوتاه شرح دهید.","body":"روزی پیامبر (ص) جامه‌ای (عبا) بر خود انداخت؛ سپس فاطمه (س)، علی (ع)، حسن (ع) و حسین (ع) زیر آن در آمدند و آیه تطهیر نازل شد. پیامبر (ص) فرمود: «اللَّهُمَّ هَؤُلَاءِ أَهْلُ بَيْتِي»؛ خدایا اینان اهل بیت من‌اند. این پنج نفر را پنج تن آل عبا یا اهل کساء می‌گویند."},{"type":"exam","title":"سه ویژگی امام حسن (ع) و امام حسین (ع) را بنویسید.","body":"امام حسن (ع) بخشنده و آرام بود و برای حفظ اسلام و جان مردم، صلح را برگزید. امام حسین (ع) در عاشورا با یاران اندک در برابر ظلم ایستاد و با شهادت خود، اسلام را زنده نگه داشت. پیامبر (ص) فرمود: «الْحَسَنُ وَ الْحُسَيْنُ سَيِّدَا شَبَابِ أَهْلِ الْجَنَّةِ»؛ حسن و حسین سالار جوانان اهل بهشت‌اند."}]},{"number":11,"title":"عزت نفس","pages":"۱۳۵ تا ۱۴۸","contents":[{"type":"answer","title":"عزت نفس یعنی چه و چه اثری در زندگی دارد؟","body":"عزت نفس یعنی ارزش گذاشتن به خود و زندگی در حد یک انسان مؤمن. کسی که عزت نفس دارد، گناه نمی‌کند و با باطل سازش نمی‌کند. امام علی (ع) فرمود: «مَنْ عَزَّ نَفْسَهُ عَلَى أَهْلِ الدُّنْيَا أَعَزَّهُ اللهُ فِي الْآخِرَةِ»؛ هر کس نفس خود را گرامی دارد، خدا او را در آخرت گرامی می‌کند.","pageRef":"صفحه ۱۳۸"},{"type":"answer","title":"چرا نباید در زندگی، کورکورانه از دیگران تقلید کرد؟","body":"تقلید کورکورانه عزت نفس را از بین می‌برد؛ زیرا انسان آن‌گاه می‌پوشد و سخن می‌گوید که دیگران پسندیده‌اند نه آنچه خدا می‌پسندد. امام علی (ع) فرمود: «الْعَزِيزُ مَنِ اسْتَعَزَّ بِاللهِ»؛ عزیز کسی است که بزرگی را از خدا بجوید. معیار خوب و بد را از دین می‌گیریم نه از چشم دیگران.","pageRef":"صفحه ۱۴۳"},{"type":"note","title":"ارزش انسان با ایمان و کار نیک","body":"انسان از کارهای خود ارزش می‌گیرد. خدا می‌فرماید: «إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ إِلَّا الَّذِينَ آمَنُوا وَ عَمِلُوا الصَّالِحَاتِ»؛ انسان در زیان است مگر مؤمنان نیکوکار. کسی که خود را بنده خدا و خلیفه او بر زمین می‌داند، کارهای خوار و گناه را نمی‌پذیرد و آبروی خود را با هیچ بهایی نمی‌فروشد."},{"type":"note","title":"گناهان کوچک را کوچک نشماریم","body":"انسان گاهی گناهان کوچک را بی‌اهمیت می‌شمارد، اما پیامبر (ص) فرمود: «إِيَّاكُمْ وَ مُحَاقَاةَ الذُّنُوبِ»؛ از کوچک شمردن گناهان بپرهیزید. گناهان کوچک اگر جمع شوند، جان انسان را نابود می‌کنند. عزت نفس یعنی در کارهای کوچک نیز خود را پاکیزه نگه داریم و حتی به شوخی با نام و آبروی کسی بازی نکنیم."},{"type":"exam","title":"تفاوت عزت نفس و غرور چیست؟","body":"عزت نفس یعنی شناخت ارزش خود به عنوان بنده خدا و دوری از خواری گناه. اما غرور یعنی خودبینی و برتری جویی ناروا؛ انسان مغرور ارزش خود را بیش از حد می‌بیند و دیگران را کوچک می‌شمارد. قرآن می‌فرماید: «إِنَّ اللهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ»؛ خدا هیچ خودپسند مغروری را دوست ندارد. عزت نفس از دین است و غرور از شیطان."},{"type":"exam","title":"سه رفتار نشانه عزت نفس را با توضیح بنویسید.","body":"نخست: کسب مال حلال و پرهیز از حرام، زیرا آبروی انسان از مال مهم‌تر است. دوم: نپذیرفتن اطاعت از غیر خدا، حتی اگر دیگران چنین کنند. سوم: پوزش خواستن پس از اشتباه؛ کسی که خود را گرامی می‌داند، نمی‌گذارد لجبازی او را خوار کند. این رفتارها نشان می‌دهد انسان آبروی خود را از خدا گرفته است."}]},{"number":12,"title":"ما و خانواده","pages":"۱۴۹ تا ۱۶۲","contents":[{"type":"answer","title":"حق پدر و مادر بر فرزندان چیست؟","body":"پدر و مادر پس از خدا و پیامبر بیشترین حق را بر ما دارند. خدا می‌فرماید: «وَ قُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيراً»؛ پروردگارا با آن دو مهر کن، چنان‌که آن دو مرا در کودکی پرورش دادند. احترام به آنان، سخن نرم، کمک در کار خانه و دعا برایشان از راه‌های ادا حق است.","pageRef":"صفحه ۱۵۲"},{"type":"answer","title":"خانواده چه جایگاهی در زندگی انسان دارد؟","body":"خانواده کانون آرامش و پرورش انسان است. قرآن درباره پیوند همسران می‌فرماید: «وَ جَعَلَ بَيْنَكُمْ مَوَدَّةً وَ رَحْمَةً»؛ خدا میان شما محبت و مهر قرار داد. در خانواده سالم، کودک با محبت، نظم و ایمان بزرگ می‌شود. خانه‌ای که در آن مهربانی است، بهترین خانه نزد خداست.","pageRef":"صفحه ۱۵۶"},{"type":"note","title":"نیکی به پدر و مادر","body":"خدا در سوره اسراء فرمان می‌دهد: «وَ بِالْوَالِدَيْنِ إِحْسَاناً»؛ به پدر و مادر نیکی کنید و حتی آه کشیدن در برابر آنان روا نیست: «فَلَا تَقُلْ لَهُمَا أُفٍّ». پیامبر (ص) فرمود: «رِضَا اللهِ فِي رِضَا الْوَالِدَيْنِ»؛ خشنودی خدا در خشنودی پدر و مادر است."},{"type":"note","title":"صله رحم","body":"پیوند با خویشاوندان از دستورهای خداست. پیامبر (ص) فرمود: «مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ وَ يُنْسَأَ فِي أَثَرِهِ فَلْيَصِلْ رَحِمَهُ»؛ هر کس می‌خواهد روزی‌اش فراوان و عمرش دراز شود، به خویشاوندان خود نیکی کند. صله رحم زندگی را پر برکت می‌کند و قطع آن گناهی بزرگ است."},{"type":"exam","title":"دو حدیث درباره نیکی به پدر و مادر بنویسید و ترجمه کنید.","body":"پیامبر (ص) فرمود: «الْجَنَّةُ تَحْتَ أَقْدَامِ الْأُمَّهَاتِ»؛ بهشت زیر پای مادران است؛ یعنی راه بهشت، احترام و خدمت به مادر است. پیامبر (ص) همچنین فرمود: پدر و مادر بهترین دروازه‌های بهشت‌اند؛ پس اگر خواستی، آن‌ها را نگه دار یا از دست بده. خدمت به آنان، عبادت بزرگ است."},{"type":"exam","title":"سه رفتار در خانه را نام ببرید که نشانه ادب و ایمان است.","body":"نخست: سخن نرم و پرهیز از فریاد بر خانواده. دوم: کمک در کارهای خانه و شاد کردن دل پدر و مادر. سوم: احترام به بزرگ‌ترها و مهربانی با کوچک‌ترها. قرآن می‌فرماید: «وَ قُولُوا لِلنَّاسِ حُسْناً»؛ با مردم سخن نیک بگویید و خانواده، نزدیک‌ترین کسان به این دستور الهی‌اند."}]}]},{"title":"کار و فناوری هفتم","subject":"کار و فناوری","description":"راهنمای کامل کارگاه‌های کتاب کار و فناوری هفتم با نکات و سوالات امتحانی","color":"red","icon":"wrench","chapters":[{"number":1,"title":"نمونه‌سازی","pages":"۶ تا ۲۸","contents":[{"type":"answer","title":"مرحله اول نمونه‌سازی: چگونه طرح اولیه ماکت خانه را آماده کنیم؟","body":"ابتدا اندازه‌های واقعی خانه را روی کاغذ بنویسید و مقیاس مناسب مانند یک به صد را انتخاب کنید. سپس شکل دیوارها را با مداد و خط‌کش روی کارتون بکشید و جای در و پنجره را مشخص کنید. در پایان طرح را به معلم نشان دهید و با نظر دوستانتان آن را کامل کنید.","pageRef":"صفحه ۱۰"},{"type":"answer","title":"مرحله برش و مونتاژ: چگونه دیوارهای ماکت را ببریم و به هم بچسبانیم؟","body":"پیش از برش، خط‌های ترسیم‌شده را با خط‌کش فلزی بررسی کنید. کاتر یا قیچی را با دقت در راستای خط حرکت دهید و برای اتصال دیوارها از چسب مایع استفاده کنید. هر دیوار را چند ثانیه نگه دارید تا خوب بچسبد و در پایان عمود بودن گوشه‌ها را با خط‌کش کنترل کنید.","pageRef":"صفحه ۱۵"},{"type":"note","title":"ایمنی در کار با کاتر و قیچی","body":"کاتر باید همیشه در حالت بسته نگه داشته شود و تیغه آن بیش از حد بیرون نیاید. هنگام برش، انگشت نگهدارنده خط‌کش باید پشت تیغه باشد نه جلوی آن. مثال: هنگام بریدن دیوار ماکت، خط‌کش را با دست چپ محکم بگیرید و کاتر را آهسته حرکت دهید."},{"type":"note","title":"مقیاس در نمونه‌سازی","body":"مقیاس یعنی نسبت اندازه نمونه به اندازه واقعی شیء است. مثلاً در مقیاس یک به صد، هر یک سانتی‌متر ماکت برابر یک متر از ساختمان واقعی است. با مقیاس می‌توانیم خانه، پل یا وسیله‌های خیلی بزرگ را در اندازه کوچک و قابل ساخت در کلاس بسازیم."},{"type":"exam","title":"سوال امتحانی: سه ابزار اصلی برای ساخت ماکت کارتونی را نام ببرید و کاربرد هر یک را بنویسید.","body":"پاسخ تشریحی: کاتر برای برش دقیق کارتون در راستای خط‌کش به کار می‌رود. خط‌کش فلزی برای ترسیم خط راست و هدایت کاتر استفاده می‌شود. چسب مایع یا نواری برای اتصال قطعات بریده‌شده به یکدیگر لازم است. ابزارهای کمکی مانند مداد و گیره هم کار ماکت‌سازی را آسان‌تر می‌کنند."},{"type":"exam","title":"سوال امتحانی: مرحله‌های ساخت یک نمونه (ماکت) را به ترتیب بنویسید.","body":"پاسخ تشریحی: مراحل به این ترتیب است: نخست انتخاب موضوع و مطالعه درباره آن، سپس طراحی و ترسیم طرح اولیه با مقیاس مشخص. مرحله بعد برش قطعات از کارتون و سپس مونتاژ و چسباندن قطعات است. در پایان کار با رنگ و جزئیات تکمیل می‌شود و نمونه آماده ارائه به کلاس می‌گردد."}]},{"number":2,"title":"دوخت","pages":"۲۹ تا ۵۰","contents":[{"type":"answer","title":"فعالیت کارگاه: چگونه یک دکمه را درست به لباس بدوزیم؟","body":"نخ را حدود پنجاه سانتی‌متر ببرید و دو سر آن را در سوزن قرار دهید تا نخ دوتا شود. سوزن را از پشت پارچه از یک سوراخ دکمه عبور دهید و از سوراخ مقابل بیرون بیاورید. این کار را چهار تا پنج بار تکرار کنید و در پایان نخ را پشت لباس محکم گره بزنید.","pageRef":"صفحه ۳۵"},{"type":"answer","title":"مرحله‌های وصله‌پینه و ترمیم پارچه پاره‌شده چگونه است؟","body":"ابتدا اندازه پارگی را با متر بگیرید و وصله‌ای یک سانتی‌متر بزرگ‌تر از آن برش بزنید. وصله را زیر پارچه اصلی قرار دهید و با صابون خیاطی دور آن را علامت بزنید. سپس با دوخت کج، لبه‌های وصله را محکم بدوزید و در پایان نخ اضافه را قیچی کنید.","pageRef":"صفحه ۴۰"},{"type":"note","title":"ایمنی در کار با سوزن و قیچی","body":"سوزن همیشه باید در نخ‌کش یا بالشتک سوزن نگهداری شود و هرگز روی لباس گذاشته نشود. هنگام کار سوزن را به دهان نگیرید و پس از پایان کار آن را بشمارید. مثال: اگر سوزنی روی فرش گم شد، برای پیدا کردن آن از آهن‌ربا کمک می‌گیریم."},{"type":"note","title":"انواع دوخت دستی","body":"دوخت رویه برای جمع کردن لبه پارچه‌ها به کار می‌رود و دوخت کج برای وصله‌پینه مناسب است. دوخت قیطانی برای محکم بودن درزها و دوخت دکمه استفاده می‌شود. مثال: برای ترمیم جوراب پاره از دوخت کج و برای دوختن لبه رومیزی از دوخت رویه کمک می‌گیریم."},{"type":"exam","title":"سوال امتحانی: ابزارهای مورد نیاز برای دوخت دستی را نام ببرید.","body":"پاسخ تشریحی: سوزن برای عبور نخ از پارچه، نخ تیپ برای دوختن، قیچی خیاطی برای بریدن پارچه و نخ، متر خیاطی برای اندازه‌گیری، صابون یا گچ خیاطی برای علامت‌گذاری روی پارچه و دکمه و زیپ برای تکمیل کار، از ابزارهای اصلی دوخت دستی هستند."},{"type":"exam","title":"سوال امتحانی: هنگام دوخت دکمه اگر نخ زود پاره شود علت آن چیست و چگونه جلوگیری کنیم؟","body":"پاسخ تشریحی: علت پاره شدن نخ، نازک بودن آن، استفاده از یک لا نخ به جای دو لا یا کشیده شدن زیاد نخ هنگام دوخت است. برای جلوگیری نخ را دوتا کنید، گره سر نخ را محکم ببندید، نخ را نه خیلی سفت و نه شل بکشید و از نخ متناسب با ضخامت پارچه استفاده کنید."}]},{"number":3,"title":"ساخت‌وساز","pages":"۵۱ تا ۷۲","contents":[{"type":"answer","title":"مرحله‌های تهیه ملات ماسه‌سیمان چگونه است؟","body":"ابتدا ماسه و سیمان را به نسبت حدود سه به یک روی سطح تمیز بریزید و با بیل خشک هم بزنید. سپس کم‌کم آب اضافه کنید و هم بزنید تا ملات حالت خمیری پیدا کند. ملات آماده باید نرم باشد که با ماله کشیده شود و بهتر است تا پیش از سفت شدن مصرف شود.","pageRef":"صفحه ۶۰"},{"type":"answer","title":"فعالیت کارگاه: چگونه آجرچینی یک دیوار کوچک را شروع کنیم؟","body":"نخست محل دیوار را با نخ مشخص کنید و یک لایه نازک ملات بکشید. آجر اول را با فشار در ملات بنشانید و با تراز افق بودن آن را کنترل کنید. آجرهای ردیف بعدی را با بند کشیدن ملات جابه‌جا بچینید تا درزها روی هم نیفتند و دیوار استحکام پیدا کند.","pageRef":"صفحه ۶۵"},{"type":"note","title":"ایمنی در کارگاه ساختمان","body":"در کارگاه ساختمانی استفاده از کلاه ایمنی، دستکش و کفش مناسب ضروری است و بدون اجازه معلم نباید به محل خطر نزدیک شد. مصالح را نباید بالای سر دیگران جابه‌جا کرد. مثال: هنگام حمل آجر، بار را سنگین نکنید و مسیر عبور را آزاد نگه دارید."},{"type":"note","title":"مصالح اصلی ساختمان","body":"آجر برای دیوارچینی، سیمان برای چسباندن مصالح، ماسه و شن برای تهیه ملات و بتن و فولاد برای آرمه‌بندی به کار می‌روند. مثال: بتن از ترکیب سیمان، ماسه، شن و آب به دست می‌آید و برای فونداسیون و ستون‌های ساختمان استفاده می‌شود."},{"type":"exam","title":"سوال امتحانی: چرا درزهای آجرها در ردیف‌های مختلف نباید روی هم قرار بگیرند؟","body":"پاسخ تشریحی: اگر درزها روی هم بیفتند، دیوار در امتداد همان درزها ضعیف می‌شود و با کوچک‌ترین نیرو ترک می‌خورد یا شکسته می‌شود. با جابه‌جا چیدن آجرها، نیرو از آجر به آجر منتقل می‌شود و دیوار استحکام بیشتری پیدا می‌کند. به این روش چیدمان یک در میان می‌گویند."},{"type":"exam","title":"سوال امتحانی: کار تراز و شاقول در ساختمان‌سازی چیست؟","body":"پاسخ تشریحی: تراز وسیله‌ای است که افقی بودن سطح مثل ردیف آجرها را نشان می‌دهد و وقتی حباب هوا بین دو خط قرار بگیرد سطح کاملاً افق است. شاقول هم عمودی بودن دیوار را کنترل می‌کند. اگر از این ابزارها استفاده نشود دیوار کج ساخته می‌شود و خطر ریزش دارد."}]},{"number":4,"title":"فلزکاری","pages":"۷۳ تا ۹۲","contents":[{"type":"answer","title":"فعالیت کارگاه: چگونه یک قطعه فلزی را با اره فلزی ببریم؟","body":"قطعه فلز را در گیره محکم ببندید و خط برش را با سوزن خط‌کش علامت بزنید. تیغه اره را طوری ببندید که دندانه‌ها رو به جلو باشند و اره را با دو دست بگیرید. حرکت را بلند و یکنواخت انجام دهید و فقط در حرکت رفتار فشار بدهید تا تیغه نشکند.","pageRef":"صفحه ۸۰"},{"type":"answer","title":"مرحله‌های سوهان‌کاری لبه‌های فلز چگونه است؟","body":"قطعه را در گیره محکم کنید و سوهان مناسب مثل سوهان تخت را انتخاب کنید. سوهان را در حرکت رفتار روی فلز بکشید و در برگشت آن را کمی بلند کنید تا دندانه‌ها دیرتر ساییده شوند. لبه‌های تیز و پرزهای فلز را یکنواخت سوهان بزنید تا به دست کسی آسیب نرسد.","pageRef":"صفحه ۸۵"},{"type":"note","title":"ایمنی در فلزکاری","body":"در فلزکاری حتماً دستکش و عینک ایمنی بزنید و هنگام چکش‌کاری انگشتانتان را از مسیر چکش دور نگه دارید. لبه فلز بریده‌شده بسیار تیز است. مثال: پس از بریدن ورق آهنی، لبه آن را با سوهان نرم می‌کنیم تا هنگام جابه‌جایی دست کسی بریده نشود."},{"type":"note","title":"ابزارهای اصلی فلزکاری","body":"گیره برای محکم نگه داشتن قطعه، اره فلزی برای برش، سوهان برای نرم کردن لبه‌ها، چکش و سندان برای فرم دادن و انبردست برای گرفتن قطعات کوچک به کار می‌روند. مثال: برای ساخت قلاب فلزی، مفتول را با انبردست خم می‌کنیم و سر آن را سوهان می‌زنیم."},{"type":"exam","title":"سوال امتحانی: چرا تیغه اره فلزی باید طوری بسته شود که دندانه‌هایش رو به جلو باشند؟","body":"پاسخ تشریحی: دندانه‌های اره در حرکت رفتار یعنی دور شدن از بدن برش می‌دهند. اگر تیغه برعکس بسته شود، اره در حرکت رفتار نمی‌بُرد و فقط خط را می‌ساید و تیغه زود می‌شکند. بنابراین هنگام بستن تیغه، دندانه‌ها باید در جهت حرکت به جلو رو به بیرون باشند."},{"type":"exam","title":"سوال امتحانی: تفاوت فلزات آهنی و غیرآهنی را با ذکر مثال بنویسید.","body":"پاسخ تشریحی: فلزات آهنی مانند آهن و فولاد آهن دارند، آهن‌ربا آنها را جذب می‌کند و در مجاورت رطوبت زنگ می‌زنند. فلزات غیرآهنی مانند آلومینیم، مس و برنج آهن ندارند و زنگ نمی‌زنند. مثال: قاب پنجره از آلومینیم و سیم برق از مس ساخته می‌شود."}]},{"number":5,"title":"الکترونیک","pages":"۹۳ تا ۱۱۲","contents":[{"type":"answer","title":"مرحله‌های ساخت یک مدار ساده روشنایی چگونه است؟","body":"یک باتری، یک لامپ کوچک، یک سرپیچ و دو تکه سیم رابط آماده کنید. یک سر سیم را به قطب مثبت و سر دیگر را به قطب منفی باتری وصل کنید تا مدار بسته شود و لامپ روشن گردد. سپس یک کلید در مسیر سیم قرار دهید تا روشن و خاموش کردن لامپ با آن انجام شود.","pageRef":"صفحه ۱۰۰"},{"type":"answer","title":"فعالیت کارگاه: چگونه سر سیم‌ها را برای اتصال در مدار آماده کنیم؟","body":"با سیم‌چین حدود یک سانتی‌متر از پوشش رنگی انتهای سیم را جدا کنید و مراقب باشید رشته‌های مسی بریده نشوند. سپس انتهای لخت‌شده را در پایه سرپیچ یا زیر پیچ اتصال قرار دهید و پیچ را با پیچ‌گوشتی محکم ببندید تا اتصال کامل برقرار شود.","pageRef":"صفحه ۱۰۵"},{"type":"note","title":"ایمنی در کار با برق","body":"هرگز مدار را به برق شهری وصل نکنید و آزمایش‌ها فقط با باتری کم‌ولتاژ انجام شود. دست خیس نباید به مدار بزند و باتری نباید اتصال کوتاه شود. مثال: اگر قطب‌های باتری با یک سیم مستقیماً به هم وصل شوند، باتری داغ می‌شود و ممکن است بترکد."},{"type":"note","title":"اجزای مدار الکتریکی","body":"مدار الکتریکی از منبع انرژی مثل باتری، مصرف‌کننده مثل لامپ، سیم رابط برای بستن مسیر و کلید برای قطع و وصل جریان تشکیل شده است. مثال: در چراغ‌قوه باتری انرژی می‌دهد، لامپ نور تولید می‌کند و کلید لغزان مسیر جریان را قطع و وصل می‌کند."},{"type":"exam","title":"سوال امتحانی: تفاوت مدار سری و مدار موازی را بنویسید.","body":"پاسخ تشریحی: در مدار سری فقط یک مسیر برای جریان وجود دارد و با سوختن یا جدا شدن یک لامپ، همه چراغ‌ها خاموش می‌شوند. در مدار موازی چند مسیر مستقل وجود دارد و اگر یک لامپ بسوزد، بقیه روشن می‌مانند. مثال: لامپ‌های روشنایی خانه به صورت موازی بسته می‌شوند."},{"type":"exam","title":"سوال امتحانی: چرا در مدار الکترونیکی از مقاومت استفاده می‌شود؟","body":"پاسخ تشریحی: مقاومت جریان عبوری از مدار را محدود می‌کند تا قطعه‌های حساس مانند نوردهای سوزنی آسیب نبینند. اگر بدون مقاومت ولتاژ زیاد به نورده سوزنی داده شود می‌سوزد. مقدار مقاومت با نوارهای رنگی روی آن مشخص می‌شود و بر حسب اهم سنجیده می‌شود."}]},{"number":6,"title":"کشاورزی","pages":"۱۱۳ تا ۱۳۰","contents":[{"type":"answer","title":"فعالیت کارگاه: چگونه بذر را در گلدان بکاریم؟","body":"گلدان را با خاک خوب و نرم تا دو سانتی‌متر از لبه پر کنید و خاک را کمی فشار دهید. بذرها را با فاصله مناسب روی خاک بگذارید و روی آنها را به اندازه دو برابر قطر بذر خاک بریزید. سپس با آب‌پاش به آرامی آبیاری کنید و گلدان را در جای گرم و روشن قرار دهید.","pageRef":"صفحه ۱۲۰"},{"type":"answer","title":"مرحله‌های تکثیر گیاه با قلمه چگونه است؟","body":"از گیاه سالم یک شاخه جوان و بدون گل ببرید که دو یا سه جوانه دارد. برش را زیر گره شاخه با قیچی تمیز انجام دهید و برگ‌های پایینی را جدا کنید. سپس قلمه را در خاک نرم یا آب قرار دهید و خاک را مرطوب نگه دارید تا پس از چند هفته ریشه دهد.","pageRef":"صفحه ۱۲۵"},{"type":"note","title":"خاک مناسب برای کاشت","body":"خاک خوب باید نرم، نفوذپذیر و دارای مواد غذایی باشد و آب را نگه دارد اما لاچه نکند. مخلوط خاک باغچه با ماسه و کود طبیعی برای گلدان مناسب است. مثال: برای کاشت آفتابگردان، خاک سبک و آفتاب‌گیر انتخاب می‌شود تا ریشه به راحتی رشد کند."},{"type":"note","title":"ایمنی و بهداشت در کشاورزی","body":"هنگام کار با خاک، کود و ابزار تیز حتماً دستکش بزنید و پس از پایان کار دست‌ها را با آب و صابون بشویید. ابزار برنده را پس از استفاده در جای امن نگه دارید. مثال: قیچی باغبانی را فقط هنگام بریدن شاخه باز کنید و سر آن را رو به پایین حمل کنید."},{"type":"exam","title":"سوال امتحانی: سه عامل اصلی لازم برای جوانه زدن بذر را نام ببرید و توضیح دهید.","body":"پاسخ تشریحی: بذر برای جوانه زدن به آب، هوا و درجه حرارت مناسب نیاز دارد. آب پوسته بذر را نرم می‌کند و جوانه زدن را آغاز می‌کند. هوا برای تنفس بذر لازم است و گرمای مناسب سرعت رشد را زیاد می‌کند. نبود هر یک از این عوامل جوانه زدن را متوقف می‌کند."},{"type":"exam","title":"سوال امتحانی: چرا باید بین گیاهان در باغچه فاصله مناسب بگذاریم؟","body":"پاسخ تشریحی: فاصله مناسب باعث می‌شود ریشه هر گیاه آب و مواد غذایی کافی از خاک بگیرد و شاخه‌ها نور آفتاب را به خوبی دریافت کنند. اگر گیاهان خیلی نزدیک باشند به مواد غذایی رقابت می‌کنند، ضعیف می‌شوند و بیماری‌ها به راحتی بین آنها پخش می‌شود."}]},{"number":7,"title":"صنعت","pages":"۱۳۱ تا ۱۵۰","contents":[{"type":"answer","title":"مرحله‌های طراحی یک محصول ساده در کارگاه صنعت چگونه است؟","body":"ابتدا نیاز یا مسئله را مشخص کنید، مثلاً جاگوشی دیواری برای مرتب کردن وسایل. سپس چند طرح روی کاغذ بکشید و بهترین را با نظر گروه انتخاب کنید. در ادامه مواد اولیه و اندازه‌ها را تعیین کنید، نمونه اولیه را بسازید، آن را امتحان کنید و نقایص آن را برطرف نمایید.","pageRef":"صفحه ۱۴۰"},{"type":"answer","title":"فعالیت کارگاه: برای بازدید از یک کارگاه تولیدی چه چیزهایی را یادداشت کنیم؟","body":"نام محصول و کاربرد آن، مواد اولیه، مرحله‌های تبدیل مواد به محصول و ماشین‌آلات هر مرحله را یادداشت کنید. تعداد کارگران و تقسیم کار بین آنها و نحوه بسته‌بندی و انبار کردن محصول را هم بنویسید. در پایان سوال‌های خود را از مسئول کارگاه بپرسید.","pageRef":"صفحه ۱۴۵"},{"type":"note","title":"خط تولید و تقسیم کار","body":"در خط تولید، ساخت محصول به چند مرحله ساده تقسیم می‌شود و هر نفر یا دستگاه یک مرحله را انجام می‌دهد. این روش سرعت و کیفیت را زیاد و هزینه را کم می‌کند. مثال: در کارخانه نوشیدنی، شستن بطری، پر کردن، درب‌زدن و برچسب‌زدن هر کدام ایستگاه جداگانه‌ای است."},{"type":"note","title":"خلاقیت، اختراع و ثبت آن","body":"خلاقیت یعنی پیدا کردن راه تازه برای حل مسئله و اختراع، محصول یا روش جدیدی است که ساخته می‌شود. مخترع می‌تواند اختراع خود را در اداره ثبت اختراع به نام خود ثبت کند تا حقوق او حفظ شود. مثال: چسب زخم و مدادتراش از اختراع‌های ساده اما کاربردی هستند."},{"type":"exam","title":"سوال امتحانی: تفاوت تولید دستی و تولید کارخانه‌ای را بنویسید.","body":"پاسخ تشریحی: در تولید دستی، یک نفر یا گروه کوچک محصول را با ابزار ساده و یک‌به‌یک می‌سازد؛ زمان بیشتری می‌برد اما محصول خاص و سفارشی است. در تولید کارخانه‌ای، ماشین‌آلات و خط تولید تعداد زیادی محصول یکسان را سریع‌تر و ارزان‌تر می‌سازند. مثال: سفال دست‌ساز در برابر لیوان کارخانه‌ای."},{"type":"exam","title":"سوال امتحانی: بسته‌بندی چه فایده‌هایی برای محصول دارد؟","body":"پاسخ تشریحی: بسته‌بندی محصول را از کثیفی، رطوبت، ضربه و شکستن محافظت می‌کند و حمل و جابه‌جایی آن را آسان می‌کند. اطلاعات لازم مثل وزن، تاریخ تولید و انقضا و طرز استفاده روی بسته‌بندی نوشته می‌شود. بسته‌بندی زیبا هم مشتری را جذب می‌کند و به فروش کمک می‌کند."}]}]}]},{"number":8,"name":"پایه هشتم","subtitle":"تنظیم دانش و مهارت","books":[{"title":"ریاضی هشتم","subject":"ریاضی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه فصل‌های کتاب ریاضی هشتم","color":"blue","icon":"calculator","chapters":[{"number":1,"title":"اعداد گویا","pages":"۸ تا ۳۰","contents":[{"type":"answer","title":"حاصل عبارت ۲/۳ + ۳/۴ − ۱/۶ را به‌دست آورید.","body":"مخرج مشترک کسرها ۱۲ است.\n۲/۳ = ۸/۱۲ و ۳/۴ = ۹/۱۲ و ۱/۶ = ۲/۱۲.\nپس حاصل برابر است با (۸ + ۹ − ۲) تقسیم بر ۱۲ یعنی ۱۵/۱۲.\nبا ساده کردن بر ۳: ۱۵/۱۲ = ۵/۴.\nبه صورت عدد اعشاری: ۵/۴ = ۱٫۲۵.\nبنابراین حاصل نهایی ۵/۴ یا ۱٫۲۵ است.","pageRef":"صفحه ۱۲"},{"type":"answer","title":"حاصل ۲/۵ ÷ ۴/۱۵ را حساب کنید.","body":"در تقسیم کسرها، کسر دوم را معکوس کرده و ضرب می‌کنیم.\n۲/۵ ÷ ۴/۱۵ = ۲/۵ × ۱۵/۴.\nصورت‌ها: ۲ × ۱۵ = ۳۰ و مخرج‌ها: ۵ × ۴ = ۲۰ پس کسر ۳۰/۲۰ به‌دست می‌آید.\nساده می‌کنیم: ۳۰/۲۰ = ۳/۲.\nبه صورت اعشاری ۳/۲ = ۱٫۵ است.\nبنابراین حاصل تقسیم برابر ۳/۲ یعنی ۱٫۵ است.","pageRef":"صفحه ۱۶"},{"type":"note","title":"عدد گویا چیست","body":"عدد گویا عددی است که بتوان آن را به صورت کسری با صورت و مخرج صحیح نوشت و مخرج آن صفر نباشد.\nهمه عددهای صحیح، اعشاری محدود و اعشاری متناوب گویا هستند.\nمثال: ۰٫۷۵ = ۳/۴ و عدد −۵ گویاست چون −۵/۱ است و ۰٫۳۳۳... = ۱/۳."},{"type":"note","title":"مقایسه اعداد گویا","body":"برای مقایسه دو عدد گویا می‌توان هر دو را با مخرج یکسان نوشت یا به عدد اعشاری تبدیل کرد.\nمثال: کدام بزرگ‌تر است، ۳/۵ یا ۵/۸؟\n۳/۵ = ۰٫۶ و ۵/۸ = ۰٫۶۲۵ است.\nچون ۰٫۶۲۵ بزرگ‌تر از ۰٫۶ است، پس ۵/۸ بزرگ‌تر از ۳/۵ است."},{"type":"exam","title":"حاصل عبارت ۱٫۲ + ۳/۴ − ۱/۲ را به صورت یک کسر ساده به‌دست آورید.","body":"ابتدا ۱٫۲ را کسر می‌کنیم: ۱٫۲ = ۶/۵.\nمخرج مشترک ۵ و ۴ و ۲ برابر ۲۰ است.\n۶/۵ = ۲۴/۲۰ و ۳/۴ = ۱۵/۲۰ و ۱/۲ = ۱۰/۲۰.\nحاصل: (۲۴ + ۱۵ − ۱۰) تقسیم بر ۲۰ یعنی ۲۹/۲۰.\nپس جواب ۲۹/۲۰ است که به صورت اعشاری برابر ۱٫۴۵ می‌شود."},{"type":"exam","title":"طول جاده‌ای ۱۲ کیلومتر است. اگر ۳/۸ آن آسفالت شده باشد، چند کیلومتر آسفالت شده و چند کیلومتر باقی مانده است؟","body":"بخش آسفالت‌شده: ۱۲ × ۳/۸ = ۳۶/۸ = ۴٫۵ کیلومتر.\nکل جاده ۸/۸ است و ۳/۸ آن انجام شده، پس ۵/۸ آن باقی مانده است.\nبخش باقی‌مانده: ۱۲ × ۵/۸ = ۶۰/۸ = ۷٫۵ کیلومتر.\nکنترل: ۴٫۵ + ۷٫۵ = ۱۲ کیلومتر که برابر کل طول جاده است."}]},{"number":2,"title":"توان و ریشه","pages":"۳۲ تا ۵۲","contents":[{"type":"answer","title":"حاصل عبارت ۲ به توان ۳ ضربدر ۲ به توان ۵ تقسیم بر ۲ به توان ۴ را به‌دست آورید.","body":"در ضرب توان‌های هم‌پایه، توان‌ها جمع می‌شوند: ۲ به توان ۳ ضرب در ۲ به توان ۵ می‌شود ۲ به توان ۸.\nدر تقسیم توان‌های هم‌پایه، توان‌ها تفریق می‌شوند: ۲ به توان ۸ تقسیم بر ۲ به توان ۴ می‌شود ۲ به توان ۴.\n۲ به توان ۴ برابر است با ۲ × ۲ × ۲ × ۲ = ۱۶.\nپس حاصل نهایی برابر ۱۶ است.","pageRef":"صفحه ۳۸"},{"type":"answer","title":"زمینی مربع‌شکل به مساحت ۳۲۴ متر مربع داریم. طول ضلع آن چند متر است؟","body":"مساحت مربع = ضلع × ضلع است، پس ضلع = جذر ۳۲۴.\nعدد ۳۲۴ را تجزیه می‌کنیم: ۳۲۴ = ۴ × ۸۱.\nجذر ۴ برابر ۲ و جذر ۸۱ برابر ۹ است.\nپس جذر ۳۲۴ = ۲ × ۹ = ۱۸.\nیعنی ضلع زمین ۱۸ متر است.\nکنترل: ۱۸ × ۱۸ = ۳۲۴ که مساحت داده‌شده است.","pageRef":"صفحه ۴۶"},{"type":"note","title":"قوانین مهم توان‌ها","body":"ضرب هم‌پایه: توان‌ها جمع می‌شوند، مثل ۳ به توان ۲ ضرب در ۳ به توان ۴ برابر ۳ به توان ۶.\nتقسیم هم‌پایه: توان‌ها تفریق می‌شوند.\nتوان صفر هر عدد ناصفر برابر ۱ است، مثل ۷ به توان صفر = ۱.\nتوانِ توان: توان‌ها ضرب می‌شوند، مثل ۲ به توان ۲ داخل پرانتز به توان ۳ برابر ۲ به توان ۶ یعنی ۶۴."},{"type":"note","title":"عدد گنگ و جذر","body":"عدد گنگ عددی است که نتوان آن را به صورت کسر با صورت و مخرج صحیح نوشت.\nجذر عددهای مربع کامل مثل ۹ و ۱۶ و ۲۵ گویاست: جذر ۹ = ۳ و جذر ۲۵ = ۵.\nاما جذر ۲ گنگ است و نمی‌توان آن را دقیق با کسر نوشت؛ تقریب آن ۱٫۴۱۴ است.\nهندسه‌دانان قدیم هنگام محاسبه قطر مربع با این عدد مواجه شدند."},{"type":"exam","title":"حاصل عبارت ۵ به توان ۲ ضربدر ۵ به توان ۳ تقسیم بر ۵ به توان ۳ را حساب کنید.","body":"ابتدا ضرب: ۵ به توان ۲ ضرب در ۵ به توان ۳ می‌شود ۵ به توان ۵.\nسپس تقسیم: ۵ به توان ۵ تقسیم بر ۵ به توان ۳ می‌شود ۵ به توان ۲.\n۵ به توان ۲ = ۵ × ۵ = ۲۵.\nپس حاصل نهایی ۲۵ است.\nراه دوم: می‌توان گفت ۵ به توان ۳ از صورت و مخرج ساده می‌شود و فقط ۵ به توان ۲ باقی می‌ماند."},{"type":"exam","title":"مربعی به مساحت ۱۶۹ سانتی‌متر مربع داریم. محیط آن چند سانتی‌متر است؟","body":"ضلع مربع جذر مساحت آن است.\nچون ۱۳ × ۱۳ = ۱۶۹ پس ضلع مربع ۱۳ سانتی‌متر است.\nمحیط مربع = ۴ × ضلع.\nمحیط = ۴ × ۱۳ = ۵۲ سانتی‌متر.\nپس محیط این مربع ۵۲ سانتی‌متر می‌شود."}]},{"number":3,"title":"جبر و معادله","pages":"۵۴ تا ۷۶","contents":[{"type":"answer","title":"معادله ۳x − ۵ = ۱۰ را حل کنید.","body":"هدف این است که x تنها در یک طرف بماند.\nگام ۱: به هر دو طرف ۵ اضافه می‌کنیم: ۳x = ۱۰ + ۵ یعنی ۳x = ۱۵.\nگام ۲: هر دو طرف را بر ۳ تقسیم می‌کنیم: x = ۱۵ ÷ ۳ یعنی x = ۵.\nگام ۳ بررسی: ۳ × ۵ − ۵ = ۱۵ − ۵ = ۱۰ که با طرف دوم برابر است.\nپس جواب معادله x = ۵ است.","pageRef":"صفحه ۶۰"},{"type":"answer","title":"معادله ۲(x + ۳) = ۱۴ را حل کنید.","body":"گام ۱: با خاصیت توزیعی پرانتز را باز می‌کنیم: ۲x + ۶ = ۱۴.\nگام ۲: از هر دو طرف ۶ کم می‌کنیم: ۲x = ۸.\nگام ۳: هر دو طرف را بر ۲ تقسیم می‌کنیم: x = ۴.\nبررسی: ۲ × (۴ + ۳) = ۲ × ۷ = ۱۴ که با طرف دوم برابر است.\nپس جواب معادله x = ۴ است.","pageRef":"صفحه ۶۴"},{"type":"note","title":"عبارت جبری و ساده‌سازی","body":"عبارت جبری از متغیر، ضریب و عدد ثابت ساخته می‌شود.\nجمله‌های مشابه را می‌توان با هم جمع کرد؛ مثلاً ۳x + ۲x − ۴ می‌شود ۵x − ۴.\nضرب عدد در پرانتز با خاصیت توزیعی انجام می‌شود: ۳(x + ۲) = ۳x + ۶.\nمقدار عبارت را با جای‌گذاری عدد به‌جای متغیر می‌یابیم."},{"type":"note","title":"اصل تعادل در معادله","body":"معادله مثل ترازو است؛ اگر عملی روی یک طرف انجام دهیم، باید همان عمل را روی طرف دیگر هم انجام دهیم تا تعادل حفظ شود.\nمثال: x + ۷ = ۱۲؛ از هر دو طرف ۷ کم می‌کنیم و x = ۵ به‌دست می‌آید.\nبررسی: ۵ + ۷ = ۱۲ درست است."},{"type":"exam","title":"معادله ۴x + ۹ = ۲x + ۲۱ را حل کنید.","body":"متغیرها را یک طرف و اعداد را طرف دیگر می‌بریم.\nاز هر دو طرف ۲x کم می‌کنیم: ۲x + ۹ = ۲۱.\nاز هر دو طرف ۹ کم می‌کنیم: ۲x = ۱۲.\nهر دو طرف را بر ۲ تقسیم می‌کنیم: x = ۶.\nبررسی: ۴ × ۶ + ۹ = ۳۳ و ۲ × ۶ + ۲۱ = ۳۳؛ دو طرف برابرند.\nپس جواب معادله x = ۶ است."},{"type":"exam","title":"حاصل‌ضرب یک عدد در ۳ و افزایش ۸ واحد آن برابر ۲۶ است. آن عدد را بیابید.","body":"عدد مجهول را x می‌نامیم.\nحاصل‌ضرب در ۳ یعنی ۳x و افزایش ۸ واحد یعنی ۳x + ۸.\nمعادله: ۳x + ۸ = ۲۶.\nاز هر دو طرف ۸ کم می‌کنیم: ۳x = ۱۸.\nهر دو طرف را بر ۳ تقسیم می‌کنیم: x = ۶.\nبررسی: ۳ × ۶ + ۸ = ۱۸ + ۸ = ۲۶ درست است. پس آن عدد ۶ است."}]},{"number":4,"title":"اندازه گیری و تقریب","pages":"۷۸ تا ۹۶","contents":[{"type":"answer","title":"سه چهارم کیلومتر چند متر است؟","body":"هر کیلومتر برابر ۱۰۰۰ متر است.\nپس ۳/۴ کیلومتر = ۳/۴ × ۱۰۰۰ متر.\nمحاسبه: ۱۰۰۰ ÷ ۴ = ۲۵۰ و ۲۵۰ × ۳ = ۷۵۰.\nبنابراین ۳/۴ کیلومتر برابر ۷۵۰ متر است.\nهمین روش برای هر تبدیل واحدی کاربرد دارد: عدد را در ضریب تبدیل ضرب می‌کنیم.","pageRef":"صفحه ۸۲"},{"type":"answer","title":"عدد ۷٫۲۴۶ را تا یک رقم اعشار و تا عدد صحیح تقریب بزنید.","body":"برای تقریب تا یک رقم اعشار، رقم دوم اعشار را می‌بینیم.\nدر ۷٫۲۴۶ رقم دوم اعشار ۴ است و چون کمتر از ۵ است، رقم اول بدون تغییر می‌ماند.\nپس تقریب تا یک رقم اعشار: ۷٫۲.\nبرای تقریب تا عدد صحیح، رقم اول اعشار را می‌بینیم که ۲ است و کمتر از ۵.\nپس تقریب تا عدد صحیح برابر ۷ است.","pageRef":"صفحه ۸۸"},{"type":"note","title":"تبدیل واحدهای طول و جرم","body":"۱ کیلومتر = ۱۰۰۰ متر، ۱ متر = ۱۰۰ سانتی‌متر و ۱ سانتی‌متر = ۱۰ میلی‌متر است.\nدر جرم: ۱ کیلوگرم = ۱۰۰۰ گرم.\nمثال: ۲٫۴ کیلوگرم برابر ۲۴۰۰ گرم و ۳٫۵ متر برابر ۳۵۰ سانتی‌متر است.\nبرای تبدیل به واحد کوچک‌تر عدد را در ضریب تبدیل ضرب می‌کنیم و برای واحد بزرگ‌تر تقسیم."},{"type":"note","title":"تقریب تا یک رقم اعشار","body":"برای تقریب زدن، رقم بعدی را نگاه می‌کنیم؛ اگر ۵ یا بیشتر باشد، رقم قبلی یک واحد زیاد می‌شود و اگر کمتر از ۵ باشد بدون تغییر می‌ماند.\nمثال: ۳٫۴۶ تا یک رقم اعشار می‌شود ۳٫۵ چون رقم دوم ۶ است.\nو ۴٫۲۳ می‌شود ۴٫۲ چون رقم دوم ۳ است."},{"type":"exam","title":"۱٫۷۵ ساعت چند دقیقه است؟","body":"هر ساعت ۶۰ دقیقه است.\nپس ۱٫۷۵ ساعت = ۱٫۷۵ × ۶۰ دقیقه.\nمحاسبه: ۱٫۷۵ × ۶۰ = ۱۰۵ دقیقه.\nمی‌توانیم بنویسیم ۱ ساعت = ۶۰ دقیقه و ۰٫۷۵ ساعت = ۴۵ دقیقه که جمعشان ۱۰۵ دقیقه می‌شود.\nپس جواب ۱۰۵ دقیقه است."},{"type":"exam","title":"زمینی مستطیل‌شکل به طول ۳٫۶ متر و عرض ۲٫۵ متر است. مساحت آن چند متر مربع است؟","body":"مساحت مستطیل = طول × عرض.\n۳٫۶ × ۲٫۵: ابتدا ۳۶ × ۲۵ = ۹۰۰ و چون روی هم دو رقم اعشار داریم، ممیز را دو خانه به چپ می‌بریم.\nپس ۳٫۶ × ۲٫۵ = ۹ متر مربع.\nکنترل: ۳٫۶ × ۲ = ۷٫۲ و ۳٫۶ × ۰٫۵ = ۱٫۸ و ۷٫۲ + ۱٫۸ = ۹ درست است."}]},{"number":5,"title":"تابع و کاربرد آن","pages":"۹۸ تا ۱۱۲","contents":[{"type":"answer","title":"در تابع y = ۲x + ۱ مقدار y را برای x = ۰ و x = ۱ و x = ۳ حساب کنید.","body":"به‌جای x هر عدد را جای‌گذاری می‌کنیم.\nاگر x = ۰: y = ۲ × ۰ + ۱ = ۱.\nاگر x = ۱: y = ۲ × ۱ + ۱ = ۳.\nاگر x = ۳: y = ۲ × ۳ + ۱ = ۷.\nپس جفت‌های مرتب (۰، ۱) و (۱، ۳) و (۳، ۷) روی نمودار این تابع قرار می‌گیرند.","pageRef":"صفحه ۱۰۲"},{"type":"answer","title":"قاعده تابعی جدول زیر را پیدا کنید: ورودی ۱ خروجی ۵، ورودی ۲ خروجی ۹، ورودی ۳ خروجی ۱۳. خروجی برای ورودی ۵ چقدر است؟","body":"می‌بینیم با هر یک واحد افزایش ورودی، خروجی ۴ واحد زیاد می‌شود، پس ضریب x برابر ۴ است.\nبا نقطه (۱، ۵): ۵ = ۴ × ۱ + ثابت، پس ثابت برابر ۱ است.\nقاعده تابع: y = ۴x + ۱.\nبررسی: برای x = ۲ خروجی ۹ و برای x = ۳ خروجی ۱۳ درست درمی‌آید.\nبرای x = ۵: y = ۴ × ۵ + ۱ = ۲۱.","pageRef":"صفحه ۱۰۶"},{"type":"note","title":"تابع یعنی چه","body":"تابع قانونی است که به هر ورودی دقیقاً یک خروجی نسبت می‌دهد.\nمثال: در تابع y = x + ۲ به ورودی ۳ خروجی ۵ و به ورودی ۱۰ خروجی ۱۲ می‌رسد.\nهر ورودی فقط یک خروجی دارد؛ به همین دلیل تابع را مثل دستگاهی ورودی و خروجی تصور می‌کنند."},{"type":"note","title":"نمودار تابع خطی","body":"برای رسم نمودار تابع، چند جفت مرتب می‌یابیم، نقاط را در دستگاه مختصات علامت می‌زنیم و به هم وصل می‌کنیم.\nنمودار تابع خطی همیشه یک خط راست است.\nمثال: تابع y = x از نقاط (۰، ۰) و (۱، ۱) و (۲، ۲) می‌گذرد."},{"type":"exam","title":"در تابع y = ۳x − ۲ اگر y = ۱۰ باشد، مقدار x چقدر است؟","body":"معادله ۳x − ۲ = ۱۰ را حل می‌کنیم.\nبه هر دو طرف ۲ اضافه می‌کنیم: ۳x = ۱۲.\nهر دو طرف را بر ۳ تقسیم می‌کنیم: x = ۴.\nبررسی: ۳ × ۴ − ۲ = ۱۲ − ۲ = ۱۰ درست است.\nپس برای خروجی ۱۰، ورودی تابع برابر ۴ است."},{"type":"exam","title":"کرایه تاکسی‌ای ۵۰۰۰ تومان پایه و به‌ازای هر کیلومتر ۲۰۰۰ تومان است. رابطه هزینه و مسافت را بنویسید و هزینه ۸ کیلومتر مسافت را حساب کنید.","body":"مسافت را x و هزینه را y می‌نامیم.\nقاعده تابع: y = ۲۰۰۰x + ۵۰۰۰.\nبرای x = ۸: y = ۲۰۰۰ × ۸ + ۵۰۰۰.\n۲۰۰۰ × ۸ = ۱۶۰۰۰ و ۱۶۰۰۰ + ۵۰۰۰ = ۲۱۰۰۰.\nپس هزینه ۸ کیلومتر مسافت ۲۱۰۰۰ تومان است."}]},{"number":6,"title":"هندسه و استدلال","pages":"۱۱۴ تا ۱۴۴","contents":[{"type":"answer","title":"زاویه مرکزی رو به یک کمان ۸۰ درجه است. اندازه زاویه محاطی رو به همان کمان چقدر است؟","body":"طبق قضیه کتاب، اندازه هر زاویه محاطی برابر نصف زاویه مرکزی رو به همان کمان است.\nزاویه محاطی = ۸۰ ÷ ۲ = ۴۰ درجه.\nبرعکس، اگر زاویه محاطی ۴۰ درجه باشد، زاویه مرکزی رو به همان کمان ۸۰ درجه است.\nپس جواب ۴۰ درجه است.","pageRef":"صفحه ۱۱۸"},{"type":"answer","title":"در مثلث قائم‌الزاویه‌ای طول دو ساق ۶ و ۸ سانتی‌متر است. طول وتر را بیابید.","body":"طبق قضیه فیثاغورس، مربع وتر برابر مجموع مربع‌های دو ساق است.\nوتر به توان ۲ = ۶ به توان ۲ + ۸ به توان ۲.\n۶ به توان ۲ = ۳۶ و ۸ به توان ۲ = ۶۴.\n۳۶ + ۶۴ = ۱۰۰ پس وتر به توان ۲ = ۱۰۰.\nوتر = جذر ۱۰۰ = ۱۰.\nپس طول وتر ۱۰ سانتی‌متر است.","pageRef":"صفحه ۱۲۴"},{"type":"note","title":"قضیه فیثاغورس","body":"در هر مثلث قائم‌الزاویه، مربع وتر برابر مجموع مربع‌های دو ساق است.\nسه‌گانه مشهور ۳ و ۴ و ۵ نمونه‌ای از این قضیه است: ۹ + ۱۶ = ۲۵.\nبرای اطمینان از قائم‌الزاویه بودن مثلث کافی است این رابطه بین ضلع‌های آن برقرار باشد."},{"type":"note","title":"مجموع زاویه‌های چندضلعی","body":"مجموع زاویه‌های داخلی هر چندضلعی از رابطه (تعداد ضلع‌ها − ۲) × ۱۸۰ درجه به‌دست می‌آید.\nمثلث: (۳ − ۲) × ۱۸۰ = ۱۸۰ درجه.\nچهارضلعی: (۴ − ۲) × ۱۸۰ = ۳۶۰ درجه.\nمثال: پنج‌ضلعی (۵ − ۲) × ۱۸۰ = ۵۴۰ درجه است."},{"type":"exam","title":"نردبانی به طول ۱۳ متر به دیوار تکیه داده و پایه آن ۵ متر از دیوار فاصله دارد. ارتفاعی که نردبان به دیوار می‌رسد چند متر است؟","body":"نردبان وتر مثلث قائم‌الزاویه است و فاصله پایه از دیوار یکی از ساق‌ها.\nارتفاع به توان ۲ = ۱۳ به توان ۲ − ۵ به توان ۲.\n۱۳ به توان ۲ = ۱۶۹ و ۵ به توان ۲ = ۲۵.\n۱۶۹ − ۲۵ = ۱۴۴ پس ارتفاع = جذر ۱۴۴ = ۱۲ متر.\nپس نردبان ۱۲ متری دیوار به آن می‌رسد."},{"type":"exam","title":"در یک چهارضلعی سه زاویه آن ۹۰ و ۱۱۵ و ۸۵ درجه است. اندازه زاویه چهارم چقدر است؟","body":"مجموع زاویه‌های داخلی چهارضلعی ۳۶۰ درجه است.\nجمع سه زاویه داده‌شده: ۹۰ + ۱۱۵ + ۸۵ = ۲۹۰ درجه.\nزاویه چهارم = ۳۶۰ − ۲۹۰ = ۷۰ درجه.\nبررسی: ۹۰ + ۱۱۵ + ۸۵ + ۷۰ = ۳۶۰ درست است.\nپس زاویه چهارم ۷۰ درجه است."}]},{"number":7,"title":"آمار و احتمال","pages":"۱۴۶ تا ۱۶۶","contents":[{"type":"answer","title":"میانگین نمره‌های ۱۲ و ۱۵ و ۱۸ و ۱۷ و ۱۳ را حساب کنید.","body":"میانگین برابر حاصل‌جمع داده‌ها تقسیم بر تعداد آن‌ها است.\nجمع نمره‌ها: ۱۲ + ۱۵ = ۲۷ و ۲۷ + ۱۸ = ۴۵ و ۴۵ + ۱۷ = ۶۲ و ۶۲ + ۱۳ = ۷۵.\nتعداد داده‌ها ۵ عدد است.\nمیانگین = ۷۵ ÷ ۵ = ۱۵.\nپس میانگین این نمره‌ها ۱۵ است.","pageRef":"صفحه ۱۵۰"},{"type":"answer","title":"یک تاس را یک بار می‌ریزیم. احتمال آمدن عدد زوج چقدر است؟","body":"حالت‌های ممکن: عددهای ۱ و ۲ و ۳ و ۴ و ۵ و ۶ یعنی ۶ حالت.\nحالت‌های مطلوب: عددهای زوج یعنی ۲ و ۴ و ۶ یعنی ۳ حالت.\nاحتمال = ۳ ÷ ۶ = ۳/۶ = ۱/۲.\nپس احتمال آمدن عدد زوج ۱/۲ یعنی ۰٫۵ یا ۵۰ درصد است.","pageRef":"صفحه ۱۶۰"},{"type":"note","title":"میانگین، میانه و نما","body":"میانگین از تقسیم جمع داده‌ها بر تعداد آن‌ها به‌دست می‌آید.\nمیانه داده وسط پس از مرتب‌کردن است و نما داده‌ای است که بیشترین تکرار را دارد.\nمثال در داده‌های ۲ و ۴ و ۴ و ۷ و ۸: نما ۴ و میانه ۴ و میانگین ۲۵ ÷ ۵ یعنی ۵ است."},{"type":"note","title":"احتمال و بازه آن","body":"احتمال یک پیشامد از تقسیم تعداد حالات مطلوب بر تعداد کل حالات ممکن به‌دست می‌آید.\nاحتمال همیشه عددی بین ۰ و ۱ است؛ احتمال ۰ یعنی غیرممکن و احتمال ۱ یعنی حتمی.\nمثال: در پرتاب سکه احتمال رو آمدن ۱/۲ است."},{"type":"exam","title":"میانه داده‌های ۳ و ۷ و ۹ و ۱۲ و ۱۴ و ۱۵ را به‌دست آورید.","body":"داده‌ها مرتب هستند: ۳ و ۷ و ۹ و ۱۲ و ۱۴ و ۱۵.\nتعداد داده‌ها زوج است، پس میانه میانگین دو داده وسط است.\nدو داده وسط ۹ و ۱۲ هستند.\nمیانه = (۹ + ۱۲) ÷ ۲ = ۲۱ ÷ ۲ = ۱۰٫۵.\nپس میانه این داده‌ها ۱۰٫۵ است."},{"type":"exam","title":"کیسه‌ای ۴ گوی قرمز و ۶ گوی آبی دارد. احتمال بیرون آمدن گوی قرمز چقدر است؟","body":"کل گوی‌ها: ۴ + ۶ = ۱۰ گوی.\nحالات مطلوب: ۴ گوی قرمز.\nاحتمال = ۴ ÷ ۱۰ = ۴/۱۰ = ۲/۵.\nبه صورت اعشاری ۲/۵ = ۰٫۴ یعنی ۴۰ درصد.\nپس احتمال کشیدن گوی قرمز ۲/۵ است."}]}]},{"title":"علوم تجربی هشتم","subject":"علوم تجربی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه فصل‌های کتاب علوم تجربی هشتم","color":"green","icon":"flask","chapters":[{"number":1,"title":"زیست و پویایی","pages":"۸ تا ۲۴","contents":[{"type":"answer","title":"چه ویژگی‌هایی برای تشخیص موجود زنده از غیر زنده به کار می‌رود؟","body":"موجودات زنده ویژگی‌هایی دارند که آن‌ها را از اجسام بی‌جان جدا می‌کند:\nسازمان‌یافتگی یعنی ساخته شدن از سلول با اجزای هماهنگ، سوخت‌وساز یعنی گرفتن ماده و انرژی از محیط و دگرگون کردن آن. رشد و تولیدمثل دارند، به محرک پاسخ می‌دهند و محیط درونی‌شان تنظیم می‌شود.\nمثال: سنگ رشد نمی‌کند اما سوسک همه این ویژگی‌ها را دارد؛ پس زنده است.","pageRef":"صفحه ۱۲"},{"type":"answer","title":"چرا سوخت‌وساز مشخصه مشترک همه موجودات زنده است؟","body":"هر موجود زنده برای زنده ماندن به انرژی نیاز دارد؛ گیاهان با غذاسازی در نور خورشید غذا می‌سازند و جانوران غذا می‌خورند.\nاین غذا در سلول‌ها دگرگون می‌شود و انرژی و ماده لازم برای رشد، تعمیر و تنظیم پیکر را فراهم می‌کند.\nاین فرایند در همه جانداران از باکتری تا نهنگ و حتی در خواب ادامه دارد؛ پس مشخصه مشترک همه زنده‌هاست.","pageRef":"صفحه ۱۵"},{"type":"note","title":"پویایی؛ ویژگی مهم زیست","body":"پویایی یعنی موجود زنده همیشه در حال تبادل ماده و انرژی با محیط است و هیچ‌گاه کاملا ساکن نیست.\nحتی درخت سرسبز هم آب جذب می‌کند، غذا می‌سازد و اکسیژن پس می‌دهد.\nمثال: ماهی در تنگ آب همیشه با آبشش‌هایش آب را تازه می‌کند و حرکت مداوم آبشش‌ها نشانه پویایی اوست."},{"type":"note","title":"سازمان‌یافتگی از سلول تا جاندار","body":"موجودات زنده سازمان‌یافتگی دارند؛ یعنی از اجزای کوچک تا بزرگ مرتب و هماهنگ‌اند: سلول، بافت، اندام و پیکر.\nسلول کوچک‌ترین واحد ساختاری و عملی جانداران است.\nمثال: در بدن انسان سلول‌های ماهیچه‌ای با هم بافت ماهیچه و سپس اندامی مانند قلب را می‌سازند و در هر سطح، وظیفه‌ای مشخص انجام می‌شود."},{"type":"exam","title":"سه مشخصه مشترک موجودات زنده را نام ببرید و برای هر کدام یک مثال بزنید.","body":"۱) سوخت‌وساز: مانند غذا خوردن گربه و دفع مواد زاید.\n۲) رشد و تولیدمثل: مانند جوانه زدن دانه گندم و رشد نهال.\n۳) پاسخ به محرک: مانند چرخش گل به سمت نور یا برداشتن سریع دست از جسم داغ.\nتنظیم داخلی هم از دیگر مشخصه‌هاست؛ مانند عرق کردن برای خنک شدن پیکر در هوای گرم."},{"type":"exam","title":"کدام‌یک زنده است: سنگ مرمر، بذر خفته در انبار، ماشین لباسشویی؟ توضیح دهید.","body":"بذر خفته زنده است.\nبذر حتی در انبار نیز تنفس می‌کند و اگر شرایط مناسب مانند آب و دمای مناسب فراهم شود، جوانه می‌زند، رشد می‌کند و تولیدمثل می‌کند.\nسنگ مرمر و ماشین لباسشویی رشد نمی‌کنند، تولیدمثل ندارند و به محرک پاسخ نمی‌دهند؛ پس غیر زنده‌اند. حالت خفته به معنای مرگ نیست؛ فقط فعالیت‌های زیستی بسیار کم شده است."}]},{"number":2,"title":"سلول، پدیدآورنده اجزای زیستی","pages":"۲۵ تا ۴۲","contents":[{"type":"answer","title":"چرا به سلول، واحد ساختاری و عملی موجودات زنده می‌گویند؟","body":"همه موجودات زنده از یک یا چند سلول ساخته شده‌اند؛ پس سلول واحد ساختاری جانداران است.\nهمچنین همه فعالیت‌های حیاتی مانند گرفتن انرژی از غذا، ساخت پروتئین، دفع مواد زاید و تقسیم و تولیدمثل درون سلول انجام می‌شود؛ پس واحد عملی هم هست.\nمثال: آمیب موجودی تک‌سلولی است و همه کارهای حیاتی خود را فقط با یک سلول انجام می‌دهد.","pageRef":"صفحه ۲۸"},{"type":"answer","title":"آزمایش کنید: هنگام مشاهده سلول پوسته پیاز در میکروسکوپ چه ساختارهایی دیده می‌شود؟","body":"لایه نازک درونی پیاز را جدا و با رنگ مناسب رنگ‌آمیزی می‌کنیم. در میکروسکوپ سلول‌های منظم و کنار هم دیده می‌شوند:\nدیواره سلولی ضخیم و مستطیل شکل، غشای نازک در زیر دیواره، سیتوپلاسم و هسته رنگ گرفته کنار دیواره.\nواکوئل بزرگ مرکزی بیشتر فضای سلول را گرفته است. چون پیاز زیر خاک رشد می‌کند، کلروپلاست سبز در سلول‌های آن دیده نمی‌شود.","pageRef":"صفحه ۳۳"},{"type":"note","title":"تفاوت سلول گیاهی و سلول جانوری","body":"سلول گیاهی علاوه بر غشا، دیواره سلولی محکم از جنس سلولز دارد و واکوئل بزرگ مرکزی و کلروپلاست سبز برای غذاسازی دارد.\nسلول جانوری فقط غشا دارد؛ پس شکل آن کم‌وبیش گرد و تغییرپذیر است.\nمثال: سلول پوسته پیاز دیواره ضخیم دارد، اما سلول‌های پوسته دهان ما بی‌دیواره و گردند."},{"type":"note","title":"هسته؛ مرکز فرماندهی سلول","body":"هسته اندامک بزرگ و مهم سلول است که ماده ژنتیکی در آن قرار دارد و فعالیت‌های سلول مانند رشد، تقسیم و ساخت پروتئین را هدایت می‌کند.\nسلول‌هایی که هسته ندارند مانند گلبول قرمز خیلی زود از بین می‌روند.\nمثال: باکتری‌ها هسته واقعی ندارند و ماده ژنتیکی آن‌ها آزاد در سیتوپلاسم است؛ به این گروه پروکاریوت می‌گویند."},{"type":"exam","title":"سه اندامک سلول و کار هر کدام را بنویسید.","body":"میتوکندری محل تنفس سلولی است و انرژی غذا را آزاد می‌کند.\nکلروپلاست با رنگدانه سبز کلروفیل، محل فتوسنتز و غذاسازی در سلول‌های گیاهی است.\nریبوزوم محل ساخت پروتئین است.\nواکوئل برای ذخیره آب و مواد به کار می‌رود و هسته نیز با ماده ژنتیکی خود کل فعالیت‌های سلول را فرماندهی می‌کند."},{"type":"exam","title":"مراحل مشاهده یک سلول با میکروسکوپ نوری را بنویسید.","body":"ابتدا نمونه را روی لام می‌گذاریم و یک قطره رنگ اضافه می‌کنیم تا هسته بهتر دیده شود.\nلامل را با زاویه و آرامی روی نمونه قرار می‌دهیم تا حباب هوا نیفتد.\nلام را روی گردون می‌گذاریم، با پیچ درشت و ریز فوکوس می‌کنیم و بزرگ‌نمایی را کم به زیاد تغییر می‌دهیم.\nبزرگ‌نمایی کل از ضرب بزرگ‌نمایی عدسی چشمی در عدسی شیئی به دست می‌آید."}]},{"number":3,"title":"حرکت چیست؟","pages":"۴۳ تا ۶۰","contents":[{"type":"answer","title":"تفاوت مسافت و جابجایی چیست؟ با مثال توضیح دهید.","body":"مسافت طول کل مسیر پیموده‌شده است و همیشه مثبت است؛ جابجایی کوتاه‌ترین فاصله مستقیم از نقطه آغاز حرکت تا پایان آن است و جهت دارد.\nمثال: دانش‌آموزی که یک دور کامل دایره‌ای دور میدان می‌دود، مسافتی برابر محیط دایره طی می‌کند، اما جابجایی او صفر است؛ چون در پایان به نقطه شروع بازگشته است.","pageRef":"صفحه ۴۶"},{"type":"answer","title":"سرعت متوسط دوچرخه‌سواری که ۱۲۰۰ متر را در ۵ دقیقه می‌پیماید چند متر بر ثانیه است؟","body":"سرعت متوسط از تقسیم مسافت بر زمان به دست می‌آید.\nابتدا زمان را به ثانیه تبدیل می‌کنیم: ۵ دقیقه برابر ۳۰۰ ثانیه است.\nحالا ۱۲۰۰ تقسیم بر ۳۰۰ برابر ۴ می‌شود؛ پس سرعت متوسط دوچرخه‌سوار ۴ متر بر ثانیه است.\nاین سرعت برابر ۱۴٫۴ کیلومتر بر ساعت است؛ زیرا هر متر بر ثانیه برابر ۳٫۶ کیلومتر بر ساعت است.","pageRef":"صفحه ۵۱"},{"type":"note","title":"حرکت نسبی است","body":"برای اینکه بگوییم جسمی در حرکت است یا ساکن، باید مبنایی برای مقایسه انتخاب کنیم؛ به این مبنای مقایسه، جسم مرجع می‌گویند.\nمثال: مسافر قطار نسبت به صندلی کناری‌اش ساکن است، اما نسبت به درختان کنار جاده در حرکت است.\nپس حرکت و سکون جسمی مطلق نیست و به انتخاب جسم مرجع بستگی دارد."},{"type":"note","title":"شتاب؛ تغییر سرعت در واحد زمان","body":"اگر سرعت جسم تغییر کند می‌گوییم جسم شتاب دارد. شتاب از تقسیم تغییر سرعت بر زمان به دست می‌آید و یکای آن متر بر مجذور ثانیه است.\nمثال: خودرویی که در ۵ ثانیه از سکون به سرعت ۱۰ متر بر ثانیه برسد، شتاب آن ۲ متر بر مجذور ثانیه است.\nهنگام ترمز گرفتن نیز سرعت کم می‌شود و شتاب منفی یا کندشونده داریم."},{"type":"exam","title":"خودرویی با سرعت ثابت ۲۰ متر بر ثانیه حرکت می‌کند. مسافتی که در ۲ دقیقه طی می‌کند چقدر است؟","body":"ابتدا زمان را به ثانیه تبدیل می‌کنیم: ۲ دقیقه برابر ۱۲۰ ثانیه است.\nمسافت از ضرب سرعت در زمان به دست می‌آید: ۲۰ ضرب در ۱۲۰ برابر ۲۴۰۰ متر است؛ یعنی ۲٫۴ کیلومتر.\nچون سرعت خودرو ثابت است، سرعت لحظه‌ای و متوسط برابرند و نمودار مکان و زمان آن خطی صعودی و راست است."},{"type":"exam","title":"از نمودار مکان و زمان چه اطلاعاتی به دست می‌آید؟","body":"شیب خط در نمودار مکان و زمان نشان‌دهنده سرعت جسم است.\nهرچه شیب تندتر باشد سرعت بیشتر است. خط افقی یعنی جسم ساکن است و مکانش تغییر نمی‌کند. خط راست و صعودی یعنی حرکت با سرعت ثابت انجام می‌شود.\nاگر دو خط در نمودار همدیگر را قطع کنند، نقطه برخورد نشان می‌دهد دو جسم در آن لحظه در یک مکان بوده‌اند؛ یعنی به هم رسیده‌اند."}]},{"number":4,"title":"رفتار و سازش در موجودات زنده","pages":"۶۱ تا ۷۸","contents":[{"type":"answer","title":"تفاوت رفتار ذاتی و رفتار آموخته‌ای را با مثال توضیح دهید.","body":"رفتار ذاتی یا غریزی با تولد همراه جاندار است و نیازی به آموزش ندارد؛ مانند تار بافتن عنکبوت و لانه‌سازی پرنده.\nرفتار آموخته‌ای در اثر تجربه، تقلید و تمرین به دست می‌آید؛ مانند نشستن سگ در برابر فرمان صاحبش یا یادگیری آوای منطقه توسط پرنده.\nرفتارهای آموخته‌ای با تمرین بهتر می‌شوند، اما رفتارهای ذاتی در همه افراد یک گونه یکسان است.","pageRef":"صفحه ۶۴"},{"type":"answer","title":"جانداران مناطق خشک برای سازش با کمبود آب چه سازش‌هایی دارند؟","body":"شتر چربی را در کوهان ذخیره می‌کند و می‌تواند مدت‌ها بدون آب بماند؛ جوندگان کویری شب فعال‌اند تا از گرمای روز در امان باشند.\nدر گیاهان مانند کاکتوس، برگ‌ها به خار تبدیل شده‌اند تا تبخیر کم شود و ریشه‌های بلند به آب عمق زمین می‌رسند.\nبرخی جانوران کویر هم در تابستان به خواب تابستانی می‌روند تا مصرف آب و انرژی بدنشان کم شود.","pageRef":"صفحه ۷۰"},{"type":"note","title":"مهاجرت؛ سفر برای بقا","body":"مهاجرت جابه‌جایی گروهی جانداران برای یافتن غذا، آب یا محل زادآوری است و معمولا فصلی است.\nمثال: پرستوها در پاییز به مناطق گرم سفر می‌کنند و در بهار به محل سابق خود برمی‌گردند.\nماهی قزل‌آلا برای تخم‌ریزی از دریا به رودخانه بالا می‌رود و گوزن‌ها در زمستان به دشت‌های پایین‌تر و گرم‌تر کوچ می‌کنند."},{"type":"note","title":"راه‌های ارتباط جانداران با هم","body":"جانداران برای یافتن غذا، خبر دادن از خطر یا جفت‌گیری با هم ارتب
