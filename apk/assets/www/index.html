<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درسیار من | کمک درسی متوسطه اول</title>
<style>
/* درسیار من — استایل اپلیکیشن آفلاین اندروید */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "Vazirmatn", Tahoma, sans-serif;
  background: #f4f8ff;
  color: #1e293b;
  -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #fff;
  box-shadow: 0 0 30px rgba(37, 99, 235, 0.06);
  padding-bottom: 80px;
  position: relative;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; text-align: right; }
img { display: block; }

/* ---------- هدر ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid #f1f5f9;
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.topbar .title { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 17px; color: #1e293b; }
.topbar .title .t { text-align: center; }
.topbar .title svg { color: #22c55e; }
.topbar .title small { display: block; font-size: 10px; color: #94a3b8; font-weight: 400; }
.iconbtn {
  width: 40px; height: 40px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; color: #64748b;
  position: relative;
}
.iconbtn .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: #f43f5e; }
.iconbtn.plain { border: none; background: rgba(255,255,255,.16); color: #fff; }

/* ---------- بدنه ---------- */
.pad { padding: 14px 14px 20px; }
.card {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: #fff; border: 1px solid #f1f5f9; border-radius: 18px;
  padding: 14px; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
  margin-bottom: 12px; transition: transform .15s ease, box-shadow .15s ease;
}
.card:active { transform: scale(.985); box-shadow: 0 1px 4px rgba(15,23,42,.08); }

.hero {
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(105deg, #eff6ff, #f0f9ff 55%, #fff);
  border: 1px solid #dbeafe; border-radius: 22px; padding: 18px 16px;
}
.hero img { width: 104px; height: 104px; flex-shrink: 0; }
.hero h2 { font-size: 19px; font-weight: 800; color: #1d4ed8; line-height: 1.7; }
.hero p { font-size: 12.5px; color: #64748b; line-height: 1.9; margin-top: 4px; }

.section-title { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; font-weight: 800; color: #1e293b; margin: 20px 0 12px; }
.section-title svg { color: #2563eb; }

.grade-icon {
  width: 54px; height: 54px; border-radius: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.22);
}
.grade-info { flex: 1; }
.grade-info b { display: block; font-size: 16.5px; color: #1e293b; }
.grade-info small { display: block; font-size: 12px; color: #94a3b8; margin-top: 3px; }
.grade-bar { display: block; width: 46px; height: 4px; border-radius: 99px; margin-top: 8px; }
.badge { font-size: 11px; font-weight: 800; padding: 5px 11px; border-radius: 99px; flex-shrink: 0; }

.ai-card {
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(105deg, #f0f9ff, #fff);
  border: 1px solid #dbeafe; border-radius: 22px; padding: 16px;
}
.ai-card img { width: 96px; height: 96px; flex-shrink: 0; }
.ai-card h3 { font-size: 15px; font-weight: 800; color: #1e293b; }
.ai-card p { font-size: 12.5px; color: #64748b; line-height: 1.9; margin: 4px 0 10px; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid #bfdbfe; background: #fff; color: #2563eb;
  font-size: 13px; font-weight: 800; padding: 8px 16px; border-radius: 99px;
}
.pill-btn:active { background: #2563eb; color: #fff; }

/* ---------- ویو پایه ---------- */
.gheader {
  background: linear-gradient(120deg, #2563eb, #3b82f6 55%, #38bdf8);
  border-radius: 0 0 30px 30px; padding: 18px 18px 52px; color: #fff;
}
.gheader .hi { font-size: 13px; opacity: .85; }
.gheader h1 { font-size: 22px; font-weight: 800; margin-top: 4px; }
.gheader .sub { font-size: 12px; opacity: .8; margin-top: 3px; }
.gheader .row { display: flex; align-items: flex-start; justify-content: space-between; }

.stats {
  display: flex; margin: -36px 14px 18px; background: #fff;
  border: 1px solid #f1f5f9; border-radius: 18px; padding: 14px 4px;
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
}
.stats .st { flex: 1; text-align: center; }
.stats .st + .st { border-right: 1px solid #f1f5f9; }
.stats .st svg { margin: 0 auto 4px; }
.stats b { display: block; font-size: 17px; font-weight: 800; color: #1e293b; }
.stats span { font-size: 10.5px; color: #94a3b8; }

.cover {
  width: 62px; height: 80px; flex-shrink: 0; border-radius: 10px;
  padding: 7px 8px; color: #fff; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: inset -1px 0 0 rgba(255,255,255,.25), 0 5px 12px rgba(15,23,42,.15);
  position: relative; overflow: hidden;
}
.cover::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 4px; background: rgba(255,255,255,.28); }
.cover small { font-size: 8.5px; opacity: .85; }
.cover b { font-size: 9.5px; line-height: 1.5; }
.binfo { flex: 1; }
.binfo b.t { display: block; font-size: 14.5px; color: #1e293b; }
.binfo p { font-size: 11.5px; color: #94a3b8; line-height: 1.8; margin: 2px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips span { font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 99px; }
.chev { color: #cbd5e1; flex-shrink: 0; }

/* ---------- ویو کتاب ---------- */
.tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: #fff; border: 1px solid #f1f5f9; border-radius: 16px;
  padding: 9px 4px; font-size: 11px; font-weight: 800; color: #64748b;
}
.tab .cnt { font-size: 9.5px; padding: 2px 9px; border-radius: 99px; font-weight: 800; }
.tab.on { color: #fff; }
.tab .cnt.on2 { background: rgba(255,255,255,.2); color: #fff; }

.chapters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
.chapters::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; border: 1px solid #e2e8f0; background: #fff; color: #64748b;
  border-radius: 16px; padding: 7px 14px; font-size: 11px; font-weight: 800;
}
.chip small { display: block; font-size: 9px; font-weight: 400; opacity: .8; }
.chip.on { background: #334155; border-color: #334155; color: #fff; }

.chhead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: #f8fafc; border-radius: 12px; padding: 8px 12px; margin-bottom: 10px;
}
.chhead h3 { font-size: 13px; font-weight: 800; color: #334155; }
.chhead span { font-size: 9.5px; color: #94a3b8; flex-shrink: 0; }

.content-card {
  background: #fff; border: 1px solid #f1f5f9; border-radius: 18px;
  padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(15,23,42,.04);
}
.content-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 99px; }
.page-ref { font-size: 9.5px; color: #64748b; background: #f1f5f9; padding: 3px 9px; border-radius: 99px; }
.content-card h4 { font-size: 13.5px; font-weight: 800; color: #1e293b; line-height: 2; }
.content-card .body { font-size: 12.5px; color: #475569; line-height: 2.05; white-space: pre-wrap; margin-top: 6px; }
.content-card details { margin-top: 8px; }
.content-card summary {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer; list-style: none;
  background: #f5f3ff; color: #7c3aed; font-size: 11.5px; font-weight: 800;
  padding: 6px 13px; border-radius: 99px;
}
.content-card summary::-webkit-details-marker { display: none; }
.content-card details .body { background: #faf5ff; border-radius: 12px; padding: 10px 12px; margin-top: 10px; max-height: 280px; overflow-y: auto; }

.ai-cta {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  background: linear-gradient(105deg, #f0f9ff, #fff);
  border: 1px solid #dbeafe; border-radius: 18px; padding: 14px; margin-top: 18px;
}
.ai-cta .l { display: flex; align-items: center; gap: 10px; }
.ai-cta .bot-ic { width: 44px; height: 44px; border-radius: 14px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ai-cta b { display: block; font-size: 13px; color: #1e293b; }
.ai-cta small { font-size: 11px; color: #94a3b8; }
.ai-cta .go { background: #2563eb; color: #fff; font-size: 11.5px; font-weight: 800; padding: 7px 14px; border-radius: 99px; flex-shrink: 0; }

/* ---------- چت ---------- */
.ctx-chip { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; color: #2563eb; font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 99px; margin: 0 14px 10px; }
.ctx-chip button { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #dbeafe; color: #2563eb; }
.chat-wrap { padding: 14px 14px 90px; display: flex; flex-direction: column; gap: 12px; min-height: 60vh; }
.msg { display: flex; align-items: flex-end; gap: 7px; }
.msg .av { width: 32px; height: 32px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg .bubble { max-width: 82%; border-radius: 18px; padding: 11px 14px; font-size: 12.5px; line-height: 2; white-space: pre-wrap; word-break: break-word; }
.msg.bot .bubble { background: #fff; border: 1px solid #f1f5f9; color: #334155; border-bottom-right-radius: 6px; box-shadow: 0 2px 6px rgba(15,23,42,.05); }
.msg.me { justify-content: flex-end; }
.msg.me .bubble { background: #2563eb; color: #fff; border-bottom-left-radius: 6px; box-shadow: 0 3px 8px rgba(37,99,235,.2); }
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; animation: tb 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes tb { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }

.suggest { border: 1px dashed #bfdbfe; background: rgba(239,246,255,.5); color: #2563eb; font-size: 12.5px; font-weight: 600; border-radius: 16px; padding: 10px 14px; text-align: right; }

.chatbar {
  position: fixed; bottom: 0; right: 0; left: 0; z-index: 30;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid #e2e8f0;
}
.chatbar .in { max-width: 480px; margin: 0 auto; display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
.chatbar input {
  flex: 1; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 16px;
  padding: 12px 14px; font-family: inherit; font-size: 13px; color: #1e293b; outline: none;
}
.chatbar input:focus { border-color: #93c5fd; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
.chatbar .send { width: 44px; height: 44px; flex-shrink: 0; border-radius: 16px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(37,99,235,.3); }
.chatbar .send:disabled { opacity: .4; }

.url-row { display: flex; gap: 6px; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 8px 10px; margin: 0 14px 12px; }
.url-row input { flex: 1; border: none; background: none; font-family: inherit; font-size: 11.5px; color: #334155; outline: none; direction: ltr; text-align: left; }
.url-row .save { background: #2563eb; color: #fff; font-size: 10.5px; font-weight: 800; padding: 6px 12px; border-radius: 10px; flex-shrink: 0; }

/* ---------- نویگیشن پایین ---------- */
.bottomnav {
  position: fixed; bottom: 0; right: 0; left: 0; z-index: 30;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid #e2e8f0;
}
.bottomnav .nav-in {
  max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; gap: 2px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
}
.navbtn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10.5px; font-weight: 700; color: #64748b;
  border-radius: 16px; padding: 7px 10px; min-width: 64px;
}
.navbtn.on { background: #2563eb; color: #fff; box-shadow: 0 4px 10px rgba(37,99,235,.28); }

.empty { border: 1px dashed #e2e8f0; background: #f8fafc; border-radius: 16px; padding: 22px; text-align: center; color: #64748b; font-size: 13px; }

</style>
</head>

window.__DARSYAR_DATA__ = [{"number":7,"name":"پایه هفتم","subtitle":"آغاز مسیر موفقیت","books":[{"title":"ریاضی هفتم","subject":"ریاضی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه فصل‌های کتاب ریاضی هفتم","color":"blue","icon":"calculator","chapters":[{"number":1,"title":"عدد های طبیعی و صحیح","pages":"۸ تا ۳۴","contents":[{"type":"answer","title":"حاصل عبارت (۲۳ − ۸) ÷ ۳ + ۲ به توان ۲ را حساب کنید.","body":"اولویت عملیات‌ها را رعایت می‌کنیم: ابتدا پرانتز، سپس توان، بعد ضرب و تقسیم و در پایان جمع و تفریق.\nپرانتز: ۲۳ − ۸ = ۱۵\nتوان: ۲ به توان ۲ = ۴\nتقسیم: ۱۵ ÷ ۳ = ۵\nجمع: ۵ + ۴ = ۹\nپس حاصل نهایی عبارت برابر عدد ۹ است.","pageRef":"صفحه ۱۴"},{"type":"answer","title":"دمای هوای یک شهر در سپیده‌دم ۷ درجه زیر صفر بود که تا ظهر ۴ درجه گرم‌تر شد. دمای هوا در ظهر چند درجه بود؟","body":"دمای سپیده‌دم را با عدد ۷− نشان می‌دهیم. گرم شدن هوا یعنی جمع با عدد ۴:\n(−۷) + ۴ = −۳\nیعنی روی خط اعداد از ۷− چهار واحد به سمت راست می‌رویم و به ۳− می‌رسیم.\nبرای جمع دو عدد با علامت‌های مختلف، قدرمطلق کوچک‌تر را از بزرگ‌تر کم می‌کنیم (۷ − ۴ = ۳) و علامت عدد بزرگ‌تر یعنی منفی را می‌گذاریم.\nپس دمای هوا در ظهر ۳ درجه زیر صفر بود.","pageRef":"صفحه ۲۶"},{"type":"note","title":"خاصیت توزیعی ضرب بر جمع","body":"ضرب بر جمع خاصیت توزیعی دارد: هر عدد در مجموع دو عدد، برابر است با مجموع حاصل‌ضرب آن عدد در هر یک.\nمثال: ۷ × (۴ + ۳) = ۷ × ۷ = ۴۹ و همچنین ۷ × ۴ + ۷ × ۳ = ۲۸ + ۲۱ = ۴۹.\nاین خاصیت برای محاسبه ذهنی سریع مفید است؛ مثلاً ۶ × ۹۸ را به شکل ۶ × (۱۰۰ − ۲) = ۶۰۰ − ۱۲ = ۵۸۸ حساب می‌کنیم."},{"type":"note","title":"قاعده جمع عددهای صحیح","body":"اگر دو عدد صحیح هم‌علامت باشند، قدرمطلق‌ها را جمع می‌کنیم و علامت مشترک را می‌گذاریم؛ مانند (−۳) + (−۵) = −۸.\nاگر علامت‌ها مختلف باشد، قدرمطلق کوچک‌تر را از قدرمطلق بزرگ‌تر کم می‌کنیم و علامت عددی را می‌گذاریم که قدرمطلقش بزرگ‌تر است؛ مانند (−۹) + ۴ = −۵.\nتفریق را می‌توان جمع با قرینه دانست: ۵ − (−۲) = ۵ + ۲ = ۷."},{"type":"exam","title":"حاصل عبارت (۱۰ − ۶) ÷ (−۲) + ۵ را حساب کنید.","body":"پاسخ تشریحی:\nگام ۱: پرانتز اول: ۱۰ − ۶ = ۴\nگام ۲: پرانتز دوم همان عدد −۲ است.\nگام ۳: تقسیم: ۴ ÷ (−۲) = −۲ چون تقسیم دو عدد با علامت‌های مختلف جواب منفی دارد.\nگام ۴: جمع: (−۲) + ۵ = ۳\nپس حاصل نهایی عبارت برابر عدد ۳ است؛ روی خط اعداد از −۲ پنج واحد به سمت راست حرکت می‌کنیم."},{"type":"exam","title":"حاصل ۲ به توان ۵ و ۳ به توان ۳ را حساب کنید. آیا هر دو حاصل زوج‌اند یا فرد؟","body":"پاسخ تشریحی:\n۲ به توان ۵ یعنی پنج بار ضرب ۲ در خودش: ۲ × ۲ × ۲ × ۲ × ۲ = ۳۲\n۳ به توان ۳ یعنی: ۳ × ۳ × ۳ = ۲۷\nعدد ۳۲ زوج است چون بر ۲ بخش‌پذیر است، اما ۲۷ فرد است و بر ۲ بخش‌پذیر نیست.\nنکته: حاصل توان از پایه پیروی می‌کند؛ توان زوج از عدد زوج زوج و توان فرد از عدد فرد فرد می‌شود."}]},{"number":2,"title":"کسر و اعداد اعشاری","pages":"۳۵ تا ۶۲","contents":[{"type":"answer","title":"حاصل جمع دو سوم و یک چهارم را به دست آورید.","body":"مخرج مشترک ۳ و ۴ عدد ۱۲ است.\nدو سوم = ۸ دوازدهم (صورت و مخرج را در ۴ ضرب می‌کنیم)\nیک چهارم = ۳ دوازدهم (صورت و مخرج را در ۳ ضرب می‌کنیم)\nحالا مخرج‌ها برابرند: ۸ دوازدهم + ۳ دوازدهم = ۱۱ دوازدهم\nچون ۱۱ عدد اول است و در ۱۲ بخش‌پذیر نیست، این کسر دیگر ساده نمی‌شود.\nپس حاصل نهایی ۱۱ دوازدهم است.","pageRef":"صفحه ۴۸"},{"type":"answer","title":"حاصل ضرب ۲٫۵ در ۰٫۴ را حساب کنید.","body":"ابتدا ممیزها را نادیده می‌گیریم: ۲۵ × ۴ = ۱۰۰\nدر ۲٫۵ یک رقم بعد از ممیز و در ۰٫۴ هم یک رقم بعد از ممیز است؛ جمعاً دو رقم اعشار.\nپس ممیز را در جواب از راست دو رقم جابه‌جا می‌کنیم: ۱٫۰۰ که برابر عدد ۱ است.\nبررسی منطقی: نصف ۰٫۴ برابر ۰٫۲ و دو برابر آن ۰٫۴ است؛ یعنی ۲٫۵ × ۰٫۴ دقیقاً عدد ۱ می‌شود.","pageRef":"صفحه ۵۸"},{"type":"note","title":"ساده کردن کسرها با بزرگ‌ترین شمارنده مشترک","body":"برای ساده کردن کسر، صورت و مخرج را بر بزرگ‌ترین شمارنده مشترک (ب.م.م) تقسیم می‌کنیم.\nمثال: در کسر ۲۴ سی‌وششم، ب.م.م دو عدد ۲۴ و ۳۶ برابر ۱۲ است؛ پس ۲۴ ÷ ۱۲ = ۲ و ۳۶ ÷ ۱۲ = ۳ و کسر به ۲ سوم ساده می‌شود.\nمی‌توانیم مرحله‌به‌مرحله هم ساده کنیم: اول بر ۲، دوباره بر ۲ و بعد بر ۳ تقسیم کنیم تا به ساده‌ترین شکل برسیم."},{"type":"note","title":"مقایسه کسرها با مخرج مشترک","body":"برای مقایسه دو کسر، آنها را با مخرج مشترک می‌نویسیم و صورت‌ها را مقایسه می‌کنیم.\nمثال: کدام بزرگ‌تر است، سه چهارم یا چهار پنجم؟\nمخرج مشترک ۲۰: سه چهارم = ۱۵ بیستم و چهار پنجم = ۱۶ بیستم.\nچون ۱۶ بزرگ‌تر از ۱۵ است، چهار پنجم بزرگ‌تر است.\nراه سریع ضرب متقاطع: ۳ × ۵ = ۱۵ و ۴ × ۴ = ۱۶؛ باز هم چهار پنجم بزرگ‌تر است."},{"type":"exam","title":"حاصل عبارت (یک دوم + یک سوم) × شش هفتم را حساب کنید.","body":"پاسخ تشریحی:\nگام ۱: پرانتز: مخرج مشترک ۲ و ۳ عدد ۶ است؛ یک دوم = ۳ ششم و یک سوم = ۲ ششم؛ پس جمع = ۵ ششم.\nگام ۲: ضرب کسرها: صورت در صورت و مخرج در مخرج: ۵ × ۶ بر ۶ × ۷ یعنی ۳۰ چهل‌ودوم.\nگام ۳: ساده کردن: ۳۰ و ۴۲ را بر ۶ تقسیم می‌کنیم: ۵ هفتم.\nپس حاصل نهایی ۵ هفتم است."},{"type":"exam","title":"زهرا ۳٫۵ کیلوگرم سیب خرید و ۱٫۲۵ کیلوگرم از آن را مصرف کرد. چند کیلوگرم سیب باقی مانده است؟","body":"پاسخ تشریحی:\nبرای تفریق عددهای اعشاری، ممیزها را زیر هم می‌گذاریم و با اضافه کردن صفر تعداد رقم‌های اعشار را برابر می‌کنیم: ۳٫۵ = ۳٫۵۰\n۳٫۵۰ − ۱٫۲۵ = ۲٫۲۵\nپس ۲٫۲۵ کیلوگرم سیب باقی می‌ماند.\nبررسی: ۲٫۲۵ + ۱٫۲۵ = ۳٫۵۰ پس جواب درست است."}]},{"number":3,"title":"محیط و مساحت","pages":"۶۳ تا ۸۸","contents":[{"type":"answer","title":"مساحت ذوزنقه‌ای با قاعده‌های ۸ و ۶ سانتی‌متر و ارتفاع ۵ سانتی‌متر را حساب کنید.","body":"فرمول مساحت ذوزنقه: مجموع دو قاعده در ارتفاع، تقسیم بر ۲.\nمجموع قاعده‌ها: ۸ + ۶ = ۱۴ سانتی‌متر\n۱۴ × ۵ = ۷۰\n۷۰ ÷ ۲ = ۳۵\nپس مساحت این ذوزنقه ۳۵ سانتی‌متر مربع است.\nتوجه: ارتفاع باید فاصله عمودی بین دو ضلع موازی ذوزنقه باشد.","pageRef":"صفحه ۷۴"},{"type":"answer","title":"محیط دایره‌ای به شعاع ۷ سانتی‌متر را با تقریب پی برابر ۲۲ هفتم حساب کنید.","body":"محیط دایره برابر است با ۲ × پی × شعاع.\nچون شعاع ۷ است و پی تقریباً ۲۲ هفتم:\n۲ × ۲۲ هفتم × ۷ = ۳۰۸ هفتم\n۳۰۸ ÷ ۷ = ۴۴\nپس محیط دایره تقریباً ۴۴ سانتی‌متر است.\nنکته: قطر این دایره ۱۴ سانتی‌متر است و محیط تقریباً سه بار و هفتم قطر می‌شود.","pageRef":"صفحه ۸۲"},{"type":"note","title":"مساحت متوازی‌الاضلاع و مثلث","body":"مساحت متوازی‌الاضلاع برابر قاعده × ارتفاع است؛ مثلاً متوازی‌الاضلاعی با قاعده ۹ و ارتفاع ۴ مساحتش ۹ × ۴ = ۳۶ سانتی‌متر مربع است.\nمساحت مثلث نصف قاعده × ارتفاع است: مثلثی با قاعده ۸ و ارتفاع ۶ مساحتش ۸ × ۶ ÷ ۲ = ۲۴ سانتی‌متر مربع است.\nدلیلش این است که دو مثلث مساوی، یک متوازی‌الاضلاع کامل می‌سازند."},{"type":"note","title":"تبدیل یکاهای مساحت","body":"در تبدیل یکاهای مساحت، ضریب تبدیل طول باید توان ۲ شود؛ چون مساحت دو بعد دارد.\nهر متر مربع = ۱۰۰ سانتی‌متر × ۱۰۰ سانتی‌متر = ۱۰۰۰۰ سانتی‌متر مربع.\nهر سانتی‌متر مربع = ۱۰۰ میلی‌متر مربع.\nمثال: ۳ متر مربع = ۳ × ۱۰۰۰۰ = ۳۰۰۰۰ سانتی‌متر مربع.\nو برعکس: ۵۰۰۰ سانتی‌متر مربع = ۰٫۵ متر مربع."},{"type":"exam","title":"حیاط مدرسه‌ای مستطیل‌شکل به طول ۱۲ متر و عرض ۸ متر است. می‌خواهند نصف حیاط را چمن‌کاری کنند. چند متر مربع چمن‌کاری لازم است؟","body":"پاسخ تشریحی:\nمساحت کل مستطیل = طول × عرض = ۱۲ × ۸ = ۹۶ متر مربع\nچون نصف حیاط چمن‌کاری می‌شود: ۹۶ ÷ ۲ = ۴۸ متر مربع\nپس برای چمن‌کاری به ۴۸ متر مربع چمن نیاز است.\nراه دیگر: می‌توان اول نصف طول را حساب کرد؛ یعنی ۶ × ۸ = ۴۸ که همان جواب می‌شود."},{"type":"exam","title":"مساحت لوزی‌ای که قطرهای آن ۱۰ سانتی‌متر و ۶ سانتی‌متر است را حساب کنید.","body":"پاسخ تشریحی:\nمساحت لوزی برابر نصف حاصل‌ضرب دو قطر است.\nحاصل‌ضرب قطرها: ۱۰ × ۶ = ۶۰\nمساحت: ۶۰ ÷ ۲ = ۳۰ سانتی‌متر مربع\nدلیل: هر قطر، لوزی را به دو مثلث مساوی تقسیم می‌کند و مجموع چهار مثلث ساخته‌شده با قطرها، نصف ضرب دو قطر را می‌سازد."}]},{"number":4,"title":"نسبت و تناسب و درصد","pages":"۸۹ تا ۱۱۴","contents":[{"type":"answer","title":"روی نقشه‌ای با مقیاس ۱ به ۲۰۰۰۰۰ فاصله دو شهر ۵ سانتی‌متر است. فاصله واقعی این دو شهر چند کیلومتر است؟","body":"مقیاس ۱ به ۲۰۰۰۰۰ یعنی هر ۱ سانتی‌متر روی نقشه برابر ۲۰۰۰۰۰ سانتی‌متر در واقعیت است.\nپس فاصله واقعی: ۵ × ۲۰۰۰۰۰ = ۱۰۰۰۰۰۰ سانتی‌متر\nحالا تبدیل می‌کنیم: هر کیلومتر ۱۰۰۰۰۰ سانتی‌متر است.\n۱۰۰۰۰۰۰ ÷ ۱۰۰۰۰۰ = ۱۰\nپس فاصله واقعی دو شهر ۱۰ کیلومتر است.","pageRef":"صفحه ۱۰۴"},{"type":"answer","title":"در مدرسه‌ای ۴۰۰ دانش‌آموز وجود دارد و ۵۵٪ آنها دختر هستند. تعداد دانش‌آموزان دختر چند نفر است؟","body":"۵۵٪ یعنی ۵۵ نفر از هر ۱۰۰ نفر.\nراه اول: کسر ۵۵ صدم = ۰٫۵۵ و محاسبه ۰٫۵۵ × ۴۰۰ = ۲۲۰ نفر\nراه دوم: ۵۵٪ از ۴۰۰ یعنی ۴۰۰ × ۵۵ ÷ ۱۰۰ = ۲۲۰۰۰ ÷ ۱۰۰ = ۲۲۰\nپس تعداد دخترها ۲۲۰ نفر و تعداد پسرها ۴۰۰ − ۲۲۰ = ۱۸۰ نفر است.","pageRef":"صفحه ۱۱۲"},{"type":"note","title":"نسبت و نسبت‌های مساوی","body":"نسبت، مقایسه دو کمیت با تقسیم است و مثل کسر نوشته می‌شود.\nنسبت ۱۲ به ۱۸ ساده می‌شود: هر دو جزء را بر ۶ تقسیم می‌کنیم و ۲ به ۳ به دست می‌آید.\nنسبت‌های مساوی با ضرب هر دو جزء در یک عدد یکسان ساخته می‌شوند: ۲ به ۳ = ۴ به ۶ = ۶ به ۹.\nمثال واقعی: اگر برای هر ۲ فنجان آرد، ۳ فنجان شیر لازم باشد، برای ۴ فنجان آرد باید ۶ فنجان شیر بریزیم."},{"type":"note","title":"درصد یعنی چند صدم","body":"درصد یعنی از هر ۱۰۰؛ پس ۴۵٪ همان کسر ۴۵ صدم و عدد اعشاری ۰٫۴۵ است.\nبرای محاسبه درصد از یک عدد، آن عدد را در کسر درصد ضرب می‌کنیم.\nمثال: ۲۰٪ از ۶۰ = ۰٫۲ × ۶۰ = ۱۲\nدرصد ۱۰۰٪ برابر کل عدد است: ۱۰۰٪ از ۲۵۰ می‌شود ۲۵۰.\nدرصد بزرگ‌تر از ۱۰۰٪ هم داریم؛ مثل ۱۵۰٪ از ۲۰ که می‌شود ۳۰."},{"type":"exam","title":"۳ عدد مداد ۴۵۰۰ تومان است. قیمت ۷ مداد هم‌جنس چقدر است؟","body":"پاسخ تشریحی:\nبین تعداد مدادها و قیمت آنها تناسب برقرار است.\nقیمت هر مداد: ۴۵۰۰ ÷ ۳ = ۱۵۰۰ تومان\nقیمت ۷ مداد: ۱۵۰۰ × ۷ = ۱۰۵۰۰ تومان\nراه تناسبی: نسبت ۳ به ۴۵۰۰ مساوی نسبت ۷ به مجهول است؛ پس مجهول = ۴۵۰۰ × ۷ ÷ ۳ = ۱۰۵۰۰\nیعنی قیمت ۷ مداد ۱۰۵۰۰ تومان است."},{"type":"exam","title":"قیمت یک کتاب ۸۰۰۰۰ تومان بود و ۱۰٪ گران شد. قیمت جدید کتاب را حساب کنید.","body":"پاسخ تشریحی:\nمبلغ افزایش: ۱۰٪ از ۸۰۰۰۰ = ۰٫۱ × ۸۰۰۰۰ = ۸۰۰۰ تومان\nقیمت جدید: ۸۰۰۰۰ + ۸۰۰۰ = ۸۸۰۰۰ تومان\nراه سریع: گران شدن ۱۰٪ یعنی قیمت جدید = قیمت قبلی × ۱٫۱ = ۸۰۰۰۰ × ۱٫۱ = ۸۸۰۰۰ تومان\nپس قیمت جدید کتاب ۸۸۰۰۰ تومان است."}]},{"number":5,"title":"معادله و راه حل مسئله","pages":"۱۱۵ تا ۱۳۸","contents":[{"type":"answer","title":"اگر به سه برابر عددی، ۵ واحد اضافه کنیم، حاصل ۲۰ می‌شود. با نوشتن معادله، آن عدد را پیدا کنید.","body":"عدد مجهول را س می‌نامیم. معادله: ۳ × س + ۵ = ۲۰\nگام ۱: ۵ را از دو طرف کم می‌کنیم: ۳ × س = ۲۰ − ۵ = ۱۵\nگام ۲: دو طرف را بر ۳ تقسیم می‌کنیم: س = ۱۵ ÷ ۳ = ۵\nآزمایش جواب: ۳ × ۵ + ۵ = ۱۵ + ۵ = ۲۰ درست است.\nپس عدد مورد نظر ۵ است.","pageRef":"صفحه ۱۲۶"},{"type":"answer","title":"الگوی دنباله‌ای ۴، ۷، ۱۰، ۱۳ و ... داده شده است. جمله شماره ۱۰ این دنباله چند است؟","body":"هر جمله از اضافه شدن ۳ به جمله قبلی به دست می‌آید؛ پس گام دنباله عدد ۳ است.\nقاعده: شماره هر جمله را در ۳ ضرب می‌کنیم و ۱ اضافه می‌کنیم.\nبررسی برای جمله‌های اول: ۳ × ۱ + ۱ = ۴ و ۳ × ۲ + ۱ = ۷ و ۳ × ۳ + ۱ = ۱۰ پس قاعده درست است.\nجمله شماره ۱۰: ۳ × ۱۰ + ۱ = ۳۱\nپس جمله دهم این دنباله برابر ۳۱ است.","pageRef":"صفحه ۱۳۴"},{"type":"note","title":"معادله مثل یک ترازو","body":"معادله را می‌توان مثل ترازوی متعادل دید: دو طرف تساوی باید همیشه برابر بمانند.\nهر عملی روی یک طرف انجام دهیم، باید همان عمل را روی طرف دیگر هم انجام دهیم؛ جمع یا تفریق یک عدد، یا ضرب و تقسیم در یک عدد غیر از صفر.\nمثال: در معادله ۲ × س = ۱۴، دو طرف را بر ۲ تقسیم می‌کنیم تا س = ۷ به دست آید."},{"type":"note","title":"الگو و دنباله عددی","body":"دنباله‌ای که هر جمله‌اش با اضافه کردن عدد ثابتی به جمله قبلی ساخته شود، گام ثابت دارد.\nمثال: دنباله ۲، ۵، ۸، ۱۱ با گام ۳.\nجمله شماره ۵ = ۲ + ۴ گام = ۲ + ۱۲ = ۱۴\nبرای پیدا کردن قاعده هر دنباله، فاصله جمله‌های پشت سر هم را حساب کنید؛ اگر فاصله ثابت باشد، قاعده پیدا شده است."},{"type":"exam","title":"سن پدر ۴ برابر سن پسر است و مجموع سن آن دو ۵۰ سال است. سن هر یک را با معادله پیدا کنید.","body":"پاسخ تشریحی:\nسن پسر را س می‌گیریم؛ پس سن پدر ۴ × س است.\nمعادله: س + ۴ × س = ۵۰ یعنی ۵ × س = ۵۰\nدو طرف را بر ۵ تقسیم می‌کنیم: س = ۱۰\nپس سن پسر ۱۰ سال و سن پدر ۴ × ۱۰ = ۴۰ سال است.\nآزمایش: ۱۰ + ۴۰ = ۵۰ و ۴۰ = ۴ × ۱۰؛ هر دو شرط مسئله درست‌اند."},{"type":"exam","title":"معادله ۵ × س − ۷ = ۲ × س + ۸ را حل کنید.","body":"پاسخ تشریحی:\nگام ۱: ۷ را به دو طرف اضافه می‌کنیم: ۵ × س = ۲ × س + ۱۵\nگام ۲: ۲ × س را از دو طرف کم می‌کنیم: ۳ × س = ۱۵\nگام ۳: دو طرف را بر ۳ تقسیم می‌کنیم: س = ۵\nآزمایش: ۵ × ۵ − ۷ = ۱۸ و ۲ × ۵ + ۸ = ۱۸؛ دو طرف مساوی‌اند پس جواب درست است."}]},{"number":6,"title":"آمار و احتمال","pages":"۱۳۹ تا ۱۶۲","contents":[{"type":"answer","title":"نمره‌های علی در چهار آزمون ریاضی: ۱۸، ۱۶، ۲۰ و ۱۴ است. میانگین نمره‌های او را حساب کنید.","body":"میانگین = جمع داده‌ها ÷ تعداد داده‌ها\nجمع نمره‌ها: ۱۸ + ۱۶ + ۲۰ + ۱۴ = ۶۸\nتعداد آزمون‌ها ۴ است.\nمیانگین: ۶۸ ÷ ۴ = ۱۷\nپس میانگین نمره‌های علی ۱۷ است. میانگین همیشه بین کوچک‌ترین داده (۱۴) و بزرگ‌ترین داده (۲۰) قرار می‌گیرد.","pageRef":"صفحه ۱۵۰"},{"type":"answer","title":"در کیفی ۳ گوی قرمز و ۵ گوی آبی داریم. اگر یک گوی را تصادفی بیرون بیاوریم، احتمال قرمز بودن آن چقدر است؟","body":"تعداد همه حالت‌های ممکن: ۳ + ۵ = ۸ گوی\nحالت‌های مطلوب (گوی قرمز): ۳ حالت\nاحتمال = تعداد حالت‌های مطلوب ÷ تعداد کل حالت‌ها = ۳ هشتم\nبه صورت عدد اعشاری: ۳ ÷ ۸ = ۰٫۳۷۵\nیعنی در بلندمدت از هر ۸ بار برداشت، حدود ۳ بار گوی قرمز بیرون می‌آید.","pageRef":"صفحه ۱۵۸"},{"type":"note","title":"میانه و نما","body":"برای پیدا کردن میانه، اول داده‌ها را از کوچک به بزرگ مرتب می‌کنیم؛ میانه عدد وسط است و اگر تعداد داده‌ها زوج باشد، میانگین دو عدد وسط می‌شود میانه.\nنما داده‌ای است که بیشترین تکرار را دارد.\nمثال: در داده‌های ۲، ۳، ۳، ۵، ۷ عدد وسط ۳ است پس میانه ۳ و نما هم ۳ است؛ چون عدد ۳ دو بار تکرار شده و از همه بیشتر آمده است."},{"type":"note","title":"احتمال همیشه بین ۰ و ۱ است","body":"احتمال هر حادثه عددی بین ۰ و ۱ است.\nحادثه قطعی احتمال ۱ دارد؛ مثل آمدن عدد کمتر از ۷ در پرتاب یک تاس.\nحادثه غیرممکن احتمال ۰ دارد؛ مثل آمدن عدد ۸ در پرتاب تاس.\nمثال حد وسط: احتمال آمدن عدد زوج در پرتاب تاس ۳ ششم یعنی ۱ دوم است؛ نه قطعی است و نه غیرممکن."},{"type":"exam","title":"میانگین ۴ عدد ۱۵ است. اگر عدد ۱۹ به آنها اضافه شود، میانگین جدید چند می‌شود؟","body":"پاسخ تشریحی:\nاز رابطه میانگین، جمع ۴ عدد = ۴ × ۱۵ = ۶۰\nبا اضافه شدن ۱۹: جمع جدید = ۶۰ + ۱۹ = ۷۹ و تعداد داده‌ها = ۵\nمیانگین جدید = ۷۹ ÷ ۵ = ۱۵٫۸\nمی‌بینیم میانگین بزرگ‌تر از ۱۵ شد؛ چون داده جدید یعنی ۱۹ از میانگین قبلی بزرگ‌تر بود."},{"type":"exam","title":"یک تاس و یک سکه را هم‌زمان پرتاب می‌کنیم. احتمال آنکه تاس عدد زوج بیاورد و سکه روی شیر بیاید چقدر است؟","body":"پاسخ تشریحی:\nاحتمال زوج بودن عدد تاس: حالت‌های مطلوب ۲، ۴ و ۶ یعنی ۳ حالت از ۶؛ پس ۳ ششم = ۱ دوم\nاحتمال شیر آمدن سکه: ۱ دوم\nچون دو حادثه به هم وابسته نیستند: احتمال هم‌زمان = ۱ دوم × ۱ دوم = ۱ چهارم\nیعنی به‌طور متوسط در هر ۴ بار پرتاب، یک بار این اتفاق می‌افتد."}]},{"number":7,"title":"هندسه و استدلال","pages":"۱۶۳ تا ۱۸۸","contents":[{"type":"answer","title":"اندازه متمم و مکمل زاویه ۳۵ درجه را حساب کنید.","body":"دو زاویه وقتی متمم‌اند که مجموع اندازه‌هایشان ۹۰ درجه شود.\nمتمم زاویه ۳۵: ۹۰ − ۳۵ = ۵۵ درجه\nدو زاویه وقتی مکمل‌اند که مجموعشان ۱۸۰ درجه شود.\nمکمل زاویه ۳۵: ۱۸۰ − ۳۵ = ۱۴۵ درجه\nپس متمم این زاویه ۵۵ و مکمل آن ۱۴۵ درجه است.\nبررسی: ۳۵ + ۵۵ = ۹۰ و ۳۵ + ۱۴۵ = ۱۸۰ پس هر دو جواب درست‌اند.","pageRef":"صفحه ۱۷۰"},{"type":"answer","title":"در مثلثی، اندازه دو زاویه آن ۶۰ و ۴۵ درجه است. اندازه زاویه سوم را با استدلال پیدا کنید.","body":"مجموع اندازه زاویه‌های هر مثلث ۱۸۰ درجه است.\nجمع دو زاویه معلوم: ۶۰ + ۴۵ = ۱۰۵ درجه\nزاویه سوم: ۱۸۰ − ۱۰۵ = ۷۵ درجه\nبررسی: ۶۰ + ۴۵ + ۷۵ = ۱۸۰ پس جواب درست است.\nچون هر سه زاویه کمتر از ۹۰ درجه‌اند، این مثلث حاده است.","pageRef":"صفحه ۱۸۰"},{"type":"note","title":"زاویه‌های متمم، مکمل و متقابل به رأس","body":"متمم: مجموع دو زاویه ۹۰ درجه؛ مثل ۳۰ و ۶۰.\nمکمل: مجموع دو زاویه ۱۸۰ درجه؛ مثل ۱۱۰ و ۷۰.\nمتقابل به رأس: وقتی دو خط یکدیگر را قطع کنند، زاویه‌های روبه‌روی هم مساوی‌اند؛ مثلاً اگر یکی ۱۲۰ درجه باشد، متقابلش هم ۱۲۰ درجه است.\nدو زاویه هم‌سایه روی یک خط راست، مکمل هم‌اند و مجموعشان ۱۸۰ درجه می‌شود."},{"type":"note","title":"تقارن محوری در شکل‌ها","body":"شکل تقارن محوری دارد اگر بتوان خطی رسم کرد که شکل را به دو بخش مساوی تقسیم کند که این دو بخش روی هم می‌افتند.\nمربع ۴ محور تقارن دارد، مستطیل ۲ محور و دایره بی‌شمار محور تقارن دارد.\nمثلث متساوی‌الاضلاع ۳ محور تقارن دارد.\nهر نقطه از شکل و نقطه متناظرش، به یک اندازه از محور تقارن فاصله دارند."},{"type":"exam","title":"نسبت اندازه زاویه‌های یک مثلث ۱ به ۲ به ۳ است. اندازه هر زاویه را حساب کنید و نوع مثلث را بگویید.","body":"پاسخ تشریحی:\nاندازه کوچک‌ترین زاویه را س می‌گیریم؛ پس زاویه‌ها س و ۲ × س و ۳ × س هستند.\nس + ۲ × س + ۳ × س = ۶ × س = ۱۸۰ پس س = ۱۸۰ ÷ ۶ = ۳۰\nاندازه زاویه‌ها: ۳۰ و ۶۰ و ۹۰ درجه.\nچون یک زاویه ۹۰ درجه است، این مثلث قائمه است؛ و چون اندازه هر سه زاویه مختلف است، کج‌الاضلاع هم هست."},{"type":"exam","title":"دو خط یکدیگر را قطع کرده‌اند و یکی از زاویه‌های ساخته‌شده ۱۲۰ درجه است. اندازه سه زاویه دیگر را با استدلال پیدا کنید.","body":"پاسخ تشریحی:\nزاویه متقابل به رأس زاویه ۱۲۰ درجه، خودش ۱۲۰ درجه است؛ چون زاویه‌های متقابل به رأس مساوی‌اند.\nهر یک از دو زاویه دیگر با زاویه ۱۲۰ درجه روی یک خط راست قرار دارند، پس مکمل آن‌اند:\n۱۸۰ − ۱۲۰ = ۶۰ درجه\nپس سه زاویه دیگر به ترتیب ۱۲۰ و ۶۰ و ۶۰ درجه‌اند. جمع هر دو زاویه مجاور ۱۸۰ درجه می‌شود که درست است."}]}]},{"title":"علوم تجربی هفتم","subject":"علوم تجربی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه فصل‌های کتاب علوم تجربی هفتم","color":"green","icon":"flask","chapters":[{"number":1,"title":"زندگی زیباست","pages":"۱ تا ۱۶","contents":[{"type":"answer","title":"فکر کنید: خودرو حرکت می‌کند و انرژی مصرف می‌کند؛ آیا خودرو جاندار است؟","body":"خیر، خودرو جاندار نیست. حرکت و مصرف انرژی به‌تنهایی نشانه زندگی نیست. خودرو رشد نمی‌کند، تولید مثل نمی‌کند، از سلول ساخته نشده و به محیط واکنش نشان نمی‌دهد. ویژگی‌های جانداران مجموعه‌ای است که باید همه آن‌ها با هم در یک موجود دیده شود؛ مثلا بذر خشک‌شده سال‌ها بی‌حرکت است، اما جاندار است چون پس از کاشتن، رشد می‌کند.","pageRef":"صفحه ۴"},{"type":"answer","title":"ویژگی‌های مشترک جانداران را بنویسید.","body":"همه جانداران ویژگی‌های مشترکی دارند: از سلول ساخته شده‌اند، برای زنده ماندن به انرژی و غذا نیاز دارند، رشد می‌کنند و تولید مثل می‌کنند، به محیط اطراف واکنش نشان می‌دهند، مواد زاید را دفع می‌کنند و طول عمر محدودی دارند. مثلا گیاه در جریان بودن نور، رو به نور رشد می‌کند و دانه تولید می‌کند تا نسل خود را ادامه دهد.","pageRef":"صفحه ۵"},{"type":"note","title":"تشخیص جاندار از غیرجاندار","body":"تشخیص جاندار از غیرجاندار با بررسی همه ویژگی‌های زندگی ممکن است، نه فقط یک ویژگی. ابر حرکت می‌کند اما جاندار نیست؛ زیرا رشد نمی‌کند و از سلول ساخته نشده. بلور نمک شکل منظم دارد اما انرژی مصرف نمی‌کند و تولید مثل ندارد. پس برای شناخت جاندار باید همه ویژگی‌های زندگی را با هم بررسی کرد، نه فقط حرکت یا شکل ظاهری."},{"type":"note","title":"نیازهای ضروری جانداران","body":"جانداران برای زنده ماندن به انرژی، آب، هوا، دمای مناسب و زیستگاه امن نیاز دارند. گیاهان انرژی خود را از خورشید و با فوتوسنتز به دست می‌آورند و جانوران با خوردن غذا. مثلا خرس قطبی در خواب زمستانی مصرف انرژی بدنش را کم می‌کند تا در نبود غذا و سرمای شدید زنده بماند."},{"type":"exam","title":"سه تفاوت جانداران و اجسام بی‌جان را با ذکر مثال بنویسید.","body":"۱) جانداران از سلول ساخته شده‌اند ولی اجسام بی‌جان سلول ندارند؛ مثلا برگ درخت از سلول‌های گیاهی است اما سنگ از دانه‌های کانی. ۲) جانداران رشد می‌کنند و تولید مثل می‌کنند اما اجسام بی‌جان چنین توانی ندارند؛ مثل تفاوت بچه گربه با ماشین اسباب‌بازی. ۳) جانداران به محیط واکنش نشان می‌دهند؛ مثلا گیاه رو به نور رشد می‌کند اما میز به نور واکنشی نشان نمی‌دهد."},{"type":"exam","title":"انرژی مورد نیاز جانداران از کجا تأمین می‌شود؟ نقش گیاهان سبز را توضیح دهید.","body":"منبع اصلی انرژی جانداران روی زمین، خورشید است. گیاهان سبز با استفاده از نور خورشید، آب و کربن دی‌اکسید در فرایند فوتوسنتز غذا می‌سازند و انرژی را درون ماده غذایی ذخیره می‌کنند. جانوران با خوردن گیاهان یا دیگر جانوران این انرژی را به دست می‌آورند؛ پس زندگی همه جانداران به‌طور مستقیم یا غیرمستقیم به گیاهان و خورشید وابسته است."}]},{"number":2,"title":"حس شگفت‌انگیز","pages":"۱۷ تا ۳۰","contents":[{"type":"answer","title":"چرا هنگام تماس دست با جسم داغ، بی‌درنگ دست را عقب می‌کشیم؟","body":"این واکنش یک رفلکس نخاعی است. گیرنده‌های پوست پیام گرما را به‌وسیله عصب حسی به نخاع می‌فرستند. نخاع بدون این‌که منتظر دستور مغز بماند، پیام را از راه عصب حرکتی به ماهیچه دست می‌رساند؛ ماهیچه منقبض می‌شود و دست عقب می‌رود. این راه کوتاه باعث می‌شود بدن در کسری از ثانیه از آسیب محفوظ بماند و پس از آن مغز از ماجرا آگاه می‌شود.","pageRef":"صفحه ۲۶"},{"type":"answer","title":"نور چگونه وارد چشم می‌شود و تصویر ساخته می‌شود؟","body":"نور از سطح شفاف قرنیه وارد چشم می‌شود و از مردمک عبور می‌کند؛ میزان نور با باز و بسته شدن مردمک توسط عنبیه تنظیم می‌شود. عدسی، نور را روی شبکیه متمرکز می‌کند. گیرنده‌های نورانی شبکیه پیام را به عصب بینایی می‌دهند و عصب بینایی آن را به مغز می‌فرستد تا تصویر دیده شود.","pageRef":"صفحه ۲۰"},{"type":"note","title":"پوست؛ بزرگ‌ترین اندام حسی","body":"در زیر پوست گیرنده‌هایی برای لمس، فشار، گرما و سرما وجود دارد. پوست به ما کمک می‌کند شکل و زبری اجسام را تشخیص دهیم و از گرما و سرمای زیاد در امان بمانیم. نوک انگشتان گیرنده‌های بیشتری دارند؛ برای همین در تاریکی هم می‌توانیم با لمس، سکه را از کلید تشخیص دهیم."},{"type":"note","title":"رفلکس؛ نجات سریع بدن","body":"رفلکس پاسخ سریع و خودکار بدن به محرک است و مسیر پیام آن در نخاع کوتاه می‌شود. مثلا هنگام برخورد دست با جسم داغ، ورود جسم خارجی به چشم یا خوراکی به مجرای نفس، بدن بی‌درنگ واکنش نشان می‌دهد: پلک می‌زنیم، عطسه می‌کنیم یا دست را عقب می‌کشیم."},{"type":"exam","title":"پنج اندام حسی بدن و کار هر یک را بنویسید.","body":"چشم برای دیدن و تشخیص نور و رنگ، گوش برای شنیدن صدا و حفظ تعادل، پوست برای لمس و تشخیص گرما، سرما و فشار، بینی برای بوییدن و تشخیص بوها و زبان برای چشیدن مزه‌ها به کار می‌رود. این اندام‌ها گیرنده‌های مخصوص دارند که محرک‌ها را به پیام عصبی تبدیل می‌کنند و پیام‌ها به مغز می‌روند تا حس ایجاد شود."},{"type":"exam","title":"صدای زنگ مدرسه چگونه شنیده می‌شود؟ راه صدا را در گوش بنویسید.","body":"صدای زنگ در هوا به لاله گوش می‌رسد و از مجرای گوش خارجی به پرده صماخ می‌رود و آن را می‌لرزاند. استخوان‌های ریز گوش میانی لرزش را تقویت کرده و به حلزون گوش درونی می‌رسانند. گیرنده‌های حلزون پیام را به عصب شنوایی می‌دهند و عصب شنوایی آن را به مغز می‌فرستد تا صدای زنگ شنیده شود."}]},{"number":3,"title":"لایه‌های زمین","pages":"۳۱ تا ۴۴","contents":[{"type":"answer","title":"زمین از چه لایه‌هایی تشکیل شده است؟ هر لایه را به‌اختصار توضیح دهید.","body":"زمین سه لایه اصلی دارد: پوسته که لایه نازک و سخت سطح زمین است و ما روی آن زندگی می‌کنیم؛ گوشته که ضخیم‌ترین لایه است و سنگ‌های بخش بالایی آن نرم و خمیری‌اند و به‌آرامی جنبش دارند؛ هسته که در مرکز زمین قرار دارد، بسیار داغ است و از فلزاتی مانند آهن و نیکل ساخته شده و به دو بخش درونی و بیرونی تقسیم می‌شود.","pageRef":"صفحه ۳۴"},{"type":"answer","title":"فکر کنید: چرا پوسته زیر اقیانوس‌ها نازک‌تر از پوسته خشکی‌هاست؟","body":"پوسته اقیانوسی از سنگ‌های بازالتی متراکم و سنگین ساخته شده است؛ چون چگالی آن بیشتر است، در گوشته فرو می‌رود و لایه نازکی با ضخامت حدود ۵ تا ۱۰ کیلومتر تشکیل می‌دهد. پوسته قاره‌ای از سنگ‌های گرانیت با چگالی کمتر ساخته شده است؛ برای همین روی گوشته شناور می‌ماند و ضخامتش به بیش از ۶۰ کیلومتر می‌رسد.","pageRef":"صفحه ۳۵"},{"type":"note","title":"سنگ‌کره و سست‌کره","body":"سنگ‌کره از پوسته و بخش بالایی گوشته ساخته شده و سخت است و ضخامتی حدود ۱۰۰ کیلومتر دارد. زیر آن سست‌کره قرار دارد که سنگ‌هایش نرم و خمیری‌اند و به‌آرامی جریان دارند. حرکت این بخش، دلیل جابه‌جایی ورقه‌های سنگ‌کره و رخ دادن زمین‌لرزه و آتشفشان است."},{"type":"note","title":"گرما و فشار در عمق زمین","body":"هرچه به مرکز زمین نزدیک‌تر شویم، دما و فشار بیشتر می‌شود. در هسته دما به چند هزار درجه می‌رسد؛ با این حال هسته درونی به دلیل فشار بسیار زیاد جامد می‌ماند، اما هسته بیرونی که فشارش کمتر است مایع است. جنبش این هسته مایع، میدان مغناطیسی زمین را می‌سازد."},{"type":"exam","title":"پوسته اقیانوسی و قاره‌ای را از نظر جنس سنگ، چگالی و ضخامت مقایسه کنید.","body":"پوسته اقیانوسی از بازالت ساخته شده، چگالی بیشتر و ضخامت کمتری دارد (حدود ۵ تا ۱۰ کیلومتر) و زیر آب‌های اقیانوس قرار گرفته است. پوسته قاره‌ای از گرانیت ساخته شده، چگالی کمتر و ضخامت بیشتری دارد (تا بیش از ۶۰ کیلومتر) و شکل‌دهنده خشکی‌هاست. تفاوت چگالی باعث شده پوسته قاره‌ای مانند قایق، بالاتر روی گوشته قرار گیرد."},{"type":"exam","title":"هسته بیرونی و درونی زمین را مقایسه کنید. چرا درون‌ترین بخش زمین با وجود گرمای زیاد جامد است؟","body":"هر دو هسته از آهن و نیکل ساخته شده‌اند؛ هسته بیرونی مایع و هسته درونی جامد است. دمای هسته درونی از هسته بیرونی بیشتر است، اما فشار در آن‌جا چنان زیاد است که اتم‌های فلز را به هم فشرده نگه می‌دارد و اجازه ذوب‌شدن نمی‌دهد؛ برای همین با وجود گرمای چند هزار درجه، هسته درونی جامد باقی مانده است."}]},{"number":4,"title":"سلول و بافت","pages":"۴۵ تا ۶۰","contents":[{"type":"answer","title":"اجزای اصلی سلول را نام ببرید و کار هر یک را بنویسید.","body":"هر سلول سه بخش اصلی دارد: غشای سلولی که سلول را می‌پوشاند، از آن محافظت می‌کند و ورود و خروج مواد را کنترل می‌کند؛ سیتوپلاسم که مایع ژله‌مانند درون سلول است و اندامک‌ها در آن قرار دارند و واکنش‌های حیاتی در آن انجام می‌شود؛ هسته که مرکز کنترل سلول است، پیام‌های ارثی را نگه می‌دارد و فعالیت سلول را هدایت می‌کند.","pageRef":"صفحه ۴۹"},{"type":"answer","title":"آزمایش کنید: با مشاهده اپیدرم پیاز زیر میکروسکوپ چه چیزهایی می‌بینید؟","body":"پوسته نازک داخل پیاز را جدا کرده و روی لام می‌گذاریم؛ پس از رنگ‌آمیزی با محلول رنگ و گذاشتن لامل، زیر میکروسکوپ سلول‌های مستطیل‌شکل و منظم کنار هم دیده می‌شوند. دیواره سلولی مشخص، هسته گرد و رنگ‌پذیر در سیتوپلاسم و مرز غشا قابل مشاهده است. این مشاهده نشان می‌دهد بدن گیاهان نیز از سلول ساخته شده است.","pageRef":"صفحه ۴۷"},{"type":"note","title":"سلول پروکاریوت و یوکاریوت","body":"سلول‌های یوکاریوت هسته مشخصی دارند که ماده ژنتیکی درون آن جای گرفته است؛ سلول‌های جانوران، گیاهان و قارچ‌ها از این نوع‌اند. سلول‌های پروکاریوت مانند باکتری هسته ندارند و ماده ژنتیکی مستقیما در سیتوپلاسم قرار دارد. باکتری با آن‌که یک‌سلولی و ساده است، همه کارهای زندگی را انجام می‌دهد."},{"type":"note","title":"بافت؛ همکاری سلول‌های همکار","body":"بافت گروهی از سلول‌های شبیه به هم است که کار مشترکی انجام می‌دهند. مثلا بافت ماهیچه‌ای از سلول‌هایی ساخته شده که با انقباض، حرکت ایجاد می‌کنند؛ بافت پوششی سطح بدن را می‌پوشاند و محافظت می‌کند و بافت عصبی پیام‌ها را منتقل می‌کند. بافت‌ها کنار هم اندام‌های بدن را می‌سازند."},{"type":"exam","title":"سه تفاوت سلول گیاهی و سلول جانوری را بنویسید.","body":"سلول گیاهی علاوه بر غشا، دیواره سلولی محکمی دارد که شکل ثابت به آن می‌دهد؛ سلول جانوری دیواره ندارد. سلول گیاهی کلروپلاست دارد و فوتوسنتز می‌کند، اما سلول جانوری کلروپلاست ندارد. واکوئل سلول گیاهی بزرگ و پر از آب است و به استحکام سلول کمک می‌کند، ولی در سلول جانوری واکوئل‌ها کوچک و متعددند."},{"type":"exam","title":"میکروسکوپ نوری چگونه کار می‌کند و چه چیزهایی با آن دیده می‌شود؟","body":"میکروسکوپ نوری با استفاده از نور و عدسی‌های بزرگ‌کننده، تصویر نمونه‌های بسیار کوچک را بزرگ می‌کند. نور از نمونه نازک‌شده روی لام عبور می‌کند و عدسی‌ها آن را بزرگ می‌کنند؛ با چرخاندن قطعه چرخشی، بزرگ‌نمایی تغییر می‌کند. با آن می‌توان سلول پیاز، سلول‌های پوستی دهان، جلبک و برش‌های نازک بافت‌ها را مشاهده کرد."}]},{"number":5,"title":"اندامک‌ها و کارخانه‌ها","pages":"۶۱ تا ۷۴","contents":[{"type":"answer","title":"کار اندامک‌های زیر را بنویسید: میتوکندری، کلروپلاست، واکوئل.","body":"میتوکندری انرژی موجود در مواد غذایی را به انرژی قابل استفاده سلول تبدیل می‌کند و نیروگاه سلول نامیده می‌شود. کلروپلاست با داشتن کلروفیل، نور خورشید را جذب کرده و فوتوسنتز را انجام می‌دهد و فقط در سلول گیاهی دیده می‌شود. واکوئل محل ذخیره آب، غذا و مواد زاید است؛ در سلول گیاهی بزرگ است و به استحکام سلول کمک می‌کند.","pageRef":"صفحه ۶۴"},{"type":"answer","title":"فکر کنید: چرا سلول‌های ماهیچه قلب میتوکندری‌های بیشتری دارند؟","body":"ماهیچه قلب در طول زندگی بدون توقف منقبض می‌شود و به انرژی بسیار زیادی نیاز دارد. میتوکندری انرژی غذا را به انرژی قابل استفاده تبدیل می‌کند؛ پس هرچه فعالیت سلول بیشتر باشد، به میتوکندری بیشتری نیاز دارد. به همین دلیل در سلول‌های ماهیچه قلب و ماهیچه‌های فعال بدن، تعداد میتوکندری بسیار بیشتر از سلول‌های کم‌کار است.","pageRef":"صفحه ۶۶"},{"type":"note","title":"ریبوزوم؛ سازنده پروتئین","body":"ریبوزوم اندامک کوچکی است که پروتئین می‌سازد. پروتئین‌ها برای رشد، ترمیم و ساختن آنزیم‌ها لازم‌اند؛ پس هر سلولی به ریبوزوم نیاز دارد. ریبوزوم‌ها یا آزادانه در سیتوپلاسم شناورند یا به شبکه اندوپلاسمی چسبیده‌اند. سلول‌هایی که پروتئین زیادی می‌سازند، ریبوزوم بیشتری دارند."},{"type":"note","title":"غشای سلول؛ دروازه‌بان سلول","body":"غشای سلولی نفوذپذیری انتخابی دارد؛ یعنی اجازه می‌دهد مواد لازم مانند آب، اکسیژن و غذا وارد سلول شود و مواد زاید و ترشحات از آن خارج شود، اما از ورود مواد مضر جلوگیری می‌کند. مانند دربان یک کارخانه است که تصمیم می‌گیرد چه کسی وارد شود و چه کسی نشود."},{"type":"exam","title":"کدام اندامک را نیروگاه سلول می‌نامند؟ دلیل این نام‌گذاری را بنویسید.","body":"میتوکندری را نیروگاه سلول می‌نامند، زیرا در آن غذا همراه اکسیژن مصرف می‌شود و انرژی موجود در غذا آزاد و به شکلی تبدیل می‌شود که سلول بتواند از آن استفاده کند. سلول بدون انرژی نمی‌تواند رشد کند، مواد بسازد یا کار کند؛ پس بقای سلول به کار مداوم میتوکندری بستگی دارد. سلول‌های پرکار مثل ماهیچه قلب، میتوکندری بیشتری دارند."},{"type":"exam","title":"کلروپلاست و کلروفیل چه نقشی در سلول گیاهی دارند؟ توضیح دهید.","body":"کلروپلاست اندامکی است که رنگدانه سبز کلروفیل در آن قرار دارد. کلروفیل نور خورشید را جذب می‌کند و در کلروپلاست فوتوسنتز انجام می‌شود؛ یعنی آب و کربن دی‌اکسید با کمک انرژی نور به غذا (قند) و اکسیژن تبدیل می‌شود. به همین دلیل گیاهان خود غذا می‌سازند و رنگ سبز برگ‌ها نیز از کلروفیل است."}]},{"number":6,"title":"تقسیم سلولی","pages":"۷۵ تا ۸۸","contents":[{"type":"answer","title":"چرا بدن جانداران به تقسیم سلولی نیاز دارد؟","body":"تقسیم سلولی سه کار مهم انجام می‌دهد: رشد جاندار، زیرا بدن با افزایش تعداد سلول‌ها بزرگ می‌شود؛ ترمیم بافت‌ها، مثلا وقتی زخمی می‌شویم سلول‌های اطراف زخم تقسیم می‌شوند و جای سلول‌های از بین رفته را پر می‌کنند؛ و تولید مثل، چون سلول‌های جنسی با تقسیم میوز ساخته می‌شوند و جاندار تک‌سلولی با تقسیم، موجودی همانند خود می‌آفریند.","pageRef":"صفحه ۷۸"},{"type":"answer","title":"میتوز و میوز چه تفاوت‌هایی با هم دارند؟","body":"میتوز تقسیمی است که از یک سلول، دو سلول همانند با همان تعداد کروموزوم به دست می‌آید و برای رشد و ترمیم بدن به کار می‌رود. میوز تقسیمی ویژه است که در ساختن سلول‌های جنسی رخ می‌دهد و از یک سلول، چهار سلول با نصف تعداد کروموزوم ساخته می‌شود تا هنگام لقاح، تعداد کروموزوم گونه حفظ شود.","pageRef":"صفحه ۸۶"},{"type":"note","title":"کروموزوم؛ حافظه ارثی سلول","body":"کروموزوم‌ها رشته‌هایی درون هسته‌اند که از دی‌ان‌ای و پروتئین ساخته شده‌اند و پیام‌های وراثتی روی آن‌ها قرار دارد. هر گونه جانوری تعداد مشخصی کروموزوم دارد؛ بدن انسان ۴۶ کروموزوم دارد که نیمی از پدر و نیمی از مادر آمده است. پیش از تقسیم، کروموزوم‌ها از خود نسخه‌برداری می‌کنند تا به سلول‌های تازه برسد."},{"type":"note","title":"مراحل میتوز","body":"میتوز چهار مرحله اصلی دارد: در پیش‌میانه کروموزوم‌ها پدیدار می‌شوند و پوشش هسته از بین می‌رود؛ در میانه کروموزوم‌ها در صفحه میانی سلول می‌ایستند؛ در پس‌میانه کروموزوم‌های خواهری از هم جدا و به دو قطب کشیده می‌شوند؛ در پایان، دو هسته ساخته و سیتوپلاسم تقسیم می‌شود و دو سلول همانند به دست می‌آید."},{"type":"exam","title":"زخم پوست چگونه ترمیم می‌شود؟ نقش تقسیم سلولی را توضیح دهید.","body":"هنگام زخم شدن پوست، سلول‌های لایه زایای پوست اطراف زخم با تقسیم میتوز زیاد می‌شوند و سلول‌های تازه، جای سلول‌های آسیب‌دیده را پر می‌کنند؛ به‌تدریج بافت پوست بازسازی می‌شود و زخم می‌بندد. اگر تقسیم سلولی نبود، رشد جاندار و ترمیم زخم‌ها ممکن نمی‌شد و سلول‌های فرسوده بدن جایگزین نمی‌گرفتند."},{"type":"exam","title":"در میوز از یک سلول چند سلول و با چه تعداد کروموزومی به دست می‌آید؟ چرا این تعداد باید نصف شود؟","body":"در میوز از یک سلول، چهار سلول ساخته می‌شود که هر یک نصف تعداد کروموزوم سلول مادر را دارد؛ در انسان هر سلول جنسی ۲۳ کروموزوم دارد. این نصف شدن لازم است، زیرا هنگام لقاح، سلول جنسی پدر و مادر با هم ترکیب می‌شوند و تعداد کروموزوم به ۴۶ برمی‌گردد و در نسل‌ها ثابت می‌ماند."}]},{"number":7,"title":"کانی‌ها","pages":"۸۹ تا ۱۰۲","contents":[{"type":"answer","title":"کانی چیست؟ رابطه کانی و سنگ را توضیح دهید.","body":"کانی ماده طبیعی و جامدی است که ساختمان بلوری مشخص دارد و از یک عنصر یا ترکیبی از عناصر درست شده است؛ مثل کوارتز، نمک طعام و طلا. سنگ‌ها از یک یا چند کانی ساخته شده‌اند؛ مثلا گرانیت از کانی‌های کوارتز، فلدسپات و میکا. پس کانی جزء سازنده سنگ است و هر سنگ می‌تواند از چند کانی مختلف ساخته شده باشد.","pageRef":"صفحه ۹۲"},{"type":"answer","title":"برای شناسایی کانی‌ها از کدام ویژگی‌ها کمک می‌گیریم؟","body":"برای شناسایی کانی‌ها ویژگی‌هایی مانند براقیت یا درخشندگی سطح، رنگ، سختی (میزان مقاومت در برابر خش‌افتادن)، شکل بلورها و جرم مخصوص را بررسی می‌کنیم. مثلا کوارتز شیشه‌ای براق و بسیار سخت است، تالک بسیار نرم است و با ناخن خط می‌افتد و مغنتیت خاصیت مغناطیسی دارد و آهن را جذب می‌کند.","pageRef":"صفحه ۹۶"},{"type":"note","title":"سختی کانی و مقیاس موس","body":"سختی کانی، مقاومت آن در برابر خش‌افتادن است و در مقیاس موس از ۱ تا ۱۰ رده‌بندی می‌شود؛ تالک نرم‌ترین (۱) و الماس سخت‌ترین (۱۰) کانی است. با آزمون ساده می‌توان سختی را تشخیص داد: ناخن روی کانی گچ و سکه روی کانی کلسیت خط می‌اندازند، اما هیچ‌کدام روی کوارتز اثری نمی‌گذارند."},{"type":"note","title":"کاربرد کانی‌ها در زندگی","body":"کانی‌ها در زندگی روزمره کاربردهای فراوانی دارند: از گرافیت در نوک مداد، از نمک طعام در آشپزی، از گچ در ساختمان و پزشکی و از آهن در ساخت ابزار و اسکلت ساختمان استفاده می‌شود. طلا و نقره از کانی‌های آزادند و در جواهرسازی به کار می‌روند. حتی پودر تالک در ساخت برخی لوازم آرایشی به کار می‌رود."},{"type":"exam","title":"آزمون سختی چیست و چگونه انجام می‌شود؟ مثالی بزنید.","body":"آزمون سختی روشی برای تشخیص مقاومت کانی در برابر خش است: یک جسم معلوم مثل ناخن، سکه یا تیغه فلزی را روی سطح کانی می‌کشیم؛ اگر خط افتاد، کانی نرم‌تر از آن جسم است. مثلا ناخن روی کانی ژیپس خط می‌اندازد، پس ژیپس نرم‌تر از ناخن است، اما کوارتز ناخن و سکه را خط می‌اندازد و خودش خط نمی‌افتد."},{"type":"exam","title":"کانی‌های آزاد و ترکیبی چه تفاوتی دارند؟ با ذکر مثال توضیح دهید.","body":"کانی آزاد از یک عنصر تنها ساخته شده است؛ مثل طلا، نقره، مس و گوگرد که در طبیعت به‌صورت خالص یافت می‌شوند. کانی ترکیبی از پیوند دو یا چند عنصر به دست آمده است؛ مثل نمک طعام که از سدیم و کلر ساخته شده یا کوارتز که از سیلیسیم و اکسیژن. بیشتر کانی‌های پوسته زمین از نوع ترکیبی هستند."}]},{"number":8,"title":"سنگ‌ها","pages":"۱۰۳ تا ۱۱۶","contents":[{"type":"answer","title":"سنگ‌های آذرین چگونه تشکیل می‌شوند؟ دو مثال بنویسید.","body":"سنگ‌های آذرین از سرد و سخت شدن ماگما یا گدازه به وجود می‌آیند. اگر ماگما در عمق زمین آرام سرد شود، سنگی با بلورهای درشت به نام گرانیت پدید می‌آید که سنگ آذرین درونی نامیده می‌شود؛ اگر گدازه بر سطح زمین بریزد و به‌سرعت سرد شود، سنگ آذرین بیرونی با دانه‌های بسیار ریز مانند بازالت ساخته می‌شود.","pageRef":"صفحه ۱۰۶"},{"type":"answer","title":"چرخه سنگ را توضیح دهید.","body":"سنگ‌ها همیشه تغییر می‌کنند: سنگ آذرین در اثر هوازدگی خرد می‌شود، ذرات آن جابه‌جا و ته‌نشین شده و سنگ رسوبی می‌سازد. سنگ رسوبی یا آذرین اگر در عمق زمین گرما و فشار زیاد ببیند، به سنگ دگرگون مانند مرمر تبدیل می‌شود. اگر سنگ‌ها در عمق زمین ذوب شوند، ماگما ساخته می‌شود و از سرد شدن آن دوباره سنگ آذرین پدید می‌آید؛ این چرخه بی‌پایان است.","pageRef":"صفحه ۱۱۴"},{"type":"note","title":"فسیل و سنگ رسوبی","body":"سنگ رسوبی از ته‌نشین شدن ذرات در بستر دریا و خشکی ساخته می‌شود و معمولا لایه‌لایه است. موجوداتی که در رسوبات مدفون می‌شوند ممکن است به فسیل تبدیل شوند؛ به همین دلیل بیشتر فسیل‌ها مانند صدف و استخوان ماهی در سنگ‌های رسوبی یافت می‌شوند. فسیل‌ها راهنمای خوبی برای شناخت گذشته زمین‌اند."},{"type":"note","title":"سنگ دگرگون؛ تغییر با گرما و فشار","body":"سنگ دگرگون از تغییر سنگ‌های دیگر در عمق زمین و زیر گرما و فشار زیاد به دست می‌آید؛ سنگ‌ها ذوب نمی‌شوند اما ساختمان و کانی‌هایشان دگرگون می‌شود. مثلا سنگ آهک به مرمر، شیل به لوح و ماسه‌سنگ به کوارتزیت تبدیل می‌شود. مرمر سنگی زیباست و در ساختمان‌سازی و مجسمه‌سازی کاربرد فراوان دارد."},{"type":"exam","title":"تفاوت سنگ آذرین درونی و بیرونی را از نظر محل تشکیل و اندازه بلورها بنویسید.","body":"سنگ آذرین درونی از سرد شدن تدریجی ماگما در عمق زمین به دست می‌آید؛ چون سرد شدن کند است، بلورهای درشت و قابل دیدن دارد و گرانیت نمونه آن است. سنگ آذرین بیرونی از سرد شدن سریع گدازه در سطح زمین ساخته می‌شود؛ چون زمان کافی برای رشد بلورها نیست، دانه‌های آن بسیار ریز است و بازالت نمونه آن است."},{"type":"exam","title":"چرا در سنگ‌های دگرگون فسیل پیدا نمی‌شود؟ توضیح دهید.","body":"سنگ دگرگون در عمق زمین و زیر گرما و فشار بسیار زیاد شکل می‌گیرد. در این شرایط، بافت موجودات زنده‌ای که در سنگ اصلی بوده‌اند از بین می‌رود و ساختمان سنگ به‌کلی تغییر می‌کند؛ پس فسیل‌ها نابود می‌شوند. به همین دلیل فسیل‌ها بیشتر در سنگ‌های رسوبی دیده می‌شوند که بدون گرما و فشار زیاد ساخته شده‌اند."}]},{"number":9,"title":"ورزش و نیرو","pages":"۱۱۷ تا ۱۳۲","contents":[{"type":"answer","title":"نیرو چیست و چه اثرهایی بر اجسام دارد؟","body":"نیرو کشیدن یا فشار آوردن است که هنگام تماس یا حتی از دور به جسم وارد می‌شود و با نیوتون اندازه‌گیری می‌شود. نیرو می‌تواند جسم ساکن را به حرکت درآورد، سرعت جسم متحرک را کم یا زیاد کند، جهت حرکت آن را تغییر دهد و شکل اجسام را عوض کند؛ مانند کشیدن کش یا خم کردن برگ فلز با فشار انگشتان.","pageRef":"صفحه ۱۲۰"},{"type":"answer","title":"فکر کنید: در بازی طناب‌کشی اگر دو گروه با نیروی برابر بکشند، طناب چه حالتی دارد؟","body":"وقتی دو نیروی برابر در جهت‌های مخالف به جسم وارد می‌شوند، نیروی خالص وارد بر آن صفر است و حالت حرکت جسم تغییر نمی‌کند؛ پس طناب و گروه‌ها ساکن می‌مانند و هیچ‌کس به سمت دیگری کشیده نمی‌شود. برنده بازی گروهی است که نیروی بیشتری وارد کند تا نیروی خالص در جهت او به طناب اثر کند.","pageRef":"صفحه ۱۲۴"},{"type":"note","title":"نیروی خالص (برآیند نیروها)","body":"وقتی چند نیرو به یک جسم وارد می‌شود، اثر همه آن‌ها با هم یک نیروی خالص می‌سازد. اگر نیروها هم‌جهت باشند با هم جمع می‌شوند و حرکت را شتاب‌دار می‌کنند؛ اگر مخالف‌جهت باشند از هم کم می‌شوند. مثلا وقتی هم‌کلاسی‌های شما میز را در یک جهت هل می‌دهند، میز راحت‌تر حرکت می‌کند."},{"type":"note","title":"اصطکاک؛ همیشه حاضر","body":"اصطکاک نیرویی است که هنگام حرکت یا تلاش برای حرکت، دو سطح در تماس بر هم وارد می‌کنند و همیشه مخالف حرکت است. این نیرو گاه مفید است؛ مانند چسبیدن کف کفش به زمین هنگام راه رفتن و عمل کردن ترمز دوچرخه و گاه زیان‌آور؛ برای کم کردن آن از روان‌کننده و غلتک استفاده می‌کنند."},{"type":"exam","title":"با ذکر مثال نشان دهید نیرو می‌تواند شکل اجسام را تغییر دهد و حالت حرکت را عوض کند.","body":"تغییر شکل: هنگام کشیدن کش و فشار روی گیره کاغذ، شکل آن‌ها عوض می‌شود و فشرده شدن توپ فوتبال زیر پای بازیکن نیز نمونه‌ای دیگر است. تغییر حالت حرکت: ضربه به توپ ساکن آن را به حرکت درمی‌آورد و اثر ترمز در دوچرخه سرعت آن را کم می‌کند. حتی تغییر جهت توپ با ضربه سر بازیکن هم از اثرهای نیروست."},{"type":"exam","title":"چرا آج‌دار بودن کف کفش ورزشی به ورزشکار کمک می‌کند؟ توضیح دهید.","body":"اصطکاک میان کف کفش و زمین مانع لیز خوردن می‌شود. آج‌های کف کفش، سطح تماس را ناصاف می‌کنند و اصطکاک را زیاد می‌کنند؛ در نتیجه ورزشکار هنگام دویدن، جهش و تغییر جهت سریع تعادل بیشتری دارد و نیروی پاهایش کامل به زمین منتقل می‌شود. اگر کف کفش صاف باشد، اصطکاک کم است و ورزشکار می‌لغزد."}]},{"number":10,"title":"چگونه حرکت می‌کنیم؟","pages":"۱۳۳ تا ۱۴۶","contents":[{"type":"answer","title":"استخوان‌بندی بدن چه وظایفی دارد؟","body":"اسکلت بدن چند کار مهم انجام می‌دهد: شکل و استحکام به بدن می‌دهد و بدن را پابرجا نگه می‌دارد؛ اندام‌های ظریف مثل مغز، قلب و شش‌ها را محافظت می‌کند؛ به کمک ماهیچه‌ها و مفصل‌ها در حرکت بدن نقش اهرم را بازی می‌کند؛ سلول‌های خون در مغز استخوان ساخته می‌شود و کانی‌های بدن مانند کلسیم در استخوان ذخیره می‌شود.","pageRef":"صفحه ۱۳۶"},{"type":"answer","title":"فکر کنید: چرا تعداد استخوان‌های بدن نوزاد بیشتر از بزرگسال است؟","body":"بدن نوزاد حدود ۳۰۰ استخوان دارد، اما در بزرگسال این عدد به ۲۰۶ می‌رسد؛ زیرا بعضی استخوان‌های نوزاد از چند بخش جدا ساخته شده‌اند که با گذر زمان و رشد بدن به هم جوش می‌خورند و یک استخوان می‌سازند؛ مانند استخوان‌های جمجمه و بخش‌هایی از ستون مهره. این جوش‌خوردن باعث استحکام بیشتر اسکلت بزرگسال می‌شود.","pageRef":"صفحه ۱۳۸"},{"type":"note","title":"مفصل؛ محل اتصال استخوان‌ها","body":"جایی که دو استخوان به هم متصل می‌شوند مفصل نامیده می‌شود. مفصل متحرک مانند زانو، آرنج و شانه حرکت زیاد اجازه می‌دهد؛ مفصل نیمه‌متحرک مانند مفصل‌های ستون مهره حرکت کمتری دارد و مفصل ثابت مانند درزهای جمجمه اجازه حرکت نمی‌دهد. در مفصل‌های متحرک، غضروف و مایع لغزنده استخوان‌ها را از سایش حفظ می‌کند."},{"type":"note","title":"ماهیچه؛ موتور حرکت","body":"ماهیچه‌ها با انقباض و انبساط، استخوان‌ها را می‌کشند و حرکت ایجاد می‌کنند؛ ماهیچه فقط می‌کشد و هرگز فشار نمی‌آورد. بدن سه نوع ماهیچه دارد: ماهیچه استخوانی که ارادی است و حرکت بدن را می‌سازد، ماهیچه قلبی که غیرارادی است و خون را تلمبه می‌کند و ماهیچه صاف که در دیواره اندام‌های درونی مانند روده قرار دارد."},{"type":"exam","title":"هنگام خم کردن بازو، ماهیچه و استخوان چه نقشی دارند؟ توضیح دهید.","body":"ماهیچه دوسر در جلوی بازو هنگام خم شدن منقبض می‌شود، کوتاه می‌شود و استخوان ساعد را به سمت شانه می‌کشد تا بازو خم شود؛ هم‌زمان ماهیچه سه‌سر پشت بازو منبسط می‌شود. برای صاف کردن بازو نقش‌ها عوض می‌شود و سه‌سر منقبض می‌گردد. استخوان‌ها مانند اهرم عمل می‌کنند و مفصل آرنج نقطه چرخش است."},{"type":"exam","title":"چرا استخوان‌ها با این‌که سخت‌اند، شکستن آن‌ها به‌سختی رخ می‌دهد و سبک هستند؟","body":"استخوان ترکیبی هوشمندانه است: لایه بیرونی آن از ماده استخوانی سخت و مقاوم ساخته شده و درون آن ساختاری لانه‌زنبوری و سبک وجود دارد که فشار را پخش می‌کند؛ به همین دلیل استخوان هم‌زمان مقاوم و سبک است و حرکت را آسان می‌کند. غضروف مفصلی و مایع مفصلی نیز ضربه‌ها را می‌گیرند و از آسیب کم می‌کنند."}]},{"number":11,"title":"اجسام اطراف ما","pages":"۱۴۷ تا ۱۶۶","contents":[{"type":"answer","title":"چگالی چیست و چگونه محاسبه می‌شود؟ مثال بزنید.","body":"چگالی نشان می‌دهد در هر واحد حجم ماده چه مقدار جرم وجود دارد و از تقسیم جرم بر حجم به دست می‌آید: چگالی برابر است با جرم تقسیم بر حجم. مثلا اگر جسمی جرم ۵۴ گرم و حجم ۲۰ سانتی‌متر مکعب داشته باشد، چگالی آن ۵۴ تقسیم بر ۲۰ برابر ۲٫۷ گرم بر سانتی‌متر مکعب می‌شود. واحد چگالی گرم بر سانتی‌متر مکعب یا کیلوگرم بر متر مکعب است.","pageRef":"صفحه ۱۵۶"},{"type":"answer","title":"فکر کنید: چرا کره چوب روی آب شناور می‌ماند ولی کره آهن به ته ظرف می‌رود؟","body":"شناور ماندن به چگالی بستگی دارد. چگالی چوب کمتر از چگالی آب است؛ پس روی آب می‌ماند. چگالی آهن از آب بیشتر است؛ برای همین در آب فرو می‌رود. نکته مهم این است که شناوری اجسام توخالی به چگالی کل آن‌ها بستگی دارد؛ برای همین کشتی بزرگ آهنی شناور می‌ماند، چون حجم زیادی هوا درونش است و چگالی میانگینش از آب کمتر است.","pageRef":"صفحه ۱۵۸"},{"type":"note","title":"مواد طبیعی و مهندسی‌شده","body":"مواد طبیعی همان‌گونه که در طبیعت یافت می‌شوند به کار می‌روند؛ مانند چوب، پنبه، پشم و سنگ. مواد مهندسی‌شده با تغییر مواد طبیعی یا ساختن ترکیب‌های تازه به دست می‌آیند تا ویژگی‌های بهتری داشته باشند؛ مانند پلاستیک، شیشه، بتن و آلیاژها. مثلا بتن از ترکیب سیمان، شن و ماسه، بسیار مقاوم‌تر از هر جزء به‌تنهایی است."},{"type":"note","title":"فلزها و ویژگی‌های مشترک آن‌ها","body":"فلزها مانند آهن، آلومینیوم، مس و طلا ویژگی‌های مشترکی دارند: گرما و برق را خوب هدایت می‌کنند، براق‌اند، می‌توان آن‌ها را چکش‌کاری کرد و به ورقه و سیم تبدیل کرد و چگالی بیشتر معمولا دارند. به همین دلیل از مس در سیم برق و از آلومینیوم در ساخت ظروف و بدنه هواپیما استفاده می‌شود."},{"type":"exam","title":"جرم جسمی ۵۴ گرم و حجم آن ۲۰ سانتی‌متر مکعب است. چگالی آن را حساب کنید و بگویید در آب شناور می‌ماند یا غرق می‌شود؟","body":"چگالی از تقسیم جرم بر حجم به دست می‌آید: ۵۴ تقسیم بر ۲۰ برابر ۲٫۷ گرم بر سانتی‌متر مکعب. چگالی آب ۱ گرم بر سانتی‌متر مکعب است؛ چون چگالی این جسم از آب بیشتر است، در آب غرق می‌شود. اگر چگالی جسمی کمتر از چگالی آب باشد، آن جسم روی آب شناور می‌ماند."},{"type":"exam","title":"چرا برای بدنه هواپیما از آلومینیوم استفاده می‌شود و نه آهن؟ ویژگی‌های ماده را بنویسید.","body":"در انتخاب ماده برای هر ساختمان باید ویژگی‌های آن را بسنجیم. بدنه هواپیما باید سبک باشد تا پرواز آسان شود، اما در برابر ضربه و تغییر دما هم مقاوم بماند. آلومینیوم با این‌که فلزی محکم و براق است، چگالی بسیار کمتری از آهن دارد و زنگ هم نمی‌زند؛ برای همین انتخاب بهتری است. آهن چگالی بالایی دارد و هواپیما را سنگین می‌کند."}]},{"number":12,"title":"مایه‌های حیات","pages":"۱۶۷ تا ۱۸۴","contents":[{"type":"answer","title":"چرا آب را مایه حیات می‌نامند؟","body":"آب برای همه جانداران حیاتی است: بخش بزرگی از بدن جانداران آب است؛ آب حلال بسیار خوبی است و مواد غذایی و دفع‌شدنی را در بدن جابه‌جا می‌کند؛ در واکنش‌های حیاتی بدن شرکت می‌کند و به تنظیم دمای بدن کمک می‌کند؛ مثلا عرق کردن بدن را خنک می‌کند. بدون آب، گیاه فوتوسنتز نمی‌کند و خون در بدن جریان نمی‌یابد.","pageRef":"صفحه ۱۷۰"},{"type":"answer","title":"آب خالص در چه دمایی یخ می‌زند و در چه دمایی می‌جوشد؟ چه عواملی این دماها را تغییر می‌دهند؟","body":"آب خالص در فشار سطح دریا در دمای صفر درجه سلسیوس منجمد می‌شود و در دمای ۱۰۰ درجه سلسیوس می‌جوشد. این دماها با تغییر فشار و وجود ناخالصی تغییر می‌کنند: در ارتفاعات که فشار هوا کمتر است، آب در دمای کمتری می‌جوشد و اضافه کردن نمک یا شکر، نقطه انجماد را پایین می‌آورد و نقطه جوش را کمی بالا می‌برد.","pageRef":"صفحه ۱۷۴"},{"type":"note","title":"خاصیت غیرعادی آب؛ شناور ماندن یخ","body":"برخلاف بیشتر مواد که حالت جامد آن‌ها از حالت مایع متراکم‌تر است، چگالی یخ کمتر از آب است؛ به همین دلیل یخ روی آب شناور می‌ماند. آب در دمای حدود ۴ درجه سلسیوس چگال‌ترین حالت را دارد. این ویژگی باعث می‌شود دریاچه‌ها از سطح یخ بزنند و ماهی‌ها در آب زیر یخ به زندگی ادامه دهند."},{"type":"note","title":"آب؛ حلال جهانی","body":"آب به دلیل ساختمان مولکولی‌اش، مواد زیادی را در خود حل می‌کند و به همین دلیل حلال جهانی نامیده می‌شود. نمک و شکر در آب حل می‌شوند و آب نمک و شربت می‌سازند. این ویژگی در طبیعت هم مهم است: آب باران کانی‌ها را حل کرده و به دریا می‌برد و خون که بیشترش آب است، مواد لازم را به سلول‌ها می‌رساند."},{"type":"exam","title":"چرا دریاچه‌ها از سطح یخ می‌زنند ولی آب زیر یخ مایع می‌ماند و ماهی‌ها زنده می‌مانند؟","body":"چون چگالی یخ کمتر از آب است، یخ تشکیل‌شده روی سطح دریاچه شناور می‌ماند و مانند پوششی آب زیرین را از هوای سرد بیرون حفظ می‌کند. آب در دمای حدود ۴ درجه چگال‌ترین است و به ته می‌رود؛ پس در زیر لایه یخ، آب مایع با دمای بالاتر باقی می‌ماند و ماهی‌ها و دیگر جانداران آبزی می‌توانند به زندگی ادامه دهند."},{"type":"exam","title":"چرا در زمستان به جاده‌های سردسیر نمک می‌ریزند؟ پاسخ را با مفهوم نقطه انجماد توضیح دهید.","body":"اضافه کردن ناخالصی مانند نمک به آب، نقطه انجماد آن را پایین می‌آورد؛ یعنی محلول آب و نمک در دمای زیر صفر هم مایع می‌ماند و یخ نمی‌زند. وقتی به برف و یخ جاده نمک می‌ریزند، آب حاصل از ذوب برف دیرتر یخ می‌زند و جاده لیز نمی‌شود؛ در نتیجه چسبندگی لاستیک به جاده حفظ می‌شود و خطر تصادف کاهش می‌یابد."}]}]},{"title":"فارسی هفتم","subject":"فارسی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب فارسی هفتم","color":"purple","icon":"book","chapters":[{"number":1,"title":"ستایش: خداوند جان و خرد","pages":"۶ تا ۸","contents":[{"type":"answer","title":"شاعر در ستایش، خداوند را با چه نام‌ها و صفاتی می‌خواند؟","body":"شاعر خدا را «خداوند جان و خرد» می‌خواند؛ یعنی آفریننده‌ی جان و اندیشه‌ی انسان. او را «حافظ اسرار نهان» می‌نامد که رازهای پنهان همه‌ی آفریدگان را می‌داند؛ «پناه جان‌ها و دل‌ها»ست و «ستار خطا و گناه»؛ یعنی عیب‌ها و لغزش‌های بندگانش را می‌پوشاند.","pageRef":"صفحه ۶"},{"type":"answer","title":"واژه‌های «اسرار» و «ستار» در ستایش به چه معنا هستند؟","body":"«اسرار» جمع «سِرّ» است و به معنی رازها و نهفته‌ها می‌آید. «ستار» یعنی پوشاننده؛ خداوند لغزش‌ها و گناهان بنده‌هایش را در برابر دیگران می‌پوشاند و همین کرامت او سبب می‌شود انسان با امید به درگاهش بازگردد و توبه کند.","pageRef":"صفحه ۷"},{"type":"note","title":"آرایه کنایه در شعر ستایش","body":"کنایه سخنی است که معنای اصلی آن از معنای ظاهری فاصله دارد. در عبارت «حافظ اسرار نهان» کنایه از دانایی و آگاهی بی‌پایان خداوند است. همچنین «پناه جان‌ها و دل‌ها» کنایه از این است که انسان برای آرامش دل به غیر خدا پناهگاهی ندارد."},{"type":"note","title":"واژه‌نامه ستایش","body":"اسرار: رازها. ستار: پوشاننده. خطا: اشتباه و لغزش. گناه: نافرمانی. جان و خرد: دو نعمت بزرگ خداوند به انسان که شاعر با ستایش آن‌ها، آغاز سخن را بر توحید و شناخت آفریدگار استوار می‌کند."},{"type":"exam","title":"معنی بیت «خداوند جان و خرد / حافظ اسرار نهان» را بنویسید.","body":"ای آفریننده‌ی جان و اندیشه‌ی انسان، ای دانای رازهای پنهان! شاعر در این بیت خدا را با ویژگی آفرینندگی و دانایی بی‌کران می‌ستاید و نشان می‌دهد هیچ رازی از چشم او پنهان نیست؛ پس انسان باید همیشه مراقب گفتار و کردار خود باشد."},{"type":"exam","title":"از ستایش چه پندها و مفاهیمی می‌توان گرفت؟ پاسخ تشریحی بنویسید.","body":"مفاهیم اصلی ستایش توحید، دانایی خدا و رازداری اوست. انسان باید جان و خرد را نعمت خدا بداند و شکرگزار باشد، در سختی‌ها به درگاه او پناه ببرد و از آن‌که خدا عیب‌ها را می‌پوشاند، درس فروتنی و بخشندگی بگیرد. این سه پیام، ستون شعر است."}]},{"number":2,"title":"بشنوید","pages":"۹ تا ۱۸","contents":[{"type":"answer","title":"چرا شاعر خوانندگان را به «شنیدن» فرا می‌خواند؟","body":"شاعر با فعل امر «بشنوید» خواننده را دعوت می‌کند با گوش و دل به سخن‌های خردمندانه گوش بسپارد؛ زیرا شنیدن گام نخست دانستن است. کسی که خوب می‌شنود، از تجربه‌ی دیگران بهره می‌برد، نصیحت‌های خوب را می‌پذیرد و راه زندگی را بهتر می‌یابد.","pageRef":"صفحه ۹"},{"type":"answer","title":"پیام اصلی شعر بشنوید چیست؟","body":"پیام شعر این است که آدمی باید شنونده‌ای خوب باشد؛ چرا که پند پدر و مادر، گفتار خردمندان و حتی آواز آفرینش، همه در گوش سپردن معنا می‌یابد. شنیدن با جان و دل، راه ورود خرد به دل است و انسان را به شادکامی و رشد می‌رساند.","pageRef":"صفحه ۱۱"},{"type":"note","title":"دستور زبان: فعل امر","body":"فعل امر برای فرمان دادن یا درخواست کردن به کار می‌رود. «بشنوید» فعل امر دوم شخص جمع از مصدر «شنیدن» است. نمونه‌های دیگر: «بخوان»، «بیا»، «بنگر». فعل امر برای مخاطب دوم و سوم ساخته می‌شود و زمان ندارد؛ یعنی گذشته و آینده نمی‌پذیرد."},{"type":"note","title":"قافیه و ردیف در شعر","body":"قافیه واژه‌هایی است که در پایان مصراع‌ها هم‌آهنگ‌اند و ردیف واژه‌ی تکراری پس از قافیه است؛ مانند «می‌کند / حکایت می‌کند». این دو، آهنگ شعر را زیبا می‌کنند. برای فهمیدن معنی واژه‌های دشوار شعر نیز از واژه‌نامه‌ی پایان کتاب کمک بگیرید."},{"type":"exam","title":"فعل «بشنوید» را از نظر ساخت و نوع مشخص کنید.","body":"«بشنوید» از مصدر «شنیدن» ساخته شده است. بن مضارع آن «شنو» است و با شناساگر امر، فعل امر دوم شخص جمع می‌سازد؛ به معنی گوش سپردن و فرمان شنیدن. فعل امر نه ماضی دارد و نه آینده و هدف آن برانگیختن مخاطب به عمل است."},{"type":"exam","title":"پیام شعر بشنوید را با یک مثال از زندگی روزانه توضیح دهید.","body":"شنیدن فعال پایه‌ی یادگیری است. دانش‌آموزی که به توضیح معلم با دقت گوش می‌دهد، درس را بهتر می‌فهمد و فرزندی که سخن پدر و مادر را می‌شنود، از خطاها دور می‌ماند. شاعر همین را می‌خواهد: پیش از سخن گفتن، خوب شنیدن را بیاموزیم."}]},{"number":3,"title":"زیبایی شکفتن","pages":"۱۹ تا ۳۰","contents":[{"type":"answer","title":"شاعر در شعر زیبایی شکفتن از چه زیبایی‌هایی سخن می‌گوید؟","body":"شاعر زیبایی‌های بهار را تصویر می‌کند: شکفتن غنچه‌ها، بازگشت زندگی به طبیعت، نغمه‌ی پرندگان و طراوت گیاهان. از دید او این‌ها نشانه‌ی قدرت خداوند است که هر سال دوباره به زمین جان می‌بخشد و دل انسان را سرشار از امید و شادابی می‌کند.","pageRef":"صفحه ۱۹"},{"type":"answer","title":"چرا شکفتن غنچه‌ها نماد زیبایی آفرینش است؟","body":"شکفتن آغاز زندگی و پیدایش رنگ و عطر است. غنچه‌ای که می‌شکفد نشان می‌دهد زیبایی‌های پنهان کم‌کم آشکار می‌شوند. شاعر از این پدیده‌ی ساده پیام امید می‌گیرد: پس از روزهای سرد، بهار می‌آید و دل‌ها هم مانند غنچه‌ها دوباره می‌شکفند.","pageRef":"صفحه ۲۱"},{"type":"note","title":"آرایه تشخیص (جان‌بخشی)","body":"تشخیص آرایه‌ای است که در آن به غیرانسان رفتار انسان نسبت می‌دهیم. وقتی در شعر، غنچه «می‌خندد» یا پرنده «سخن می‌گوید»، شاعر از تشخیص بهره برده است. این آرایه تصویر شعر را زنده و باورپذیر می‌کند و خواننده را با طبیعت همراه می‌سازد."},{"type":"note","title":"واژه‌نامه: شکفتن و هم‌خانواده‌های آن","body":"شکفتن: باز شدن غنچه و آغاز روییدن. شکوفه: گل درخت میوه. شکوفایی: به بار نشستن و پیشرفت. این واژه‌ها هم‌خانواده‌اند؛ یعنی از یک ریشه‌اند و در معنی به هم نزدیک. شناخت هم‌خانواده‌ها در پرسش‌های واژه‌شناسی امتحان بسیار پرتکرار است."},{"type":"exam","title":"مفهوم کلی شعر زیبایی شکفتن را با واژه‌های خودتان بیان کنید.","body":"شاعر می‌گوید بهار آمده و زمین بی‌جان، لباس تازه‌ی سبز پوشیده است؛ غنچه‌ها می‌شکفند و آواز پرندگان فضا را شاد می‌کند. این رستاخیز طبیعت، هدیه‌ی خداوند به آفرینش است و یادآوری می‌کند که پس از هر سختی، روزی روشن در راه است."},{"type":"exam","title":"تشخیص را با دو نمونه از این درس توضیح دهید.","body":"تشخیص یعنی جان‌بخشی به غیرانسان. در این درس غنچه مانند انسان لبخند می‌زند و باد در میان گل‌ها می‌گذرد و با آن‌ها سخن می‌گوید. چون غنچه و باد نمی‌توانند بخندند و سخن بگویند، این دو نمونه آرایه‌ی تشخیص شمرده می‌شوند و شعر را زنده می‌کنند."}]},{"number":4,"title":"روش مطالعه","pages":"۳۱ تا ۴۲","contents":[{"type":"answer","title":"نویسنده برای مطالعه‌ی مؤثر چه راه‌هایی پیشنهاد می‌کند؟","body":"مطالعه باید هدفمند و پیوسته باشد: نخست متن را با دقت بخوانیم، سپس نکته‌های مهم را زیر خط بکشیم یا خلاصه کنیم، برای خود پرسش بسازیم و پس از چند روز مطالب را مرور کنیم. مطالعه‌ی بی‌تمرکز و بی‌مرور، یادگیری را کم‌اثر می‌کند.","pageRef":"صفحه ۳۱"},{"type":"answer","title":"چرا نویسنده مطالعه را تنها خواندن نمی‌داند؟","body":"زیرا خواندنِ بی‌اندیشی فایده‌ای ندارد. مطالعه‌ی واقعی یعنی اندیشیدن، پرسش کردن، پیوند دادن مطالب تازه با دانسته‌های پیشین و به کار بستن آن‌ها در زندگی. کسی که فقط چشمش روی سطرها می‌گردد و نمی‌اندیشد، چیزی به دانایی‌اش افزوده نمی‌شود.","pageRef":"صفحه ۳۴"},{"type":"note","title":"دستور زبان: جمله‌های خبری و انشایی","body":"جمله‌ی خبری چیز تازه‌ای به مخاطب می‌آموزد، مانند «مطالعه زندگی را زیبا می‌کند» و می‌توان از آن پرسش «آیا...؟» ساخت. جمله‌ی انشایی برای فرمان یا درخواست است، مانند «هر روز مطالعه کن». در متن‌های آموزشی بیشتر از جمله‌های خبری استفاده می‌شود."},{"type":"note","title":"واژه‌نامه روش مطالعه","body":"اثربخش: سودمند و مؤثر. تمرکز: جمع شدن توجه بر یک کار. مرور: بازخوانی مطالب برای ماندگاری آن‌ها. عادت: کاری که با تکرار برای انسان خودکار می‌شود. دانستن معنی این واژه‌ها فهم درس و پاسخ دادن به سوال‌های واژگانی را آسان می‌کند."},{"type":"exam","title":"سه ویژگی مطالعه‌ی خوب را بنویسید و توضیح دهید.","body":"۱. هدفمندی: بدانیم چرا و برای چه می‌خوانیم. ۲. تمرکز: دور از سر و صدا و با ذهن آماده مطالعه کنیم. ۳. مرور و خلاصه‌نویسی: نکته‌ها را یادداشت کنیم و هر چند روز بازخوانی کنیم. با این سه ویژگی مطالب پایدار می‌ماند و وقت هدر نمی‌رود."},{"type":"exam","title":"نوع جمله‌ها را مشخص کنید: «روزانه مطالعه کن.» و «کتاب دوست خوب ماست.»","body":"جمله‌ی «روزانه مطالعه کن» انشایی است؛ زیرا فرمان می‌دهد و گوینده چیزی را خبر نمی‌دهد. جمله‌ی «کتاب دوست خوب ماست» خبری است؛ زیرا اطلاعاتی درباره‌ی کتاب می‌دهد و می‌توان پرسش «آیا کتاب دوست خوب ماست؟» ساخت. شناخت این دو نوع جمله در دستور مهم است."}]},{"number":5,"title":"از همدلی چه می‌دانیم؟","pages":"۴۳ تا ۵۴","contents":[{"type":"answer","title":"نویسنده همدلی را چگونه تعریف می‌کند؟","body":"همدلی یعنی کوشش برای فهمیدن احساسات دیگری و دیدن جهان از چشم او. انسان همدل در شادی و غم دیگران سهیم می‌شود، به جای سرزنش درک می‌کند و آماده است برای یاری او کاری انجام دهد. همدلی پایه‌ی دوستی و مهربانی در جامعه است.","pageRef":"صفحه ۴۳"},{"type":"answer","title":"فایده‌های همدلی در زندگی چه هستند؟","body":"همدلی انسان‌ها را به هم نزدیک می‌کند، دل‌گیری‌ها را کم می‌کند و راه کمک و راهنمایی را باز می‌کند. کسی که همدلی می‌آموزد، در خانه با خانواده مهربان‌تر است، در مدرسه دوستان بهتری می‌یابد و در جامعه به آرامش، اعتماد و وحدت کمک می‌کند.","pageRef":"صفحه ۴۵"},{"type":"note","title":"واژه‌های هم‌خانواده‌ی «دل»","body":"واژه‌های دلسوز، دلگیر، دل‌شکسته، دلباخته و دلپذیر هم‌خانواده‌ی واژه‌ی «دل» هستند؛ زیرا ریشه‌ی آن‌ها یکی است و در معنی به هم می‌پیوندند. در امتحان‌ها معمولا می‌خواهند هم‌خانواده‌ی یک واژه را بنویسید یا واژه‌ی بیگانه در مجموعه را بیابید."},{"type":"note","title":"دستور زبان: حروف ربط","body":"حروف ربط مانند «و»، «اما»، «یا» و «ولی» واژه‌ها و جمله‌ها را به هم پیوند می‌دهند. در این درس ترکیب‌هایی مانند «همدلی و همراهی» با حرف ربط «و» عطف شده‌اند. شناخت حروف ربط در بازشناسی جمله‌ها و فهم پیوند معنایی متن کمک می‌کند."},{"type":"exam","title":"تفاوت همدلی و ترحم چیست؟ پاسخ تشریحی بنویسید.","body":"ترحم نگاهی از بالا به پایین است و گاه فقط دل‌سوزی می‌آورد؛ اما همدلی برخاسته از برابری است: خود را جای دیگری می‌گذاریم و احساس او را می‌فهمیم. همدل نه فقط احساس می‌کند، بلکه در صورت نیاز عمل هم می‌کند؛ پس همدلی سازنده‌تر و پایدارتر است."},{"type":"exam","title":"مترادف و متضاد واژه‌های «همدلی»، «کوشش» و «درک» را بنویسید.","body":"همدلی: مترادف هم‌رنجی و هم‌احساسی، متضاد بی‌مهری. کوشش: مترادف تلاش و سعی، متضاد سستی و تنبلی. درک: مترادف فهم و ادراک، متضاد نادانی و بی‌خبری. در پاسخ‌های واژگانی، پیش از نوشتن، معنی دقیق واژه را در ذهن مرور کنید."}]},{"number":6,"title":"این چنین گفت ماهتاب","pages":"۵۵ تا ۶۶","contents":[{"type":"answer","title":"در این شعر ماه چگونه تصویر شده است و چه می‌بیند؟","body":"ماه مانند انسانی آگاه و مهربان جان گرفته است؛ شب‌ها بر زمین می‌تابد و خسته‌ها و بیداران شب را تماشا می‌کند. او زیبایی‌های شب، سکوت کوچه‌ها و آرزوهای آدم‌ها را می‌بیند و برای همه امید و آرامش می‌آورد؛ زیرا نور، پیام مهر و روشنی است.","pageRef":"صفحه ۵۵"},{"type":"answer","title":"پیام شعر این چنین گفت ماهتاب چیست؟","body":"پیام شعر امید، مهربانی و روشنی‌بخشی است: مانند ماه در تاریکی‌های زندگی دیگران چراغی باشیم. شاعر نشان می‌دهد زیبایی واقعی در خدمت گرفتن برای خوشبختی دیگران است، نه تنها داشتن چهره‌ای زیبا و دور از دسترس. نور ماه، مهر را یادآور می‌شود.","pageRef":"صفحه ۵۸"},{"type":"note","title":"آرایه تشخیص در این شعر","body":"در این شعر ماه جان گرفته است؛ سخن می‌گوید، می‌شنود و احساس دارد. نسبت دادن گفتار و احساس به ماه، آرایه‌ی تشخیص است. با این آرایه شاعر طبیعت را به انسان نزدیک می‌کند و شعر را دلنشین می‌سازد. نمونه دیگر: «ستاره‌ها لبخند زدند»."},{"type":"note","title":"واژه‌نامه: ماهتاب و واژه‌های وابسته","body":"ماهتاب: نور ماه در شب. تاب: نور و فروغ؛ پس مهتاب همان ماهتاب است و آفتاب یعنی نور خورشید. آرامش: آسایش و بی‌نگرانی. این واژه‌ها فضای سکوت و روشنی شب را می‌سازند و در سوال‌های املا و معنی واژه بسیار پرتکرارند."},{"type":"exam","title":"آرایه تشخیص در این شعر چه نقشی دارد؟ پاسخ تشریحی بنویسید.","body":"تشخیص، ماه را به شخصیتی داستانی بدل می‌کند که تجربه‌های شبانه‌ی آدمیان را از نزدیک می‌بیند و سخن‌های امیدبخش می‌گوید. اگر ماه انسانی نمی‌بود، پیام شعر خشک می‌ماند؛ این آرایه مفهوم مهربانی و روشنی‌بخشی را ملموس و ماندگار می‌کند."},{"type":"exam","title":"معنی واژه‌های «مهتاب»، «فروغ» و «سراسیمه» را بنویسید.","body":"مهتاب: نور و روشنایی ماه در شب. فروغ: نور و درخشندگی. سراسیمه: شتاب‌زده و بی‌قرار. برای پاسخ کامل، پس از نوشتن معنی، واژه را در جمله‌ای از فضای درس به کار ببرید؛ مانند: «مهتاب، کوچه‌ی سراسیمه را با فروغ خود آرام کرد.»"}]},{"number":7,"title":"قلب کوچکم را به چه کسی بدهم؟","pages":"۶۷ تا ۸۰","contents":[{"type":"answer","title":"پدر در این درس به فرزندش چه توصیه‌ای می‌کند؟","body":"پدر می‌گوید قلب کوچکت را به مادرت ببخش؛ زیرا او نخستین و پایدارترین دوست توست: در بیماری و شب‌های بی‌خوابی کنارت بود، همه‌ی رنج‌ها را برایت پذیرفت و محبتش هرگز پایان نمی‌یابد. پس مهر به مادر باید بر همه‌ی دوستی‌ها پیشی گیرد.","pageRef":"صفحه ۶۷"},{"type":"answer","title":"چرا نویسنده این درس را به شکل نامه نوشته است؟","body":"نامه گفت‌وگویی صمیمانه و مستقیم میان پدر و فرزند است. با این قالب، پدر می‌تواند با زبانی نرم و مهربان درس بزرگ محبت به مادر را بیاموزد؛ خواننده هم گویی نامه‌ای خطاب به خود می‌خواند و همین صمیمیت، پیام درس را در دل می‌نشاند.","pageRef":"صفحه ۷۰"},{"type":"note","title":"کنایه‌ی «قلب را بخشیدن»","body":"گفتن «قلبم را به تو می‌دهم» کنایه از عشق ورزیدن و دلبستگی کامل است، نه دادن بخشی از بدن. در این درس قلب نشانه‌ی محبت است. در سوال‌های آرایه، نخست کنایه را نام ببرید، سپس معنی واقعی آن را با شاهدی از متن درس بنویسید."},{"type":"note","title":"واژه‌نامه درس","body":"قلب: دل، مرکز احساس و عشق. سرشار: پر و لبریز. پایدار: استوار و ماندگار. در این درس قلب نماد عشق است؛ پس واژه‌هایی مانند مهربانی، دلسوزی و مهر با مفهوم درس پیوند دارند و در پرسش‌های واژه‌یابی به کار می‌آیند."},{"type":"exam","title":"درس قلب کوچکم را به چه کسی بدهم را در سه سطر خلاصه کنید.","body":"پدری در نامه به پسرش می‌گوید اگر روزی کسی از تو دل خواست، نخست به مادرت بیندیش؛ او بیش از همه تو را دوست دارد، شب‌ها بیدار ماند، در بیماری مراقبت کرد و از هیچ رنجی نگذشت. پس قلب کوچکت را نخست به مادرت ببخش و مهر او را هرگز از دل بیرون نبر."},{"type":"exam","title":"نوع فعل‌های «می‌گوید»، «بخش» و «خواهد بود» را از نظر زمان مشخص کنید.","body":"می‌گوید: مضارع اخباری؛ برای حال یا آینده‌ی نزدیک. بخش: فعل امر دوم شخص مفرد؛ درخواست مستقیم پدر از فرزند. خواهد بود: فعل آینده؛ ساخته‌شده از «خواهد» به‌علاوه‌ی مصدر «بودن». شناخت زمان فعل‌ها در پرسش‌های دستور زبان اهمیت فراوان دارد."}]},{"number":8,"title":"روایت فتح (خرمشهر)","pages":"۸۱ تا ۹۲","contents":[{"type":"answer","title":"خرمشهر چه روزی آزاد شد و نویسنده آن روز را چگونه توصیف می‌کند؟","body":"خرمشهر در سوم خرداد ۱۳۶۰ آزاد شد. نویسنده روز فتح را روزی پر از غرور و شادمانی می‌کشد: پرچم بر فراز شهر برافراشته شد، چشم رزمندگان از اشک شوق تر بود و هوای شهر، بوی حماسه و فداکاری مردانی را می‌داد که برای آزادی آن ایستادگی کردند.","pageRef":"صفحه ۸۱"},{"type":"answer","title":"از درس روایت فتح چه درس‌هایی برای زندگی می‌گیریم؟","body":"این درس یادآور مقاومت، وحدت و فداکاری است: مردم و رزمندگان با ایمان و پایداری، شهر را آزاد کردند. می‌آموزیم که هدف‌های بزرگ با پشتکار و همدلی به دست می‌آیند، ارزش زندگی در خدمت به سرزمین و مردم است و یاد شهیدان باید گرامی بداریم.","pageRef":"صفحه ۸۴"},{"type":"note","title":"واژه‌نامه: فتح و واژه‌های هم‌خانواده","body":"فتح: پیروزی و گشودن. رزمنده: جنگنده و مدافع سرزمین. مقاومت: ایستادگی در برابر دشمن. حماسه: کار بزرگ و دلیرانه. این واژه‌ها کلیدواژه‌های درس‌های دفاع مقدس‌اند و در امتحان‌های معنی واژه و هم‌خانواده‌یابی بارها پرسیده می‌شوند."},{"type":"note","title":"املا: واژه‌های دشوار درس","body":"در نوشتن این درس به واژه‌های دشوار توجه کنیم: «حماسه» با «ه» و «س»، «حصار» با «ص» به معنی باروی شهر، «خروشان» با «خ» و «ش» و «مقاومت» با «ق». برای تشخیص هم‌آواها، معنی و خاستگاه واژه را یاد بگیریم تا در املا خطا نکنیم."},{"type":"exam","title":"درس روایت فتح (خرمشهر) را خلاصه کنید.","body":"نویسنده با رفتن به خرمشهر پس از آزادی، ویرانی‌های جنگ را می‌بیند اما روحیه‌ی حماسی مردم و رزمندگان را زنده‌تر از همیشه احساس می‌کند. او می‌گوید این شهر با خون شهیدان دوباره جان گرفت و سوم خرداد، روز فتح و یادآور ایستادگی یک ملت شد."},{"type":"exam","title":"در عبارت «شهر با خون شهیدان جان دوباره گرفت» چه آرایه‌ای به کار رفته است؟","body":"این عبارت آرایه‌ی تشخیص (جان‌بخشی) دارد؛ زیرا «جان گرفتن» ویژه‌ی جانداران است اما به شهر نسبت داده شده است. همچنین «خون شهیدان» اشاره‌ای نمادین به فداکاری است. در پاسخ، نخست آرایه را نام ببرید و سپس دلیل و اثر زیبایی آن را بنویسید."}]},{"number":9,"title":"پانزده صبح بخیر","pages":"۹۳ تا ۱۰۲","contents":[{"type":"answer","title":"پیام اصلی داستان پانزده صبح بخیر چیست؟","body":"داستان نشان می‌دهد سلام کردن و سخن مهربان چقدر می‌تواند روز آدم‌ها را روشن کند. شخصیت‌ها با درود و لبخند، دل‌های خسته را شاد می‌کنند و می‌فهمانیم که آیین‌های خوب مانند احترام، محبت و گذشت، زندگی را شیرین و پیوند انسان‌ها را استوار می‌کند.","pageRef":"صفحه ۹۳"},{"type":"answer","title":"از رفتار شخصیت‌های داستان چه می‌آموزیم؟","body":"می‌آموزیم که رفتارهای کوچک مانند سلام، تشکر و لبخند می‌تواند دل‌ها را نزدیک کند. شخصیت‌ها با گذشت، کمک به دیگران و نگاه امیدوار به زندگی، نمونه‌ی رفتار دوست‌داشتنی هستند و ما نیز باید در خانه و مدرسه همین‌گونه رفتار کنیم.","pageRef":"صفحه ۹۶"},{"type":"note","title":"دستور زبان: جمله‌های پرسشی","body":"جمله‌ی پرسشی برای دانستن چیزی به کار می‌رود و با واژه‌های «آیا»، «چه»، «چرا»، «کی» و «چگونه» ساخته می‌شود؛ مانند «چرا صبح بخیر گفتن مهم است؟». نشانه‌ی نوشتاری آن علامت سوال است. در داستان‌ها، پرسش‌ها مکالمه را زنده و طبیعی می‌کنند."},{"type":"note","title":"واژه‌نامه: سلام و آیین گفتار","body":"سلام: درود و آرزوی بی‌آزاری برای دیگری. «سلام کردن» از پسندیده‌ترین آیین‌های ماست و در این داستان کلید پیوند دل‌ها است. واژه‌های درود، احترام و محبت با فضای درس هم‌خوان‌اند و در پاسخ‌های مترادف‌یابی جانشین هم می‌شوند."},{"type":"exam","title":"داستان پانزده صبح بخیر را در دو سطر خلاصه کنید.","body":"در این داستان سلام کردن از سر مهربانی، حال آدم‌ها را دگرگون می‌کند؛ شخصیت‌ها با گفتن صبح بخیر و پاسخ‌های گرم، نزدیک‌تر می‌شوند و روزشان رنگ امید می‌گیرد. نویسنده با این روایت ارزش سخن نیکو و آیین دوستی را به خواننده می‌آموزد."},{"type":"exam","title":"جمله‌ی «سلام گرمت روزم را روشن کرد» را از نظر دستوری تحلیل کنید.","body":"سلام گرمت: نهاد جمله؛ «سلام» هسته و «ت» ضمیر ملکی. روزم: مفعول؛ «روز» به‌علاوه‌ی ضمیر متصل. روشن کرد: گزاره از فعل ماضی ساده. پس جمله خبری و گذشته است. در تحلیل دستوری همیشه نهاد، مفعول و گزاره را جدا بنویسید و نوع جمله را ذکر کنید."}]},{"number":10,"title":"روباه و کلاغ","pages":"۱۰۳ تا ۱۱۴","contents":[{"type":"answer","title":"در حکایت روباه و کلاغ چه اتفاقی می‌افتد؟","body":"کلاغ تکه‌ای خوراک به منقار گرفته و بر شاخه نشسته است. روباه با چاپلوسی می‌گوید آوازت چه زیباست، بخوان تا بشنوم. کلاغ چون لب باز کرد، خوراکش به زمین افتاد و روباه آن را برداشت. حکایت هشدار می‌دهد که فریب ستایش بی‌جا زیان دارد.","pageRef":"صفحه ۱۰۳"},{"type":"answer","title":"از این حکایت چه پندهایی می‌توان گرفت؟","body":"پندهای حکایت: از چاپلوسان حذر کنیم؛ ستایش بی‌جا گاهی فریب است؛ پیش از هر عمل بیندیشیم. کلاغ اگر در اندیشه‌ی خوراک خود بود و دلبسته‌ی تعریف نمی‌شد، فریب نمی‌خورد؛ پس هوشیاری و کم‌حرفی، نگهبان سود و آبروی انسان است.","pageRef":"صفحه ۱۰۵"},{"type":"note","title":"واژه‌نامه: چاپلوسی","body":"چاپلوسی: ستایش ناروا برای نفع گرفتن؛ مترادف تملق‌گویی و متضاد راستگویی و صداقت. در امتحان‌ها اغلب می‌خواهند واژه را در جمله‌ای تازه به کار ببرید؛ مانند: «چاپلوس هرگز دوست واقعی نیست، بلکه در پی سود خود است.»"},{"type":"note","title":"دستور زبان: فعل ترکیبی","body":"فعل ترکیبی از نام (اسم یا صفت) به‌علاوه‌ی فعل کمکی مانند «کردن»، «دادن»، «گرفتن» و «آمدن» ساخته می‌شود؛ مانند «آواز خواند»، «لب باز کرد» و «فریب خورد». در تجزیه‌ی این فعل‌ها، نام و فعل کمکی را جدا بنویسید و مصدر ترکیبی را ذکر کنید."},{"type":"exam","title":"پند حکایت روباه و کلاغ را با یک مثال از زندگی توضیح دهید.","body":"کسی که با ستایش‌های بی‌جا گول می‌خورد، سرمایه یا آبروی خود را از دست می‌دهد؛ مانند دانش‌آموزی که از تعریف‌های بی‌جا یک هم‌گروهی، کار گروهی را به او می‌سپارد و نتیجه‌ای بد می‌گیرد. حکایت می‌گوید پیش از باور کردن تعریف‌ها، نیت گوینده را بسنجیم."},{"type":"exam","title":"فعل‌های «خورد»، «لب باز کرد» و «گرفته بود» را تجزیه و تحلیل کنید.","body":"خورد: فعل ساده، ماضی ساده، سوم شخص مفرد از مصدر «خوردن». لب باز کرد: فعل ترکیبی، ماضی ساده، سوم شخص مفرد؛ نام «لب باز» به‌علاوه‌ی فعل کمکی «کرد». گرفته بود: ماضی بعید از مصدر «گرفتن»؛ ساخته‌شده از «گرفته» به‌علاوه‌ی «بود»."}]},{"number":11,"title":"طوطی و بازرگان","pages":"۱۱۵ تا ۱۲۶","contents":[{"type":"answer","title":"بازرگان پیام طوطی خود را چگونه رساند و چه بر سر طوطی‌ها آمد؟","body":"بازرگان در سفر هند، سلام طوطی قفس را به طوطی‌های صحرا رساند. آنان با شنیدن سلام، یکی پس از دیگری از شاخه افتادند. بازرگان شگفت‌زده ماجرا را برای طوطی قفس گفت و او نیز بی‌جان افتاد؛ اما همین افتادن راه آزادی او شد و از قفس بیرون پرواز کرد.","pageRef":"صفحه ۱۱۵"},{"type":"answer","title":"پیام حکایت طوطی و بازرگان چیست؟","body":"حکایت می‌گوید وابستگی به قفسِ دنیا مایه‌ی بندگی است؛ جان آن‌کس که از دنیا می‌گذرد و خود را رها می‌کند، آزاد می‌شود. مولانا می‌خواهد بگوید آزادی واقعی با گذشتن از «خود» آغاز می‌شود و سخن پندآموز اهل معنا، جان‌های در بند را بیدار می‌کند.","pageRef":"صفحه ۱۱۸"},{"type":"note","title":"مولانا و زبان حکایت","body":"مولانا (مولوی) حکیم سده‌ی هفتم هجری و سراینده‌ی مثنوی معنوی و غزلیات شمس است. او اندیشه‌های عرفانی را با حکایت و مثال ساده می‌گوید؛ در این حکایت نیز از زبان یک طوطی، درس آزادی جان و گذشتن از دنیاپرستی را به خواننده می‌آموزد."},{"type":"note","title":"واژه‌نامه: قفس، عافیت، جان","body":"قفس: جای بستن پرنده؛ در حکایت نماد بندگی و دنیا. عافیت: آسایش و دور بودن از آزار. جان: روح و هستی انسان. پرواز نیز نماد آزادی است؛ پس معنی واژه‌ها را همراه با نمادهای داستان بنویسید تا پاسخ کامل باشد."},{"type":"exam","title":"
