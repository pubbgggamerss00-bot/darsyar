و بی‌برنامه شهرها، حاشیه‌نشینی، کمبود خدمات و بیکاری در شهرها و در برابر، خالی‌شدن روستاها و کمبود نیروی کار کشاورزی را به همراه دارد. پیرامون کلان‌شهرهایی مانند تهران و مشهد محل استقرار بسیاری از مهاجران روستایی است.","pageRef":"صفحه ۱۷۶"},{"type":"note","title":"توزیع نابرابر جمعیت در ایران","body":"جمعیت ایران به‌طور یکنواخت پراکنده نشده است؛ نواحی شمال، غرب و مرکز کشور پرجمعیت‌ترند و پهنه‌های کویری و برخی مناطق کوهستانی کم‌جمعیت‌اند. برای نمونه استان‌های تهران، خراسان رضوی و اصفهان بیشترین جمعیت را دارند و استان‌هایی مانند سمنان جمعیت اندکی دارند."},{"type":"note","title":"گسترش شهرنشینی در ایران","body":"امروز حدود سه‌چهارم جمعیت ایران در شهرها زندگی می‌کنند؛ رشد سریع شهرها بیشتر نتیجه مهاجرت روستاییان و تغییر شیوه معیشت و شغل مردم روستا بوده است. در سرشماری‌های گذشته بیشتر جمعیت روستانشین بود، اما امروز مهاجرت چهره کشور را شهری کرده است."},{"type":"exam","title":"عوامل مهاجرت روستاییان به شهرها کدام‌اند؟","body":"پاسخ تشریحی: عوامل سوق‌دهنده مانند کمبود زمین و آب، خشکسالی، نبود بازار کار و کمبود خدمات در روستا، مردم را به ترک روستا می‌کشاند و عوامل کشنده مانند کار و درآمد بهتر، دانشگاه، خدمات بهداشتی و امکانات شهری مهاجران را جذب می‌کند. برای مهار مهاجرت باید روستاها را با اشتغال و خدمات توانمند ساخت."},{"type":"exam","title":"پیامدهای رشد سریع شهرها را بنویسید.","body":"پاسخ تشریحی: رشد سریع و بی‌برنامه شهرها به حاشیه‌نشینی، آلودگی هوا، ترافیک، کمبود آب و خدمات شهری و نابرابری اجتماعی می‌انجامد؛ از سوی دیگر کاهش جمعیت روستاها، کشاورزی و تولید غذایی کشور را تهدید می‌کند. برنامه‌ریزی برای اشتغال روستایی و توسعه متعادل میان شهر و روستا راه‌حل این مشکل است."}]},{"number":14,"title":"فعالیت‌های اقتصادی ایران","pages":"۱۸۳ تا ۱۹۶","contents":[{"type":"answer","title":"بخش‌های فعالیت اقتصادی را نام ببرید و از هر یک مثال بیاورید.","body":"فعالیت‌های اقتصادی به سه بخش تقسیم می‌شود: کشاورزی مانند گندم‌کاری و دامداری، صنعت مانند خودروسازی، فولاد و استخراج معدن و خدمات مانند حمل‌ونقل، پزشکی، آموزش و بانکداری. در ایران بیشترین نیروی کار در بخش خدمات مشغول است و نفت و گاز مهم‌ترین منبع درآمد کشور است.","pageRef":"صفحه ۱۸۵"},{"type":"answer","title":"مهم‌ترین محصولات کشاورزی ایران کدام‌اند؟","body":"گندم مهم‌ترین محصول کشاورزی ایران است و در بیشتر استان‌ها کاشته می‌شود؛ چغندرقند، جو، برنج در شمال کشور، پنبه، چای و مرکبات و خشکبار مانند پسته، زعفران و خرما از دیگر محصولات مهم ایران است که بخشی از آنان به دیگر کشورها صادر می‌شود.","pageRef":"صفحه ۱۸۸"},{"type":"note","title":"نقش نفت و گاز در اقتصاد ایران","body":"ایران از کشورهای سرشار از نفت و گاز جهان است و درآمد نفت مهم‌ترین منبع بودجه کشور است؛ میدان پارس جنوبی در خلیج فارس بزرگ‌ترین گنجینه گاز ایران است. وابستگی بیش از اندازه به نفت و نوسان قیمت جهانی آن به اقتصاد آسیب می‌زند؛ به همین دلیل اقتصاد کشور باید متنوع شود."},{"type":"note","title":"صنعت و معادن ایران","body":"صنایع ایران شامل نفت و پتروشیمی، خودروسازی، فولاد و مس، مواد غذایی و پوشاک است و کشور در استخراج مس، سرب، روی و سنگ آهن غنی است. برای نمونه مجتمع‌های فولاد اصفهان و مجتمع مس سرچشمه در کرمان از بزرگ‌ترین صنایع کشور به شمار می‌روند و بخشی از تولید آنان صادر می‌شود."},{"type":"exam","title":"چرا تنوع در فعالیت‌های اقتصادی برای کشور لازم است؟","body":"پاسخ تشریحی: اتکای بیش از حد به درآمد نفت، کشور را در برابر افت قیمت جهانی نفت و تحریم‌ها آسیب‌پذیر می‌کند؛ تنوع در کشاورزی، صنعت و خدمات اشتغال بیشتری پدید می‌آورد، صادرات غیرنفتی را بالا می‌برد و درآمد کشور را پایدارتر می‌سازد. به همین دلیل تولید داخلی و خودکفایی باید تقویت شود."},{"type":"exam","title":"راه‌های گسترش صادرات غیرنفتی ایران را بنویسید.","body":"پاسخ تشریحی: تولید محصول‌های سالم و استاندارد کشاورزی مانند پسته، زعفران و خرما، توسعه صنایع فولاد، پتروشیمی و محصولات مهندسی، رونق صنایع دستی و گردشگری و بهبود روابط تجاری با کشورهای همسایه از راه‌های گسترش صادرات غیرنفتی است؛ این کار وابستگی کشور به نفت را کم می‌کند و اشتغال می‌آفریند."}]}]},{"title":"عربی هشتم","subject":"عربی","description":"جواب تمرین‌ها، نکات قواعد و سوالات امتحانی همه درس‌های کتاب عربی هشتم","color":"teal","icon":"languages","chapters":[{"number":1,"title":"اِسْتَمِعْ وَنَظُرْ","pages":"۱۰ تا ۲۰","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۱۴","body":"سوال: ماذا یُحِبُّ علیٌّ أنْ یَشاهَدَ فِی التِّلْفازِ؟\nپاسخ: یُحِبُّ علیٌّ أنْ یَشاهَدَ بَرْنامَجَ الرِّیاضَةِ وَ الْأَخْبارِ فِی التِّلْفازِ.\nترجمه: علی دوست دارد برنامه ورزش و اخبار را در تلویزیون تماشا کند.","pageRef":"صفحه ۱۴"},{"type":"answer","title":"تمرین صرف صفحه ۱۶","body":"صرف فعل «نَظَرَ» (نگاه کردن) در سه زمان:\nماضی: نَظَرَ (نگاه کرد)، نَظَرَا (دو نفر نگاه کردند)، نَظَرُوا (نگاه کردند).\nمضارع: یَنْظُرُ (نگاه می‌کند)، یَنْظُرانِ (دو نفر نگاه می‌کنند)، یَنْظُرُونَ (نگاه می‌کنند).\nامر: اُنْظُرْ (نگاه کن)، اُنْظُرا (دو نفر نگاه کنید)، اُنْظُرُوا (نگاه کنید).","pageRef":"صفحه ۱۶"},{"type":"note","title":"فعل ماضی و صرف آن","body":"فعل ماضی بر کاری دلالت می‌کند که در گذشته انجام شده است، مانند نَظَرَ (نگاه کرد) و اِسْتَمِعَ (شنید).\nصرف ماضی: نَظَرَ، نَظَرَتْ، نَظَرا، نَظَرَتا، نَظَرُوا، نَظَرْنَ.\nواژه‌هایی مانند «أَمْسِ» (دیروز) و «قَبْلَ» (پیش از) در جمله، ترجمه ماضی را تأیید می‌کنند."},{"type":"note","title":"باب اِفعال و معنای آن","body":"در باب اِفعال، فعل بر «أَفعَلَ» منطبق است و بر معنای فرمان دادن دلالت می‌کند:\nأَكْرَمَ (کرامت داد)، أَخْرَجَ (بیرون آورد).\nمضارع آن یُفعِلُ است: یُكْرِمُ (کرامت می‌دهد) و امر آن أَكْرِمْ (کرامت کن).\nمجهول آن: أُكْرِمَ (کرامت داده شد)."},{"type":"exam","title":"ترجمه فعل ماضی باب اِفعال","body":"سوال: جمله «أُذِيعَ الْبَرْنامَجُ بَعْدَ الْعَصْرِ» را ترجمه کنید.\nپاسخ: «برنامه بعد از ظهر پخش شد».\nنکته: «أُذِيعَ» فعل ماضی مجهول از باب اِفعال است؛ وقتی فعل مجهول باشد، ترجمه آن با «شد» همراه می‌شود: پخش شد، بیرون آورده شد."},{"type":"exam","title":"صرف فعل اِسْتَمِعَ","body":"فعل «اِسْتَمِعَ» (شنید) از باب اِفتِعال است و در سه زمان چنین است:\nماضی: اِسْتَمِعَ (شنید).\nمضارع: یَسْتَمِعُ (می‌شنود).\nامر: اِسْتَمِعْ (بشنو).\nمثال: اِسْتَمِعْتُ الْأَخْبارَ صَباحًا (صبح اخبار را شنیدم)."}]},{"number":2,"title":"اِعْرِفْ نَفْسَكَ","pages":"۲۱ تا ۳۱","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۲۴","body":"سوال: لِمَذا یَقُولُ الْأَبُ لِابْنِهِ: اعْرِفْ نَفْسَكَ؟\nپاسخ: یَقُولُ ذلِكَ لِأَنَّ كُلَّ اِنْسانٍ یَجِبُ أَنْ یَعْرِفَ قُدْرَتَهُ وَ مَواهِبَهُ حَتّی یَخْتارَ طَریقَ الْنَجاحِ.\nترجمه: پدر این را می‌گوید زیرا هر انسان باید توانایی و استعداد خود را بشناسد تا راه موفقیت را برگزیند.","pageRef":"صفحه ۲۴"},{"type":"answer","title":"تمرین قواعد صفحه ۲۷","body":"سوال: صیغه‌های مضارع فعل «عَرَفَ» را برای ضمایر مفرد و جمع بنویسید.\nپاسخ: اَعْرِفُ (می‌شناسم)، نَعْرِفُ (می‌شناسیم)، تَعْرِفُ (می‌شناسی)، تَعْرِفونَ (می‌شناسید)، یَعْرِفُ (می‌شناسد)، یَعْرِفونَ (می‌شناسند).\nنکته: هر ضمیر رفع، حرف مضارعه مخصوص خود را دارد: اَ، نَ، تَ، یَ.","pageRef":"صفحه ۲۷"},{"type":"note","title":"فعل مضارع و ساخت آن","body":"فعل مضارع از «مضارعه» به اضافه یکی از حروف «اَتُیُن» ساخته می‌شود، مانند: أَكْتُبُ (می‌نویسم)، تَكْتُبُ (می‌نویسی)، یَكْتُبُ (می‌نویسد)، نَكْتُبُ (می‌نویسیم).\nمضارع بر کاری دلالت می‌کند که در حال انجام است و ترجمه آن با «می» همراه است."},{"type":"note","title":"معنای آینده با سَـ و سَوفَ","body":"اگر «سَـ» یا «سَوْفَ» بر سر فعل مضارع بیاید، معنای آینده می‌دهد:\nسَأَذْهَبُ إِلی الْمَدینَةِ (به شهر خواهم رفت).\nسَوْفَ یَنْجَحُ الطَّالِبُ الْمُجْتَهِدُ (دانش‌آموز کوشا موفق خواهد شد).\n«سَـ» آینده نزدیک و «سَوْفَ» آینده دور را می‌رساند."},{"type":"exam","title":"ترجمه فعل مضارع","body":"سوال: جمله «سَتُساعِدُكَ الْمُعَلِّمَةُ فِی الْعِلْمِ» را ترجمه کنید.\nپاسخ: «معلمه در علم به تو کمک خواهد کرد».\nنکته: «سَـ» بر سر «تُساعِدُ» آمده، پس فعل معنای آینده یافته است: تُساعِدُ یعنی کمک می‌کند و سَتُساعِدُ یعنی کمک خواهد کرد."},{"type":"exam","title":"نقش حروف مضارعه","body":"سوال: در عبارت «أَسْمَعُ وَ أَرَی الْعَلاماتِ» حروف مضارعه را پیدا کنید و معنای فعل‌ها را بنویسید.\nپاسخ: «أَـ» در «أَسْمَعُ» و «أَـ» در «أَرَی» حرف مضارعه است؛ معنای فعل‌ها: می‌شنوم و می‌بینم.\nحروف مضارعه از «اَتُیُن» هستند و ضمیر فاعل فعل را نشان می‌دهند."}]},{"number":3,"title":"اَلْعِلْمُ نُورٌ","pages":"۳۲ تا ۴۲","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۳۵","body":"سوال: أَیْنَ یَذْهَبُ الطُّلّابُ بَعْدَ الدِّراسَةِ؟ وَ ماذا یَفْعَلونَ هُنالِكَ؟\nپاسخ: یَذْهَبُ الطُّلّابُ إِلی الْمَكْتَبَةِ وَ یَقْرَؤُونَ الْكُتُبَ الْمُفیدَةَ هُنالِكَ.\nترجمه: دانش‌آموزان بعد از درس به کتابخانه می‌روند و در آنجا کتاب‌های سودمند را می‌خوانند.","pageRef":"صفحه ۳۵"},{"type":"answer","title":"تمرین ترجمه صفحه ۳۸","body":"سوال: صیغه‌های امر زیر را ترجمه کنید:\nاُكْتُبْ ← بنویس.\nاِذْهَبا ← (دو نفر) بروید.\nاِعْلَموا ← بدانید.\nاُنْظُری ← نگاه کن (خطاب به دختر).\nنکته: هر ضمیر مخاطب، صیغه امر مخصوص خود را دارد و در ترجمه باید به تعداد و جنس مخاطب توجه کرد.","pageRef":"صفحه ۳۸"},{"type":"note","title":"ساخت فعل امر","body":"فعل امر را از مضارع مخاطب می‌سازیم: اول حرف مضارعه را حذف می‌کنیم، سپس حرف اول را ساکن می‌کنیم و در صورت لزوم «اُ» یا «اِ» می‌آوریم:\nتَكْتُبُ ← اُكْتُبْ (بنویس).\nتَسْمَعُ ← اِسْمَعْ (بشنو).\nتَعْلَمانِ ← اِعْلَما (دو نفر بدانید).\nتَعْلَمونَ ← اِعْلَموا (بدانید)."},{"type":"note","title":"صیغه امر مؤنث","body":"برای مخاطب مؤنث، «یِ» به آخر فعل مضارع اضافه می‌شود و در امر این «یِ» حذف می‌گردد:\nتَكْتُبینَ ← اُكْتُبی (بنویس، خطاب به یک دختر).\nتَسْمَعینَ ← اِسْمَعی (بشنو).\nخطای رایج: نوشتن «اُكْتُبین» غلط است؛ صیغه درست «اُكْتُبی» است."},{"type":"exam","title":"امر جمع مخاطبان","body":"سوال: امر «تَقْرَؤونَ الْكِتابَ» را بسازید و ترجمه کنید.\nپاسخ: اِقْرَؤوا الْكِتابَ؛ ترجمه: «کتاب را بخوانید».\nنکته: در امر جمع مخاطبان مذکر، «ونَ» مضارع به «وا» تبدیل می‌شود؛ مانند: تَذْهَبونَ ← اِذْهَبوا (بروید)."},{"type":"exam","title":"ترجمه عبارت امر","body":"سوال: عبارت «یَا بَنِیَّ، اِجْلِسْ هُنا وَ اِسْتَمِعْ كَلامَ الْمُعَلِّمِ بِعِنایَةٍ» را ترجمه کنید.\nپاسخ: «ای فرزندم، اینجا بنشین و سخن معلم را با دقت بشنو».\n«اِجْلِسْ» و «اِسْتَمِعْ» هر دو امر مفرد مخاطب مذکر هستند."}]},{"number":4,"title":"هَلْ أَنْتَ مُتَرْجِمٌ؟","pages":"۴۳ تا ۵۴","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۴۷","body":"سوال: مَنْ هٰذَا الرَّجُلُ؟ وَ بِمَذا یَشْتَغِلُ؟\nپاسخ: هٰذَا مُتَرْجِمٌ مَشْهُورٌ؛ یَعْمَلُ فِی مَكْتَبِ التَّرْجَمَةِ وَ یُتَرْجِمُ الْكُتُبَ مِنَ الْعَرَبِیَّةِ إِلی الْفارِسِیَّةِ.\nترجمه: این مرد مترجم مشهوری است؛ در دفتر ترجمه کار می‌کند و کتاب‌ها را از عربی به فارسی ترجمه می‌کند.","pageRef":"صفحه ۴۷"},{"type":"answer","title":"تمرین قواعد صفحه ۵۰","body":"سوال: اسم فاعل و اسم مفعول فعل‌های زیر را بنویسید:\nشارَكَ ← اسم فاعل: مُشارِك (همکار)، اسم مفعول: مُشارَك (همکاری شده).\nاِسْتَخْرَجَ ← مُسْتَخْرِج (بیرون آورنده)، مُسْتَخْرَج (بیرون آورده شده).\nعَلَّمَ ← مُعَلِّم (آموزگار)، مُعَلَّم (آموزش داده شده).","pageRef":"صفحه ۵۰"},{"type":"note","title":"اسم فاعل","body":"اسم فاعل بر انجام‌دهنده کار دلالت می‌کند. از فعل سه‌حرفی ساده بر وزن «فاعِلْ» ساخته می‌شود:\nكاتِبْ (نویسنده)، قارِئْ (خواننده)، فاتِحْ (گشاینده).\nاز فعل‌های مازید مثل مضارع با «مـ» است: یُشارِكُ ← مُشارِك (همکار)، یُعَلِّمُ ← مُعَلِّم (آموزگار).\n«مُتَرْجِم» (مترجم) نیز اسم فاعل است."},{"type":"note","title":"اسم مفعول","body":"اسم مفعول بر کسی یا چیزی دلالت می‌کند که کار بر او واقع شده است. از فعل سه‌حرفی ساده بر وزن «مَفعولْ» است:\nمَكْتوبْ (نوشته)، مَفْروضْ (واجب)، مَقْروءْ (خوانده شده).\nاز فعل‌های مازید مثل مضارع با «مـ» است، ولی پیش از آخر آن فتحه می‌آید: مُشارَك (همکاری شده)، مُستَعَدّ (آماده)."},{"type":"exam","title":"تشخیص اسم فاعل و اسم مفعول","body":"سوال: در جمله «الْمُعَلِّمُ یَقْرَأُ الْمَكْتوبَ فِی الْقَرْیَةِ» اسم فاعل و اسم مفعول را پیدا کنید و جمله را ترجمه کنید.\nپاسخ: «مُعَلِّم» اسم فاعل باب تفعیل از «عَلَّمَ» یعنی آموزگار؛ «مَكْتوب» اسم مفعول از «كَتَبَ» یعنی نامه.\nترجمه: آموزگار نامه را در روستا می‌خواند."},{"type":"exam","title":"ترجمه جمله با اسم مفعول","body":"سوال: جمله «هٰذِهِ الْكَلِماتُ مَكْتوبَةٌ فَرَنْسِیًّا» را ترجمه کنید.\nپاسخ: «این واژه‌ها به فرانسه نوشته شده‌اند».\nنکته: «مَكْتوبَةٌ» اسم مفعول مؤنث است؛ زیرا واژه‌ها کار نوشتن را پذیرفته‌اند، نه انجام‌دهنده آن هستند."}]},{"number":5,"title":"هَلّا نَزْرَعُ الْأَشْجارَ؟","pages":"۵۵ تا ۶۶","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۵۸","body":"سوال: لِمَذا نَزْرَعُ الْأَشْجارَ فِی الْبِقاعِ؟\nپاسخ: نَزْرَعُ الْأَشْجارَ لِأَنَّها تُنَقِّی الْهَواءَ وَ تُزَیِّنُ الْبِقاعَ وَ تُجَمِّلُ الْحَیاتَ.\nترجمه: درختان را می‌کاریم زیرا هوا را پاک می‌کنند، سرزمین‌ها را زیبا می‌سازند و زندگی را آراسته می‌کنند.","pageRef":"صفحه ۵۸"},{"type":"answer","title":"تمرین قواعد صفحه ۶۱","body":"سوال: جمله «نَزْرَعُ الْأَشْجارَ» را با «لا» و «لَمْ» منفی کنید و ترجمه کنید.\nپاسخ: لا نَزْرَعُ الْأَشْجارَ؛ «درختان را نمی‌کاریم».\nلَمْ نَزْرَعْ الْأَشْجارَ؛ «درختان را نکاشتیم».\nنکته: بعد از «لَمْ» فعل مضارع مجزوم می‌شود و به معنای ماضی منفی برمی‌گردد.","pageRef":"صفحه ۶۱"},{"type":"note","title":"نفی با ما و لا و لم","body":"فعل را با ابزارهای مختلف منفی می‌کنیم:\n«ما + ماضی»: ما نَظَرْتُ (نگاه نکردم).\n«لا + مضارع»: لا أَذْهَبُ (نمی‌روم)؛ نفی در زمان حال.\n«لَمْ + مضارع مجزوم»: لَمْ أَذْهَبْ (نرفتم)؛ نفی در گذشته.\nبعد از «لَمْ» آخر فعل مضارع ساکن می‌شود."},{"type":"note","title":"فعل نهی و معنای هَلّا","body":"«لا + مضارع جزم» فعل نهی است و بر ممنوع بودن کار دلالت می‌کند: لا تُهْمِلْ دَرْسَكَ (درس را رها نکن).\n«هَلّا + مضارع» برای تشویق به کار است و ترجمه آن «چرا نه» است:\nهَلّا نَزْرَعُ الْأَشْجارَ؟ (چرا درختان نکاریم؟)"},{"type":"exam","title":"ترجمه فعل منفی","body":"سوال: جمله «لَمْ یَذْهَبْ أَحْمَدُ إِلی الْمَدْرَسَةِ الْیَوْمَ» را ترجمه کنید.\nپاسخ: «احمد امروز به مدرسه نرفت».\nنکته: «لَمْ» ابزار نفی است و فعل بعد از آن جزم می‌شود؛ «لَمْ یَذْهَبْ» یعنی «نرفت»، نه «نمی‌رود»."},{"type":"exam","title":"ساخت فعل نهی","body":"سوال: فعل نهی «لا تَلْعَبْ فِی الشَّارِعِ» را ترجمه کنید و صیغه امر آن را بنویسید.\nپاسخ: ترجمه: «در خیابان بازی نکن».\nصیغه امر: اِلْعَبْ فِی الْحَدِیقَةِ (در باغ بازی کن).\nفعل نهی از مضارع مخاطب ساخته می‌شود و «لا» جازم بر سر آن می‌آید."}]},{"number":6,"title":"تَعاوَنُوا عَلَی الْبِرِّ","pages":"۶۷ تا ۷۸","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۷۱","body":"سوال: بِمَذا یَفْتَخِرُ الْمُعَلِّمُ بِطُلّابِهِ؟\nپاسخ: یَفْتَخِرُ الْمُعَلِّمُ بِأَنَّ طُلّابَهُ یُحافِظونَ عَلی نَظافَةِ الْمَدْرَسَةِ وَ یُساعِدونَ بَعْضَهُمْ بَعْضًا.\nترجمه: معلم به این افتخار می‌کند که دانش‌آموزانش مراقب نظافت مدرسه هستند و به یکدیگر کمک می‌کنند.","pageRef":"صفحه ۷۱"},{"type":"answer","title":"تمرین صرف صفحه ۷۴","body":"سوال: جمع مذکر سالم واژه «مُعَلِّم» را در حالت‌های رفع، نصب و جر بنویسید.\nپاسخ: مُعَلِّمونَ (آموزگاران، حالت رفع)، مُعَلِّمینَ (حالت نصب و جر).\nمثال: مُعَلِّمونَ فِی الْمَدْرَسَةِ (آموزگارانی در مدرسه هستند)، رَأَیْتُ الْمُعَلِّمینَ (آموزگاران را دیدم).","pageRef":"صفحه ۷۴"},{"type":"note","title":"جمع مذکر سالم","body":"جمع مذکر سالم برای جمع‌کردن انسان‌های خردمند است؛ به آخر واژه «ونَ» یا «ینَ» می‌چسبد:\nمُعَلِّم ← مُعَلِّمونَ/مُعَلِّمینَ (آموزگاران).\nمُتَرْجِم ← مُتَرْجِمونَ/مُتَرْجِمینَ (مترجمان).\nدر حالت رفع «ونَ» و در حالت نصب و جر «ینَ» می‌آید."},{"type":"note","title":"جمع مؤنث سالم","body":"جمع مؤنث سالم با افزودن «ات» به آخر واژه ساخته می‌شود و بیشتر برای غیر خردمند به کار می‌رود، ولی برای مؤنث خردمند هم درست است:\nمُعَلِّمَة ← مُعَلِّمات (آموزگاران زن).\nطالِبَة ← طالِبات (دانش‌آموزان دختر).\nكَلِمَة ← كَلِمات (واژه‌ها)."},{"type":"exam","title":"جمع‌سازی واژه‌ها","body":"سوال: از واژه‌های «مُشارِك، مُجاهِد، مُتَرْجِم» جمع مذکر سالم بسازید و ترجمه کنید.\nپاسخ: مُشارِكونَ/مُشارِكینَ (همکاران)، مُجاهِدونَ/مُجاهِدینَ (مجاهدان)، مُتَرْجِمونَ/مُتَرْجِمینَ (مترجمان).\nهر سه واژه اسم فاعل هستند و جمع مذکر سالم می‌پذیرند."},{"type":"exam","title":"ترجمه جمله با جمع","body":"سوال: جمله «اَلطُّلّابُ یُحافِظونَ عَلی نَظافَةِ الْمَكْتَبَةِ» را ترجمه کنید.\nپاسخ: «دانش‌آموزان مراقب نظافت کتابخانه هستند».\nنکته: «طُلّاب» جمع تکسیری است؛ اما ضمیر «وا» در «یُحافِظونَ» ویژه جمع انسان‌های خردمند است و با جمع غیر خردمند به کار نمی‌رود."}]},{"number":7,"title":"یَا مَنْ یَرَاكَ","pages":"۷۹ تا ۹۰","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۸۲","body":"سوال: مَنِ الَّذی یَرَانا فِی كُلِّ مَكانٍ وَ یَسْمَعُ كَلامَنا؟\nپاسخ: هُوَ اللّٰهُ تَبارَكَ وَ تَعالی؛ یَرَانا فِی كُلِّ مَكانٍ وَ لَیْسَ اللّٰهُ بِغافِلٍ عَنّا.\nترجمه: او خداوند پاک و برتر است؛ در هر جا ما را می‌بیند و خدا از ما غافل نیست.","pageRef":"صفحه ۸۲"},{"type":"answer","title":"تمرین صرف صفحه ۸۵","body":"سوال: مثنی واژه‌های «عالِم» و «شاهِد» را در رفع، نصب و جر بنویسید.\nپاسخ: عالِمانِ (دو عالم، رفع)، عالِمَیْنِ (نصب و جر).\nشاهِدانِ (دو گواه، رفع)، شاهِدَیْنِ (نصب و جر).\nمثال: جاءَ عالِمانِ (دو عالم آمدند)، رَأَیْتُ عالِمَیْنِ (دو عالم را دیدم).","pageRef":"صفحه ۸۵"},{"type":"note","title":"مثنی و نشانه‌های آن","body":"مثنی بر دو چیز یا دو نفر دلالت دارد؛ به آخر واژه «انِ» می‌چسبد:\nطالِب ← طالِبانِ (دو دانش‌آموز)؛ مُدیر ← مُدیرانِ (دو مدیر).\nدر حالت رفع «الف» دارد: طالِبانِ، و در حالت نصب و جر به «ینِ» تبدیل می‌شود:\nرَأَیْتُ الطّالِبَیْنِ (دو دانش‌آموز را دیدم)."},{"type":"note","title":"مثنی در جمله","body":"مثنی در جمله نقش‌های مختلف دارد و نشانه آن عوض می‌شود:\nرفع با الف: جاءَ الطّالِبانِ (دو دانش‌آموز آمدند).\nنصب با یاء: سَمِعْتُ صَوْتَ الطّالِبَیْنِ (صدای دو دانش‌آموز را شنیدم).\nجر با یاء: مَرَرْتُ بِالطّالِبَیْنِ (از کنار دو دانش‌آموز گذشتم)."},{"type":"exam","title":"مثنی‌سازی و اعراب","body":"سوال: «مُدیر» و «شاهِد» را مثنی کنید و در جمله بیاورید.\nپاسخ: مُدیرانِ و مُدیرَیْنِ؛ شاهِدانِ و شاهِدَیْنِ.\nجاءَ مُدیرانِ الْمَدْرَسَةِ إِلی الصَّفِّ؛ ترجمه: «دو مدیر مدرسه به کلاس آمدند».\n«مُدیرانِ» فاعل است، پس در حالت رفع با «الف» آمده است."},{"type":"exam","title":"ترجمه با مثنی","body":"سوال: عبارت «اَلْعَیْنانِ نِعْمَةٌ مِنَ اللّٰهِ فَاحْفَظْهُما» را ترجمه کنید.\nپاسخ: «دو چشم نعمتی از خدا هستند، پس آن دو را نگه دار».\n«عَیْنانِ» مثنی است یعنی دو چشم و «احْفَظْهُما» ضمیر متصل «هُما» یعنی آن دو را دارد."}]},{"number":8,"title":"عَظَمَةُ الْخَالِقِ","pages":"۹۱ تا ۱۰۲","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۹۴","body":"سوال: مِنْ أَیْنَ یَأْتی الْمَطَرُ إِلی الْأَرْضِ؟\nپاسخ: یَأْتی الْمَطَرُ مِنَ السَّحابِ الَّذی یَتَكَوَّنُ مِنْ بُخارِ الْماءِ الَّذی یَصْعَدُ مِنَ الْبَحْرِ.\nترجمه: باران از ابر می‌آید؛ ابری که از بخار آب تشکیل می‌شود و بخار از دریا بالا می‌رود.","pageRef":"صفحه ۹۴"},{"type":"answer","title":"تمرین قواعد صفحه ۹۷","body":"سوال: در جمله «جاءَ الطُّلّابُ وَ مَعَهُمْ مُعَلِّمُهُمْ» ضمیر متصل را پیدا کنید و ترجمه کنید.\nپاسخ: ضمیر متصل «هُم» در «مَعَهُمْ» (با آنان) و «هُمْ» در «مُعَلِّمُهُمْ» (معلمشان).\nترجمه: دانش‌آموزان آمدند و معلمشان با آنان بود.\nضمیر متصل به آخر واژه می‌چسبد و جای مالکیت را می‌گیرد.","pageRef":"صفحه ۹۷"},{"type":"note","title":"ضمیر متصل و صیغه‌های آن","body":"ضمیر متصل به آخر کلمه می‌چسبد و جای مالکیت را می‌گیرد:\nهُ (او، مذکر): كِتابُه (کتابش)؛ ها (او، مؤنث): مَدْرَسَتُها (مدرسه‌اش).\nهُما (آن دو): كِتابُهُما؛ هُم (ایشان): كُتُبُهُم؛ هُنَّ: كُتُبُهُنَّ.\nكَ (تو): كِتابُكَ؛ كِ: كِتابُكِ؛ كُم: كُتُبُكُم؛ نا (ما): كِتابُنا."},{"type":"note","title":"ضمیر متصل بعد از یاء و الف","body":"اگر پیش از ضمیر متصل «هُ» حرف «ی» یا «الف» بیاید، ضمیر به «هِ» تبدیل می‌شود:\nمِنْ + هُ ← مِنْهُ (از او)؛ فی + هُ ← فیهِ (در آن)؛ عَلی + هُ ← عَلَیْهِ (بر آن).\nاما بعد از ضمه یا سکون، «هُ» باقی می‌ماند:\nكِتابُهُ (کتابش)، اُكْتُبْهُ (آن را بنویس)."},{"type":"exam","title":"تشخیص ضمیر متصل و منفصل","body":"سوال: در جمله «هُوَ یُحِبُّ مَدینَتَهُ وَ یَخْدُمُها» ضمیر منفصل و ضمایر متصل را مشخص کنید.\nپاسخ: «هُوَ» ضمیر منفصل است (او)؛ «هُ» در «مَدینَتَهُ» متصل است (شهرش)؛ «ها» در «یَخْدُمُها» متصل است (آن را).\nترجمه: او شهرش را دوست دارد و به آن خدمت می‌کند."},{"type":"exam","title":"ترجمه با ضمیر متصل","body":"سوال: عبارت «اَلْبَحْرُ یَخْزُنُ ماءَ الْأَرْضِ وَ نَعْتَمِدُ عَلَیْهِ فِی زِراعَتِنا» را ترجمه کنید.\nپاسخ: «دریا آب زمین را در خود نگه می‌دارد و ما در کشاورزی‌مان بر آن تکیه داریم».\n«عَلَیْهِ» ضمیر متصل دارد که به دریا برمی‌گردد؛ چون پیش از ضمیر «الف» آمده، «هُ» به «هِ» تبدیل شده است."}]},{"number":9,"title":"اَلتَّضَامُنُ","pages":"۱۰۳ تا ۱۱۴","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۱۰۶","body":"سوال: ماذا یَعْنی اَلتَّضامُنُ؟\nپاسخ: یَعْنی اَلتَّضامُنُ الْاِتّحادَ وَ التَّكاتُفَ؛ نَتَضامَنُ وَ نَتَعاوَنُ لِبِنایِ الْوَطَنِ وَ دَفْعِ الْخَطَرِ.\nترجمه: همبستگی یعنی اتحاد و همدلی؛ برای ساختن کشور و دفع خطر همدست و همکار می‌شویم.","pageRef":"صفحه ۱۰۶"},{"type":"answer","title":"تمرین قواعد صفحه ۱۰۹","body":"سوال: فعل‌های «تَضامَنَ، تَعاوَنَ، تَشارَكَ» را در سه زمان صرف کنید.\nپاسخ: تَضامَنَ (همدست شد)، یَتَضامَنُ (همدست می‌شود)، تَضامَنْ (همدست شو).\nتَعاوَنَ (همکاری کرد)، یَتَعاوَنُ، تَعاوَنْ.\nتَشارَكَ (شرکت کرد)، یَتَشارَكُ، تَشارَكْ.","pageRef":"صفحه ۱۰۹"},{"type":"note","title":"باب تُفاعُل","body":"فعل‌هایی که با «تَـ» آغاز می‌شوند و از «فاعَلَ» گرفته شده‌اند، از باب تُفاعُل‌اند:\nتَضامَنَ، یَتَضامَنُ، تَضامَنْ (همدست شد، می‌شود، شو).\nتَعاوَنَ، یَتَعاوَنُ، تَعاوَنْ (همکاری کرد، می‌کند، کن).\nتَشارَكَ، یَتَشارَكُ، تَشارَكْ (شرکت کرد، می‌کند، کن)."},{"type":"note","title":"ترجمه فعل‌های باب تُفاعُل","body":"معنای این باب معمولاً از فعل ساده واژه پیدا می‌شود:\nتَضامَنَ ← ضامَنَ (ضامن شد) → همدست شد.\nتَعاوَنَ ← عاوَنَ (یاری کرد) → همکاری کرد.\nتَشاجَرَ ← شاجَرَ (جدال کرد) → با هم درگیر شدند.\nمثال: تَعاوَنُوا عَلی الْبِرِّ (بر نیکی همکاری کنید)."},{"type":"exam","title":"صرف باب تُفاعُل","body":"سوال: صرف فعل «تَشارَكَ» را با ضمایر مفرد بنویسید و ترجمه کنید.\nپاسخ: تَشارَكْتُ (شرکت کردم)، تَشارَكْتَ (شرکت کردی)، تَشارَكَ (شرکت کرد)، تَشارَكَتْ (شرکت کرد)، تَشارَكْنا (شرکت کردیم)، تَشارَكْتُمْ (شرکت کردید)."},{"type":"exam","title":"ترجمه عبارت باب تُفاعُل","body":"سوال: عبارت «تَعاوَنَ الشُّعوبُ عَلی التَّقَدُّمِ وَ تَضامَنَتْ عَلی الْحَقِّ» را ترجمه کنید.\nپاسخ: «ملت‌ها برای پیشرفت همکاری کردند و بر حق همدست شدند».\n«تَعاوَنَ» از باب تُفاعُل است و «تَضامَنَتْ» نیز همان باب برای فاعل مؤنث است."}]},{"number":10,"title":"لَیْسَ اللهُ بِغافِلٍ","pages":"۱۱۵ تا ۱۲۶","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۱۱۸","body":"سوال: مَنْ ساعَدَ الْمُعَلِّمَ الْفَقیرَ فِی الْقِصَّةِ؟\nپاسخ: ساعَدَهُ جارُهُ سِرًّا وَ دَفَعَ لَهُ الْإيجارَ، فَلَمْ یَعْرِفْ ذلِكَ اِلّا بَعْدَ مُدَّةٍ.\nترجمه: همسایه‌اش پنهانی به او کمک کرد و اجاره‌اش را پرداخت؛ او این را تنها بعد از مدتی فهمید.\nدرس داستان: خداوند از کار مردم غافل نیست.","pageRef":"صفحه ۱۱۸"},{"type":"answer","title":"تمرین قواعد صفحه ۱۲۱","body":"سوال: جمله‌های زیر را با «لیس» ترجمه کنید:\nلَیْسَ الطّالِبُ كَسْلانًا ← دانش‌آموز تنبل نیست.\nلَیْسَ التِّلْمیذُ فِی الصَّفِّ ← شاگرد در کلاس نیست.\nلَیْسَ اللّٰهُ بِغافِلٍ ← خدا غافل نیست.\nنکته: «لیس» همیشه ترجمه «نیست» می‌گیرد، هرچند فعل ماضی است.","pageRef":"صفحه ۱۲۱"},{"type":"note","title":"فعل «لیس»","body":"«لیس» فعل ماضی جامد و ناقص است و به معنای مضارع، یعنی «نیست»، ترجمه می‌شود:\nلَیْسَ مُحَمَّدًا غائِبًا (محمد غایب نیست).\nلَیْسَ الْعِلْمُ بِصَعْبٍ (علم سخت نیست).\n«لیس» جمله اسمیه را منفی می‌کند؛ اسم آن منصوب می‌شود: مُحَمَّدٌ ← مُحَمَّدًا."},{"type":"note","title":"خبر «لیس»","body":"خبر «لیس» معمولاً جار و مجرور یا ظرف است:\nلَیْسَ التِّلْمیذُ فِی الصَّفِّ (شاگرد در کلاس نیست).\nلَیْسَ اللّٰهُ بِغافِلٍ (خدا غافل نیست)؛ «بِـ» حرف جر است و «غافِلٍ» مجرور به کسره است.\nلَیْسَ الْجَوُّ حارًّا الْیَوْمَ (هوا امروز گرم نیست)؛ «الْیَوْمَ» ظرف زمان است."},{"type":"exam","title":"ترجمه «لیس» در عبارت قرآنی","body":"سوال: عبارت «لَیْسَ اللّٰهُ بِغافِلٍ عَمّا یَعْمَلونَ» را ترجمه کنید.\nپاسخ: «خدا از آنچه انجام می‌دهند غافل نیست».\nنکته: «عَمّا» ترکیبی از «عَنْ + ما» یعنی «از آنچه» است؛ «بِغافِلٍ» حرف جر «بِـ» با اسم مجرور «غافِلٍ» است."},{"type":"exam","title":"لیس با مثنی","body":"سوال: جمله «لَیْسَ الطّالِبَیْنِ غائِبَیْنِ» را ترجمه کنید و علت اعراب «الطّالِبَیْنِ» را بنویسید.\nپاسخ: «دو دانش‌آموز غایب نیستند».\n«الطّالِبَیْنِ» اسم «لیس» است و چون اسم لیس منصوب می‌شود، مثنی در حالت نصب «ینِ» گرفته است؛ اگر مبتدأ بود می‌گفتیم: الطّالِبانِ غائِبانِ."}]},{"number":11,"title":"هَلْ نُساعِدُ الْمَحْرومینَ؟","pages":"۱۲۷ تا ۱۳۸","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۱۳۰","body":"سوال: كَیْفَ نُساعِدُ الْمَحْرومینَ فِی الْمُجْتَمَعِ؟\nپاسخ: نُساعِدُهُمْ بِالصَّدَقَةِ وَ الزَّكاةِ وَ الْإِحْسانِ إِلَیْهِمْ وَ عَدَمِ الْإِخْلالِ بِكَرامَتِهِمْ.\nترجمه: با صدقه و زکات و احسان به آنان و خرد نشدن کرامتشان به محرومان کمک می‌کنیم.","pageRef":"صفحه ۱۳۰"},{"type":"answer","title":"تمرین قواعد صفحه ۱۳۳","body":"سوال: جمله «إِنَّ الْكَرَمَ مِنْ خِصالِ الْمُؤْمِنینَ» را ترجمه کنید و اسم «إِنَّ» را پیدا کنید.\nپاسخ: «بی‌تردید بخشندگی از ویژگی‌های مؤمنان است».\nاسم «إِنَّ» واژه «الْكَرَمَ» است که منصوب شده و خبر آن «مِنْ خِصالِ الْمُؤْمِنینَ» است.","pageRef":"صفحه ۱۳۳"},{"type":"note","title":"حرف تأکید «إِنَّ»","body":"«إِنَّ» حرف تأکید است و اسم آن منصوب و خبر آن مرفوع است:\nإِنَّ الْعِلْمَ نُورٌ (همانا علم نور است).\nإِنَّ الصَّدَقَةَ تُطْفِئُ الْغَضَبَ (همانا صدقه خشم را فرو می‌نشاند).\nترجمه آن «همانا، بی‌تردید، قطعاً» است و در آغاز جمله می‌آید."},{"type":"note","title":"«أَنْ» و «أَنَّ» در جمله","body":"«أَنَّ» در میانه جمله می‌آید و تأکید می‌آورد: عَرَفْتُ أَنَّ الْعِلْمَ نافِعٌ (فهمیدم که علم سودمند است).\n«أَنْ» پس از فعل‌هایی مانند یَحْسُنُ، یَجِبُ، أَرادَ می‌آید و مفعول آن مصدر است:\nیَحْسُنُ أَنْ تُساعِدَ الْمَحْرومینَ (شایسته است به محرومان کمک کنی).\nفعل بعد از «أَنْ» منصوب است."},{"type":"exam","title":"اعراب بعد از «إِنَّ»","body":"سوال: عبارت «إِنَّ الْمُحْسِنینَ یَفُوزونَ بِالْجَنَّةِ» را ترجمه کنید و حالت اعرابی «الْمُحْسِنینَ» را بنویسید.\nپاسخ: «همانا نیکوکاران به بهشت درمی‌یابند».\n«الْمُحْسِنینَ» اسم «إِنَّ» است، پس منصوب است؛ جمع مذکر سالم در حالت نصب «ینَ» دارد."},{"type":"exam","title":"ترجمه با «أَنْ»","body":"سوال: جمله «أَرادَ الرَّجُلُ أَنْ یُساعِدَ الْأَیتامَ بِمَالِهِ» را ترجمه کنید.\nپاسخ: «مرد خواست با مال خود به یتیمان کمک کند».\nنکته: «أَرادَ + أَنْ + فعل مضارع منصوب» به منزله مصدر است؛ «أَنْ یُساعِدَ» یعنی «کمک کردن»."}]},{"number":12,"title":"مِنْ رَسائِلِ الْإِمامِ الْخومَیْنی","pages":"۱۳۹ تا ۱۵۰","contents":[{"type":"answer","title":"تمرین درک مطلب صفحه ۱۴۲","body":"سوال: بِمَذا یَنْصَحُ الْإِمامُ الْخومَیْنی لِلشَّبابِ فِی رِسالَتِهِ؟\nپاسخ: یَنْصَحُ لَهُمْ بِالتَّمَسُّكِ بِالْإِسْلامِ وَ الْاِعْتِزامِ الْأَخْلاقِ وَ عَدَمِ الْخَوْفِ مِنْ أَعْداءِ الْإِسْلامِ.\nترجمه: به آنان سفارش می‌کند که به اسلام چنگ زنند، اخلاق را رعایت کنند و از دشمنان اسلام نترسند.","pageRef":"صفحه ۱۴۲"},{"type":"answer","title":"تمرین ترجمه صفحه ۱۴۵","body":"سوال: عبارت «اعْلَموا أَنَّ الْإِسْلامَ دینُ الْعِزَّةِ وَ الْحَقِّ» را ترجمه کنید.\nپاسخ: «بدانید که اسلام دین عزت و حق است».\nنکته: «أَنَّ» در میانه جمله آمده و اسم آن «الْإِسْلامَ» منصوب و خبر آن «دینُ» مرفوع است.","pageRef":"صفحه ۱۴۵"},{"type":"note","title":"امر و نهی در معنای استحباب و ممنوع","body":"فعل امر گاهی به معنای استحباب و پسندیدگی است: بَرِّ والدَیْكَ (به پدر و مادرت نیکی کن؛ نیکی شایسته است).\nفعل نهی بر ممنوع بودن کار دلالت دارد: لا تَنْشُرِ الْإِشاعَةَ (شایعه را نپراکن؛ انتشار شایعه ممنوع است).\nپس در ترجمه می‌توان گفت: باید، شایسته است، نباید و ممنوع است."},{"type":"note","title":"عبارات باید و نباید","body":"برای بیان تکلیف و ممنوعیت از این عبارت‌ها استفاده می‌شود:\nیَجِبُ أَنْ نُحافِظَ عَلی الْوِدادِ (باید مراقب دوستی باشیم).\nلا یَجِبُ أَنْ نَخافَ مِنْ أَعْداءِ الْحَقِّ (نباید از دشمنان حق بترسیم).\nیَحْسُنُ أَنْ نَعْتَزِمَ عَلی الطَّلَبِ (شایسته است بر طلب علم عزم کنیم)."},{"type":"exam","title":"ترجمه امر و نهی از آیه","body":"سوال: عبارت «تَعاوَنُوا عَلی الْبِرِّ وَ التَّقْوی وَ لا تَعاوَنُوا عَلی الْاِثْمِ» را ترجمه کنید.\nپاسخ: «بر نیکی و پرهیزگاری همکاری کنید و بر گناه همکاری نکنید».\nنکته: «تَعاوَنُوا» امر جمع مخاطبان است و «لا تَعاوَنُوا» نهی همان صیغه است؛ امر گاه استحباب و نهی ممنوعیت را می‌رساند."},{"type":"exam","title":"سوال قواعد ترکیبی","body":"سوال: در عبارت «اعْلَموا أَنَّ اللّٰهَ یَرَاكُمْ فِی كُلِّ مَكانٍ» اسم «أَنَّ» و ضمیر متصل را پیدا کنید و عبارت را ترجمه کنید.\nپاسخ: اسم «أَنَّ» واژه «اللّٰهَ» است؛ ضمیر متصل «كُم» در «یَرَاكُمْ» است.\nترجمه: «بدانید که خدا در هر جا شما را می‌بیند».\n«أَنَّ» تأکید می‌آورد و اسمش منصوب است."}]}]},{"title":"زبان انگلیسی هشتم","subject":"زبان انگلیسی","description":"مکالمه‌ها، نکات گرامر و سوالات امتحانی همه درس‌های کتاب زبان انگلیسی هشتم","color":"pink","icon":"message","chapters":[{"number":1,"title":"My Nationality","pages":"۸ تا ۲۲","contents":[{"type":"answer","title":"تمرین گفت‌وگو: صحبت با توریست","body":"A: Hi! Where are you from?\nB: I'm from Iran. I'm Iranian.\nA: Really? Is your friend Iranian too?\nB: Yes, he is. He's from Shiraz.\nترجمه: سلام! اهل کجایی؟ من اهل ایرانم؛ ایرانی‌ام. واقعا؟ دوستت هم ایرانی است؟ بله، او اهل شیراز است.","pageRef":"صفحه ۱۰"},{"type":"answer","title":"تمرین گفتاری: معرفی ملیت همکلاسی‌ها","body":"This is Sara. She is from Tabriz. She is Iranian.\nThis is Ali. He is from Mashhad. He is Iranian too.\nWe are all Iranian and we are proud of our country.\nترجمه: این سارا است؛ او اهل تبریز و ایرانی است. این علی است؛ او اهل مشهد و ایرانی است. ما همگی ایرانی هستیم و به کشورمان افتخار می‌کنیم.","pageRef":"صفحه ۱۴"},{"type":"note","title":"فعل to be با ضمیرها","body":"در انگلیسی برای معرفی از am برای خودم، is برای او و are برای ما/شما/آن‌ها استفاده می‌کنیم:\nI am Iranian. She is from Qom. They are Turkish.\nترجمه: من ایرانی‌ام. او اهل قم است. آن‌ها ترک‌اند.\nدر سوال: Are you from Iraq? Yes, I am؛ یعنی اهل عراق هستی؟ بله."},{"type":"note","title":"نام کشور و صفت ملیت","body":"صفت ملیت معمولا از نام کشور ساخته می‌شود:\nIran → Iranian، Turkey → Turkish، England → English، China → Chinese، Iraq → Iraqi، Japan → Japanese.\nمثال: My friend is Chinese. She is from China.\nترجمه: دوستم چینی است و اهل چین است."},{"type":"exam","title":"سوال امتحانی: مرتب کردن جمله","body":"جمله‌های پراکنده «from / is / Where / your friend / ?» را مرتب کنید.\nپاسخ: Where is your friend from?\nترجمه: دوستت اهل کجاست؟\nنکته: در سوال با کلمه پرسشی، فعل be قبل از فاعل می‌آید. جواب کوتاه هم درست است: He is from Yazd؛ یعنی او اهل یزد است."},{"type":"exam","title":"سوال امتحانی: جاهای خالی am/is/are","body":"جاهای خالی را با am، is یا are پر کنید:\nI ... from Iran. They ... Turkish. Maryam ... Iranian.\nپاسخ: I am from Iran. They are Turkish. Maryam is Iranian.\nترجمه: من اهل ایرانم؛ آن‌ها ترک‌اند؛ مریم ایرانی است. با ضمیر I همیشه فعل am می‌آید."}]},{"number":2,"title":"My Travel","pages":"۲۳ تا ۳۸","contents":[{"type":"answer","title":"تمرین گفت‌وگو: برنامه سفر","body":"A: Where are you going for the holidays?\nB: I'm going to Mashhad with my family.\nA: How are you going to travel?\nB: By train. It's cheap and fun.\nترجمه: تعطیلات کجا می‌روی؟ با خانواده‌ام به مشهد می‌روم. چطور سفر می‌کنی؟ با قطار؛ هم ارزان است هم جذاب.","pageRef":"صفحه ۲۸"},{"type":"answer","title":"تمرین شنیداری: وسیله‌های نقلیه","body":"به توصیف‌ها گوش دهید و وسیله نقلیه را بگویید:\nIt flies in the sky. → It's a plane؛ هواپیما.\nIt has four wheels and goes on the road. → It's a car؛ خودرو.\nIt goes on rails. → It's a train؛ قطار.\nIt has two wheels. → It's a bicycle؛ دوچرخه.","pageRef":"صفحه ۳۲"},{"type":"note","title":"حرف اضافه by برای وسیله نقلیه","body":"برای گفتن «با وسیله‌ای رفتن» از by استفاده می‌کنیم:\nby bus، by car، by plane، by train، by boat.\nاما برای پیاده‌روی می‌گوییم on foot، نه by foot.\nمثال: We go to school by bus, but Ali goes on foot.\nترجمه: ما با اتوبوس به مدرسه می‌رویم، ولی علی پیاده می‌رود."},{"type":"note","title":"واژه‌های سفر","body":"واژه‌های مهم این درس:\ntravel سفر کردن، trip سفر، ticket بلیت، station ایستگاه، airport فرودگاه، hotel هتل.\nمثال: I buy a ticket at the station and go to the hotel.\nترجمه: در ایستگاه بلیت می‌خرم و به هتل می‌روم."},{"type":"exam","title":"سوال امتحانی: کامل کردن مکالمه","body":"مکالمه «How do you go to Tehran? ...» را کامل کنید.\nپاسخ درست: I go to Tehran by plane.\nترجمه: چطور به تهران می‌روی؟ با هواپیما می‌روم.\nپاسخ‌های by train و by bus هم درست‌اند، ولی by walk غلط است؛ شکل درست آن on foot یعنی پیاده است."},{"type":"exam","title":"سوال امتحانی: ترجمه جمله","body":"جمله «ما تابستان با قطار به شمال سفر می‌کنیم» را به انگلیسی بنویسید.\nپاسخ: We travel to the north by train in the summer.\nنکته: وسیله نقلیه بعد از مقصد می‌آید و با by ساخته می‌شود؛ north یعنی شمال و summer یعنی تابستان. برای سفر معمولا از فعل travel استفاده می‌کنیم."}]},{"number":3,"title":"My Abilities","pages":"۳۹ تا ۵۴","contents":[{"type":"answer","title":"تمرین گفت‌وگو: پرسیدن درباره توانایی","body":"A: Can you swim, Ali?\nB: Yes, I can. I swim very well.\nA: Can you ride a bicycle?\nB: No, I can't, but I can play football.\nترجمه: علی، شنا بلدی؟ بله بلدم؛ خیلی خوب شنا می‌کنم. دوچرخه‌سواری بلدی؟ نه بلد نیستم، ولی فوتبال بازی می‌کنم.","pageRef":"صفحه ۴۴"},{"type":"answer","title":"تمرین گفتاری: توانایی‌های من","body":"I can speak English and a little Arabic.\nI can't drive a car, but my father can.\nMy sister can play the piano very well.\nترجمه: من می‌توانم انگلیسی و کمی عربی صحبت کنم. نمی‌توانم رانندگی کنم ولی پدرم می‌تواند. خواهرم خیلی خوب پیانو می‌زند.","pageRef":"صفحه ۴۸"},{"type":"note","title":"can و can't","body":"برای بیان توانایی از can استفاده می‌کنیم و بعد از آن فعل به شکل ساده می‌آید:\nI can play football. She can cook.\nمنفی آن can't است: I can't swim.\nسوالی: Can you draw? Yes, I can. / No, I can't.\nترجمه: می‌توانم فوتبال بازی کنم؛ او آشپزی بلد است؛ من شنا بلد نیستم؛ نقاشی بلدی؟"},{"type":"note","title":"واژه‌های توانایی‌ها","body":"افعال مهم درباره توانایی:\nswim شنا کردن، climb بالا رفتن، cook آشپزی کردن، ride a bicycle دوچرخه‌سواری، speak a language صحبت به یک زبان، paint نقاشی کردن.\nمثال: Reza can climb trees.\nترجمه: رضا می‌تواند از درخت بالا برود."},{"type":"exam","title":"سوال امتحانی: جواب کوتاه با can","body":"به سوال «Can your mother speak French?» جواب مثبت و منفی بدهید.\nپاسخ مثبت: Yes, she can.\nپاسخ منفی: No, she can't.\nترجمه: مادرت فرانسوی صحبت می‌کند؟ بله بلد است / نه بلد نیست. در جواب کوتاه به‌جای تکرار عبارت، از ضمیر she استفاده می‌کنیم."},{"type":"exam","title":"سوال امتحانی: اصلاح جمله","body":"جمله «He can to play the guitar» را اصلاح کنید.\nپاسخ درست: He can play the guitar.\nترجمه: او می‌تواند گیتار بزند.\nنکته: بعد از can هرگز to نمی‌آید و فعل به شکل ساده نوشته می‌شود. این اشتباه در امتحان‌ها بسیار رایج است؛ مراقب باشید."}]},{"number":4,"title":"My Health","pages":"۵۵ تا ۷۰","contents":[{"type":"answer","title":"تمرین گفت‌وگو: در مطب دکتر","body":"A: What's the matter?\nB: I have a headache and a cold.\nA: You should see a doctor and rest at home.\nB: Thanks. I will.\nترجمه: چه شده؟ سردرد و سرماخوردگی دارم. باید به دکتر بروی و در خانه استراحت کنی. ممنون، این کار را می‌کنم.","pageRef":"صفحه ۶۰"},{"type":"answer","title":"تمرین گفتاری: توصیه‌های سلامتی","body":"Eat fruit and vegetables every day.\nDon't eat too much candy. It's bad for your teeth.\nDrink a lot of water and sleep early.\nترجمه: هر روز میوه و سبزیجات بخور. زیاد شیرینی نخور؛ برای دندان‌هایت بد است. آب فراوان بنوش و زود بخواب.","pageRef":"صفحه ۶۴"},{"type":"note","title":"بیماری‌ها با have","body":"برای گفتن بیماری از ساختار have استفاده می‌کنیم:\nI have a headache سردرد دارم.\nI have a cold سرما خورده‌ام.\nI have a stomachache دل‌درد دارم.\nI have a fever تب دارم.\nمثال: He has a toothache؛ یعنی او دندان‌درد دارد. با he/she فعل has می‌شود."},{"type":"note","title":"should و shouldn't","body":"برای دادن توصیه از should استفاده می‌کنیم:\nYou should drink warm tea؛ یعنی باید چای گرم بنوشی.\nمنفی آن shouldn't است:\nYou shouldn't play outside when you are sick.\nترجمه: نباید وقتی مریضی بیرون بازی کنی. بعد از should همیشه فعل ساده می‌آید."},{"type":"exam","title":"سوال امتحانی: گزینه درست مکالمه","body":"پاسخ سوال «What's the matter with Sara?» کدام است؟ a) She is from Qom b) She has a headache c) She can swim.\nپاسخ درست: گزینه b؛ یعنی سارا سردرد دارد.\nگزینه a درباره ملیت و گزینه c درباره توانایی است و به سوال «چه شده؟» جواب نمی‌دهند."},{"type":"exam","title":"سوال امتحانی: ساختن جمله با should","body":"برای جمله «دلم درد می‌کند» یک توصیه به انگلیسی بنویسید.\nپاسخ نمونه: I have a stomachache. I should see a doctor.\nیا: You should rest and drink water.\nترجمه: دل‌درد دارم؛ باید به دکتر بروم. باید استراحت کنی و آب بخوری. توصیه همیشه با should ساخته می‌شود."}]},{"number":5,"title":"My Appearance","pages":"۷۱ تا ۸۶","contents":[{"type":"answer","title":"تمرین گفت‌وگو: توصیف ظاهر برادر","body":"A: What does your brother look like?\nB: He is tall and thin. He has short black hair.\nA: Does he wear glasses?\nB: Yes, he does.\nترجمه: برادرت چه شکلی است؟ قدبلند و لاغر است و موهای کوتاه سیاه دارد. عینک می‌زند؟ بله عینک می‌زند.","pageRef":"صفحه ۷۶"},{"type":"answer","title":"تمرین گفتاری: ظاهر من و دوستم","body":"I am short and I have curly hair. My eyes are brown.\nMy friend Reza is tall. He has straight hair and green eyes.\nترجمه: من قد کوتاه دارم و موهای فرفری دارم؛ رنگ چشمانم قهوه‌ای است. دوستم رضا قدبلند است؛ موهای صاف و چشمان سبز دارد.","pageRef":"صفحه ۸۰"},{"type":"note","title":"صفت‌های ظاهر","body":"برای توصیف قد و اندام از am/is/are با صفت استفاده می‌کنیم:\ntall قدبلند، short کوتاه‌قد، thin لاغر، fat چاق، young جوان، old پیر.\nمثال: My teacher is tall and thin.\nترجمه: معلمم قدبلند و لاغر است. برای مو می‌گوییم long hair یا short hair."},{"type":"note","title":"have و has برای چهره","body":"برای چشم، مو و عینک از have/has استفاده می‌کنیم:\nI have brown eyes. He has blue eyes.\nShe has long hair. My grandfather has a white beard.\nترجمه: من چشمان قهوه‌ای دارم؛ او چشمان آبی دارد؛ او موهای بلند دارد؛ پدربزرگم ریش سفید دارد. با he/she/it فعل has می‌آید."},{"type":"exam","title":"سوال امتحانی: ساختن سوال مناسب","body":"برای جواب «She has green eyes» سوال مناسب بسازید.\nپاسخ: What does she look like? یا What color are her eyes?\nترجمه: او چه شکلی است؟ / رنگ چشمانش چیست؟ او چشمان سبز دارد. برای پرسیدن ظاهر افراد از عبارت look like استفاده می‌کنیم."},{"type":"exam","title":"سوال امتحانی: انتخاب have یا has","body":"جاهای خالی را با have یا has پر کنید:\nAli ... short hair. I ... brown eyes. Sara and Maryam ... curly hair.\nپاسخ: Ali has، I have، Sara and Maryam have.\nترجمه: علی موی کوتاه دارد؛ من چشمان قهوه‌ای دارم؛ سارا و مریم موهای فرفری دارند. فاعل جمع همیشه have می‌گیرد."}]},{"number":6,"title":"My Village","pages":"۸۷ تا ۱۰۲","contents":[{"type":"answer","title":"تمرین گفت‌وگو: درباره روستا","body":"A: Where is your village?\nB: It is near Isfahan, in the mountains.\nA: Is it beautiful?\nB: Yes! There is a river and there are many trees there.\nترجمه: روستایت کجاست؟ نزدیک اصفهان و در کوهستان است. زیباست؟ بله! آنجا رودی هست و درختان زیادی وجود دارند.","pageRef":"صفحه ۹۲"},{"type":"answer","title":"تمرین گفتاری: جاهای شهر من","body":"In my city there is a big library near my school.\nThere are two parks and a stadium in our town.\nThere isn't an airport here.\nترجمه: در شهر من کتابخانه بزرگی نزدیک مدرسه‌ام هست. در شهر ما دو پارک و یک ورزشگاه وجود دارد. اینجا فرودگاهی نیست.","pageRef":"صفحه ۹۶"},{"type":"note","title":"There is و There are","body":"برای گفتن «وجود داشتن» از There is برای مفرد و There are برای جمع استفاده می‌کنیم:\nThere is a mosque in my village.\nThere are many gardens there.\nمنفی: There isn't / There aren't.\nسوالی: Is there a bank? Yes, there is.\nترجمه: در روستای من مسجدی هست و باغ‌های زیادی آنجا است."},{"type":"note","title":"واژه‌های روستا و طبیعت","body":"واژه‌های مهم این درس:\nvillage روستا، mountain کوه، river رود، tree درخت، farm مزرعه، garden باغ، cow گاو، sheep گوسفند.\nمثال: My uncle works on a farm. He has many cows and sheep.\nترجمه: دایی‌ام در مزرعه کار می‌کند؛ او گاو و گوسفند زیادی دارد."},{"type":"exam","title":"سوال امتحانی: جاهای خالی is/are","body":"جمله‌ها را کامل کنید: «There ... a river near the village. There ... many trees in the park.»\nپاسخ: There is a river near the village. There are many trees in the park.\nترجمه: نزدیک روستا رویی هست؛ در پارک درختان زیادی هستند. river مفرد است و trees جمع."},{"type":"exam","title":"سوال امتحانی: ساختن سوال با Is there","body":"برای جمله «There is a library in our street» سوال بسازید و جواب کوتاه بدهید.\nپاسخ: Is there a library in our street? Yes, there is.\nترجمه: در خیابان ما کتابخانه‌ای هست؟ بله هست. در حالت سوالی، is قبل از there می‌آید و جواب کوتاه آن Yes, there is یا No, there isn't است."}]},{"number":7,"title":"My Hobbies","pages":"۱۰۳ تا ۱۱۸","contents":[{"type":"answer","title":"تمرین گفت‌وگو: سرگرمی‌های وقت آزاد","body":"A: What do you do in your free time?\nB: I like reading books and playing chess.\nA: Do you like sports?\nB: Yes, I like swimming very much.\nترجمه: وقت آزادت چه کار می‌کنی؟ کتاب‌خواندن و شطرنج بازی کردن را دوست دارم. ورودوست هستی؟ بله، خیلی شنا را دوست دارم.","pageRef":"صفحه ۱۰۸"},{"type":"answer","title":"تمرین گفتاری: سرگرمی خانواده","body":"My father likes fishing. He goes to the lake on Fridays.\nMy mother likes cooking and my brother likes painting.\nI don't like watching TV a lot.\nترجمه: پدرم ماهیگیری را دوست دارد و جمعه‌ها به دریاچه می‌رود. مادرم آشپزی و برادرم نقاشی را دوست دارند. من زیاد تماشای تلویزیون را دوست ندارم.","pageRef":"صفحه ۱۱۲"},{"type":"note","title":"like به‌همراه فعل ing","body":"بعد از like برای گفتن سرگرمی، فعل به شکل ing می‌آید:\nI like playing football. She likes reading stories.\nمنفی: I don't like playing video games.\nسوالی: Do you like painting? Yes, I do.\nترجمه: من فوتبال بازی کردن را دوست دارم؛ او داستان خواندن را دوست دارد؛ نقاشی دوست داری؟"},{"type":"note","title":"واژه‌های سرگرمی‌ها","body":"سرگرمی‌های رایج به انگلیسی:\nreading کتاب‌خواندن، painting نقاشی، fishing ماهیگیری، camping کمپ‌زدن، gardening باغبانی، listening to music گوش دادن به موسیقی، playing chess شطرنج بازی کردن.\nمثال: My hobby is gardening؛ یعنی سرگرمی من باغبانی است."},{"type":"exam","title":"سوال امتحانی: کامل کردن جمله","body":"جمله «My sister likes ... (read) stories at night» را کامل کنید.\nپاسخ: My sister likes reading stories at night.\nترجمه: خواهرم شب‌ها داستان خواندن را دوست دارد.\nنکته: بعد از like فعل به شکل ing می‌آید و read بدون تغییر غلط است. با he/she هم فعل like به likes تبدیل می‌شود."},{"type":"exam","title":"سوال امتحانی: ساختن سوال با Do","body":"با واژه‌های «you / Do / playing / like / chess?» سوال بسازید و جواب منفی بدهید.\nپاسخ: Do you like playing chess? No, I don't.\nترجمه: شطرنج بازی کردن را دوست داری؟ نه، دوست ندارم.\nنکته: در سوال با Do، فعل اصلی به شکل ساده می‌آید و در جواب منفی کوتاه از don't استفاده می‌کنیم."}]},{"number":8,"title":"My Food","pages":"۱۱۹ تا ۱۳۴","contents":[{"type":"answer","title":"تمرین گفت‌وگو: صبحانه","body":"A: What do you have for breakfast?\nB: I usually have bread and cheese with tea.\nA: Do you eat eggs every day?\nB: No, only on Thursdays.\nترجمه: صبحانه چه می‌خوری؟ معمولا نان و پنیر با چای می‌خورم. هر روز تخم‌مرغ می‌خوری؟ نه، فقط پنجشنبه‌ها.","pageRef":"صفحه ۱۲۴"},{"type":"answer","title":"تمرین گفتاری: غذای مورد علاقه","body":"My favorite food is Ghormeh Sabzi. It is a Persian stew.\nI like rice with fish, but I don't like fast food.\nMy father's favorite dish is Kabab.\nترجمه: غذای مورد علاقه‌ام قورمه‌سبزی است؛ یک خورش ایرانی است. برنج با ماهی را دوست دارم ولی فست‌فود دوست ندارم. غذای مورد علاقه پدرم کباب است.","pageRef":"صفحه ۱۲۸"},{"type":"note","title":"واژه‌های غذا و وعده‌ها","body":"وعده‌های غذایی به انگلیسی:\nbreakfast صبحانه، lunch ناهار، dinner شام.\nغذاها: rice برنج، bread نان، cheese پنیر، milk شیر، chicken مرغ، fish ماهی، soup سوپ، fruit میوه.\nمثال: We have dinner at eight؛ یعنی شام را ساعت هشت می‌خوریم."},{"type":"note","title":"قیدهای تکرار","body":"برای گفتن میزان تکرار یک کار از این قیدها استفاده می‌کنیم:\nalways همیشه، usually معمولا، sometimes گاهی، never هرگز.\nمثال: I always drink tea after lunch. She never eats fast food.\nترجمه: من همیشه بعد از ناهار چای می‌نوشم؛ او هرگز فست‌فود نمی‌خورد. قید قبل از فعل می‌آید."},{"type":"exam","title":"سوال امتحانی: ترجمه جمله","body":"جمله «من همیشه صبحانه را با خانواده می‌خورم» را به انگلیسی بنویسید.\nپاسخ: I always have breakfast with my family.\nنکته: قید always قبل از فعل می‌آید. برای وعده‌ها از have استفاده می‌کنیم مثل have lunch و have dinner؛ یعنی ناهار و شام خوردن."},{"type":"exam","title":"سوال امتحانی: کامل کردن مکالمه","body":"مکالمه «What's your favorite food? ...» را کامل کنید.\nپاسخ نمونه: My favorite food is pizza. / I like soup.\nترجمه: غذای مورد علاقه‌ات چیست؟ غذای مورد علاقه من پیتزا است / من سوپ را دوست دارم. به‌جای What is می‌توان از شکل کوتاه What's هم استفاده کرد."}]},{"number":9,"title":"My Weather","pages":"۱۳۵ تا ۱۴۸","contents":[{"type":"answer","title":"تمرین گفت‌وگو: وضعیت هوا","body":"A: What's the weather like today?\nB: It's cold and rainy.\nA: Is it snowy in winter in your city?\nB: Yes, it snows a lot in Ardabil.\nترجمه: امروز هوا چطور است؟ سرد و بارانی است. در شهر شما زمستان‌ها برفی است؟ بله، در اردبیل زیاد برف می‌بارد.","pageRef":"صفحه ۱۴۰"},{"type":"answer","title":"تمرین گفتاری: گزارش هواشناسی","body":"Today in Tehran it is sunny and warm.\nIn Tabriz it is cloudy and windy.\nTomorrow it will be cold in Shiraz.\nترجمه: امروز در تهران هوا آفتابی و گرم است. در تبریز هوا ابری و بادی است. فردا در شیراز هوا سرد خواهد بود.","pageRef":"صفحه ۱۴۴"},{"type":"note","title":"It برای آب و هوا","body":"برای گفتن وضع هوا جمله با It شروع می‌شود:\nIt is hot گرم است.\nIt is rainy بارانی است.\nIt is snowy برفی است.\nIt is windy بادی است.\nمثال: In summer it is very hot in Ahvaz.\nترجمه: در تابستان هوا در اهواز خیلی گرم است."},{"type":"note","title":"فصل‌ها به انگلیسی","body":"فصل‌های سال به انگلیسی:\nspring بهار، summer تابستان، autumn پاییز، winter زمستان.\nمثال: It rains a lot in autumn. It snows in winter.\nترجمه: در پاییز زیاد باران می‌بارد و در زمستان برف می‌بارد. برای باران و برف به‌صورت فعل از rains و snows استفاده می‌کنیم."},{"type":"exam","title":"سوال امتحانی: وصل کردن ستون‌ها","body":"کلمه‌ها را به معنی درست وصل کنید: sunny، rainy، cold، windy با گزینه‌های آفتابی، بارانی، سرد، بادی.\nپاسخ: sunny آفتابی، rainy بارانی، cold سرد، windy بادی.\nنکته: همه این صفت‌ها با It is به کار می‌روند مثل جمله It is sunny today؛ یعنی امروز هوا آفتابی است."},{"type":"exam","title":"سوال امتحانی: ترجمه و بازنویسی","body":"جمله «در زمستان هوا در رشت سرد و بارانی است» را به انگلیسی بنویسید.\nپاسخ: In winter the weather is cold and rainy in Rasht.\nیا: In winter it is cold and rainy in Rasht.\nنکته: برای هوا می‌توان از the weather is یا it is استفاده کرد؛ هر دو پاسخ درست‌اند."}]},{"number":10,"title":"My City","pages":"۱۴۹ تا ۱۵۸","contents":[{"type":"answer","title":"تمرین گفت‌وگو: معرفی شهر","body":"A: Tell me about your city.\nB: It is a big city in the south of Iran.\nA: Are there any nice places there?\nB: Yes, there are beautiful parks and an old castle.\nترجمه: از شهرت بگو. شهری بزرگ در جنوب ایران است. جای‌های قشنگی آنجا هست؟ بله، پارک‌های زیبا و یک قلعه قدیمی دارد.","pageRef":"صفحه ۱۵۲"},{"type":"answer","title":"تمرین گفتاری: آدرس پرسیدن","body":"Excuse me, where is the bus stop?\nGo straight and turn left. It is next to the bank.\nThank you very much. You're welcome.\nترجمه: ببخشید، ایستگاه اتوبوس کجاست؟ مستقیم برو و به چپ بپیچ؛ کنار بانک است. خیلی ممنون. خواهش می‌کنم.","pageRef":"صفحه ۱۵۵"},{"type":"note","title":"واژه‌های مکان‌های شهر","body":"مکان‌های مهم شهر به انگلیسی:\npark پارک، museum موزه، mosque مسجد، hospital بیمارستان، post office دفتر پست، bus stop ایستگاه اتوبوس، castle قلعه، bridge پل.\nمثال: The museum is near the bridge.\nترجمه: موزه نزدیک پل است."},{"type":"note","title":"جهت‌ها و آدرس دادن","body":"برای آدرس دادن از این عبارت‌ها استفاده می‌کنیم:\ngo straight مستقیم برو، turn right به راست بپیچ، turn left به چپ بپیچ، next to کنارِ، between بینِ.\nمثال: The hospital is between the school and the park.\nترجمه: بیمارستان بین مدرسه و پارک است."},{"type":"exam","title":"سوال امتحانی: جاهای خالی There is/are","body":"جمله‌ها را کامل کنید: «... a big mosque in my city. ... many shops in the center.»\nپاسخ: There is a big mosque in my city. There are many shops in the center.\nترجمه: در شهر من مسجد بزرگی هست؛ در مرکز شهر فروشگاه‌های زیادی هستند. mosque مفرد و shops جمع است."},{"type":"exam","title":"سوال امتحانی: مکالمه آدرس","body":"برای جمله «ببخشید، موزه کجاست؟» یک مکالمه کوتاه بنویسید.\nپاسخ نمونه: Excuse me, where is the museum? Go straight and turn right. It is behind the park.\nترجمه: ببخشید، موزه کجاست؟ مستقیم برو و به راست بپیچ؛ پشت پارک است. behind یعنی پشتِ چیزی."}]},{"number":11,"title":"My Weekend","pages":"۱۵۹ تا ۱۶۸","contents":[{"type":"answer","title":"تمرین گفت‌وگو: برنامه آخر هفته","body":"A: What do you do on Thursdays?\nB: I go to the park with my cousins and play football.\nA: What about Friday?\nB: We visit our grandparents.\nترجمه: پنجشنبه‌ها چه کار می‌کنی؟ با دخترعمو و پسرعموهایم به پارک می‌روم و فوتبال بازی می‌کنم. جمعه چه؟ به دیدن پدربزرگ و مادربزرگ می‌رویم.","pageRef":"صفحه ۱۶۲"},{"type":"answer","title":"تمرین گفتاری: کارهای روزهای هفته","body":"On Mondays I go to the swimming pool.\nOn Wednesdays I have a science class.\nOn Fridays our family has lunch together.\nترجمه: دوشنبه‌ها به استخر می‌روم. چهارشنبه‌ها کلاس علوم دارم. جمعه‌ها خانواده ما با هم ناهار می‌خوریم.","pageRef":"صفحه ۱۶۵"},{"type":"note","title":"روزهای هفته و حرف on","body":"روزهای هفته به انگلیسی:\nSaturday شنبه، Sunday یکشنبه، Monday دوشنبه، Tuesday سه‌شنبه، Wednesday چهارشنبه، Thursday پنجشنبه، Friday جمعه.\nقبل از روزها حرف on می‌آید: On Friday I play chess؛ یعنی جمعه‌ها شطرنج بازی می‌کنم."},{"type":"note","title":"in و on برای زمان","body":"برای روزهای هفته on و برای بخش‌های روز in به کار می‌رود:\non Monday، on Fridays، in the morning، in the afternoon، in the evening.\nمثال: We go to the mosque on Friday morning.\nترجمه: صبح جمعه به مسجد می‌رویم. برای شب از at night استفاده می‌کنیم."},{"type":"exam","title":"سوال امتحانی: انتخاب in یا on","body":"جاهای خالی را با in یا on پر کنید: «... Thursday I get up late ... the morning.»\nپاسخ: On Thursday I get up late in the morning.\nترجمه: پنجشنبه‌ها صبح‌ها دیر بیدار می‌شوم. قبل از روز هفته on و قبل از بخش‌های روز مثل morning و evening حرف in می‌آید."},{"type":"exam","title":"سوال امتحانی: ترجمه جمله","body":"جمله «جمعه‌ها با پدربزرگم شطرنج بازی می‌کنم» را به انگلیسی بنویسید.\nپاسخ: On Fridays I play chess with my grandfather.\nنکته: برای عادت‌های تکرارشونده از فعل ساده استفاده می‌شود؛ شکل جمع Friday یعنی Fridays به معنی هر جمعه است و قبل از آن on می‌آید."}]},{"number":12,"title":"Review","pages":"۱۶۹ تا ۱۸۰","contents":[{"type":"answer","title":"تمرین مرور درس‌های ۱ تا ۴","body":"به سوال‌ها جواب کوتاه بدهید:\nWhere are you from? → I am from Iran.\nCan you cook? → Yes, I can.\nWhat's the matter? → I have a cold.\nترجمه: اهل کجایی؟ اهل ایرانم. آشپزی بلدی؟ بله بلدم. چه شده؟ سرما خورده‌ام.","pageRef":"صفحه ۱۷۰"},{"type":"answer","title":"تمرین مرور درس‌های ۵ تا ۹","body":"جاهای خالی را با پاسخ‌های داده‌شده پر کنید:\nMy sister ... green eyes. (has)\nThere ... two parks in our city. (are)\n... is sunny today. (It)\nترجمه: خواهرم چشمان سبز دارد؛ در شهر ما دو پارک هست؛ امروز هوا آفتابی است.","pageRef":"صفحه ۱۷۴"},{"type":"note","title":"جمع‌بندی ساختارهای کتاب","body":"در زبان انگلیسی هشتم این ساختارها را یاد گرفتیم:\nam/is/are برای معرفی، can برای توانایی، should برای توصیه، have/has برای دارایی، There is/There are برای وجود داشتن و like + ing برای سرگرمی.\nمثال: I can swim, I have a bike and I like riding it."},{"type":"note","title":"راهکار مطالعه برای امتحان","body":"برای امتحان زبان انگلیسی:\nواژه‌های هر درس را همراه معنی بنویسید و روزانه تکرار کنید.\nمکالمه‌ها را بلند بخوانید تا تلفظتان بهتر شود.\nبا هر ساختار گرامری جمله بسازید؛ مثلا با There is درباره اتاقتان بنویسید.\nترجمه: تمرین روزانه حتی پانزده دقیقه بهترین راه یادگیری است."},{"type":"exam","title":"سوال امتحانی: ترجمه متن کوتاه","body":"متن «Hello. My name is Hossein. I am Iranian. I live in Shiraz. My city is beautiful. There are many gardens there. I like walking in them.» را ترجمه کنید.\nپاسخ: سلام. نام من حسین است و ایرانی‌ام. در شیراز زندگی می‌کنم. شهرم زیباست و باغ‌های زیادی آنجا هست؛ من پیاده‌روی در آن‌ها را دوست دارم."},{"type":"exam","title":"سوال امتحانی: نوشتن پاراگراف","body":"با ساختارهای from، can، There is و like یک پاراگراف پنج جمله‌ای درباره خودتان بنویسید.\nپاسخ نمونه: I am from Yazd. I can ride a bicycle. There is a park near my house. I like playing there. My favorite subject is English.\nترجمه: اهل یزد هستم؛ دوچرخه‌سواری بلدم و بازی در پارک را دوست دارم."}]}]},{"title":"پیام‌های آسمان هشتم","subject":"پیام‌های آسمان","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب پیام‌های آسمان هشتم","color":"amber","icon":"sparkles","chapters":[{"number":1,"title":"نیکی به دیگران","pages":"۲ تا ۱۵","contents":[{"type":"answer","title":"چرا نیکی به دیگران برای مسلمان اهمیت دارد؟","body":"چون مردم در دید اسلام، خانواده خداوند شمرده می‌شوند. امام علی ع فرمود: الخَلقُ عِیالُ اللهِ فَأحَبُّ الخَلقِ إلَی اللهِ مَن نَفَعَ عِیالَ اللهِ؛ مردم خانواده خدایند و محبوب‌ترین آنان نزد خدا کسی است که به خانواده خدا سود برساند. پس نیکی به مردم، هم عبادت خداست و هم پیوند دل‌های مسلمانان را استوار می‌کند.","pageRef":"صفحه ۵"},{"type":"answer","title":"آثار نیکی به دیگران چیست؟","body":"نیکی به دیگران آثار فراوانی دارد: خشنودی خداوند و رسیدن پاداش در آخرت، جلب محبت و دوستی مردم، ایجاد صمیمیت و همدلی در جامعه و آرامش دل نیکوکار. کسی که کار نیک می‌کند، رابطه‌اش با خدا و مردم تقویت می‌شود و جامعه هم به برکت چنین کارهایی سرشار از مهربانی و همراهی می‌شود.","pageRef":"صفحه ۸"},{"type":"note","title":"خدا نیکوکاران را دوست دارد","body":"خداوند در قرآن می‌فرماید: إنَّ اللهَ یُحِبُّ المُحسِنین؛ همانا خداوند نیکوکاران را دوست دارد. پس هر کار خیری که برای مردم انجام می‌دهیم، اگر با نیت خشنودی او باشد، محبوب خداست و پاداش دارد؛ حتی کار کوچکی مانند لبخند به برادر مسلمان، کمک به هم‌کلاسی یا رساندن آب به تشنه‌ای."},{"type":"note","title":"مؤمن، امن‌کننده مردم","body":"نیکی به دیگران تنها به مسلمانان اختصاص ندارد؛ باید با همه انسان‌ها نیکو رفتار کرد و کسی را نارنجک نکرد. پیامبر ص فرمود: المُؤمِنُ مَن أَمِنَهُ النّاسُ عَلی دِمائِهِم وَأَموالِهِم؛ مؤمن کسی است که مردم از بدی او بر جان و مال خود اطمینان داشته باشند."},{"type":"exam","title":"دو نمونه از نیکی به دیگران در زندگی روزمره را همراه با توضیح بیان کنید.","body":"نمونه اول: کمک به هم‌کلاسی‌ای که در درس ضعیف است؛ با این کار او به موفقیت می‌رسد و پیوند دوستی استوار می‌شود. نمونه دوم: کمک به همسایه نیازمند یا نگهداری از وسایل او؛ این کار درد او را کم می‌کند و پیوند همسایگی را محکم می‌کند. هر دو کار، عبادت و مایه خشنودی خداست."},{"type":"exam","title":"حدیث «المُؤمِنُ مَن أَمِنَهُ النّاسُ...» را ترجمه کنید و توضیح دهید.","body":"ترجمه: مؤمن کسی است که مردم از بدی او بر جان و مال خود اطمینان داشته باشند.\nتوضیح: مؤمن واقعی جان مردم را نمی‌رنجاند، غیبت نمی‌کند و حق مال آنان را نمی‌خورد؛ رفتارش با کلامش هماهنگ است. به همین دلیل مردم به او اعتماد می‌کنند و این اعتماد، نشانه ایمان درون اوست."}]},{"number":2,"title":"اخلاق","pages":"۱۶ تا ۲۹","contents":[{"type":"answer","title":"انسان چگونه در رفتار و زندگی دیگران اثر می‌گذارد؟","body":"انسان‌ها با کلام و رفتار خود بر یکدیگر اثر می‌گذارند. خوش‌خو با سخن نرم، دل‌ها را به سوی خوبی می‌کشاند و دوستان فراوان دارد؛ اما بدخو با رفتار زشتش مردم را می‌رنجاند و روزبه‌روز تنها می‌شود. به همین دلیل پیامبر ص فرمودند: بهترینِ شما، خوب‌خوترینِ شماست.","pageRef":"صفحه ۱۷"},{"type":"answer","title":"آثار بداخلاقی را بیان کنید.","body":"بداخلاقی آثار زیانباری دارد: نفرت مردم و تنهایی انسان، دور شدن دوستان و برادران، رنجش خانواده و آشفتگی دل خودِ انسان. امام علی ع فرمود: الأَخلاقُ السَّیِّئَةُ بِداءُ النُّفوسِ؛ اخلاق بد، بیماری جان‌هاست. بدخو خشنودی خدا را نیز از دست می‌دهد؛ زیرا رنجانیدن مردم، ناخشنودی خداست.","pageRef":"صفحه ۲۰"},{"type":"note","title":"خوش‌خویی، نشانه ایمان","body":"پیامبر ص فرمود: إنَّ مِن أحَبِّکُم إلَیَّ وأَقرَبِکُم مِنّی مَجلِسًا یَومَ القِیامَةِ أحاسِنَکُم أَخلاقًا؛ محبوب‌ترین و نزدیک‌ترینِ شما به من در قیامت، خوب‌خوترینِ شماست. پس زیبایی اخلاق، معیار نزدیکی به پیامبر است و با ثروت و مقام به دست نمی‌آید."},{"type":"note","title":"اخلاق، تغییرپذیر است","body":"بداخلاقی ریشه در خودخواهی، حسادت، غرور و خشم دارد؛ کسی که بخواهد اخلاقش را زیبا کند، باید ریشه‌های بدی را در درون خود بیابد و با عزم و تمرین پیاپی، اخلاق نیک را جایگزین کند. اخلاق امری ثابت نیست؛ با اراده و تمرین، بدخو می‌تواند خوش‌خو شود و خشنودی خدا و مردم را به دست آورد."},{"type":"exam","title":"حدیث «إنَّ مِن أحَبِّکُم إلَیَّ...» را ترجمه کنید و از آن نتیجه بگیرید.","body":"ترجمه: محبوب‌ترینِ شما نزد من و نزدیک‌ترینِ شما به من در روز قیامت، خوب‌خوترینِ شماست.\nنتیجه: در این حدیث معیار نزدیکی به پیامبر ص، زیبایی اخلاق است نه ثروت و مقام؛ پس هرکس می‌خواهد در قیامت به پیامبر نزدیک شود، باید اخلاقش را نیکو کند و با مردم مهربان باشد."},{"type":"exam","title":"چرا پیامبران باید خودشان خوش‌خو باشند؟","body":"پیامبران برای هدایت مردم از سوی خدا برانگیخته شده‌اند و مردم از کسی پیروی می‌کنند که خودش به گفته‌هایش عمل کند. اگر پیامبری بدخو بود، هیچ‌کس سخنانش را نمی‌پذیرفت و دعوتش بی‌اثر می‌شد. به همین دلیل خوش‌خویی پیامبران، به‌ویژه پیامبر اکرم ص، بزرگ‌ترین اثرگذاری در دعوت آنان داشت."}]},{"number":3,"title":"عفو و گذشت","pages":"۳۰ تا ۴۳","contents":[{"type":"answer","title":"عفو و گذشت یعنی چه؟","body":"عفو یعنی چشم‌پوشی از خطای دیگران و گرفتن انتقام از آنان؛ یعنی وقتی کسی به ما بدی کرد، او را ببخشیم و در دل کینه نگیریم. گذشت از نشانه‌های بزرگ‌منشی است و خداوند عفوکنندگان را دوست دارد و در قرآن به آنان وعده پاداش بزرگ داده است؛ زیرا بخشیدن، کار دشوار و نیازمند دل بزرگ است.","pageRef":"صفحه ۳۱"},{"type":"answer","title":"در چه مواردی نمی‌توان از خطای دیگران گذشت کرد؟","body":"اگر خطای انسان، حق‌الناس باشد مانند گرفتن مال مردم، شکستن چیز دیگران یا آزار جسمی، تنها گذشت کافی نیست؛ صاحب حق باید جبران کند: مال را بازگرداند، خسارت را بپردازد و از صاحبش حلالیت بطلبد. خداوند در این صورت گناه را می‌بخشد، اما حق مردم را بی‌جبران نمی‌بخشد.","pageRef":"صفحه ۳۴"},{"type":"note","title":"عفو در هنگام قدرت","body":"امام علی ع فرمود: إنَّ العَفوَ عِندَ قُدرَتِکَ مِن أعظَمِ الأعمال؛ عفو کردن در حالی که توان انتقام داری، از بزرگ‌ترین کارهاست. یعنی وقتی می‌توانی خطاکار را سزادهی کنی ولی او را می‌بخشی، روح بزرگ خود را نشان داده‌ای؛ همان کاری که پیامبر ص در سال فتح مکه با اهل مکه کرد."},{"type":"note","title":"بخشیدن دیگران، شرط آمرزش خدا","body":"خداوند می‌فرماید: وَلیَعفوا وَلیَصفَحوا ألا تُحِبّونَ أن یَغفِرَ اللهُ لَکُم؛ و باید عفو کنند و درگذرند؛ آیا دوست ندارید خدا شما را ببخشد؟ پس اگر می‌خواهیم گناهان ما بخشیده شود، باید دل خود را از کینه پاک کنیم و از خطای مردم چشم‌پوشی کنیم."},{"type":"exam","title":"تفاوت گذشت از خطای دیگران با بی‌تفاوتی نسبت به حق مردم را توضیح دهید.","body":"گذشت یعنی چشم‌پوشی از خطای کسی که به خود ما بدی کرده است؛ اما اگر خطای او حق مردم را نابود کرده باشد، مسلمان نباید بی‌تفاوت باشد و بگذارد حق‌ها ضایع بماند. در این موارد باید حق جبران شود و صاحب حق حلالیت بگیرد. پس مؤمن نه کینه‌جو است و نه بی‌تفاوت؛ گذشت او با حق‌جویی همراه است."},{"type":"exam","title":"چرا خداوند به گذشت‌کنندگان پاداش بزرگ می‌دهد؟","body":"چون گذشت کار سختی است؛ انسان هنگام دلخوری، احساس خشم دارد و چشم‌پوشی از آن به اراده قوی و بزرگی روح نیاز دارد. به همین دلیل خداوند در قرآن درباره عفوکنندگان می‌فرماید: إنَّ ذلِکَ لَمِن عَزمِ الأمور؛ این از کارهای بزرگ و استوار است. پاداش چنین کار سختی نیز در قیامت بزرگ خواهد بود."}]},{"number":4,"title":"راستگویی","pages":"۴۴ تا ۵۷","contents":[{"type":"answer","title":"راستگویی چه آثاری در زندگی انسان دارد؟","body":"راستگویی آثار خوبی دارد: اعتماد مردم به انسان، آرامش دل، حفظ آبرو و نزدیکی به خدا. پیامبر ص فرمود: علَیکُم بِالصِّدکِ فإنَّهُ یَهدی إلَی البِرّ؛ بر شما باد راستی، که آن به نیکی راه می‌نماید. راستگو هرگز نگران برملا شدن سخنانش نیست و مردم سخن او را می‌پذیرند.","pageRef":"صفحه ۴۵"},{"type":"answer","title":"چرا دروغ از گناهان بزرگ شمرده می‌شود؟","body":"دروغ سرآغاز بدی‌ها و راه به سوی گناهان دیگر است؛ دروغگو اعتماد مردم را نابود می‌کند و آبروی دیگران را می‌ریزد. پیامبر ص فرمود: نشانه‌های منافق سه چیز است: دروغ‌گویی هنگام سخن، پیمان‌شکنی و خیانت در امانت. به همین دلیل اسلام دروغ را از گناهان بزرگ می‌شمارد و راستی را پایه ایمان می‌داند.","pageRef":"صفحه ۴۸"},{"type":"note","title":"با راستگویان باشید","body":"خداوند می‌فرماید: یا أیُّها الَّذینَ آمَنوا اتَّقوا اللهَ وَکونوا مَعَ الصّادِقین؛ ای کسانی که ایمان آورده‌اید، از خدا پروا کنید و با راستگویان باشید. هم‌نشینی با راستگوها انسان را به راستی عادت می‌دهد و دوستی با دروغگوها به‌تدریج دل را به دروغ می‌کشاند."},{"type":"note","title":"دروغ مصلحتی و راه درست آن","body":"برخی می‌پندارند دروغ مصلحتی اشکالی ندارد؛ اما دروغ با هر هدفی خودش بدی است و راه بدی‌های دیگر را باز می‌کند. اسلام برای این موارد راهی نیکو گذاشته است: توریه؛ یعنی سخنی بگوییم که هم دروغ نباشد و هم مقصود ما را برساند؛ مانند این‌که کسی از راز دوستش بپرسد و او با توریه پاسخ دهد."},{"type":"exam","title":"آیه «وَکونوا مَعَ الصّادِقین» را ترجمه کنید و توضیح دهید.","body":"ترجمه: و با راستگویان باشید.\nتوضیح: خداوند در این آیه مؤمنان را به همراهی با راستگوها فرمان می‌دهد؛ زیرا دوست و هم‌نشین، رفتار خود را به انسان منتقل می‌کند. کسی که با راستگوها دوست باشد، دروغ را زشت می‌شمارد و از آن دوری می‌کند و راه راستی، او را به نیکی و بهشت می‌رساند."},{"type":"exam","title":"چرا راستگویی از دید اسلام پایه زندگی اجتماعی است؟","body":"زندگی اجتماعی بدون راستی، اعتماد و آرامش ندارد؛ خرید و فروش، قضاوت، مدیریت و دوستی همه به اعتماد به سخن مردم بستگی دارد. اگر دروغ رواج یابد، هیچ‌کس به هیچ‌کس اعتماد نمی‌کند و جامعه به بی‌اعتمادی و آشفتگی می‌رود. به همین دلیل پیامبر ص فرمودند: بر شما باد راستی، که آن به نیکی راه می‌نماید."}]},{"number":5,"title":"تفاوت‌های فردی","pages":"۵۸ تا ۷۱","contents":[{"type":"answer","title":"تفاوت‌های فردی به چه معناست؟","body":"یعنی انسان‌ها در ویژگی‌های جسمی و روحی با هم فرق دارند؛ در اندام و رنگ پوست، در هوش و مهارت، در علاقه‌ها و توانایی‌ها. خداوند هر انسانی را با استعدادهای ویژه خود آفریده است و این تفاوت‌ها زمینه شناخت مردم از یکدیگر و همکاری آنان است، نه بهانه برتری‌جویی و مسخره کردن.","pageRef":"صفحه ۵۹"},{"type":"answer","title":"برخورد درست با تفاوت‌های فردی چگونه است؟","body":"باید بپذیریم مردم با هم فرق دارند و هیچ‌کس در همه چیز کامل نیست؛ پس نه از توانایی خود مغرور می‌شویم و نه کسی را به خاطر ضعفش مسخره می‌کنیم و آزار می‌دهیم. هرکس را با استعداد خودش بشناسیم و برای پیشرفت کارها از توانایی‌های یکدیگر کمک بگیریم تا همه به هدف‌های خوب برسیم.","pageRef":"صفحه ۶۳"},{"type":"note","title":"هدف آفرینش تفاوت‌ها","body":"خداوند می‌فرماید: یا أیُّها النّاسُ إنّا خَلَقناکُم مِن ذَکَرٍ وأُنثی وَجَعَلناکُم شُعوبًا وَقَبائِلَ لِتَعارَفوا؛ ای مردم، ما شما را از مرد و زن آفریدیم و شما را ملت‌ها و قبیله‌ها قرار دادیم تا یکدیگر را بشناسید. پس تفاوت‌ها زمینه شناسایی و همکاری است، نه ستیز و برتری‌جویی."},{"type":"note","title":"هیچ‌کس بی‌استعداد نیست","body":"هر انسانی از خدا استعدادهایی گرفته است؛ یکی در درس قوی است و دیگری در ورزش، هنر یا کمک به دیگران. انسان موفق کسی است که استعدادهای خود را بشناسد و با تلاش و تمرین پرورش دهد؛ غصه خوردن و مقایسه خود با دیگران، تنها انرژی ما را هدر می‌دهد و ما را ناامید می‌کند."},{"type":"exam","title":"چرا مسخره کردن دیگران به خاطر ضعفشان از دید اسلام زشت است؟","body":"چون استعدادها را خداوند میان مردم تقسیم کرده و هیچ‌کس در همه چیز کامل نیست؛ کسی که دیگری را به خاطر ضعف مسخره می‌کند، در حقیقت به آفرینش خدا بی‌احترامی کرده و دل یک انسان را رنجانده است. قرآن می‌فرماید: قومی قوم دیگری را مسخره نکند، شاید آنان بهتر از ایشان باشند."},{"type":"exam","title":"آیا تفاوت‌های فردی دلیل برتری برخی انسان‌هاست؟ توضیح دهید.","body":"خیر؛ در دید اسلام، ملاک برتری پرهیزگاری است نه اندام، ثروت و مقام. خداوند می‌فرماید: إنَّ أکرَمَکُم عِندَ اللهِ أتقاکُم؛ گرامی‌ترین شما نزد خدا پرهیزگارترینِ شماست. پس تفاوت‌ها تنها ابزار شناخت و تقسیم کار در جامعه است و ارزش واقعی انسان به تقوا و عمل نیک اوست."}]},{"number":6,"title":"توکل بر خدا","pages":"۷۲ تا ۸۵","contents":[{"type":"answer","title":"توکل بر خدا یعنی چه؟","body":"توکل یعنی اعتماد و اتکای قلبی به خدا و امید داشتن به اینکه او همه کارها را سامان می‌دهد. انسان متوکل، کارهایش را به خدا می‌سپارد و در همه امور به او تکیه می‌کند؛ اما این به معنای بی‌کاری نیست؛ او با تمام توان کوشش می‌کند و نتیجه را به خدای دانا و مهربان می‌سپارد.","pageRef":"صفحه ۷۳"},{"type":"answer","title":"تفاوت توکل با بی‌تفاوتی و کوشش نکردن چیست؟","body":"برخی توکل را به این می‌پندارند که کار و تلاش را رها کنیم و بگوییم خدا هرچه بخواهد انجام می‌دهد؛ این توکل نیست، بلکه بی‌تفاوتی و تنبلی است. توکل واقعی این است که برای رسیدن به هدف، تمام تلاش خود را بکنیم و پس از کوشش، نتیجه را به خدا بسپاریم؛ مانند پرنده که برای روزی پرواز می‌کند.","pageRef":"صفحه ۷۶"},{"type":"note","title":"خدا برای متوکلان کافی است","body":"خداوند می‌فرماید: وَمَن یَتَوَکَّل عَلَی اللهِ فَهُوَ حَسبُه؛ و هرکس بر خدا توکل کند، او برایش کافی است. متوکل با آرامش دل به کار خود ادامه می‌دهد؛ چون می‌داند خدایی دانا و مهربان مراقب اوست و هیچ نتیجه‌ای جز به فرمان و حکمت او روی نمی‌دهد."},{"type":"note","title":"توکل واقعی همراه با تلاش","body":"پیامبر ص فرمود: لَو أنَّکُم تَتَوَکَّلونَ عَلَی اللهِ حَقَّ تَوَکُّلِهِ لَرَزَقَکُم کَما یَرزُقُ الطَّیر؛ اگر بر خدا به‌حق توکل می‌کردید، او شما را روزی می‌داد چنان‌که پرندگان را. دقت کنید: پرنده روزی خود را با پرواز و جست‌وجو می‌یابد؛ پس توکل به معنای بی‌کاری و دست کشیدن از تلاش نیست."},{"type":"exam","title":"با توجه به حدیث پیامبر درباره پرندگان، رابطه توکل و تلاش را توضیح دهید.","body":"پیامبر ص فرمود: اگر بر خدا به‌حق توکل می‌کردید، او شما را روزی می‌داد همان‌گونه که پرندگان را؛ پرنده صبح گرسنه از آشیانه بیرون می‌رود و شب سیر بازمی‌گردد. اما پرنده برای رسیدن به روزی پرواز می‌کند و کوشش دارد؛ پس توکل بدون تلاش بی‌معناست و متوکل واقعی، کوششگری است که به خدا اعتماد دارد."},{"type":"exam","title":"چرا انسان متوکل در زندگی آرامش بیشتری دارد؟","body":"چون نتیجه کارهایش را به خدای دانا و مهربان سپرده است؛ اگر موفق شود، خدا را شکر می‌کند و اگر نتیجه دلخواه نیاید، می‌داند خدا به مصلحت او چنین خواسته است. پس نه از شکست درمانده می‌شود و نه از موفقیت مغرور؛ امید او همیشه به خدای تواناست و همین امید، دلش را آرام نگه می‌دارد."}]},{"number":7,"title":"مناسک حج","pages":"۸۶ تا ۹۹","contents":[{"type":"answer","title":"حج واجب، یک بار در عمر بر چه کسی واجب می‌شود؟","body":"حج واجب، یک بار در طول عمر بر مسلمان واجب می‌شود؛ به شرط آنکه به سن بلوغ رسیده باشد، عاقل و آزاد باشد و توان رفتن به سفر حج را داشته باشد؛ یعنی جسمش سالم، هزینه سفرش فراهم و راه‌ها امن باشد. غیر از این حج واجب، رفتن به حج و عمره مستحب است و هر سال می‌توان انجام داد.","pageRef":"صفحه ۸۷"},{"type":"answer","title":"چند تن از مناسک حج را نام ببرید.","body":"از مناسک مهم حج می‌توان نام برد: احرام بستن و نیت حج، وقوف در عرفات، ماندن در مشعر و منی، طواف خانه خدا هفت بار، سعی میان صفا و مروه هفت بار و رمیدن سنگ در منی. هر یک از این مناسک پیام و هدف ویژه‌ای دارد و در سفر حج به ترتیب انجام می‌شود.","pageRef":"صفحه ۹۰"},{"type":"note","title":"دعوت ابراهیم به حج","body":"خداوند به ابراهیم پیامبر فرمان داد: وَأَذِّن فِی النّاسِ بِالحَجِّ یَأتُوکَ رِجالًا؛ در میان مردم برای حج بانگ برآور تا از راه‌های دور به سوی تو بیایند. این دعوت هزاران سال است که پاسخ داده می‌شود و هر سال میلیون‌ها مسلمان از سراسر جهان به سوی خانه خدا می‌روند."},{"type":"note","title":"آثار سفر حج","body":"حج آثار فراوانی دارد: تقویت ایمان و یاد خدا، تقویت روح برادری میان مسلمانان سراسر جهان که لباس یکسان می‌پوشند و در یک صف نماز می‌خوانند، آشنایی مسلمانان با یکدیگر و توانمندی جهان اسلام. در حج ثروت و مقام معنا ندارد و همه در برابر خدا یکسان و برابرند."},{"type":"exam","title":"بزرگ‌ترین مناسک حج کدام است و در آن چه می‌کنیم؟","body":"بزرگ‌ترین مناسک حج، وقوف در عرفات است؛ یعنی روز نهم ذی‌الحجه از ظهر تا غروب در دشت عرفات می‌ایستیم، خدا را یاد می‌کنیم و از گناهان خود طلب آمرزش می‌کنیم. حاجیان در این روز با لباس احرام، دل‌هایشان را با خدا سخن می‌گویند؛ کسی که این وقوف را از دست بدهد، حجش کامل نمی‌شود."},{"type":"exam","title":"چرا می‌گویند حج نمایش برادری و برابری مسلمانان است؟","body":"چون در حج میلیون‌ها مسلمان از رنگ‌ها، زبان‌ها و کشورهای گوناگون با لباس ساده و یکسان در مکه گرد می‌آیند و مناسک را با هم انجام می‌دهند؛ ثروتمند و فقیر، پادشاه و کارگر، همه در یک صف نماز می‌خوانند و یک‌سان طواف می‌کنند. این صحنه شگفت‌انگیز، برادری و برابری مسلمانان را به نمایش می‌گذارد."}]},{"number":8,"title":"انقلاب اسلامی ایران","pages":"۱۰۰ تا ۱۱۳","contents":[{"type":"answer","title":"مردم ایران به رهبری امام خمینی چرا انقلاب کردند؟","body":"چون حکومت شاه، ظلم و فساد و وابستگی به بیگانگان داشت؛ آزادی مردم محدود بود، فقر و تبعیض فراوان بود و ارزش‌های اسلامی پایمال می‌شد. مردم مسلمان ایران به رهبری امام خمینی خواستند حکومتی بر اساس اسلام، قرآن و عدالت داشته باشند؛ به همین دلیل قیام کردند و انقلاب به پیروزی رسید.","pageRef":"صفحه ۱۰۱"},{"type":"answer","title":"ویژگی‌های امام خمینی را بیان کنید.","body":"امام خمینی عالم و پرهیزگار بود و مردم او را به خاطر تقوا و اخلاصش دوست داشتند؛ در برابر زورگویان شجاع و استوار بود و هرگز از راه حق عقب ننشست. به مردم ایمان داشت و به خدا توکل می‌کرد؛ ساده زندگی می‌کرد و حتی دشمنان به عظمت و قاطعیت او اعتراف می‌کردند.","pageRef":"صفحه ۱۰۵"},{"type":"note","title":"وعده خدا به مستضعفان","body":"خداوند می‌فرماید: وَنُریدُ أن نَمُنَّ عَلَی الَّذینَ استُضعِفوا فِی الأرضِ وَنَجعَلَهُم أئِمَّةً وَنَجعَلَهُمُ الوارِثین؛ و می‌خواهیم بر مستضعفان منّت نهیم و آنان را پیشوایان و وارثان زمین گردانیم. پیروزی انقلاب اسلامی ایران یکی از مصادیق این وعده الهی است."},{"type":"note","title":"نقش مردم در پیروزی انقلاب","body":"انقلاب اسلامی بدون حضور مردم به پیروزی نمی‌رسید؛ مردم با حضور در راهپیمایی‌ها، پخش اعلامیه‌ها، کمک به خانواده‌های شهیدان و مقاومت در برابر ستم، انقلاب را به ثمر رساندند. رهبری امام خمینی و حضور مؤمنانه مردم، دو عامل اصلی پیروزی انقلاب اسلامی بودند."},{"type":"exam","title":"دو عامل اصلی پیروزی انقلاب اسلامی ایران را نام ببرید و توضیح دهید.","body":"عامل اول: رهبری امام خمینی؛ ایشان با شجاعت و توکل به خدا مردم را هدایت کرد و در سخت‌ترین روزها راه را نشان داد.\nعامل دوم: حضور و مقاومت مردم؛ مردم مسلمان با راهپیمایی‌های پیاپی و پافشاری بر هدف، به ستم پایان دادند. تکیه بر ایمان و یاد خون شهیدان نیز در این پیروزی نقش مهمی داشت."},{"type":"exam","title":"چرا دشمنان، انقلاب اسلامی ایران را خطرناک می‌دانستند؟","body":"چون انقلاب ایران با شعار اسلام و قرآن و با رهبری روحانی پیروز شد و الگویی برای ملت‌های مسلمان دیگر شد؛ دشمنان می‌ترسیدند ملت‌های دیگر هم به این راه بروند و از وابستگی و بردگی رها شوند. به همین دلیل جنگ و تحریم و تبلیغات را آغاز کردند، اما مردم با ایمان و رهبری، ایستادگی کردند."}]},{"number":9,"title":"زندگی پیامبر اکرم (ص)","pages":"۱۱۴ تا ۱۲۹","contents":[{"type":"answer","title":"پیامبر اکرم ص در چه سالی و در کجا به دنیا آمد؟","body":"پیامبر اکرم صلی الله علیه و آله در سال عام‌الفیل، سالی که ابرهه با لشکر فیل‌هایش به کعبه حمله کرد، در مکه به دنیا آمد. پدرش عبدالله پیش از تولد او از دنیا رفت و مادرش آمنه هم وقتی شش‌ساله بود از دست رفت؛ پس از آن عمویش ابوطالب از او نگهبانی کرد.","pageRef":"صفحه ۱۱۵"},{"type":"answer","title":"پیامبر ص در چه زمانی و در کجا به پیامبری برانگیخته شد؟","body":"پیامبر ص در چهل‌سالگی، در غار حرا نزدیک مکه به پیامبری برانگیخته شد. در آن غار فرشته وحی بر او نازل شد و نخستین آیات سوره علق را آورد: اقرَأ بِاسمِ رَبِّکَ الَّذی خَلَق؛ بخوان به نام پروردگارت که آفرید. پس از آن، دعوت همگانی به اسلام آغاز شد.","pageRef":"صفحه ۱۱۸"},{"type":"note","title":"رحمت برای جهانیان","body":"خداوند درباره پیامبر ص می‌فرماید: وَما أَرسَلناکَ إلّا رَحمَةً لِلعالَمین؛ و تو را جز رحمتی برای جهانیان نفرستادیم. رفتار مهربانانه او با کودکان، بی‌کسان و حتی دشمنان، الگوی همه انسان‌هاست و قرآن از پیروان او می‌خواهد بر او صلوات بفرستند."},{"type":"note","title":"پیامبر ص با مردم چگونه رفتار می‌کرد؟","body":"پیامبر ص بسیار خوش‌خو، مهربان و راستگو بود؛ با کودکان مدارا می‌کرد، به خانه فقیران سر می‌زد و در کارها با مردم منصف بود. اهل مکه که او را محمّد امین می‌نامیدند، به راستی و امانت‌داری‌اش اعتراف داشتند و در سختی‌ها، همه به سخن او اعتماد می‌کردند."},{"type":"exam","title":"مبعث پیامبر ص را با ذکر مکان و نخستین آیات توضیح دهید.","body":"پیامبر ص سال‌های پیش از بعثت در غار حرا به عبادت و اندیشه می‌پرداخت؛ در چهل‌سالگی فرشته وحی در همان غار بر او نازل شد و نخستین آیات را آورد: اقرَأ بِاسمِ رَبِّکَ الَّذی خَلَق؛ بخوان به نام پروردگارت که آفرید. این روز، آغاز دعوت همگانی به اسلام و روز بعثت است."},{"type":"exam","title":"چرا اهل مکه پیش از بعثت، پیامبر ص را امین می‌نامیدند؟","body":"چون او از کودکی راستگو، امانت‌دار و خوش‌رفتار بود؛ هرگز دروغ نگفت، کسی را فریب نداد و اگر امانتی نزدش می‌گذاشتند، سالم بازمی‌گرداند. مردم مکه سخن او را معیار راستی می‌دانستند و او را محمّد امین می‌خواندند؛ همین اخلاق نیک، دعوت او را در دل‌ها پذیرفتنی می‌کرد."}]},{"number":10,"title":"داستان اهل بیت (ع)","pages":"۱۳۰ تا ۱۴۵","contents":[{"type":"answer","title":"پیامبر ص برای هدایت مسلمانان چه چیزهایی بر جای گذاشت؟","body":"پیامبر ص فرمود: إنّی تارِکٌ فیکُمُ الثَّقَلَینِ کِتابَ اللهِ وَعِترَتی أهلَ بَیتی؛ من میان شما دو چیز گران‌بها می‌گذارم: کتاب خدا و اهل بیت من. پس مسلمانان باید به قرآن چنگ زنند و از اهل بیت پیروی کنند تا هرگز گمراه نشوند؛ این حدیث به حدیث ثقلین معروف است.","pageRef":"صفحه ۱۳۱"},{"type":"answer","title":"از داستان‌های بخشش اهل بیت چه می‌آموزیم؟","body":"در کتاب آمده است که امام حسن ع سه بار همه اموال خود را با فقیران تقسیم کرد و دو بار نیمی از اموالش را در راه خدا بخشید. روزی گدایی از او کمک خواست و امام کفش‌های خود را به او بخشید. این داستان‌ها نشان می‌دهد نیکوکاران در راه خدا از مال و جان خود می‌گذرند و دل‌ها را به دست می‌آورند.","pageRef":"صفحه ۱۳۶"},{"type":"note","title":"حدیث ثقلین","body":"پیامبر ص فرمود: إنّی تارِکٌ فیکُمُ الثَّقَلَینِ کِتابَ اللهِ وَعِترَتی أهلَ بَیتی؛ من دو چیز گران‌بها میان شما می‌گذارم: کتاب خدا و اهل بیت من. این دو هرگز از هم جدا نمی‌شوند تا بر من در کنار حوض کوثر وارد شوند. پس پیروی از قرآن و اهل بیت، تنها راه نجات است."},{"type":"note","title":"آیه تطهیر","body":"خداوند می‌فرماید: إنّما یُریدُ اللهُ لِیُذهِبَ عَنکُمُ الرِّجسَ أهلَ البَیتِ وَیُطَهِّرَکُم تَطهیرًا؛ خداوند تنها می‌خواهد پلیدی را از شما اهل بیت بردارد و شما را کاملاً پاک گرداند. این آیه درباره پیامبر، علی، فاطمه، حسن و حسین علیهم‌السلام نازل شد و پاکی اهل بیت را نشان می‌دهد."},{"type":"exam","title":"حدیث ثقلین را ترجمه کنید و از آن چه نتیجه می‌گیرید؟","body":"ترجمه: من میان شما دو چیز گران‌بها بر جای می‌گذارم: کتاب خدا و عترت و اهل بیت من.\nنتیجه: پس از پیامبر ص، هدایت مسلمانان به قرآن و اهل بیت سپرده شده است؛ کسی که یکی را بگیرد و دیگری را رها کند، از راه پیامبر دور شده است. نجات، در پیروی هم‌زمان از قرآن و اهل بیت است."},{"type":"exam","title":"از داستان‌های اهل بیت ع چه درس‌هایی می‌گیریم؟ دو مورد را بنویسید.","body":"درس اول: بخشش و سخاوت؛ مانند تقسیم اموال امام حسن ع میان فقیران و بخشیدن انگشتر امام علی ع هنگام نماز که در قرآن نیز ستایش شده است.\nدرس دوم: صبر و بردباری؛ مانند صبر امام حسین ع در کربلا و امام سجاد ع پس از آن. این داستان‌ها سرمشق زندگی ماست و راه نیکی‌ها را نشان می‌دهند."}]},{"number":11,"title":"پیوند مقدس","pages":"۱۴۶ تا ۱۵۹","contents":[{"type":"answer","title":"چرا خداوند انسان را جفت‌جفت آفرید و خانواده را پایه‌گذاری کرد؟","body":"خداوند برای انسان هم‌سر آفرید تا با او زندگی کند و آرامش یابد. قرآن می‌فرماید: وَمِن آیاتِهِ أن خَلَقَ لَکُم مِن أنفُسِکُم أزواجًا لِتَسکُنوا إلَیهَا وَجَعَلَ بَینَکُم مَوَدَّةً وَرَحمَة؛ خدا از جنس خودتان همسرانی برای شما آفرید تا با آنان آرامش یابید و میان شما مهر و رحمت قرار داد.","pageRef":"صفحه ۱۴۷"},{"type":"answer","title":"دو فایده تشکیل خانواده را بیان کنید.","body":"فایده نخست: آرامش روحی؛ زن و شوهر با محبت و همراهی یکدیگر، آرامش دل می‌یابند و از تنهایی و فساد در امان می‌مانند. فایده دوم: فرزندآوری و پرورش نسل انسان؛ کودکان در دامان خانواده با محبت پرورش می‌یابند و انسان‌های نیکو و سالم رشد می‌کنند.","pageRef":"صفحه ۱۵۰"},{"type":"note","title":"ازدواج، سنت پیامبر","body":"پیامبر ص فرمود: النِّکاحُ سُنَّتی فَمَن رَغِبَ عَن سُنَّتی فَلَیسَ مِنّی؛ ازدواج سنت من است و هرکس از آن روی بگرداند، از من نیست. در روایات آمده است که ازدواج نیمی از ایمان انسان است؛ زیرا انسان را از گناه نگاه می‌دارد و راه آرامش و پاکی را می‌گشاید."},{"type":"note","title":"محبت و رحمت میان زن و شوهر","body":"قرآن ازدواج را از نشانه‌های بزرگ خدا می‌شمارد: وَجَعَلَ بَینَکُم مَوَدَّةً وَرَحمَة؛ و میان شما مهر و رحمت قرار داد. پس پایه زندگی مشترک، محبت و مهربانی است نه زیاده‌خواهی؛ زن و شوهر باید با گذشت و احترام با هم رفتار کنند تا خانه‌شان پر از آرامش و خشنودی خدا شود."},{"type":"exam","title":"آیه «وَمِن آیاتِهِ أن خَلَقَ لَکُم مِن أنفُسِکُم أزواجًا...» را ترجمه کنید.","body":"ترجمه: و از نشانه‌های او این است که برای شما از جنس خودتان همسرانی آفرید تا در کنار آنان آرامش یابید و میان شما مهر و رحمت قرار داد.\nتوضیح: این آیه ازدواج و تشکیل خانواده را نشانه بزرگ خدا می‌داند و هدف آن را آرامش، محبت و رحمت میان زن و شوهر می‌شمارد."},{"type":"exam","title":"چرا اسلام ازدواج را تشویق می‌کند؟ دو دلیل بیان کنید.","body":"دلیل اول: نگه داشتن انسان از گناه؛ ازدواج راه درست برآوردن نیازهای انسان است و او را از انحراف دور می‌کند.\nدلیل دوم: آرامش و پرورش نسل؛ زندگی مشترک مهر و رحمت می‌آورد و فرزندان نیکو در دامان خانواده رشد می‌کنند. به همین دلیل پیامبر ص فرمودند: ازدواج سنت من است."}]},{"number":12,"title":"روزه‌داری","pages":"۱۶۰ تا ۱۷۴","contents":[{"type":"answer","title":"فلسفه و هدف روزه چیست؟","body":"خداوند هدف روزه را در قرآن چنین بیان می‌کند: لَعَلَّکُم تَتَّقون؛ باشد که پرهیزگار شوید. روزه به انسان می‌آموزد که بر خواسته‌های نفس فرمانروایی کند، اراده‌اش را قوی سازد و در حضور خدا زندگی کند. پس روزه، تمرین پرهیزگاری و فرمانبرداری از خداست.","pageRef":"صفحه ۱۶۱"},{"type":"answer","title":"آثار روزه در زندگی فردی و اجتماعی چیست؟","body":"در زندگی فردی: تقویت اراده، آرامش روح، سلامت بدن و دور شدن از گناه. در زندگی اجتماعی: همدلی با فقیران و گرسنگان، صرفه‌جویی در خرج‌ها و کمک به نیازمندان. پیامبر ص فرمود: الصَّومُ جُنَّةٌ مِنَ النّار؛ روزه سپری برای آتش دوزخ است.","pageRef":"صفحه ۱۶۴"},{"type":"note","title":"مقررات روزه در قرآن","body":"خداوند می‌فرماید: یا أیُّها الَّذینَ آمَنوا کُتِبَ عَلَیکُمُ الصِّیامُ کَما کُتِبَ عَلَی الَّذینَ مِن قَبلِکُم؛ ای کسانی که ایمان آورده‌اید، روزه بر شما مقرر شده همان‌گونه که بر امت‌های پیش از شما مقرر شده بود. پس روزه عبادتی است که در همه ادیان الهی وجود داشته است."},{"type":"note","title":"روزه، سپر آتش","body":"پیامبر ص فرمود: الصَّومُ جُنَّةٌ مِنَ النّار؛ روزه سپری است برای آتش دوزخ. سپر در جنگ، انسان را از تیرها نگاه می‌دارد؛ روزه نیز دل انسان را از آتش گناه و دوزخ محافظت می‌کند. کسی که روزه خود را با پرهیز از گناه کامل کند، در قیامت در امان خواهد بود."},{"type":"exam","title":"آیه «کُتِبَ عَلَیکُمُ الصِّیامُ...» را ترجمه کنید و هدف روزه را بیان کنید.","body":"ترجمه: ای کسانی که ایمان آورده‌اید، روزه بر شما واجب شده است همان‌گونه که بر امت‌های پیش از شما واجب شده بود، باشد که پرهیزگار شوید.\nهدف: تقوای الهی؛ یعنی انسان با ترک خوردن و آشامیدن، بر نفس خود فرمانروایی کند، از گناه دوری کند و همواره در حضور خدا زندگی کند."},{"type":"exam","title":"تعبیر قرآن از روزه، «أیّامًا مَعدودات» یعنی روزهای اندک، چه نکته‌ای دارد؟","body":"قرآن روزه را برای «أیّامًا مَعدودات» یعنی روزهای اندک و شمرده مقرر کرده و می‌فرماید: وَأَن تَصوموا خَیرٌ لَکُم إن کُنتُم تَعلَمون؛ روزه داشتن برای شما بهتر است اگر بدانید. نکته: خداوند مدت روزه را کوتاه قرار داده تا سختی آن کم باشد و ماه رمضان، ماه نزول قرآن و بهترین زمان تمرین پرهیزگاری است."}]}]},{"title":"کار و فناوری هشتم","subject":"کار و فناوری","description":"راهنمای کامل کارگاه‌های کتاب کار و فناوری هشتم با نکات و سوالات امتحانی","color":"red","icon":"wrench","chapters":[{"number":1,"title":"روش تحقیق","pages":"۱ تا ۱۸","contents":[{"type":"answer","title":"مراحل انجام یک تحقیق کوتاه در کارگاه روش تحقیق کدام‌اند؟","body":"ابتدا موضوع را انتخاب کنید و پرسش دقیق تحقیق را بنویسید.\nسپس با مراجعه به کتاب و پایگاه‌های معتبر، اطلاعات لازم را گردآوری کنید.\nدر مرحله آزمایش، متغیرها را کنترل کرده و نتایج را در جدول ثبت کنید.\nدر پایان داده‌ها را تحلیل کرده، نتیجه‌گیری کنید و گزارش را با ذکر منابع ارائه دهید.","pageRef":"صفحه ۵"},{"type":"answer","title":"فعالیت: پرسشنامه‌ای برای سنجش مصرف برق خانواده‌ها طراحی کنید. سوالات مناسب چگونه نوشته می‌شوند؟","body":"برای طراحی پرسشنامه ابتدا هدف را روشن کنید.\nسوالات را کوتاه و یک‌معنا بنویسید و از پرسش‌های دوپهلو پرهیز کنید.\nبرای مقایسه خانواده‌ها گزینه‌های بسته مانند کم، متوسط و زیاد قرار دهید.\nپیش از توزیع اصلی، پرسشنامه را با چند نفر آزمایش کنید و سوالات مبهم را اصلاح نمایید.","pageRef":"صفحه ۱۲"},{"type":"note","title":"تفاوت پژوهش کتابخانه‌ای و میدانی","body":"پژوهش کتابخانه‌ای بر پایه مطالعه منابع موجود مانند کتاب، مجله و پایگاه‌های معتبر انجام می‌شود، اما پژوهش میدانی با مشاهده، مصاحبه و پرسشنامه از نمونه واقعی انجام می‌گیرد.\nمثال: برای بررسی مصرف برق یک محله، آمار رسمی برق منبع کتابخانه‌ای و پرسش از ساکنان پژوهش میدانی است."},{"type":"note","title":"ارجاع‌دهی درست منابع تحقیق","body":"در هر گزارش تحقیق باید منابع به‌درستی معرفی شوند: نام نویسنده، نام کتاب یا مقاله، سال انتشار و ناشر.\nارجاع درست نشان می‌دهد هر اطلاعات از کجا آمده و از سرقت علمی جلوگیری می‌کند.\nمثال: کار و فناوری هشتم، سازمان پژوهش و برنامه‌ریزی آموزشی، سال ۱۳۹۷."},{"type":"exam","title":"سوال امتحانی: مراحل روش علمی را به ترتیب بنویسید و با یک مثال توضیح دهید.","body":"پاسخ تشریحی: ترتیب مراحل چنین است: نخست مشاهده و طرح پرسش، سپس فرضیه‌سازی، بعد طراحی و انجام آزمایش، سپس ثبت و تحلیل داده‌ها و در پایان نتیجه‌گیری و ارائه گزارش.\nمثال: برای پرسش اینکه کدام شوینده لکه را بهتر پاک می‌کند، سه شوینده را روی لکه‌های یکسان آزمایش و نتایج را مقایسه می‌کنیم."},{"type":"exam","title":"سوال امتحانی: سه ابزار گردآوری اطلاعات در تحقیق میدانی را نام برده و یکی را توضیح دهید.","body":"پاسخ تشریحی: سه ابزار اصلی عبارت‌اند از مشاهده، مصاحبه و پرسشنامه.\nپرسشنامه مجموعه‌ای از سوالات کتبی است که به نمونه‌ای از جامعه هدف داده می‌شود و پاسخ‌ها برای تحلیل ثبت می‌گردد.\nمزیت آن سرعت بالا و امکان بررسی نظر افراد زیاد با هزینه کم است."}]},{"number":2,"title":"ویرایش تصویر",
