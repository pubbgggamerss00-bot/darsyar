}]},{"number":3,"title":"هوا و اقلیم","pages":"۳۶ تا ۴۸","contents":[{"type":"answer","title":"تفاوت هوا و اقلیم را با مثال بنویسید.","body":"هوا وضعیت لحظه‌ای جو در یک زمان کوتاه است و هر روز تغییر می‌کند.\nاقلیم میانگین وضعیت آب‌وهوای یک مکان در زمانی طولانی است.\nمثال: بارانی بودن امروز تهران هوا است و گرم و خشک بودن همیشگی کویر لوت اقلیم.","pageRef":"صفحه ۳۷"},{"type":"answer","title":"عناصر اصلی آب و هوا را نام ببرید.","body":"عناصر اصلی آب و هوا عبارت‌اند از دما ، فشار هوا ، باد و رطوبت و بارش.\nدما میزان گرمای هوا و فشار وزن ستون هوا بر زمین است.\nباد از اختلاف فشار پدید می‌آید و رطوبت مقدار بخار آب هوا است که با سرد شدن به بارش تبدیل می‌شود.","pageRef":"صفحه ۳۹"},{"type":"note","title":"عوامل مؤثر بر اقلیم","body":"موقعیت جغرافیایی ، ارتفاع از سطح دریا ، فاصله از دریا و کوه‌ها بر اقلیم هر منطقه اثر می‌گذارند.\nمثال: شهرهای ساحلی تابستان معتدل‌تر و زمستان ملایم‌تری از شهرهای دور از دریا دارند."},{"type":"note","title":"انواع اقلیم جهان","body":"اقلیم‌های اصلی جهان: استوایی گرم و مرطوب ، بیابانی گرم و خشک ، معتدل چهارفصل ، کوهستانی سرد و قطبی یخ‌زده.\nنوع اقلیم پوشش گیاهی و جانوری و حتی شغل و زندگی مردم را تعیین می‌کند."},{"type":"exam","title":"سوال امتحانی: چرا با بالا رفتن از سطح دریا دما کم می‌شود؟ با مثال توضیح دهید.","body":"پاسخ تشریحی:\nهوای گرم از سطح زمین بالا می‌رود و با افزایش ارتفاع سرد می‌شود.\nبا هر هزار متر ارتفاع ، دما حدود ۶ درجه کم می‌شود.\nمثال: در یک روز تابستانی دمای قله دماوند بسیار کمتر از دمای تهران است."},{"type":"exam","title":"سوال امتحانی: گرم شدن زمین چه پیامدهایی برای اقلیم جهان دارد؟ دو مورد بنویسید.","body":"پاسخ تشریحی:\nذوب یخچال‌ها و بالا آمدن سطح دریاها و به خطر افتادن زندگی ساکنان سواحل.\nکم شدن بارش در برخی مناطق و افزایش خشکسالی و طوفان‌های شدید.\nعامل اصلی آن افزایش گازهای گلخانه‌ای از سوخت‌های فسیلی است."}]},{"number":4,"title":"آب فراوان ، هوای پاک","pages":"۴۹ تا ۶۰","contents":[{"type":"answer","title":"چرخه آب در طبیعت را به ترتیب توضیح دهید.","body":"آب اقیانوس‌ها و دریاها با گرمای خورشید تبخیر می‌شود.\nبخار آب بالا می‌رود ، سرد می‌شود و ابر می‌سازد.\nسپس به شکل باران و برف به زمین بازمی‌گردد و بخشی از آن به رودها و آب‌های زیرزمینی می‌ریزد و چرخه دوباره تکرار می‌شود.","pageRef":"صفحه ۵۰"},{"type":"answer","title":"برای پاک نگه داشتن هوا چه کارهایی باید انجام شود؟","body":"استفاده از حمل‌ونقل عمومی و کم کردن سفرهای شخصی با خودرو.\nجایگزین کردن سوخت‌های فسیلی با انرژی پاک مانند خورشیدی و بادی.\nنظارت بر دودکش کارخانه‌ها و درخت‌کاری در شهرها و تعویض خودروهای فرسوده.","pageRef":"صفحه ۵۶"},{"type":"note","title":"آب شیرین زمین کجاست؟","body":"بیشتر آب شیرین زمین در یخچال‌های طبیعی و یخ‌های قطبی است و در دسترس نیست.\nبخش اندکی در رودها و دریاچه‌ها و آب‌های زیرزمینی قرار دارد.\nبه همین دلیل صرفه‌جویی و پاک نگه داشتن منابع آب شیرین اهمیت فراوان دارد."},{"type":"note","title":"وارونگی دما و آلودگی شهرها","body":"در وارونگی دما هوای سرد و آلوده شهر زیر لایه هوای گرم بالا گیر می‌افتد.\nبه همین دلیل در روزهای سرد سال آلودگی تهران و شهرهای بزرگ بیشتر می‌شود.\nخودروهای فرسوده و سوخت‌های فسیلی منابع اصلی این آلودگی‌اند."},{"type":"exam","title":"سوال امتحانی: جزر و مد چیست و چه عواملی آن را پدید می‌آورد؟","body":"پاسخ تشریحی:\nجزر و مد بالا و پایین رفتن منظم آب دریاها و اقیانوس‌ها است.\nعامل اصلی آن جاذبه ماه و خورشید بر آب‌های زمین است.\nاز این پدیده در ماهیگیری و کشتیرانی و تولید برق پاک استفاده می‌شود."},{"type":"exam","title":"سوال امتحانی: دو پیامد زیان‌بار سوخت‌های فسیلی برای هوا و آب را بنویسید.","body":"پاسخ تشریحی:\nافزایش آلودگی هوا و بیماری‌های تنفسی در شهرهای بزرگ.\nافزایش گازهای گلخانه‌ای و گرم شدن زمین و رسیدن آلاینده‌ها با باران اسیدی به رودها و دریاها.\nاستفاده از انرژی‌های تجدیدپذیر می‌تواند این آسیب‌ها را کم کند."}]},{"number":5,"title":"پهنه‌های آبی و خاکی","pages":"۶۱ تا ۷۳","contents":[{"type":"answer","title":"سهم پهنه‌های آبی و خشکی از سطح زمین چقدر است؟","body":"حدود ۷۱ درصد سطح زمین را آب فرا گرفته و تنها ۲۹ درصد آن خشکی است.\nخشکی‌ها به شکل فلات و کوهستان و دشت و جلگه دیده می‌شوند.\nبخش بزرگی از خشکی‌ها برای کشاورزی و سکونت مناسب نیست.","pageRef":"صفحه ۶۲"},{"type":"answer","title":"اهمیت اقتصادی اقیانوس‌ها را بنویسید.","body":"اقیانوس‌ها منبع فراوان غذا برای انسان‌اند و ماهیگیری در آن‌ها رونق دارد.\nبیشتر تجارت جهانی با کشتی از راه دریا انجام می‌شود.\nاز بستر اقیانوس‌ها نفت و گاز و مواد معدنی برداشت می‌شود و انرژی جزر و مد نیز برق تولید می‌کند.","pageRef":"صفحه ۶۶"},{"type":"note","title":"قاره‌های جهان","body":"خشکی‌های زمین به شش قاره تقسیم می‌شوند: آسیا ، اروپا ، آفریقا ، آمریکای شمالی ، آمریکای جنوبی و استرالیا.\nآسیا بزرگ‌ترین و پرجمعیت‌ترین قاره است و در قطب جنوب جز یخ سکونت دائمی وجود ندارد."},{"type":"note","title":"اقیانوس آرام ؛ پهنه آبی بی‌همتا","body":"اقیانوس آرام بزرگ‌ترین و ژرف‌ترین اقیانوس جهان است.\nژرف‌ترین نقطه زمین یعنی گودال ماریانا در همین اقیانوس قرار دارد.\nبعد از آن اقیانوس اطلس و هند بیشترین وسعت را دارند."},{"type":"exam","title":"سوال امتحانی: چرا بیشتر شهرهای بزرگ جهان کنار دریاها و رودها ساخته شده‌اند؟","body":"پاسخ تشریحی:\nدریاها راه ارزان حمل‌ونقل و تجارت‌اند.\nآب رودها برای کشاورزی و آشامیدن لازم است و دشت‌های حاصلخیز کنار آن‌ها کشاورزی را آسان می‌کند.\nاقلیم معتدل ساحل نیز زندگی را دلپذیرتر می‌سازد."},{"type":"exam","title":"سوال امتحانی: جلگه‌ها برای چه فعالیت‌هایی از فلات‌ها مناسب‌ترند و چرا؟","body":"پاسخ تشریحی:\nجلگه‌ها سرزمین‌های هموار و کم‌ارتفاع پای رودها هستند.\nخاک آبرفتی حاصلخیز و آب فراوان و راه‌های آسان ، کشاورزی و صنعت و سکونت را در آن‌ها ممکن می‌کند.\nدر فلات‌ها شیب زیاد و اقلیم سردتر فعالیت‌ها را محدود می‌کند."}]},{"number":6,"title":"زیست‌بوم‌ها در خطرند","pages":"۷۴ تا ۸۴","contents":[{"type":"answer","title":"زیست‌بوم چیست و چه عواملی در آن به هم وابسته‌اند؟","body":"زیست‌بوم منطقه پهناوری با اقلیم و پوشش گیاهی و جانوری ویژه است.\nعوامل زنده مانند گیاهان و جانوران با عوامل غیرزنده مانند آب و خاک و هوا پیوند دارند.\nمثال: در بیابان فقط گیاهان مقاوم به خشکی مانند کاکتوس می‌رویند.","pageRef":"صفحه ۷۵"},{"type":"answer","title":"سه تهدید اصلی زیست‌بوم‌ها را نام ببرید.","body":"نابودی و تکه‌تکه شدن زیستگاه‌ها با گسترش شهرها و جاده‌سازی.\nشکار بی‌رویه جانوران و فروش غیرقانونی آن‌ها.\nآلودگی محیط زیست و تغییرات اقلیمی که شرایط زندگی گونه‌ها را بر هم می‌زند.","pageRef":"صفحه ۷۸"},{"type":"note","title":"انواع زیست‌بوم‌های جهان","body":"جنگل‌های استوایی پربارش ، جنگل‌های سوزنی‌برگ سرد ، علفزارها ، بیابان‌ها و توندرای قطبی از زیست‌بوم‌های اصلی جهان‌اند.\nایران نیز زیست‌بوم‌های گوناگونی از جنگل هیرکانی تا بیابان مرکزی دارد."},{"type":"note","title":"یوزپلنگ آسیایی ؛ گونه‌ای در خطر انقراض","body":"یوزپلنگ آسیایی از کمیاب‌ترین گربه‌ساران جهان است و تنها در دشت‌های کویری ایران زندگی می‌کند.\nشکار بی‌رویه و جاده‌سازی و کوچک شدن زیستگاه ، جمعیت آن را به شمار اندک رسانده است."},{"type":"exam","title":"سوال امتحانی: گرم شدن زمین چگونه زیست‌بوم‌ها را تهدید می‌کند؟ دو مورد بنویسید.","body":"پاسخ تشریحی:\nیخچال‌ها و یخ‌های قطبی آب می‌شوند و زیستگاه جانورانی مانند خرس قطبی از میان می‌رود.\nخشکسالی تالاب‌ها و دریاچه‌ها را خشک می‌کند و مراتع و جنگل‌ها را ضعیف می‌سازد.\nگونه‌هایی که نتوانند با شرایط تازه سازگار شوند در خطر انقراض‌اند."},{"type":"exam","title":"سوال امتحانی: برای حفاظت از گونه‌های در خطر انقراض چه کارهایی انجام می‌شود؟ دو مورد با توضیح.","body":"پاسخ تشریحی:\nایجاد مناطق حفاظت‌شده و پارک ملی که شکار در آن‌ها ممنوع است و زیستگاه گونه‌ها را امن می‌کند.\nتکثیر و پرورش گونه‌ها در مراکز پرورش و بازگرداندن آن‌ها به طبیعت.\nآموزش مردم نیز از شکار بی‌رویه جلوگیری می‌کند."}]},{"number":7,"title":"جمعیت جهان","pages":"۸۵ تا ۹۶","contents":[{"type":"answer","title":"رشد جمعیت جهان در دو قرن گذشته چگونه بوده است؟","body":"تا حدود سال ۱۸۰۰ میلادی جمعیت جهان کم و رشد آن کند بود.\nبا پیشرفت پزشکی و کشاورزی و کم شدن مرگ‌ومیر جمعیت جهش کرد.\nامروز جمعیت جهان از هشت میلیارد گذشته است و تأمین غذا و مسکن و آب چالش بزرگی است.","pageRef":"صفحه ۸۶"},{"type":"answer","title":"چرا جمعیت جهان یکسان توزیع نشده است؟","body":"پراکندگی جمعیت به اقلیم و آب و خاک و امکانات بستگی دارد.\nمناطق معتدل و حاصلخیز مانند دشت‌های هند و چین پرجمعیت‌اند و بیابان‌های بزرگ و قطب‌ها تقریباً خالی از سکنه‌اند.\nکار و امکانات شهری هم مردم را به شهرهای بزرگ می‌کشاند.","pageRef":"صفحه ۸۹"},{"type":"note","title":"تراکم جمعیت","body":"تراکم جمعیت یعنی شمار افراد در هر کیلومتر مربع.\nاین شاخص برای مقایسه زندگی مردم در مناطق مختلف به کار می‌رود.\nمثال: تراکم جمعیت در بنگلادش بسیار بالا و در استرالیا بسیار پایین است."},{"type":"note","title":"مهاجرت و شهرنشینی","body":"مهاجرت یعنی جابه‌جایی مردم برای کار و تحصیل یا رهایی از جنگ و خشکسالی.\nامروز بیش از نیمی از مردم جهان در شهرها زندگی می‌کنند.\nرشد سریع شهرها گسترش حاشیه‌نشینی و کمبود خدمات را در پی دارد."},{"type":"exam","title":"سوال امتحانی: دو پیامد رشد سریع جمعیت برای زمین را بنویسید.","body":"پاسخ تشریحی:\nفشار بیشتر بر منابع طبیعی مانند آب و خاک و جنگل و نابودی زیستگاه‌های طبیعی.\nسخت شدن تأمین غذا و مسکن و اشتغال و زیاد شدن آلودگی و زباله در شهرها.\nبرای همین رشد جمعیت باید با برنامه‌ریزی همراه باشد."},{"type":"exam","title":"سوال امتحانی: نابرابری پراکندگی جمعیت در ایران را با مثال توضیح دهید.","body":"پاسخ تشریحی:\nمردم ایران نیز یکسان پراکنده نیستند.\nمناطق کویری کم‌جمعیت‌اند و تهران و ساحل خزر و استان‌های جنوبی به دلیل کار و تجارت پرجمعیت‌ترند.\nمهاجرت روستاییان به شهرها نیز شهرهای بزرگ را شلوغ‌تر کرده است."}]},{"number":8,"title":"جهان نابرابر","pages":"۹۷ تا ۱۰۸","contents":[{"type":"answer","title":"کشورهای توسعه‌یافته را از کشورهای در حال توسعه چگونه تشخیص می‌دهند؟","body":"با مقایسه درآمد سرانه و امید به زندگی و سواد و دسترسی به بهداشت و آموزش.\nدر کشورهای توسعه‌یافته این شاخص‌ها بالاست و مردم زندگی آسوده‌تری دارند.\nدر کشورهای در حال توسعه این شاخص‌ها پایین‌تر است و بخشی از مردم فقر دارند.","pageRef":"صفحه ۹۸"},{"type":"answer","title":"انواع فعالیت اقتصادی را نام ببرید و ارتباط آن‌ها را با مثال توضیح دهید.","body":"فعالیت‌های اقتصادی سه دسته‌اند: کشاورزی ، صنعت و خدمات.\nمثال: کشاورز چغندر می‌کارد ، کارخانه قند آن را به شکر تبدیل می‌کند و فروشنده در بازار می‌فروشد.\nهر سه بخش در کنار هم اقتصاد را رونق می‌دهند.","pageRef":"صفحه ۱۰۳"},{"type":"note","title":"توسعه پایدار","body":"توسعه پایدار یعنی بهبود زندگی امروز بدون آسیب به منابع نسل‌های آینده.\nاستفاده معقول از آب و خاک ، به‌کارگیری انرژی‌های پاک و بازیافت پسماند نمونه‌های آن است."},{"type":"note","title":"چرا جهان نابرابر است؟","body":"میراث استعمار و جنگ ، کمبود فناوری و آموزش و بی‌ثباتی سیاسی برخی کشورها را عقب نگه داشته است.\nکشورهای صنعتی با فروش کالاهای گران و خرید مواد خام ارزان سهم بیشتری از تجارت جهانی می‌برند."},{"type":"exam","title":"سوال امتحانی: سه ویژگی کشورهای توسعه‌یافته را بنویسید.","body":"پاسخ تشریحی:\nدرآمد سرانه بالا و اقتصاد قوی با صنایع پیشرفته.\nآموزش و بهداشت گسترده و امید به زندگی بالا.\nزیرساخت‌های کامل مانند راه و برق و اینترنت و برخورداری از ثبات و حکومت قانون."},{"type":"exam","title":"سوال امتحانی: نقش فناوری در پیشرفت اقتصادی کشورها را با مثال توضیح دهید.","body":"پاسخ تشریحی:\nفناوری تولید را بیشتر و سریع‌تر و کم‌هزینه‌تر می‌کند.\nمثال: کشورهایی که آبیاری نوین و ماشین‌آلات کشاورزی دارند از همان زمین محصول بیشتری به دست می‌آورند.\nصنایع پیشرفته کالای گران تولید و صادر می‌کند."}]},{"number":9,"title":"ایرانی متحد و یکپارچه (صفوی)","pages":"۱۰۹ تا ۱۲۰","contents":[{"type":"answer","title":"شاه‌اسماعیل صفوی کی و کجا حکومت صفوی را بنیان گذاشت و چه تصمیم مهمی گرفت؟","body":"شاه‌اسماعیل در سال ۱۵۰۱ میلادی در تبریز حکومت صفوی را بنیان گذاشت.\nاو مذهب تشیع را دین رسمی ایران اعلام کرد.\nاین تصمیم به یکپارچگی کشور و استوار شدن هویت ملی و دینی ایرانیان کمک کرد.","pageRef":"صفحه ۱۱۰"},{"type":"answer","title":"شاه‌عباس چه اقداماتی برای شکوه و استحکام ایران انجام داد؟","body":"ارتش منظم و توپخانه ساخت و با شکست عثمانی و ازبک مرزها را امن کرد.\nپایتخت را به اصفهان برد و آن را به یکی از زیباترین شهرهای جهان بدل ساخت.\nجاده و کاروانسرا ساخت و تجارت ابریشم را رونق داد.","pageRef":"صفحه ۱۱۳"},{"type":"note","title":"نقش تشیع در یکپارچگی ایران","body":"با رسمی شدن تشیع پیوند مردم و حکومت و مرجعیت دینی تقویت شد.\nمردم و علما در برابر هجوم عثمانی‌ها در دفاع از کشور همراه شاهان صفوی قرار گرفتند و هویت ملی استوارتر شد."},{"type":"note","title":"اصفهان ؛ نصف جهان","body":"شاه‌عباس اصفهان را پایتخت کرد و میدان نقش جهان و مسجد شیخ لطف‌الله و پل خواجو ساخته شد.\nگردشگران اروپایی اصفهان را نصف جهان نامیدند و آن را با بزرگ‌ترین شهرهای زمان خود سنجیدند."},{"type":"exam","title":"سوال امتحانی: دو عامل سقوط حکومت صفوی را بنویسید.","body":"پاسخ تشریحی:\nجنگ‌های طولانی و پرداخت هزینه سنگین آن خزانه را خالی کرده بود.\nپس از شاه‌سلطان حسین حکومتی ضعیف و ارتشی بی‌رمق بر سر کار بود.\nحمله محمود افغان و فتح اصفهان در سال ۱۷۲۲ میلادی به حکومت صفوی پایان داد."},{"type":"exam","title":"سوال امتحانی: تجارت ابریشم چه اهمیتی برای ایران در عصر صفوی داشت؟","body":"پاسخ تشریحی:\nابریشم مهم‌ترین کالای صادراتی ایران بود و درآمد فراوانی به خزانه می‌رساند.\nجاده‌ها و کاروانسراهای امن تجارت داخلی و خارجی را آسان کرد.\nبازرگانان اروپایی به اصفهان می‌آمدند و ایران کانون تجارت ابریشم جهان شد."}]},{"number":10,"title":"ایران در دوران قاجار","pages":"۱۲۱ تا ۱۳۲","contents":[{"type":"answer","title":"حکومت قاجار را چه کسی بنیان گذاشت و پایتخت او کدام شهر بود؟","body":"آقامحمدخان قاجار پس از پایان نبرد جانشینان کریم‌خان زند ، کشور را یکپارچه کرد و حکومت قاجار را بنیان گذاشت.\nاو تهران را پایتخت قرار داد و پس از او قاجاریان نزدیک ۱۳۰ سال بر ایران فرمان راندند.","pageRef":"صفحه ۱۲۲"},{"type":"answer","title":"جنگ‌های ایران و روس در دوره قاجار چه نتایجی داشت؟","body":"در زمان فتحعلی‌شاه ایران در دو جنگ با روس شکست خورد.\nبا قرارداد گلستان و ترکمانچای بخش‌هایی از قفقاز از کشور جدا شد.\nکاپیتولاسیون و باز شدن بازار ایران به کالای خارجی ضربه بزرگی به اقتصاد کشور زد.","pageRef":"صفحه ۱۲۵"},{"type":"note","title":"قراردادهای ننگین گلستان و ترکمانچای","body":"قرارداد گلستان ۱۸۱۳ و ترکمانچای ۱۸۲۸ میلادی از قراردادهای ننگین تاریخ ایران‌اند.\nبا این قراردادها بخش‌هایی از سرزمین ایران جدا شد و امتیازهای ویژه‌ای به روس‌ها رسید."},{"type":"note","title":"واگذاری امتیازها به بیگانگان","body":"شاهان قاجار برای گرفتن پول و حمایت امتیازهای کشور را به بیگانگان می‌دادند.\nنمونه‌های مشهور: امتیاز رویتر و امتیاز دارسی برای استخراج نفت.\nاین کار استقلال اقتصادی و سیاسی کشور را به خطر انداخت."},{"type":"exam","title":"سوال امتحانی: دو دلیل شکست ایران در جنگ‌های ایران و روس را بنویسید.","body":"پاسخ تشریحی:\nارتش ایران قدیمی و کم‌سلاح بود و در برابر توپخانه و ارتش منظم روس توان نداشت.\nفرماندهی یکپارچه و همدلی فرماندهان سپاه وجود نداشت.\nبی‌توجهی حکومت قاجار به ساختن ارتش نوین نتیجه جنگ را روشن کرد."},{"type":"exam","title":"سوال امتحانی: قرارداد ترکمانچای چه بدهای سنگینی برای ایران داشت؟ دو مورد بنویسید.","body":"پاسخ تشریحی:\nجدایی سرزمین‌هایی مانند ایروان و نخجوان از ایران و پرداخت غرامت سنگین جنگ به روس.\nپذیرش کاپیتولاسیون یعنی محاکمه نشدن روس‌ها در دادگاه‌های ایران.\nاین قرارداد نشان داد حکومت قاجار در برابر قدرت‌های بیگانه ناتوان است."}]},{"number":11,"title":"ایران در آستانه انقلاب مشروطیت","pages":"۱۳۳ تا ۱۴۵","contents":[{"type":"answer","title":"دو نمونه از اصلاحات امیرکبیر را بنویسید.","body":"امیرکبیر در زمان ناصرالدین‌شاه صدراعظم بود.\nاو دارالفنون را برای آموزش علوم جدید بنیان گذاشت و روزنامه وقایع اتفاقیه را منتشر کرد.\nمستشاران بی‌کاربرد را اخراج کرد و مالیات را سامان داد و به فساد مالی پایان داد.","pageRef":"صفحه ۱۳۴"},{"type":"answer","title":"نهضت تنباکو چه بود و به چه نتیجه‌ای رسید؟","body":"ناصرالدین‌شاه امتیاز خرید و فروش تنباکو را به شرکت انگلیسی واگذار کرد.\nمیرزای شیرازی فتوای تحریم تنباکو داد و مردم و بازار از آن پیروی کردند.\nشاه ناچار امتیاز را لغو کرد ؛ نخستین پیروزی بزرگ مردم و علما بر نفوذ بیگانگان بود.","pageRef":"صفحه ۱۳۸"},{"type":"note","title":"ائتلاف سه‌گانه مشروطه‌خواهان","body":"روحانیون به رهبری مراجع تقلید ، روشنفکران و روزنامه‌نگاران و بازاریان سه گروه اصلی مشروطه‌خواه بودند.\nهمین همراهی مردم را در برابر استبداد و سلطه بیگانگان هم‌صدا کرد."},{"type":"note","title":"علل برخاستن مردم به مشروطه‌خواهی","body":"علل اصلی: استبداد و بی‌قانونی شاهان قاجار ، واگذاری امتیازها و گرفتن وام‌های ننگین از بیگانگان.\nگرانی و قحطی و فقر مردم و آگاهی از پیشرفت کشورهای اروپایی از راه مطبوعات و سفر."},{"type":"exam","title":"سوال امتحانی: عدالتخانه چه خواسته‌ای بود و چه جایگاهی در جنبش مشروطه داشت؟","body":"پاسخ تشریحی:\nعدالتخانه جایی برای رسیدگی به شکایت مردم از ظلم حاکمان و مأموران بود.\nمردم و علما خواستار برپایی آن و قانونی شدن کار حکومت شدند.\nهمین خواسته هسته اصلی انقلاب مشروطه و در فرمان مشروطیت هم آمده است."},{"type":"exam","title":"سوال امتحانی: نقش روزنامه‌ها و تلگرافخانه‌ها را در آگاهی مردم بنویسید.","body":"پاسخ تشریحی:\nروزنامه‌هایی مانند وقایع اتفاقیه و صور اسرافیل اندیشه قانون‌خواهی را میان مردم پخش می‌کردند.\nمردم از وضع کشور و پیشرفت جهان آگاه می‌شدند.\nتلگرافخانه‌ها خبرها را سریع بین شهرها می‌رساندند و هماهنگی اعتراض‌ها را آسان می‌کردند."}]},{"number":12,"title":"عصر مشروطیت","pages":"۱۴۶ تا ۱۵۸","contents":[{"type":"answer","title":"مشروطه یعنی چه و فرمان مشروطیت را چه کسی امضا کرد؟","body":"مشروطه یعنی حکومتی که در آن قدرت شاه با قانون محدود است و همه از جمله شاه باید از قانون پیروی کنند.\nمظفرالدین‌شاه در سال ۱۲۸۵ خورشیدی فرمان مشروطیت را امضا کرد و نخستین مجلس شورای ملی گشایش یافت.","pageRef":"صفحه ۱۴۸"},{"type":"answer","title":"استبداد صغیر چه بود و چگونه پایان یافت؟","body":"محمدعلی‌شاه با به توپ بستن مجلس مشروطه را برانداخت که استبداد صغیر نام گرفت.\nمجاهدان تبریز و گیلان و اصفهان به تهران آمدند و شهر را فتح کردند.\nشاه برکنار شد ، احمدشاه به پادشاهی رسید و مجلس دوم گشوده شد.","pageRef":"صفحه ۱۵۲"},{"type":"note","title":"رویدادهای آغاز جنبش مشروطه","body":"اعتراض به گرانی قند و شکر و تازیانه زدن بازرگانان تهران ، سپس تحصن علما و مردم در مسجد.\nسرانجام مظفرالدین‌شاه فرمان مشروطه را امضا کرد و خواسته اصلی مردم تشکیل عدالتخانه بود."},{"type":"note","title":"قانون اساسی و متمم آن","body":"نخستین مجلس قانون اساسی را نوشت و مظفرالدین‌شاه پیش از مرگ آن را امضا کرد.\nمتمم قانون اساسی حقوق ملت و اختیارات شاه و مجلس را روشن کرد و برابری مردم در برابر قانون را پذیرفت."},{"type":"exam","title":"سوال امتحانی: مجلس شورای ملی را چه کسی و چرا به توپ بست و نتیجه چه شد؟","body":"پاسخ تشریحی:\nمحمدعلی‌شاه با پشتیبانی روس‌ها و قزاق‌ها در سال ۱۲۸۷ مجلس را به توپ بست.\nمردم تبریز به رهبری ستارخان مقاومت کردند و مجاهدان گیلان و اصفهان تهران را فتح نمودند.\nمشروطه دوباره برقرار شد و مجلس دوم گشایش یافت."},{"type":"exam","title":"سوال امتحانی: نقش علما و نقش بازاریان را در پیروزی جنبش مشروطه بنویسید.","body":"پاسخ تشریحی:\nعلما با فتوا و تحصن مردم را هدایت کردند و از قانون‌خواهی پشتیبانی نمودند.\nبازاریان با بستن بازار و پرداخت هزینه‌های جنبش ستون مالی آن بودند.\nهمکاری این دو گروه با روشنفکران پیروزی مشروطه را ممکن ساخت."}]}]},{"title":"عربی نهم","subject":"عربی","description":"جواب تمرین‌ها، نکات قواعد و سوالات امتحانی همه درس‌های کتاب عربی نهم","color":"teal","icon":"languages","chapters":[{"number":1,"title":"عَودةٌ مِنَ الحَجّ","pages":"۸ تا ۲۰","contents":[{"type":"answer","title":"تمرین درس اول: معنی فعل‌های معتل را بنویسید.","body":"قالَ: گفت\nبَاعَ: فروخت\nدَعا: دعا کرد، خواند\nنَامَ: خوابید\nشَاءَ: خواست\nرَمى: انداخت\nاین فعل‌ها در حروف اصلی خود یکی از حروف عله (ا، و، ی) دارند و به آن‌ها فعل معتل می‌گویند.","pageRef":"صفحه ۱۵"},{"type":"answer","title":"تمرین درس اول: ترجمه جمله‌های متن عَودةٌ مِنَ الحَجّ","body":"رَجَعَ أَبي مِنَ الحَجِّ مَريحاً: پدرم سلامت از حج بازگشت\nقَرَأتُ في صَحيفَةِ الحَجِّ: در صحیفه حج خواندم\nشَهِدَ الحُجّاجُ مَشاعِرَ الحَجِّ: زائران مشاعر حج را به چشم دیدند.","pageRef":"صفحه ۱۰"},{"type":"note","title":"قاعده: فعل و اسم معتل","body":"هر فعل یا اسمی که یکی از حروف اصلی‌اش حرف عله (ا، و، ی) باشد «معتل» است\nمثال: قَالَ (گفت)، بَاعَ (فروخت)، دَعا (دعا کرد)، عَصا (عصا)\nحرف عله در اشتقاق تغییر می‌کند: قُلْ (امر از قَالَ)، مَبيع (اسم مفعول از بَاعَ).","pageRef":"صفحه ۱۵"},{"type":"note","title":"نکته: اسم‌های معتل پرکاربرد","body":"بعضی اسم‌های معتل: عَيد (عيد)، مَوْت (مرگ)، حَياة (زندگی)، قَوْل (گفتار)، باب (در)، قِراءَة (خواندن)\nدر ترجمه باید ریشه سه‌حرفی را بشناسیم؛ مانند مَوْت از ماتَ (مُرد).","pageRef":"صفحه ۱۶"},{"type":"exam","title":"سوال امتحانی: معتل بودن واژه‌ها را با دلیل بنویسید.","body":"پاسخ: «قالَ» فعل ماضی معتل از ریشه ق‌و‌ل است و «مَوْت» اسم معتل از همین ریشه\nهر دو در حروف اصلی خود حرف عله دارند؛ در فعل «و» ظاهر شده و در اسم به «ا» تبدیل شده است\nپس هر دو واژه معتل‌اند.","pageRef":"صفحه ۱۹"},{"type":"exam","title":"سوال امتحانی: از فعل‌های معتل، امر مخاطب بسازید.","body":"پاسخ: قَالَ ← قُلْ (بگو)\nبَاعَ ← بِعْ (بفروش)\nنَامَ ← نَمْ (بخواب)\nدر صیغه امر افعال اجوف، حرف عله به ضمه یا کسره تبدیل می‌شود.","pageRef":"صفحه ۱۸"}]},{"number":2,"title":"مِنْ جَديدِ التِّقْنِيَة","pages":"۲۱ تا ۳۳","contents":[{"type":"answer","title":"تمرین درس دوم: معنای مضارع منقول را بنویسید.","body":"لَنْ أَنْسى مُعَلِّمي: هرگز معلمم را فراموش نمی‌کنم (استقبال)\nكَيْ أَفْهَمَ الدَّرْسَ: تا درس را بفهمم (غرض)\nإِنْ تَجْتَهِدْ تَنْجَحْ: اگر تلاش کنی موفق می‌شوی (شرط)\nمضارع با این ادوات از معنای حال به معنای دیگر منقول می‌شود.","pageRef":"صفحه ۲۸"},{"type":"answer","title":"تمرین درس دوم: ترجمه جمله‌های متن","body":"تُساعِدُنا التِّقْنِيَةُ الحَديثَةُ في الدِّراسَة: فناوری نوین در درس خواندن به ما کمک می‌کند\nسَوْفَ أَتَعَلَّمُ الرِّياضِيّاتِ مِنَ الحاسوب: از رایانه ریاضی می‌آموزم\nالحاسوبُ يَحْفَظُ المَعْلوماتَ: رایانه اطلاعات را نگه می‌دارد.","pageRef":"صفحه ۲۲"},{"type":"note","title":"قاعده: مضارع منقول","body":"فعل مضارع گاهی با آمدن ادواتی از معنای حال به معنای دیگری منتقل می‌شود\nلنْ + مضارع = نفی آینده (هرگز نمی...)\nكي و لِـ = غرض (تا)\nإنْ + مضارع = شرط (اگر)\nدر ترجمه، معنای منقول را رعایت کنیم نه معنای حال را.","pageRef":"صفحه ۲۸"},{"type":"note","title":"نکته: مثال‌های مضارع منقول","body":"لَنْ يَنْجَحَ الكَسولُ: تنبل موفق نمی‌شود\nلِنَشْكُرِ اللهَ: تا خدا را شکر کنیم\nإِنْ تَقْرَأْ تَتَعَلَّمْ: اگر بخوانی می‌آموزی\nهر جا مضارع پس از این ادوات بیاید، در ترجمه معنای منقول به کار می‌رود.","pageRef":"صفحه ۲۹"},{"type":"exam","title":"سوال امتحانی: «لَنْ أَتْرُكَ الصَّلاةَ» را ترجمه کنید.","body":"پاسخ: «هرگز نماز را ترک نمی‌کنم»\n«لنْ» حرف نفی است و مضارع بعد از آن را به معنای آینده منفی می‌برد\nپس مضارعِ پس از آن منقول است و معنای استقبال می‌دهد، نه معنای حال.","pageRef":"صفحه ۳۱"},{"type":"exam","title":"سوال امتحانی: معنای مضارع در «كَيْ نَرْبَحَ» چیست؟","body":"پاسخ: «كي» برای بیان غرض و هدف می‌آید؛ پس «كَيْ نَرْبَحَ» یعنی «تا پیروز شویم»\nمضارع بعد از «كي» معنای غرض می‌گیرد و در ترجمه با «تا» یا «برای این‌که» باز می‌شود.","pageRef":"صفحه ۳۰"}]},{"number":3,"title":"مُسابَقَةٌ ثَقافِيَّة","pages":"۳۴ تا ۴۶","contents":[{"type":"answer","title":"تمرین درس سوم: ترجمه اسم‌های تفضیل","body":"أَذْكى: باهوش‌تر\nأَجْمَل: زیباتر\nأَفْضَل: بهتر\nأَكْبَر: بزرگ‌تر\nأَقَلّ: کمتر\nاین واژه‌ها بر وزن «أَفْعَل» هستند و برتری یک چیز را بر چیز دیگر می‌رسانند.","pageRef":"صفحه ۴۱"},{"type":"answer","title":"تمرین درس سوم: ترجمه جمله‌های متن","body":"العِلْمُ أَفْضَلُ مِنَ المالِ: علم بهتر از مال است\nفاطِمَةُ أَذْكى مِنْ أخْتِها: فاطمه از خواهرش باهوش‌تر است\nهٰذِهِ المُسابَقَةُ أَجْمَلُ مِنْ تِلْكَ: این مسابقه از آن زیباتر است.","pageRef":"صفحه ۳۶"},{"type":"note","title":"قاعده: اسم تفضیل","body":"اسم تفضیل بر وزن «أَفْعَل» است و برتری را می‌رساند؛ مانند أَكْبَر (بزرگ‌تر) و أَحْسَن (نیکوتر)\nپس از آن حرف جر «مِنْ» به معنای «از» می‌آید\nاگر شناسه معرفه باشد با «ال» می‌آید: هٰذا الكِتابُ أَفْضَلُ الكُتُبِ.","pageRef":"صفحه ۴۱"},{"type":"note","title":"نکته: اسم تفضیل و جنسیت","body":"اسم تفضیل همیشه بر وزن «أَفْعَل» است و برای مؤنث هم تغییر نمی‌کند\nتعیین جنسیت با خود جمله است: فاطِمَةُ أَذْكى مِنْ زَينَب: فاطمه از زینب باهوش‌تر است\nبرای «اول» و «آخر» هم همین وزن به کار می‌رود: الأوَّل، الآخِر.","pageRef":"صفحه ۴۲"},{"type":"exam","title":"سوال امتحانی: جای خالی را پر کنید.","body":"عَلِيٌّ ......... مِنْ أخيه (کوشاتر)\nپاسخ: «عَلِيٌّ أَكْثَرُ جِهْداً مِنْ أخيه» یعنی «علی از برادرش کوشاتر است»\nچون از فعل «جاهَدَ» اسم تفضیل ساده نمی‌سازیم، «أَكْثَرُ» با مصدر «جِهْد» می‌آید و پس از آن «مِنْ» به معنای «از» قرار می‌گیرد.","pageRef":"صفحه ۴۴"},{"type":"exam","title":"سوال امتحانی: «الصِّدْقُ أَفْضَلُ الخُلُقِ» را ترجمه کنید.","body":"پاسخ: «راستگویی نیکوترین خُلق است» یا «راستگویی بهتر از همه اخلاق‌هاست»\nچون پس از اسم تفضیل «أَفْضَل»، موصوفِ شناسه با «ال» آمده، ترجمه به صورت «ترین» درست است.","pageRef":"صفحه ۴۵"}]},{"number":4,"title":"شُكْرُ النِّعْمَة","pages":"۴۷ تا ۵۹","contents":[{"type":"answer","title":"تمرین درس چهارم: ترجمه جمله‌های با حروف مشبهه","body":"إنَّ اللهَ شَكُورٌ: به‌راستی خدا شکور (شکرپذیر) است\nلَعَلَّكَ تَنْجَحْ: شاید موفق شوی\nلَيْتَ الشَّبابَ يَعُودُ يَوْماً: ای کاش جوانی روزی بازگردد\nلكنَّ العِلْمَ أَبْقى: اما علم ماندگارتر است.","pageRef":"صفحه ۵۲"},{"type":"answer","title":"تمرین درس چهارم: ترجمه متن شُكْرُ النِّعْمَة","body":"إنَّ اللَّهَ غَفورٌ رَحيمٌ: به‌راستی خدا آمرزنده و مهربان است\nإنَّ النِّعْمَةَ تَزُولُ بِالعِصْيانِ: به‌راستی نعمت با نافرمانی زایل می‌شود\nلَعَلَّكُمْ تُفْلِحُونَ: باشد که رستگار شوید.","pageRef":"صفحه ۴۸"},{"type":"note","title":"قاعده: حروف مشبهه با انّ","body":"حروف مشبهه (إنَّ، أنَّ، كأنَّ، لكنَّ، ليتَ، لعلَّ) مشبه به «إنّ» و مؤکدِ جمله اسمیه‌اند\nپس از آن‌ها اسم منصوب و خبر مرفوع می‌آید: إنَّ العِلْمَ نُورٌ\nمعانی آن‌ها متفاوت است: كأنَّ برای تشبیه، ليتَ برای تمنی.","pageRef":"صفحه ۵۲"},{"type":"note","title":"نکته: معانی حروف مشبهه","body":"إنَّ و أنَّ: تأکید (همانا)\nكأنَّ: تشبیه (گویی)\nلكنَّ: استدراک (اما)\nليتَ: تمنی (ای کاش)\nلعلَّ: امید (شاید)\nمثال: كأنَّ القَمَرَ سَراجٌ: گویی ماه چراغی است\nليتَ لي نَصيراً: ای کاش یاوری داشتم.","pageRef":"صفحه ۵۳"},{"type":"exam","title":"سوال امتحانی: نوع «ليتَ» و معنای جمله را بنویسید.","body":"جمله: ليتَ في الدُّنيا حَياةً ثانِيَة\nپاسخ: «ليتَ» از حروف مشبهه است و معنای تمنی می‌دهد؛ ترجمه: «ای کاش در دنیا زندگی دوباره‌ای بود»\nاسمِ «ليتَ» منصوب و خبر آن مرفوع است.","pageRef":"صفحه ۵۷"},{"type":"exam","title":"سوال امتحانی: خطای جمله را اصلاح کنید.","body":"جمله غلط: «إنَّ العِلْمُ نُورٌ»\nپاسخ: صورت درست «إنَّ العِلْمَ نُورٌ» است\nزیرا پس از حروف مشبهه، اسم منصوب می‌شود و خبر مرفوع می‌ماند\nترجمه: «همانا علم نور است».","pageRef":"صفحه ۵۶"}]},{"number":5,"title":"القُرآنُ الكَريم","pages":"۶۰ تا ۷۲","contents":[{"type":"answer","title":"تمرین درس پنجم: تطبیق صفت و موصوف","body":"قُرْآنٌ كَريم: قرآنی کریم\nالكِتابُ المُبِين: کتاب روشن\nآياتٌ بَيِّنات: نشانه‌های روشن\nكَلِمَةٌ طَيِّبَة: سخن پاکیزه\nصفت باید پس از موصوف بیاید و با آن در جنس و عدد تطبیق کند.","pageRef":"صفحه ۶۶"},{"type":"answer","title":"تمرین درس پنجم: ترجمه متن القُرآنُ الكَريم","body":"القُرآنُ الكَريمُ كِتابُنا المُبارَكُ: قرآن کریم کتاب پربرکت ماست\nفيه آياتٌ مُبِينَةٌ: در آن نشانه‌های روشنی است\nهُوَ دَواءٌ وَ نُورٌ: آن درمان و نوری است.","pageRef":"صفحه ۶۱"},{"type":"note","title":"قاعده: صفت و موصوف","body":"واژه‌ای که وصف را بیان می‌کند «صفت» و آن که وصف می‌شود «موصوف» است؛ مانند قَلَمٌ جَديد (قلمی نو)\nصفت بعد از موصوف می‌آید و با آن در جنس و عدد تطبیق می‌کند\nمثال: رَجُلٌ صالِح، نِسْوةٌ صالِحات.","pageRef":"صفحه ۶۶"},{"type":"note","title":"نکته: ترجمه صفت و موصوف","body":"در عربی صفت پس از موصوف و در فارسی پیش از آن می‌آید؛ پس در ترجمه جای آن‌ها را عوض می‌کنیم: سَحابَةٌ بَيْضاءَة: ابری سفید\nصفت می‌تواند جمله باشد: رَأَيْتُ رَجُلاً يَسْأَلُ عَنِ الطَّريق: مردی را دیدم که از راه می‌پرسید.","pageRef":"صفحه ۶۷"},{"type":"exam","title":"سوال امتحانی: خطای تطبیق را اصلاح کنید.","body":"جمله غلط: «قَرَأْتُ آياتٍ بَيِّنٍ»\nپاسخ: درست «قَرَأْتُ آياتٍ بَيِّنَةٍ» است\nچون «آيات» جمع مکسر و غیرعاقل است، صفت آن مفرد مؤنث می‌شود؛ تطبیق جمع غیرعاقل با مفرد مؤنث انجام می‌گیرد.","pageRef":"صفحه ۷۰"},{"type":"exam","title":"سوال امتحانی: «كِتابٌ نافِعٌ» را ترجمه کنید.","body":"پاسخ: «کتابی سودمند»\nموصوف «كِتاب» پیش از صفت «نافِع» آمده و در فارسی صفت قبل از موصوف قرار می‌گیرد\nاگر «ال» بیاید هر دو ال می‌گیرند: الكِتابُ النافِع: کتابِ سودمند.","pageRef":"صفحه ۷۱"}]},{"number":6,"title":"حِمايَةُ البيئَة","pages":"۷۳ تا ۸۶","contents":[{"type":"answer","title":"تمرین درس ششم: ترجمه جمله‌های دارای حال","body":"جاءَ الطُّلّابُ مُبْتَسِمينَ: دانش‌آموزان خندان آمدند\nعادَ الوَلَدُ مَحْزُوناً: پسر غمگین بازگشت\nرَجَعَ الحاجُّ ساجِداً: حاجی سجده‌گزار بازگشت\nحال، کیفیت صاحب خود را در زمان فعل نشان می‌دهد.","pageRef":"صفحه ۷۹"},{"type":"answer","title":"تمرین درس ششم: ترجمه متن حِمايَةُ البيئَة","body":"مِنْ واجِباتِنا حِمايَةُ البيئَةِ مِنَ التَّلَوُّث: حفاظت از محیط زیست در برابر آلودگی از وظایف ماست\nلا تَرْمِ النُّفاياتَ في الشّارِع: زباله‌ها را در خیابان نینداز\nاِزْرَعِ الشَّجَرَ: درخت بکار.","pageRef":"صفحه ۷۴"},{"type":"note","title":"قاعده: حال","body":"حال اسمی منصوب است که حالت فاعل را هنگام فعل نشان می‌دهد\nمثال: دَخَلَ الطِّفْلُ ضاحِكاً (کودک خندان داخل شد)\nحال می‌تواند عطف هم بشود: جاءَتِ البِنْتُ ضاحِكَةً وَ مَبْتَسِمَةً: دختر خندان و لبخندزنان آمد.","pageRef":"صفحه ۷۹"},{"type":"note","title":"نکته: تطبیق حال و ترجمه آن","body":"حال با صاحب حال در جنس و عدد تطبیق می‌کند\nجاءَ الرِّجالُ شاكِرينَ: مردان شکرگزار آمدند\nرَأَيْتُ الطُّلّابَ مُجْتَهِدينَ: دانش‌آموزان کوشا را دیدم\nدر فارسی حال اغلب با قید «ـانه» یا صفت ترجمه می‌شود.","pageRef":"صفحه ۸۰"},{"type":"exam","title":"سوال امتحانی: حال را مشخص و ترجمه کنید.","body":"جمله: «خَرَجَ الوَلَدانُ مَسْرُورَيْنِ»\nپاسخ: حال، «مَسْرُورَيْنِ» است؛ منصوب و مثنی\nترجمه: «دو پسر خوشحال بیرون رفتند»\nحال با فاعل «الوَلَدان» که مثنی مذکر است تطبیق کرده است.","pageRef":"صفحه ۸۳"},{"type":"exam","title":"سوال امتحانی: جمله را با حال کامل و ترجمه کنید.","body":"پاسخ نمونه: «جاءَ الطّالبُ حَزِيناً» یا «جاءَ الطّالبُ يَبْكِي»\nحالِ اسم، منصوب است: حَزِيناً\nحالِ فعل، مضارع ناقصه مرفوع است: يَبْكِي\nترجمه: «دانش‌آموز غمگین (در حال گریه) آمد».","pageRef":"صفحه ۸۴"}]},{"number":7,"title":"صُنْعُ الخَيْر","pages":"۸۷ تا ۱۰۰","contents":[{"type":"answer","title":"تمرین درس هفتم: ترجمه جمله‌های مستثنی","body":"حَضَرَ التَّلاميذُ كُلُّهُمْ إلّا زَيداً: همه شاگردها آمدند جز زید\nما اجْتَهَدَ طالِبٌ غَيْرِ مُحَمَّدٍ: هیچ دانش‌آموزی جز محمد تلاش نکرد\nقامَ الناسُ سِوى إِبْراهِيمَ: مردم برخاستند جز ابراهیم.","pageRef":"صفحه ۹۲"},{"type":"answer","title":"تمرین درس هفتم: ترجمه متن صُنْعُ الخَيْر","body":"صُنْعُ الخَيْرِ لا يَضيعُ أبَداً: نیکی هرگز تلف نمی‌شود\nساعِدْ مَنْ يَحْتاجُ إلى المُساعَدَة: به نیازمندِ کمک، کمک کن\nالخَيْرُ يَنْتَشِرُ في المُجْتَمَع: نیکی در جامعه پخش می‌شود.","pageRef":"صفحه ۸۷"},{"type":"note","title":"قاعده: مستثنی","body":"مستثنی اسمی است که با «إلّا، غَيْرَ، سِوى» از حکم کلی بیرون می‌آید؛ مانند: حَضَرَ الجَميعُ إلّا أحْمَدَ (همه آمدند جز احمد)\nمستثنی پس از این ادوات منصوب است و «غَيْر» و «سِوى» خود مضاف‌اند.","pageRef":"صفحه ۹۲"},{"type":"note","title":"نکته: انواع مستثنی","body":"مستثنی متصل: پس از کلی یا شبه‌کلی می‌آید؛ مانند: قَرَأْتُ الكُتُبَ كُلَّها إلّا كِتاباً\nمستثنی منقطع: پیش از آن کلی‌ای نیست؛ مانند: قَرَأْتُ كُتُباً إلّا كِتاباً\n«غَيْر» و «سِوى» فقط در مستثنی متصل به کار می‌روند.","pageRef":"صفحه ۹۳"},{"type":"exam","title":"سوال امتحانی: جمله را با «غير» بازنویسی کنید.","body":"جمله: «قَرَأْتُ الكِتابَ كُلَّهُ إلّا صَفْحَتَيْنِ»\nپاسخ: «قَرَأْتُ الكِتابَ كُلَّهُ غَيْرَ صَفْحَتَيْنِ»\n«غَيْر» جای «إلّا» را می‌گیرد، مجرور به اضافه است و مستثنی به صورت مضاف‌الیه می‌آید.","pageRef":"صفحه ۹۶"},{"type":"exam","title":"سوال امتحانی: «ما حَضَرَ أحَدٌ إلّا زَيداً» را ترجمه کنید.","body":"پاسخ: «هیچ کسی نیامد جز زید»\nاین مستثنی متصل است؛ زیرا مستثنی (زید) از جنس شبه‌کلیِ ذکرشده «أحَدٌ» است و با «إلّا» منصوب شده\nاگر پیش از «إلّا» کلمه‌ای نبود، مستثنی منقطع می‌شد.","pageRef":"صفحه ۹۷"}]},{"number":8,"title":"عَلى مائِدَةِ العَشاء","pages":"۱۰۱ تا ۱۱۴","contents":[{"type":"answer","title":"تمرین درس هشتم: ترجمه جمله‌های نهی","body":"لا تُسْرِفْ في الطَّعامِ: در غذا زیاده‌روی نکن\nلا تَتَكَلَّمْ أثْناءَ الأَكْلِ: هنگام غذا خوردن سخن نگو\nلا تُهْمِلوا غَسْلَ اليَدَيْنِ: شستن دست‌ها را کوتاهی نکنید\nفعل نهی با «لا» و مضارع مجزوم ساخته می‌شود.","pageRef":"صفحه ۱۰۵"},{"type":"answer","title":"تمرین درس هشتم: ترجمه متن عَلى مائِدَةِ العَشاء","body":"اجْلِسْ إلى المائِدَةِ بِهُدوءٍ: با آرامش سر سفره بنشین\nاِسْتَعِينْ بِاليَمِينِ في الأَكْلِ: در خوردن از دست راست کمک بگیر\nاشْكُرِ اللهَ عِنْدَ الإِشْباعِ: پس از سیری خدا را شکر کن.","pageRef":"صفحه ۱۰۲"},{"type":"note","title":"قاعده: فعل نهی","body":"فعل نهی با «لا» و مضارع مجزوم ساخته می‌شود و از مخاطب چیزی را نمی‌خواهد؛ مانند: لا تَنْسَ ذِكْرَ الله (ذکر خدا را فراموش نکن)\nفعل مضارع پس از «لا» ساکن می‌شود و در صیغه‌های پنج‌گانه، نون آن حذف می‌گردد.","pageRef":"صفحه ۱۰۵"},{"type":"note","title":"نکته: نهی در صیغه‌های مختلف","body":"نهی برای همه صیغه‌های مخاطب با «لا» ساخته می‌شود: لا تَفْعَلْ، لا تَفْعَلا، لا تَفْعَلوا، لا تَفْعَلْنَ\nمثال: لا تُضَيِّعوا الوَقْتَ: وقت را تلف نکنید\nعلامت جزوم در مفرد سکون و در جمع حذف نون است.","pageRef":"صفحه ۱۰۶"},{"type":"exam","title":"سوال امتحانی: فعل را به نهی تبدیل و ترجمه کنید.","body":"جمله: «تُخْرِجُ الفُضولاتَ في الشّارِع»\nپاسخ نهی: «لا تُخْرِجِ الفُضولاتَ في الشّارِع» یعنی «زباله‌ها را در خیابان بیرون نریز»\nمضارع پس از «لا»ی نهی ساکن می‌شود و معنا از خبر به نهی تغییر می‌کند.","pageRef":"صفحه ۱۰۹"},{"type":"exam","title":"سوال امتحانی: علامت جزوم «لا تَفْعَلوا» را بنویسید.","body":"پاسخ: در جمع مخاطب، علامت جزوم حذف «نون» است (تَفْعَلونَ ← تَفْعَلوا)\nدر مفرد، فعل با سکون مجزوم می‌شود: لا تَفْعَلْ\nهر دو به «انجام نده / ندهید» ترجمه می‌شوند.","pageRef":"صفحه ۱۱۰"}]},{"number":9,"title":"العِلمُ نُور","pages":"۱۱۵ تا ۱۲۸","contents":[{"type":"answer","title":"تمرین درس نهم: ترجمه اعداد","body":"أحَدَ عَشَرَ كِتاباً: یازده کتاب\nاثْنا عَشَرَ شَهْراً: دوازده ماه\nثَلاثَةٌ وَ عِشْرونَ طالِبٍ: بیست‌وسه دانش‌آموز\nمِئَةُ صَفْحَةٍ: صد صفحه\nتمییز در ۱۱ و ۱۲ منصوب و در ۲۰ تا ۹۹ مجرور است.","pageRef":"صفحه ۱۱۸"},{"type":"answer","title":"تمرین درس نهم: ترجمه متن العِلمُ نُور","body":"العِلْمُ نُورٌ وَ اللهُ نُورُ السَّماواتِ: علم نور است و خدا نور آسمان‌هاست\nطَلَبُ العِلْمِ فَريضَةٌ عَلى كُلِّ مُسْلِمٍ: طلب علم بر هر مسلمان واجب است\nبِالعِلْمِ تَسْتَقيمُ الحَياةُ: با علم زندگی سامان می‌یابد.","pageRef":"صفحه ۱۱۶"},{"type":"note","title":"قاعده: اعداد ۱۱ تا ۱۹","body":"در اعداد ۱۱ و ۱۲ هر دو جزء با تمییز همجنس‌اند: أحَدَ عَشَرَ كِتاباً، إحْدى عَشْرَةَ بِنْتاً\nدر ۱۳ تا ۱۹ جزء اول مخالف و جزء دوم همجنسِ تمییز است: ثَلاثَةَ عَشَرَ يَوْماً، ثَلاثَ عَشْرَةَ ساعَةً.","pageRef":"صفحه ۱۱۸"},{"type":"note","title":"نکته: تمییز و عشرات","body":"تمییز پس از عدد می‌آید: أرْبَعُونَ صَفْحَةٍ: چهل صفحه\nعشرات (۲۰ تا ۹۰) جمع مذکر سالم‌اند: عِشْرونَ، ثَلاثونَ\nصد «مِئَة» و هزار «ألْف» است: مِئَةُ كِتابٍ: صد کتاب، ألْفُ كِتابٍ: هزار کتاب.","pageRef":"صفحه ۱۱۹"},{"type":"exam","title":"سوال امتحانی: «۱۵ دانش‌آموز» را به عربی بنویسید.","body":"پاسخ: «خَمْسَةَ عَشَرَ طالِباً»\nدر عدد ۱۵ جزء اول «خَمْسَةَ» برخلاف جنس تمییزِ مذکر و جزء دوم «عَشَرَ» همجنس با آن است\nتمییز پس از عدد می‌آید و مفرد منصوب است.","pageRef":"صفحه ۱۲۲"},{"type":"exam","title":"سوال امتحانی: خطای عددی جمله را بیابید.","body":"جمله غلط: «قَرَأْتُ ثَلاثَ عَشْرَةَ كِتاباً»\nپاسخ: درست «ثَلاثَةَ عَشَرَ كِتاباً» است\nچون تمییز «كِتاب» مذکر است، جزء اول مؤنث (ثلاثة) و جزء دوم مذکر (عشر) می‌شود؛ مانند: ثَلاثَ عَشْرَةَ ساعَةً.","pageRef":"صفحه ۱۲۳"}]},{"number":10,"title":"شَجَرَةُ الزَّيتون","pages":"۱۲۹ تا ۱۴۲","contents":[{"type":"answer","title":"تمرین درس دهم: ترجمه با توجه به نکات ترجمه","body":"هٰذِهِ شَجَرَةُ الزَّيْتُونِ المُبارَكَة: این درخت زیتون پربرکت است\nأثْمَرَتِ الأَشْجارُ في الرَّبيعِ: درختان در بهار میوه دادند\nالزَّيْتُونُ يُغْذِي وَ يُشْفِي: زیتون غذا می‌دهد و درمان می‌کند.","pageRef":"صفحه ۱۳۰"},{"type":"answer","title":"تمرین درس دهم: ترجمه متن شَجَرَةُ الزَّيتون","body":"شَجَرَةُ الزَّيْتُونِ مِنَ الأَشْجارِ المُبارَكَة: درخت زیتون از درختان پربرکت است\nذُكِرَتْ في القُرآنِ الكَريم: در قرآن کریم نامش آمده است\nمِنْ ثَمَرَتِها زَيْتٌ مُبارَكٌ: از میوه‌اش روغنی برکت‌مند است.","pageRef":"صفحه ۱۳۱"},{"type":"note","title":"نکته ترجمه: فعل و زمان","body":"ماضی را با گذشته و مضارع را با حال یا آینده ترجمه می‌کنیم: كَتَبَ: نوشت، يَكْتُبُ: می‌نویسد\n«قد» پیش از ماضی، معنای اتمام می‌دهد: قد أَثْمَرَتْ: میوه داده است\nزمان فعل را در ترجمه جابه‌جا نکنیم.","pageRef":"صفحه ۱۳۲"},{"type":"note","title":"نکته ترجمه: صفت و موصوف در جمله","body":"صفت در فارسی پیش از موصوف می‌آید: زَهْرَةٌ جَميلَة: گلی زیبا\nصفت پس از موصوف معرفه با «آن» ترجمه می‌شود: الشَّجَرَةُ المُبارَكَة: آن درخت پربرکت\nصفت جمله‌ای با «که» می‌آید: رَأَيْتُ طائِراً يُغَرِّدُ: پرنده‌ای دیدم که می‌خواند.","pageRef":"صفحه ۱۳۳"},{"type":"exam","title":"سوال امتحانی: «قد أَثْمَرَتِ الشَّجَرَةُ» را ترجمه کنید.","body":"پاسخ: «درخت میوه داده است»\n«قد» پیش از فعل ماضی بر اتمام کار دلالت دارد و ترجمه آن با «ـاست» همراه می‌شود\nتاء تأنیث در «أَثْمَرَتْ» به سبب فاعل مؤنث «الشَّجَرَة» آمده است.","pageRef":"صفحه ۱۳۶"},{"type":"exam","title":"سوال امتحانی: ترجمه درست را انتخاب کنید.","body":"جمله: «رَأَيْتُ شَجَرَةً تَحْمِلُ الزَّيْتُون»\nگزینه ۱: درختی دیدم که زیتون بار دارد\nگزینه ۲: درخت زیتون را دیدم\nپاسخ: گزینه ۱ درست است؛ «شَجَرَةً» نکره و «تَحْمِلُ» صفت جمله‌ای آن است که با «که» ترجمه می‌شود.","pageRef":"صفحه ۱۳۷"}]},{"number":11,"title":"مَدينَةُ تَبْريز","pages":"۱۴۳ تا ۱۶۰","contents":[{"type":"answer","title":"تمرین درس یازدهم: ترجمه با رعایت ترتیب اجزا","body":"هٰذِهِ مَدينَةٌ جَميلَةٌ تُسَمّى تَبْريزَ: این شهری زیبا به نام تبریز است\nيَزُورُها السِّيّاحُ في الصَّيفِ وَ الشِّتاء: گردشگران در تابستان و زمستان از آن دیدن می‌کنند.","pageRef":"صفحه ۱۴۴"},{"type":"answer","title":"تمرین درس یازدهم: ترجمه متن مَدينَةُ تَبْريز","body":"تَبْريزُ مَدينَةُ الفَرْشِ وَ الحِرَفيّاتِ: تبریز شهر فرش و صنایع دستی است\nهَواؤُها بَرِيدٌ جَميلٌ: هوایش خنک و دلپذیر است\nأَهْلُها كَرِيمُونَ وَ حَسَنُو الخُلُقِ: مردمش بخشنده و خوش‌اخلاق‌اند.","pageRef":"صفحه ۱۴۵"},{"type":"note","title":"نکته ترجمه: ترتیب اجزای جمله","body":"در عربی صفت بعد از موصوف می‌آید ولی در فارسی پیش از آن قرار می‌گیرد\nخبر پس از مبتدا می‌آید و ترجمه آن با «است» است: تَبْريزُ مَدينَةٌ أثْريَّةٌ: تبریز شهری تاریخی است.","pageRef":"صفحه ۱۴۶"},{"type":"note","title":"نکته ترجمه: حروف جر و ربط","body":"«و» را با «و» ترجمه می‌کنیم\n«في» را با «در» و «إلى» را با «به»: ذَهَبْنا إلى تَبْريزَ: به تبریز رفتیم\n«مِنْ» در اضافه را با مضاف‌الیه یا «از»: مَدينَةُ تَبْريز: شهرِ تبریز.","pageRef":"صفحه ۱۴۷"},{"type":"exam","title":"سوال امتحانی: ترجمه جمله را کامل کنید.","body":"جمله: «في تَبْريزَ آثارٌ تاريخيَّةٌ كَثيرَة»\nپاسخ: «در تبریز آثار تاریخی بسیاری است (وجود دارد)»\nقید مکان «في تَبْريزَ» در آغاز ترجمه می‌آید و صفت‌ها پیش از موصوفِ نکره قرار می‌گیرند.","pageRef":"صفحه ۱۵۰"},{"type":"exam","title":"سوال امتحانی: معادل «حَسَنُو الخُلُق» را بنویسید.","body":"پاسخ: «خوش‌اخلاق»\n«حَسَنُو الخُلُقِ» صفت مركب است: صفت «حَسَن» و مضاف‌الیه «الخُلُق» که در فارسی یک واژه می‌شود\nمثال دیگر: حَسَنُ الوَجْه: خوش‌رو.","pageRef":"صفحه ۱۵۱"}]},{"number":12,"title":"نَصائِحٌ قَبْلَ الاِمْتِحان","pages":"۱۶۱ تا ۱۷۶","contents":[{"type":"answer","title":"تمرین درس دوازدهم: ترجمه جمله‌های متن","body":"نَظِّمْ وَقْتَكَ قَبْلَ الاِمْتِحانِ: پیش از امتحان وقتت را نظم بده\nلا تَنْسَ النَّوْمَ الكافِيَ: خواب کافی را فراموش نکن\nتَوَكَّلْ عَلى اللهِ: بر خدا توکل کن\nراجِعِ الدُّروسَ كُلَّ يَوْمٍ: هر روز درس‌ها را مرور کن.","pageRef":"صفحه ۱۶۲"},{"type":"answer","title":"تمرین درس دوازدهم: مرور قواعد با مثال","body":"قَرَأْتُ (ماضی معتل): خواندم\nلَنْ أَيْأَسَ (مضارع منقول): هرگز ناامید نمی‌شوم\nأَفْضَلُ (اسم تفضیل): بهتر\nإنَّ الحُرِّيَّةَ كَنْزٌ (حرف مشبهه): همانا آزادی گنج است\nلا تَخَفْ (نهی): نترس.","pageRef":"صفحه ۱۶۵"},{"type":"note","title":"نکته: جمع‌بندی قواعد پایه نهم","body":"قواعد اصلی نهم: معتل، مضارع منقول، اسم تفضیل، حروف مشبهه، صفت و موصوف، حال، مستثنی، نهی، اعداد و نکات ترجمه\nبرای امتحان، از هر قاعده یک مثال حفظ کنیم و معادل‌های ترجمه مثل «إلّا: جز» را مرور کنیم.","pageRef":"صفحه ۱۶۵"},{"type":"note","title":"نکته: نکات ترجمه برای امتحان","body":"۱) «لنْ» را با «هرگز نمی» ترجمه کنیم\n۲) «ليتَ» را با «ای کاش»\n۳) «إلّا» را با «جز»\n۴) اسم تفضیل را با «تر» یا «ترین»\n۵) حال را با قید یا صفت\nدرس پایانی همه نکات ترجمه سال را جمع‌بندی می‌کند.","pageRef":"صفحه ۱۶۶"},{"type":"exam","title":"سوال امتحانی: قاعده هر جمله را نام ببرید.","body":"جمله‌ها: «ما جاءَ أحَدٌ إلّا سَعِيداً» و «كأنَّ العِلْمَ بَحْرٌ»\nپاسخ: جمله اول «مستثنی» است؛ أحَدٌ شبه‌کلی و سَعِيداً منصوب\nجمله دوم «حرف مشبهه» دارد؛ كأنَّ اسم را منصوب و خبر را مرفوع می‌کند: گویی علم دریاست.","pageRef":"صفحه ۱۷۲"},{"type":"exam","title":"سوال امتحانی: جمله را کامل و ترجمه کنید.","body":"جمله: «العِلْمُ ......... مِنَ المالِ (بهتر)»\nپاسخ: «العِلْمُ أَفْضَلُ مِنَ المالِ» یعنی «علم بهتر از مال است»\nاسم تفضیل بر وزن «أَفْعَل» ساخته می‌شود و پس از آن حرف جر «مِنْ» به معنای «از» می‌آید.","pageRef":"صفحه ۱۷۳"}]}]},{"title":"زبان انگلیسی نهم","subject":"زبان انگلیسی","description":"مکالمه‌ها، نکات گرامر و سوالات امتحانی همه درس‌های کتاب زبان انگلیسی نهم","color":"pink","icon":"message","chapters":[{"number":1,"title":"Personality","pages":"۲ تا ۱۵","contents":[{"type":"answer","title":"مکالمه درس اول (Conversation)","body":"Ali: Who's that boy over there?\nReza: That's Mahdi. He's my classmate.\nAli: What's he like?\nReza: He's kind and helpful. He's also very clever.\nترجمه:\nعلی: اون پسر اون‌جا کیه؟\nرضا: مهدیه، همکلاسی‌مه.\nعلی: چه اخلاقی داره؟\nرضا: مهربان و چاکره؛ خیلی هم باهوشه.","pageRef":"صفحه ۴"},{"type":"answer","title":"تمرین صحبت کردن: توصیف شخصیت (Speaking)","body":"Sample answers:\nMy best friend is generous. He always shares his things with me.\nMy sister is a little shy, but she is very patient.\nترجمه:\nبهترین دوستم بخشنده است. همیشه وسایلش را با من قسمت می‌کند.\nخواهرم کمی خجالتی است، اما خیلی صبور است.","pageRef":"صفحه ۹"},{"type":"note","title":"صفت‌های شخصیت (Personality adjectives)","body":"واژه‌های مهم: kind مهربان، generous بخشنده، honest صادق، hardworking سخت‌کوش، lazy تنبل، clever باهوش، patient صبور، talkative پرحرف.\nمثال: My teacher is kind and patient.\nترجمه: معلم من مهربان و صبور است."},{"type":"note","title":"پرسش درباره شخصیت با What is he like?","body":"برای پرسیدن اخلاق و شخصیت افراد از ساختار What + is/are + فاعل + like? استفاده می‌کنیم و پاسخ با صفت می‌دهیم.\nمثال: What is your brother like? He is honest and friendly.\nترجمه: برادرت چه‌طور آدمی است؟ صادق و خودمونی است.\nتوجه: What does he look like? درباره ظاهر می‌پرسد."},{"type":"exam","title":"جاهای خالی را با صفت مناسب پر کنید","body":"سوال: با صفت‌های (kind, lazy, honest, clever) جاهای خالی را پر کنید.\n۱) An ……… person never tells lies.\n۲) My brother doesn't like to work. He is ……… .\nپاسخ: ۱) honest؛ صادق هرگز دروغ نمی‌گوید. ۲) lazy؛ برادرم دوست ندارد کار کند، پس تنبل است.\nصفت‌ها کیفیت افراد را توصیف می‌کنند."},{"type":"exam","title":"مرتب کردن مکالمه (ویژه امتحان)","body":"سوال: جمله‌های مکالمه را مرتب کنید.\n۱) He is really generous.\n۲) What is your uncle like?\nپاسخ: ترتیب صحیح ۲ سپس ۱ است؛ ابتدا با What is … like? سوال می‌پرسیم و سپس با صفت پاسخ می‌دهیم.\nترجمه: عمویت چه‌طور آدمی است؟ او واقعاً بخشنده است."}]},{"number":2,"title":"Travel","pages":"۱۶ تا ۲۹","contents":[{"type":"answer","title":"مکالمه درس دوم (Conversation)","body":"Sara: What are you going to do this summer?\nMina: I'm going to travel to Mashhad with my family.\nSara: How are you going to travel?\nMina: By train. It's cheaper than the plane.\nترجمه:\nسارا: این تابستان قراره چیکار کنی؟\nمینا: می‌خوام با خانواده‌ام به مشهد سفر کنم.\nسارا: با چی سفر می‌کنی؟\nمینا: با قطار. از هواپیما ارزون‌تره.","pageRef":"صفحه ۱۸"},{"type":"answer","title":"تمرین گفتار: برنامه سفر (Speaking)","body":"Sample answers:\nI'm going to visit the holy shrine there.\nWe're going to stay at a hotel near the park.\nI'm going to take a lot of photos.\nترجمه:\nقراره اون‌جا حرم مطهر رو زیارت کنم.\nمی‌خوایم تو هتلی نزدیک پارک بمونیم.\nقراره عکس‌های زیادی بگیرم.","pageRef":"صفحه ۲۲"},{"type":"note","title":"آینده با ساختار be going to","body":"برای بیان برنامه و نقشه آینده از فعل to be + going to + فعل ساده استفاده می‌کنیم.\nمثال: I am going to travel. She is going to stay at a hotel.\nترجمه: می‌خواهم سفر کنم. او می‌خواهد در هتل بماند.\nمنفی: They aren't going to fly.\nترجمه: آن‌ها قرار نیست با هواپیما بروند."},{"type":"note","title":"واژگان سفر (Travel words)","body":"واژه‌های مهم: ticket بلیت، luggage چمدان‌ها، airport فرودگاه، passenger مسافر، stay اقامت کردن، visit دیدن کردن.\nمثال: Don't forget your ticket and luggage.\nترجمه: بلیت و چمدانت را فراموش نکن."},{"type":"exam","title":"سوال امتحانی: کامل کردن جمله با going to","body":"سوال: شکل صحیح فعل داخل پرانتز را بنویسید.\nWe ……… (visit) Isfahan next week.\nپاسخ: are going to visit؛ چون going to برای برنامه آینده است و فعل to be برای فاعل We می‌شود are.\nترجمه: هفته آینده قرار است اصفهان را ببینیم."},{"type":"exam","title":"سوال امتحانی: مرتب کردن کلمات","body":"سوال: کلمات به‌هم‌ریخته را مرتب کنید.\ngoing to / She / stay / is / at a hotel\nپاسخ: She is going to stay at a hotel.\nترجمه: او می‌خواهد در هتل اقامت کند.\nنکته: فعل to be قبل از going to و فعل اصلی بعد از آن می‌آید."}]},{"number":3,"title":"Festivals and Ceremonies","pages":"۳۰ تا ۴۳","contents":[{"type":"answer","title":"مکالمه درس سوم (Conversation)","body":"Tom: Do you have special holidays in Iran?\nAli: Yes, we celebrate Nowruz in spring.\nTom: What do people do?\nAli: They clean their houses and visit relatives.\nترجمه:\nتام: عید خاصی دارید؟\nعلی: بله، در بهار نوروز را جشن می‌گیریم.\nتام: مردم چیکار می‌کنند؟\nعلی: خانه‌هایشان را تمیز می‌کنند و به دیدن فامیل می‌روند.","pageRef":"صفحه ۳۲"},{"type":"answer","title":"تمرین گفتار: عید ما (Speaking)","body":"Sample answers:\nWe give and receive gifts at Nowruz.\nMy grandmother cooks special sweets for the guests.\nChildren get Eidi from their elders.\nترجمه:\nدر نوروز هدیه می‌دهیم و می‌گیریم.\nمادربزرگم برای مهمان‌ها شیرینی مخصوص می‌پزد.\nبچه‌ها از بزرگ‌ترها عیدی می‌گیرند.","pageRef":"صفحه ۳۶"},{"type":"note","title":"واژگان جشن‌ها و مراسم","body":"واژه‌های مهم: celebrate جشن گرفتن، ceremony مراسم، guest مهمان، gift هدیه، custom رسم، holiday تعطیلات.\nمثال: We celebrate this ceremony every year.\nترجمه: هر سال این مراسم را جشن می‌گیریم."},{"type":"note","title":"حال ساده و قیدهای تکرار برای رسم‌ها","body":"برای توصیف رسم‌ها و آیین‌ها از حال ساده با قیدهای تکرار (always, usually, sometimes) استفاده می‌کنیم.\nمثال: People usually visit their relatives at Nowruz.\nترجمه: مردم معمولاً در نوروز به دیدن فامیل می‌روند.\nمثال: We always set the haft sin table.\nترجمه: همیشه سفره هفت سین می‌چینیم."},{"type":"exam","title":"سوال امتحانی: انتخاب قید تکرار","body":"سوال: با قید مناسب (always / usually / never) جمله را کامل کنید.\nMy father ……… goes to work by bus. It is his habit.\nپاسخ: usually؛ چون عادت رایج اما نه همیشگی است. always یعنی همیشه و never یعنی هرگز و با جمله همخوانی ندارد.\nترجمه: پدرم معمولاً با اتوبوس سر کار می‌رود."},{"type":"exam","title":"سوال امتحانی: پاسخ کوتاه با do و does","body":"سوال: پاسخ کوتاه بدهید.\nDo people celebrate Yalda in Iran? (Yes)\nDoes she set the table? (No)\nپاسخ: Yes, they do. / No, she doesn't.\nترجمه: بله، جشن می‌گیرند. / خیر، نمی‌چیند.\nدر پاسخ کوتاه به‌جای فعل اصلی از do یا does استفاده می‌شود."}]},{"number":4,"title":"Health","pages":"۴۴ تا ۵۷","contents":[{"type":"answer","title":"مکالمه درس چهارم: مطب دکتر (Conversation)","body":"Doctor: What's the matter?\nSara: I have a headache and a sore throat.\nDoctor: You should stay at home and rest.\nSara: Should I take any medicine?\nترجمه:\nدکتر: چیزی شده؟\nسارا: سردرد و گلودرد دارم.\nدکتر: باید خانه بمانی و استراحت کنی.\nسارا: باید دارویی مصرف کنم؟","pageRef":"صفحه ۴۶"},{"type":"answer","title":"تمرین گفتار: توصیه‌های سلامتی (Speaking)","body":"Sample answers:\nYou should wash your hands before eating.\nYou shouldn't drink cold water when you are sick.\nYou should exercise every day.\nترجمه:\nقبل از غذا باید دست‌هایت را بشویی.\nوقتی مریضی نباید آب سرد بخوری.\nهر روز باید ورزش کنی.","pageRef":"صفحه ۵۰"},{"type":"note","title":"should و shouldn't برای توصیه","body":"should برای دادن توصیه به‌کار می‌رود و بعد از آن فعل ساده می‌آید.\nمثال: You should rest.\nترجمه: باید استراحت کنی.\nمنفی: You shouldn't eat too much sugar.\nترجمه: نباید شکر زیادی بخوری.\nپرسشی: Should I see a doctor?"},{"type":"note","title":"واژگان سلامتی و بیماری‌ها","body":"واژه‌های مهم: headache سردرد، sore throat گلودرد، fever تب، toothache دندان‌درد، rest استراحت کردن، medicine دارو.\nمثال: I have a fever, so I can't go to school.\nترجمه: تب دارم، پس نمی‌توانم به مدرسه بروم."},{"type":"exam","title":"سوال امتحانی: انتخاب should یا shouldn't","body":"سوال: گزینه صحیح را انتخاب کنید.\nHe is very fat. He ……… (should / shouldn't) eat a lot of sweets.\nپاسخ: shouldn't؛ چون توصیه برای پرهیز از کاری است. should برای کاری که انجام دادنش خوب است به‌کار می‌رود.\nترجمه: او خیلی چاق است؛ نباید شیرینی زیادی بخورد."},{"type":"exam","title":"سوال امتحانی: مرتب کردن جمله توصیه‌ای","body":"سوال: کلمات به‌هم‌ریخته را مرتب کنید.\nshould / You / water / more / drink\nپاسخ: You should drink more water.\nترجمه: باید آب بیشتری بنوشی.\nنکته: بعد از should همیشه فعل ساده می‌آید و ترتیب فاعل، should، فعل و مفعول رعایت می‌شود."}]},{"number":5,"title":"Services","pages":"۵۸ تا ۷۱","contents":[{"type":"answer","title":"مکالمه درس پنجم: دفتر پستی (Conversation)","body":"Clerk: Good morning. Can I help you?\nAli: Yes, I'd like to send this letter to London.\nClerk: Sure. Anything else?\nAli: Yes, I need some stamps, please.\nترجمه:\nمنشی: صبح بخیر. کمکی کنم؟\nعلی: بله، می‌خواهم این نامه را به لندن بفرستم.\nمنشی: حتماً. چیز دیگری؟\nعلی: بله، چند تمبر می‌خواهم.","pageRef":"صفحه ۶۰"},{"type":"answer","title":"تمرین گفتار: درخواست مؤدبانه (Speaking)","body":"Sample answers:\nWould you open the window, please?\nCould I use your phone, please?\nI'd like to open a bank account.\nترجمه:\nلطفاً پنجره را باز می‌کنید؟\nمی‌توانم از تلفن شما استفاده کنم؟\nمی‌خواهم یک حساب بانکی باز کنم.","pageRef":"صفحه ۶۴"},{"type":"note","title":"درخواست مؤدبانه با Would you و Could I","body":"برای درخواست مؤدبانه از Would you + فعل و برای گرفتن اجازه از Could I + فعل استفاده می‌کنیم.\nمثال: Would you help me, please? Could I sit here?\nترجمه: لطفاً کمکم می‌کنید؟ می‌توانم اینجا بنشینم؟\nپاسخ مؤدبانه: Sure. Of course."},{"type":"note","title":"واژگان خدمات (Services words)","body":"واژه‌های مهم: post office دفتر پستی، bank بانک، send فرستادن، receive دریافت کردن، account حساب، bill قبض.\nمثال: You can pay your bill at the bank.\nترجمه: می‌توانی قبضت را در بانک پرداخت کنی."},{"type":"exam","title":"سوال امتحانی: کامل کردن مکالمه خدمات","body":"سوال: مکالمه را کامل کنید.\nA: ……… I help you?\nB: Yes, ……… like to send a package.\nپاسخ: Can یا may برای A و I would یا I'd برای B.\nترجمه: کمکی کنم؟ بله، می‌خواهم یک بسته بفرستم.\nعبارت I'd like to درخواست مؤدبانه است."},{"type":"exam","title":"سوال امتحانی: would like و like","body":"سوال: گزینه صحیح را انتخاب کنید.\nWould you like ……… (to drink / drinking) some tea?\nپاسخ: to drink؛ بعد از would like مصدر با to می‌آید، اما بعد از like فعل با ing می‌آید.\nترجمه: مایلید کمی چای بنوشید؟\nمقایسه: I like drinking tea یعنی نوشیدن چای را دوست دارم."}]},{"number":6,"title":"Skills","pages":"۷۲ تا ۸۵","contents":[{"type":"answer","title":"مکالمه درس ششم (Conversation)","body":"Sara: Can you play a musical instrument?\nMina: Yes, I can play the piano. I'm also good at painting.\nSara: Who taught you?\nMina: My mother. She's a music teacher.\nترجمه:\nسارا: می‌توانی سازی بنوازی؟\nمینا: آره، پیانو می‌زنم. در نقاشی هم خوبم.\nسارا: چه کسی بهت یاد داده؟\nمینا: مامانم. او معلم موسیقی است.","pageRef":"صفحه ۷۴"},{"type":"answer","title":"تمرین گفتار: مهارت‌های من (Speaking)","body":"Sample answers:\nI can swim very well.\nI'm good at cooking, but I can't drive.\nMy brother is interested in photography.\nترجمه:\nمن خیلی خوب شنا می‌کنم.\nدر آشپزی خوبم، اما رانندگی بلد نیستم.\nبرادرم به عکاسی علاقه‌مند است.","pageRef":"صفحه ۷۸"},{"type":"note","title":"can و can't برای توانایی","body":"can برای بیان توانایی به‌کار می‌رود و بعد از آن فعل ساده می‌آید.\nمثال: She can sing very well.\nترجمه: او خیلی خوب آواز می‌خواند.\nمنفی: I can't dance at all.\nترجمه: من اصلاً بلد نیستم برقصم.\nپرسشی: Can you ride a bike? پاسخ کوتاه: Yes, I can."},{"type":"note","title":"عبارت‌های be good at و be interested in","body":"بعد از be good at و be interested in اگر فعل بیاید، شکل آن ing می‌گیرد.\nمثال: I'm good at drawing. He is interested in reading.\nترجمه: من در نقاشی خوبم. او به خواندن علاقه‌مند است.\nنکته: اسم ساده هم می‌آید: She is good at math."},{"type":"exam","title":"سوال امتحانی: شکل درست فعل بعد از حرف اضافه","body":"سوال: شکل صحیح فعل داخل پرانتز را بنویسید.\nMy sister is good at ……… (play) the setar.\nپاسخ: playing؛ بعد از حرف اضافه at فعل شکل ing می‌گیرد.\nترجمه: خواهرم در نواختن سه‌تار خوب است.\nیادآوری: بعد از حروف اضافه‌ای مانند at و in فعل همیشه شکل ing می‌گیرد."},{"type":"exam","title":"سوال امتحانی: پاسخ کوتاه با can","body":"سوال: با توجه به پرانتز پاسخ کوتاه بدهید.\nCan you speak English? (Yes)\nCan he drive a car? (No)\nپاسخ: Yes, I can. / No, he can't.\nترجمه: بله، می‌توانم. / خیر، نمی‌تواند.\nدر پاسخ کوتاه فعل اصلی تکرار نمی‌شود و فقط can می‌آید."}]},{"number":7,"title":"The Way of Life","pages":"۸۶ تا ۹۹","contents":[{"type":"answer","title":"مکالمه درس هفتم: زندگی گذشته (Conversation)","body":"Grandpa: Life was different when I was young.\nAli: What do you mean?\nGrandpa: People used to cook with wood fire. We didn't have gas.\nAli: Did you use to have a telephone?\nترجمه:\nپدربزرگ: وقتی جوان بودم زندگی فرق داشت.\nعلی: منظورتان چیست؟\nپدربزرگ: مردم با هیزم آشپزی می‌کردند. گاز نداشتیم.\nعلی: تلفن داشتید؟","pageRef":"صفحه ۸۸"},{"type":"answer","title":"تمرین گفتار: مقایسه گذشته و امروز (Speaking)","body":"Sample answers:\nPeople used to write letters, but now they send emails.\nMy grandfather used to walk to school.\nWe didn't use to have smartphones.\nترجمه:\nمردم نامه می‌نوشتند، اما حالا ایمیل می‌فرستند.\nپدربزرگم پیاده به مدرسه می‌رفت.\nقبلاً گوشی هوشمند نداشتیم.","pageRef":"صفحه ۹۲"},{"type":"note","title":"ساختار used to برای عادت‌های گذشته","body":"used to + فعل ساده یعنی کاری که در گذشته عادت بود و حالا نیست.\nمثال: People used to travel by horse.\nترجمه: مردم به سفر با اسب عادت داشتند.\nمنفی: didn't use to و پرسشی: Did you use to live here?\nترجمه: قبلاً اینجا زندگی می‌کردید؟"},{"type":"note","title":"واژگان سبک زندگی (Way of Life words)","body":"واژه‌های مهم: lifestyle سبک زندگی، habit عادت، change تغییر کردن، candle شمع، traditional سنتی، firewood هیزم.\nمثال: Our lifestyle has changed a lot.\nترجمه: سبک زندگی ما خیلی تغییر کرده است.\nمثال: In the past, people studied by candlelight.\nترجمه: در گذشته مردم با نور شمع درس می‌خواندند."},{"type":"exam","title":"سوال امتحانی: جای خالی با used to","body":"سوال: جمله را با used to کامل کنید.\nMy grandmother ……… (tell) us stories every night.\nپاسخ: used to tell؛ چون عادت تکراری در گذشته است.\nترجمه: مادربزرگم هر شب برایمان قصه می‌گفت.\nنکته: بعد از used to همیشه فعل ساده می‌آید."},{"type":"exam","title":"سوال امتحانی: منفی و پرسشی کردن used to","body":"سوال: جمله زیر را منفی و پرسشی کنید.\nThey used to live in a village.\nپاسخ منفی: They didn't use to live in a village.\nپاسخ پرسشی: Did they use to live in a village?\nترجمه: آن‌ها در روستا زندگی نمی‌کردند. آیا در روستا زندگی می‌کردند؟\nدر حالت منفی و پرسشی، d از use حذف می‌شود."}]},{"number":8,"title":"Media","pages":"۱۰۰ تا ۱۱۳","contents":[{"type":"answer","title":"مکالمه درس هشتم (Conversation)","body":"Reza: How many hours a day do you watch TV?\nHamed: About two hours. What about you?\nReza: Not much. I use the Internet more.\nHamed: What do you do online?\nترجمه:\nرضا: روزی چند ساعت تلویزیون می‌بینی؟\nحامد: حدود دو ساعت. تو چطور؟\nرضا: زیاد نمی‌بینم. بیشتر از اینترنت استفاده می‌کنم.\nحامد: آنلاین چیکار می‌کنی؟","pageRef":"صفحه ۱۰۲"},{"type":"answer","title":"تمرین گفتار: برنامه‌های مورد علاقه (Speaking)","body":"Sample answers:\nMy favorite TV program is a science show.\nI usually read the news on my phone.\nI think the Internet is more useful than TV.\nترجمه:\nبرنامه مورد علاقه من برنامه علمی است.\nمعمولاً اخبار را با گوشی می‌خوانم.\nفکر می‌کنم اینترنت از تلویزیون مفیدتر است.","pageRef":"صفحه ۱۰۶"},{"type":"note","title":"صفت تفضیلی با than","body":"برای مقایسه دو چیز از صفت تفضیلی + than استفاده می‌کنیم. صفات کوتاه پسوند er می‌گیرند: fast می‌شود faster. صفات بلند با more ساخته می‌شوند: useful می‌شود more useful.\nمثال: The Internet is faster than radio.\nترجمه: اینترنت از رادیو سریع‌تر است."},{"type":"note","title":"واژگان رسانه‌ها (Media words)","body":"واژه‌های مهم: media رسانه، news اخبار، program برنامه، channel شبکه، online آنلاین، useful مفید.\nمثال: This channel has interesting programs for children.\nترجمه: این شبکه برنامه‌های جالبی برای بچه‌ها دارد."},{"type":"exam","title":"سوال امتحانی: ساخت صفت تفضیلی","body":"سوال: شکل تفضیلی صفت‌های زیر را بنویسید.\neasy / important / big\nپاسخ: easier، more important، bigger.\nتوضیح: صفات کوتاه er می‌گیرند؛ در easy حرف y به i تبدیل می‌شود و در big حرف آخر تکرار می‌شود.\nترجمه: آسان‌تر، مهم‌تر، بزرگ‌تر."},{"type":"exam","title":"سوال امتحانی: ساختن جمله مقایسه‌ای","body":"سوال: با کلمات به‌هم‌ریخته جمله بسازید.\nTV / than / newspapers / older / are\nپاسخ: Newspapers are older than TV.\nترجمه: روزنامه‌ها از تلویزیون قدیمی‌ترند.\nنکته: بعد از صفت تفضیلی حرف اضافه than می‌آید و صفت بعد از فعل to be قرار می‌گیرد."}]},{"number":9,"title":"Appearance","pages":"۱۱۴ تا ۱۲۷","contents":[{"type":"answer","title":"مکالمه درس نهم: خرید لباس (Conversation)","body":"Salesman: Good afternoon. Can I help you?\nBoy: Yes, I'm looking for a shirt.\nSalesman: What color would you like?\nBoy: Blue, please. How much is it?\nترجمه:\nفروشنده: عصر بخیر. کمکی کنم؟\nپسر: بله، دنبال یک پیراهن هستم.\nفروشنده: چه رنگی می‌خواهی؟\nپسر: آبی، لطفاً. قیمتش چند است؟","pageRef":"صفحه ۱۱۶"},{"type":"answer","title":"تمرین گفتار: توصیف ظاهر (Speaking)","body":"Sample answers:\nMy friend has short black hair and brown eyes.\nHe is tall and a little thin.\nShe always wears beautiful scarves.\nترجمه:\nدوست من موهای کوتاه سیاه و چشمان قهوه‌ای دارد.\nاو قدبلند و کمی لاغر است.\nاو همیشه شال‌های قشنگی می‌پوشد.","pageRef":"صفحه ۱۲۰"},{"type":"note","title":"ترتیب صفت‌ها قبل از اسم","body":"وقتی چند صفت قبل از اسم می‌آیند، ترتیب معمول این‌گونه است: نظر، اندازه، رنگ.\nمثال: a nice big blue bag\nترجمه: یک کیف آبی بزرگ و قشنگ.\nمثال: She has long beautiful hair.\nترجمه: او موهای بلند و زیبایی دارد."},{"type":"note","title":"واژگان ظاهر (Appearance words)","body":"واژه‌های مهم: tall قدبلند، short کوتاه قد، thin لاغر، fat چاق، young جوان، old پیر، hair مو، eyes چشم‌ها، wear پوشیدن.\nمثال: What does your father look like?\nترجمه: پدرت چه شکلی است؟"},{"type":"exam","title":"سوال امتحانی: تفاوت look like و like","body":"سوال: پاسخ مناسب را انتخاب کنید.\nWhat does she look like?\n۱) She is kind. ۲) She is tall with curly hair.\nپاسخ: گزینه ۲؛ چون look like درباره ظاهر می‌پرسد و What is she like? درباره شخصیت.\nترجمه: چه شکلی است؟ قدبلند است با موهای فر."},{"type":"exam","title":"سوال امتحانی: مرتب کردن صفات","body":"سوال: صفات را با ترتیب درست قبل از اسم بچینید.\n(blue / small / nice) a ……… box\nپاسخ: a nice small blue box؛ ترتیب: نظر nice، اندازه small، رنگ blue.\nترجمه: یک جعبه آبی کوچک و قشنگ.\nرعایت ترتیب صفات در امتحان نمره دارد."}]},{"number":10,"title":"Climate","pages":"۱۲۸ تا ۱۴۱","contents":[{"type":"answer","title":"مکالمه درس دهم (Conversation)","body":"Mina: What's the weather like in your city?\nSara: It's hot and dry in summer and cold in winter.\nMina: Does it rain much there?\nSara: No, it's sunny most of the time.\nترجمه:\nمینا: هوای شهر شما چطور است؟\nسارا: تابستان‌ها گرم و خشک و زمستان‌ها سرد است.\nمینا: آنجا باران زیاد می‌بارد؟\nسارا: نه، بیشتر وقت‌ها آفتابی است.","pageRef":"صفحه ۱۳۰"},{"type":"answer","title":"تمرین گفتار: هوای شهرها (Speaking)","body":"Sample answers:\nIn Bandar Abbas it is hotter than in Tehran.\nSpring is the best season in Shiraz.\nIt snows a lot in Ardabil in winter.\nترجمه:\nدر بندرعباس هوا از تهران گرم‌تر است.\nبهار بهترین فصل شیراز است.\nدر اردبیل زمستان‌ها برف زیادی می‌بارد.","pageRef":"صفحه ۱۳۴"},{"type":"note","title":"صفت عالی (برترین)","body":"برای مقایسه بیش از دو چیز از صفت عالی استفاده می‌کنیم: the + صفت + est برای صفات کوتاه و the most + صفت برای صفات بلند.\nمثال: Summer is the hottest season.\nترجمه: تابستان گرم‌ترین فصل است.\nمثال: This is the most beautiful city.\nترجمه: این زیباترین شهر است."},{"type":"note","title":"واژگان آب و هوا (Weather words)","body":"واژه‌های مهم: weather هوا، climate آب و هوا، sunny آفتابی، rainy بارانی، snowy برفی، cloudy ابری، windy بادی، dry خشک، wet مرطوب.\nمثال: What's the weather like today? It's cloudy.\nترجمه: امروز هوا چطور است؟ ابری است."},{"type":"exam","title":"سوال امتحانی: ساخت صفت عالی","body":"سوال: شکل عالی صفت‌های زیر را بنویسید.\nhot / cold / interesting\nپاسخ: the hottest، the coldest، the most interesting.\nتوضیح: در hot حرف آخر تکرار می‌شود؛ صفات کوتاه est می‌گیرند و صفات بلند با the most ساخته می‌شوند.\nترجمه: گرم‌ترین، سردترین، جالب‌ترین."},{"type":"exam","title":"سوال امتحانی: تفضیلی یا عالی؟","body":"سوال: شکل صحیح صفت داخل پرانتز را بنویسید.\n۱) Winter is ……… (cold) than autumn.\n۲) Tabriz is ……… (cold) city in Iran.\nپاسخ: ۱) colder؛ مقایسه دو چیز. ۲) the coldest؛ مقایسه یک چیز با همه شهرها.\nترجمه: زمستان از پاییز سردتر است. تبریز سردترین شهر ایران است."}]},{"number":11,"title":"Inventions","pages":"۱۴۲ تا ۱۵۵","contents":[{"type":"answer","title":"مکالمه درس یازدهم (Conversation)","body":"Ali: What's the most important invention?\nReza: I think it's the Internet. What about you?\nAli: I think it's the car.\nReza: True. It changed life a lot.\nترجمه:\nعلی: مهم‌ترین اختراع چیست؟\nرضا: به نظرم اینترنت است. تو چی؟\nعلی: به نظرم خودرو.\nرضا: درست است. خیلی زندگی را تغییر داد.","pageRef":"صفحه ۱۴۴"},{"type":"answer","title":"تمرین گفتار: اختراع‌های مهم (Speaking)","body":"Sample answers:\nThe telephone is one of the most useful inventions.\nPeople used to wait weeks for a letter.\nNow we can talk to anyone in seconds.\nترجمه:\nتلفن یکی از مفیدترین اختراع‌هاست.\nمردم قبلاً هفته‌ها منتظر نامه می‌ماندند.\nحالا می‌توانیم در چند ثانیه با هر کسی حرف بزنیم.","pageRef":"صفحه ۱۴۸"},{"type":"note","title":"جمله مجهول (Passive) با be و قسمت سوم فعل","body":"در جملات مجهول، انجام‌دهنده کار مهم نیست: فعل to be + قسمت سوم فعل.\nمثال: The telephone was invented by Graham Bell.\nترجمه: تلفن توسط گراهام بل اختراع شد.\nمثال: Many cars are made in Iran.\nترجمه: خودروهای زیادی در ایران ساخته می‌شوند."},{"type":"note","title":"واژگان اختراعات (Inventions words)","body":"واژه‌های مهم: invention اختراع، invent اختراع کردن، discover کشف کردن، machine ماشین، scientist دانشمند، develop توسعه دادن.\nمثال: Scientists develop new machines every year.\nترجمه: دانشمندان هر سال ماشین‌های جدیدی می‌سازند."},{"type":"exam","title":"سوال امتحانی: کامل کردن جمله مجهول","body":"سوال: جمله مجهول را کامل کنید.\nThe light bulb ……… (invent) by Edison in ۱۸۷۹.\nپاسخ: was invented؛ فاعل مفرد است و رویداد در گذشته رخ داده، پس was + قسمت سوم فعل می‌آید.\nترجمه: لامپ در سال ۱۸۷۹ توسط ادیسون اختراع شد."},{"type":"exam","title":"سوال امتحانی: درک مفهوم جمله","body":"سوال: کدام گزینه با جمله همخوان است؟\nThe wheel is one of the oldest inventions.\nالف) چرخ یکی از قدیمی‌ترین اختراعات است.\nب) چرخ قدیمی‌ترین ماشین است.\nپاسخ: گزینه الف؛ one of the oldest یعنی یکی از قدیمی‌ترین‌ها، نه برترین مطلق."}]},{"number":12,"title":"Review","pages":"۱۵۶ تا ۱۷۸","contents":[{"type":"answer","title":"مرور مکالمه‌های کتاب (Conversation Review)","body":"Sample answer:\nA: What's your new friend like?\nB: He's clever and generous.\nA: Where is he going to travel?\nB: He's going to visit Yazd.\nترجمه:\nدوست جدیدت چه‌طور آدمی است؟ باهوش و بخشنده است.\nکجا می‌خواهد سفر کند؟ می‌خواهد یزد را ببیند.","pageRef":"صفحه ۱۵۸"},{"type":"answer","title":"تمرین مرور گرامر (Grammar Review)","body":"Sample answers:\nYou should sleep early. (درس ۴)\nI can play football well. (درس ۶)\nPeople used to cook with wood. (درس ۷)\nترجمه:\nباید زود بخوابی.\nمن خوب فوتبال بازی می‌کنم.\nمردم قبلاً با هیزم آشپزی می‌کردند.","pageRef":"صفحه ۱۶۶"},{"type":"note","title":"جمع‌بندی گرامر نیم‌سال اول","body":"نکات کلیدی: be going to برای برنامه آینده، should برای توصیه، can برای توانایی، used to برای عادت گذشته.\nمثال: I'm going to study tonight.\nترجمه: امشب می‌خواهم درس بخوانم.\nاین ساختارها پرتکرارترین نکات امتحان‌های زبان نهم هستند."},{"type":"note","title":"جمع‌بندی گرامر نیم‌سال دوم","body":"نکات کلیدی: صفت تفضیلی با than، صفت عالی با the، جمله مجهول با فعل to be و قسمت سوم فعل، ترتیب صفات قبل از اسم.\nمثال: This book is more interesting than that one.\nترجمه: این کتاب از آن یکی جالب‌تر است."},{"type":"exam","title":"سوال امتحانی جامع: شکل صحیح فعل‌ها","body":"سوال: شکل صحیح فعل‌ها را بنویسید.\n۱) We ……… (go) to travel tomorrow.\n۲) You ……… drink more water. (توصیه)\nپاسخ: ۱) are going to go ۲) should.\nترجمه: فردا می‌خواهیم برویم. باید آب بیشتری بنوشی.\nاین نوع سوال در امتحان پایان سال زیاد می‌آید."},{"type":"exam","title":"سوال امتحانی جامع: ترجمه و نوع جمله","body":"سوال: جمله زیر را ترجمه کنید و نوع آن را بنویسید.\nEnglish is spoken all over the world.\nپاسخ: انگلیسی در سراسر دنیا صحبت می‌شود؛ جمله مجهول است چون فاعل خودش کار را انجام نمی‌دهد، بلکه روی آن کار انجام می‌شود."}]}]},{"title":"پیام‌های آسمان نهم","subject":"پیام‌های آسمان","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب پیام‌های آسمان نهم","color":"amber","icon":"sparkles","chapters":[{"number":1,"title":"خورشید پنهان","pages":"۸ تا ۲۰","contents":[{"type":"answer","title":"توکل به خدا یعنی چه؟","body":"توکل یعنی اعتماد و تکیه بر خداوند. انسان متوکل با همه توان خود تلاش می‌کند و نتیجه را به خدا می‌سپارد؛ زیرا می‌داند خدا مانند خورشید همیشه هست و در پشت ابرهای سختی، کار او را به سامان می‌رساند.","pageRef":"صفحه ۱۰"},{"type":"answer","title":"آیا توکل به معنای بی‌کاری و رها کردن تلاش است؟","body":"خیر؛ توکل به معنای بی‌کاری نیست. اسلام ما را به کار و کوشش فراخوانده است. توکل یعنی پس از تلاش کامل، تکیه بر قدرت بی‌پایان خدا داشته باشیم و دل در گرفتاری‌ها آرام باشد؛ زیرا پایان کار به دست خداست.","pageRef":"صفحه ۱۴"},{"type":"note","title":"خدا همیشه با ماست","body":"خداوند هیچ‌گاه ما را تنها نمی‌گذارد؛ اما ابرهای غفلت و گناه مانند ابر بر آسمان، خورشید را از دیدگان می‌پوشانند. خورشید پنهان می‌شود ولی از بین نمی‌رود؛ کافی است ابرها کنار بروند تا نور خدا را در زندگی دوباره ببینیم."},{"type":"note","title":"آیه توکل","body":"﴿وَ مَنْ يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا﴾\nترجمه: هر کس تقوای خدا پیشه کند، خدا برای او راه بیرون‌شدنی قرار می‌دهد.\nاین آیه بشارت می‌دهد که توکل و پرهیزکاری، راهگشای سخت‌ترین مشکلات زندگی است."},{"type":"exam","title":"رابطه توکل با تلاش را توضیح دهید.","body":"پاسخ تشریحی: توکل با تلاش منافاتی ندارد. مسلمان وظیفه دارد برای رسیدن به هدف، همه تلاش و اسباب خود را به کار گیرد و سپس نتیجه را از خدا بخواهد؛ تلاش ما مانند بذرافشانی است و رویاندن آن به خداست."},{"type":"exam","title":"دو نتیجه توکل بر خدا را بنویسید.","body":"پاسخ تشریحی: نخست آرامش دل در سختی‌ها؛ زیرا انسان می‌داند خدا به کار او رسیدگی می‌کند. دوم امیدواری به آینده؛ متوکل از خدا نمی‌ترسد و می‌داند خدا از راه‌هایی که به فکر ما نمی‌رسد، مشکل را حل می‌فرماید و درها را می‌گشاید."}]},{"number":2,"title":"نردبان آسمان","pages":"۲۱ تا ۳۳","contents":[{"type":"answer","title":"چرا دعا را نردبان آسمان می‌نامند؟","body":"زیرا دعا مانند نردبانی است که انسان را به سوی آسمان و قرب خدا بالا می‌برد. در دعا، بنده با پروردگار سخن می‌گوید، نیاز خود را به او می‌گوید و از او کمک می‌خواهد؛ این گفت‌وگو روح را روشن و رابطه دل با خدا را استوار می‌کند.","pageRef":"صفحه ۲۴"},{"type":"answer","title":"شرط‌های استجابت دعا چیست؟","body":"خداوند همه دعاها را می‌شنود؛ اما اجابت شرط دارد: با حضور قلب و توجه بخوانیم، در کسب خوراک و درآمدمان حلال باشد، آنچه می‌خواهیم برای ما سود داشته باشد و دعا را با جدیت و پایداری بخواهیم، نه با دلِ سست و حواس‌پرت.","pageRef":"صفحه ۲۸"},{"type":"note","title":"دعا، ارتباط با خدا","body":"دعا گفت‌وگوی بنده با خداست و نشان‌دهنده نیاز انسان به پروردگار است. دعا نه‌تنها نیاز ما را برطرف می‌کند، بلکه یاد خدا را در دل زنده می‌دهد، از غرور جلوگیری می‌کند و امید را در زندگی می‌رویاند."},{"type":"note","title":"حدیث درباره دعا","body":"پیامبر اکرم ص فرمود: الدُّعاءُ مُخُّ العِبادَةِ\nترجمه: دعا، مغز و جانِ عبادت است.\nبه همین دلیل دعای کوتاه اما با توجه و حضور دل، برتر از عبادت طولانی بی‌دقت است."},{"type":"exam","title":"سه فایده دعا را بیان کنید.","body":"پاسخ تشریحی: نخست، رابطه انسان با خدا استوار می‌شود؛ دوم، دل به یاد خدا آرام می‌گیرد و اضطراب از میان می‌رود؛ سوم، انسان نیازمندی خود را می‌بیند و از غرور و خودبینی دور می‌ماند و امید را زنده می‌کند."},{"type":"exam","title":"آیا دعایی که به گمان ما اجابت نشد، بی‌جواب مانده است؟ توضیح دهید.","body":"پاسخ تشریحی: خیر؛ خداوند یا خواسته را به موقع می‌دهد، یا اگر برآوردن آن به دین و دنیای ما زیان داشت، آن را نگه می‌دارد و در برابر پاداشی بهتر یا رفع غم و غصه در دنیا و آخرت قرار می‌دهد؛ پس هیچ دعایی بی‌جواب نمی‌ماند."}]},{"number":3,"title":"به سوی پاکی","pages":"۳۴ تا ۴۵","contents":[{"type":"answer","title":"توبه چیست و چه شرایطی دارد؟","body":"توبه یعنی بازگشت از گناه به سوی خدا و پاکی. شرایط آن این است: فوری گناه را رها کنیم، از کرده خود پشیمان شویم، با جدی تصمیم بگیریم دیگر تکرار نکنیم و اگر حق مردم پای در میان است، آن را بازگردانیم و رضایت آنان را بجوئیم.","pageRef":"صفحه ۳۸"},{"type":"answer","title":"چرا هرگز نباید از رحمت خدا ناامید شد؟","body":"زیرا خداوند در قرآن می‌فرماید از رحمت خدا ناامید نشوید؛ او همه گناهان را می‌آمرزد. آدمی تا نفس می‌کشد می‌تواند بازگردد و در روایات آمده است که خداوند از بازگشت بنده توبه‌کار، شادتر از اوست؛ پس درِ خانه خدا همیشه باز است.","pageRef":"صفحه ۴۱"},{"type":"note","title":"توبه، فرصت بازگشت","body":"خدای مهربان درِ خانه‌اش را به روی گناهکاران باز گذاشته است. توبه پیوند دوباره دل با خداست و آثار گناه را پاک می‌کند؛ به شرط آن که صادقانه باشد، پشیمانی واقعی همراه آن باشد و عزمی جدی برای ترک گناه در دل شکل گیرد."},{"type":"note","title":"آیه توبه","body":"﴿إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا﴾\nترجمه: به راستی خداوند همه گناهان را می‌آمرزد.\nاین آیه مایه امید توبه‌کنندگان است و از سوی دیگر، ناامیدی از رحمت خدا را گناهی بزرگ شمرده است."},{"type":"exam","title":"شرایط تحقق توبه را بنویسید.","body":"پاسخ تشریحی: ۱. ترک فوری گناه ۲. پشیمانی قلبی از گذشته ۳. عزم جدی بر تکرار نکردن ۴. جبران حق مردم در صورتی که حق کسی پای در میان باشد. با برقرار بودن این شرایط، توبه پذیرفته می‌شود و انسان مانند روز نخست پاک می‌گردد."},{"type":"exam","title":"توبه نصوح چیست؟","body":"پاسخ تشریحی: توبه صادق و خالص را توبه نصوح می‌گویند؛ توبه‌ای که در آن بنده با تمام وجود از گناه برگردد، قلبش از آثار گناه پاک شود و چنان عزمی داشته باشد که اگر در همان شرایط قرار گرفت، باز هم گناه نکند."}]},{"number":4,"title":"یک فرصت دیگر","pages":"۴۶ تا ۵۷","contents":[{"type":"answer","title":"معاد یعنی بازگشت؛ بازگشت از کجا و به کجا؟","body":"معاد یعنی بازگشت انسان از این دنیا به سوی خدا و زندگی دیگری که پس از مرگ آغاز می‌شود. در آن روز همه انسان‌ها دوباره زنده می‌شوند، کارهای خود را می‌بینند و نیکوکاران و بدکاران به پاداش و کیفر اعمال خود می‌رسند.","pageRef":"صفحه ۵۰"},{"type":"answer","title":"چرا مرگ پایان زندگی نیست؟","body":"زیرا قرآن مرگ را انتقال از این دنیا به دنیای دیگر معرفی می‌کند. روح انسان جاودانه است و با مرگ از بین نمی‌رود؛ همان‌گونه که نوزاد از رحم مادر به خانه‌ای بزرگ‌تر می‌رود، انسان نیز به برزخ و سپس قیامت منتقل می‌شود.","pageRef":"صفحه ۵۲"},{"type":"note","title":"مرگ، پلی به سوی جاودانگی","body":"مرگ نه نابودی، بلکه آغاز مرحله‌ای تازه از زندگی است. دنیا مزرعه آخرت است و انسان هر چه در این مزرعه بکارد، در روز قیامت درو می‌کند؛ پس باید از این فرصت خداداد برای ساختن خانه آخرت بهره بگیریم."},{"type":"note","title":"آیه معاد","body":"﴿كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ثُمَّ إِلَيْنَا تُرْجَعُونَ﴾\nترجمه: هر نفس مرگ را می‌چشد، سپس به سوی ما بازگردانده می‌شوید.\nاین آیه یادآور بازگشت همگانی انسان‌ها به معاد و رسیدگی کامل به اعمال است."},{"type":"exam","title":"اثرهای باور به معاد در زندگی دنیا چیست؟","body":"پاسخ تشریحی: باور به معاد انگیزه کار نیک می‌دهد، مانع ظلم و خیانت می‌شود، در سختی‌ها امید می‌آفریند و معنای زندگی را روشن می‌کند؛ زیرا هیچ زحمت و نیکی‌ای بی‌پاداش و هیچ ستمی بی‌کیفر نمی‌ماند."},{"type":"exam","title":"برزخ چیست؟","body":"پاسخ تشریحی: برزخ عالم میان مرگ و قیامت است. در این عالم، روح انسان پیش از قیامت در دنیایی دیگر زندگی می‌کند؛ نیکوکاران در نعمت و ستمکاران در عذاب به سر می‌برند تا پاداش و کیفر کامل در قیامت برسد."}]},{"number":5,"title":"قرآن، برنامه زندگی","pages":"۵۸ تا ۷۰","contents":[{"type":"answer","title":"چرا قرآن کریم معجزه پیامبر اکرم ص است؟","body":"زیرا آن حضرت درس‌ناخوانده بود و کتابی چنین بلند و زنده آورد؛ هیچ‌کس نتوانسته مانند آن بیاورد و پس از چهارده قرن، دشمنان نتوانسته‌اند کوچک‌ترین تحریفی در متن آن راه بدهند؛ پس قرآن معجزه جاودانه پیامبر ص است.","pageRef":"صفحه ۶۱"},{"type":"answer","title":"نقش قرآن در زندگی ما چیست؟","body":"قرآن برنامه زندگی و دستورالعمل سعادت انسان است؛ به ما می‌گوید چگونه بیندیشیم، رفتار کنیم، با خانواده و دیگران معاشرت کنیم و راه زندگی را بیابیم. تلاوت آن دل را نورانی می‌کند و تفکر در آن، مسیر درست زندگی را روشن می‌سازد.","pageRef":"صفحه ۶۴"},{"type":"note","title":"حق قرآن بر ما","body":"حق قرآن بر ما سه چیز است: خواندن آن با صدای نیکو و آداب قرائت، تفکر و اندیشیدن در آیات و عمل به دستورهای آن در زندگی. قرآنی که خوانده نشود و به آن عمل نگردد، در روز قیامت از ما گلایه خواهد کرد."},{"type":"note","title":"حدیث قرآن و اهل بیت ع","body":"پیامبر ص فرمود: إنِّي تارِكٌ فيكُمُ الثَّقَلَينِ كِتابَ اللهِ وَعِترَتي أهلَ بَيتي\nترجمه: من در میان شما دو یادگار گران‌بها می‌گذارم: کتاب خدا و اهل بیتم.\nچنگ زدن به این دو، نجات‌بخش از گمراهی تا روز قیامت است."},{"type":"exam","title":"چرا خواندن قرآن بدون فهم و عمل کافی نیست؟","body":"پاسخ تشریحی: زیرا قرآن کتاب هدایت و برنامه زندگی است، نه تنها کتاب تلاوت. اگر در معنا و پیام آن بیندیشیم و به آن عمل نکنیم، از هدف اصلی محروم می‌مانیم. قرآن خود می‌پرسد: آیا در قرآن نمی‌اندیشند؟"},{"type":"exam","title":"دو ویژگی برجسته قرآن کریم را بنویسید.","body":"پاسخ تشریحی: نخست تحریف‌ناپذیری؛ خداوند خود نگهبان قرآن است و هیچ تغییری در متن آن راه نیافته است. دوم جاودانگی و همیشگی؛ قرآن پاسخ‌گوی نیازهای فکری و اخلاقی همه انسان‌ها در همه زمان‌ها تا روز قیامت است و کهنه نمی‌شود."}]},{"number":6,"title":"نماز جماعت","pages":"۷۱ تا ۸۲","contents":[{"type":"answer","title":"دو فایده نماز جماعت را بنویسید.","body":"نماز جماعت وحدت و همبستگی مسلمانان را تقویت می‌کند و صفوف به‌هم‌پیوسته نمازگزاران نماد یکپارچگی امت است. همچنین پاداش نماز جماعت از نماز فرادی بسیار بیشتر است و آداب زیستن در جامعه و نظم جمعی را به ما می‌آموزد.","pageRef":"صفحه ۷۴"},{"type":"answer","title":"امام جماعت باید چه ویژگی‌هایی داشته باشد؟","body":"امام جماعت باید بالغ و عاقل باشد، مسلمان و عادل باشد، قرائت درستی داشته باشد و مأمومین را بشناسد؛ همچنین بهتر است بزرگ‌تر و آگاه‌تر از مأمومین باشد تا اشتباه‌های آنان را اصلاح کند.","pageRef":"صفحه ۷۸"},{"type":"note","title":"پاداش نماز جماعت","body":"نماز جماعت از برجسته‌ترین دستورهای اسلام است. در روایات آمده است پاداش نماز جماعت بیست‌وهفت برابر نماز فرادی است؛ زیرا در آن، دل‌ها گرد خدا و صف‌ها نماد وحدت امت است و مسلمانان را در هر روز چند بار گرد هم می‌آورد."},{"type":"note","title":"نماز جماعت و نظم اجتماعی","body":"در نماز جماعت، حال ثروتمند و تهیدست یکسان است و هیچ کسی بر دیگری برتری ندارد. همسایگان از حال یکدیگر آگاه می‌شوند، کدورت‌ها از میان می‌رود و مساجد، کانون مهربانی و همدلی محل و شهر می‌شوند."},{"type":"exam","title":"چرا اسلام نماز جماعت را سفارش فراوان کرده است؟","body":"پاسخ تشریحی: زیرا نماز جماعت افزون بر پاداش بیشتر، وحدت مسلمانان را حفظ می‌کند، مساجد را آباد و زنده می‌سازد، پیوند مردم یک محله و شهر را محکم می‌کند و جوانان را با نظم و آداب جمعی آشنا می‌سازد."},{"type":"exam","title":"سه فایده اجتماعی نماز جماعت را بیان کنید.","body":"پاسخ تشریحی: نخست ایجاد وحدت و همبستگی میان مسلمانان؛ دوم آبادانی مساجد و برقراری پیوند اجتماعی میان مردم؛ سوم آشنایی مردم با یکدیگر، رفع کدورت‌ها و پیدایش مهربانی و همراهی. به این ترتیب جامعه اسلامی منسجم می‌شود."}]},{"number":7,"title":"رهبری در دوران غیبت","pages":"۸۳ تا ۹۴","contents":[{"type":"answer","title":"در دوران غیبت، مسلمانان برای شناخت احکام دین به چه کسی مراجعه کنند؟","body":"به فقیه عادل و آگاه که نایب عام امام زمان عج است. او با تسلط بر قرآن و احادیث، احکام خدا را بیان می‌کند و امت اسلامی را رهبری می‌کند؛ مراجعه به او و اطاعت از او، در حکم مراجعه و اطاعت از امام زمان عج است.","pageRef":"صفحه ۸۶"},{"type":"answer","title":"دو وظیفه ما در دوران غیبت چیست؟","body":"نخست انتظار واقعی؛ یعنی خودسازی، دوری از گناه و آماده بودن برای ظهور. دوم یاد امام زمان عج؛ با خواندن دعا برای سلامتی و فرج آن حضرت، صدقه دادن برای او و آشنایی بیشتر با زندگی و سخنان آن امام مهربان.","pageRef":"صفحه ۹۰"},{"type":"note","title":"نایب عام امام زمان عج","body":"امام زمان عج برای پاسخ‌گویی به پرسش‌های دینی مردم در دوران غیبت، فقهای عادل و آگاه را نایب عام خود معرفی کرده است. مراجعه به آنان در مسائل دینی، نزدیک‌ترین راه به امام است و جامعه را از سرگردانی و گمراهی نگاه می‌دارد."},{"type":"note","title":"دعا برای فرج","body":"امام صادق ع فرمود: برای نزدیک شدن فرج بسیار دعا کن که فرج تو در همان دعا است. دعا برای سلامتی و فرج امام زمان عج، بهترین گام دوران انتظار است و دل منتظران را با امام مهربان خود پیوند می‌دهد."},{"type":"exam","title":"انتظار فرج یعنی چه و چه اثری در زندگی مؤمن دارد؟","body":"پاسخ تشریحی: انتظار فرج یعنی پایداری بر دین و آماده بودن در دوران غیبت امام زمان عج. این انتظار ما را به خودسازی و دوری از گناه برمی‌انگیزد، امید را زنده نگه می‌دارد و جامعه را از گمراهی بازمی‌دارد."},{"type":"exam","title":"چرا امام زمان عج در پنهانی به سر می‌برد؟","body":"پاسخ تشریحی: زیرا حاکمان ستمگر زمانه قصد جان آن حضرت را داشتند و خداوند او را از آسیب دشمنان نگاه داشت؛ همچنین غیبت، آزمونی الهی برای سنجش ایمان و پاکی مردم است تا در این دوران، مؤمنان واقعی و منتظران راستین شناخته شوند."}]},{"number":8,"title":"انقلاب اسلامی ایران","pages":"۹۵ تا ۱۰۶","contents":[{"type":"answer","title":"مهم‌ترین عوامل پیروزی انقلاب اسلامی را بنویسید.","body":"رهبری آگاه امام خمینی ره، حضور گسترده و آگاهانه مردم در راهپیمایی‌ها، اتحاد و همدلی آحاد ملت، پایبندی مردم به اسلام و شعارهای قرآنی و شهادت‌طلبی جوانان مؤمن، از مهم‌ترین عوامل پیروزی انقلاب اسلامی ایران بودند.","pageRef":"صفحه ۹۸"},{"type":"answer","title":"چرا انقلاب اسلامی، انقلابی الهی شمرده می‌شود؟","body":"زیرا شعار و هدف آن بر پایه قرآن و اسلام بود؛ مردم با شعار الله اکبر و استقلال، آزادی، جمهوری اسلامی به پیروزی رسیدند و خواستار برپایی حکومت خدا و عمل به احکام قرآن در جامعه شدند و رهبری آن بر عهده عالم دینی بود.","pageRef":"صفحه ۱۰۲"},{"type":"note","title":"انقلاب، ادامه قیام حسینی","body":"انقلاب اسلامی ایران سرچشمه‌ای الهی دارد و مانند قیام امام حسین ع بر پایه امر به معروف، نهی از منکر و مبارزه با ستم برپا شد. مردم با یاد اهل بیت ع و عزاداری‌های مذهبی به میدان آمدند و راه شهیدان را ادامه دادند."},{"type":"note","title":"آیه وحدت","body":"قرآن می‌فرماید: ﴿وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا﴾\nترجمه: همگی به ریسمان خدا چنگ زنید و پراکنده نشوید.\nراز پیروزی و ماندگاری انقلاب اسلامی، همین اتحاد مردم به دور از تفرقه بود."},{"type":"exam","title":"نقش مساجد در پیروزی انقلاب اسلامی چه بود؟","body":"پاسخ تشریحی: مسجد محل گرد آمدن مردم و شنیدن پیام‌های رهبری انقلاب بود؛ در منابر مساجد، آگاهی مردم بالا می‌رفت، اعلامیه‌ها پخش می‌شد و نماز جماعت و اجتماعات مسجد، جایگاه همبستگی ملت و سنگر مبارزه با ستمگران بود."},{"type":"exam","title":"بیداری اسلامی چه پیامدی از انقلاب اسلامی است؟ توضیح دهید.","body":"پاسخ تشریحی: انقلاب اسلامی نشان داد ملت مؤمن می‌تواند با توکل بر خدا و حضور خود، بر ابرقدرت‌ها پیروز شود؛ این پیروزی، ملت‌های مسلمان را به مبارزه با ستم برانگیخت و موج بیداری اسلامی را در جهان برپا کرد."}]},{"number":9,"title":"خاتم پیامبران","pages":"۱۰۷ تا ۱۱۸","contents":[{"type":"answer","title":"چرا پیامبر اکرم ص آخرین پیامبر الهی است؟","body":"زیرا دین اسلام کامل بود و همه دستورهای لازم برای سعادت انسان را تا روز قیامت در خود دارد. پس نیاز به پیامبر جدیدی نیست و با درگذشت آن حضرت، رهبری امت به امامان معصوم ع سپرده شد که با پیامبر هم‌مقتدا و هم‌علم‌اند.","pageRef":"صفحه ۱۱۰"},{"type":"answer","title":"اخلاق پیامبر ص چگونه بود؟ دو نمونه بیان کنید.","body":"آن حضرت بسیار مهربان و خوش‌خُلق بود؛ به بدی‌های مردم با نیکی پاسخ می‌داد و هرگز کینه به دل نمی‌گرفت. با اهل خانه نرم بود، به کودکان احترام می‌گذاشت، با فقرا می‌نشست و هرگز به آبروی کسی آسیب نمی‌رساند.","pageRef":"صفحه ۱۱۳"},{"type":"note","title":"رحمت برای جهانیان","body":"قرآن کریم پیامبر ص را رحمت برای عالمیان می‌نامد؛ زیرا او راه هدایت را به همه انسان‌ها نشان داد، حقوق انسان‌ها را زنده کرد و بهترین سرمشق اخلاق، بندگی و مهربانی برای همه دوران‌هاست."},{"type":"note","title":"آیه پیروی از پیامبر","body":"قرآن می‌فرماید: ﴿قُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ﴾\nترجمه: بگو اگر خدا را دوست دارید، از من پیروی کنید تا خدا شما را دوست بدارد.\nدوستی خدا در گرو پیروی از پیامبر ص و سنت اوست."},{"type":"exam","title":"یکی از ویژگی‌های اخلاقی پیامبر ص را با نمونه‌ای توضیح دهید.","body":"پاسخ تشریحی: عفو و گذشت؛ روز فتح مکه، آن حضرت بر ستم‌های سال‌های دراز اهل مکه چشم پوشید و فرمود: بروید که همه شما آزادید. این بزرگ‌منشی دل‌ها را شگفت‌زده کرد و بسیاری به دنبال آن به اسلام گرویدند."},{"type":"exam","title":"مقصود از عصمت پیامبر ص چیست؟","body":"پاسخ تشریحی: عصمت یعنی نگاه داشته شدن از گناه و خطا. پیامبر ص در ابلاغ وحی و در رفتار فردی و اجتماعی از هر گناه و اشتباه پاک است؛ به همین دلیل سخن و سنت او حجت الهی است و بهترین الگوی رفتاری همه انس
