چرا طوطی‌های هند با شنیدن سلام، از شاخه افتادند؟","body":"رفتار آنان پندی رمزی بود، نه مرگ واقعی؛ آنان خبر راه رهایی را نشان دادند تا طوطیِ قفس بداند باید از بند وابستگی‌ها گذشت. مولانا می‌خواهد بگوید جانِ در بند با شنیدن پند راستین از بی‌خبری بیدار می‌شود و باید قفس را رها کند. این رمزورزی شیوه‌ی مولاناست."},{"type":"exam","title":"در حکایت، «قفس» و «پرواز» نماد چه هستند؟ پاسخ تشریحی بنویسید.","body":"قفس نماد دنیا، تن و بندگیِ وابستگی‌هاست و پرواز نماد آزادی جان و پیوستن به معنا. کسی که مانند طوطی از پند راستین جان بگیرد، از بند قفس رها می‌شود. در پاسخ، هر دو نماد را با شاهدی از ماجرای داستان (افتادن طوطی و پروازش) توضیح دهید."}]},{"number":12,"title":"پروانه و شمع","pages":"۱۲۷ تا ۱۳۸","contents":[{"type":"answer","title":"پروانه در شب جشن حشرات چگونه رفتار کرد و سرانجامش چه شد؟","body":"پروانه دیگران را به ناتوانی می‌راند و شمع را حقیر می‌شمارد؛ با غرور بر گردن شمع می‌نشیند. شعله بال او را می‌سوزاند و پشیمان می‌شود. مولانا می‌خواهد بگوید متکبر به‌زودی از تکبر خود پشیمان می‌شود و جزای غرور، زیان و ندامت است.","pageRef":"صفحه ۱۲۷"},{"type":"answer","title":"پیام حکایت پروانه و شمع چیست؟","body":"پیام حکایت دوری از تکبر و خودبزرگ‌بینی است. پروانه که دیگران را ناتوان می‌خواند، خود زودتر فرو می‌افتد. انسان باید فروتن باشد، کسی را حقیر نشمارد و بداند هر کس به اندازه‌ی توانش خدمت می‌کند؛ بزرگ‌شمردن خویش، نخستین گام سقوط است.","pageRef":"صفحه ۱۳۰"},{"type":"note","title":"حکایت و ساختار آن","body":"حکایت داستانی کوتاه و پندآموز است که نثر یا نظم دارد و در پایان به پند می‌رسد. بخش‌های این حکایت: جشن حشرات، تکبر پروانه، سوختن بال و عبرت‌گیری. دانستن این ترتیب در پرسش‌های ساختار حکایت و ترتیب وقایع بسیار سودمند است."},{"type":"note","title":"واژه‌نامه: حقیر، ناتوان، تکبر","body":"حقیر: کوچک و بی‌ارزش در چشم دیگران. ناتوان: بی‌قدرت و ناتمام. تکبر: بزرگ‌بینی و برتر شمردن خود. واژه‌ی «حقیر» کلید رفتار پروانه است؛ چون دیگران را حقیر دید، گرفتار آتش شد. در سوال‌های مترادف و متضاد از این واژه‌ها پرسیده می‌شود."},{"type":"exam","title":"تکبر پروانه چه نتیجه‌ای داشت؟ با شاهدی از متن بنویسید.","body":"تکبر پروانه به سوختن بال و پشیمانی انجامید؛ او که شمع را حقیر می‌خواند، با آویختن بر گردن شمع جانش در خطر افتاد. این سرانجام نشان می‌دهد برتری‌جویی و راندن دیگران، نتیجه‌ای جز زیان ندارد. شاهد متن: رفتار پروانه با شمع در شب جشن."},{"type":"exam","title":"از حکایت پروانه و شمع دو پند بنویسید.","body":"۱. هرگز کسی را حقیر نشماریم؛ زیرا بزرگ‌بینی ما را گمراه می‌کند. ۲. پیش از رنجاندن دیگران، توان خود را بسنجیم؛ پروانه چون توان خود را بیش از اندازه دید، گرفتار آتش شد. فروتنی و اندیشیدن پیش از عمل، پندهای اصلی حکایت هستند."}]},{"number":13,"title":"هفت‌خان رستم","pages":"۱۳۹ تا ۱۵۰","contents":[{"type":"answer","title":"رستم در هفت‌خان با چه موانعی روبه‌رو شد؟","body":"رستم بر رخش برای یاری کاووس راه افتاد و در هفت‌خان پشت سر هم با دشواری‌ها جنگید: شیر خشمگین، بیابان بی‌آب و گرم، گرازان وحشی، اژدهای هولناک و سرانجام دیوان و دلیران توران. او با یاری خرد و رخش، همه‌ی خان‌ها را گذراند و به پیروزی رسید.","pageRef":"صفحه ۱۳۹"},{"type":"answer","title":"در داستان اژدها چه گذشت و چه درسی می‌گیریم؟","body":"رستم خسته به خواب رفت و اژدها پدیدار شد. رخش تنها نمی‌توانست بجنگد؛ چند بار رستم را بیدار کرد و رستم خشمگین او را می‌راند. سرانجام رستم بیدار شد و اژدها را کشت. درس: هشدارهای یاران خردمند را جدی بگیریم؛ غفلت و خواب‌گرمی زیان‌بار است.","pageRef":"صفحه ۱۴۲"},{"type":"note","title":"فردوسی و شاهنامه","body":"حکیم ابوالقاسم فردوسی بزرگ‌ترین حماسه‌سرای ایران است که شاهنامه را در حدود سی سال با زبان فارسی روان و استوار سرود. او می‌گوید: «توانا بود هر که دانا بود / ز دانش دل پیر برنا بود». شاهنامه دفتر دلاوری، خرد و ایران‌دوستی است."},{"type":"note","title":"ویژگی‌های شعر حماسی","body":"شعر حماسی از دلاوری، میدان جنگ و ایستادگی می‌گوید؛ واژه‌های آن پرقدرت‌اند مانند تیزپا، خروشان و گرز و حس غرور می‌بخشد. در هفت‌خان رستم تصویرهای جنگی و حرکت‌های پرشتاب، حماسه را زنده می‌کنند و خواننده را با دلاوران همراه می‌سازند."},{"type":"exam","title":"معنی بیت «توانا بود هر که دانا بود / ز دانش دل پیر برنا بود» را بنویسید.","body":"کسی توانا است که دانا باشد و دانش، دل پیر و فرسوده را جوان و سرزنده می‌کند. فردوسی پیوند دانش و توانایی را می‌رساند: خرد بر زور و زر برتری دارد. در پاسخ، معنی هر مصراع را جدا بنویسید و نام شاعر و اثر او را ذکر کنید."},{"type":"exam","title":"نقش رخش در داستان هفت‌خان را توضیح دهید.","body":"رخش تنها اسب رستم نیست؛ یار هوشمند اوست: در بیابان راه را می‌یابد، در خان اژدها با جنبیدن رستم را از خطر بیدار می‌کند و در جنگ‌ها شتاب و نیروی دوگانه به او می‌دهد. بی‌رخش، گذر از هفت‌خان ناممکن بود؛ پس وفاداری یاران رمز پیروزی است."}]},{"number":14,"title":"در آرزوی بزرگ شدن","pages":"۱۵۱ تا ۱۶۲","contents":[{"type":"answer","title":"نویسنده از آرزوی بزرگ شدن چه تصویری می‌سازد؟","body":"بزرگ شدن تنها بلندتر شدن نیست؛ رسیدن به مسئولیت‌پذیری، خردمندی و کاربرد دانش در زندگی است. نویسنده آرزو دارد کارهای بزرگ انجام دهد، به دیگران کمک کند و مورد اعتماد مردم باشد؛ همین آرزوست که او را به درس خواندن و کوشش برمی‌انگیزد.","pageRef":"صفحه ۱۵۱"},{"type":"answer","title":"چرا آرزو کردن برای رشد انسان لازم است؟","body":"آرزوها نقشه‌ی راه آینده‌اند؛ کسی که آرزوی روشن دارد، برای رسیدن به آن درس می‌خواند، تمرین می‌کند و از سستی دور می‌ماند. البته آرزو باید با کوشش همراه باشد؛ وگرنه خوابی شیرین است که به حقیقت نمی‌پیوندد و فقط روزها را می‌گذراند.","pageRef":"صفحه ۱۵۴"},{"type":"note","title":"دستور زبان: فعل آینده","body":"فعل آینده از «خواهم، خواهی، خواهد، خواهیم، خواهید، خواهند» به‌علاوه‌ی مصدر ساخته می‌شود؛ مانند «خواهم شد» و «خواهد رفت». در نوشتن، دو بخش فعل آینده جدا نوشته می‌شوند و نباید «خواهد شد» را پیوسته نوشت؛ این نکته در املای امتحانی پرتکرار است."},{"type":"note","title":"واژه‌نامه: آرزو و واژه‌های همراه","body":"آرزو: خواسته‌ی دل و امید دوردست. آرزومند: کسی که خواسته‌ای بزرگ در دل دارد. اندیشه: فکر و تصور. در این درس آرزو نشانه‌ی رو به جلو بودن است؛ پس واژه‌های امید، رؤیا و بلندهمتی با آن همراه‌اند و در مترادف‌یابی به کار می‌آیند."},{"type":"exam","title":"پیوند آرزو و کوشش را با توجه به درس توضیح دهید.","body":"آرزو رؤیای آینده است و کوشش گام‌های امروز؛ آرزوی بی‌کوشش هیچ نیست. نویسنده می‌گوید بزرگ شدن با درس خواندن، ورزش و یادگیری مهارت‌ها آرام‌آرام به دست می‌آید. پس برای رسیدن به آرزوهای بزرگ باید از امروز تلاش کرد؛ این پیوند، پیام اصلی درس است."},{"type":"exam","title":"با واژه‌های «دانش‌آموز» و «آرزو» جمله‌ی خبری، پرسشی و انشایی بسازید.","body":"خبری: «دانش‌آموز کوشا به آرزوهایش می‌رسد.» پرسشی: «دانش‌آموز چه آرزویی دارد؟» انشایی: «ای دانش‌آموز، برای آرزوهایت بکوش.» با این سه نوع جمله می‌توان اطلاعات داد، پرسید و درخواست کرد؛ همین سه کار پایه‌ی گفت‌وگو و نوشتن هستند."}]},{"number":15,"title":"یک سبد سلام","pages":"۱۶۳ تا ۱۷۴","contents":[{"type":"answer","title":"شاعر در شعر یک سبد سلام چه هدیه‌ای می‌آورد؟","body":"شاعر مانند کسی که سبدی از گل و میوه می‌آورد، سبدی از سلام‌ها و درودهای گرم برای آدم‌های جهان می‌آورد؛ برای مادر، معلم، دوستان و هر مهربانی. او نشان می‌دهد سخن نیکو هدیه‌ای است که گیرنده‌های بی‌شماری دارد و هیچ‌گاه از دست نمی‌رود.","pageRef":"صفحه ۱۶۳"},{"type":"answer","title":"پیام شعر یک سبد سلام چیست؟","body":"پیام شعر پراکندن مهر با سخن‌های خوب است: سلام، درود و تشکر، کوچک‌ترین اما گران‌بها هدیه‌ها هستند. شاعر می‌خواهد بگوید دل‌ها با محبت نرم می‌شوند و دوستی از یک سلام ساده آغاز می‌شود؛ پس در گفتار نیکو دریغ نکنیم و سخاوت زبان داشته باشیم.","pageRef":"صفحه ۱۶۶"},{"type":"note","title":"آرایه استعاره در شعر","body":"استعاره پنهان کردن یک واژه و به کار بردن واژه‌ای دیگر به جای آن است؛ مانند «سبد سلام»: سلام چیز قابل حمل نیست، اما شاعر آن را مانند میوه در سبد تصویر می‌کند. این آرایه مفهوم‌های نامرئی مانند مهر را ملموس و تصویر شعر را تازه می‌کند."},{"type":"note","title":"واژه‌نامه: سلام، درود، صلح","body":"سلام: درود و آرزوی بی‌آزاری. درود: مترادف سلام از پارسی کهن. صلح: آشتی و پایان کدورت. شاعر این سه واژه را در زنجیره‌ی مهر می‌نشاند؛ در امتحان‌ها مترادف‌یابی این واژه‌ها و به کار بردن آن‌ها در جمله از بخش واژه‌نامه پرسیده می‌شود."},{"type":"exam","title":"«سبد سلام» در شعر چه نمادی دارد؟ پاسخ تشریحی بنویسید.","body":"سبد نماد جمع کردن و هدیه دادن است و سلام نماد مهر و احترام؛ پس «سبد سلام» یعنی مجموعه‌ای از درودها که شاعر آن را مانند گران‌بهاترین هدیه به همه می‌بخشد. این تصویر آمیخته با استعاره است و گرمای گفتار نیکو را در ذهن ملموس می‌کند."},{"type":"exam","title":"دو نمونه تشبیه از شعر یک سبد سلام بیاورید و ارکان آن را بنویسید.","body":"در شعر، سلام به گل و میوه تشبیه شده است؛ زیرا هر دو بخشیدنی و خوشایندند. دل مهربان نیز به چشمه‌ی همیشه‌جوش تشبیه شده؛ زیرا هر دو بی‌دریغ می‌بخشند. ارکان تشبیه: مشبه (سلام)، مشبه‌به (گل)، ادات (مانند) و وجه شبیه (بخشش و زیبایی)."}]},{"number":16,"title":"مبادا","pages":"۱۷۵ تا ۱۸۶","contents":[{"type":"answer","title":"شاعر در شعر مبادا از چه کارهایی برحذر می‌دارد؟","body":"شاعر با تکرار واژه‌ی «مبادا» از کارهای ناشایست برحذر می‌دارد: ستم کردن، بی‌مهری به دل‌ها، دروغ گفتن و بی‌احترامی به دیگران. ساختار تکراری شعر، هر پند را مانند هشداری استوار در ذهن می‌نشاند و خواننده را به پاسداری از آیین‌های خوب می‌خواند.","pageRef":"صفحه ۱۷۵"},{"type":"answer","title":"چرا شاعر برای پندهای خود واژه‌ی «مبادا» را برگزیده است؟","body":"«مبادا» دعای نفی است و یعنی هرگز چنین نشود. این واژه کوتاه و قاطع، هشداری است که بی‌واسطه به دل می‌نشیند. شاعر با تکرار آن، ریتم شعر را می‌سازد و پندها را مانند آیین‌نامه‌ای خواندنی و ماندگار در ذهن و زبان خواننده حک می‌کند.","pageRef":"صفحه ۱۷۸"},{"type":"note","title":"واژه‌نامه: مبادا","body":"مبادا: هرگز نشود؛ دعای نفی و آرزوی دور شدن کار بد. در فارسی برای آرزو از فعل‌هایی مانند «باد» نیز کمک می‌گیریم؛ مانند «خوش باد». این ساخت‌ها در شعرهای پندآموز و سروده‌های آیینی پرتکرارند و معنی آن‌ها در واژه‌نامه‌ی کتاب آمده است."},{"type":"note","title":"دستور زبان: نهی","body":"فعل نهی برای بازداشتن مخاطب از کاری به کار می‌رود و در فارسی با «نـ» یا «مـ» آغاز می‌شود؛ مانند «نرو»، «مخور» و «منگو». در شعر مبادا روح نهی دیده می‌شود: خواننده از بدی‌ها بازداشته می‌شود تا آیین‌های نیک پاس داشته شود."},{"type":"exam","title":"سه پند شعر مبادا را بنویسید و برای یکی از آن‌ها مثال بیاورید.","body":"پندها: هرگز ستم نکنیم، دل کسی را نشکنیم و در سخن، دروغ نگوییم. مثال: در بازی گروهی اگر هم‌گروهی ضعیف‌تر بود، نباید او را سرزنش کرد یا از بازی کنار گذاشت؛ این همان بی‌مهری است که شاعر آن را «مبادا» می‌خواند و از آن برحذر می‌دارد."},{"type":"exam","title":"فعل امر و نهی را در «مبادا دروغ بگویی» و «مهربان باش» مشخص کنید.","body":"در «مبادا دروغ بگویی»، واژه‌ی مبادا دعای نفی است و «بگویی» مضارع اخباری دوم شخص مفرد؛ کل عبارت حالت نهی دارد. در «مهربان باش»، «باش» فعل امر دوم شخص مفرد است. امر، خواننده را به کار نیک می‌خواند و نهی از کار بد بازمی‌دارد."}]},{"number":17,"title":"همای رحمت","pages":"۱۸۷ تا ۱۹۸","contents":[{"type":"answer","title":"چرا شاعر امام خمینی را «همای رحمت» می‌نامد؟","body":"هما پرنده‌ای افسانه‌ای است که می‌گویند سایه‌اش بر سر کسی بیفتد، به بزرگی می‌رسد. شاعر سایه‌ی امام را مایه‌ی سربلندی و آرامش ملت می‌داند؛ زیرا او با مهربانی و ایستادگی، مردم را از ستم رهانید و دل‌ها را به امید و ایمان پیوند داد؛ پس این نام بجاست.","pageRef":"صفحه ۱۸۷"},{"type":"answer","title":"در شعر همای رحمت چه ویژگی‌هایی از امام خمینی ستوده می‌شود؟","body":"شاعر ایمان و خداشناسی، سادگی و بی‌ادعایی، مهر به مردم، ایستادگی در برابر ستم و روشن‌بینی امام را ستایش می‌کند. تصویرهای شعر نشان می‌دهند او چون پدری مهربان و پیشوایی امین، راه امید و آزادی را برای ملت گشود و نامش در دل‌ها جاودانه شد.","pageRef":"صفحه ۱۹۰"},{"type":"note","title":"آرایه تضمین","body":"تضمین یعنی آوردن بیت یا عبارتی از شاعران پیشین در شعر تا سخن استوارتر شود. در سروده‌های ستایشی گاه از آیات و اشعار کهن کمک می‌گیرند؛ گوینده با این آرایه، پشتوانه‌ی سخن پیشینیان را به یاری می‌گیرد و پیام خود را گسترده‌تر می‌کند."},{"type":"note","title":"واژه‌نامه: همای، رحمت، ایستادگی","body":"همای: پرنده‌ی افسانه‌ای سعادت‌بخش که سایه‌اش مایه‌ی بزرگی است. رحمت: مهربانی و بخشش الهی. ایستادگی: مقاومت و پایداری. فهم عنوان شعر به دانستن معنی «همای» وابسته است؛ در امتحان اغلب درباره‌ی دلیل این نام‌گذاری پرسش می‌شود."},{"type":"exam","title":"تصویرهای شعر همای رحمت را توصیف کنید.","body":"شاعر با تصویرهای گرم مانند سایه بر سر ملت، چراغ روشن در تاریکی و پدری مهربان، امام را به چشم دل می‌آورد. این تصویرها از نوع تشبیه و استعاره‌اند و حس مهر و امنیت را منتقل می‌کنند. در پاسخ، دو تصویر را بنویسید و اثر هر یک را توضیح دهید."},{"type":"exam","title":"دو ویژگی اخلاقی امام خمینی را با شاهدی از شعر بنویسید.","body":"۱. مهر به مردم: شاعر او را پدر ملت و همای رحمت می‌خواند؛ شاهد، تصویر سایه‌ی او بر سر مردم است. ۲. ایستادگی: در برابر ستمگران خم نمی‌شود؛ شاهد، واژه‌های پایداری و نترسیدن در شعر. یادآوری: پاسخ کامل هم ویژگی دارد و هم شاهد از متن."}]},{"number":18,"title":"گنج حکمت","pages":"۱۹۹ تا ۲۱۲","contents":[{"type":"answer","title":"حکایت‌های گنج حکمت چه ویژگی مشترکی دارند؟","body":"حکایت‌های گنج حکمت کوتاه، پندآموز و پرمعنا هستند؛ بیشتر از بوستان و گلستان سعدی و مثنوی مولانا برگزیده شده‌اند و با زبانی ساده، درسی از فروتنی، راستی، سخاوت یا خردورزی می‌دهند. هر حکایت با تصویری ساده، پندی بزرگ در دل دارد.","pageRef":"صفحه ۱۹۹"},{"type":"answer","title":"از حکایت‌های گنج حکمت چه پندهایی می‌آموزیم؟","body":"می‌آموزیم که سخن باید اندازه باشد، در کارها شتاب نکنیم، بزرگ‌ترها را گرامی بداریم و از روی آگاهی درباره‌ی آدم‌ها داوری کنیم. سعدی می‌گوید خرد آن است که پیش از گفتن و کردار، پیامد آن را اندازه گیریم؛ همین پندها جوهر گنج حکمت است.","pageRef":"صفحه ۲۰۲"},{"type":"note","title":"سعدی و دو کتاب او","body":"سعدی، شاعر و نویسنده‌ی بزرگ سده‌ی هفتم هجری، دو کتاب ماندگار «گلستان» و «بوستان» را به جای گذاشت. گلستان به نثر آهنگین و آمیخته با شعر است و بوستان منظومه‌ای در اخلاق و تربیت. حکایت‌های کتاب فارسی بیشتر از این دو برگزیده می‌شوند."},{"type":"note","title":"چگونه از حکایت پند بگیریم؟","body":"برای درآوردن پند حکایت، به پایان آن و رفتار قهرمان توجه کنیم؛ خود را به جای شخصیت بگذاریم و نتیجه‌ی کار او را در زندگی بسنجیم. مثلا اگر کسی به سبب شتاب زیان دید، پند می‌شود که در کارها بی‌اندیشگی نکنیم. پند را در یک جمله‌ی کوتاه بنویسیم."},{"type":"exam","title":"حکایتی از گنج حکمت را برگزینید و پند آن را بنویسید.","body":"نمونه پاسخ: در حکایتی از سعدی، مردی به سبب شتاب و بی‌اندیشگی کار خویش را تباه کرد. پند حکایت: پیش از هر کار بیندیشیم و در گفتار و کردار شتاب نکنیم؛ زیرا اندیشیدن از پشیمانی آسان‌تر است. در امتحان، پند را هم‌خوان با ماجرای حکایت بنویسید."},{"type":"exam","title":"تفاوت حکایت و داستان کوتاه چیست؟","body":"حکایت بسیار کوتاه است، ماجرای آن ساده و شمار شخصیت‌هایش کم است و هدف اصلی آن پند و عبرت است؛ گاه سراینده‌اش معلوم است مانند سعدی. داستان کوتاه بلندتر است، شخصیت و صحنه‌های بیشتری دارد و بر نمایش زندگی و احساس تکیه دارد."}]},{"number":19,"title":"آفتاب در حجاب","pages":"۲۱۳ تا ۲۲۶","contents":[{"type":"answer","title":"چرا شاعر امام زمان را «آفتاب در حجاب» می‌نامد؟","body":"آفتاب هرچند پشت ابر باشد، جهان از نورش روشن است. شاعر امام زمان را آفتابی پنهان می‌نامد که حضورش جهان را نگه می‌دارد و دل منتظران را روشن می‌کند؛ حجاب یعنی پرده و غیبت، اما حکمت و مهربانی او مانند نور خورشید از پشت پرده می‌تابد.","pageRef":"صفحه ۲۱۳"},{"type":"answer","title":"در شعر آفتاب در حجاب چه فضایی حاکم است؟","body":"فضای شعر انتظار، امید و آرزوی دیدار است. شاعر دل‌های منتظر را به باغی می‌ماند که چشم راه آفتاب‌اند؛ می‌گوید روزی این آفتاب آشکار می‌شود و جهان پر از داد و مهربانی خواهد شد. این امید، منتظران را به نیکی و آمادگی فرا می‌خواند.","pageRef":"صفحه ۲۱۶"},{"type":"note","title":"واژه‌نامه: حجاب، منتظر، ظهور","body":"حجاب: پرده و پوشش؛ در عنوان شعر کنایه از غیبت است. منتظر: چشم‌به‌راه و آرزومند دیدار. ظهور: آشکار شدن. این سه واژه کلید فهم شعرند؛ در پرسش‌های واژه‌نامه باید هم معنی لغوی و هم نماد آن‌ها را در فضای شعر بنویسیم."},{"type":"note","title":"دستور زبان: ارکان تشبیه","body":"تشبیه چهار رکن دارد: مشبه (چیزی که مانند شده)، مشبه‌به (چیزی که به آن مانند می‌شود)، ادات تشبیه (مانند، چون) و وجه شبیه (ویژگی مشترک). نمونه: «مهدی مانند آفتاب روشن است»: مشبه مهدی، مشبه‌به آفتاب، ادات مانند، وجه شبیه روشنی."},{"type":"exam","title":"مفهوم انتظار در این شعر را توضیح دهید.","body":"انتظار در این شعر بیکاری نیست؛ آمادگی و خودسازی است. دل منتظر مانند باغ در انتظار بهار است: ناامید نمی‌شود و خود را با نیکی‌ها آماده‌ی دیدار می‌کند. شاعر انتظار را سرچشمه‌ی امید و پاکی می‌داند و خواننده را به اصلاح خویش فرا می‌خواند."},{"type":"exam","title":"ارکان تشبیه را در عبارت «دل منتظر مانند زمین چشم‌به‌راه بهار است» مشخص کنید.","body":"مشبه: دل منتظر. مشبه‌به: زمین چشم‌به‌راه بهار. ادات تشبیه: مانند. وجه شبیه: امید به آمدن روشنی و شکوفایی. یادآوری: هرگاه یکی از ارکان حذف شود، تشبیه به استعاره نزدیک می‌شود؛ این نکته در سوال‌های آرایه‌ی ادبی بسیار پرتکرار است."}]}]},{"title":"مطالعات اجتماعی هفتم","subject":"مطالعات اجتماعی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب مطالعات اجتماعی هفتم","color":"orange","icon":"globe","chapters":[{"number":1,"title":"زمین، محل زندگی ما","pages":"۸ تا ۱۶","contents":[{"type":"answer","title":"چرا انسان‌های گذشته زمین را تخت می‌پنداشتند؟","body":"آن‌ها تنها بخش کوچکی از سطح زمین را می‌دیدند و چون افق در چشمشان خطی صاف بود، تصور می‌کردند زمین تختی بی‌پایان است. با سفرهای دریایی طولانی مانند سفر ماژلان و سپس عکس‌برداری از فضا مشخص شد که زمین گوی‌مانند و کروی است.","pageRef":"صفحه ۹"},{"type":"answer","title":"زمین چند کره (پوشش) دارد و هر کدام چیست؟","body":"زمین چهار کرهٔ اصلی دارد. جوّ: پوشش گازی اطراف زمین. آب‌کره: همهٔ آب‌های زمین. سنگ‌کره: پوستهٔ سنگی و سخت زمین. زیست‌کره: بخشی که همهٔ جانداران در آن زندگی می‌کنند. این چهار کره با هم در ارتباط‌اند و زندگی ما به آن‌ها وابسته است.","pageRef":"صفحه ۱۲"},{"type":"note","title":"زمین چقدر بزرگ است؟","body":"زمین سومین سیاره از خورشید است. محیط استوای آن حدود چهل هزار کیلومتر و قطر آن حدود سیزده هزار کیلومتر است؛ با این حال در برابر خورشید بسیار کوچک است و حدود یک میلیون و سیصد هزار زمین در خورشید جا می‌گیرد."},{"type":"note","title":"جاذبهٔ زمین؛ نگه‌دارندهٔ همه‌چیز","body":"زمین مانند آهن‌ربایی بزرگ، همهٔ موجودات و حتی هوای اطراف خود را با نیروی جاذبه نگه می‌دارد. اگر جاذبه نبود، هوا و آب و همهٔ چیزها به فضا پرت می‌شدند و حیات روی زمین ممکن نبود."},{"type":"exam","title":"چه ویژگی‌هایی زمین را به سیاره‌ای ویژه برای زندگی تبدیل کرده است؟","body":"زمین در فاصلهٔ مناسبی از خورشید قرار دارد و دمای معتدلی دارد. آب مایع فراوان، هوای قابل تنفس و جاذبهٔ کافی برای نگه داشتن اتمسفر از دیگر ویژگی‌های آن است. ترکیب همین ویژگی‌ها باعث شده زمین تنها سیارهٔ شناخته‌شدهٔ دارای حیات باشد."},{"type":"exam","title":"کره‌های زمین را نام ببرید و برای هر کدام یک مثال بزنید.","body":"جوّ: هوای اطراف زمین مانند ابرها و باران. آب‌کره: دریاها، رودها و دریاچه‌ها. سنگ‌کره: خاک، صخره‌ها و کوه‌ها. زیست‌کره: گیاهان، جانوران و انسان‌ها. این کره‌ها بر هم اثر می‌گذارند؛ مثلاً بارش، پیوند میان جوّ و آب‌کره است."}]},{"number":2,"title":"حرکات زمین","pages":"۱۷ تا ۲۴","contents":[{"type":"answer","title":"حرکت وضعی زمین چه پیامدهایی دارد؟","body":"زمین در هر شبانه‌روز یک بار به دور محور خود می‌چرخد و این چرخش باعث شب و روز شدن می‌شود. چون زمین گوی است، همیشه نیمی از آن رو به خورشید (روز) و نیم دیگر در تاریکی (شب) است. تفاوت ساعت مناطق مختلف زمین هم به همین چرخش مربوط است.","pageRef":"صفحه ۱۸"},{"type":"answer","title":"چرا فصل‌ها به وجود می‌آیند؟","body":"محور زمین کج است و زمین ضمن گردش به دور خورشید، این کجی را همیشه حفظ می‌کند. در نیمی از سال نیم‌کرهٔ شمالی و در نیم دیگر نیم‌کرهٔ جنوبی بیشتر رو به خورشید قرار می‌گیرد؛ همین موضوع باعث تغییر فصل‌ها و بلند و کوتاه شدن روزها می‌شود.","pageRef":"صفحه ۲۰"},{"type":"note","title":"حرکت انتقالی و سال کبیسه","body":"زمین هر ۳۶۵ روز و ۶ ساعت یک بار دور خورشید می‌گردد. هر چهار سال، شش ساعت‌های اضافه یک روز کامل می‌شود و آن سال ۳۶۶ روزه کبیسه نامیده می‌شود؛ در تقویم ما اسفندِ آن سال سی روزه می‌شود."},{"type":"note","title":"طول روز در تابستان و زمستان","body":"در تیرماه نیم‌کرهٔ شمالی بیشتر رو به خورشید است؛ پس روزها بلند، شب‌ها کوتاه و هوا گرم است. در دی‌ماه برعکس، نیم‌کرهٔ شمالی از خورشید دور می‌شود؛ روزها کوتاه و هوا سرد است. در نیم‌کرهٔ جنوبی این وضع برعکس است."},{"type":"exam","title":"دو حرکت زمین را از نظر مدت و پیامدها با هم مقایسه کنید.","body":"حرکت وضعی: چرخش زمین به دور محور خود در مدت ۲۴ ساعت؛ پیامد آن پیدایش شب و روز و تفاوت ساعت مناطق است. حرکت انتقالی: گردش زمین به دور خورشید در ۳۶۵ روز و ۶ ساعت؛ پیامدهای آن تغییر فصل‌ها و تغییر طول روز و شب است."},{"type":"exam","title":"چرا هر چهار سال یک بار سال کبیسه در نظر گرفته می‌شود؟","body":"زمان دقیق گردش زمین به دور خورشید ۳۶۵ روز و ۶ ساعت است، اما سال عادی ۳۶۵ روز شمرده می‌شود؛ پس هر سال ۶ ساعت کم می‌ماند. در چهار سال این مقدار به ۲۴ ساعت یا یک روز کامل می‌رسد که آن سال به آخر سال افزوده می‌شود و سال کبیسه پدید می‌آید."}]},{"number":3,"title":"ورقه‌های سازندهٔ زمین","pages":"۲۵ تا ۳۱","contents":[{"type":"answer","title":"ورقه‌های سازندهٔ زمین چه هستند؟","body":"پوستهٔ سخت زمین یکپارچه نیست و از قطعه‌های بزرگی به نام ورقه تشکیل شده است. شش ورقهٔ بزرگ و چند ورقهٔ کوچک روی بخش نرم‌تر درونی زمین شناورند و سالی چند سانتی‌متر جابه‌جا می‌شوند؛ مانند ورقهٔ اوراسیا، آفریقا، آمریکا و پاسیفیک.","pageRef":"صفحه ۲۶"},{"type":"answer","title":"دانشمندان چگونه از حرکت ورقه‌ها آگاه شدند؟","body":"شکل ساحل قاره‌ها مانند قطعه‌های پازل در هم فرو می‌رود و سنگ‌ها و فسیل‌های دو سوی اقیانوس‌ها شبیه یکدیگرند. امروزه نیز با ماهواره‌ها و دستگاه‌های دقیق اندازه‌گیری، جابه‌جایی سالانهٔ ورقه‌ها مستقیماً سنجیده می‌شود.","pageRef":"صفحه ۲۸"},{"type":"note","title":"پیامدهای حرکت ورقه‌ها","body":"برخورد ورقه‌ها رشته‌کوه‌ها را بالا آورده است؛ مانند هیمالیا از برخورد ورقهٔ هند با اوراسیا و زاگرس از فشار ورقهٔ عربستان. دور شدن ورقه‌ها از هم نیز گودی اقیانوس‌ها و شکاف‌های میان‌اقیانوسی را پدید می‌آورد."},{"type":"note","title":"ورقهٔ پاسیفیک و حلقهٔ آتش","body":"ورقهٔ پاسیفیک (اقیانوس آرام) بزرگ‌ترین ورقهٔ سازندهٔ زمین است و بیشتر آن را آب پوشانده است. زمین‌لرزه‌ها و آتشفشان‌های فراوانِ حاشیهٔ این ورقه آن منطقه را به حلقهٔ آتش معروف کرده‌اند؛ کشورهای ژاپن، اندونزی و پرو روی همین حلقه‌اند."},{"type":"exam","title":"نشانه‌های حضور مرز ورقه‌های سازندهٔ زمین را توضیح دهید.","body":"در مرز ورقه‌ها نشانه‌هایی دیده می‌شود: پشته‌های میان‌اقیانوسی در محل دور شدن ورقه‌ها از هم، گودال‌های عمیق اقیانوسی و رشته‌کوه‌های تازه در محل برخورد ورقه‌ها، و فراوانی زمین‌لرزه و آتشفشان در این نواحی. رشته‌کوه‌های زیر آب نیز در همین مرزها ساخته می‌شوند."},{"type":"exam","title":"چرا در ژاپن و نواحی حاشیهٔ اقیانوس آرام زمین‌لرزه و آتشفشان فراوان است؟","body":"این مناطق روی مرز برخورد چند ورقهٔ سازنده قرار دارند. ورقه‌ها در این محل‌ها به هم فشار می‌آورند و زیر هم می‌روند؛ انرژی آزادشده به شکل زمین‌لرزه و ماگمای صعودکننده به شکل فوران آتشفشانی خود را نشان می‌دهد. به همین دلیل این ناحیه حلقهٔ آتش نامیده می‌شود."}]},{"number":4,"title":"زمین‌لرزه","pages":"۳۲ تا ۳۸","contents":[{"type":"answer","title":"زمین‌لرزه چگونه به وجود می‌آید؟","body":"ورقه‌های سنگ‌کره همیشه در حرکت‌اند و در مرزها به هم فشار می‌آورند. سنگ‌ها ابتدا این نیرو را تحمل می‌کنند، اما سرانجام ناگهان می‌شکنند یا روی هم می‌لغزند و انرژی ذخیره‌شده به شکل امواج لرزه‌ای آزاد می‌شود؛ این لرزش، زمین‌لرزه نامیده می‌شود.","pageRef":"صفحه ۳۳"},{"type":"answer","title":"هنگام وقوع زمین‌لرزه در ساختمان چه کار کنیم؟","body":"آرام باشیم و وحشت نکنیم؛ زیر میز یا کنار ستون محکم پناه بگیریم، سر را با دست یا بالشتک بپوشانیم و از پنجره، آینه و لوستر دور بمانیم. پس از پایان لرزه، آرام ساختمان را ترک کنیم و هرگز از آسانسور استفاده نکنیم.","pageRef":"صفحه ۳۶"},{"type":"note","title":"کانون و مرکز سطحی زمین‌لرزه","body":"مبدأ زمین‌لرزه در عمق زمین، کانون نامیده می‌شود و نقطه‌ای از سطح زمین که بالای کانون قرار دارد، مرکز سطحی است. آسیب در مرکز سطحی بیشتر است؛ هرچه کانون عمیق‌تر باشد، ویرانگری لرزه روی سطح زمین کمتر می‌شود."},{"type":"note","title":"چرا ایران کشوری زلزله‌خیز است؟","body":"ایران روی کمربند زمین‌لرزهٔ آلپ و هیمالیا و در محل برخورد ورقهٔ عربستان با اوراسیا قرار دارد. ورقهٔ عربستان سالی چند سانتی‌متر به سمت شمال حرکت می‌کند؛ به همین دلیل زاگرس، البرز و مناطق شرقی کشور زمین‌لرزه‌های فراوان دارند."},{"type":"exam","title":"دستگاه ثبت زمین‌لرزه چه نام دارد و چه کار می‌کند؟","body":"این دستگاه لرزه‌نگار نام دارد. لرزه‌نگار لرزش‌های زمین را ثبت می‌کند و بزرگای زمین‌لرزه را با مقیاس‌هایی مانند ریشتر نشان می‌دهد. با مقایسهٔ ثبت‌های چند لرزه‌نگار در ایستگاه‌های مختلف، محل کانون زمین‌لرزه نیز تعیین می‌شود."},{"type":"exam","title":"پیش از وقوع زمین‌لرزه چه کارهایی برای کاهش خسارت باید انجام شود؟","body":"ساختمان‌ها را مطابق آیین‌نامهٔ ساخت‌وساز مقاوم بسازیم، از ساختن در کنار گسل‌ها و شیب‌های سست پرهیز کنیم، وسایل سنگین را محکم ببندیم و با تمرین‌های ایمنی مانند پناه‌گیری زیر میز، آمادگی خود و خانواده را برای مواجهه با لرزه افزایش دهیم."}]},{"number":5,"title":"آتشفشان","pages":"۳۹ تا ۴۶","contents":[{"type":"answer","title":"آتشفشان چگونه به وجود می‌آید؟","body":"در بخش‌های درونی زمین، سنگ‌ها چنان گرم‌اند که بخشی از آن‌ها مذاب است. ماگمای سبک‌تر به تدریج به بالا حرکت می‌کند و در جایی از پوسته راهی باز می‌یابد؛ فوران ماگما و گازها و خاکستر از دهانه، به مرور کوهی به نام آتشفشان می‌سازد.","pageRef":"صفحه ۴۰"},{"type":"answer","title":"آتشفشان‌ها چه سودهایی برای انسان دارند؟","body":"خاک نواحی آتشفشانی حاصلخیز است و کشاورزی در آن رونق می‌گیرد. چشمه‌های آب گرم جاذبهٔ درمانی و گردشگری دارند. از سنگ‌های آتشفشانی مانند پوزولان در ساختمان‌سازی استفاده می‌شود و انرژی زمین‌گرمایی نیز برای تولید برق به کار می‌رود.","pageRef":"صفحه ۴۴"},{"type":"note","title":"انواع آتشفشان","body":"آتشفشان فعال بارها فوران کرده و ممکن است دوباره فوران کند؛ آتشفشان نهفته مدت‌ها آرام است اما ممکن است دوباره فعال شود؛ آتشفشان خاموش دیگر هرگز فوران نمی‌کند. قلهٔ دماوند در ایران آتشفشانی نهفته و بلندترین قلهٔ کشور است."},{"type":"note","title":"اجزای آتشفشان","body":"اتاقک ماگما جای ذخیرهٔ مواد مذاب در عمق زمین است؛ دودکش راه عبور ماگما به بالا و دهانه، خروجی آن در سطح زمین است. ماگما پس از خروج و جاری شدن، گدازه نامیده می‌شود که با سرد شدن سخت گشته، سنگ می‌سازد."},{"type":"exam","title":"تفاوت ماگما و گدازه چیست؟","body":"ماگما مواد مذابی است که هنوز در عمق زمین و در اتاقک ماگما قرار دارد. اما وقتی ماگما از دهانهٔ آتشفشان بیرون بریزد و روی سطح زمین جاری شود، گدازه نامیده می‌شود. گدازه پس از سرد شدن، سنگ‌های آذرین پدید می‌آورد."},{"type":"exam","title":"خطرهای فوران آتشفشان کدام‌اند و چگونه ایمن بمانیم؟","body":"جریان گدازه، بارش خاکستر داغ، گازهای سمی و به وجود آمدن سیل گل‌آلود از خطرهای اصلی‌اند. برای ایمنی باید دستورهای مقام‌های محلی را پیروی کرد، منطقه را به موقع ترک کرد و ماسک و عینک محافظ برای مواجهه با خاکستر آماده داشت."}]},{"number":6,"title":"چهرهٔ زمین","pages":"۴۷ تا ۵۴","contents":[{"type":"answer","title":"ناهمواری‌های اصلی سطح زمین کدام‌اند؟","body":"سطح زمین از اشکال گوناگونی پوشیده شده است: کوه و رشته‌کوه، تپه، فلات یعنی سرزمین بلند و نسبتاً هموار، دشت و جلگه یعنی سرزمین پست و هموار، و دره. این ناهمواری‌ها بر اثر نیروهای درونی و بیرونی، همواره در حال تغییرند.","pageRef":"صفحه ۴۸"},{"type":"answer","title":"بلندترین و پست‌ترین نقطهٔ سطح زمین کدام‌اند؟","body":"بلندترین نقطه، قلهٔ اورست در رشته‌کوه هیمالیا با ارتفاع ۸۸۴۸ متر است. پست‌ترین نقطه، گودال ماریانا در اقیانوس آرام با عمق نزدیک به یازده کیلومتر است؛ یعنی بیشترین اختلاف ارتفاع میان بلندترین قله و ژرف‌ترین گودال زمین.","pageRef":"صفحه ۵۰"},{"type":"note","title":"ناهمواری‌های ایران","body":"ایران سرزمینی کوهستانی است: رشته‌کوه البرز در شمال با قلهٔ دماوند و رشته‌کوه زاگرس در غرب و جنوب کشیده شده‌اند. میان کوه‌ها، فلات مرکزی و دشت‌های پهناور قرار دارد و در جنوب، جلگه‌های پست خوزستان و سواحل خلیج فارس خودنمایی می‌کنند."},{"type":"note","title":"چهرهٔ زمین همیشه در حال تغییر است","body":"نیروهای درونی زمین کوه می‌سازند و زمین را بالا می‌آورند؛ اما عوامل بیرونی مانند آب، باد و یخچال، سنگ‌ها را خرد و جابه‌جا می‌کنند. برخورد همین دو دسته نیرو در طول میلیون‌ها سال، چهرهٔ زمین را پیوسته دگرگون کرده است."},{"type":"exam","title":"تفاوت فلات و دشت را با ذکر مثال بنویسید.","body":"فلات سرزمینی بلند و پهناور است که سطح آن نسبتاً هموار است و معمولاً در میان کوه‌ها قرار دارد؛ مانند فلات مرکزی ایران. دشت سرزمینی پست و هموار است که ارتفاع کمی از سطح دریا دارد؛ مانند دشت گنگ در هند و جلگهٔ پهناور خوزستان."},{"type":"exam","title":"چرا قلهٔ اورست را بام جهان می‌نامند؟","body":"اورست با ارتفاع ۸۸۴۸ متر بلندترین نقطهٔ خشکی‌های زمین است و هیچ نقطهٔ خشکی بالاتر از آن وجود ندارد؛ به همین دلیل به آن بام جهان می‌گویند. این قله در رشته‌کوه هیمالیا و در مرز نپال و چین قرار دارد و سالانه کوهنوردان بسیاری به آن می‌روند."}]},{"number":7,"title":"هوازدگی","pages":"۵۵ تا ۶۱","contents":[{"type":"answer","title":"هوازدگی چیست و چه نتیجه‌ای دارد؟","body":"هوازدگی یعنی خرد شدن و تغییر و تجزیهٔ سنگ‌ها در همان جای خود، بدون جابه‌جایی. با گذشت زمان سنگ‌ها به ذره‌های ریزتر تبدیل می‌شوند و همراه با بازماندهٔ گیاهان و جانوران، خاک به وجود می‌آید. پس خاک، فرزند هوازدگی است.","pageRef":"صفحه ۵۶"},{"type":"answer","title":"هوازدگی مکانیکی چگونه رخ می‌دهد؟","body":"در نواحی سرد و کوهستانی، آب باران در شکاف سنگ‌ها جمع و در شب یخ می‌زند؛ یخ منبسط می‌شود و دیوارهٔ شکاف را فشار می‌دهد و تکرار این کار سنگ را می‌شکند. تغییر زیاد دمای شب و روز در بیابان و رشد ریشهٔ گیاهان نیز سنگ‌ها را می‌شکافند.","pageRef":"صفحه ۵۸"},{"type":"note","title":"هوازدگی شیمیایی","body":"در نواحی گرم و مرطوب، سنگ‌ها با آب و اکسیژن و مواد محلول واکنش می‌دهند و ترکیبشان تغییر می‌کند؛ مانند زنگ زدن سنگ‌های آهن‌دار و حل شدن سنگ آهک که در ساختن غارها و چشمه‌های آهکی نقش دارد. رنگ تیرهٔ سنگ‌های کهنه از همین راه پدید می‌آید."},{"type":"note","title":"سرعت هوازدگی در جاهای مختلف","body":"در بیابان‌ها تغییر شدید دمای شب و روز هوازدگی مکانیکی را تقویت می‌کند؛ در نواحی گرم و بارانی هوازدگی شیمیایی بسیار سریع است و در نواحی سرد یخ‌زدن آب در ترک سنگ‌ها مهم‌ترین عامل است. پس نوع اقلیم، نوع هوازدگی را تعیین می‌کند."},{"type":"exam","title":"هوازدگی را تعریف کنید و دو نوع آن را با یک مثال نام ببرید.","body":"هوازدگی یعنی خرد و تغییر دادن سنگ‌ها در محل خودشان. نوع مکانیکی: شکافتن سنگ با یخ زدن آب در ترک‌ها یا تفاوت زیاد دما. نوع شیمیایی: تجزیهٔ سنگ با واکنش به آب و اکسیژن؛ مانند زنگ زدن سنگ‌های آهن‌دار و حل شدن سنگ آهک در آب."},{"type":"exam","title":"چرا در بیابان‌ها سنگ‌ها بیشتر مکانیکی و در نواحی گرم و مرطوب بیشتر شیمیایی هوازده می‌شوند؟","body":"در بیابان هوا خشک است و آب کافی برای واکنش شیمیایی وجود ندارد، اما دمای شب و روز تفاوت زیادی دارد؛ پس سنگ‌ها با انبساط و انقباض پیاپی می‌شکنند. در مناطق گرم و مرطوب، فراوانی آب و گرما واکنش‌های شیمیایی را سرعت می‌دهد و سنگ‌ها تجزیه می‌شوند."}]},{"number":8,"title":"فرسایش","pages":"۶۲ تا ۶۸","contents":[{"type":"answer","title":"فرسایش چیست و چه تفاوتی با هوازدگی دارد؟","body":"هوازدگی فقط سنگ را در جای خود خرد و تغییر می‌دهد؛ اما فرسایش یعنی جابه‌جا کردن این خرده‌سنگ‌ها و خاک با کمک عواملی مانند آب روان، رودها، باد، یخچال‌ها و امواج دریا. پس فرسایش همیشه با حمل و انتقال مواد همراه است.","pageRef":"صفحه ۶۳"},{"type":"answer","title":"برای کاهش فرسایش خاک چه کارهایی انجام دهیم؟","body":"درخت و پوشش گیاهی بکاریم تا ریشه‌ها خاک را نگه دارند؛ روی شیب‌ها با پله‌های کشاورزی به نام تراس، شیب را بشکنیم؛ از چرای بی‌رویهٔ دام جلوگیری کنیم و آب‌های روان را با بند و جوی هدایت کنیم تا خاک با شدت شسته نشود.","pageRef":"صفحه ۶۷"},{"type":"note","title":"باد؛ عامل فرسایش در بیابان","body":"در بیابان‌ها چون پوشش گیاهی کم است، باد خاک و ماسه را برمی‌دارد و جابه‌جا می‌کند و تپه‌های ماسه‌ای و ستون‌های سنگی عجیب می‌سازد؛ مانند کلوت‌های شهداد در کویر لوت و تپه‌های ماسه‌ای جنوب کشور که چهره‌های زیبای فرسایش بادی‌اند."},{"type":"note","title":"یخچال‌های طبیعی","body":"در کوه‌های بلند و قطب‌ها، برف انباشته به یخ تبدیل می‌شود و مانند رودی یخی به آرامی سرازیر می‌گردد. یخچال سنگ‌ها را با خود می‌کشد و دره‌های پهن و گود می‌تراشد؛ پس از آب شدن یخچال، این دره‌های یخچالی باقی می‌مانند."},{"type":"exam","title":"چرا آب، مهم‌ترین عامل فرسایش روی زمین است؟","body":"چون آب فراوان‌ترین و پرقدرت‌ترین عامل جابه‌جایی است: قطره‌های باران به هنگام ریزش، آب‌های روان روی شیب‌ها و رودهای همیشگی، خاک و خرده‌سنگ را در سراسر خشکی‌ها می‌شویند و به دریا می‌برند؛ حتی باران‌های شدید سالانه میلیون‌ها تن خاک را جابه‌جا می‌کنند."},{"type":"exam","title":"پیامد از بین رفتن پوشش گیاهی برای فرسایش چیست؟","body":"ریشهٔ گیاهان خاک را محکم نگه می‌دارند و شاخ و برگ، ضربهٔ قطره‌های باران و سرعت آب روان را کم می‌کنند. با نابودی پوشش گیاهی، خاک بی‌حفاظ می‌ماند؛ باران و باد آن را به سرعت می‌شویند و زمین کم‌حاصل و در نهایت بیابان می‌شود."}]},{"number":9,"title":"آب فراوان، هوای پاک","pages":"۶۹ تا ۷۸","contents":[{"type":"answer","title":"چه مقدار از سطح زمین را آب پوشانده و آب شیرین چقدر است؟","body":"حدود هفتاد درصد سطح زمین را اقیانوس‌ها و دریاها فراگرفته‌اند. اما بیشتر این آب شور است؛ از کل آب‌های زمین حدود نود و هفت درصد شور و تنها حدود سه درصد شیرین است که بیشتر آن نیز در یخچال‌ها و یخ‌های قطبی به شکل یخ ذخیره شده است.","pageRef":"صفحه ۷۰"},{"type":"answer","title":"چرا با وجود فراوانی آب، کمبود آب شیرین داریم؟","body":"چون بخش بزرگ آب زمین شور است و آب شیرین آن هم بیشتر در یخچال‌ها و اعماق زمین پنهان است. رودها، دریاچه‌ها و باران‌ها که در دسترس ما هستند، سهم بسیار کمی دارند؛ از سوی دیگر مصرف بی‌رویه و آلودگی نیز آب قابل استفاده را کمتر می‌کند.","pageRef":"صفحه ۷۲"},{"type":"note","title":"هوا از چه گازهایی ساخته شده است؟","body":"هوا ترکیبی از چند گاز است: حدود هفتاد و هشت درصد نیتروژن (ازت)، حدود بیست و یک درصد اکسیژن که برای تنفس همهٔ جانداران لازم است، و حدود یک درصد گازهای دیگر مانند آرگون و کربن‌دی‌اکسید."},{"type":"note","title":"آلودگی هوا و راه مقابله با آن","body":"سوزاندن سوخت در خودروها و کارخانه‌ها، گرد و غبار و آتش زدن زباله، هوا را آلوده می‌کند. هوای آلوده بیماری تنفسی و قلبی می‌آورد و باران اسیدی می‌سازد. استفاده از حمل‌ونقل عمومی، درخت‌کاری و انرژی‌های پاک، هوا را پاک نگه می‌دارد."},{"type":"exam","title":"راه‌های پاک نگه داشتن هوا را بنویسید.","body":"استفاده از حمل‌ونقل عمومی و دوچرخه به جای خودروی شخصی، بازرسی فنی سالانهٔ خودروها، به کارگیری انرژی‌های پاک مانند انرژی خورشیدی و بادی، کاشت درخت و پرهیز از سوزاندن زباله و برگ درختان. اگر همه در این کارها کوشا باشند، هوای شهر پاک‌تر و سلامت مردم بهتر می‌شود."},{"type":"exam","title":"آب زیرزمینی چیست و چگونه پدید می‌آید؟","body":"بخشی از آب باران و برف به درون خاک نفوذ می‌کند و در لایه‌های دانه‌دار و ترک‌دار سنگ‌ها ذخیره می‌شود؛ به این آب، آب زیرزمینی می‌گویند. مردم از این آب با قنات و چاه استفاده می‌کنند. چون ذخیرهٔ آن به کندی پر می‌شود، باید در برداشت آن صرفه‌جویی کرد."}]},{"number":10,"title":"پراکندگی زیست‌بوم‌های جهان","pages":"۷۹ تا ۸۸","contents":[{"type":"answer","title":"زیست‌بوم چیست؟","body":"زیست‌بوم مجموعه‌ای از جانداران (گیاهان، جانوران و موجودات ریز) و محیط زندگی آن‌ها (خاک، آب، هوا و آب‌وهوا) است که با هم یک واحد طبیعی را می‌سازند؛ مانند یک جنگل، یک بیابان، یک دریاچه یا یک مرتع.","pageRef":"صفحه ۸۰"},{"type":"answer","title":"مهم‌ترین عامل پراکندگی زیست‌بوم‌های جهان چیست؟","body":"آب و هوا؛ یعنی مقدار دما و بارش هر منطقه تعیین می‌کند چه گیاهانی برویند و چه جانورانی زندگی کنند. جایی که بارش فراوان است جنگل و جایی که بارش کم است بیابان پدید می‌آید. زیست‌بوم‌ها نیز بر همین اساس دسته‌بندی می‌شوند.","pageRef":"صفحه ۸۲"},{"type":"note","title":"زیست‌بوم جنگلی","body":"جنگل‌ها در نواحی پرباران می‌رویند. جنگل‌های استوایی مانند آمازون گرم و پرباران‌اند و پرتنوع‌ترین زیست‌بوم جهان‌اند. جنگل‌های معتدل مانند جنگل‌های شمال ایران چهار فصل دارند و درختان آن‌ها در پاییز برگ می‌ریزند."},{"type":"note","title":"زیست‌بوم مرتعی و بیابانی","body":"مرتع یا علفزار جایی است که بارش آن برای جنگل کم و برای بیابان زیاد است؛ پوشش آن علف و بوته است و جانورانی مانند گورخر و آهو دارد. بیابان بسیار خشک است و گیاهانی مانند کاکتوس با ریشه‌های عمیق و برگ‌های ضخیم با کم‌آبی سازگار شده‌اند."},{"type":"exam","title":"چرا تنوع جانداران در جنگل‌های استوایی از همهٔ زیست‌بوم‌ها بیشتر است؟","body":"چون در آن‌ها گرما و بارش فراوان در تمام سال ادامه دارد؛ به همین دلیل گیاهان همیشه سبز می‌مانند و غذای پیوسته برای حشرات، پرندگان، پستانداران و هزاران گونهٔ دیگر فراهم است. هر طبقه از این جنگل نیز زیستگاه گروهی از جانداران است."},{"type":"exam","title":"زیست‌بوم توندرا را توصیف کنید.","body":"توندرا در حاشیهٔ قطب‌ها قرار دارد و زمستان‌های بسیار طولانی و سرد دارد؛ زمین در بیشتر سال پوشیده از یخ و برف است و لایهٔ زیرین خاک همیشه یخ‌زده است. در تابستان کوتاه، خزه و گلسنگ و گیاهان کوچک می‌رویند و پرندگان مهاجر برای زادآوری می‌آیند."}]},{"number":11,"title":"زیست‌بوم‌ها در خطرند","pages":"۸۹ تا ۹۶","contents":[{"type":"answer","title":"عوامل به خطر افتادن زیست‌بوم‌ها کدام‌اند؟","body":"مهم‌ترین عوامل، کارهای انسان است: قطع بی‌رویهٔ درختان، شکار بی‌حساب جانوران، آلودگی آب و هوا و خاک، تغییر کاربری زمین‌ها و ساخت‌وساز در زیستگاه‌ها. عوامل طبیعی مانند خشکسالی‌های طولانی نیز به این آسیب‌ها می‌افزایند.","pageRef":"صفحه ۹۰"},{"type":"answer","title":"برای حفاظت از زیست‌بوم‌ها چه باید کرد؟","body":"از جنگل‌ها و مراتع به‌جا و درست استفاده کنیم و به جای درختان قطع‌شده، نهال بکاریم؛ از شکار بی‌رویه پرهیز و قانون شکار را رعایت کنیم؛ زباله را در طبیعت رها نکنیم و از مناطق حفاظت‌شده و پارک‌های ملی پشتیبانی کنیم.","pageRef":"صفحه ۹۴"},{"type":"note","title":"پیامد نابودی جنگل‌ها","body":"با از بین رفتن جنگل، هزاران گونهٔ گیاهی و جانوری خانه‌شان را از دست می‌دهند؛ خاک فرسایش می‌یابد، سیلاب‌ها شدت می‌گیرند و چون درختان کربن‌دی‌اکسید جذب می‌کنند، گرم شدن زمین نیز شدیدتر می‌شود."},{"type":"note","title":"گونه‌های در خطر انقراض ایران","body":"یوزپلنگ ایرانی، پلنگ ایرانی، هوبره و فک خزری از جانداران در خطر انقراض ایران‌اند. برای نجات آن‌ها مناطق حفاظت‌شده تعیین شده و شکارشان ممنوع است؛ مثلاً پناهگاه حیات وحش توران زیستگاه اصلی یوزپلنگ ایرانی است."},{"type":"exam","title":"دریاچهٔ ارومیه چه سرنوشتی پیدا کرد و این رویداد چه درسی دارد؟","body":"دریاچهٔ ارومیه پیش‌تر یکی از بزرگ‌ترین دریاچه‌های شور جهان بود، اما با برداشت بی‌رویه از رودها و آب‌های زیرزمینی حوضه، خشکسالی‌های پیاپی و ساخت سدها، کوچک شد و بخش زیادی از آن خشکید. این رویداد نشان داد استفادهٔ نادرست از طبیعت چه زیانی دارد."},{"type":"exam","title":"منطقهٔ حفاظت‌شده چیست و چه کمکی به زیست‌بوم‌ها می‌کند؟","body":"منطقهٔ حفاظت‌شده پهنه‌ای از طبیعت است که دولت برای حفظ گونه‌های جانوری و گیاهی آن را زیر حفاظت می‌گیرد؛ در آن شکار و ساخت‌وساز محدود یا ممنوع است. پارک ملی گلستان نمونه‌ای از آن است که زیستگاه پلنگ ایرانی را نگه داشته است."}]},{"number":12,"title":"ساکنان کرهٔ زمین","pages":"۹۷ تا ۱۰۴","contents":[{"type":"answer","title":"جمعیت جهان چگونه پراکنده شده است؟","body":"پراکندگی جمعیت بسیار نابرابر است؛ شرق و جنوب آسیا با کشورهای پرجمعیتی مانند چین و هند، اروپای غربی و شرق آمریکای شمالی پرجمعیت‌ترین مناطق جهان‌اند. اما بیابان‌ها، قطب‌ها، جنگل‌های انبوه استوایی و کوهستان‌های بلند و سرد کم‌جمعیت‌اند.","pageRef":"صفحه ۹۸"},{"type":"answer","title":"عوامل مؤثر بر پراکندگی جمعیت کدام‌اند؟","body":"آب و هوای معتدل، فراوانی آب، خاک حاصلخیز برای کشاورزی، منابع معدنی، راه‌های آسان، کار و درآمد و امنیت، مردم را جذب می‌کند؛ اما سرمای شدید، گرما و خشکی بیابان، ارتفاع زیاد و جنگ‌ها، سکونت را دشوار می‌کند و جمعیت را می‌کاهند.","pageRef":"صفحه ۱۰۰"},{"type":"note","title":"تراکم جمعیت","body":"تراکم جمعیت یعنی شمار انسان‌ها در هر کیلومتر مربع. برای محاسبهٔ آن، جمعیت را بر مساحت تقسیم می‌کنیم؛ مثلاً کشوری با جمعیت هشتاد میلیون نفر و مساحت یک میلیون و ششصد هزار کیلومتر مربع، تراکم پنجاه نفر در هر کیلومتر مربع دارد."},{"type":"note","title":"مهاجرت روستاییان به شهر","body":"بسیاری از روستاییان برای کار و درآمد بهتر و امکانات آموزشی و درمانی به شهرها کوچ می‌کنند. این مهاجرت جمعیت شهر را بیش از گنجایش آن می‌کند و سکونتگاه‌های غیررسمی، بیکاری و فشار بر خدمات شهری پدید می‌آورد."},{"type":"exam","title":"چرا مناطقی مانند قطب‌ها و بیابان‌های بزرگ کم‌جمعیت‌اند؟","body":"در قطب‌ها سرما و یخبندان شدید و در بیابان‌ها کم‌آبی و گرمای شدید، کشاورزی و زندگی روزمره را تقریباً ناممکن می‌کند. در کوهستان‌های بلند هوای سرد و شیب تند و در جنگل‌های استوایی انبوه نیز سختی رفت‌وآمد و بیماری‌ها مانع سکونت فراوان است."},{"type":"exam","title":"دو کشور پرجمعیت جهان را نام ببرید و دلیل پرجمعیت بودن آن‌ها را بنویسید.","body":"چین و هند پرجمعیت‌ترین کشورهای جهان‌اند. هر دو در جنوب و شرق آسیا قرار دارند؛ زمین‌های پهناور و حاصلخیز، رودهای بزرگ، تاریخ کهن کشاورزی و بازرگانی و فرهنگ تشویق به فرزندآوری در گذشته، جمعیت بسیار بزرگ این دو کشور را ساخته است."}]},{"number":13,"title":"جهان نابرابر","pages":"۱۰۵ تا ۱۱۲","contents":[{"type":"answer","title":"کشورهای توسعه‌یافته و توسعه‌نیافته چه تفاوتی دارند؟","body":"در کشورهای توسعه‌یافته مانند کشورهای اروپای غربی، ژاپن و کانادا، درآمد و سواد و امید به زندگی بالا و خدمات بهداشتی و آموزشی خوب است. در کشورهای توسعه‌نیافته و در حال توسعه، بخش بزرگی از مردم فقیرند و سواد، سلامت، کارخانه و راه کمتر است.","pageRef":"صفحه ۱۰۶"},{"type":"answer","title":"شاخص‌های سنجش پیشرفت و توسعهٔ کشورها کدام‌اند؟","body":"درآمد سرانه و توان تولید ثروت، امید به زندگی و سلامت مردم، نرخ باسوادی و سال‌های تحصیل، و دسترسی به آب سالم، برق، راه و اینترنت. با مقایسهٔ همین شاخص‌ها می‌توان فهمید که هر کشور در چه اندازه‌ای توسعه یافته است.","pageRef":"صفحه ۱۰۸"},{"type":"note","title":"عوامل نابرابری میان کشورها","body":"استعمار در گذشته و غارت منابع، جنگ‌های داخلی و مرزی، خشکسالی و قحطی، بدهی سنگین به کشورهای دیگر و مدیریت نادرست اقتصادی، کشورهای جنوب جهان را عقب نگه داشته است؛ در حالی که کشورهای صنعتی از همین وضع سود برده‌اند."},{"type":"note","title":"جهانِ شمال و جنوب","body":"روی نقشهٔ جهان، کشورهای ثروتمند و توسعه‌یافته بیشتر در نیم‌کرهٔ شمالی قرار دارند (اروپا، آمریکای شمالی و شمال آسیا) و کشورهای فقیرتر در جنوب (آفریقا، جنوب آسیا و آمریکای لاتین)؛ به همین دلیل از تقسیم جهان به شمال و جنوب سخن می‌گوییم."},{"type":"exam","title":"چرا گفته می‌شود آموزش، کلید توسعه است؟","body":"کشوری که مردمش باسواد و متخصص باشند، می‌تواند فناوری بسازد، بیماری‌ها را درمان کند، تولید را بیشتر و اقتصاد را قوی‌تر کند. به همین دلیل کشورهای توسعه‌یافته بخش بزرگی از درآمد خود را صرف مدارس و دانشگاه‌ها می‌کنند و کشورهای فقیر باید بر آموزش سرمایه‌گذاری کنند."},{"type":"exam","title":"برای کاهش نابرابری جهان چه راه‌هایی پیشنهاد می‌کنید؟","body":"کمک‌های بلاعوض و وام‌های کم‌بهره به کشورهای فقیر، تجارت عادلانه با قیمت منصفانه برای مواد خام، بخشش بدهی‌های سنگین، سرمایه‌گذاری در مدارس و بیمارستان‌های آن کشورها و کمک به برقراری صلح و پایان جنگ‌ها؛ تا مردم همان کشورها خودشان توسعه را بسازند."}]},{"number":14,"title":"آریایی‌ها و مادها","pages":"۱۱۳ تا ۱۲۲","contents":[{"type":"answer","title":"آریایی‌ها چه کسانی بودند و از کجا به فلات ایران آمدند؟","body":"آریایی‌ها گروهی از اقوام بودند که در دشت‌های جنوب شرقی اروپا و آسیای مرکزی زندگی می‌کردند. از حدود چهار هزار سال پیش، گروه‌هایی از آن‌ها به تدریج وارد فلات ایران شدند و از دامداری و کوچ‌نشینی به کشاورزی و شهرنشینی روی آوردند.","pageRef":"صفحه ۱۱۴"},{"type":"answer","title":"گروه‌های بزرگ آریاییِ وارد فلات ایران کدام‌اند و هر گروه کجا ساکن شد؟","body":"سه گروه بزرگ: مادها در شمال غربی و مرکز زاگرس که هگمتانه (همدان امروز) پایتختشان شد؛ پارس‌ها در جنوب و منطقهٔ فارس؛ و پارت‌ها در شمال شرق فلات ایران در سرزمین خراسان. از میان آن‌ها، مادها نخستین حکومت ایرانی را بنیان گذاشتند.","pageRef":"صفحه ۱۱۶"},{"type":"note","title":"نخستین حکومت ایرانی","body":"مادها با رهبری دیاکو حکومتی منظم پدید آوردند و پایتختشان هگمتانه با دیوارهای هفت‌گانه معروف بود. آن‌ها با همکاری بابلی‌ها، دولت نیرومند آشور را شکست دادند و سرانجام به دست پارس‌ها و کوروش بزرگ از قدرت کنار رفتند."},{"type":"note","title":"دستاوردهای مادها","body":"مادها هنر معماری، ستون‌سازی و ساخت دیوارهای بلند را گسترش دادند و لباس مادی با نوارهای رنگی مشهور شد. آن‌ها فرهنگ و زبان ایرانی را در فلات ایران تثبیت کردند و الگوی حکومت مرکزی را به هخامنشیان سپردند."},{"type":"exam","title":"چرا هگمتانه شهر مهمی به شمار می‌آمد؟","body":"هگمتانه پایتخت مادها و از کهن‌ترین شهرهای ایران است که شهر همدان امروزی روی آن ساخته شده است. نام آن به معنای محل گردهمایی است و دیوارهای تو در توی هفت‌گانه با برج‌های رنگارنگ، آن را به شگفتی جهان آن روز بدل کرده بود."},{"type":"exam","title":"پارس‌ها و پارت‌ها بعدها چه سرنوشتی یافتند؟","body":"پارس‌ها با کوروش بزرگ امپراتوری بزرگ هخامنشی را بنیان گذاشتند و بر مادها و سرزمین‌های بسیار فرمان راندند. پارت‌ها نیز پس از سلوکیان، حکومت نیرومند اشکانی را پدید آوردند که نزدیک پانصد سال دوام آورد و رقیب روم بود."}]},{"number":15,"title":"هخامنشیان","pages":"۱۲۳ تا ۱۳۴","contents":[{"type":"answer","title":"کوروش بزرگ چه کارهای مهمی انجام داد؟","body":"کوروش دوم (کبیر) در حدود ۵۵۰ سال پیش از میلاد با شکست دادن مادها سلسلهٔ هخامنشی را بنیان گذاشت؛ سپس لیدی و بابل را نیز فرمانبردار کرد و نخستین امپراتوری بزرگ جهان را پدید آورد. او مردم را در دین و آیین خود آزاد گذاشت و منشور او از نخستین اعلامیه‌های حقوق بشر است.","pageRef":"صفحه ۱۲۴"},{"type":"answer","title":"داریوش برای ادارهٔ سرزمین پهناور هخامنشی چه تدبیرهایی اندیشید؟","body":"کشور را به ایالت‌هایی به نام ساتراپی تقسیم کرد که هر یک فرماندار و مالیات معینی داشت؛ راه شاهی را از شوش تا سارد ساخت و چاپارخانه‌ها برپا کرد تا نامه‌ها به سرعت برسد؛ یکای پول یکسان (دریک) و وزن و مقیاس واحد قرار داد و سپاه جاودان را برای امنیت نگه داشت.","pageRef":"صفحه ۱۲۸"},{"type":"note","title":"تخت جمشید","body":"داریوش بزرگ در دامنهٔ کوه رحمت در مرودشت فارس، تخت جمشید (پارسه) را ساخت؛ کاخی باشکوه برای جشن نوروز و پذیرش نمایندگان کشورها. در پلکان‌های آن، نقش‌برجسته‌هایی از مردمان گوناگون دیده می‌شود که با آرامش هدایا آورده‌اند و هیچ صحنهٔ جنگی در آن حجاری نشده است."},{"type":"note","title":"راه شاهی و چاپار","body":"راه شاهی شاهراه اصلی امپراتوری بود که در کنار آن ایستگاه‌ها و مهمانخانه‌ها ساخته شده بود. پیک‌های دولتی به نام چاپار با اسب‌های تازه، نامه‌ها را به سرعت می‌رساندند؛ گفته می‌شود پیام شوش تا سارد در حدود یک هفته می‌رسید."},{"type":"exam","title":"منشور کوروش درباره چیست و چرا اهمیت دارد؟","body":"منشور کوروش استوانه‌ای گلی است که در آن کوروش پس از فتح بابل اعلام کرد مردم در انتخاب دین و آیین آزادند و نباید به آنان ستم شود و بنده‌ها را آزاد کرد. چون از احترام به حقوق انسان‌ها سخن می‌گوید، از آن به عنوان نخستین اعلامیهٔ حقوق بشر یاد می‌شود."},{"type":"exam","title":"امپراتوری هخامنشی چگونه و به دست چه کسی پایان یافت؟","body":"جنگ‌های طولانی شاهان هخامنشی با یونانیان، نیروی کشور را فرسوده کرد و آشوب درون دربار فرمانروایی را ضعیف ساخت. سرانجام اسکندر مقدونی سپاه داریوش سوم را شکست داد و در سال ۳۳۰ پیش از میلاد تخت جمشید را به آتش کشید؛ با این رویداد حکومت هخامنشی پایان یافت."}]},{"number":16,"title":"اشکانیان و ساسانیان","pages":"۱۳۵ تا ۱۴۸","contents":[{"type":"answer","title":"اشکانیان چگونه به قدرت رسیدند و چه ویژگی‌ای داشتند؟","body":"پارت‌ها از آریایی‌های شمال شرق ایران بودند؛ اشک (آرساکس) در حدود ۲۵۰ سال پیش از میلاد بر سلوکیان پیروز شد و سلسلهٔ اشکانی را بنیان گذاشت. اشکانیان نزدیک پانصد سال حکومت کردند، سال‌ها رقیب سرسخت امپراتوری روم بودند و از پیشروی آن به شرق جلوگیری کردند.","pageRef":"صفحه ۱۳۶"},{"type":"answer","title":"اردشیر بابکان چه کرد و حکومت ساسانی چه ویژگی‌هایی داشت؟","body":"اردشیر بابکان در سال ۲۲۴ میلادی اشکانیان را شکست داد و سلسلهٔ ساسانی را بنیان گذاشت. پایتخت آن‌ها تیسفون بود، زبان رسمی پهلوی و دین رسمی زرتشتی شد. ساسانیان کشور را با سازمان‌های منظم اداره می‌کردند و در هنر و معماری مهارت فراوان داشتند.","pageRef":"صفحه ۱۴۰"},{"type":"note","title":"دانشگاه جندی‌شاپور","body":"در زمان ساسانیان، دانشگاه جندی‌شاپور در خوزستان مشهورترین مرکز علم و پزشکی جهان شد؛ پزشکان ایرانی، یونانی و هندی در آن تدریس می‌کردند و بیمارستان آن الگوی درمانگاه‌های بعدی شد. این دانشگاه تا آغاز دورهٔ اسلامی نیز فعال ماند."},{"type":"note","title":"خسرو انوشیروان","body":"خسرو اول معروف به انوشیروان دادگستر، مشهورترین شاه ساسانی است؛ او مالیات‌ها را منظم کرد، راه‌ها و امنیت را برقرار ساخت و دادگستری او ضرب‌المثل شد. در زمان او تمدن ساسانی به اوج شکوفایی علمی و فرهنگی رسید."},{"type":"exam","title":"چرا دورهٔ اشکانیان برای ایران اهمیت داشت؟","body":"اشکانیان نزدیک پانصد سال بر ایران حکومت کردند، در برابر روم ایستادند و جادهٔ ابریشم را امن نگه داشتند؛ به همین دلیل بازرگانی میان شرق و غرب رونق گرفت. هنر آن‌ها آمیزه‌ای از سبک ایرانی و یونانی بود و فرهنگ ایرانی را پاسداشتند."},{"type":"exam","title":"حکومت ساسانی چگونه و در چه زمانی پایان یافت؟","body":"جنگ‌های طولانی با روم، ناآرامی‌های درونی، طاعون و قحطی، نیروی ساسانیان را فرسوده بود. در همین هنگام اعراب مسلمان به ایران حمله کردند؛ پس از شکست ایرانیان در قادسیه و نهاوند، حدود سال ۶۵۱ میلادی آخرین شاه یعنی یزدگرد سوم کشته شد و ساسانیان از میان رفتند."}]},{"number":17,"title":"زندگی جمعی","pages":"۱۴۹ تا ۱۵۸","contents":[{"type":"answer","title":"مزایای زندگی جمعی چیست؟","body":"در زندگی جمعی کارها تقسیم می‌شود و هر کس به کاری که بهتر می‌تواند می‌پردازد؛ نیازها با کمک متقابل تأمین می‌شود، امنیت بیشتر است، غم‌ها و شادی‌ها تقسیم می‌شوند و با هم‌فکری، کارهای بزرگ‌تر ممکن می‌شود. به همین دلیل انسان‌ها از دیرباز در گروه زندگی کرده‌اند.","pageRef":"صفحه ۱۵۰"},{"type":"answer","title":"شهرنشینی چگونه و کجا آغاز شد؟","body":"با کشف کشاورزی، انسان‌ها توانستند در کنار رودها یک‌جا بمانند و مازاد غذا ذخیره کنند؛ دیگر همه مجبور به کشاورزی نبودند و برخی پیشه‌ور، بازرگان و حاکم شدند. نخستین شهرها حدود پنج تا شش هزار سال پیش در میان‌رودان (بین‌النهرین) پدید آمدند.","pageRef":"صفحه ۱۵۲"},{"type":"note","title":"تقسیم کار","body":"تقسیم کار یعنی هر کس بخشی از کار را انجام دهد؛ مثلاً در روستا یکی کشاورز، یکی دامدار و یکی نجار است. با این روش کار سریع‌تر و با کیفیت‌تر انجام می‌شود و مردم از تجربهٔ یکدیگر بهره می‌گیرند؛ شهرها نیز بر پایهٔ همین تقسیم کار پدید آمدند."},{"type":"note","title":"نقش آب در پیدایش شهرها","body":"نخستین شهرها همه در کنار رودهای بزرگ پدید آمدند: دجله و فرات در میان‌رودان، نیل در مصر و رود سند در هند. رود، آب کشاورزی و آشامیدنی می‌داد، راه ترابری بود و مازاد غذا، تجارت و پیشه‌های تازه را ممکن می‌کرد."},{"type":"exam","title":"چرا انسان موجودی اجتماعی است؟","body":"زیرا انسان به‌تنهایی نمی‌تواند همهٔ نیازهای خود را برآورد؛ برای خوراک، پوشاک، مسکن، آموزش و حتی گفت‌وگو به دیگران نیاز دارد. بقای انسان همواره به همکاری وابسته بوده است؛ از شکار گروهی انسان‌های نخستین تا کارخانه‌ها و بیمارستان‌های امروز."},{"type":"exam","title":"مازاد غذا چه نقشی در پیدایش شهرها داشت؟","body":"وقتی کشاورزان بیش از نیاز خود محصول به دست می‌آوردند، می‌توانستند کسانی را که کشاورز نبودند، مانند صنعتگران، بازرگانان و نگهبانان تغذیه کنند؛ همین امکان، پیدایش پیشه‌های تازه، بازار، معبد و حکومت را فراهم کرد و روستاها به تدریج شهر شدند."}]},{"number":18,"title":"کاهش چالش‌های زندگی جمعی با قوانین و مقررات","pages":"۱۵۹ تا ۱۷۲","contents":[{"type":"answer","title":"چرا در زندگی جمعی اختلاف پیش می‌آید؟","body":"چون مردم خواسته‌ها، عقاید و سلیقه‌های متفاوتی دارند و منابع و امکانات محدود است؛ مثلاً همه می‌خواهند خیابان‌ها آزاد و هوا پاک باشد اما هر کس به سلیقهٔ خود رفتار می‌کند. اگر قاعده‌ای نباشد، همین تفاوت‌ها به دعوا و بی‌نظمی می‌انجامد.","pageRef":"صفحه ۱۶۰"},{"type":"answer","title":"قوانین و مقررات چگونه چالش‌های زندگی جمعی را کم می‌کنند؟","body":"قوانین برای همه یکسان مشخص می‌کند که چه کاری درست و چه کاری نادرست است؛ مثلاً قانون رانندگی سرعت و سمت حرکت را تعیین می‌کند و ترافیک و تصادف را کم می‌کند؛ قانون حفاظت از محیط زیست، آلوده کردن هوا و آب را ممنوع می‌سازد. به این ترتیب حق همه پاس داشته می‌شود.","pageRef":"صفحه ۱۶۴"},{"type":"note","title":"قانون چیست؟","body":"قانون مجموعه‌ای از قواعد است که برای همه یکسان و الزام‌آور است و در ایران به تصویب مجلس شورای اسلامی می‌رسد. قانون، مرز حق و تکلیف هر فرد را روشن می‌کند تا آزادی کسی به آزادی و حقوق دیگران آسیب نزند."},{"type":"note","title":"نمونه‌هایی از قوانین زندگی شهری","body":"رعایت خط عابر پیاده و چراغ راهنمایی، نداشتن دود و صدای اضافی خودرو، تفکیک زباله، رعایت سکوت در ساعات استراحت همسایه‌ها و رعایت نوبت در صف‌ها. این قواعد کوچک، زندگی شهر را آرام و ایمن نگه می‌دارد."},{"type":"exam","title":"اگر در محل زندگی شما قوانین و مقررات وجود نداشت، چه مشکلاتی پیش می‌آمد؟ (دو مورد)","body":"در خیابان‌ها بدون قوانین رانندگی، تصادف و ترافیک بی‌پایان می‌شد؛ در توزیع آب و برق و نان هر کس می‌کوشید سهم بیشتری ببرد و دعوا شکل می‌گرفت؛ آلودگی و ساخت‌وساز بی‌حساب، محیط زندگی را ناامن و نامناسب می‌کرد؛ یعنی حیات جمعی عملاً ناممکن می‌شد."},{"type":"exam","title":"نقش شوراهای شهر و شهرداری در کاهش چالش‌های شهر چیست؟","body":"شورای شهر که مردم آن را انتخاب می‌کنند، برنامه‌های شهر را تصویب می‌کند و شهرداری آن‌ها را اجرا می‌کند؛ مانند نگهداری معابر و پارک‌ها، جمع‌آوری زباله، توسعهٔ حمل‌ونقل عمومی و نظارت بر ساخت‌وساز. این نهادها با قوانین شهری، زندگی روزمره را منظم‌تر و آسان‌تر می‌کنند."}]},{"number":19,"title":"پایبندی به قوانین و مقررات","pages":"۱۷۳ تا ۱۸۶","contents":[{"type":"answer","title":"شهروند نمونه چه ویژگی‌هایی دارد؟","body":"شهروند نمونه قوانین را حتی وقتی کسی او را نمی‌بیند رعایت می‌کند؛ به حقوق دیگران احترام می‌گذارد، در انتخابات و امور محله مشارکت می‌کند، در حفظ پاکیزگی شهر می‌کوشد، به همسایگان و نیازمندان کمک می‌کند و مسئولیت رفتار خود را می‌پذیرد.","pageRef":"صفحه ۱۷۴"},{"type":"answer","title":"پیامدهای بی‌توجهی به قوانین و مقررات چیست؟","body":"بی‌قانونی زندگی جمعی را مختل می‌کند: بی‌توجهی به قانون رانندگی، جان مردم را در تصادف‌ها می‌گیرد؛ دور زدن قانون کار و مالیات، حق دیگران را می‌خورد و اعتماد عمومی را از بین می‌برد. کسی که قانون را می‌شکند، علاوه بر مجازات، آبرو و اعتماد مردم را هم از دست می‌دهد.","pageRef":"صفحه ۱۷۸"},{"type":"note","title":"حقوق و تکالیف شهروندی","body":"هر شهروند هم حق دارد و هم تکلیف؛ حق تحصیل، کار، سلامت و امنیت از حقوق اوست و پایبندی به قانون، پرداخت مالیات، حفظ محیط زیست و احترام به دیگران از تکلیف‌هایش. شهروند خوب هم از حقوق خود دفاع می‌کند و هم تکلیف‌هایش را به‌جا می‌آورد."},{"type":"note","title":"قانون‌مندی از مدرسه آغاز می‌شود","body":"رعایت آیین‌نامهٔ مدرسه، احترام به معلم و هم‌کلاسی، نظم در صف و مراقبت از وسایل مدرسه، تمرین زندگی قانون‌مند است. کسی که از کودکی به قواعد جمع پایبند باشد، در بزرگسالی نیز شهروندی مسئول و قانون‌پذیر خواهد بود."},{"type":"exam","title":"چرا رعایت قانون باید در نبود پلیس هم ادامه یابد؟","body":"زیرا هدف قانون، برقراری نظم و امنیت و پاسداشت حق همه است نه ترس از جریمه. شهروند واقعی برای منافع جمع، قانون را از سر درک و مسئولیت‌پذیری رعایت می‌کند؛ اگر همه فقط در دید پلیس قانون‌مند باشند، به‌محض غیبت پلیس بی‌نظمی همه‌جا را فرا می‌گیرد و همه زیان می‌بینند."},{"type":"exam","title":"پایبندی به قانون چه فوایدی برای خود شخص و برای جامعه دارد؟","body":"برای شخص: آرامش خاطر، نداشتن جریمه و مجازات، احترام مردم و اعتبار اجتماعی. برای جامعه: کاهش تصادف و جرم، صرفه‌جویی در وقت و هزینه‌ها، اعتماد میان مردم و پیشرفت کشور؛ زیرا جامعه‌ای که قانون در آن حرف اول است، امن است و سرمایه و متخصصان خود را نگه می‌دارد."}]}]},{"title":"عربی هفتم","subject":"عربی","description":"جواب تمرین‌ها، نکات قواعد و سوالات امتحانی همه درس‌های کتاب عربی هفتم","color":"teal","icon":"languages","chapters":[{"number":1,"title":"لِنَتَكَلَّمُ بِالعَرَبِيَّةِ","pages":"۲ تا ۱۶","contents":[{"type":"answer","title":"تمرین: جاهای خالی را با «أنا» و «أنتَ/أنتِ» کامل کنید.","body":"«أنا عَلِيٌّ وَ أَنتَ حَسَنٌ» یعنی من علی هستم و تو حسن هستی. برای سخن گفتن از خود همیشه «أنا» می‌آوریم؛ برای مخاطب پسر «أنتَ» و برای مخاطب دختر «أنتِ». مثال کتاب: «مِن أنتِ يا فاطِمَة؟» تو کیستی ای فاطمه؟","pageRef":"صفحه ۶"},{"type":"answer","title":"تمرین: نام‌های زیر را به دو گروه دخترانه و پسرانه تقسیم کنید: فاطِمَة، أَمين، مَريَم، عَلِيّ، عائِشَة، مُحمَّد","body":"نام‌های دخترانه: فاطِمَة، مَريَم، عائِشَة. نام‌های پسرانه: أَمين، عَلِيّ، مُحمَّد. قاعده: نام‌های مؤنث در عربی بیشتر با «ة» تمام می‌شوند، پس فاطِمَة، مَريَم و عائِشَة دخترانه‌اند و بقیه پسرانه.","pageRef":"صفحه ۸"},{"type":"note","title":"مذکر و مؤنث در نام‌های عربی","body":"در عربی هر اسمی یا مذکر است یا مؤنث. بیشتر اسم‌های مؤنث با «ة» پایان می‌یابند.\nمثال: طالِب / طالِبَة، مُعَلِّم / مُعَلِّمَة.\nمَريَمُ طالِبَةٌ (مریم دانش‌آموز دختر است) و أَحمَدُ طالِبٌ (احمد دانش‌آموز پسر است)."},{"type":"note","title":"أنَا وَ أنتَ؛ کلید گفت‌وگو","body":"برای معرفی خود می‌گوییم: «أنا» مانند «أنا مِن إيران» من از ایران هستم.\nاز مخاطب پسر می‌پرسیم «مَن أنتَ؟» تو کیستی؟ و از مخاطب دختر «مَن أنتِ؟».\nاین سه ضمیر، کلید همه گفت‌وگوهای این کتاب است؛ پس خوب تلفظشان کنید."},{"type":"exam","title":"به عربی بگویید: «من مریم هستم و تو فاطمه هستی».","body":"پاسخ: «أنا مَريَمُ وَ أَنتِ فاطِمَة». چون مخاطب دختر است، ضمیر «أنتِ» به کار می‌رود؛ اگر مخاطب پسر بود می‌گفتیم «أنتَ». نام‌های مؤنث نیز مانند فاطِمَة با «ة» نوشته می‌شوند."},{"type":"exam","title":"اسم‌های زیر را مؤنث کنید و معنی کنید: طالِب، مُعَلِّم، مُسافِر","body":"پاسخ: طالِبَة (دانش‌آموز دختر)، مُعَلِّمَة (معلم زن)، مُسافِرَة (زن مسافر). برای مؤنث کردن بیشتر اسم‌های عربی، «ة» به پایان آن‌ها می‌افزاییم؛ همان قاعده‌ای که نام دخترها با آن ساخته می‌شود."}]},{"number":2,"title":"هٰذا - هٰذِهِ","pages":"۱۷ تا ۳۰","contents":[{"type":"answer","title":"تمرین: ترجمه کنید: «هٰذا كِتابٌ وَ هٰذِهِ سَيّارَةٌ»","body":"«هٰذا كِتابٌ» یعنی این کتاب است و «هٰذِهِ سَيّارَةٌ» یعنی این خودرو است. «هٰذا» برای اشاره به مذکر و «هٰذِهِ» برای اشاره به مؤنث به کار می‌رود؛ كِتاب مذکر است و سَيّارَه مؤنث.","pageRef":"صفحه ۱۹"},{"type":"answer","title":"تمرین: جاهای خالی را با هٰذا یا هٰذِهِ پر کنید: ....... جَبَلٌ، ....... شَجَرَةٌ","body":"«هٰذا جَبَلٌ» این کوه است و «هٰذِهِ شَجَرَةٌ» این درخت است. جَبَل با «ة» تمام نشده پس مذکر است و هٰذا می‌گیرد؛ شَجَرَة با «ة» است پس مؤنث است و هٰذِهِ می‌گیرد.","pageRef":"صفحه ۲۱"},{"type":"note","title":"اسم اشاره هٰذا و هٰذِهِ","body":"«هٰذا» یعنی این و برای مذکر است: هٰذا رَجُلٌ، هٰذا بابٌ.\n«هٰذِهِ» یعنی این و برای مؤنث است: هٰذِهِ بِنتٌ، هٰذِهِ نافِذَةٌ.\nبرای اشاره به دور: «ذٰلِكَ» آن (مذکر) و «تِلكَ» آن (مؤنث): ذٰلِكَ جَبَلٌ عالٍ آن کوه بلند است."},{"type":"note","title":"هٰذَانِ؛ اشاره به دو چیز","body":"برای اشاره به دو مذکر می‌گوییم «هٰذَانِ»: هٰذَانِ طالِبانِ این دو پسر دانش‌آموزند.\nبرای دو مؤنث «هٰتَانِ»: هٰتَانِ طالِبَتانِ.\nپایان اسم هم با «انِ» مثنی می‌شود؛ این نخستین دیدار شما با مثنی است."},{"type":"exam","title":"ترجمه کنید: «ذٰلِكَ مَسجِدٌ كَبيرٌ وَ تِلكَ سَاعَةٌ جَميلَةٌ»","body":"ترجمه: آن مسجد بزرگی است و آن ساعت زیبایی است. «ذٰلِكَ» برای مذکر دور (مَسجِد) و «تِلكَ» برای مؤنث دور (ساعَة) به کار رفته است. «كَبيرٌ» و «جَميلَةٌ» صفت‌های بعد از اسم‌اند و از جنس آن‌ها پیروی می‌کنند."},{"type":"exam","title":"با «هٰذَانِ» و «هٰذِهِ» دو جمله بسازید و ترجمه کنید.","body":"پاسخ: «هٰذَانِ طالِبانِ مُجتَهِدانِ وَ هٰذِهِ مُعَلِّمَةٌ رَقيقَةٌ». هٰذَانِ با مثنی مذکر (طالِبانِ) و هٰذِهِ با مؤنث (مُعَلِّمَة) می‌آید؛ صفت مثنی هم با «انِ» می‌آید و صفت مؤنث با «ة»."}]},{"number":3,"title":"الجامِع","pages":"۳۱ تا ۴۴","contents":[{"type":"answer","title":"تمرین: جمع کلمه‌های زیر را بنویسید: مَسجِد، جامِع، كِتاب، وَرَقَة","body":"مَسجِد ← مَساجِد، جامِع ← جَوامِع، كِتاب ← كُتُب، وَرَقَة ← وَرَقات. دو جمع نخست «جمع مکسر» هستند یعنی ساختمان کلمه عوض می‌شود؛ جمع مؤنث با «ات» سالم و بی‌تغییر ساخته می‌شود.","pageRef":"صفحه ۳۳"},{"type":"answer","title":"تمرین: ترجمه کنید: «في الجامِعِ مِنبَرٌ وَ محرابٌ»","body":"ترجمه: در جامع، منبری و محرابی است. «في» حرف جر است و اسم بعد از آن مجرور می‌شود: الجامِعِ. جمله با «في» آغاز شده و معنی «وجود دارد» را می‌رساند؛ در ترجمه می‌گوییم: در مسجد جامع منبری و محرابی است.","pageRef":"صفحه ۳۵"},{"type":"note","title":"مفرد و جمع مکسر","body":"جمع مکسر با تغییر ساختمان کلمه ساخته می‌شود.\nمثال: كِتاب ← كُتُب، جَبَل ← جِبال، مَسجِد ← مَساجِد، نَهر ← أَنهار.\nبرای دانستن جمع مکسر باید واژه‌ها را از واژه‌نامه یاد بگیریم؛ قاعده ثابتی برای آن وجود ندارد."},{"type":"note","title":"حرف جر «في» و اسم مجرور","body":"«في» یعنی در. اسم بعد از «في» پایانش به «ـِ» تغییر می‌کند و مجرور نامیده می‌شود: في البَيتِ، في الجامِعِ، في المَدينَةِ.\nمثال: «في المَسجِدِ سَجادَةٌ» در مسجد فرشی است. این نخستین حرف جرِ کتاب است."},{"type":"exam","title":"جمع کلمه‌های باب، بنت و شجره را بنویسید و نوع جمع را بگویید.","body":"پاسخ: باب ← أَبْواب (جمع مکسر)، بِنت ← بَنات (جمع مؤنث سالم)، شَجَرَة ← شَجَرات (جمع مؤنث سالم). جمعی که با «ات» ساخته می‌شود سالم است چون خود کلمه تغییری نمی‌کند؛ بقیه مکسر است."},{"type":"exam","title":"ترجمه کنید: «في المَدرَسَةِ مُعَلِّمَةٌ وَ طالِباتٌ»","body":"ترجمه: در مدرسه معلمی (زن) و دانش‌آموزان دختری هستند. «المَدرَسَةِ» پس از في مجرور شده است. طالِبات جمع مؤنث سالم است و با «هٰذِهِ» همراه می‌شود نه «هٰذا»؛ مُعَلِّمَةٌ نیز مفرد مؤنث است."}]},{"number":4,"title":"أَنا جاهِز","pages":"۴۵ تا ۵۸","contents":[{"type":"answer","title":"تمرین: ترجمه کنید: «هُوَ جاهِزٌ وَ هِيَ مَشغولَةٌ»","body":"ترجمه: او آماده است و او مشغول است. «هُوَ» ضمیر مذکر است پس صفت «جاهِزٌ» مذکر می‌آید و «هِيَ» ضمیر مؤنث است پس «مَشغولَةٌ» با «ة» می‌آید. صفت همیشه از جنس موصوف پیروی می‌کند.","pageRef":"صفحه ۴۷"},{"type":"answer","title":"تمرین: ترجمه کنید: «نَحنُ مُجتَهِدونَ وَ أَنتِ مُجتَهِدَةٌ»","body":"ترجمه: ما کوشاییم و تو کوشایی. «نَحنُ» ضمیر «ما» است و صفتش با «ون» می‌آید: مُجتَهِدون. «أنتِ» ضمیر مخاطب دختر است و صفتش با «ة»: مُجتَهِدَةٌ. پس جمله یعنی ما کوشاییم و تو دخترِ کوشایی.","pageRef":"صفحه ۵۰"},{"type":"note","title":"ضمیرهای جدا (الضمائر المنفصلة)","body":"ضمیرهای جدا: أنا (من)، أنتَ (تو مذکر)، أنتِ (تو مؤنث)، هُوَ (او مذکر)، هِيَ (او مؤنث)، نَحنُ (ما).\nمثال: أَنا مِن تِهران، هُوَ في البَيتِ، هِيَ في المَدرَسَة.\nاین ضمیرها جدا نوشته می‌شوند و جای اسم را می‌گیرند."},{"type":"note","title":"صفت و موصوف؛ هماهنگی با مؤنث","body":"صفت باید در مذکر و مؤنث با موصوفش یکی باشد: جاهِز / جاهِزَة.\nگوینده پسر: أَنا جاهِزٌ (من آماده‌ام). گوینده دختر: أَنا جاهِزَةٌ. جمع: نَحنُ جاهِزونَ (ما آماده‌ایم).\nدیدید که مؤنث با «ة» و جمع با «ون» همراه صفت ساخته می‌شود."},{"type":"exam","title":"ضمیرهای جدای زیر را معنی کنید و با هر یک جمله بسازید: هُوَ، هِيَ، نَحنُ","body":"هُوَ = او (مذکر): هُوَ في المَكتَبِ او در دفتر است. هِيَ = او (مؤنث): هِيَ طالِبَةٌ او دانش‌آموز دختر است. نَحنُ = ما: نَحنُ إيرانيّونَ ما ایرانی هستیم. ضمیر جدا پیش از جمله می‌آید و مبتدأ است."},{"type":"exam","title":"کدام درست است؟ گوینده دختر می‌گوید: «أنا جاهِزٌ» یا «أنا جاهِزَةٌ»؟","body":"درست: «أنا جاهِزَةٌ». صفت باید از جنس گوینده پیروی کند؛ جاهِزٌ برای پسر است. برای جمع می‌گوییم نَحنُ جاهِزونَ (ما آماده‌ایم) و برای مخاطب دختر أنتِ جاهِزَةٌ. هماهنگی صفت و موصوف مهم‌ترین نکته این درس است."}]},{"number":5,"title":"كُلٌّ مِنّا رَقيق","pages":"۵۹ تا ۷۲","contents":[{"type":"answer","title":"تمرین: ترجمه کنید: «كانَ في البَيتِ وَ ذَهَبَ إلى المَدرَسَةِ»","body":"ترجمه: در خانه بود و به مدرسه رفت. «كانَ» فعل ماضی بودن و «ذَهَبَ» فعل ماضی رفتن است؛ هر دو برای مذکر. اگر فاعل مؤنث باشد تِ ساکن می‌گیرد: «كانَتْ في البَيتِ وَ ذَهَبَتْ إلى المَدرَسَةِ».","pageRef":"صفحه ۶۱"},{"type":"answer","title":"تمرین: جمله «كُلٌّ مِنّا رَقيق» را ترجمه کنید و تفاوت رَقيق و رَقيقَة را بنویسید.","body":"ترجمه: هر یک از ما مهربانیم. «كُلّ» یعنی هر و «مِنّا» یعنی از ما؛ پس كُلٌّ مِنّا یعنی هر یک از ما. رَقيق صفت مذکر است و رَقيقَة صفت مؤنث؛ برای دختر می‌گوییم كُلٌّ مِنّا رَقيقَة.","pageRef":"صفحه ۶۳"},{"type":"note","title":"فعل ماضی؛ مرد و زن","body":"فعل ماضی کار انجام‌شده را می‌رساند: ذَهَبَ (رف، مذکر)، ذَهَبَتْ (رف، مؤنث)، كانَ (بود)، كانَتْ (بود).\nمثال: ذَهَبَ عَلِيٌّ إلى المَدرَسَة، ذَهَبَتْ مَريَمُ إلى البَيت.\nعلامت مؤنث در ماضی، تِ ساکنِ پایان فعل است."},{"type":"note","title":"كانَ و كانَتْ در جمله‌های اسمیه","body":"برای گفتن «بود» در جمله اسمیه «كانَ» یا «كانَتْ» می‌آید.\nمثال: كانَ أَحمَدُ صَبوراً احمد صبور بود، كانَتْ مَريَمُ مُجتَهِدَةً مریم کوشا بود.\nصفت بعد از كانَ علامت «اً» می‌گیرد؛ خبرِ كان همیشه منصوب است."},{"type":"exam","title":"به عربی بگویید: «علی به مسجد رفت و مریم به خانه رفت».","body":"پاسخ: «ذَهَبَ عَلِيٌّ إلى الجامِعِ وَ ذَهَبَتْ مَريَمُ إلى البَيتِ». عَلِيٌّ مذکر است پس ذَهَبَ بدون تِ ساکنه و مَريَمُ مؤنث است پس ذَهَبَتْ با تِ ساکنه. فعل ماضی در عربی پیش از فاعل می‌آید."},{"type":"exam","title":"جاهای خالی را کامل کنید: «كانَتْ مَريَمُ ....» و «كانَ أَحمَدُ ....»","body":"پاسخ: «كانَتْ مَريَمُ رَقيقَةً» چون مریم مؤنث است و خبر كانَتْ منصوب با «ة» می‌آید؛ «كانَ أَحمَدُ رَقيقاً» چون احمد مذکر است. قاعده: خبرِ كان همیشه منصوب است و از جنس فاعل پیروی می‌کند."}]},{"number":6,"title":"أَنتَ طالِبٌ - أَنتُم طُلّاب","pages":"۷۳ تا ۸۶","contents":[{"type":"answer","title":"تمرین: مفرد، مثنی و جمع کلمه‌های طالِب و مُعَلِّمَة را بنویسید.","body":"طالِب (یک)، طالِبانِ (دو)، طُلّاب (بسیار). مُعَلِّمَة (یک)، مُعَلِّمَتانِ (دو)، مُعَلِّمات (بسیار). جمع مذکر سالم هم با «ون» ساخته می‌شود: مُعَلِّمون. مثنی همیشه با «انِ» تمام می‌شود.","pageRef":"صفحه ۷۵"},{"type":"answer","title":"تمرین: ترجمه کنید: «أَنتُم طُلّابٌ وَ أَنتُنَّ طالِباتٌ»","body":"ترجمه: شما (پسرها) دانش‌آموزید و شما (دخترها) دانش‌آموزید. «أَنتُم» ضمیر جمع مذکر و «أَنتُنَّ» ضمیر جمع مؤنث است. طُلّاب جمع مکسرِ طالِب و طالِبات جمع سالمِ مؤنثِ طالِب است.","pageRef":"صفحه ۷۸"},{"type":"note","title":"ضمیرهای جمع: أنتُم، هُم، هُنَّ","body":"ضمیرهای جمع: أنتُم (شما مذکر)، أنتُنَّ (شما مؤنث)، هُم (آنان مذکر)، هُنَّ (آنان مؤنث).\nمثال: هُم طُلّابٌ، هُنَّ طالِباتٌ.\nاگر گروه دختر و پسر مخلوط باشد، ضمیر مذکر به کار می‌رود."},{"type":"note","title":"مفرد، مثنی و جمع در یک نگاه","body":"مثنی یعنی دو تا: طالِبانِ، مُعَلِّمَتانِ، كِتابانِ.\nجمع مذکر سالم: مُعَلِّمون، مُؤمِنون. جمع مؤنث سالم: مُعَلِّمات، مُؤمِنات.\nجمع مکسر: طُلّاب، رِجال، ناس. برای دو نفر همیشه مثنی می‌سازیم و برای سه نفر و بیشتر جمع."},{"type":"exam","title":"«هُما طالِبانِ» را ترجمه کنید و تفاوت هُما با هُم را بنویسید.","body":"ترجمه: آن دو، دانش‌آموز (پسر) هستند. «هُما» برای دو نفر است و اسم و فعل با آن «انِ» می‌گیرد؛ «هُم» برای سه نفر و بیشتر است و با جمع می‌آید: هُم طُلّابٌ. پس هُما مثنی و هُم جمع است."},{"type":"exam","title":"جاهای خالی را با ضمیر مناسب پر کنید: «....... طُلّابٌ» (آن پسرها) و «....... طالِباتٌ» (آن دخترها)","body":"پاسخ: «هُم طُلّابٌ» و «هُنَّ طالِباتٌ». جمع مذکر با هُم و جمع مؤنث با هُنَّ می‌آید. طُلّاب جمع مکسر است و طالِبات جمع مؤنث سالم؛ ضمیر جدا پیش از اسم جمع می‌آید و مبتدأ جمله است."}]},{"number":7,"title":"إنَّ فريقَنا لِنَصير","pages":"۸۷ تا ۱۰۰","contents":[{"type":"answer","title":"تمرین: عنوان درس «إنَّ فريقَنا لِنَصير» را ترجمه کنید.","body":"ترجمه: گروه ما پیروز خواهد شد. «إنَّ» حرف تأکید است به معنی «همانا» و لام در «لِنَصيرُ» نیز تأکید را افزون می‌کند: همانا گروه ما پیروز می‌شود. جمله‌ای قاطع و امیدوارانه درباره بازی فوتبال است.","pageRef":"صفحه ۸۹"},{"type":"answer","title":"تمرین: با ضمیرهای «إنّكَ، إنَّهُ، إنَّها» مانند «إنّني» جمله بسازید و معنی کنید.","body":"إنّني مُجتَهِدٌ (همانا من کوشایم)، إنّكَ ناجِحٌ (همانا تو پیروزی)، إنَّهُ رَقيقٌ (همانا او مهربان است)، إنَّها طالِبَةٌ (همانا او دانش‌آموز دختر است). إنَّ با ضمیرها یکی می‌شود: إنّ + أنا ← إنّني.","pageRef":"صفحه ۹۱"},{"type":"note","title":"إنَّ؛ حرف تأکید","body":"«إنَّ» برای قوی‌کردن جمله اسمیه می‌آید و به معنی «همانا» است.\nمثال: إنَّ اللهَ رَحيمٌ همانا خدا مهربان است، إنَّ المَدرَسَةَ جَميلَةٌ همانا مدرسه زیباست.\nاسم بعد از إنَّ فتحه می‌گیرد و خبرِ جمله مرفوع می‌ماند."},{"type":"note","title":"لام تأکید و فعل مضارع","body":"«لِنَصيرُ» یعنی همانا خواهیم شد. لام در آغاز فعل مضارع نشانه تأکید است: لَنَنجَحُ (همانا موفق می‌شویم)، لَنَكتُبُ (همانا می‌نویسیم).\nپس «إنَّ فريقَنا لِنَصيرُ» دو بار تأکید دارد: یک بار با إنَّ و یک بار با لام."},{"type":"exam","title":"ترجمه کنید: «إنَّ اللهَ غَفورٌ رَحيمٌ» و نقش کلمه‌ها را بنویسید.","body":"ترجمه: همانا خدا آمرزنده و مهربان است. «إنَّ» حرف تأکید، «اللهَ» اسم إنّیه با فتحه و «غَفورٌ رَحيمٌ» خبر مرفوع است. تا وقتی إنَّ در جمله باشد، اسم جمله با فتحه می‌آید نه با ضمه."},{"type":"exam","title":"جمله «الطّالِبُ مُجتَهِدٌ» را با «إنَّ» تأکیدی کنید.","body":"پاسخ: «إنَّ الطّالِبَ مُجتَهِدٌ». هنگام آمدن إنَّ، مبتدأ (الطّالِب) به «اسم إنّ» تبدیل می‌شود و ضمه‌اش فتحه می‌گردد؛ خبر (مُجتَهِدٌ) بی‌تغییر می‌ماند. معنی: همانا دانش‌آموز کوشاست."}]},{"number":8,"title":"النَّظافَة","pages":"۱۰۱ تا ۱۱۴","contents":[{"type":"answer","title":"تمرین: امر و نهی فعل‌های زیر را بنویسید: ذَهَبَ، جَلَسَ، لَعِبَ","body":"اِذْهَبْ (برو) و لا تَذْهَبْ (نرو)؛ اِجلِسْ (بنشین) و لا تَجلِسْ (ننشین)؛ اِلْعَبْ (بازی کن) و لا تَلعَبْ (بازی نکن). امر با همزه وصل «اِ» ساخته می‌شود و نهی با «لا» بر سر مضارع.","pageRef":"صفحه ۱۰۳"},{"type":"answer","title":"تمرین: ترجمه کنید: «اِغسِلْ يَدَيكَ وَ لا تَأكُلْ بِيدٍ قَذِرَةٍ»","body":"ترجمه: دستانت را بشوی و با دست کثیف نخور. «اِغسِلْ» فعل امر از غَسَلَ است و «لا تَأكُلْ» نهی از أَكَلَ. کتاب با این تمرین بهداشت را هم می‌آموزد؛ پس هم زبان می‌خوانیم و هم آداب زندگی.","pageRef":"صفحه ۱۰۵"},{"type":"note","title":"فعل امر؛ دستور مثبت","body":"فعل امر یعنی انجام کار را بخواهیم: اُكتُبْ (بنویس)، اِقرَأْ (بخوان)، اِفتَحْ (باز کن)، نَظِّفْ (تمیز کن).\nبرای مخاطب مؤنث «ي» اضافه می‌شود: اُكتُبي، اِقرَئي؛ برای جمع «وا»: اُكتُبوا، اِقرَؤوا."},{"type":"note","title":"لا الناهیه؛ دستور منفی","body":"برای نهی، «لا» را بر سر مضارع می‌آوریم: لا تَكتُبْ (ننویس)، لا تَلعَبْ (بازی نکن)، لا تَنسَ (فراموش نکن)، لا تَضرِبْ (نزن).\nبرای مؤنث: لا تَكتُبي؛ برای جمع: لا تَكتُبوا. درس نظافت پر از همین دستورهای مفید است."},{"type":"exam","title":"به عربی بگویید: «دست‌هایت را بشوی و با خاک بازی نکن» (خطاب به دختر).","body":"پاسخ: «اِغسِلي يَدَيكِ وَ لا تَلعَبي بِالتُّرابِ». برای مخاطب مؤنث، امر با «ي» می‌آید: اِغسِلي و نهی هم لا تَلعَبي. برای پسر می‌گوییم: اِغسِلْ يَدَيكَ وَ لا تَلعَبْ."},{"type":"exam","title":"فعل‌های «نَظَّفَ، جَمَعَ» را به امر و نهی تبدیل کنید.","body":"نَظَّفَ ← امر: نَظِّفْ (تمیز کن)، نهی: لا تَنَظِّفْ. جَمَعَ ← امر: اِجمَعْ (جمع کن)، نهی: لا تَجمَعْ. در امر، حرکت وسط واژه ضمه می‌شود و در نهی، مضارع پس از «لا» می‌آید و ساکن تمام می‌شود."}]},{"number":9,"title":"إنّني أَنظُرُ إلى الكَعبَة","pages":"۱۱۵ تا ۱۲۸","contents":[{"type":"answer","title":"تمرین: مضارع فعل‌های ذَهَبَ، كَتَبَ، نَظَرَ را بنویسید.","body":"ذَهَبَ ← أَذهَبُ، كَتَبَ ← أَكتُبُ، نَظَرَ ← أَنظُرُ. مضارع یعنی کاری که اکنون انجام می‌شود؛ برای متکلم با «أـ» آغاز و با حرکت پایان می‌یابد: أَنظُرُ إلى الكَعبَة به کعبه می‌نگرم.","pageRef":"صفحه ۱۱۷"},{"type":"answer","title":"تمرین: ترجمه کنید: «أَنظُرُ إلى البَحرِ مِنَ النّافِذَةِ»","body":"ترجمه: از پنجره به دریا نگاه می‌کنم. «إلى» یعنی به و «مِن» یعنی از؛ هر دو حرف جرند و اسم بعدشان مجرور است: البَحرِ، النّافِذَةِ. مضارعِ «أَنظُرُ» کارِ در حال انجام را می‌رساند.","pageRef":"صفحه ۱۱۹"},{"type":"note","title":"فعل مضارع؛ زبان حال","body":"مضارع برای کار در حال یا عادت است: أَنظُرُ (می‌نگرم)، تَكتُبُ (می‌نویسی)، يَذهَبُ (می‌رود)، نَذهَبُ (می‌رویم).\nمضارع با یکی از حروف «أ، ت، ي، ن» آغاز می‌شود و پایانش حرکت دارد؛ ماضی برعکس پسوند می‌گرفت."},{"type":"note","title":"حروف جر: إلى، في، على، مِن، مَع","body":"إلى = به، في = در، على = بر، مِن = از، مَع = با.\nاسم پس از همه این‌ها مجرور است: إلى الكَعبَةِ، في الصَّفِّ، على الطّاوِلَةِ، مِن إيرانَ، مَعَ المُعَلِّمِ.\nبا این پنج حرف می‌توانید جمله‌های زیادی از متن‌های کتاب را کامل کنید."},{"type":"exam","title":"ترجمه کنید: «نَنظُرُ إلى الكَعبَةِ مَعَ المُعَلِّمِ»","body":"ترجمه: با معلم به کعبه نگاه می‌کنیم. «نَنظُرُ» مضارع جمع ماست (می‌نگریم)، «إلى» حرف جر به و «مَعَ» حرف جر با است. اسم بعد از حروف جر همیشه کسره می‌گیرد: الكَعبَةِ، المُعَلِّمِ."},{"type":"exam","title":"جاهای خالی را با حرف جر مناسب پر کنید: «اِقرَأْ .... الكِتابِ» و «ذَهَبتُ .... المَدرَسَةِ»","body":"پاسخ: «اِقرَأْ في الكِتابِ» در کتاب بخوان و «ذَهَبتُ إلى المَدرَسَةِ» به مدرسه رفتم. في برای مکان درونی و إلى برای مقصد حرکت به کار می‌رود؛ هر دو اسمِ بعد از خود را مجرور می‌کنند."}]},{"number":10,"title":"اللهُ أكبَر","pages":"۱۲۹ تا ۱۴۲","contents":[{"type":"answer","title":"تمرین: اسم تفضیل فعل‌های كَبُرَ، صَغُرَ، حَسُنَ را بنویسید.","body":"كَبُرَ ← أكبَر (بزرگ‌تر)، صَغُرَ ← أصغَر (کوچک‌تر)، حَسُنَ ← أحسَن (زیباتر و بهتر). اسم تفضیل برای مقایسه است؛ «اللهُ أكبَر» یعنی خدا از همه بزرگ‌تر است و این جمله آغاز اذان است.","pageRef":"صفحه ۱۳۱"},{"type":"answer","title":"تمرین: ترجمه کنید: «هٰذا الجَبَلُ أكبَرُ مِن ذٰلِكَ التَّلِّ»","body":"ترجمه: این کوه از آن تپه بزرگ‌تر است. الگوی مقایسه: اسم تفضیل + مِن + اسم مجرور: أكبَرُ مِن. برای کوچک‌تر می‌گوییم أصغَرُ مِن؛ التَّلِّ پس از مِن مجرور شده است.","pageRef":"صفحه ۱۳۳"},{"type":"note","title":"اسم تفضیل (أفعل تفضیل)","body":"برای مقایسه دو چیز از وزن «أفعل» استفاده می‌کنیم: أكبَر (بزرگ‌تر)، أصغَر (کوچک‌تر)، أحسَن (بهتر)، أفضل (برتر).\nوسیله مقایسه «مِن» است: الجَبَلُ أكبَرُ مِنَ التَّلِّ.\nمؤنث آن با «ى» است: كُبرى، صُغرى، حُسنى."},{"type":"note","title":"اللهُ أكبَر در اذان","body":"در اذان دو بار «اللهُ أكبَر» می‌گوییم؛ یعنی خدا از همه بزرگ‌تر است. این جمله الگوی «مبتدأ + اسم تفضیل» است.\nمانند: «الحَمدُ للّٰه» ستایش از آنِ خداست و «اللهُ أعَلَى» خدا بالاترین است. اسم تفضیل با «مِن» کامل می‌شود."},{"type":"exam","title":"با «أحسَن» جمله‌ای بسازید که دو چیز را مقایسه کند.","body":"پاسخ: «هٰذا الكِتابُ أحسَنُ مِن ذٰلِكَ الكِتابِ» این کتاب از آن کتاب بهتر است. اگر دو چیز برابر باشند می‌گوییم «مِثل»: هٰذا مِثلُ ذٰلِكَ. برای «بهترین» می‌گوییم الأحسَن: هٰذا أحسَنُ الكُتُبِ."},{"type":"exam","title":"ترجمه کنید: «الصَّلاةُ خَيرٌ مِنَ النَّومِ» و نوع صفت را بگویید.","body":"ترجمه: نماز از خواب بهتر است؛ جمله معروف اذان صبح. «خَير» اسم تفضیل به معنی بهتر است و با «مِن» مقایسه می‌کند؛ النَّومِ پس از مِن مجرور است و الصَّلاةُ مبتدأ جمله است."}]},{"number":11,"title":"في حَفلَةِ نِهايَةِ السَّنَة","pages":"۱۴۳ تا ۱۶۰","contents":[{"type":"answer","title":"تمرین: ترجمه کنید: «سَنُغَنّي وَ سَنَرقُصُ في الحَفلَةِ»","body":"ترجمه: در جشن می‌خوانیم و می‌رقصیم. «سَ» بر سر مضارع نشانه آینده است: سَنُغَنّي (خواهیم خواند)، سَنَرقُصُ (خواهیم رقصید). «في الحَفلَةِ» در جشن؛ الحَفلَة پس از في مجرور است.","pageRef":"صفحه ۱۴۵"},{"type":"answer","title":"تمرین: جمله‌های زیر را به دو گروه اسمیه و فعلیه تقسیم کنید: إنّني أَنظُرُ / الجامِعُ كَبيرٌ / سَنَذكُرُ أيّامَنا","body":"فعلیه: «إنّني أَنظُرُ» (همانا نگاه می‌کنم) و «سَنَذكُرُ أيّامَنا» (روزهایمان را به یاد خواهیم آورد). اسمیه: «الجامِعُ كَبيرٌ» (جامع بزرگ است). جمله فعلیه با فعل آغاز می‌شود و اسمیه با اسم.","pageRef":"صفحه ۱۴۸"},{"type":"note","title":"الجملة الاسمية و الجملة الفعلية","body":"جمله اسمیه با اسم آغاز می‌شود و دو بخش دارد: مبتدأ و خبر؛ مانند «المَدينَةُ جَميلَةٌ» مدینه زیباست.\nجمله فعلیه با فعل آغاز می‌شود و فاعل دارد؛ مانند «نَزُورُ المَدينَةَ» به مدینه می‌رویم. هر دو در ترجمه فارسی شبیه هم می‌شوند."},{"type":"note","title":"«سَ»؛ نشانه آینده","body":"با افزودن «سَ» بر سر مضارع، معنی آینده می‌گیرد: سَأَذهَبُ (خواهم رفت)، سَتَلعَبينَ (بازی خواهی کرد)، سَنَذكُرُ (به یاد خواهیم آورد).\nدر ترجمه «خواه» یا «ـَند» به فعل اضافه می‌شود؛ در جشن پایان سال این ساختار زیاد به کار می‌رود."},{"type":"exam","title":"«المَدينَةُ جَميلَةٌ» و «نَزُورُ المَدينَةَ» را ترجمه کنید و نوع هر جمله را بنویسید.","body":"«مدينه زیباست» جمله اسمیه است با مبتدأ «المَدينَةُ» و خبر «جَميلَةٌ». «به مدینه می‌رویم» جمله فعلیه است با فعل «نَزُورُ». جمله اسمیه حالت و صفت می‌گوید و فعلیه کار و حرکت را."},{"type":"exam","title":"با افزودن «سَ» مضارع‌های زیر را آینده کنید: أَكتُبُ، تَنظُرُ، يَلعَبونَ","body":"پاسخ: سَأَكتُبُ (خواهم نوشت)، سَتَنظُرُ (خواهی نگریست)، سَيَلعَبونَ (بازی خواهند کرد). «سَ» پیش از هر مضارعی می‌آید و فعل را آینده می‌کند؛ حروف آغاز مضارع (أ، ت، ي، ن) پس از سَ می‌مانند."}]},{"number":12,"title":"صَنَعتُ - صَنَعتُما","pages":"۱۶۱ تا ۱۷۸","contents":[{"type":"answer","title":"تمرین: فعل «صَنَعتَ» را در صیغه‌های من، ما (دو نفر) و شما (مذکر) بنویسید.","body":"صَنَعتُ (ساختم)، صَنَعتُما (دو نفر ساختیم)، صَنَعتُمْ (ساختید). برای جمع دخترها «ـُتُنَّ» می‌آید: صَنَعتُنَّ. فعل ماضی پسوند می‌گیرد نه پیشوند؛ این قاعده درس پایانی کتاب است.","pageRef":"صفحه ۱۶۳"},{"type":"answer","title":"تمرین: ترجمه کنید: «صَنَعتُ قارِباً أزرَقَ في الصَّيفِ»","body":"ترجمه: در تابستان قایق آبی‌ای ساختم. «صَنَعتُ» فعل ماضی متکلم (ساختم) و «قارِباً» مفعول منصوب است؛ «أزرَقَ» صفتِ قارِب و مذکر چون قارِب مذکر است. اگر صفت برای مؤنث بود می‌گفتیم زَرقاء یا صَفراء.","pageRef":"صفحه ۱۶۵"},{"type":"note","title":"فعل ماضی متکلم؛ صَنَعتُ","body":"فعل ماضی پسوند می‌گیرد: صَنَعتُ (ساختم)، صَنَعتَ (ساختی)، صَنَعتُما (دو نفر ساختیم)، صَنَعنا (ما ساختیم)، صَنَعتُمْ (شما ساختید).\nمثال کتاب: «صَنَعتُ صُندوقاً صَغيراً» جعبه کوچکی ساختم؛ مفعول همیشه منصوب است."},{"type":"note","title":"الألوان؛ رنگ‌ها در عربی","body":"رنگ‌ها: أحمَر (سرخ)، أخضَر (سبز)، أصفَر (زرد)، أزرَق (آبی)، أسوَد (سیاه)، أبيَض (سفید).\nمؤنث آن‌ها: حَمراء، خَضراء، صَفراء، زَرقاء، سَوداء، بيضاء.\nمثال: هٰذا قَلَمٌ أحمَرُ وَ هٰذِهِ سَيّارَةٌ صَفراءُ."},{"type":"exam","title":"به عربی بگویید: «من قایقی ساختم و تو جعبه‌ای ساختی».","body":"پاسخ: «صَنَعتُ قارِباً وَ صَنَعتَ صُندوقاً». برای «من» پسوند «تُ» و برای «تو پسر» پسوند «تَ» می‌آید؛ مفعول هم منصوب است: قارِباً، صُندوقاً. چون ساختن تمام شده، فعل ماضی به کار می‌رود نه مضارع."},{"type":"exam","title":"رنگ‌های «أحمَر، أزرَق، أخضَر» را مؤنث کنید و با آن‌ها جمله بسازید.","body":"پاسخ: حَمراء، زَرقاء، خَضراء. جمله: «هٰذِهِ سَجّادَةٌ حَمراءُ وَ تِلكَ سَيّارَةٌ زَرقاءُ» این فرش سرخ است و آن خودرو آبی. چون سَجّادَه و سَيّارَه مؤنث‌اند، رنگ مؤنث با «اء» می‌آید؛ رنگ‌های مذکر با «أ» آغاز می‌شوند."}]}]},{"title":"زبان انگلیسی هفتم","subject":"زبان انگلیسی","description":"مکالمه‌ها، نکات گرامر و سوالات امتحانی همه درس‌های کتاب زبان انگلیسی هفتم","color":"pink","icon":"message","chapters":[{"number":1,"title":"My Name","pages":"۸ تا ۲۲","contents":[{"type":"answer","title":"مکالمه درس اول: معرفی خودتان","body":"A: Hi! What is your name?\nB: My name is Ali. And what is your name?\nA: My name is Sara. How are you today?\nB: I am fine, thank you.\nترجمه: سلام! اسم تو چیست؟ / اسم من علی است و اسم تو چیست؟ / اسم من سارا است. امروز حالت چطور است؟ / خوبم، ممنون.","pageRef":"صفحه ۸"},{"type":"answer","title":"تمرین گفت‌وگو: نام و نام خانوادگی","body":"What is your first name?\nMy first name is Reza.\nWhat is your last name?\nMy last name is Ahmadi.\nترجمه: اسم کوچک تو چیست؟ / اسم کوچک من رضا است. / نام خانوادگی تو چیست؟ / نام خانوادگی من احمدی است.","pageRef":"صفحه ۱۲"},{"type":"note","title":"معرفی خود با What is your name؟","body":"برای پرسیدن نام از جمله What is your name? استفاده می‌کنیم و با My name is ... یا I am ... پاسخ می‌دهیم.\nمثال: What is your name? My name is Maryam. (اسم تو چیست؟ اسم من مریم است.)\nبرای نام دیگران: What is his name? His name is Amir."},{"type":"note","title":"حروف تعریف a و an","body":"a را قبل از صدای بی‌صا و an را قبل از صدای مصوت به کار می‌بریم.\nمثال: a teacher (یک معلم)، a student (یک دانش‌آموز)، an apple (یک سیب)، an English book (یک کتاب انگلیسی).\nجمله: I am a student. من یک دانش‌آموز هستم."},{"type":"exam","title":"سوال امتحانی: تکمیل مکالمه معرفی","body":"جای خالی را پر کنید:\nA: Hello! What is your .......?\nB: My ....... is Hamed.\nپاسخ: هر دو جای خالی name است.\nتوضیح: برای پرسیدن نام از what is و برای پاسخ از My name is استفاده می‌کنیم. معنی: سلام! اسمت چیست؟ / اسم من حامد است."},{"type":"exam","title":"سوال امتحانی: a یا an؟","body":"جای خالی را با a یا an کامل کنید:\n۱) She is ....... nurse. ۲) It is ....... orange.\nپاسخ: ۱) a ۲) an\nتوضیح: قبل از nurse که با صدای بی‌صا شروع می‌شود a می‌آید و قبل از orange که با مصوت شروع می‌شود an می‌آید. معنی: او یک پرستار است. / این یک پرتقال است."}]},{"number":2,"title":"My Classmates","pages":"۲۳ تا ۳۶","contents":[{"type":"answer","title":"مکالمه درس دوم: معرفی دوست","body":"A: Sara, this is my friend, Reza.\nB: Hello, Reza. Nice to meet you.\nC: Nice to meet you, too.\nترجمه: سارا، این دوستم رضا است. / سلام رضا، از آشنایی‌ات خوشبختم. / من هم از آشنایی با تو خوشبختم.","pageRef":"صفحه ۲۳"},{"type":"answer","title":"تمرین شنیداری و گفتاری: هم‌کلاسی‌ها","body":"A: Look! These are my classmates.\nB: What are their names?\nA: This is Hoda and this is Amin.\nB: Nice to meet you, Hoda and Amin!\nترجمه: نگاه کن! این‌ها هم‌کلاسی‌های من هستند. / اسم‌هایشان چیست؟ / این هدا و این امین است. / از آشنایی با شما خوشبختم!","pageRef":"صفحه ۲۸"},{"type":"note","title":"معرفی دیگران با This is و These are","body":"برای معرفی یک نفر از This is و برای معرفی چند نفر از These are استفاده می‌کنیم.\nمثال: This is my friend, Ali. (این دوستم علی است.)\nThese are my classmates. (این‌ها هم‌کلاسی‌های من هستند.)"},{"type":"note","title":"عبارت Nice to meet you","body":"وقتی برای اولین بار با کسی آشنا می‌شویم می‌گوییم Nice to meet you و جواب می‌دهیم Nice to meet you, too.\nمثال: Nice to meet you, Miss Karimi. Nice to meet you, too.\nسلام‌های دیگر: Good morning (صبح بخیر)، Good afternoon (بعدازظهر بخیر)."},{"type":"exam","title":"سوال امتحانی: تکمیل مکالمه آشنایی","body":"مکالمه را کامل کنید:\nA: Mom, this is my friend, Sara.\nB: Nice to ....... you, Sara.\nپاسخ: meet\nتوضیح: بعد از عبارت Nice to فعل meet به شکل ساده می‌آید. معنی: مامان، این دوستم سارا است. / از آشنایی‌ات خوشبختم سارا."},{"type":"exam","title":"سوال امتحانی: This is یا These are؟","body":"شکل درست را انتخاب کنید:\n۱) ....... my friends. (This is / These are)\n۲) ....... my brother. (This is / These are)\nپاسخ: ۱) These are چون friends جمع است. ۲) This is چون brother مفرد است.\nمعنی: این‌ها دوستان من هستند. / این برادر من است."}]},{"number":3,"title":"My Family","pages":"۳۷ تا ۵۰","contents":[{"type":"answer","title":"مکالمه درس سوم: عکس خانواده","body":"A: Is this your family photo?\nB: Yes, it is.\nA: Who is this man?\nB: He is my father.\nA: What is his name?\nB: His name is Karim.\nترجمه: این عکس خانواده توست؟ / بله. / این مرد کیست؟ / او پدر من است. / اسمش چیست؟ / اسمش کریم است.","pageRef":"صفحه ۳۷"},{"type":"answer","title":"تمرین گفت‌وگو: برادرها و خواهرها","body":"A: How many brothers and sisters do you have?\nB: I have one brother and two sisters.\nA: What are their names?\nB: My brother is Omid and my sisters are Niloofar and Parisa.\nترجمه: چند برادر و خواهر داری؟ / یک برادر و دو خواهر دارم. / اسم‌هایشان چیست؟ / برادرم امید و خواهرهایم نیلوفر و پریسا هستند.","pageRef":"صفحه ۴۲"},{"type":"note","title":"صفت‌های ملکی my، your، his، her","body":"his برای مذکر و her برای مؤنث به کار می‌رود و بعد از آن اسم می‌آید.\nمثال: This is my brother. His name is Ali. (این برادرم است. اسمش علی است.)\nThis is my sister. Her name is Sara. (این خواهرم است. اسمش سارا است.)"},{"type":"note","title":"واژه‌های اعضای خانواده","body":"father (پدر)، mother (مادر)، brother (برادر)، sister (خواهر)، grandfather (پدربزرگ)، grandmother (مادربزرگ)، uncle (عمو یا دایی)، cousin (پسرعمو یا دخترعمو).\nمثال: My grandmother is very kind. (مادربزرگم خیلی مهربان است.)"},{"type":"exam","title":"سوال امتحانی: پر کردن جای خالی ملکی","body":"جای خالی را با his یا her کامل کنید:\nThis is my sister. ....... name is Zahra.\nپاسخ: Her\nتوضیح: چون sister مؤنث است از her استفاده می‌کن
