"pages":"۱۹ تا ۴۶","contents":[{"type":"answer","title":"فعالیت: در نرم‌افزار ویرایش تصویر، اندازه یک عکس را به ۸۰۰ در ۶۰۰ پیکسل تغییر دهید.","body":"ابتدا نرم‌افزار را باز کنید و از منوی فایل، عکس را فراخوانی کنید.\nاز منوی تصویر گزینه تغییر اندازه را انتخاب و واحد را روی پیکسل بگذارید.\nعرض را ۸۰۰ و ارتفاع را ۶۰۰ وارد کنید و گزینه حفظ تناسب را تنظیم نمایید.\nدر پایان پیش‌نمایش را ببینید و فایل را با نام جدید ذخیره کنید.","pageRef":"صفحه ۲۴"},{"type":"answer","title":"مرحله: چگونه بخشی از تصویر را برش دهیم و پس‌زمینه اضافی را حذف کنیم؟","body":"ابزار انتخاب را روی بخش دلخواه تصویر بکشید و گزینه برش را بزنید تا بقیه حذف شود.\nبرای حذف پس‌زمینه، آن را در یک لایه جدا قرار دهید و با پاک‌کن یا انتخاب هوشمند بخش اضافی را پاک کنید.\nپیش از خروج گرفتن، لایه‌ها را یکجا کرده و با فرمت مناسب ذخیره نمایید.","pageRef":"صفحه ۳۱"},{"type":"note","title":"فرمت‌های پرکاربرد فایل تصویر","body":"فرمت JPEG برای عکس‌های عادی مناسب است چون حجم کمی دارد اما کیفیت را اندکی کاهش می‌دهد.\nفرمت PNG از شفافیت و کیفیت بهتر پشتیبانی می‌کند و برای لوگو و عکس با پس‌زمینه شفاف به کار می‌رود.\nفرمت BMP تصویر را بدون فشرده‌سازی ذخیره می‌کند و حجم بسیار زیادی دارد."},{"type":"note","title":"پیکسل و رزولوشن","body":"پیکسل کوچک‌ترین جزء تشکیل‌دهنده تصویر است و رزولوشن یعنی شمار پیکسل‌ها در واحد اندازه.\nهرچه رزولوشن بالاتر باشد جزئیات بیشتر و حجم فایل بزرگ‌تر است.\nمثال: عکس با ۳۰۰ پیکسل در اینچ برای چاپ مناسب است، ولی برای نمایش در وب ۷۲ پیکسل در اینچ کافی است."},{"type":"exam","title":"سوال امتحانی: تفاوت برش و تغییر اندازه در ویرایش تصویر را با مثال توضیح دهید.","body":"پاسخ تشریحی: در برش، قسمت‌های انتخاب‌نشده تصویر حذف می‌شوند اما اجزای باقی‌مانده تغییر اندازه نمی‌یابند.\nدر تغییر اندازه، همه اجزای تصویر کوچک یا بزرگ می‌شوند و چیزی حذف نمی‌شود.\nمثال: با برش فقط چهره یک نفر از عکس گروهی نگه داشته می‌شود و با تغییر اندازه کل عکس برای بارگذاری سبک می‌شود."},{"type":"exam","title":"سوال امتحانی: چهار ابزار اصلی نرم‌افزار ویرایش تصویر را نام برده و کار هر یک را بنویسید.","body":"پاسخ تشریحی: ابزار انتخاب برای مشخص کردن بخشی از تصویر، ابزار قلم و رنگ برای ترسیم و رنگ‌آمیزی، ابزار پرکن برای رنگ کردن یک ناحیه بسته و ابزار متن برای افزودن نوشته روی تصویر به کار می‌روند.\nبا ترکیب همین ابزارها می‌توان کارهای ویرایشی رایج مانند پوسترسازی را انجام داد."}]},{"number":3,"title":"کاربرد رایانه در محاسبات","pages":"۴۷ تا ۷۰","contents":[{"type":"answer","title":"فعالیت: جدول نمرات ۵ دانش‌آموز را در صفحه‌گسترده ساخته و میانگین هر نفر را محاسبه کنید.","body":"نام دانش‌آموزان را در سطرهای ۳ تا ۷ و نمره هر درس را در ستون‌های کناری وارد کنید.\nدر ستون میانگین، تابع AVERAGE را روی محدوده نمرات هر سطر بنویسید.\nسپس با کشیدن دستگیره پرکن از گوشه سلول، فرمول را به سایر سطرها منتقل کنید تا میانگین همه به‌طور خودکار محاسبه شود.","pageRef":"صفحه ۵۲"},{"type":"answer","title":"مرحله: برای داده‌های مصرف آب ماهانه خانواده، نمودار ستونی ترسیم کنید.","body":"ماه‌ها را در یک ستون و مقدار مصرف آب را در ستون دیگر وارد کنید.\nمحدوده داده‌ها را انتخاب و از منوی درج، گزینه نمودار را بزنید و نوع ستونی را برگزینید.\nبرای نمودار عنوان بگذارید و برچسب محورها را تنظیم کنید.\nدر پایان نمودار را کنار جدول قرار داده و فایل را ذخیره کنید.","pageRef":"صفحه ۶۰"},{"type":"note","title":"سلول، آدرس‌دهی و فرمول‌نویسی","body":"هر خانه صفحه‌گسترده یک سلول است که با حرف ستون و شماره سطر نام‌گذاری می‌شود؛ مانند ستون C سطر ۴.\nنوشتن فرمول همیشه با علامت مساوی آغاز می‌شود.\nاگر عدد یکی از سلول‌ها را تغییر دهید، نتیجه فرمول بلافاصله به‌روز می‌شود."},{"type":"note","title":"توابع پرکاربرد صفحه‌گسترده","body":"تابع SUM برای جمع کردن، AVERAGE برای میانگین‌گیری و MAX و MIN برای یافتن بزرگ‌ترین و کوچک‌ترین مقدار به کار می‌روند.\nمثال: برای یافتن بالاترین نمره کلاس، تابع MAX را روی ستون نمرات می‌نویسیم و نتیجه بدون محاسبه دستی نمایش داده می‌شود."},{"type":"exam","title":"سوال امتحانی: برای محاسبه مجموع و میانگین نمرات از کدام توابع استفاده می‌شود و ساختار فرمول چگونه است؟","body":"پاسخ تشریحی: برای مجموع از تابع SUM و برای میانگین از تابع AVERAGE استفاده می‌شود.\nهر فرمول با علامت مساوی شروع شده و نام تابع و محدوده سلول‌ها را می‌گیرد.\nبا نوشتن این توابع روی ستون نمرات، جمع و میانگین هر دانش‌آموز به دست می‌آید و با کپی فرمول، محاسبه برای بقیه سطرها تکرار می‌شود."},{"type":"exam","title":"سوال امتحانی: تفاوت داده و اطلاعات را با مثالی از صفحه‌گسترده بیان کنید.","body":"پاسخ تشریحی: داده، اعداد و نکات خام و پردازش‌نشده است، اما اطلاعات نتیجه پردازش و دسته‌بندی داده‌ها است و برای تصمیم‌گیری سودمند می‌باشد.\nمثال: فهرست نمرات خام یک کلاس داده است؛ وقتی میانگین هر دانش‌آموز و معدل کلاس محاسبه می‌شود، اطلاعات آماده مقایسه و تصمیم‌گیری فراهم می‌شود."}]},{"number":4,"title":"برنامه‌نویسی","pages":"۷۱ تا ۸۸","contents":[{"type":"answer","title":"فعالیت: در محیط اسکرچ برنامه‌ای بسازید که شخصیت با فشردن کلیدهای جهت حرکت کند.","body":"ابتدا یک اسپرایت انتخاب کنید.\nدر ناحیه کد، بلوک رویداد وقتی کلید فشرده شد را قرار دهید و کلید جهت بالا را انتخاب کنید.\nزیر آن بلوک حرکت ۱۰ قدم را بگذارید.\nبرای بقیه جهت‌ها همین کار را با کلیدهای مناسب تکرار کنید و برنامه را با فشردن کلیدها آزمایش نمایید.","pageRef":"صفحه ۷۶"},{"type":"answer","title":"مرحله: برنامه‌ای بنویسید که دو عدد از کاربر بگیرد و مجموع آن‌ها را نمایش دهد.","body":"از بخش متغیرها یک متغیر با نام مجموع بسازید.\nبلوک پرسیدن عدد اول را قرار دهید تا ورودی از کاربر گرفته شود و مقدار پاسخ را در متغیر ذخیره کنید.\nهمین کار را برای عدد دوم انجام دهید.\nدر پایان دو عدد را با عملگر جمع کنید و نتیجه را با بلوک نمایش دهید.","pageRef":"صفحه ۸۲"},{"type":"note","title":"الگوریتم چیست؟","body":"الگوریتم یعنی نوشتن مراحل دقیق و مرتب حل یک مسئله تا انجام‌دهنده بدون ابهام آن را اجرا کند.\nمثال: الگوریتم درست کردن چای شامل جوشاندن آب، ریختن چای، صبر برای دم کشیدن و صاف کردن است.\nترتیب مراحل بسیار مهم است و جابه‌جایی آن نتیجه را خراب می‌کند."},{"type":"note","title":"حلقه تکرار و دستور شرطی","body":"حلقه تکرار برای اجرای چندباره دستورها به کار می‌رود تا کد کوتاه شود؛ مانند تکرار چشمک زدن یک چراغ.\nدستور شرطی به برنامه امکان تصمیم‌گیری می‌دهد؛ اگر شرط درست باشد بخشی از دستورها اجرا می‌شود.\nمثال: اگر دکمه فشرده شد، صدای هشدار پخش شود؛ در غیر این صورت برنامه منتظر می‌ماند."},{"type":"exam","title":"سوال امتحانی: الگوریتم تماس تلفنی با یک دوست را به ترتیب مراحل بنویسید.","body":"پاسخ تشریحی: ابتدا شماره دوست را بردار، گوشی را باز کن، شماره را بگیر و منتظر بمان تا تماس وصل شود.\nپس از پاسخ دادن دوست، موضوع را بگو و در پایان مکالمه، تلفن را قطع کن.\nنوشتن این مراحل به ترتیب نشان می‌دهد الگوریتم باید دقیق، مرتب و بدون گام اضافه باشد."},{"type":"exam","title":"سوال امتحانی: تفاوت حلقه تکرار و دستور شرطی را با مثال بیان کنید.","body":"پاسخ تشریحی: حلقه تکرار دستورهای یک بخش را چند بار اجرا می‌کند و برای کارهای تکراری مانند حرکت ۱۰ قدمی اسپرایت مناسب است.\nدستور شرطی فقط در صورت برقراری شرط اجرا می‌شود و برای تصمیم‌گیری است؛ مثلا اگر امتیاز از ۱۰ گذشت، پیام برنده نمایش داده شود.\nیکی ابزار تکرار و دیگری ابزار انتخاب مسیر است."}]},{"number":5,"title":"معماری و سازه","pages":"۸۹ تا ۱۰۶","contents":[{"type":"answer","title":"فعالیت: با کاغذ و مقوا ماکت پلی بسازید که بیشترین وزن را تحمل کند.","body":"ابتدا طرح پل را روی کاغذ بکشید و محل تکیه‌گاه‌ها را مشخص کنید.\nکاغذ را لوله یا تا کنید تا تیرهای سه‌گوش ساخته شود؛ شکل مثلثی بار بیشتری تحمل می‌کند.\nتیرها را با چسب به عرشه پل بچسبانید.\nسپس وزنه‌ها را آرام و یکی‌یکی در وسط پل بگذارید و توان تحمل بار را ثبت کنید.","pageRef":"صفحه ۹۴"},{"type":"answer","title":"مرحله: نقشه طبقه‌ای از یک اتاق با مقیاس ۱ به ۵۰ رسم کنید.","body":"طول و عرض واقعی اتاق را متر بزنید و یادداشت کنید.\nبا مقیاس یک به پنجاه، هر ۵۰ سانتی‌متر اندازه واقعی به ۱ سانتی‌متر روی نقشه تبدیل می‌شود.\nدیوارها را با خط‌کش T و مداد راحت رسم کنید و محل در و پنجره را با نمادهای نقشه‌کشی مشخص نمایید.","pageRef":"صفحه ۱۰۰"},{"type":"note","title":"نیروهای وارد بر سازه","body":"دو نیروی اصلی وارد بر سازه، نیروی فشاری و نیروی کششی هستند.\nستون‌ها و تکیه‌گاه‌ها بیشتر نیروی فشاری و کابل‌ها و زنجیرها نیروی کششی تحمل می‌کنند.\nمثال: در پل معلق، کابل‌ها کشیده می‌شوند و پایه‌ها فشرده می‌شوند. مثلث پایدارترین شکل سازه‌ای است و در خرپاها به کار می‌رود."},{"type":"note","title":"مقیاس در نقشه‌کشی","body":"مقیاس، نسبت اندازه روی نقشه به اندازه واقعی است.\nدر مقیاس یک به پنجاه، هر ۱ سانتی‌متر نقشه برابر ۵۰ سانتی‌متر در دنیای واقعی است.\nمثال: اتاقی به طول ۴ متر روی نقشه ۸ سانتی‌متر رسم می‌شود. انتخاب مقیاس مناسب باعث می‌شود نقشه ساختمان بزرگ روی کاغذ جا شود."},{"type":"exam","title":"سوال امتحانی: چرا مثلث پایدارترین شکل در سازه‌ها به شمار می‌آید؟","body":"پاسخ تشریحی: چون در مثلث اگر طول ضلع‌ها ثابت بماند، شکل آن به هیچ وجه تغییر نمی‌کند و در برابر نیرو تغییر شکل نمی‌دهد.\nدر چهارضلعی‌ها با اعمال نیرو، اضلاع کج می‌شوند و شکل عوض می‌شود.\nبه همین دلیل در خرپای پل‌ها و سقف‌ها از مثلث‌های متعدد استفاده می‌شود تا سازه استحکام کافی داشته باشد."},{"type":"exam","title":"سوال امتحانی: سه ویژگی اصلی یک ساختمان خوب را نام برده و توضیح دهید.","body":"پاسخ تشریحی: ساختمان خوب باید استحکام کافی در برابر نیروهای طبیعی داشته باشد، برای کاربری خود مناسب و کارآمد باشد و ایمنی ساکنان را تأمین کند.\nعلاوه بر این‌ها، زیبایی و هماهنگی با محیط نیز اهمیت دارد.\nمثال: مدرسه باید نور و تهویه کافی داشته باشد و راه‌های خروج اضطراری آن مشخص باشد."}]},{"number":6,"title":"پوشاک","pages":"۱۰۷ تا ۱۲۲","contents":[{"type":"answer","title":"فعالیت: دکمه‌ای روی پارچه بدوزید.","body":"نخ را از سوزن عبور داده و انتهای آن گره بزنید.\nسوزن را از پشت پارچه در یکی از سوراخ‌های دکمه بیرون آورید و دکمه را روی محل دلخواه قرار دهید.\nبا کوک‌های ضربدری از سوراخ‌های مقابل بگذرانید و چند بار تکرار کنید.\nدر پایان نخ را در پشت پارچه گره بزنید و سر اضافی نخ را با قیچی بچینید.","pageRef":"صفحه ۱۱۲"},{"type":"answer","title":"مرحله: روی پارچه‌ای که داغ‌دار شده وصله‌پینه انجام دهید.","body":"تکه پارچه‌ای هم‌رنگ و کمی بزرگ‌تر از داغ انتخاب کنید و لبه‌های آن را با قیچی گرد کنید تا ریشه ندهد.\nوصله را روی محل داغ بگذارید و با کوک ساده دور تا دور آن را بدوزید.\nمی‌توانید پیش از دوخت از اتوی چسب هم استفاده کنید.\nدر پایان کوک‌ها را بازبینی کنید تا وصله محکم و صاف قرار گرفته باشد.","pageRef":"صفحه ۱۱۶"},{"type":"note","title":"ایمنی در کار با سوزن و قیچی","body":"سوزن و قیچی ابزارهای خطرناک کارگاه پوشاک هستند.\nسوزن‌ها را در نخ‌دوزی نگه دارید، قیچی را به سمت خود یا دیگران نگه ندارید و سوزن را در دهان نگذارید.\nپس از پایان کار، همه سوزن‌ها را بشمارید و در جعبه مخصوص جمع کنید تا گم نشوند."},{"type":"note","title":"کوک‌های پرکاربرد در دوخت","body":"دو کوک پرکاربرد، کوک ساده و کوک زنجیره‌ای هستند.\nکوک ساده برای دوخت دور وصله و اتصال‌های ساده به کار می‌رود و اجرای آن آسان است.\nکوک زنجیره‌ای محکم‌تر و کش‌سان است و برای دوخت لبه پارچه‌هایی که کش می‌آیند مناسب است."},{"type":"exam","title":"سوال امتحانی: مراحل دوختن دکمه را به ترتیب بنویسید.","body":"پاسخ تشریحی: مراحل عبارت‌اند از: نخ کردن سوزن و گره زدن انتهای نخ، قرار دادن دکمه روی محل تعیین‌شده، رد کردن سوزن از سوراخ‌های دکمه با کوک ضربدری، تکرار کوک‌ها تا استحکام کافی، گره زدن نخ در پشت پارچه و چیدن سر اضافی نخ.\nدکمه باید اندکی از پارچه فاصله داشته باشد تا روی سوراخ لباس راحت بسته شود."},{"type":"exam","title":"سوال امتحانی: چرا پیش از برش پارچه، الگو را روی آن سوزن می‌زنیم و دور آن خط می‌اندازیم؟","body":"پاسخ تشریحی: با سوزن کردن الگو، الگو هنگام برش از روی پارچه جابه‌جا نمی‌شود و اندازه قطعات دقیق درمی‌آید.\nخط انداختن دور الگو راهنمای قیچی است و از بریدن اشتباه جلوگیری می‌کند.\nهمچنین با چیدن هوشمندانه الگوها روی پارچه، کمترین هدررفت پیدا می‌شود و در مصرف پارچه صرفه‌جویی می‌گردد."}]},{"number":7,"title":"صنعت","pages":"۱۲۳ تا ۱۴۰","contents":[{"type":"answer","title":"فعالیت: با ورق فلزی نازک با روش ورق‌کاری یک جاکلیدی بسازید.","body":"ابتدا طرح جاکلیدی را با ماژیک روی ورق فلزی بکشید.\nبا دستکش و عینک ایمنی، طرح را با قیچی ورق‌بری برش دهید و لبه‌های تیز را با سوهان نرم و گرد کنید.\nسپس با انبردست لبه‌ها را تا بزنید و سوراخ حلقه کلید را ایجاد کنید.\nدر پایان سطح کار را با سنباده پرداخت کنید.","pageRef":"صفحه ۱۲۸"},{"type":"answer","title":"مرحله: دو قطعه چوب را با چسب و میخ به یکدیگر متصل کنید.","body":"محل اتصال را روی هر دو قطعه علامت بزنید.\nدر محل میخ، سوراخ کوچکی بگیرید تا چوب ترک نیفتد و چسب چوب را روی سطح تمیز بمالید.\nقطعات را با گیره محکم نگه دارید و میخ را با ضربه‌های متوسط و بدون کج شدن بکوبید.\nپس از خشک شدن چسب، گیره را باز کنید.","pageRef":"صفحه ۱۳۳"},{"type":"note","title":"ایمنی در کارگاه صنعت","body":"پیش از شروع کار عینک و دستکش ایمنی بپوشید و آستین‌ها را جمع کنید.\nهنگام کار با ابزار برنده تمرکز کامل داشته باشید و با هم‌گروهی شوخی نکنید.\nابزار معیوب را به مربی گزارش دهید و هرگز براده‌ها و تراشه‌ها را با دست جمع نکنید."},{"type":"note","title":"روش‌های اتصال قطعات","body":"اتصال‌ها دو دسته‌اند: اتصال دائمی که باز کردن آن بدون آسیب ممکن نیست، مانند جوشکاری، پرچ و چسب؛ و اتصال جداشدنی که می‌توان بارها باز و بسته کرد، مانند پیچ و مهره و گیره.\nمثال: در دوچرخه، بدنه با جوش دائمی و چرخ با پیچ و مهره جداشدنی به بدنه وصل می‌شود."},{"type":"exam","title":"سوال امتحانی: تفاوت اتصال جداشدنی و اتصال دائمی را با ذکر مثال توضیح دهید.","body":"پاسخ تشریحی: در اتصال دائمی، باز کردن قطعات ممکن نیست یا باعث آسیب می‌شود؛ مانند جوشکاری، پرچ کردن و چسباندن.\nدر اتصال جداشدنی، قطعات بارها بدون آسیب باز و بسته می‌شوند؛ مانند پیچ و مهره و بست‌ها.\nبرای قطعاتی که باید بارها باز و تعویض شوند، اتصال جداشدنی بهتر است."},{"type":"exam","title":"سوال امتحانی: چهار مرحله ساخت یک قطعه فلزی ساده را به ترتیب نام ببرید.","body":"پاسخ تشریحی: چهار مرحله اصلی عبارت‌اند از: طراحی و رسم نقشه قطعه، برش مواد اولیه به اندازه لازم، شکل‌دهی با کوبیدن و تا زدن و خم کاری، و پرداخت نهایی با سوهان و سنباده برای نرم کردن لبه‌ها.\nرعایت ترتیب این مراحل باعث می‌شود قطعه دقیق، تمیز و ایمن ساخته شود."}]},{"number":8,"title":"کشاورزی","pages":"۱۴۱ تا ۱۵۴","contents":[{"type":"answer","title":"فعالیت: در گلدان، قلمه‌ای از یک گیاه را ریشه‌دار کنید.","body":"قلمه‌ای به طول تقریبی ۱۵ سانتی‌متر از ساقه سالم گیاه ببرید؛ برش را مورب انجام دهید تا سطح جذب آب بیشتر شود.\nبرگ‌های پایینی را جدا کنید و قلمه را در خاک مرطوب و حاصلخیز فرو کنید.\nگلدان را در نور غیرمستقیم قرار دهید و خاک را همیشه مرطوب نگه دارید تا ریشه دهد.","pageRef":"صفحه ۱۴۶"},{"type":"answer","title":"مرحله: یک بستر کاشت کوچک آماده کنید و بذر بکارید.","body":"محل کاشت را از سنگ و علف هرز پاک کنید و خاک را با بیل شخم بزنید تا نرم شود.\nسطح بستر را با شن‌کش تسطیح کرده و کانال آبگیری در اطراف بسازید.\nبذرها را در عمقی حدود دو برابر قطر خودشان بکارید و روی آن‌ها خاک نرم بریزید.\nسپس آبیاری ملایم انجام دهید تا بذرها جابه‌جا نشوند.","pageRef":"صفحه ۱۵۰"},{"type":"note","title":"عوامل اصلی رشد گیاه","body":"گیاه برای رشد به چهار عامل اصلی نیاز دارد: آب، نور کافی، خاک مناسب و دمای مناسب.\nکمبود یا زیب هر یک رشد را کند می‌کند یا گیاه را نابود می‌سازد.\nمثال: گلدان آپارتمانی اگر آبیاری فراموش شود پژمرده می‌شود و اگر زیاد آبیاری شود ریشه‌اش می‌پوسد."},{"type":"note","title":"ازدیاد جنسی و غیرجنسی گیاهان","body":"در ازدیاد جنسی، گیاه از بذر که حاصل تلقیح گل است به وجود می‌آید.\nدر ازدیاد غیرجنسی بدون بذر و از بخش‌های رویشی گیاه مانند قلمه، پیوند و پاجوش استفاده می‌شود.\nمثال: گل سرخ معمولا با قلمه و مرکبات با پیوند تکثیر می‌شوند تا ویژگی‌های گیاه مادر حفظ شود."},{"type":"exam","title":"سوال امتحانی: تفاوت ازدیاد جنسی و غیرجنسی گیاهان را با مثال توضیح دهید.","body":"پاسخ تشریحی: در ازدیاد جنسی ترکیب صفات پدر و مادر منتقل می‌شود و تنوع ایجاد می‌گردد؛ مانند کاشت بذر گندم.\nدر ازدیاد غیرجنسی گیاه جدید از بخش رویشی گیاه مادر ساخته می‌شود و دقیقا همان صفات مادر را دارد؛ مانند ریشه‌دار کردن قلمه انگور یا پیوند گل سرخ.\nسرعت ازدیاد غیرجنسی بیشتر است."},{"type":"exam","title":"سوال امتحانی: چهار عامل مهم در رشد گیاه را نام برده و نقش یکی را توضیح دهید.","body":"پاسخ تشریحی: چهار عامل اصلی آب، نور، خاک و دما هستند.\nنقش نور: گیاه با انرژی نور خورشید فرآیند فتوسنتز را انجام می‌دهد و غذای خود را می‌سازد.\nاگر نور کافی نرسد ساقه بلند و رنگ‌پریده و برگ‌ها زرد می‌شوند؛ به همین دلیل گلدان‌ها باید در محل روشن ولی نه آفتاب سوزان نگهداری شوند."}]}]}]},{"number":9,"name":"پایه نهم","subtitle":"آماده‌سازی برای آینده","books":[{"title":"ریاضی نهم","subject":"ریاضی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه فصل‌های کتاب ریاضی نهم","color":"blue","icon":"calculator","chapters":[{"number":1,"title":"مجموعه اعداد حقیقی","pages":"۸ تا ۳۲","contents":[{"type":"answer","title":"کدام یک از اعداد √۲ ، √۹ ، ۰٫۷۵ و π گنگ هستند؟","body":"عدد ۰٫۷۵ همان کسر ۳/۴ است پس گویاست.\n√۹ برابر ۳ است پس گویاست.\nاما √۲ عددی است که هیچ کسری با صورت و مخرج صحیح معادل آن نیست، پس گنگ است. عدد π نسبت محیط دایره به قطر آن است و اعشار آن الگوی تکراری ندارد، پس گنگ است.\nبنابراین √۲ و π گنگ و دو عدد دیگر گویا هستند. هر عدد گنگ نمایش اعشاری نامتناهی و ناتکرار دارد.","pageRef":"صفحه ۱۲"},{"type":"answer","title":"حاصل عبارت √۱۲ + √۲۷ − √۳ را به ساده‌ترین صورت بنویسید.","body":"ابتدا هر رادیکال را ساده می‌کنیم:\n√۱۲ = √(۴ × ۳) = ۲√۳ و √۲۷ = √(۹ × ۳) = ۳√۳.\nعبارت می‌شود ۲√۳ + ۳√۳ − √۳. چون هر سه جمله رادیکال یکسان دارند، ضریب‌ها را جمع و تفریق می‌کنیم: ۲ + ۳ − ۱ = ۴.\nپس حاصل برابر ۴√۳ است. برای ساده کردن رادیکال همیشه بزرگ‌ترین مربع کاملِ عامل عدد زیر رادیکال را جدا می‌کنیم.","pageRef":"صفحه ۲۶"},{"type":"note","title":"اعداد گویا و گنگ","body":"هر عددی که بتوان آن را به شکل کسری با صورت و مخرج صحیح نوشت گویاست، مثل ۲/۳ یا ۵؛ و اعدادی مثل √۷ و π را نمی‌توان چنین نوشت پس گنگ‌اند.\nاجتماع اعداد گویا و گنگ، مجموعه اعداد حقیقی است.\nمثال: ۰٫۶۶۶… چون دوره تکرار دارد گویاست، اما ۰٫۱۰۱۰۰۱۰۰۰۱… که الگوی تکراری ندارد گنگ است.","pageRef":"صفحه ۱۰"},{"type":"note","title":"ساده کردن رادیکال‌ها","body":"از رابطه √(a × b) = √a × √b برای ساده کردن رادیکال استفاده می‌کنیم.\nمثال: √۵۰ = √(۲۵ × ۲) = ۵√۲ و √۳۲ = √(۱۶ × ۲) = ۴√۲.\nبا این روش جملات رادیکال مشابه را می‌توان جمع کرد: √۵۰ + √۳۲ = ۵√۲ + ۴√۲ = ۹√۲.\nحاصل‌ضرب دو رادیکال هم ساده می‌شود: √۲ × √۸ = √۱۶ = ۴.","pageRef":"صفحه ۱۵"},{"type":"exam","title":"اعداد √۳ ، ۵/۳ ، ۱٫۷ و √۲ را به ترتیب صعودی بنویسید.","body":"کسر پنج‌سوم را تقسیم می‌کنیم: ۵ ÷ ۳ ≈ ۱٫۶۶.\nبرای اعداد گنگ تقریب می‌گیریم: √۲ ≈ ۱٫۴۱ و √۳ ≈ ۱٫۷۳.\nحالا چهار عدد به صورت اعشار قابل مقایسه‌اند: ۱٫۴۱ < ۱٫۶۶ < ۱٫۷ < ۱٫۷۳.\nپس ترتیب صعودی می‌شود: √۲ سپس ۵/۳ سپس ۱٫۷ و در پایان √۳. برای مقایسه اعداد حقیقی بهتر است همه را با تقریب دلخواه به صورت اعشار بنویسیم.","pageRef":"صفحه ۲۸"},{"type":"exam","title":"حاصل عبارت ۲√۱۲ − ۳√۷۵ + √۲۷ را حساب کنید.","body":"ساده می‌کنیم:\n√۱۲ = ۲√۳ پس ۲√۱۲ = ۴√۳؛ √۷۵ = √(۲۵ × ۳) = ۵√۳ پس ۳√۷۵ = ۱۵√۳؛ √۲۷ = ۳√۳.\nعبارت می‌شود ۴√۳ − ۱۵√۳ + ۳√۳.\nضریب‌ها را با هم جمع می‌کنیم: ۴ − ۱۵ + ۳ = −۸. حاصل نهایی −۸√۳ است. عدد زیر رادیکال مثبت می‌ماند و علامت منفی فقط روی ضریب اثر دارد.","pageRef":"صفحه ۲۲"}]},{"number":2,"title":"توان های گویا و عبارت های جبری","pages":"۳۳ تا ۶۰","contents":[{"type":"answer","title":"حاصل عبارت ۸ به توان ۲/۳ را حساب کنید.","body":"توان کسری a به توان m/n یعنی جذر nم عدد a گرفته شود و نتیجه به توان m برسد.\nاینجا ابتدا جذر سوم ۸ را می‌گیریم که برابر ۲ است، سپس ۲ به توان ۲ یعنی ۴.\nپس ۸ به توان ۲/۳ برابر ۴ است.\nبه همین روش ۱۶ به توان ۱/۲ یعنی جذر دوم ۱۶ برابر ۴ می‌شود. می‌توان ابتدا توان گرفت و بعد جذر کشید؛ جواب یکی است.","pageRef":"صفحه ۳۶"},{"type":"answer","title":"عبارت ۹x به توان ۲ منهای ۱۶ را تجزیه کنید.","body":"این عبارت شکل اتحاد مزدوج است: a به توان ۲ منهای b به توان ۲ می‌شود حاصل‌ضرب (a − b) در (a + b).\nاینجا a برابر ۳x و b برابر ۴ است، پس داریم (۳x − ۴)(۳x + ۴).\nبرای بررسی، دو پرانتز را در هم ضرب می‌کنیم: ۹x به توان ۲ به‌علاوه ۱۲x منهای ۱۲x منهای ۱۶ که جمله میانی حذف می‌شود و به عبارت اولیه می‌رسیم.","pageRef":"صفحه ۵۰"},{"type":"note","title":"قواعد توان‌ها","body":"در ضرب دو توان با پایه یکسان، توان‌ها جمع می‌شوند: a به توان m ضربدر a به توان n برابر a به توان m + n.\nمثال: ۳ به توان ۲ ضربدر ۳ به توان ۴ برابر ۳ به توان ۶.\nدر توان رساندن یک توان، توان‌ها در هم ضرب می‌شوند: (۵ به توان ۲) به توان ۳ برابر ۵ به توان ۶.\nهر عدد ناصفر به توان صفر برابر ۱ است.","pageRef":"صفحه ۳۸"},{"type":"note","title":"اتحاد مربع دوجمله‌ای","body":"(a + b) به توان ۲ برابر a به توان ۲ به‌علاوه ۲ab به‌علاوه b به توان ۲.\nمثال: (x + ۳) به توان ۲ برابر x به توان ۲ به‌علاوه ۶x به‌علاوه ۹.\nاین اتحاد برای تجزیه هم به کار می‌رود: x به توان ۲ به‌علاوه ۸x به‌علاوه ۱۶ می‌شود (x + ۴) به توان ۲.\nدر تجزیه همیشه بررسی کنید که جمله اول و سوم مربع کامل و جمله میانی برابر ۲ab باشد.","pageRef":"صفحه ۴۴"},{"type":"exam","title":"حاصل عبارت ۲۷ به توان ۱/۳ به‌علاوه ۱۶ به توان ۱/۲ را حساب کنید.","body":"۲۷ به توان ۱/۳ یعنی جذر سوم ۲۷ که برابر ۳ است.\n۱۶ به توان ۱/۲ یعنی جذر دوم ۱۶ که برابر ۴ است.\nپس حاصل عبارت برابر ۳ + ۴ یعنی ۷ می‌شود.\nنکته: جذر سوم عدد منفی هم تعریف شده است، مثلا جذر سوم ۸− برابر ۲− است، اما جذر دوم عدد منفی در مجموعه اعداد حقیقی تعریف نشده است.","pageRef":"صفحه ۵۶"},{"type":"exam","title":"عبارت x به توان ۲ به‌علاوه ۵x را تجزیه کنید و ریشه‌های معادله x به توان ۲ به‌علاوه ۵x برابر ۰ را بنویسید.","body":"عامل مشترک x را بیرون می‌آوریم: x ضربدر (x + ۵).\nچون حاصل‌ضرب صفر است، دست‌کم یکی از عامل‌ها صفر است: x = ۰ یا x + ۵ = ۰ یعنی x = −۵.\nپس معادله دو ریشه دارد: ۰ و −۵.\nنکته مهم: هرگز دو طرف معادله را بر x تقسیم نکنید؛ با این کار ریشه x = ۰ به طور نادرست از دست می‌رود.","pageRef":"صفحه ۴۸"}]},{"number":3,"title":"معادله و کاربرد آن","pages":"۶۱ تا ۸۸","contents":[{"type":"answer","title":"معادله x به توان ۲ منهای ۵x به‌علاوه ۶ برابر ۰ را حل کنید.","body":"دنبال دو عددی می‌گردیم که حاصل‌ضرب آن‌ها ۶ و مجموعشان ۵ باشد؛ این دو عدد ۲ و ۳ هستند.\nپس معادله تجزیه می‌شود به (x − ۲)(x − ۳) = ۰.\nچون حاصل‌ضرب صفر است: x − ۲ = ۰ یعنی x = ۲ یا x − ۳ = ۰ یعنی x = ۳.\nبررسی: با x = ۲ داریم ۴ − ۱۰ + ۶ = ۰ که درست است. پس ریشه‌های معادله ۲ و ۳ هستند.","pageRef":"صفحه ۶۴"},{"type":"answer","title":"دستگاه معادله ۲x + y = ۷ و x − y = ۲ را با روش حذفی حل کنید.","body":"دو معادله را طرف به طرف جمع می‌کنیم تا y حذف شود: ۲x + x = ۳x و ۷ + ۲ = ۹، پس ۳x = ۹ و x = ۳.\nمقدار x را در معادله دوم جای‌گذاری می‌کنیم: ۳ − y = ۲ پس y = ۱.\nجواب دستگاه (۳ ، ۱) است.\nبررسی در معادله اول: ۲ × ۳ + ۱ = ۷ درست است. در روش حذفی تلاش می‌کنیم ضریب یکی از مجهول‌ها در دو معادله مساوی و مخالف شود.","pageRef":"صفحه ۸۰"},{"type":"note","title":"حل معادله درجه دوم با تجزیه","body":"برای حل معادله x به توان ۲ + bx + c = ۰ دو عدد می‌یابیم که حاصل‌ضربشان c و مجموعشان b باشد.\nمثال: x به توان ۲ + ۷x + ۱۲ = ۰ چون ۳ × ۴ = ۱۲ و ۳ + ۴ = ۷ می‌شود (x + ۳)(x + ۴) = ۰ و ریشه‌ها −۳ و −۴ هستند.\nهر معادله درجه دومی که تجزیه‌پذیر باشد با این روش ساده حل می‌شود؛ تعداد ریشه‌های یک معادله درجه دوم حداکثر ۲ است.","pageRef":"صفحه ۶۶"},{"type":"note","title":"روش جای‌گذاری در دستگاه معادله‌ها","body":"در روش جای‌گذاری یکی از معادله‌ها را نسبت به یک مجهول می‌نویسیم و آن را در معادله دیگر جای‌گذاری می‌کنیم.\nمثال: دستگاه y = x + ۱ و ۲x + y = ۷.\nمقدار y را در معادله دوم می‌گذاریم: ۲x + x + ۱ = ۷ پس ۳x = ۶ و x = ۲ و آن‌گاه y = ۳.\nهر جواب دستگاه باید در هر دو معادله درست باشد.","pageRef":"صفحه ۷۲"},{"type":"exam","title":"عرض مستطیلی ۳ واحد کمتر از طول آن است و مساحتش ۴۰ واحد مربع است. طول و عرض را بیابید.","body":"عرض را x و طول را x + ۳ می‌گیریم.\nرابطه مساحت: x ضربدر (x + ۳) = ۴۰ پس x به توان ۲ + ۳x − ۴۰ = ۰.\nدو عدد می‌یابیم که ضربشان −۴۰ و جمعشان ۳ باشد: −۸ و ۵. پس (x + ۸)(x − ۵) = ۰ و چون طول مثبت است x = ۵.\nبنابراین عرض ۵ و طول ۸ واحد است. بررسی: ۵ × ۸ = ۴۰ درست است.","pageRef":"صفحه ۸۴"},{"type":"exam","title":"معادله x به توان ۲ برابر ۴x را حل کنید و اشتباه رایج در حل آن را توضیح دهید.","body":"همه جملات را به یک طرف می‌بریم: x به توان ۲ − ۴x = ۰ و تجزیه می‌کنیم: x(x − ۴) = ۰ پس x = ۰ یا x = ۴.\nاشتباه رایج این است که دو طرف معادله را بر x تقسیم می‌کنیم و فقط جواب ۴ به دست می‌آید؛ این کار ریشه x = ۰ را از بین می‌برد.\nقاعده: در معادله هرگز دو طرف را بر متغیر تقسیم نمی‌کنیم مگر آنکه بدانیم متغیر صفر نیست.","pageRef":"صفحه ۷۶"}]},{"number":4,"title":"تبدیل ها","pages":"۸۹ تا ۱۱۲","contents":[{"type":"answer","title":"نقطه A با مختصات (۳ ، ۲) را به اندازه برداری با مؤلفه‌های −۲ و ۴ انتقال دهید.","body":"در انتقال، به مختصه اول نقطه مؤلفه اول بردار و به مختصه دوم، مؤلفه دوم بردار را اضافه می‌کنیم.\nمختصه اول تصویر: ۳ + (−۲) = ۱ و مختصه دوم: ۲ + ۴ = ۶.\nپس تصویر نقطه A نقطه‌ای با مختصات (۱ ، ۶) است.\nدر انتقال شکل و اندازه تغییر نمی‌کند و فقط جابه‌جایی رخ می‌دهد؛ جهت انتقال هم جهت بردار است.","pageRef":"صفحه ۹۲"},{"type":"answer","title":"تصویر نقطه P با مختصات (۲ ، ۵) نسبت به محور xها و نسبت به محور yها را بنویسید.","body":"در تقارن نسبت به محور xها مختصه اول ثابت می‌ماند و مختصه دوم قرینه می‌شود؛ پس تصویر نقطه (۲ ، ۵) نقطه‌ای با مختصات (۲ ، −۵) است.\nدر تقارن نسبت به محور yها مختصه اول قرینه می‌شود و مختصه دوم ثابت است؛ پس تصویر (−۲ ، ۵) می‌شود.\nنقطه و تصویرش نسبت به محور تقارن هم‌فاصله‌اند و پاره‌خط واصل آن‌ها بر محور عمود است.","pageRef":"صفحه ۱۰۴"},{"type":"note","title":"تقارن مرکزی نسبت به مبدأ","body":"در تقارن مرکزی نسبت به مبدأ، هر نقطه با مختصات (x ، y) به نقطه‌ای با مختصات (−x ، −y) تبدیل می‌شود.\nمثال: تصویر نقطه (۴ ، −۱) نقطه‌ای با مختصات (−۴ ، ۱) است.\nفاصله هر نقطه و تصویرش از مبدأ برابر است و پاره‌خط واصل آن‌ها از مبدأ می‌گذرد.\nدوران ۱۸۰ درجه حول مبدأ همان تقارن مرکزی نسبت به مبدأ است.","pageRef":"صفحه ۹۴"},{"type":"note","title":"دوران ۹۰ درجه پادساعتگرد حول مبدأ","body":"در دوران ۹۰ درجه پادساعتگرد حول مبدأ، نقطه (x ، y) به نقطه‌ای با مختصات (−y ، x) تبدیل می‌شود.\nمثال: نقطه (۲ ، ۳) پس از این دوران به نقطه (−۳ ، ۲) می‌رود.\nدر دوران ۹۰ درجه ساعتگرد، مختصات تصویر (y ، −x) است.\nجهت دوران و مرکز دوران را همیشه از صورت مسئله مشخص کنید.","pageRef":"صفحه ۹۸"},{"type":"exam","title":"نقطه B با مختصات (−۳ ، ۴) را ابتدا نسبت به محور yها قرینه کنید، سپس تصویر حاصل را با بردار (۱ ، −۲) انتقال دهید.","body":"مرحله اول: تقارن نسبت به محور yها یعنی قرینه کردن مختصه اول، پس تصویر (۳ ، ۴) می‌شود.\nمرحله دوم: انتقال با بردار (۱ ، −۲) یعنی به مختصه اول ۱ و به مختصه دوم −۲ اضافه می‌کنیم: ۳ + ۱ = ۴ و ۴ + (−۲) = ۲.\nتصویر نهایی نقطه‌ای با مختصات (۴ ، ۲) است.\nتوجه: در ترکیب تبدیل‌ها، ترتیب انجام آن‌ها در نتیجه مؤثر است.","pageRef":"صفحه ۱۰۸"},{"type":"exam","title":"تصویر نقطه با مختصات (۵ ، −۲) در دوران ۱۸۰ درجه حول مبدأ چیست؟ توضیح دهید.","body":"دوران ۱۸۰ درجه حول مبدأ همان تقارن مرکزی نسبت به مبدأ است.\nدر این تبدیل هر دو مختصه قرینه می‌شوند: نقطه (x ، y) به نقطه (−x ، −y) می‌رود.\nپس تصویر نقطه (۵ ، −۲) نقطه‌ای با مختصات (−۵ ، ۲) است.\nبررسی: فاصله هر دو نقطه از مبدأ برابر √۲۹ است، پس تصویر در همان فاصله اما در سوی مقابل مبدأ قرار دارد.","pageRef":"صفحه ۱۰۲"}]},{"number":5,"title":"هندسه و استدلال","pages":"۱۱۳ تا ۱۴۴","contents":[{"type":"answer","title":"اندازه زاویه محیطی رو به قطر دایره چقدر است؟ دلیل بیاورید.","body":"زاویه مرکزی رو به نیم‌دایره، یعنی رو به قطر، برابر ۱۸۰ درجه است.\nطبق قضیه کتاب، اندازه هر زاویه محیطی نصف زاویه مرکزی رو به همان کمان است.\nپس زاویه محیطی رو به قطر برابر ۱۸۰ ÷ ۲ یعنی ۹۰ درجه می‌شود.\nبه همین دلیل هر مثلثی که در دایره محاط شود و یک ضلعش قطر باشد، قائم‌الزاویه است.","pageRef":"صفحه ۱۱۶"},{"type":"answer","title":"در دایره‌ای زاویه مرکزی رو به کمان AB برابر ۷۰ درجه است. اندازه زاویه محیطی رو به همان کمان را بیابید.","body":"طبق رابطه زاویه مرکزی و محیطی، اندازه زاویه محیطی نصف زاویه مرکزی رو به همان کمان است.\nپس زاویه محیطی رو به کمان AB برابر ۷۰ ÷ ۲ یعنی ۳۵ درجه است.\nعکس این مطلب هم برقرار است: زاویه مرکزی دو برابر زاویه محیطی رو به کمان مشترک است؛ مثلا اگر زاویه محیطی ۲۵ درجه باشد، زاویه مرکزی رو به همان کمان ۵۰ درجه است.","pageRef":"صفحه ۱۳۰"},{"type":"note","title":"زاویه مرکزی و محیطی","body":"زاویه مرکزی رأس آن مرکز دایره و زاویه محیطی رأس آن روی دایره قرار دارد.\nقضیه مهم: اندازه زاویه محیطی رو به یک کمان، نصف زاویه مرکزی رو به همان کمان است.\nمثال: اگر زاویه مرکزی ۱۲۰ درجه باشد، زاویه محیطی رو به همان کمان ۶۰ درجه است.\nهمه زاویه‌های محیطی رو به یک کمان با هم برابرند.","pageRef":"صفحه ۱۱۸"},{"type":"note","title":"چهارضلعی محاطی در دایره","body":"اگر همه رأس‌های یک چهارضلعی روی یک دایره باشند، آن را چهارضلعی محاطی می‌نامند و مجموع زوایای مقابل آن ۱۸۰ درجه است.\nمثال: در چهارضلعی محاطی ABCD اگر زاویه A برابر ۱۱۰ درجه باشد، زاویه C برابر ۷۰ درجه است.\nهر مربع و هر مستطیل محاطی است ولی لوزی فقط وقتی مربع باشد محاطی می‌شود.","pageRef":"صفحه ۱۲۲"},{"type":"exam","title":"در دایره‌ای زاویه مرکزی AOC برابر ۸۰ درجه است و نقطه B روی کمان بزرگ AC قرار دارد. اندازه زاویه محیطی ABC را حساب کنید.","body":"زاویه مرکزی AOC رو به کمان کوچک AC برابر ۸۰ درجه است.\nچون رأس زاویه ABC روی کمان بزرگ قرار دارد، این زاویه محیطی رو به همان کمان کوچک است.\nطبق قضیه، اندازه زاویه محیطی نصف زاویه مرکزی است: ۸۰ ÷ ۲ = ۴۰ درجه.\nپس اندازه زاویه ABC برابر ۴۰ درجه می‌شود.","pageRef":"صفحه ۱۳۸"},{"type":"exam","title":"در چهارضلعی محاطی ABCD زاویه A برابر ۷۵ و زاویه B برابر ۱۰۰ درجه است. زوایای C و D را بیابید.","body":"در چهارضلعی محاطی مجموع هر دو زاویه مقابل ۱۸۰ درجه است.\nزاویه C مقابل زاویه A است پس ۱۸۰ − ۷۵ = ۱۰۵ درجه.\nزاویه D مقابل زاویه B است پس ۱۸۰ − ۱۰۰ = ۸۰ درجه.\nبررسی: مجموع چهار زاویه ۷۵ + ۱۰۰ + ۱۰۵ + ۸۰ = ۳۶۰ درجه می‌شود که با مجموع زوایای داخلی چهارضلعی سازگار است.","pageRef":"صفحه ۱۳۴"}]},{"number":6,"title":"تشابه","pages":"۱۴۵ تا ۱۷۴","contents":[{"type":"answer","title":"نسبت تشابه دو چندضلعی ۳ به ۵ است. اگر محیط چندضلعی کوچک ۱۲ باشد، محیط چندضلعی بزرگ را بیابید.","body":"در دو شکل متشابه، نسبت محیط‌ها با نسبت تشابه برابر است.\nپس ۱۲ تقسیم بر محیط بزرگ برابر ۳ تقسیم بر ۵.\nاز ضرب متقاطع: ۳ × محیط بزرگ = ۱۲ × ۵ = ۶۰ پس محیط بزرگ = ۲۰ واحد.\nتوجه: نسبت مساحت‌ها برابر مجذور نسبت تشابه یعنی ۹ به ۲۵ است، پس مساحت‌ها را با خود نسبت تشابه مقایسه نمی‌کنیم.","pageRef":"صفحه ۱۴۸"},{"type":"answer","title":"در مثلث ABC پاره‌خطی موازی BC از نقطه D روی AB تا نقطه E روی AC کشیده شده است. اگر AD = ۴ ، DB = ۶ و AE = ۶ باشد، طول EC را بیابید.","body":"طبق قضیه تالس، خطی که موازی یک ضلع مثلث باشد، دو ضلع دیگر را به تناسب قطع می‌کند: AD به DB برابر AE به EC.\nپس ۴ به ۶ مساوی ۶ به EC.\nاز ضرب متقاطع: ۴ × EC = ۶ × ۶ = ۳۶ پس EC = ۹.\nطول EC برابر ۹ واحد است. بررسی: نسبت ۴ به ۶ برابر ۲ به ۳ و نسبت ۶ به ۹ هم ۲ به ۳ است، پس جواب درست است.","pageRef":"صفحه ۱۶۲"},{"type":"note","title":"نسبت تشابه و مساحت","body":"در دو شکل متشابه، نسبت اضلاع متناظر برابر است و به آن نسبت تشابه k می‌گویند.\nنسبت محیط‌ها برابر همان k است اما نسبت مساحت‌ها برابر k به توان ۲ می‌شود.\nمثال: اگر نسبت تشابه دو مثلث ۲ باشد، مساحت مثلث بزرگ ۴ برابر مساحت کوچک است.\nاگر نسبت تشابه ۱ به ۳ باشد، نسبت مساحت‌ها ۱ به ۹ می‌شود.","pageRef":"صفحه ۱۵۰"},{"type":"note","title":"شرط تشابه دو مثلث","body":"دو مثلث متشابه‌اند اگر دو زاویه متناظرشان مساوی باشد؛ چون مجموع زوایای هر مثلث ۱۸۰ درجه است، زاویه سوم هم خودبه‌خود مساوی می‌شود.\nمثال: هر دو مثلث قائم‌الزاویه که یک زاویه تیز مشترک دارند متشابه‌اند.\nکاربرد: برای یافتن ارتفاع اشیا، از تشابه مثلث‌های ساخته‌شده با پرتو خورشید و سایه استفاده می‌کنیم.","pageRef":"صفحه ۱۵۴"},{"type":"exam","title":"میله‌ای به ارتفاع ۲ متر سایه‌ای به طول ۳ متر دارد. در همان لحظه برجی سایه‌ای به طول ۱۵ متر دارد. ارتفاع برج را بیابید.","body":"پرتوی خورشید در یک لحظه با زمین زاویه یکسانی می‌سازد، پس مثلث تشکیل‌شده از میله و سایه‌اش با مثلث برج و سایه‌اش متشابه است.\nنسبت ارتفاع به سایه برابر است: ۲ به ۳ مساوی ارتفاع برج به ۱۵.\nاز ضرب متقاطع: ۳ × ارتفاع برج = ۲ × ۱۵ = ۳۰ پس ارتفاع برج ۱۰ متر است.","pageRef":"صفحه ۱۶۸"},{"type":"exam","title":"نسبت تشابه دو چندضلعی ۲ به ۳ است. اگر مساحت چندضلعی کوچک ۸ واحد مربع باشد، مساحت چندضلعی بزرگ چند است؟","body":"نسبت مساحت‌ها برابر مجذور نسبت تشابه است: ۲ به توان ۲ به ۳ به توان ۲ یعنی ۴ به ۹.\nپس ۸ تقسیم بر مساحت بزرگ مساوی ۴ تقسیم بر ۹.\nاز ضرب متقاطع: ۴ × مساحت بزرگ = ۸ × ۹ = ۷۲ پس مساحت بزرگ ۱۸ واحد مربع است.\nدقت کنید مساحت‌ها را هرگز با خود نسبت تشابه بلکه با مجذور آن مقایسه می‌کنیم.","pageRef":"صفحه ۱۶۴"}]},{"number":7,"title":"آمار و احتمال","pages":"۱۷۵ تا ۲۰۰","contents":[{"type":"answer","title":"یک تاس سالم را پرتاب می‌کنیم. احتمال آمدن عددی بزرگ‌تر از ۴ چقدر است؟","body":"فضای نمونه پرتاب تاس شامل ۶ حالت هم‌شانس است: اعداد ۱ تا ۶.\nپیشامد «عدد بزرگ‌تر از ۴» دو حالت دارد: آمدن ۵ یا ۶.\nپس احتمال برابر ۲ تقسیم بر ۶ یعنی یک‌سوم می‌شود.\nتوجه: احتمال هر عدد خاص ۱/۶ است و مجموع احتمال همه حالت‌های فضای نمونه همیشه ۱ است؛ پس احتمال نیامدن ۵ یا ۶ برابر ۲/۳ می‌شود.","pageRef":"صفحه ۱۷۸"},{"type":"answer","title":"نمره‌های یک دانش‌آموز در پنج آزمون ۱۲ ، ۱۸ ، ۱۵ ، ۱۹ و ۱۶ است. میانگین این نمره‌ها را حساب کنید.","body":"برای محاسبه میانگین، همه داده‌ها را جمع و بر تعدادشان تقسیم می‌کنیم.\nجمع: ۱۲ + ۱۸ = ۳۰ و ۳۰ + ۱۵ = ۴۵ و ۴۵ + ۱۹ = ۶۴ و ۶۴ + ۱۶ = ۸۰. تعداد داده‌ها ۵ است.\nمیانگین = ۸۰ ÷ ۵ = ۱۶.\nپس میانگین نمره‌های این دانش‌آموز ۱۶ است. میانگین همیشه عددی بین کوچک‌ترین و بزرگ‌ترین داده است و برای کنترل جواب به کار می‌رود.","pageRef":"صفحه ۱۹۲"},{"type":"note","title":"احتمال و فضای نمونه","body":"فضای نمونه مجموعه همه حالت‌های ممکن یک آزمایش تصادفی است.\nاحتمال پیشامد E برابر است با تعداد حالت‌های مطلوب تقسیم بر تعداد کل حالت‌های فضای نمونه، به شرط هم‌شانس بودن حالت‌ها.\nاحتمال همیشه عددی بین ۰ و ۱ است؛ احتمال پیشامد غیرممکن ۰ و احتمال پیشامد قطعی ۱ است.\nمثال: احتمال رو آمدن یک سکه سالم ۱/۲ است.","pageRef":"صفحه ۱۸۰"},{"type":"note","title":"پیشامدهای ناسازگار","body":"دو پیشامد ناسازگارند اگر نتوانند هم‌زمان رخ دهند؛ در این صورت احتمال اجتماع آن‌ها برابر جمع احتمال‌هایشان است.\nمثال: در پرتاب یک تاس، پیشامد آمدن ۱ و پیشامد آمدن ۶ ناسازگارند و احتمال هر کدام ۱/۶ است.\nپس احتمال آمدن ۱ یا ۶ برابر ۱/۶ + ۱/۶ = ۲/۶ = ۱/۳ می‌شود.","pageRef":"صفحه ۱۸۴"},{"type":"exam","title":"دو تاس سالم را هم‌زمان پرتاب می‌کنیم. احتمال اینکه مجموع دو عدد ۷ شود چقدر است؟","body":"فضای نمونه پرتاب دو تاس ۶ × ۶ = ۳۶ حالت دارد.\nحالت‌های مطلوب با مجموع ۷ عبارت‌اند از (۱ ، ۶) ، (۲ ، ۵) ، (۳ ، ۴) ، (۴ ، ۳) ، (۵ ، ۲) و (۶ ، ۱)؛ روی‌هم ۶ حالت.\nپس احتمال برابر ۶ تقسیم بر ۳۶ یعنی ۱/۶ می‌شود.\nنکته: مجموع ۷ بیشترین تعداد حالت مطلوب را دارد و محتمل‌ترین مجموع در پرتاب دو تاس است.","pageRef":"صفحه ۱۹۶"},{"type":"exam","title":"کیسه‌ای شامل ۳ توپ سرخ، ۴ توپ سبز و ۲ توپ زرد است. یک توپ را تصادفی بیرون می‌آوریم. احتمال اینکه سرخ یا سبز باشد چقدر است؟","body":"تعداد کل توپ‌ها ۳ + ۴ + ۲ = ۹ است.\nپیشامد «سرخ یا سبز» اجتماع دو پیشامد ناسازگار است.\nاحتمال سرخ ۳/۹ و احتمال سبز ۴/۹ است، پس احتمال اجتماع = ۳/۹ + ۴/۹ = ۷/۹.\nبه روش دیگر: از ۹ توپ، ۷ توپ سرخ یا سبز است پس احتمال ۷/۹. احتمال زرد بودن هم ۲/۹ است و مجموع سه احتمال ۱ می‌شود.","pageRef":"صفحه ۱۹۰"}]}]},{"title":"علوم تجربی نهم","subject":"علوم تجربی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه فصل‌های کتاب علوم تجربی نهم","color":"green","icon":"flask","chapters":[{"number":1,"title":"مواد و نقش آن در زندگی","pages":"۴ تا ۲۰","contents":[{"type":"answer","title":"به نظر شما چرا انسان‌های اولیه سنگ را برای ساختن ابزار به‌کار می‌بردند؟","body":"سنگ‌ها سخت و بادوام بودند و به‌آسانی در دسترس بودند. انسان‌های اولیه با شکستن سنگ‌ها لبه‌های تیز می‌ساختند و از آن‌ها برای شکار، بریدن گوشت و کارهای روزمره بهره می‌گرفتند.\nبا پیشرفت دانش، انسان با فلزهایی مانند مس، برنز و آهن آشنا شد و به‌تدریج دوران سنگ جای خود را به دوران فلزها داد؛ زیرا فلزها چکش‌خوار و شکل‌پذیرتر بودند.","pageRef":"صفحه ۶"},{"type":"answer","title":"فکر کنید: چرا بتن مسلح برای ساختن ستون و تیر پل مناسب‌تر از بتن ساده است؟","body":"بتن در برابر نیروی فشاری مقاوم است، اما در برابر نیروی کششی به‌آسانی می‌شکند. میله‌های فولادی به‌کاررفته در بتن مسلح، نیروی کششی را تحمل می‌کنند.\nبه این ترتیب ترکیب بتن و فولاد، یک ماده کامپوزیت (مرکب) می‌سازد که هم فشار و هم کشیدگی را خوب تحمل می‌کند؛ به همین دلیل برای ستون و تیر پل‌ها بسیار مناسب است.","pageRef":"صفحه ۱۳"},{"type":"note","title":"ماده‌های طبیعی و ساخته‌شده به‌دست انسان","body":"ماده‌ها به دو گروه طبیعی و مصنوعی (ساخته‌شده به‌دست انسان) تقسیم می‌شوند. چوب، پنبه و پوست جانوران طبیعی و پلاستیک، شیشه و آلیاژها مصنوعی هستند.\nمثال: پیراهن پنبه‌ای از الیاف طبیعی و چتر نایلونی از الیاف مصنوعی ساخته شده که از نفت به‌دست می‌آید."},{"type":"note","title":"کامپوزیت‌ها؛ ماده‌هایی مرکب","body":"کامپوزیت ماده‌ای است که از ترکیب دو یا چند ماده ساخته می‌شود و ویژگی‌های آن بهتر از هر یک از اجزای آن به‌تنهایی است.\nمثال: بتن مسلح از بتن (مقاوم در فشار) و میله‌های فولادی (مقاوم در کشش) ساخته می‌شود؛ فیبر شیشه‌ای و کفش ورزشی با کف کامپوزیتی هم نمونه‌های دیگر کامپوزیت هستند."},{"type":"exam","title":"برای ساختن دسته قابلمه، چه ویژگی‌هایی از ماده باید در نظر گرفته شود؟ توضیح دهید.","body":"دسته قابلمه باید از ماده‌ای ساخته شود که گرمارسانا نباشد تا هنگام لمس دست را نسوزاند؛ مقاوم به حرارت باشد تا در دمای بالا ذوب یا تغییر شکل ندهد؛ و سبک و بادوام باشد.\nپاسخ تشریحی: چوب و باکالیت (نوعی پلاستیک) به دلیل گرمارسانا نبودن و مقاومت حرارتی مناسب، برای دسته قابلمه به‌کار می‌روند؛ ولی بدنه فلزی باید گرمارسانا باشد تا زود غذا بپزد."},{"type":"exam","title":"پلیمر چیست؟ با ذکر دو مثال، نقش پلیمرها را در زندگی روزمره توضیح دهید.","body":"پلیمر ماده‌ای است که از به هم پیوستن واحدهای تکراری کوچک (مونومر) ساخته شده است؛ مانند پلیمرهای طبیعی نشاسته و پروتئین‌ها و پلیمرهای مصنوعی پلاستیک و نایلون.\nپاسخ تشریحی: کیسه پلاستیکی از پلی‌اتیلن و پشم گوسفند از پروتئین کراتین ساخته شده است؛ این مواد به دلیل سبکی، ارزانی و شکل‌پذیری در زندگی کاربرد فراوان دارند، اما بازیافت‌ناپذیری برخی از آن‌ها چالش زیست‌محیطی است."}]},{"number":2,"title":"رفتار اتم‌ها با یکدیگر","pages":"۲۲ تا ۳۸","contents":[{"type":"answer","title":"تشکیل پیوند یونی میان اتم‌های سدیم و کلر را توضیح دهید.","body":"اتم سدیم یک الکترون و اتم کلر هفت الکترون در لایه ظرفیت دارد. با انتقال الکترونِ سدیم به کلر، هر دو اتم به آرایش پایدار هشتایی می‌رسند.\nسدیم با از دست دادن الکترون به یون مثبت و کلر با گرفتن الکترون به یون منفی تبدیل می‌شود. نیروی جاذبه الکتریکی میان این دو یون با بار مخالف، پیوند یونی را تشکیل می‌دهد و بلور نمک طعام ساخته می‌شود.","pageRef":"صفحه ۲۷"},{"type":"answer","title":"چرا فلزها رسانای خوب جریان برق هستند؟","body":"در پیوند فلزی، الکترون‌های لایه ظرفیت همه اتم‌های فلز در فضای میان یون‌های مثبت آزادانه حرکت می‌کنند؛ به این الکترون‌ها، الکترون‌های آزاد می‌گویند.\nوقتی اختلاف پتانسیل برق اعمال شود، این الکترون‌ها حرکت جهت‌دار پیدا کرده و جریان برق برقرار می‌شود. به همین دلیل فلزها چه در حالت جامد باشند و چه مذاب، رسانای خوبی هستند.","pageRef":"صفحه ۳۴"},{"type":"note","title":"قاعده هشتایی و لایه ظرفیت","body":"اتم‌ها در ساخت پیوند به‌دنبال پایداری‌اند؛ یعنی رساندن تعداد الکترون‌های لایه ظرفیت به هشت (یا دو برای اتم‌های کوچک مانند هیدروژن).\nمثال: اتم نئون با هشت الکترون ظرفیت، پایدار است و پیوند نمی‌سازد؛ اما اتم اکسیژن با شش الکترون ظرفیت، دو الکترون می‌گیرد یا به اشتراک می‌گذارد."},{"type":"note","title":"پیوند کووالانسی و مولکول","body":"در پیوند کووالانسی، اتم‌های نافلز به‌جای دادن و گرفتن الکترون، آن را به اشتراک می‌گذارند و از به هم پیوستن اتم‌ها، مولکول ساخته می‌شود.\nمثال: در مولکول آب، هر اتم هیدروژن با اکسیژن یک جفت الکترون مشترک دارد؛ دو اتم اکسیژن در مولکول گاز اکسیژن، دو جفت الکترون را به اشتراک می‌گذارند و پیوند دوگانه می‌سازند."},{"type":"exam","title":"نوع پیوند در ترکیب‌های زیر را مشخص و دلیل بیاورید: کلرید سدیم، آب، کلرید منیزیم و گاز نیتروژن.","body":"کلرید سدیم از فلز سدیم و نافلز کلر ساخته شده است، پس پیوند آن یونی است. آب از دو نافلز هیدروژن و اکسیژن ساخته شده، پس پیوند آن کووالانسی است.\nکلرید منیزیم از فلز منیزیم و نافلز کلر ساخته شده، پس یونی است. مولکول گاز نیتروژن از دو اتم نافلز ساخته می‌شود، پس پیوند آن کووالانسی است. قاعده کلی: فلز با نافلز یونی و نافلز با نافلز کووالانسی می‌سازد."},{"type":"exam","title":"چرا دمای ذوب ماده‌های یونی مانند نمک طعام بسیار بیشتر از ماده‌های مولکولی مانند یخ است؟","body":"در ترکیب‌های یونی، نیروی جاذبه میان یون‌های مثبت و منفی بسیار نیرومند است و برای جدا کردن یون‌ها از هم به انرژی زیادی نیاز است؛ به همین دلیل نمک طعام در دمای حدود هشتصد درجه سلسیوس ذوب می‌شود.\nدر ماده‌های مولکولی، مولکول‌ها فقط با نیروهای ضعیفی به هم چسبیده‌اند و با انرژی کمی از هم جدا می‌شوند؛ از این رو یخ در دمای صفر درجه سلسیوس ذوب می‌شود."}]},{"number":3,"title":"به دنبال محیطی بهتر","pages":"۴۰ تا ۵۴","contents":[{"type":"answer","title":"باران اسیدی چگونه تشکیل می‌شود و چه آسیب‌هایی وارد می‌کند؟","body":"سوختن سوخت‌های فسیلی، گازهای گوگرد دی‌اکسید و نیتروژن اکسید را وارد هوا می‌کند. این گازها با بخار آب جو ترکیب شده و اسیدهایی مانند اسید نیتریک و اسید سولفوریک می‌سازند که همراه باران بر زمین می‌بارند و باران اسیدی پدید می‌آورند.\nباران اسیدی درختان را نابود می‌کند، آب رودخانه‌ها و دریاچه‌ها را اسیدی می‌سازد و ساختمان‌ها و مجسمه‌های سنگی را می‌خورد.","pageRef":"صفحه ۴۵"},{"type":"answer","title":"چرا مونوکسید کربن گازی بسیار خطرناک است؟","body":"مونوکسید کربن از سوختن ناقص سوخت‌هایی مانند بنزین و گاز طبیعی تولید می‌شود. این گاز بی‌رنگ و بی‌بو است؛ به همین دلیل وجود آن در هوا احساس نمی‌شود.\nمونوکسید کربن در خون، با سرعت به هموگلوبین گلبول‌های قرمز می‌چسبد و جای اکسیژن را می‌گیرد؛ در نتیجه اکسیژن به یاخته‌های بدن نمی‌رسد و انسان دچار سردرد، سرگیجه و در مقدار زیاد، دچار مرگ می‌شود.","pageRef":"صفحه ۴۴"},{"type":"note","title":"سوخت‌های فسیلی؛ منابع تجدیدناپذیر","body":"زغال‌سنگ، نفت و گاز طبیعی از بقایای جانداران میلیون‌ها سال پیش و زیر فشار و حرارت به‌دست آمده‌اند؛ به همین دلیل تجدیدناپذیرند و روزی به پایان می‌رسند.\nمثال: سوختن بنزین در خودرو، علاوه بر دی‌اکسید کربن، آلاینده‌هایی مانند مونوکسید کربن و نیتروژن اکسید تولید می‌کند که هوای شهرها را آلوده می‌سازد."},{"type":"note","title":"گرم شدن زمین و گازهای گلخانه‌ای","body":"گازهایی مانند دی‌اکسید کربن و متان مانند شیشه گلخانه عمل می‌کنند و بخشی از گرمای تابیده‌شده از خورشید را در جو نگه می‌دارند. مصرف زیاد سوخت‌های فسیلی مقدار این گازها را افزایش داده و میانگین دمای زمین بالا رفته است.\nمثال: ذوب شدن یخچال‌های طبیعی قطب‌ها و بالا آمدن سطح آب دریاها از پیامدهای گرم شدن زمین است."},{"type":"exam","title":"چهار راهکار برای کاهش آلودگی هوا در شهرها پیشنهاد دهید و توضیح دهید.","body":"راهکارهای پیشنهادی:\nالف) توسعه حمل‌ونقل عمومی و کاهش استفاده از خودروی شخصی؛ زیرا هر اتوبوس جای ده‌ها خودرو را می‌گیرد.\nب) جایگزینی انرژی‌های پاک مانند انرژی خورشیدی و بادی به‌جای سوخت‌های فسیلی.\nپ) استفاده از خودروهای برقی و هیبریدی.\nت) تصفیه دود کارخانه‌ها و نصب فیلتر پیش از رها کردن آن به هوا.\nکاشت درختان نیز به تصفیه طبیعی هوا کمک می‌کند."},{"type":"exam","title":"منشأ آلودگی‌های آب را با ذکر چند نمونه توضیح دهید.","body":"۱) فاضلاب‌های خانگی و شهری که ماده‌های آلی دارند و باعث رشد بیش از حد جانداران و کمبود اکسیژن آب می‌شوند.\n۲) پساب کارخانه‌ها که ممکن است فلزهای سنگینی مانند جیوه و سرب داشته باشند؛ این فلزها در بدن جانداران انباشته می‌شوند و به انسان می‌رسند.\n۳) شیرابه‌های محل دفن زباله و شسته شدن کودهای کشاورزی به دریاچه‌ها، آب‌های زیرزمینی را هم آلوده می‌کند."}]},{"number":4,"title":"حرکت چیست؟","pages":"۵۶ تا ۷۲","contents":[{"type":"answer","title":"دونده‌ای یک دور کامل میدان دایره‌ای را می‌دود. مسافت و جابجایی او را تعیین کنید.","body":"مسافت، طول مسیر طی‌شده است؛ پس دونده‌ای که یک دور کامل میدان را می‌دود، مسافتی برابر محیط میدان را طی کرده است.\nجابجایی، بردار تغییر مکان از نقطه شروع تا پایان حرکت است؛ چون دونده به نقطه آغاز بازگشته، نقطه شروع و پایان حرکت یکسان است و جابجایی برابر صفر می‌شود. پس در این حرکت، مسافت عددی بزرگ‌تر از صفر، اما جابجایی صفر است.","pageRef":"صفحه ۶۱"},{"type":"answer","title":"خودرویی در مدت ۲ ساعت مسافت ۱۸۰ کیلومتر را طی می‌کند. تندی متوسط آن را به‌دست آورید.","body":"تندی متوسط از تقسیم مسافت طی‌شده بر زمان به‌دست می‌آید. مسافت برابر ۱۸۰ کیلومتر و زمان برابر ۲ ساعت است؛ پس تندی متوسط برابر ۱۸۰ تقسیم بر ۲ یعنی ۹۰ کیلومتر بر ساعت است.\nاگر بخواهیم پاسخ بر حسب متر بر ثانیه باشد، عدد ۹۰ کیلومتر بر ساعت تقریباً برابر ۲۵ متر بر ثانیه می‌شود.","pageRef":"صفحه ۶۵"},{"type":"note","title":"مسافت و جابجایی دو مفهوم متفاوت","body":"مسافت کمیتی نرده‌ای است و فقط اندازه دارد، اما جابجایی کمیت برداری است و اندازه و جهت دارد؛ جابجایی از مبدأ حرکت به مکان نهایی رسم می‌شود.\nمثال: اگر شخصی ۵ گام به سمت شرق و سپس ۵ گام به سمت غرب برود، مسافت او ۱۰ گام، ولی جابجایی‌اش صفر است."},{"type":"note","title":"شتاب؛ اندازه‌گیری تغییر سرعت","body":"شتاب، تغییر سرعت در واحد زمان است و واحد آن متر بر مجذور ثانیه می‌باشد. اگر سرعت جسم افزایش یابد شتاب مثبت و اگر سرعت کاهش یابد (جسم کند شود) شتاب منفی است.\nمثال: اگر سرعت خودرو در ۵ ثانیه از صفر به ۲۰ متر بر ثانیه برسد، شتاب آن برابر ۲۰ تقسیم بر ۵ یعنی ۴ متر بر مجذور ثانیه است."},{"type":"exam","title":"خودرویی با تندی ثابت ۲۵ متر بر ثانیه حرکت می‌کند. در مدت ۸ ثانیه چه مسافتی را طی می‌کند؟","body":"مسافت طی‌شده برابر است با تندی ضرب در زمان. با جای‌گذاری اعداد داریم: مسافت برابر ۲۵ ضرب در ۸ یعنی ۲۰۰ متر.\nپس خودرو در ۸ ثانیه ۲۰۰ متر جابه‌جا می‌شود. توجه کنید در حرکت با تندی ثابت (حرکت یکنواخت)، این رابطه دقیقاً درست است و اگر تندی تغییر کند، باید از تندی متوسط استفاده کنیم."},{"type":"exam","title":"تفاوت تندی متوسط و سرعت متوسط را با یک مثال توضیح دهید.","body":"تندی متوسط برابر مسافت طی‌شده تقسیم بر زمان و کمیت نرده‌ای است، اما سرعت متوسط برابر جابجایی تقسیم بر زمان و کمیت برداری است.\nمثال: دونده‌ای که یک دور پیست دایره‌ای ۴۰۰ متری را در ۵۰ ثانیه می‌دود، تندی متوسطش ۴۰۰ تقسیم بر ۵۰ یعنی ۸ متر بر ثانیه است؛ اما چون جابجایی او صفر است، سرعت متوسطش هم صفر می‌شود."}]},{"number":5,"title":"نیرو","pages":"۷۴ تا ۹۶","contents":[{"type":"answer","title":"دو نفر جعبه‌ای را با نیروهای ۲۰۰ و ۱۵۰ نیوتون در یک جهت هُل می‌دهند و اصطکاک ۱۰۰ نیوتون بر آن اثر می‌کند. نیروی خالص چقدر است؟","body":"نیرو کمیت برداری است؛ نیروهای هم‌جهت با هم جمع می‌شوند. مجموع دو نیروی هُل برابر ۲۰۰ به‌علاوه ۱۵۰ یعنی ۳۵۰ نیوتون است.\nنیروی اصطکاک مخالف جهت حرکت است، پس از مجموع کم می‌شود: نیروی خالص برابر ۳۵۰ منهای ۱۰۰ یعنی ۲۵۰ نیوتون در جهت حرکت جعبه. چون نیروی خالص صفر نیست، تندی جعبه افزایش می‌یابد و جعبه شتاب می‌گیرد.","pageRef":"صفحه ۸۱"},{"type":"answer","title":"چرا فضانوردان در ماه می‌توانند به‌آسانی و بلندتر از زمین بپرند؟","body":"گرانش نیرویی غیرتماسی است که جرم‌ها را به سمت هم می‌کشد. جرم فضانورد در ماه و زمین یکسان است، اما شتاب گرانش ماه حدود یک‌ششم شتاب گرانش زمین است.\nپس وزن فضانورد در ماه حدود یک‌ششم وزن او روی زمین است و برای پریدن به نیروی کمتری نیاز دارد؛ به همین دلیل با همان توان عضلانی، بلندتر و دورتر می‌پرد.","pageRef":"صفحه ۸۶"},{"type":"note","title":"نیروهای تماسی و غیرتماسی","body":"نیرویی که با تماس مستقیم اعمال می‌شود، نیروی تماسی نام دارد؛ مانند هُل دادن میز، کشیدن طناب و اصطکاک. نیرویی که بدون تماس اثر می‌کند، غیرتماسی است؛ مانند گرانش، نیروی الکتریکی و نیروی مغناطیسی.\nمثال: آهن‌ربایی که میخ را از فاصله‌ای بالای آن بالا می‌کشد، نیروی غیرتماسی مغناطیسی وارد می‌کند."},{"type":"note","title":"اصطکاک؛ گاهی مفید، گاهی مضر","body":"اصطکاک نیروی تماسی است که در سطح تماس دو جسم، مخالف جهت حرکت نسبی عمل می‌کند. بدون اصطکاک، راه رفتن و ترمز گرفتن ناممکن بود.\nمثال: لاستیک خودرو شیاردار است تا اصطکاک آن با جاده زیاد شود؛ اما در یاتاقان موتور با روغن‌کاری اصطکاک را کم می‌کنند تا انرژی هدر نرود و قطعه‌ها فرسوده نشوند."},{"type":"exam","title":"سه اثر نیرو بر جسم را نام ببرید و برای هر کدام یک مثال بزنید.","body":"نخست، تغییر شکل در جسم؛ مانند کشیده شدن فنر با دست.\nدوم، تغییر تندی جسم؛ مانند رمز گرفتن خودرو که تندی آن را کم می‌کند.\nسوم، تغییر جهت حرکت جسم؛ مانند تغییر مسیر توپ فوتبال پس از ضربه بازیکن.\nپاسخ تشریحی: تغییر تندی یا جهت، به معنی تغییر سرعت است و هرگاه سرعت تغیر کند، جسم شتاب می‌گیرد؛ پس نیرو موجب شتاب می‌شود."},{"type":"exam","title":"در چه مواردی باید اصطکاک را زیاد و در چه مواردی کم کنیم؟ با مثال توضیح دهید.","body":"گاهی باید اصطکاک را زیاد کرد: لاستیک‌ها را شیاردار می‌سازند تا خودرو در جاده خیس لیز نخورد و کف کفش را عاج‌دار می‌کنند تا روی زمین سُر نخوریم.\nگاهی باید اصطکاک را کم کرد: چرخ‌دنده‌های ماشین را روغن‌کاری می‌کنند و از غلتک و بلبرینگ استفاده می‌کنند تا اصطکاک و فرسایش کاهش یابد و انرژی کمتری تلف شود. پس اصطکاک همیشه مضر نیست."}]},{"number":6,"title":"زمین پویا","pages":"۹۸ تا ۱۲۲","contents":[{"type":"answer","title":"تفاوت مرکز درونی و مرکز سطحی زمین‌لرزه را توضیح دهید.","body":"زمین‌لرزه در نقطه‌ای درون زمین آغاز می‌شود که به آن مرکز درونی می‌گویند؛ در این نقطه، سنگ‌ها با آزاد کردن ناگهانی انرژی می‌شکنند.\nنقطه‌ای از سطح زمین که دقیقاً بالای مرکز درونی قرار دارد، مرکز سطحی نام دارد و شدت لرزش در آن بیشترین مقدار است. هرچه فاصله یک محل از مرکز سطحی بیشتر باشد، خسارت لرزه معمولاً کمتر است.","pageRef":"صفحه ۱۰۸"},{"type":"answer","title":"چرا زمین‌لرزه و آتشفشان در برخی نواحی زمین بسیار رخ می‌دهد و در برخی نواحی کم؟","body":"پوسته زمین از صفحه‌های بزرگ زمین‌ساختی ساخته شده که به‌آرامی روی گوشته حرکت می‌کنند. در مرز این صفحه‌ها، صفحه‌ها به هم فشار می‌آورند، از هم دور می‌شوند یا روی هم می‌لغزند؛ بیشتر زمین‌لرزه‌ها و آتشفشان‌ها در همین مرزها رخ می‌دهند.\nبه همین دلیل کشورهایی مانند ایران که روی مرز صفحه‌ها قرار دارند لرزه‌خیزند و نواحی دور از مرز صفحه‌ها آرام‌ترند.","pageRef":"صفحه ۱۰۲"},{"type":"note","title":"لایه‌های درونی زمین","body":"زمین از سه لایه اصلی ساخته شده است: پوسته، لایه نازک و سخت سطحی؛ گوشته، لایه ضخیم و داغ زیر پوسته؛ و هسته که از آهن و نیکل ساخته شده و دو بخش درونی و بیرونی دارد.\nمثال: بخش بیرونی هسته مذاب است و حرکت فلز مذاب در آن، میدان مغناطیسی زمین را پدید می‌آورد."},{"type":"note","title":"سه گروه سنگ‌های پوسته زمین","body":"سنگ‌های آذرین از سرد شدن و انجماد ماگما به‌دست می‌آیند؛ سنگ‌های رسوبی از ته‌نشین شدن خرده‌سنگ‌ها و بقایای جانداران در آب؛ و سنگ‌های دگرگونی از تغییر سنگ‌های دیگر زیر فشار و حرارت زیاد.\nمثال: گرانیت آذرین، ماسه‌سنگ رسوبی و مرمر که از دگرگونی سنگ آهک ساخته می‌شود، نمونه‌های این سه گروه‌اند."},{"type":"exam","title":"در هنگام زمین‌لرزه چه اقدام‌های ایمنی باید انجام دهیم؟ سه مورد را بنویسید.","body":"نخست، هنگام لرزه آرام بمانیم و به زیر میز محکم پناه ببریم یا کنار ستون و دیوار داخلی سینه‌خیز بنشینیم و سر را با دست‌ها بپوشانیم.\nدوم، از پنجره، آینه و وسایل سنگین که ممکن است بیفتند دور شویم و از آسانسور استفاده نکنیم.\nسوم، پس از پایان لرزه، برق و گاز را قطع کنیم و با آرامش از راه‌پله به فضای باز و دور از ساختمان‌ها برویم."},{"type":"exam","title":"چرخه سنگ‌ها را از سنگ آذرین آغاز کنید و مراحل آن را توضیح دهید.","body":"ماگما پس از سرد شدن، سنگ آذرین می‌سازد. خرد شدن سنگ آذرین با هوازدگی و فرسایش، رسوب تولید می‌کند؛ رسوب‌ها پس از ته‌نشین شدن و فشرده شدن، سنگ رسوبی می‌سازند.\nاگر سنگ آذرین یا رسوبی به عمق زمین برود و زیر فشار و حرارت زیاد قرار گیرد، سنگ دگرگونی به‌دست می‌آید. اگر سنگ‌ها ذوب شوند، دوباره ماگما پدید می‌آید و چرخه ادامه می‌یابد."}]},{"number":7,"title":"فراوانی و تنوع زیستی","pages":"۱۲۴ تا ۱۴۲","contents":[{"type":"answer","title":"ویروس‌ها را زنده می‌دانید یا بی‌جان؟ با دلیل توضیح دهید.","body":"ویروس‌ها در مرز زندگی قرار دارند؛ آنها یاخته ندارند و فقط از ماده ژنتیکی (DNA یا RNA) و پوشش پروتئینی ساخته شده‌اند.\nبیرون از یاخته زنده، هیچ نشانه زندگی و سوخت‌وسازی ندارند؛ اما پس از ورود به یاخته جاندار، شروع به تکثیر می‌کنند. به همین دلیل برخی دانشمندان ویروس را موجود زنده و برخی دیگر آن را ذره‌ای در مرز میان زنده و بی‌جان می‌دانند.","pageRef":"صفحه ۱۳۳"},{"type":"answer","title":"یاخته‌های پروکاریوتی و یوکاریوتی چه تفاوتی با هم دارند؟","body":"در یاخته‌های یوکاریوتی، هسته غشادار وجود دارد و ماده ژنتیکی درون هسته قرار گرفته است؛ یاخته جانوران، گیاهان، قارچ‌ها و آغازیان از این نوع است.\nدر یاخته‌های پروکاریوتی، هسته غشادار وجود ندارد و ماده ژنتیکی مستقیماً درون سیتوپلاسم شناور است. تنها جانداران دارای یاخته پروکاریوتی، باکتری‌ها هستند که فراوان‌ترین جانداران زمین‌اند.","pageRef":"صفحه ۱۳۱"},{"type":"note","title":"مفهوم گونه در رده‌بندی جانداران","body":"به گروهی از جانداران که توانایی تولید مثل با یکدیگر را دارند و از این تولید مثل، فرزند زنده و بارور به‌دست می‌آید، گونه می‌گویند. اعضای یک گونه بیشترین شباهت ژنتیکی را به هم دارند.\nمثال: همه انسان‌های روی زمین یک گونه‌اند؛ اما اسب و الاغ گرچه با هم تولید مثل می‌کنند، فرزندشان (قاطر) نازاست، پس در یک گونه نیستند."},{"type":"note","title":"پنج پادشاهی جانداران","body":"جانداران به پنج پادشاهی تقسیم می‌شوند: تک‌یاخته‌های بدون هسته (باکتری‌ها)، آغازیان، قارچ‌ها، گیاهان و جانوران. معیار این تقسیم‌بندی، نوع یاخته و شیوه تغذیه جاندار است.\nمثال: قارچ‌ها هسته غشادار دارند، اما سبزینه (کلروفیل) ندارند و از جذب مواد غذایی موجود در محیط تغذیه می‌کنند؛ به همین دلیل از گیاهان جدا شده و پادشاهی مستقلی دارند."},{"type":"exam","title":"چرا حفظ تنوع زیستی برای بقای زیست‌کره اهمیت دارد؟ با دو دلیل توضیح دهید.","body":"دلیل اول: هر گونه در زنجیره غذایی نقشی دارد؛ حذف یک گونه باعث به هم خوردن تعادل اکوسیستم و کاهش جمعیت گونه‌های وابسته به آن می‌شود.\nدلیل دوم: تنوع زیستی منبع غذا، دارو و مواد اولیه برای انسان است؛ بسیاری از داروها از گیاهان به‌دست می‌آیند.\nحفاظت از زیستگاه‌ها و جلوگیری از شکار بی‌رویه، راه نگه داشتن این گنج طبیعی برای نسل‌های آینده است."},{"type":"exam","title":"مخمر را از نظر تعداد یاخته، نوع یاخته و پادشاهی آن مشخص کنید.","body":"مخمر جانداری تک‌یاخته است. یاخته آن یوکاریوتی است؛ یعنی هسته غشادار دارد و ماده ژنتیکی درون هسته قرار گرفته است.\nمخمر سبزینه ندارد و از تجزیه مواد آلی مانند شکر تغذیه می‌کند؛ پس در پادشاهی قارچ‌ها قرار می‌گیرد. نکته: مخمرها در خمیر مایه، گاز دی‌اکسید کربن تولید کرده و خمیر را ور می‌آورند؛ به همین دلیل در صنعت غذا کاربرد فراوانی دارند."}]},{"number":8,"title":"ماشین‌ها","pages":"۱۴۴ تا ۱۶۰","contents":[{"type":"answer","title":"کار انجام‌شده برای جابه‌جا کردن باری با نیروی ۵۰ نیوتون در جهت نیرو، به مسافت ۲ متر چقدر است؟","body":"کار از ضرب اندازه نیرو در جابجایی در جهت نیرو به‌دست می‌آید: کار برابر است با ۵۰ ضرب در ۲ یعنی ۱۰۰ ژول. واحد کار، ژول است و هر ژول برابر یک نیوتون‌متر می‌باشد.\nتوجه: اگر نیرو عمود بر جهت جابجایی وارد شود، کاری انجام نمی‌شود؛ مثلاً نیروی وزن هنگام حرکت افقی جسم، کار انجام نمی‌دهد.","pageRef":"صفحه ۱۴۹"},{"type":"answer","title":"سطح شیبدار چگونه انجام دادن کار را آسان می‌کند؟","body":"سطح شیبدار ماشینی ساده است که با زیاد کردن مسافت حرکت، نیروی لازم برای بالا بردن جسم را کم می‌کند. برای بالا بردن مستقیم جسم، نیرویی برابر وزن آن لازم است؛ اما روی سطح شیبدار نیرویی کمتر از وزن کافی است.\nمثال: باربرها بار را روی سطح شیبدار به کامیون می‌برند؛ مسافت بیشتر می‌شود، اما نیروی کمتری لازم است.","pageRef":"صفحه ۱۵۴"},{"type":"note","title":"اهرم‌های نوع اول، دوم و سوم","body":"در اهرم نوع اول، تکیه‌گاه میان نیرو و بار قرار دارد؛ مانند الاکلنگ و قیچی. در نوع دوم، بار میان تکیه‌گاه و نیرو است؛ مانند فرابین (در بازکن) و چرخ دستی. در نوع سوم، نیرو میان تکیه‌گاه و بار قرار دارد؛ مانند انبر قند و دست انسان.\nمثال: در اهرم نوع دوم، بازوی نیرو همیشه از بازوی بار بلندتر است و به نیروی کمتری نیاز می‌شود."},{"type":"note","title":"بازده ماشین‌ها همیشه صد درصد نیست","body":"بازده برابر است با تقسیم کار مفید بر کار داده‌شده و ضرب در صد. در ماشین‌های واقعی، بخشی از انرژی به دلیل اصطکاک به گرمای بی‌فایده تبدیل می‌شود؛ پس بازده همیشه کمتر از صد درصد است.\nمثال: اگر برای بالا بردن باری ۴۰۰ ژول کار مفید انجام شود ولی ۵۰۰ ژول کار به ماشین داده شود، بازده برابر ۸۰ درصد است."},{"type":"exam","title":"جسمی ۲۰۰ نیوتون وزن دارد و با سطح شیبداری به ارتفاع ۱ متر برده می‌شود؛ نیروی ۸۰ نیوتون در مسافت ۳ متر به‌کار می‌رود. کار داده‌شده، کار مفید و بازده را حساب کنید.","body":"کار داده‌شده برابر است با نیرو ضرب در مسافت: ۸۰ ضرب در ۳ یعنی ۲۴۰ ژول.\nکار مفید برای بالا بردن جسم برابر وزن ضرب در ارتفاع است: ۲۰۰ ضرب در ۱ یعنی ۲۰۰ ژول.\nبازده برابر است با ۲۰۰ تقسیم بر ۲۴۰ و ضرب در صد، یعنی حدود ۸۳ درصد. تفاوت این دو کار برای غلبه بر نیروی اصطکاک سطح شیبدار صرف می‌شود."},{"type":"exam","title":"قرقره ثابت چه کمکی به ما می‌کند؟ آیا در آن کار کمتری انجام می‌دهیم؟ توضیح دهید.","body":"قرقره ثابت فقط جهت نیرو را عوض می‌کند؛ یعنی به‌جای بالا کشیدن بار، طناب را از بالا به پایین می‌کشیم که راحت‌تر است. اندازه نیروی کشش تقریباً برابر وزن بار است و مسافت کشیدن طناب هم برابر ارتفاع بالارفتن بار می‌باشد؛ پس کار انجام‌شده کم نمی‌شود.\nقرقره ثابت نوعی اهرم نوع اول است که تکیه‌گاه آن در وسط قرار دارد و بازوی نیرو و بازوی بار برابرند."}]},{"number":9,"title":"نگاهی به فضا","pages":"۱۶۲ تا ۱۸۴","contents":[{"type":"answer","title":"تلسکوپ شکستی و تلسکوپ بازتابی چه تفاوتی با هم دارند؟","body":"تلسکوپ شکستی از عدسی‌های شفاف ساخته شده است؛ نور از عدسی عبور می‌کند و تصویر جرم آسمانی تشکیل می‌شود. تلسکوپ بازتابی به‌جای عدسی از آینه مقعر استفاده می‌کند؛ نور پس از بازتاب از آینه اصلی و آینه دوم به چشمگاه می‌رسد.\nساخت تلسکوپ بازتابی در اندازه‌های بزرگ آسان‌تر است، زیرا آینه فقط از یک طرف باید صیقلی باشد، ولی عدسی باید هر دو طرف تراش‌خورده و بی‌نقص باشد.","pageRef":"صفحه ۱۶۶"},{"type":"answer","title":"چهار سیاره درونی سامانه خورشیدی را نام ببرید و بگویید چرا به آن‌ها سیاره‌های سنگی می‌گویند.","body":"سیاره‌های عطارد، زهره، زمین و مریخ چهار سیاره درونی سامانه خورشیدی‌اند. سطح این سیاره‌ها از سنگ و فلز ساخته شده و اندازه آن‌ها نسبتاً کوچک است؛ به همین دلیل به آن‌ها سیاره‌های سنگی می‌گویند.\nدر مقابل، سیاره‌های بیرونی مانند مشتری، زحل، اورانوس و نپتون غول‌های گازی‌اند و بیشتر از گازهایی مانند هیدروژن و هلیم ساخته شده‌اند.","pageRef":"صفحه ۱۷۴"},{"type":"note","title":"ماهواره و کاربردهای آن","body":"ماهواره جسمی است که در مداری دور زمین یا جرم آسمانی دیگر می‌گردد. ماهواره‌های هواشناسی پیش‌بینی وضع هوا، ماهواره‌های ارتباطی انتقال برنامه‌های رادیویی و تلویزیونی و تلفن، و ماهواره‌های تحقیقاتی بررسی زمین را انجام می‌دهند.\nمثال: ماه زمین ماهواره طبیعی است، اما ماهواره‌های مصنوعی را انسان ساخته و با موشک به فضا فرستاده است."},{"type":"note","title":"ساخت تلسکوپ‌ها در ارتفاعات","body":"جو زمین نور ستاره‌ها را پراکنده می‌کند و بخار آب بخشی از امواج را جذب می‌کند. در ارتفاعات بلند، هوا رقیق‌تر، صاف‌تر و کم‌ابرتر است؛ در نتیجه تصویر واضح‌تری از اجرام آسمانی به‌دست می‌آید.\nمثال: بزرگ‌ترین تلسکوپ‌های جهان بر قله کوه‌هایی در شیلی و هاوایی ساخته شده‌اند؛ جایی که در بیشتر سال‌ها هوا صاف و آرام است."},{"type":"exam","title":"دو دلیل بنویسید که چرا برای مطالعه اجسام آسمانی، تلسکوپ بهتر از چشم غیرمسلح است.","body":"اول، تلسکوپ نور بسیار بیشتری جمع می‌کند؛ به این ترتیب اجسام کم‌نور و دور که با چشم دیده نمی‌شوند، قابل مشاهده می‌شوند.\nدوم، بزرگ‌نمایی تلسکوپ بسیار بیشتر از چشم است؛ پس جزئیات سطح ماه، حلقه‌های زحل و لکه‌های خورشید دیده می‌شوند.\nهمچنین با عکاسی و ثبت نور در مدت طولانی، اجسام بسیار دور هم ثبت می‌شوند."},{"type":"exam","title":"چرا در ایستگاه فضایی، اجسام و فضانوردان بی‌وزن به نظر می‌رسند؟","body":"ایستگاه فضایی به‌دور از زمین در حال سقوط آزاد دائمی است؛ یعنی ایستگاه و همه چیز داخل آن با شتاب یکسان به‌سوی زمین می‌افتند، اما به‌دلیل حرکت جانبی هرگز به زمین نمی‌رسند.\nچون کف ایستگاه با همان شتاب پایین می‌رود، هیچ نیروی فشاری از کف به اجسام وارد نمی‌شود و اجسام بی‌وزن به نظر می‌رسند. نکته: گرانش در ارتفاع ایستگاه هنوز حدود نود درصد مقدار آن در سطح زمین است؛ بی‌وزنی به معنی نبود گرانش نیست، بلکه نبود نیروی پشتیبان است."}]},{"number":10,"title":"نوترکیبی و ژنتیک","pages":"۱۸۶ تا ۲۰۸","contents":[{"type":"answer","title":"تولید مثل جنسی و غیرجنسی چه تفاوتی با هم دارند؟","body":"در تولید مثل غیرجنسی فقط یک والد وجود دارد و فرزند تقریباً هم‌تای والد است؛ مانند جوانه زدن مخمر، تقسیم باکتری و روییدن غده سیب‌زمینی.\nدر تولید مثل جنسی، یاخته جنسی نر (اسپرم) و یاخته جنسی ماده (تخمک) با هم ترکیب می‌شوند؛ به این ترکیب لقاح می‌گویند. فرزند حاصل، تفاوت‌های ژنتیکی با والدین دارد و همین تنوع، شانس سازگاری بهتر گونه را بالا می‌برد.","pageRef":"صفحه ۱۸۹"},{"type":"answer","title":"اگر دو گیاه ناخالص بلند نخودفرنگی با هم لقاح یابند، ویژگی نسل دوم چگونه خواهد بود؟","body":"هر گیاه ناخالص بلند، دو نوع گامت می‌سازد: یکی حامل ژن بلندی (T) و دیگری حامل ژن کوتاهی (t). با ترکیب گامت‌ها، چهار ترکیب به‌دست می‌آید: TT و دو بار Tt و tt.\nژن بلندی غالب است، پس سه ترکیب نخست گیاه بلند و فقط ترکیب tt گیاه کوتاه می‌سازد. نتیجه: نسبت گیاه بلند به کوتاه در نسل دوم ۳ به ۱ است؛ یعنی از هر ۴ گیاه، به‌طور میانگین ۳ گیاه بلند و ۱ گیاه کوتاه به‌دست می‌آید.","pageRef":"صفحه ۲۰۰"},{"type":"note","title":"ژن، آلل و صفت غالب و نهفته","body":"ژن بخشی از DNA است که دستور ساخت یک صفت را دارد. هر ژن می‌تواند شکل‌های گوناگونی داشته باشد که به آن‌ها آلل می‌گویند. آلل غالب با حرف بزرگ و آلل نهفته با حرف کوچک نشان داده می‌شود.\nمثال: در نخودفرنگی، گیاه TT و Tt هر دو بلندند، اما فقط گیاه tt کوتاه است؛ پس ژن کوتاهی در گیاه ناخالص پنهان مانده است."},{"type":"note","title":"دگرگشت؛ تغییر شکل در رشد جانوران","body":"به تغییر شکل چشمگیر برخی جانوران از نوزادی تا بزرگسالی، دگرگشت می‌گویند. در دگرگشت کامل، مرحله شفیره هم وجود دارد؛ مانند تبدیل تخم پروانه به کرم ابریشم، سپس شفیره و در پایان پروانه کامل.\nمثال: نوزاد قورباغه (تادیه) در آب زندگی می‌کند و با آبشش تنفس می‌کند؛ به‌تدریج با رشد پاها و ریه، به قورباغه بالغ تبدیل می‌شود."},{"type":"exam","title":"تولید مثل جنسی و غیرجنسی را از نظر ویژگی فرزندان حاصل مقایسه کنید و برای هر کدام یک مثال بزنید.","body":"در تولید مثل غیرجنسی، فرزند ژن‌های خود را فقط از یک والد می‌گیرد و تقریباً نسخه‌ای هم‌تا از والد است؛ مانند جوانه زدن هیدر و روییدن پیاز.\nدر تولید مثل جنسی، فرزند نیمی از ژن‌های خود را از والد نر و نیم دیگر را از والد ماده می‌گیرد؛ پس با هیچ‌یک از والدین یکسان نیست؛ مانند تولد بچه گربه.\nهمین تفاوت‌ها باعث تنوع ژنتیکی در گونه می‌شود و شانس بقای گونه در برابر تغییر محیط را بیشتر می‌کند."},{"type":"exam","title":"اگر گیاه کوتاه نخودفرنگی با گیاه ناخالص بلند لقاح یابد، نسبت صفت‌های نسل حاصل چقدر است؟","body":"گیاه کوتاه فقط گامت t می‌سازد و گیاه ناخالص بلند، گامت‌های T و t تولید می‌کند. با ترکیب گامت‌ها، دو نوع فرزند به‌دست می‌آید: Tt که بلند و tt که کوتاه است.\nپس نسبت گیاه بلند به کوتاه برابر ۱ به ۱ می‌شود؛ یعنی از هر ۴ بذر، به‌طور میانگین ۲ بذر گیاه بلند و ۲ بذر گیاه کوتاه می‌دهد. این آزمایش نشان می‌دهد گیاه بلندِ ظاهری، ژن نهفته کوتاهی را نیز در خود پنهان کرده است."}]}]},{"title":"فارسی نهم","subject":"فارسی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب فارسی نهم","color":"purple","icon":"book","chapters":[{"number":1,"title":"ستایش","pages":"۷ تا ۹","contents":[{"type":"answer","title":"ستایش با چه کسانی آغاز می‌شود و ستایشگر چه درخواستی دارد؟","body":"در ستایش، شاعر با نام و یاد خداوند آغاز می‌کند؛ او را ستایش می‌کند و برای یادگیری، آگاهی و مهربانی، درخواست یاری دارد.\nآغاز هر کتاب با ستایش، نشان توکل و ادب به پیشگاه خداست.","pageRef":"صفحه ۷"},{"type":"answer","title":"کار ورقه‌ای: دو صفت زیبای خداوند که در ستایش آمده است را نام ببرید.","body":"در ستایش، خداوند با صفت‌هایی مانند بخشنده، مهربان، دانا و آمرزنده یاد شده است؛\nمثلاً می‌توان گفت خداوند بخشنده و آمرزنده است که بندگانش را می‌بخشد و به آنان روزی می‌دهد.","pageRef":"صفحه ۸"},{"type":"note","title":"نکته املا: همزه «آ» در آغاز واژه‌ها","body":"واژه‌هایی مانند آسمان، آفرید و آمرزنده با همزه آغاز می‌شوند؛ در آغاز واژه، همزه همیشه با فتحه زیر آن نوشته می‌شود.\nمثال: آگاه، آواز، آتش. این نکته در املای ستایش پرکاربرد است.","pageRef":"صفحه ۸"},{"type":"note","title":"آرایه تشخیص در شعر","body":"هرگاه ویژگی انسان به غیر انسان داده شود، آرایه تشخیص داریم.\nمثال: مولوی می‌گوید: «بشنو این نی چون شکایت می‌کند / از جدایی‌ها حکایت می‌کند»؛ نی مانند انسان شکایت و سخن می‌گوید.","pageRef":"صفحه ۹"},{"type":"exam","title":"سوال امتحانی: چرا کتاب‌های درسی با ستایش آغاز می‌شوند؟","body":"پاسخ تشریحی: زیرا یادگیری، نعمت بزرگ خداست و آغاز با نام او، ادب و توکل را آموزش می‌دهد؛ فردوسی نیز شاهنامه را با «به نام خداوند جان و خرد» آغاز کرده است.\nاین آغاز، آرامش و انگیزه یادگیری می‌دهد."},{"type":"exam","title":"سوال امتحانی: برای واژه «ستایش» دو هم‌معنی بنویسید و در جمله به کار ببرید.","body":"پاسخ تشریحی: ستایش یعنی تحسین و بزرگداشت؛ هم‌معنی‌های آن، ثنا و حمد است.\nمثال: «همه ثنای خداوند را با دل و زبان می‌گوییم» که در آن ثنا همان ستایش است."}]},{"number":2,"title":"شکر نعمت","pages":"۱۰ تا ۱۹","contents":[{"type":"answer","title":"نویسنده در درس شکر نعمت به کدام نعمت‌ها اشاره می‌کند؟","body":"نویسنده نعمت‌هایی مانند خورشید، هوا، آب، نان، خانواده و سلامتی را یاد می‌کند و می‌گوید باید با نگاه دقیق، همه را از خداوند بدانیم و شکرگزار باشیم.","pageRef":"صفحه ۱۱"},{"type":"answer","title":"کار ورقه‌ای: از نظر نویسنده، شکر نعمت چگونه انجام می‌شود؟","body":"شکر نعمت تنها با زبان نیست؛ نخست باید نعمت را بشناسیم و قدر آن را بدانیم، سپس با زبان خدا را سپاس گوییم و با عمل، نعمت را در راه درست به کار ببریم.","pageRef":"صفحه ۱۳"},{"type":"note","title":"واژه‌نامه درس: عطا، نثار و برکت","body":"عطا یعنی بخشش، نثار یعنی فدا کردن مال در راه خیر و برکت یعنی فزونی و خوبی پنهان.\nمثال: بهشت، عطای خداوند است و او مال خود را به فقیران نثار می‌کند.","pageRef":"صفحه ۱۴"},{"type":"note","title":"دستور زبان: زمان فعل (ماضی و مضارع)","body":"فعل، کار را با زمان نشان می‌دهد؛ «شکر کردم» ماضی و «شکر می‌کنم» مضارع است.\nمثال: «نعمت را دیدم و سپاس گفتم» دو فعل ماضی دارد: دیدم و گفتم.","pageRef":"صفحه ۱۵"},{"type":"exam","title":"سوال امتحانی: مصراع سعدی «شکرِ نعمت، نعمتت بیفزاید» را معنی کنید.","body":"پاسخ تشریحی: یعنی اگر نعمت خدا را شکر کنی، خداوند آن را زیاد می‌کند.\nاین مصراع به قدردانی و دوری از غفلت دعوت می‌کند و درس اصلی شکر نعمت را جمع‌بندی می‌کند."},{"type":"exam","title":"سوال امتحانی: متضاد واژه‌های «شکران» و «برکت» را بنویسید.","body":"پاسخ تشریحی: متضاد شکران، ناشکران یا کفران است؛ چنان‌که کفران نعمت، سبب از میان رفتن آن می‌شود.\nمتضاد برکت، بلا یا نقصان است؛ پس شکر، برکت می‌آورد و کفران، نقصان."}]},{"number":3,"title":"مهر و وفا","pages":"۲۰ تا ۲۹","contents":[{"type":"answer","title":"در داستان مهر و وفا، کسی که مهر نشان می‌دهد چه پاداشی می‌گیرد؟","body":"در داستان، کسی که با رفتار خود مهر و محبت نشان می‌دهد، پاسخ وفاداری می‌گیرد؛\nدوستِ مهربان با پشتیبانی بی‌دریغ، اعتماد و محبت دوستش را جلب می‌کند و در سختی‌ها تنها نمی‌ماند.","pageRef":"صفحه ۲۱"},{"type":"answer","title":"کار ورقه‌ای: پیام اصلی درس مهر و وفا چیست؟","body":"پیام درس این است که محبت، آغازگر وفا است؛ انسان با مهر و مهربانی دل‌ها را به خود نزدیک می‌کند و همان محبت را به صورت وفا و فداکاری پس می‌گیرد.","pageRef":"صفحه ۲۴"},{"type":"note","title":"واژه‌نامه درس: مهر و وفا","body":"مهر یعنی محبت و دوستی پاک و وفا یعنی پایداری در دوستی و کوتاهی نکردن از پیمان.\nمثال: «دوست باوفا» کسی است که در سختی هم دوستش را تنها نمی‌گذارد.","pageRef":"صفحه ۲۵"},{"type":"note","title":"دستور زبان: جمله خبری و پرسشی","body":"جمله خبری چیزی را به شنونده می‌رساند؛ مثل «مهر، دل‌ها را نزدیک می‌کند».\nجمله پرسشی در پی پاسخ است و با «آ» یا واژه‌های پرسشی می‌آید؛ مثل «آیا وفا از مهر می‌روید؟»","pageRef":"صفحه ۲۶"},{"type":"exam","title":"سوال امتحانی: تفاوت «مهر» و «وفا» را با مثال توضیح دهید.","body":"پاسخ تشریحی: مهر، احساس محبت و دلبستگی است و وفا، نشان دادن آن احساس در رفتار و پایداری بر پیمان است؛\nکسی که در گرفتاری به دوستش می‌رسد و رهایش نمی‌کند، مهر را به وفا بدل کرده است."},{"type":"exam","title":"سوال امتحانی: در جمله «قلب مهربان، درد را فراموش می‌کند» کدام آرایه آمده است؟","body":"پاسخ تشریحی: تشخیص است؛ زیرا قلب مانند انسان مهربان است و می‌تواند چیزی را فراموش کند.\nنسبت دادن رفتار انسانی به قلب، آرایه‌ای پرکاربرد در شعر و نثر است."}]},{"number":4,"title":"درس آزاد","pages":"۳۰ تا ۳۵","contents":[{"type":"answer","title":"هدف درس آزاد در کتاب فارسی نهم چیست؟","body":"هدف، انتخاب متن مورد علاقه از میان متن‌های پیشنهادی کتاب است؛\nدانش‌آموز با معلم و دوستانش یکی از متن‌ها را برمی‌گزیند، می‌خواند و درباره آن گفت‌وگو و پژوهش می‌کند.","pageRef":"صفحه ۳۱"},{"type":"answer","title":"کار ورقه‌ای: پس از خواندن درس آزاد چه کارهایی انجام می‌دهید؟","body":"متن را با صدای بلند می‌خوانیم، واژه‌های تازه را در واژه‌نامه جست‌وجو می‌کنیم، نظر خود را درباره متن می‌گوییم و برای یادگیری بیشتر، پژوهش و نمایش کوتاه انجام می‌دهیم.","pageRef":"صفحه ۳۲"},{"type":"note","title":"نکته خواندنی: درست خواندن با صدا","body":"در خواندن بلند، به سجاوندی‌ها توجه کنید: ویرگول یعنی مکث کوتاه، نقطه یعنی مکث کامل و علامت پرسش یعنی آهنگ بالای صدا.\nمثال: در جمله «چرا باید کتاب خواند؟» پایان جمله، آهنگ پرسش می‌گیرد.","pageRef":"صفحه ۳۳"},{"type":"note","title":"دستور زبان: واژه‌های پرسشی","body":"واژه‌هایی مانند چه، کی، کجا، چرا، چگونه و چند، جمله را پرسشی می‌کنند.\nمثال: «چرا باید کتاب بخوانیم؟» که واژه چرا، علت خواندن کتاب را می‌پرسد.","pageRef":"صفحه ۳۴"},{"type":"exam","title":"سوال امتحانی: چرا این درس «درس آزاد» نامیده شده است؟","body":"پاسخ تشریحی: زیرا برخلاف درس‌های دیگر، متن آن از پیش تعیین نشده است؛\nکلاس میان چند متن پیشنهادی حق انتخاب دارد و همان را می‌خواند؛ پس دانش‌آموز در گزینش متن آزاد است."},{"type":"exam","title":"سوال امتحانی: جمله «چند کتاب در کتابخانه دارید؟» چه نوع جمله‌ای است و واژه پرسشی آن کدام است؟","body":"پاسخ تشریحی: جمله پرسشی است؛ زیرا در پی پاسخ است و در پایان آن علامت پرسش می‌آید.\nواژه پرسشی «چند» است که شمار کتاب‌ها را می‌پرسد."}]},{"number":5,"title":"کار و برکت","pages":"۳۶ تا ۴۵","contents":[{"type":"answer","title":"در درس کار و برکت، رابطه کار و برکت چگونه بیان شده است؟","body":"درس می‌گوید برکت از کار می‌روید؛ کسی که با تلاش و درست‌کاری کار می‌کند، زندگی‌اش به برکت می‌رسد.\nتنبلی و بی‌حالی، نه نانی می‌آورد و نه آرامش و آبرو.","pageRef":"صفحه ۳۷"},{"type":"answer","title":"کار ورقه‌ای: پیامبران درباره کار چه سفارشی کرده‌اند؟","body":"سفارش کرده‌اند که کار کنید و از دسترنج خود بخورید؛ پیامبر (ص) فرموده است: هیچ غذایی بهتر از غذای حاصل کار دست انسان نیست.\nکار، عبادت و مایه برکت است.","pageRef":"صفحه ۳۹"},{"type":"note","title":"واژه‌نامه درس: برکت، زکات و ناچار","body":"برکت یعنی فزونی و خوبی پنهان، زکات یعنی بخشش مالی واجب و ناچار یعنی مجبور.\nمثال: «کار و زحمت، زندگی را به برکت می‌رساند» یعنی تلاش، روزی را آباد می‌کند.","pageRef":"صفحه ۴۰"},{"type":"note","title":"دستور زبان: وجه امری و نهیی فعل","body":"فعل امری، دستور و سفارش می‌دهد؛ مثل «کار کن!». فعل نهیی، از کاری باز می‌دارد و با «ن» می‌آید؛ مثل «تنبل مشو!».\nهر دو وجه، مخاطب را به کار یا دوری از تنبلی فرا می‌خوانند.","pageRef":"صفحه ۴۱"},{"type":"exam","title":"سوال امتحانی: از درس کار و برکت چه نتیجه‌ای درباره تنبلی می‌گیرید؟","body":"پاسخ تشریحی: تنبلی، عامل فقر و ناامیدی است؛ برکت تنها به دست کاری می‌رسد که بکوشد.\nبه همین سبب در درس آمده است که بیکاری به زندگی و ملت زیان می‌زند و کارگر با غیرت و تلاش، سربلند است."},{"type":"exam","title":"سوال امتحانی: بیت «بر سر آنم که گر ز دست برآید / دست به کاری زنم که غصه سر آید» (فریدون مشیری) را معنی و پیام آن را بنویسید.","body":"پاسخ تشریحی: شاعر می‌گوید تا می‌توانم کاری می‌کنم که غم‌ها پایان یابد.\nپیام بیت، امید و کوشش است؛ زیرا رنج‌ها با همت و تلاش از میان می‌روند."}]},{"number":6,"title":"از همت زندگانی","pages":"۴۶ تا ۵۵","contents":[{"type":"answer","title":"در درس از همت زندگانی، همت بلند چه اثری در زندگی دارد؟","body":"همت بلند یعنی آرزوهای بزرگ و تلاش برای رسیدن به آن‌ها؛ کسی که همت بلند دارد، از سختی‌ها نمی‌هراسد، پای درس می‌ایستد و به آینده روشن می‌رسد.\nهمت، سرچشمه پیشرفت است.","pageRef":"صفحه ۴۷"},{"type":"answer","title":"کار ورقه‌ای: چرا انسان همت‌مند از شکست نمی‌ترسد؟","body":"زیرا شکست را پله پیشرفت می‌داند؛ او با عزم راسخ دوباره تلاش می‌کند و از هر ناکامی، درسی می‌گیرد.\nبه همین سبب در پایان راه، پیروز و سرافراز است.","pageRef":"صفحه ۵۰"},{"type":"note","title":"واژه‌نامه درس: همت، عزم و بلندنظر","body":"همت یعنی آرزوی بلند و کوشش برای رسیدن به آن، عزم یعنی تصمیم راسخ و بلندنظر یعنی کسی که به آرزوهای بزرگ می‌اندیشد.\nمثال: دانش‌آموز بلندنظر، همت خود را بر درس دارد.","pageRef":"صفحه ۵۱"},{"type":"note","title":"آرایه تضاد","body":"هرگاه دو واژه با معنی برعکس در یک بیت بیایند، آرایه تضاد است.\nمثال: مولوی: «مرده بدم زنده شدم، گره بدم وا شده» که مرده و زنده و گره و وا در برابر هم‌اند.","pageRef":"صفحه ۵۲"},{"type":"exam","title":"سوال امتحانی: بیت «توانا بود هر که دانا بود / ز دانش دل پیر برنا بود» (فردوسی) را معنی کنید.","body":"پاسخ تشریحی: یعنی تنها دانا تواناست و دانش، دل پیر را جوان می‌کند.\nپیام بیت، ارزش دانایی است که با همت بلند در تحصیل به دست می‌آید؛ پیریِ بی‌دانش ناتوان است."},{"type":"exam","title":"سوال امتحانی: در جمله «با همت بلند، سختی‌ها را پشت سر گذاشتم» نهاد و فعل را مشخص کنید.","body":"پاسخ تشریحی: نهاد پنهان «من» است و فعل «گذاشتم» که فعل ماضی است.\n«با همت بلند» متمم و «سختی‌ها» مفعول است؛ شناخت نقش‌ها، پایه دستور زبان نهم است."}]},{"number":7,"title":"دست‌های کوچک و بزرگ","pages":"۵۶ تا ۶۳","contents":[{"type":"answer","title":"در درس دست‌های کوچک و بزرگ، تفاوت دست‌های کودک و بزرگسال چیست؟","body":"دست‌های کوچک، نماد کودکی و بی‌رنجی است و دست‌های بزرگ، نماد کار و زحمت و تجربه؛\nنویسنده نشان می‌دهد بزرگ‌ها با زحمت دستان خود، زندگی آرام کودکان را فراهم می‌کنند.","pageRef":"صفحه ۵۷"},{"type":"answer","title":"کار ورقه‌ای: کودک در این درس چه نکته‌ای درباره بزرگ‌ترها می‌فهمد؟","body":"می‌فهمد که دست‌های بزرگ‌ترها پینه‌بسته و خسته است؛ زیرا برای خانواده کار می‌کنند.\nپس قدردانی از زحمت پدر و مادر، نتیجه نگاه دقیق به دست‌ها و زندگی آن‌هاست.","pageRef":"صفحه ۵۹"},{"type":"note","title":"نکته املا: «ه» غیرملفوظ در پایان واژه‌ها","body":"برخی واژه‌ها در پایان «ه» دارند ولی خوانده نمی‌شود؛ مثل خانه، تپه، خسته و سپیده.\nباید در املای آن‌ها دقت کنیم؛ مثلاً «سپیده» به معنی روشنایی صبح، با ه نوشته می‌شود.","pageRef":"صفحه ۶۰"},{"type":"note","title":"دستور زبان: مفعول و نشانه «را»","body":"مفعول، کسی یا چیزی است که فعل بر او انجام می‌شود و معمولاً با «را» می‌آید.\nمثال: در جمله «پدر، دست مرا بوسید»، «دست من» مفعول و «پدر» نهاد است.","pageRef":"صفحه ۶۱"},{"type":"exam","title":"سوال امتحانی: از درس دست‌های کوچک و بزرگ چه نتیجه‌ای درباره احترام به والدین می‌گیرید؟","body":"پاسخ تشریحی: بزرگ‌ها با دست‌های خسته و پینه‌بسته، آرامش ما را فراهم کرده‌اند؛ پس باید قدردان آنان باشیم، کمکشان کنیم و زحمتشان را فراموش نکنیم.\nقدردانی، نشان مهر و ادب است."},{"type":"exam","title":"سوال امتحانی: در عبارت «دست‌های کوچک بازی می‌کردند و دست‌های بزرگ کار می‌کردند» زمان دو فعل را بنویسید.","body":"پاسخ تشریحی: «بازی می‌کردند» و «کار می‌کردند» هر دو فعل ماضی استمراری‌اند؛ زیرا انجام کار در گذشته ادامه داشته است.\nنشانه این زمان، «می» در میان فعل و «ند» پایانی است."}]},{"number":8,"title":"روزها بی‌غصه","pages":"۶۴ تا ۷۳","contents":[{"type":"answer","title":"در درس روزها بی‌غصه، چگونه می‌توان روزها را بی‌غصه گذراند؟","body":"با نگاه مثبت، قدردانی از لحظه‌ها، گذشت از خطای دیگران و امید به آینده؛\nنویسنده می‌گوید غصه، روزها را سیاه می‌کند و دل شاد، زندگی را آسان می‌سازد.","pageRef":"صفحه ۶۵"},{"type":"answer","title":"کار ورقه‌ای: از دیدگاه درس، غصه چه زیانی دارد؟","body":"غصه، شادی و تمرکز را از انسان می‌گیرد، روزها را بی‌حاصل می‌کند و به سلامت تن و روان آسیب می‌زند؛\nپس باید به جای غصه، برای حل مشکل چاره اندیشید.","pageRef":"صفحه ۶۷"},{"type":"note","title":"واژه‌نامه درس: غصه و اندوه","body":"غصه یعنی اندوه و دل‌شوری که آرامش را از انسان می‌گیرد؛ مترادف‌های آن، اندوه و افسوس است.\nمثال: «روزهای بی‌غصه، روزهای شاد و سرخوش‌اند.»","pageRef":"صفحه ۶۸"},{"type":"note","title":"آرایه تشبیه و استعاره","body":"در تشبیه، دو چیز به هم مانند می‌شوند و می‌توان آن‌ها را جدا کرد؛ مثل «زندگی، باغی است پرگل».\nاگر یکی از دو طرف حذف شود، استعاره است؛ مثل «گل‌های شادی را در دل بکاریم» که زندگی مانند باغ است و نامش نیامده.","pageRef":"صفحه ۶۹"},{"type":"exam","title":"سوال امتحانی: بیت «حیف بود غنچه ناگشوده در میان غار بماند» (اخوان ثالث) چه مفهومی دارد؟","body":"پاسخ تشریحی: شاعر می‌گوید غنچه باید شکوفا شود؛ نگه داشتن استعداد و شادی در پنهانی، حیف است.\nپیام بیت، شاد زیستن و بهره‌گیری از فرصت‌های زندگی است."},{"type":"exam","title":"سوال امتحانی: برای واژه «شادی» دو مترادف و دو متضاد بنویسید.","body":"پاسخ تشریحی: مترادف‌های شادی: سرور و شادمانی؛ متضادهای آن: غصه و اندوه.\nدر جمله «سرور و شادمانی، جای غصه و اندوه را می‌گیرد» این واژه‌ها در کنار هم آمده‌اند."}]},{"number":9,"title":"خورشید شب‌تاب","pages":"۷۴ تا ۸۳","contents":[{"type":"answer","title":"نویسنده در درس خورشید شب‌تاب از چه چیزهایی به عنوان روشنی شب یاد می‌کند؟","body":"نویسنده از مهتاب و چراغ به عنوان روشنی شب یاد می‌کند و زیبایی‌های طبیعت در شب، مانند آسمان پرستاره و سکوت باغ‌ها را توصیف می‌کند.\nشب نیز چون روز، پر از نعمت است.","pageRef":"صفحه ۷۵"},{"type":"answer","title":"کار ورقه‌ای: از درس خورشید شب‌تاب چه نکته‌ای درباره دیدن زیبایی‌ها می‌گیریم؟","body":"زیبایی‌ها همه‌جا هستند؛ کافی است با چشم دانا بنگریم.\nشب تاریک هم ماه و ستاره و آرامش دارد؛ پس باید به جای ترس و خستگی، به زیبایی‌های آفرینش توجه کنیم.","pageRef":"صفحه ۷۸"},{"type":"note","title":"واژه‌نامه درس: شب‌تاب، فروغ و پرتو","body":"شب‌تاب یعنی آن که در شب می‌تابد و کنایه از ماه است؛ فروغ و پرتو هر دو به معنی روشنایی‌اند.\nمثال: «فروغ ماه در پنجره افتاد» یعنی روشنایی ماه به پنجره رسید.","pageRef":"صفحه ۷۹"},{"type":"note","title":"دستور زبان: قید و کار آن","body":"قید، چگونگی، زمان یا مکان فعل را نشان می‌دهد.\nمثال: در جمله «ماه، آرام می‌تابد»، آرام قید چگونگی است؛ قید تغییر نمی‌پذیرد و جای آن در جمله جابه‌جا می‌شود.","pageRef":"صفحه ۸۰"},{"type":"exam","title":"سوال امتحانی: چرا نویسنده ماه را «خورشید شب‌تاب» نامیده است؟","body":"پاسخ تشریحی: زیرا ماه در شب، مانند خورشید روشنی می‌بخشد؛ شب‌تاب یعنی تابان در شب.\nاین نام‌گذاری، نمونه‌ای از تشبیه و مهر نویسنده به طبیعت است و زیبایی ماه را نمایان می‌کند."},{"type":"exam","title":"سوال امتحانی: در جمله «ستاره‌های آسمان، امشب درخشان‌تر می‌درخشند» قید زمان و قید چگونگی را مشخص کنید.","body":"پاسخ تشریحی: «امشب» قید زمان و «درخشان‌تر» قید چگونگی است؛ زیرا زمان تابیدن و چگونگی درخشش ستاره‌ها را نشان می‌دهند.\nفعل جمله «می‌درخشند» مضارع است."}]},{"number":10,"title":"پیدای پنهان","pages":"۸۴ تا ۹۳","contents":[{"type":"answer","title":"چرا درس پیدای پنهان این نام را گرفته است؟","body":"زیرا چیزهای پنهان، روزی پیدا می‌شوند؛ مانند استعداد، مهربانی یا راز.\nپیام درس این است که تلاش و صداقت، پنهان نمی‌ماند و سرانجام آشکار می‌شود.","pageRef":"صفحه ۸۵"},{"type":"answer","title":"کار ورقه‌ای: از درس پیدای پنهان چه درسی درباره پنهان کردن کار خوب می‌گیریم؟","body":"کار نیک اگر پنهان باشد هم اثر خود را دارد؛ پاداش الهی و احترام مردم، دیر یا زود پیدا می‌شود.\nپس باید بدون چشم‌داشت، نیکی کرد.","pageRef":"صفحه ۸۸"},{"type":"note","title":"واژه‌نامه درس: پنهان، آشکار و راز","body":"پنهان یعنی نهان، آشکار یعنی پیدا و راز یعنی مطلب نگه‌داشته‌شده.\nمثال: خستگی پدر پنهان بود، اما با نگاه به دست‌هایش آشکار شد.","pageRef":"صفحه ۸۹"},{"type":"note","title":"آرایه اغراق","body":"اغراق یعنی بزرگ‌نمایی در توصیف.\nمثال: «از گریه‌اش دریا به جوش آمد»؛ در شعر پیدای پنهان، شاعر با بزرگ‌نمایی، قدرت پنهان ماندن مهربانی را بی‌مانند نشان می‌دهد.","pageRef":"صفحه ۹۰"},{"type":"exam","title":"سوال امتحانی: بیت مولوی «هر که را جامه ز عشقی چاک شد / او ز حرص و عیب کلی پاک شد» را معنی کنید.","body":"پاسخ تشریحی: یعنی هر کس دلش از عشق و مهر شکافته و پاک شود، از حرص و هر عیبی رها می‌شود.\nعشق مانند چراغی است که پنهانی‌های دل را پیدا می‌کند و جان را پاک می‌سازد."},{"type":"exam","title":"سوال امتحانی: در عبارت «راز مهربانی، پنهان نمی‌ماند» کدام آرایه آمده است؟ دلیل بیاورید.","body":"پاسخ تشریحی: تشخیص است؛ زیرا به راز که جاندار نیست، رفتار انسانی (ماندن و نماندن) داده‌ایم.\nنسبت دادن فعل انسانی به غیر جاندار، آرایه تشخیص نام دارد."}]}]},{"title":"مطالعات اجتماعی نهم","subject":"مطالعات اجتماعی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب مطالعات اجتماعی نهم","color":"orange","icon":"globe","chapters":[{"number":1,"title":"گوی آبی زیبا","pages":"۸ تا ۲۲","contents":[{"type":"answer","title":"چرا به زمین گوی آبی زیبا می‌گویند؟","body":"از فضا زمین به رنگ آبی دیده می‌شود.\nحدود ۷۱ درصد سطح آن را آب اقیانوس‌ها و دریاها پوشانده است و تنها بخش کوچکی خشکی است.\nچون آب برای زندگی ضروری است ، زمین تنها سیاره شناخته‌شده‌ای است که زیست دارد.","pageRef":"صفحه ۹"},{"type":"answer","title":"نصف‌النهار مبدأ از کجا می‌گذرد و چه کاربردی دارد؟","body":"نصف‌النهار مبدأ خطی فرضی است که از رصدخانه گرینویچ لندن می‌گذرد و طول جغرافیایی آن صفر است.\nبا کمک طول و عرض جغرافیایی نشانی دقیق هر نقطه از زمین پیدا می‌شود.\nاین خط همچنین مبنای تعیین زمان محلی و ساعت رسمی کشورهاست.","pageRef":"صفحه ۱۳"},{"type":"note","title":"کره جغرافیایی و مختصات","body":"کره جغرافیایی مدلی از زمین است که شکل واقعی آن را نشان می‌دهد.\nموقعیت هر نقطه با دو مقدار طول و عرض جغرافیایی تعیین می‌شود.\nخط استوا عرض صفر و گرینویچ طول صفر است ؛ برخورد این دو خط مانند نشانی پستی مکان را معرفی می‌کند."},{"type":"note","title":"نیمکره‌های زمین","body":"خط استوا زمین را به نیمکره شمالی و جنوبی تقسیم می‌کند.\nنصف‌النهار مبدأ و مقابل آن زمین را به نیمکره شرقی و غربی جدا می‌کند.\nایران در نیمکره شمالی و شرقی قرار دارد."},{"type":"exam","title":"سوال امتحانی: سه ویژگی زمین که زندگی روی آن را ممکن کرده است بنویسید.","body":"پاسخ تشریحی:\nوجود آب مایع در سطح زمین ، داشتن هوای مناسب برای تنفس و فاصله درست از خورشید که دمای معتدل می‌سازد.\nهمین سه ویژگی زمین را از دیگر سیاره‌های منظومه شمسی متمایز کرده است."},{"type":"exam","title":"سوال امتحانی: کدام گزینه درباره خط استوا درست است؟ ۱) از قطب شمال می‌گذرد ۲) عرض جغرافیایی آن صفر است ۳) طول جغرافیایی آن صفر است ۴) از ایران می‌گذرد","body":"پاسخ تشریحی:\nگزینه ۲ درست است.\nاستوا دایره عریض میانه زمین است و عرض جغرافیایی آن صفر درجه است.\nخطی که طول صفر دارد گرینویچ است نه استوا و ایران در نیمکره شمالی است ؛ پس بقیه گزینه‌ها نادرست‌اند."}]},{"number":2,"title":"زمین و چهره آن","pages":"۲۳ تا ۳۵","contents":[{"type":"answer","title":"چرخش وضعی زمین چه نام دارد و چه نتایجی دارد؟","body":"چرخش زمین به دور محور خود در هر ۲۴ ساعت چرخش وضعی نام دارد.\nنتیجه آن پدید آمدن شب و روز و اختلاف ساعت مناطق است.\nهمیشه نیمی از زمین رو به خورشید روشن و نیم دیگر تاریک است.","pageRef":"صفحه ۲۴"},{"type":"answer","title":"عوامل تغییردهنده چهره زمین کدام‌اند؟ یکی را با مثال توضیح دهید.","body":"عوامل درونی مانند زلزله و آتشفشان و عوامل بیرونی مانند آب ، باد و یخچال‌ها چهره زمین را دگرگون می‌کنند.\nمثال: رودهای کوهستانی با فرسایش خاک دره می‌سازند و آبرفت را به دشت‌ها می‌آورند.","pageRef":"صفحه ۲۸"},{"type":"note","title":"لایه‌های درونی زمین","body":"زمین از سه لایه اصلی ساخته شده است: پوسته ، گوشته و هسته.\nپوسته نازک‌ترین لایه و محل زندگی ماست.\nگوشته ضخیم‌ترین بخش است و هسته درونی‌ترین لایه که بیشتر از آهن و نیکل ساخته شده است."},{"type":"note","title":"سه گروه سنگ‌های زمین","body":"سنگ آذرین از سرد شدن ماگما پدید می‌آید مانند گرانیت.\nسنگ رسوبی از ته‌نشین شدن خرده‌سنگ‌ها و بازمانده جانداران ساخته می‌شود مانند ماسه‌سنگ.\nسنگ دگرگون از تبدیل سنگ‌های دیگر زیر گرما و فشار به دست می‌آید مانند مرمر."},{"type":"exam","title":"سوال امتحانی: چرخش انتقالی زمین چیست و چه پدیده‌ای به دنبال دارد؟","body":"پاسخ تشریحی:\nگردش زمین به دور خورشید چرخش انتقالی نام دارد و حدود ۳۶۵ روز طول می‌کشد.\nنتیجه آن پدید آمدن فصل‌ها و تغییر طول شب و روز در طول سال است.\nعامل اصلی این پدیده کج بودن محور زمین و تغییر میزان تابش خورشید است."},{"type":"exam","title":"سوال امتحانی: درست یا نادرست؟ کوه‌ها فقط بر اثر عوامل بیرونی مانند آب و باد ساخته می‌شوند. توضیح دهید.","body":"پاسخ تشریحی:\nنادرست است.\nبسیاری از کوه‌ها بر اثر عوامل درونی و حرکت و برخورد ورقه‌های زمین و چین‌خوردگی لایه‌ها ساخته می‌شوند.\nعوامل بیرونی مانند آب و باد بیشتر کوه‌ها را می‌شکنند و فرسایش می‌دهند."
