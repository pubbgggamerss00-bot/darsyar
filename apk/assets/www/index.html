<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درسیار من | کمک درسی متوسطه اول</title>
<style>
/* درسیار من — استایل اپلیکیشن آفلاین اندروید */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "Vazirmatn", Tahoma, sans-serif;
  background: #f4f8ff;
  color: #1e293b;
  -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #fff;
  box-shadow: 0 0 30px rgba(37, 99, 235, 0.06);
  padding-bottom: 80px;
  position: relative;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; text-align: right; }
img { display: block; }

/* ---------- هدر ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid #f1f5f9;
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.topbar .title { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 17px; color: #1e293b; }
.topbar .title .t { text-align: center; }
.topbar .title svg { color: #22c55e; }
.topbar .title small { display: block; font-size: 10px; color: #94a3b8; font-weight: 400; }
.iconbtn {
  width: 40px; height: 40px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; color: #64748b;
  position: relative;
}
.iconbtn .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: #f43f5e; }
.iconbtn.plain { border: none; background: rgba(255,255,255,.16); color: #fff; }

/* ---------- بدنه ---------- */
.pad { padding: 14px 14px 20px; }
.card {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: #fff; border: 1px solid #f1f5f9; border-radius: 18px;
  padding: 14px; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
  margin-bottom: 12px; transition: transform .15s ease, box-shadow .15s ease;
}
.card:active { transform: scale(.985); box-shadow: 0 1px 4px rgba(15,23,42,.08); }

.hero {
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(105deg, #eff6ff, #f0f9ff 55%, #fff);
  border: 1px solid #dbeafe; border-radius: 22px; padding: 18px 16px;
}
.hero img { width: 104px; height: 104px; flex-shrink: 0; }
.hero h2 { font-size: 19px; font-weight: 800; color: #1d4ed8; line-height: 1.7; }
.hero p { font-size: 12.5px; color: #64748b; line-height: 1.9; margin-top: 4px; }

.section-title { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; font-weight: 800; color: #1e293b; margin: 20px 0 12px; }
.section-title svg { color: #2563eb; }

.grade-icon {
  width: 54px; height: 54px; border-radius: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.22);
}
.grade-info { flex: 1; }
.grade-info b { display: block; font-size: 16.5px; color: #1e293b; }
.grade-info small { display: block; font-size: 12px; color: #94a3b8; margin-top: 3px; }
.grade-bar { display: block; width: 46px; height: 4px; border-radius: 99px; margin-top: 8px; }
.badge { font-size: 11px; font-weight: 800; padding: 5px 11px; border-radius: 99px; flex-shrink: 0; }

.ai-card {
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(105deg, #f0f9ff, #fff);
  border: 1px solid #dbeafe; border-radius: 22px; padding: 16px;
}
.ai-card img { width: 96px; height: 96px; flex-shrink: 0; }
.ai-card h3 { font-size: 15px; font-weight: 800; color: #1e293b; }
.ai-card p { font-size: 12.5px; color: #64748b; line-height: 1.9; margin: 4px 0 10px; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid #bfdbfe; background: #fff; color: #2563eb;
  font-size: 13px; font-weight: 800; padding: 8px 16px; border-radius: 99px;
}
.pill-btn:active { background: #2563eb; color: #fff; }

/* ---------- ویو پایه ---------- */
.gheader {
  background: linear-gradient(120deg, #2563eb, #3b82f6 55%, #38bdf8);
  border-radius: 0 0 30px 30px; padding: 18px 18px 52px; color: #fff;
}
.gheader .hi { font-size: 13px; opacity: .85; }
.gheader h1 { font-size: 22px; font-weight: 800; margin-top: 4px; }
.gheader .sub { font-size: 12px; opacity: .8; margin-top: 3px; }
.gheader .row { display: flex; align-items: flex-start; justify-content: space-between; }

.stats {
  display: flex; margin: -36px 14px 18px; background: #fff;
  border: 1px solid #f1f5f9; border-radius: 18px; padding: 14px 4px;
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
}
.stats .st { flex: 1; text-align: center; }
.stats .st + .st { border-right: 1px solid #f1f5f9; }
.stats .st svg { margin: 0 auto 4px; }
.stats b { display: block; font-size: 17px; font-weight: 800; color: #1e293b; }
.stats span { font-size: 10.5px; color: #94a3b8; }

.cover {
  width: 62px; height: 80px; flex-shrink: 0; border-radius: 10px;
  padding: 7px 8px; color: #fff; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: inset -1px 0 0 rgba(255,255,255,.25), 0 5px 12px rgba(15,23,42,.15);
  position: relative; overflow: hidden;
}
.cover::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 4px; background: rgba(255,255,255,.28); }
.cover small { font-size: 8.5px; opacity: .85; }
.cover b { font-size: 9.5px; line-height: 1.5; }
.binfo { flex: 1; }
.binfo b.t { display: block; font-size: 14.5px; color: #1e293b; }
.binfo p { font-size: 11.5px; color: #94a3b8; line-height: 1.8; margin: 2px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips span { font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 99px; }
.chev { color: #cbd5e1; flex-shrink: 0; }

/* ---------- ویو کتاب ---------- */
.tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: #fff; border: 1px solid #f1f5f9; border-radius: 16px;
  padding: 9px 4px; font-size: 11px; font-weight: 800; color: #64748b;
}
.tab .cnt { font-size: 9.5px; padding: 2px 9px; border-radius: 99px; font-weight: 800; }
.tab.on { color: #fff; }
.tab .cnt.on2 { background: rgba(255,255,255,.2); color: #fff; }

.chapters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
.chapters::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; border: 1px solid #e2e8f0; background: #fff; color: #64748b;
  border-radius: 16px; padding: 7px 14px; font-size: 11px; font-weight: 800;
}
.chip small { display: block; font-size: 9px; font-weight: 400; opacity: .8; }
.chip.on { background: #334155; border-color: #334155; color: #fff; }

.chhead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: #f8fafc; border-radius: 12px; padding: 8px 12px; margin-bottom: 10px;
}
.chhead h3 { font-size: 13px; font-weight: 800; color: #334155; }
.chhead span { font-size: 9.5px; color: #94a3b8; flex-shrink: 0; }

.content-card {
  background: #fff; border: 1px solid #f1f5f9; border-radius: 18px;
  padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(15,23,42,.04);
}
.content-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 99px; }
.page-ref { font-size: 9.5px; color: #64748b; background: #f1f5f9; padding: 3px 9px; border-radius: 99px; }
.content-card h4 { font-size: 13.5px; font-weight: 800; color: #1e293b; line-height: 2; }
.content-card .body { font-size: 12.5px; color: #475569; line-height: 2.05; white-space: pre-wrap; margin-top: 6px; }
.content-card details { margin-top: 8px; }
.content-card summary {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer; list-style: none;
  background: #f5f3ff; color: #7c3aed; font-size: 11.5px; font-weight: 800;
  padding: 6px 13px; border-radius: 99px;
}
.content-card summary::-webkit-details-marker { display: none; }
.content-card details .body { background: #faf5ff; border-radius: 12px; padding: 10px 12px; margin-top: 10px; max-height: 280px; overflow-y: auto; }

.ai-cta {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  background: linear-gradient(105deg, #f0f9ff, #fff);
  border: 1px solid #dbeafe; border-radius: 18px; padding: 14px; margin-top: 18px;
}
.ai-cta .l { display: flex; align-items: center; gap: 10px; }
.ai-cta .bot-ic { width: 44px; height: 44px; border-radius: 14px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ai-cta b { display: block; font-size: 13px; color: #1e293b; }
.ai-cta small { font-size: 11px; color: #94a3b8; }
.ai-cta .go { background: #2563eb; color: #fff; font-size: 11.5px; font-weight: 800; padding: 7px 14px; border-radius: 99px; flex-shrink: 0; }

/* ---------- چت ---------- */
.ctx-chip { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; color: #2563eb; font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 99px; margin: 0 14px 10px; }
.ctx-chip button { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #dbeafe; color: #2563eb; }
.chat-wrap { padding: 14px 14px 90px; display: flex; flex-direction: column; gap: 12px; min-height: 60vh; }
.msg { display: flex; align-items: flex-end; gap: 7px; }
.msg .av { width: 32px; height: 32px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg .bubble { max-width: 82%; border-radius: 18px; padding: 11px 14px; font-size: 12.5px; line-height: 2; white-space: pre-wrap; word-break: break-word; }
.msg.bot .bubble { background: #fff; border: 1px solid #f1f5f9; color: #334155; border-bottom-right-radius: 6px; box-shadow: 0 2px 6px rgba(15,23,42,.05); }
.msg.me { justify-content: flex-end; }
.msg.me .bubble { background: #2563eb; color: #fff; border-bottom-left-radius: 6px; box-shadow: 0 3px 8px rgba(37,99,235,.2); }
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; animation: tb 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes tb { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }

.suggest { border: 1px dashed #bfdbfe; background: rgba(239,246,255,.5); color: #2563eb; font-size: 12.5px; font-weight: 600; border-radius: 16px; padding: 10px 14px; text-align: right; }

.chatbar {
  position: fixed; bottom: 0; right: 0; left: 0; z-index: 30;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid #e2e8f0;
}
.chatbar .in { max-width: 480px; margin: 0 auto; display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
.chatbar input {
  flex: 1; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 16px;
  padding: 12px 14px; font-family: inherit; font-size: 13px; color: #1e293b; outline: none;
}
.chatbar input:focus { border-color: #93c5fd; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
.chatbar .send { width: 44px; height: 44px; flex-shrink: 0; border-radius: 16px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(37,99,235,.3); }
.chatbar .send:disabled { opacity: .4; }

.url-row { display: flex; gap: 6px; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 8px 10px; margin: 0 14px 12px; }
.url-row input { flex: 1; border: none; background: none; font-family: inherit; font-size: 11.5px; color: #334155; outline: none; direction: ltr; text-align: left; }
.url-row .save { background: #2563eb; color: #fff; font-size: 10.5px; font-weight: 800; padding: 6px 12px; border-radius: 10px; flex-shrink: 0; }

/* ---------- نویگیشن پایین ---------- */
.bottomnav {
  position: fixed; bottom: 0; right: 0; left: 0; z-index: 30;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid #e2e8f0;
}
.bottomnav .nav-in {
  max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; gap: 2px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
}
.navbtn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10.5px; font-weight: 700; color: #64748b;
  border-radius: 16px; padding: 7px 10px; min-width: 64px;
}
.navbtn.on { background: #2563eb; color: #fff; box-shadow: 0 4px 10px rgba(37,99,235,.28); }

.empty { border: 1px dashed #e2e8f0; background: #f8fafc; border-radius: 16px; padding: 22px; text-align: center; color: #64748b; font-size: 13px; }

</style>
</head>

<div id="app"></div>
<script>
window.__DARSYAR_DATA__ = [{"number":7,"name":"پایه هفتم","subtitle":"آغاز مسیر موفقیت","books":[{"title":"ریاضی هفتم","subject":"ریاضی","description":"اعداد، کسرها، تقارن و هندسه به زبان ساده","color":"blue","icon":"calculator","chapters":[{"number":1,"title":"عددهای طبیعی و صحیح","pages":"۱۰ تا ۲۶","contents":[{"type":"answer","title":"حاصل عبارت ۷ − (−۳) + (−۵) را حساب کنید.","body":"گام ۱: منفیِ مقابل منفی مثبت می‌شود؛ پس ۷ − (−۳) = ۷ + ۳ = ۱۰.\nگام ۲: عبارت به ۱۰ + (−۵) تبدیل می‌شود.\nگام ۳: در جمع دو عدد با علامت مخالف، قدرمطلق کوچک‌تر را از بزرگ‌تر کم می‌کنیم و علامت عدد بزرگ‌تر می‌ماند: ۱۰ − ۵ = ۵.\nحاصل نهایی برابر ۵ است.","pageRef":"صفحه ۱۸"},{"type":"answer","title":"فاصله دو عدد −۸ و ۳ روی محور اعداد چند واحد است؟","body":"گام ۱: فاصله هر عدد تا صفر برابر قدرمطلق آن است: قدرمطلق (−۸) برابر ۸ و قدرمطلق ۳ برابر ۳ است.\nگام ۲: این دو عدد در دو سمت صفر قرار دارند؛ پس فاصله آن‌ها مجموع دو فاصله است: ۸ + ۳ = ۱۱.\nگام ۳: راه دیگر: ۳ − (−۸) = ۳ + ۸ = ۱۱.\nپس فاصله این دو عدد روی محور ۱۱ واحد است.","pageRef":"صفحه ۲۲"},{"type":"note","title":"قاعده جمع عددهای صحیح","body":"برای جمع دو عدد با علامت یکسان، قدرمطلق‌ها را جمع و علامت مشترک را می‌گذاریم.\nبرای جمع دو عدد با علامت مخالف، قدرمطلق کوچک‌تر را از بزرگ‌تر کم و علامت عدد بزرگ‌تر (از نظر قدرمطلق) را می‌گذاریم.\nمنفیِ منفی مثبت است: − (−۴) = +۴."},{"type":"note","title":"قدرمطلق و محور اعداد","body":"قدرمطلق یک عدد، فاصله آن تا صفر است؛ پس همیشه مثبت یا صفر است: قدرمطلق (−۶) = ۶.\nعددهای منفی در سمت چپ صفر و عددهای مثبت در سمت راست صفر قرار دارند.\nهر چه از صفر به سمت چپ برویم عدد کوچک‌تر می‌شود؛ مثلاً −۵ کوچک‌تر از −۲ است."},{"type":"exam","title":"اگر a = −۴ و b = ۳ باشد، حاصل a + b و a − b چقدر است؟","body":"پاسخ: a + b = −۴ + ۳ = −۱؛ زیرا قدرمطلق ۴ از ۳ بزرگ‌تر است و علامت عدد بزرگ‌تر (منفی) می‌ماند.\na − b = −۴ − ۳ = −۷؛ چون از عدد −۴ به اندازه ۳ واحد به سمت چپ حرکت می‌کنیم و به −۷ می‌رسیم.\nراه‌سنجی: جواب‌ها را با محور اعداد بررسی کنید تا از درستی علامت‌ها مطمئن شوید."},{"type":"exam","title":"دمای یک شهر در صبح −۶ درجه بود. تا ظهر ۹ درجه گرم‌تر و تا شب ۴ درجه سردتر شد. دمای شب چند درجه است؟","body":"گام ۱: دمای ظهر: −۶ + ۹ = ۳ درجه؛ چون ۹ از ۶ بزرگ‌تر است و علامت عدد بزرگ‌تر (مثبت) می‌ماند.\nگام ۲: دمای شب: ۳ − ۴ = −۱ درجه.\nپس دمای این شهر در شب −۱ درجه است.\nراه‌سنجی: تغییر دما را روی محور اعداد رسم کنید تا علامت‌ها اشتباه نشود."}]},{"number":2,"title":"کسر","pages":"۲۷ تا ۴۴","contents":[{"type":"answer","title":"حاصل ۲/۳ + ۳/۴ را حساب کنید.","body":"گام ۱: مخرج مشترک کوچک‌تر ۳ و ۴ عدد ۱۲ است.\nگام ۲: کسر ۲/۳ را در کسر ۴/۴ ضرب می‌کنیم: ۸/۱۲.\nگام ۳: کسر ۳/۴ را در کسر ۳/۳ ضرب می‌کنیم: ۹/۱۲.\nگام ۴: ۸/۱۲ + ۹/۱۲ = ۱۷/۱۲ که کسری بزرگ‌تر از واحد است: ۱ و ۵/۱۲.","pageRef":"صفحه ۳۱"},{"type":"answer","title":"کسر ۱۸/۲۴ را به ساده‌ترین صورت بنویسید.","body":"گام ۱: مقسوم‌علیه‌های مشترک ۱۸ و ۲۴ عبارت‌اند از ۱، ۲، ۳ و ۶.\nگام ۲: بزرگ‌ترین مقسوم‌علیه مشترک ۶ است.\nگام ۳: صورت و مخرج را بر ۶ تقسیم می‌کنیم: ۱۸ ÷ ۶ = ۳ و ۲۴ ÷ ۶ = ۴.\nپس ۱۸/۲۴ = ۳/۴ و این کسر دیگر ساده نمی‌شود.","pageRef":"صفحه ۲۹"},{"type":"note","title":"انواع کسر و کسر مخلوط","body":"در کسر ۳/۴ عدد ۳ صورت و عدد ۴ مخرج است.\nاگر صورت از مخرج کوچک‌تر باشد کسر کوچک‌تر از واحد است و اگر صورت برابر مخرج باشد کسر مساوی واحد است.\nبرای تبدیل کسر مخلوط به کسر بزرگ‌تر از واحد، عدد صحیح را در مخرج ضرب و صورت را با آن جمع می‌کنیم: ۲ و ۱/۳ = ۷/۳."},{"type":"note","title":"ضرب و تقسیم کسرها","body":"در ضرب کسرها، صورت‌ها را در هم و مخرج‌ها را در هم ضرب می‌کنیم.\nدر تقسیم، کسر اول را در معکوس کسر دوم ضرب می‌کنیم: ۲/۳ ÷ ۴/۵ = ۲/۳ × ۵/۴.\nپیش از ضرب، صورت و مخرج‌های روبه‌رو را ساده کنید تا محاسبه آسان‌تر شود."},{"type":"exam","title":"۵/۳ یک مخزن آب پر شده است؛ با ریختن ۴۰ لیتر آب دیگر پر می‌شود. ظرفیت مخزن چند لیتر است؟","body":"پاسخ: بخش پرنشده مخزن: ۱ − ۳/۵ = ۲/۵ است.\nپس ۲/۵ از ظرفیت برابر ۴۰ لیتر است و ۱/۵ ظرفیت برابر ۴۰ ÷ ۲ = ۲۰ لیتر.\nظرفیت کامل: ۲۰ × ۵ = ۱۰۰ لیتر.\nآزمایش: ۳/۵ از ۱۰۰ لیتر برابر ۶۰ لیتر است و ۶۰ + ۴۰ = ۱۰۰ درست است.\nراه‌سنجی: همیشه سهم کسری بخش داده‌نشده را با کسرها بنویسید."},{"type":"exam","title":"حاصل ضرب ۲/۳ × ۹/۸ را ساده کنید.","body":"پاسخ: ۲ × ۹ = ۱۸ و ۳ × ۸ = ۲۴؛ پس حاصل ۱۸/۲۴ است.\nساده با ۶: ۱۸ ÷ ۶ = ۳ و ۲۴ ÷ ۶ = ۴؛ حاصل ۳/۴ می‌شود.\nچون ۳/۴ کوچک‌تر از واحد است، به کسر مخلوط تبدیل نمی‌شود.\nراه‌سنجی: پیش از ضرب، ۲ را با ۸ و ۹ را با ۳ ساده کنید تا سریع‌تر به ۳/۴ برسید."}]},{"number":5,"title":"نسبت و تناسب","pages":"۶۴ تا ۸۰","contents":[{"type":"answer","title":"قیمت ۴ دفتر ۱۲۰٬۰۰۰ ریال است؛ قیمت ۷ دفتر همان نوع چند ریال است؟","body":"گام ۱: قیمت هر دفتر: ۱۲۰٬۰۰۰ ÷ ۴ = ۳۰٬۰۰۰ ریال.\nگام ۲: قیمت ۷ دفتر: ۷ × ۳۰٬۰۰۰ = ۲۱۰٬۰۰۰ ریال.\nگام ۳: بررسی با تناسب: نسبت ۴ به ۱۲۰٬۰۰۰ مانند نسبت ۷ به ۲۱۰٬۰۰۰ است و هر دو مقدار ۳۰٬۰۰۰ ریال برای یک دفتر می‌دهند.\nپس قیمت ۷ دفتر ۲۱۰٬۰۰۰ ریال است.","pageRef":"صفحه ۶۸"},{"type":"answer","title":"روی نقشه‌ای با مقیاس ۱ به ۵۰٬۰۰۰ فاصله دو مکان ۳ سانتی‌متر است؛ فاصله واقعی چند کیلومتر است؟","body":"گام ۱: در مقیاس ۱ به ۵۰٬۰۰۰ هر ۱ سانتی‌متر روی نقشه برابر ۵۰٬۰۰۰ سانتی‌متر در دنیای واقعی است.\nگام ۲: فاصله واقعی: ۳ × ۵۰٬۰۰۰ = ۱۵۰٬۰۰۰ سانتی‌متر.\nگام ۳: تبدیل واحدها: ۱۰۰ سانتی‌متر یک متر و ۱٬۰۰۰ متر یک کیلومتر است؛ پس ۱۵۰٬۰۰۰ سانتی‌متر برابر ۱٬۵۰۰ متر یعنی ۱٫۵ کیلومتر است.","pageRef":"صفحه ۷۴"},{"type":"note","title":"نسبت و ساده‌کردن آن","body":"نسبت، مقایسه دو کمیت هم‌نوع با تقسیم است و مانند کسر ساده می‌شود.\nنسبت ۶ به ۹ همان نسبت ۲ به ۳ است.\nنسبت را می‌توان به شکل ۲:۳ یا به شکل کسر نوشت؛ ترتیب اعداد در نسبت اهمیت دارد."},{"type":"note","title":"تقسیم به نسبت و تناسب مستقیم","body":"برای تقسیم مبلغی به نسبت ۲ به ۳، آن را به ۲ + ۳ = ۵ قسمت مساوی تقسیم می‌کنیم.\nدر تناسب مستقیم، با زیاد شدن یک کمیت، کمیت دیگر نیز به همان نسبت زیاد می‌شود؛ مانند قیمت و تعداد.\nروش مقدار واحد: ابتدا مقدار یک واحد را پیدا کنید، سپس مقدار دلخواه را ضرب کنید."},{"type":"exam","title":"نسبت تعداد دختران به پسران یک کلاس ۳ به ۲ است. اگر کلاس ۲۵ دانش‌آموز داشته باشد، چند دختر در کلاس است؟","body":"پاسخ: مجموع قسمت‌ها: ۳ + ۲ = ۵.\nهر قسمت: ۲۵ ÷ ۵ = ۵ نفر.\nتعداد دختران: ۳ × ۵ = ۱۵ نفر و تعداد پسران: ۲ × ۵ = ۱۰ نفر.\nآزمایش: ۱۵ + ۱۰ = ۲۵ و نسبت ۱۵ به ۱۰ همان ۳ به ۲ است.\nراه‌سنجی: ابتدا مجموع قسمت‌ها را بنویسید تا جواب سامان‌مند شود."},{"type":"exam","title":"مبلغ ۹۰۰٬۰۰۰ ریال را به نسبت ۲ به ۴ بین دو نفر تقسیم کنید.","body":"پاسخ: مجموع قسمت‌ها: ۲ + ۴ = ۶.\nهر قسمت: ۹۰۰٬۰۰۰ ÷ ۶ = ۱۵۰٬۰۰۰ ریال.\nسهم نفر اول: ۲ × ۱۵۰٬۰۰۰ = ۳۰۰٬۰۰۰ ریال.\nسهم نفر دوم: ۴ × ۱۵۰٬۰۰۰ = ۶۰۰٬۰۰۰ ریال.\nراه‌سنجی: نسبت را ساده کنید (۲ به ۴ همان ۱ به ۲ است) تا درستی جواب را سریع‌تر بررسی کنید."}]}]},{"title":"علوم تجربی هفتم","subject":"علوم تجربی","description":"تجربه و آزمایش، بدن انسان و دنیای سازه‌ها","color":"green","icon":"flask","chapters":[{"number":1,"title":"تجربه و آزمایش","pages":"۸ تا ۲۰","contents":[{"type":"answer","title":"می‌خواهیم بفهمیم نور بر رشد گیاه اثر دارد. متغیرهای این آزمایش را مشخص کنید.","body":"گام ۱: متغیر مستقل عاملی است که خودمان تغییرش می‌دهیم؛ در این آزمایش مقدار نور است (یک گلدان در نور کامل و یک گلدان در تاریکی).\nگام ۲: متغیر وابسته نتیجه‌ای است که اندازه می‌گیریم؛ در این آزمایش مقدار رشد گیاه (قد ساقه یا تعداد برگ‌ها).\nگام ۳: متغیرهای کنترل باید ثابت بمانند: نوع و اندازه گیاه، نوع خاک، مقدار و زمان آب‌دادن و دمای محل.\nبا این کار هر تفاوت در رشد فقط به نور مربوط می‌شود.","pageRef":"صفحه ۱۴"},{"type":"answer","title":"چرا در یک آزمایش علمی باید فقط یک متغیر را تغییر دهیم؟","body":"اگر همزمان چند متغیر (مثلاً نور و آب) را تغییر دهیم، نمی‌توانیم بفهمیم تغییر نتیجه به‌خاطر کدام عامل بوده است.\nمثلاً اگر گیاهی که نور کمتری گرفته و آب بیشتری خورده کوچک بماند، نمی‌دانیم نور مقصر بوده یا آب.\nبا تغییر دادن فقط یک متغیر و ثابت نگه‌داشتن بقیه، نتیجه آزمایش قابل اعتماد و تکرارپذیر می‌شود.","pageRef":"صفحه ۱۶"},{"type":"note","title":"مراحل روش علمی","body":"مشاهده و طرح پرسش، ساختن فرضیه، طراحی آزمایش، جمع‌آوری داده و نتیجه‌گیری.\nفرضیه پاسخ احتمالی و آزمون‌پذیر به پرسش است.\nاگر نتیجه آزمایش فرضیه را تأیید نکند، فرضیه را اصلاح یا کنار می‌گذاریم؛ این شکست نیست، بخشی از کار علمی است."},{"type":"note","title":"اندازه‌گیری و ایمنی در آزمایشگاه","body":"ویژگی‌های کیفی با عدد اندازه‌گیری نمی‌شوند (رنگ و بو) ولی کمیت‌ها با عدد و واحد بیان می‌شوند (۲۵ سانتی‌متر، ۳۰ درجه).\nابزارها: دماسنج برای دما، استوانه مدرج برای حجم مایعات و ترازو برای جرم.\nدر آزمایشگاه عینک و دستکش بپوشید، هیچ ماده‌ای را نچشید و همیشه با حضور معلم کار کنید."},{"type":"exam","title":"تفاوت مشاهده کیفی و مشاهده کمی را با مثال بنویسید.","body":"پاسخ: مشاهده کیفی ویژگی‌ای را توصیف می‌کند که با عدد بیان نمی‌شود؛ مانند «برگ‌های گیاه سبز و براق است».\nمشاهده کمی همراه عدد و واحد است؛ مانند «قد گیاه ۱۲ سانتی‌متر شد».\nهر دو نوع مشاهده در یک آزمایش علمی مکمل هم‌اند.\nراه‌سنجی: در پاسخ برای هر نوع مشاهده یک مثال بیاورید تا نمره کامل بگیرید."},{"type":"exam","title":"در آزمایش علمی چرا به گروه شاهد نیاز داریم؟","body":"پاسخ: گروه شاهد گروهی است که متغیر مستقل روی آن اعمال نمی‌شود و در وضعیت عادی نگه داشته می‌شود.\nنتیجه گروه آزمایش را با گروه شاهد مقایسه می‌کنیم تا مطمئن شویم تغییر دیده‌شده واقعاً از متغیر مستقل است.\nمثلاً گیاهِ در نور طبیعی، شاهدی برای گیاهِ در تاریکی است.\nراه‌سنجی: در پاسخ خود حتماً واژه مقایسه را به کار ببرید."}]},{"number":5,"title":"تنظیم عصبی","pages":"۵۴ تا ۶۶","contents":[{"type":"answer","title":"وقتی دست به جسم داغ می‌خورد، چه اتفاقی می‌افتد؟","body":"گام ۱: گیرنده‌های پوست داغی را تشخیص می‌دهند و پیام در طول عصب حسی به نخاع می‌رود.\nگام ۲: نخاع فرمان عقب کشیدن دست را در طول عصب حرکتی به ماهیچه دست می‌فرستد.\nگام ۳: دست پیش از فکر کردن عقب می‌کشد؛ به این پاسخ سریع رفلکس می‌گویند و مرکز آن نخاع است.\nگام ۴: پیام در همان زمان به مغز هم می‌رسد تا حس درد را درک کنیم.","pageRef":"صفحه ۶۰"},{"type":"answer","title":"بخش‌های دستگاه عصبی مرکزی و نقش هر بخش را بنویسید.","body":"دستگاه عصبی مرکزی از مغز و نخاع تشکیل شده است.\nمغز فرمانده بدن است و تفکر، حافظه و تصمیم‌گیری در آن انجام می‌شود.\nمخچه تعادل بدن و هماهنگی حرکات را تنظیم می‌کند.\nبصل‌النخاع کارهای حیاتی مانند تنفس و ضربان قلب را کنترل می‌کند.\nنخاع مانند جاده ارتباطی، پیام‌ها را میان مغز و بدن جابه‌جا می‌کند و کنترل رفلکس‌ها نیز با اوست.","pageRef":"صفحه ۵۸"},{"type":"note","title":"نورون، واحد ساختاری دستگاه عصبی","body":"سلول عصبی را نورون می‌نامند و از سه بخش جسم سلولی، دندریت و آکسون ساخته شده است.\nدندریت پیام را دریافت و آکسون آن را به سلول بعدی منتقل می‌کند.\nاعصاب حسی پیام را از گیرنده به مرکز و اعصاب حرکتی فرمان را از مرکز به ماهیچه یا غده می‌برند."},{"type":"note","title":"محافظت از دستگاه عصبی","body":"مغز درون استخوان جمجمه و نخاع درون ستون مهره‌ها جای دارد.\nلایه‌هایی از پرده و مایع ضربه‌گیر نیز مغز و نخاع را از آسیب حفظ می‌کنند.\nبا بستن کلاه ایمنی، بستن کمربند ایمنی و پرهیز از ضربه به سر از این دستگاه مهم محافظت می‌کنیم."},{"type":"exam","title":"چرا بصل‌النخاع مهم‌ترین بخش مغز شمرده می‌شود؟","body":"پاسخ: بصل‌النخاع کارهای حیاتی بدن مانند تنفس، ضربان قلب و فشار خون را بی‌آنکه به فکر و اراده ما نیاز داشته باشد کنترل می‌کند.\nاگر این بخش آسیب ببیند زندگی ادامه پیدا نمی‌کند؛ به همین دلیل مهم‌ترین بخش مغز است.\nراه‌سنجی: نقش مخ، مخچه و بصل‌النخاع را جداگانه و همراه با مثال یاد بگیرید."},{"type":"exam","title":"تفاوت عصب حسی و عصب حرکتی را بنویسید.","body":"پاسخ: عصب حسی پیام را از گیرنده‌ها (مانند پوست و چشم) به دستگاه عصبی مرکزی می‌برد.\nعصب حرکتی فرمان دستگاه عصبی مرکزی را به ماهیچه‌ها و غده‌ها می‌رساند.\nدر رفلکس، پیام با عصب حسی می‌رود و فرمان با عصب حرکتی برمی‌گردد.\nراه‌سنجی: مسیر گیرنده، مرکز و ماهیچه را روی شکل کتاب تمرین کنید."}]},{"number":8,"title":"سازه‌ها","pages":"۹۴ تا ۱۰۶","contents":[{"type":"answer","title":"چرا در پل‌ها و اسکلت ساختمان‌ها از شکل مثلث استفاده می‌شود؟","body":"مثلث تنها چندضلعی‌ای است که با اندازه‌های مشخصِ اضلاع، شکلش ثابت می‌ماند و در برابر نیرو کج نمی‌شود.\nچهارضلعی به‌راحتی به شکل متوازی‌الاضلاع در می‌آید؛ پس قاب‌های چهارضلعی را با قطعه مورب (پشت‌بند) به دو مثلث تقسیم می‌کنند.\nبه این ترتیب سازه سبک‌تر و کم‌هزینه‌تر، اما در برابر نیروها بسیار مقاوم‌تر می‌شود.","pageRef":"صفحه ۱۰۰"},{"type":"answer","title":"نیروی کشش و نیروی فشار را با مثال توضیح دهید.","body":"کشش نیرویی است که ماده را می‌کشاند؛ مانند کابل‌های پل معلق یا طنابی که با آن بار بالا کشیده می‌شود.\nفشار نیرویی است که ماده را می‌فشارد؛ مانند پایه‌های پل و ستون‌های ساختمان که وزن سازه را تحمل می‌کنند.\nمواد در برابر این دو نیرو رفتار متفاوتی دارند؛ پس برای هر بخش سازه باید ماده و شکل مناسب انتخاب شود.","pageRef":"صفحه ۹۶"},{"type":"note","title":"عوامل استحکام سازه","body":"استحکام سازه به دو عامل جنس ماده و شکل آن بستگی دارد.\nیک کاغذ صاف خم می‌شود ولی همان کاغذ لوله‌شده بار بیشتری تحمل می‌کند.\nسازه‌های لانه‌زنبوری و شکل‌های پره‌دار سبک و در همان حال محکم‌اند؛ نمونه‌ها: استخوان‌های دراز بدن، لوله‌های فلزی و تیرهای فولادی."},{"type":"note","title":"نیروهای اصلی وارد بر مواد","body":"مهم‌ترین نیروهای وارد بر مواد کشش، فشار، خم‌شدن و پیچش هستند.\nهر ماده‌ای در برابر نوعی از این نیروها مقاوم‌تر است؛ فولاد در برابر کشش و بتن در برابر فشار قوی‌ترند.\nدر ساختن سازه‌ها باید پیش‌بینی کنیم هر قطعه در برابر کدام نیرو قرار می‌گیرد."},{"type":"exam","title":"چرا لوله فلزی از ورق صاف فلزی با همان مقدار ماده مستحکم‌تر است؟","body":"پاسخ: در لوله، ماده دور از محور قرار گرفته و نیروها را بهتر پخش می‌کند؛ در نتیجه در برابر خم‌شدن مقاومت بیشتری دارد.\nبا جنس و مقدار ماده کمتر، سازه‌ای سبک‌تر و محکم‌تر ساخته می‌شود؛ مانند لوله قاب دوچرخه.\nراه‌سنجی: در پاسخ، نقش شکل را جدا از نقش جنس ماده بیان کنید."},{"type":"exam","title":"دو راه برای استحکام بیشتر یک قاب چهارضلعی چوبی پیشنهاد کنید.","body":"پاسخ: راه اول، افزودن یک قطعه مورب (پشت‌بند) تا قاب به دو مثلث تبدیل شود.\nراه دوم، استفاده از قطعات ضخیم‌تر یا دوتا کردن تیرها و ستون‌ها با اتصال محکم.\nهر دو راه سبب می‌شود قاب در برابر نیروها کمتر تغییر شکل دهد.\nراه‌سنجی: نام راه و دلیل مؤثر بودن آن را هر دو بنویسید."}]}]},{"title":"فارسی هفتم","subject":"فارسی","description":"مطالعه ادبی، واژه‌آموزی و دانش‌های زبانی","color":"purple","icon":"book","chapters":[{"number":1,"title":"زنگ آفرینش","pages":"۱۰ تا ۱۹","contents":[{"type":"answer","title":"شاعر در شعر «زنگ آفرینش» چه پیامی به خواننده می‌دهد؟","body":"پیام اصلی شعر، دعوت به تماشای دقیق و با دقتِ جهان آفرینش است.\nشاعر همه هستی را پر از نشانه‌های قدرت و مهربانی خداوند می‌بیند و هر پدیده‌ای از گل و پرنده تا خورشید و باران را یادآور لطف آفریدگار می‌داند.\nخواننده از شعر می‌آموزد که به زیبایی‌های طبیعت به چشم نشانه خلقت بنگرد و شکرگزار باشد.","pageRef":"صفحه ۱۱"},{"type":"answer","title":"در جمله «خورشید از پشت کوه سر برآورد» نهاد و گزاره را مشخص کنید.","body":"گام ۱: از جمله می‌پرسیم چه کسی یا چه چیزی کار را انجام داد؟ پاسخ «خورشید» است؛ پس نهاد، خورشید است.\nگام ۲: بقیه جمله که درباره نهاد خبر می‌دهد گزاره است: «از پشت کوه سر برآورد».\nگام ۳: هر جمله از نهاد و گزاره ساخته می‌شود و گزاره همیشه در برگیرنده فعل است.","pageRef":"صفحه ۱۶"},{"type":"note","title":"معرفی درس و شاعر","body":"درس اول فارسی هفتم شعر «زنگ آفرینش» از قیصر امین‌پور، شاعر معاصر ایران است.\nاو با زبانی ساده و پر از احساس درباره طبیعت، آفرینش و عشق به ایران سروده است.\nلحن این شعر شاد و شگفت‌زده است و مضمون آن ستایش آفرینش و سپاس از خداوند است."},{"type":"note","title":"دانش زبانی: فعل و زمان آن","body":"فعل واژه‌ای است که انجام کار، رخ دادن حالی یا بودن چیزی را در زمانی معین نشان می‌دهد.\nزمان‌های اصلی فعل: گذشته (نوشت)، حال (می‌نویسد) و آینده (خواهد نوشت).\nریشه فعل از مصدر گرفته می‌شود؛ مثلاً ریشه فعل نوشت از مصدر نوشتن است."},{"type":"exam","title":"درباره پیام شعر «زنگ آفرینش» در چند سطر پاسخ دهید.","body":"پاسخ: شاعر با نگاه به جهان آفرینش، زیبایی و نظم آن را نشانه حکمت و مهربانی خداوند می‌داند.\nاو از ما می‌خواهد با چشم بیننده و دل شاکر به طبیعت بنگریم و از هر پدیده درسی بیاموزیم.\nپیام شعر، زنده نگه‌داشتن شگفتی و سپاسگزاری در برابر آفرینش است.\nراه‌سنجی: پیام را با ذکر یک مثال از طبیعت (مانند شکوفه یا باران) همراه کنید تا پاسخ کامل شود."},{"type":"exam","title":"زمان فعل‌های «می‌نویسم»، «نوشت» و «خواهد نوشت» را مشخص کنید.","body":"پاسخ: «می‌نویسم» زمان حال است و انجام کار را در زمان سخن گفتن نشان می‌دهد.\n«نوشت» زمان گذشته است و کار انجام‌شده را می‌رساند.\n«خواهد نوشت» زمان آینده است و از سازوکار «خواه + ریشه فعل» ساخته می‌شود.\nراه‌سنجی: برای یافتن زمان، فعل را با امروز، دیروز و فردا آزمایش کنید."}]},{"number":2,"title":"چشمه معرفت","pages":"۲۰ تا ۳۱","contents":[{"type":"answer","title":"درس «چشمه معرفت» چه ویژگی‌هایی از عالم بزرگ را به ما می‌شناساند؟","body":"نویسنده عالمی را نشان می‌دهد که از کودکی با عشق و پشتکار دانش آموخت.\nساده‌زیستی، فروتنی، احترام به استاد و قدرشناسی از وقت، ویژگی‌های برجسته او هستند.\nدانش در نگاه او مانند چشمه‌ای جاری بود که هرچه از آن برمی‌داشت، تازه و پرآب می‌ماند؛ یعنی هرچه بیشتر می‌آموخت، برای آموختن مشتاق‌تر می‌شد.","pageRef":"صفحه ۲۲"},{"type":"answer","title":"معنی واژه «معرفت» چیست؟ مترادف و متضاد آن را بنویسید.","body":"معرفت یعنی شناخت و آگاهی درست نسبت به چیزی.\nمترادف‌های آن دانش و شناخت است و متضاد آن نادانی و جهل.\nنمونه کاربرد: انسان با معرفت، راه زندگی را بهتر می‌یابد.\nبرای یافتن معنی واژه‌های ناآشنا، ابتدا از بافت جمله کمک بگیرید و سپس فرهنگ لغت را ببینید.","pageRef":"صفحه ۲۴"},{"type":"note","title":"واژه‌آموزی درس دوم","body":"چند واژه پرکاربرد این زمینه: معرفت یعنی شناخت، همت یعنی تلاش و اراده، فروتنی یعنی تواضع و خودنما نکردن.\nبرای یافتن معنی واژه، جمله‌های پیش و پس آن را بخوانید؛ بافت درس، راهنمای معنی است.\nواژه‌های ناآشنا را در دفتر واژه‌آموزی خود با یک جمله نمونه بنویسید."},{"type":"note","title":"دانش زبانی: انواع جمله از نظر پیام","body":"جمله خبری، رخدادی را اعلام می‌کند: «باران بارید.»\nجمله پرسشی برای آگاهی پرسش می‌کند و با «آیا» یا نشانه پرسش همراه است.\nجمله امری فرمان یا درخواست می‌دهد: «کتاب را بخوان.»\nجمله عاطفی شگفتی یا احساس را نشان می‌دهد: «چه آسمان زیبایی!»"},{"type":"exam","title":"از زندگی عالمان بزرگ در درس «چشمه معرفت» چه درس‌هایی می‌گیریم؟","body":"پاسخ: پشتکار و جدیت در فراگیری دانش از سنین کم، مهم‌ترین درس زندگی آنان است.\nساده‌زیستی و استفاده درست از وقت، به انسان امکان می‌دهد تمرکز خود را حفظ کند.\nاحترام به استاد و شاگردی کردن نزد بزرگ‌ترها، راه رسیدن به معرفت است.\nراه‌سنجی: سه ویژگی را به شکل بند جدا بنویسید تا پاسخ روشن و کامل باشد."},{"type":"exam","title":"نوع جمله‌های زیر را از نظر پیام مشخص کنید: «آیا تکالیفت را نوشتی؟»، «کتاب را بخوان.»، «چه هوای خوشی!»","body":"پاسخ: جمله اول پرسشی است؛ چون برای آگاهی پرسش می‌کند و با «آیا» آمده است.\nجمله دوم امری است؛ فرمان انجام کار را می‌دهد.\nجمله سوم عاطفی است؛ شگفتی و احساس گوینده را نشان می‌دهد.\nراه‌سنجی: به نشانه‌های پایان جمله (؟ و !) و واژه‌های آغازین مانند آیا و چه دقت کنید."}]},{"number":4,"title":"زیبایی آفرینش","pages":"۴۴ تا ۵۵","contents":[{"type":"answer","title":"نویسنده در درس «زیبایی آفرینش» ما را به چه نگاهی به طبیعت دعوت می‌کند؟","body":"نویسنده می‌گوید زیبایی‌های آفرینش تنها با نگاه دقیق و آرام دیده می‌شوند.\nرنگ و نقش گل‌ها، آواز پرندگان و نظم شگفت‌انگیز یک برگ یا پروانه، نمونه‌هایی از این زیبایی‌ها هستند.\nاو از ما می‌خواهد طبیعت را با دقت ببینیم، قدرش را بدانیم و در پاکیزه نگه‌داشتن آن بکوشیم.","pageRef":"صفحه ۴۵"},{"type":"answer","title":"نشانه‌های جمع «ها» و «ان» چه تفاوتی دارند؟ با مثال توضیح دهید.","body":"گام ۱: نشانه «ها» به همه اسم‌ها می‌چسبد و آن‌ها را جمع می‌کند: کتاب‌ها، درخت‌ها، مدادها.\nگام ۲: نشانه «ان» تنها به اسم‌های جاندار می‌چسبد: دانش‌آموزان، پرندگان، مردان.\nگام ۳: به غیرجانداران «ان» نمی‌گوییم؛ البته برخی واژه‌های کتابی مانند «درختان» استثنا هستند.\nگام ۴: برای انتخاب نشانه درست، از خودتان بپرسید آیا این واژه نام جاندار است یا نه.","pageRef":"صفحه ۵۰"},{"type":"note","title":"مضمون درس چهارم","body":"درس «زیبایی آفرینش» به ستایش زیبایی‌های طبیعت و دعوت به مشاهده دقیق جهان می‌پردازد.\nپیام درس: زیبایی‌ها را باید با نگاه تیزبین دید و در حفظ آن‌ها کوشید.\nنگاه دقیق به آفرینش، هم در ادبیات و هم در علوم، سرآغاز کشف‌های بزرگ است."},{"type":"note","title":"آرایه ادبی: تشبیه","body":"تشبیه، مانند کردن دو چیز به یکدیگر است و از چهار رکن ساخته می‌شود: مشبه، مشبه‌به، ادات تشبیه و وجه شبه.\nدر «ماه مانند چراغ درخشید»: ماه مشبه، چراغ مشبه‌به، مانند ادات تشبیه و درخشیدن وجه شبه است.\nتشبیه به گفتار و نوشتار ما رنگ و زیبایی می‌بخشد."},{"type":"exam","title":"یک منظره طبیعی را در چند جمله با واژه‌های توصیفی بنویسید.","body":"پاسخ نمونه: طلوع خورشید را دیدم که آسمان را به رنگ گل سرخ درمی‌آورد.\nمه لطیف بر دشت نشسته بود و صدای جویبار مانند آوازی خوش به گوش می‌رسید.\nعطر تازه گل‌ها هوا را خوشبو کرده بود.\nراه‌سنجی: در توصیف از رنگ، صدا و بو سخن بگویید تا تصویر زنده شود."},{"type":"exam","title":"در عبارت «ابرها مانند پنبه بر آسمان نشسته‌اند» تشبیه را تجزیه کنید.","body":"پاسخ: مشبه ابرها است؛ یعنی چیزی که می‌خواهیم توصیف کنیم.\nمشبه‌به پنبه است؛ یعنی چیزی که ابر به آن مانند شده است.\nادات تشبیه، واژه مانند است و وجه شبه، شباهت در سفیدی و نرمی.\nراه‌سنجی: هر چهار رکن را جداگانه بنویسید؛ گاهی ادات تشبیه در شعر حذف می‌شود."}]}]},{"title":"مطالعات اجتماعی هفتم","subject":"مطالعات اجتماعی","description":"جغرافیا، تاریخ و مدنی ایران و جهان","color":"orange","icon":"globe","chapters":[{"number":1,"title":"زمین خانه زیبای ما","pages":"۸ تا ۱۹","contents":[{"type":"answer","title":"چرا زمین تنها خانه زیست انسان و جانداران است؟","body":"زمین تنها سیاره شناخته‌شده‌ای است که آب مایع روی سطح آن وجود دارد.\nجو زمین هوای لازم برای تنفس را فراهم می‌کند و لایه ازون جانداران را از پرتوهای خطرناک خورشید محافظت می‌کند.\nفاصله مناسب زمین از خورشید سبب می‌شود دمای آن نه خیلی گرم و نه خیلی سرد باشد.\nهمین شرایط سبب شده زمین خانه زیبای همه جانداران باشد.","pageRef":"صفحه ۹"},{"type":"answer","title":"جغرافیا چه علمی است و جغرافیدان‌ها با چه ابزارهایی کار می‌کنند؟","body":"جغرافیا علمی است که زمین، ویژگی‌های طبیعی آن و زندگی انسان‌ها روی آن را مطالعه می‌کند.\nشاخه طبیعی جغرافیا به آب‌وهوا، ناهمواری‌ها و آب‌ها می‌پردازد و شاخه انسانی آن به جمعیت، شهرها و فعالیت‌های انسان.\nابزارهای مهم جغرافیدان: نقشه، گوی (کره جغرافیایی)، عکس‌های هوایی و ماهواره‌ای و آمارها.","pageRef":"صفحه ۱۲"},{"type":"note","title":"شکل و اندازه زمین","body":"زمین کروی است؛ اما در قطب‌ها کمی فشرده و در ناحیه استوا کمی برآمده است.\nقطر زمین حدود ۱۲٬۷۰۰ کیلومتر است.\nشواهد کروی بودن زمین: عکس‌های ماهواره‌ای، سفر دور دنیا و ناپدید شدن تدریجی کشتی در افق."},{"type":"note","title":"نقشه و اجزای آن","body":"نقشه نمایش کوچک و ساده‌شده سطح زمین روی صفحه است و گوی، کره‌ای است که زمین را به شکل واقعی نشان می‌دهد.\nهر نقشه باید عنوان، مقیاس، راهنما (کلید) و جهت‌ها را داشته باشد.\nدر بیشتر نقشه‌ها بالا سمت شمال است؛ برای یافتن جهت‌ها می‌توان از قطب‌نما کمک گرفت."},{"type":"exam","title":"چرا انسان‌ها برای زندگی بهتر به شناخت زمین نیاز دارند؟","body":"پاسخ: با شناخت زمین می‌توانیم مکان مناسب برای کشاورزی، ساختن شهر و راه‌سازی را انتخاب کنیم.\nدانش جغرافیا در پیش‌بینی بلایای طبیعی مانند سیل و زلزله و آمادگی در برابر آن‌ها کمک می‌کند.\nهمچنین بهره‌برداری درست و بدون آسیب از منابع طبیعی فقط با شناخت زمین ممکن است.\nراه‌سنجی: فایده‌ها را به شکل فهرست کوتاه بنویسید تا پاسخ خوانا شود."},{"type":"exam","title":"دو تفاوت نقشه و گوی (کره جغرافیایی) را بنویسید.","body":"پاسخ: گوی شکل واقعی و کروی زمین را نشان می‌دهد، ولی جابه‌جا کردن آن سخت است و جزئیات زیادی در آن نمی‌گنجد.\nنقشه سبک و قابل حمل است و جزئیات بیشتری را می‌توان روی آن نشان داد؛ اما در نمایش شکل کروی زمین کمی تغییر ایجاد می‌کند.\nراه‌سنجی: برای هر تفاوت، یک ویژگی مثبت و یک محدودیت بیان کنید."}]},{"number":5,"title":"زیست بوم‌ها","pages":"۳۰ تا ۴۱","contents":[{"type":"answer","title":"زیست‌بوم چیست و مهم‌ترین عامل تعیین‌کننده نوع آن کدام است؟","body":"زیست‌بوم، گستره وسیعی از طبیعت است که گیاهان و جانوران سازگار با یک اقلیم در آن با هم زندگی می‌کنند.\nمهم‌ترین عامل، اقلیم یعنی مقدار دما و بارش است.\nبارش و دما نوع پوشش گیاهی را مشخص می‌کند و پوشش گیاهی نیز غذا و پناه جانوران را فراهم می‌آورد.\nبرای نمونه، باران فراوان جنگل می‌سازد و باران اندک به بیابان می‌انجامد.","pageRef":"صفحه ۳۲"},{"type":"answer","title":"گیاهان و جانوران بیابان چگونه با شرایط بیابان سازگار شده‌اند؟","body":"گیاهان بیابان ریشه‌های بلند دارند تا به آب‌های زیر زمین برسند.\nبرگ‌های خاردار یا کوچک دارند تا آب کمتری از دست بدهند و برخی مانند کاکتوس آب را در ساقه خود ذخیره می‌کنند.\nجانوران بیشتر در شب فعال‌اند تا از گرمای روز در امان بمانند.\nشتر با کوهان‌های خود چربی ذخیره می‌کند و می‌تواند مدت‌ها کم‌آبی را تحمل کند.","pageRef":"صفحه ۳۶"},{"type":"note","title":"انواع زیست‌بوم‌ها","body":"جنگل استوایی: گرم و پر باران با تنوع گیاهی و جانوری بسیار زیاد.\nعلفزار (ساوانا و استپ): بارش کمتر و جایگاه گله‌های بزرگ گیاه‌خوار.\nبیابان: بارش بسیار کم و نوسان زیاد دمای شب و روز.\nتوندرا: سردترین زیست‌بوم با خزه و گلسنگ و بدون درخت."},{"type":"note","title":"تأثیر انسان بر زیست‌بوم‌ها","body":"جنگل‌زدایی، آتش‌سوزی، شکار بی‌رویه و آلودگی، زیست‌بوم‌ها را نابود می‌کند.\nبا از بین رفتن پوشش گیاهی، جانوران غذا و پناهگاه خود را از دست می‌دهند.\nحفظ جنگل‌ها، شکار قانونی و پاکیزه نگه‌داشتن طبیعت، مسئولیت همه ماست."},{"type":"exam","title":"چرا در زیست‌بوم توندرا درخت وجود ندارد؟","body":"پاسخ: توندرا سردترین زیست‌بوم است و دمای هوا اغلب زیر صفر می‌ماند.\nخاک در بیشتر ماه‌های سال یخ‌زده است و دوره کوتاه گرم سال برای رشد درخت کافی نیست.\nبه همین دلیل تنها گیاهانی مانند خزه و گلسنگ در آن رشد می‌کنند.\nراه‌سنجی: عامل اصلی را اقلیم (دما و خاک یخ‌زده) معرفی کنید."},{"type":"exam","title":"رابطه اقلیم و پوشش گیاهی را با یک مثال توضیح دهید.","body":"پاسخ: هرچه بارش بیشتر باشد، پوشش گیاهی غنی‌تر می‌شود.\nدر ناحیه استوایی، باران فراوان جنگل انبوه ساخته است؛ در ناحیه بارش اندک، علفزار پدید می‌آید و در بیابان تنها گیاهان مقاوم به خشکی می‌رویند.\nپس اقلیم، نوع پوشش گیاهی و در نتیجه جانوران هر ناحیه را تعیین می‌کند.\nراه‌سنجی: زنجیره بارش، گیاه و جانور را در پاسخ حفظ کنید."}]},{"number":19,"title":"آیین‌های زندگی","pages":"۱۱۸ تا ۱۲۸","contents":[{"type":"answer","title":"الگوی مصرف چیست و چرا باید الگوی مصرف درست داشته باشیم؟","body":"الگوی مصرف، شیوه و میزان استفاده ما از کالاها و منابع است.\nالگوی درست یعنی به اندازه نیاز مصرف کنیم، از اسراف پرهیز کنیم و به تولید و کار داخلی توجه داشته باشیم.\nبا مصرف درست، منابع کشور دوام می‌آورد، تولیدکننده حمایت می‌شود و نعمت‌ها به دیگران نیز می‌رسد.\nاسراف نعمت‌ها را از میان می‌برد و حق فقیران را ضایع می‌کند.","pageRef":"صفحه ۱۲۰"},{"type":"answer","title":"تفاوت صرفه‌جویی و مصرف‌گرایی را با مثال بنویسید.","body":"صرفه‌جویی یعنی استفاده درست و به‌اندازه از نعمت‌ها؛ مانند بستن شیر آب هنگام مسواک زدن و نوشتن روی هر دو روی کاغذ.\nمصرف‌گرایی یعنی خرید و مصرف بیش از نیاز، گاهی برای چشم و هم‌چشمی.\nمصرف‌گرایی به اسراف، بدهی و غفلت از حق دیگران می‌انجامد، ولی صرفه‌جویی نشانه تدبیر و قدرشناسی است.","pageRef":"صفحه ۱۲۳"},{"type":"note","title":"سبک زندگی چیست","body":"سبک زندگی، شیوه زیستن ماست: خوراک، پوشاک، تفریح، خرید و روابط با دیگران.\nسبک زندگی از فرهنگ، باورها و ارزش‌های یک جامعه اثر می‌گیرد.\nساده‌زیستی، قناعت، نظم و مهربانی از ویژگی‌های سبک زندگی ایرانی و اسلامی است."},{"type":"note","title":"اهمیت پرهیز از اسراف","body":"در فرهنگ اسلامی اسراف حتی در کارهای کوچک مانند آب وضو و خوراک ناپسند شمرده شده است.\nنعمت‌ها امانت خداوند در دست ما هستند و باید در جای درست مصرف شوند.\nپرهیز از اسراف هم به خانواده کمک می‌کند و هم منابع کشور و حق دیگران را حفظ می‌کند."},{"type":"exam","title":"سه پیامد اسراف در جامعه را بنویسید.","body":"پاسخ: نخست، منابع و ذخایر کشور به‌سرعت به هدر می‌رود.\nدوم، در حالی که برخی از نیازهای اصلی محروم‌اند، خوراک و کالا دور ریخته می‌شود.\nسوم، با افزایش زباله و مصرف بی‌رویه، محیط زیست آسیب می‌بیند و چشم و هم‌چشمی در جامعه رواج پیدا می‌کند.\nراه‌سنجی: پیامدها را برای فرد، خانواده و جامعه جداگانه بنویسید تا پاسخ کامل شود."},{"type":"exam","title":"یک راهکار عملی برای اصلاح الگوی مصرف در مدرسه پیشنهاد دهید.","body":"پاسخ نمونه: راه‌اندازی شورای صرفه‌جویی کلاس با سه اقدام مشخص: خاموش کردن لامپ‌ها پس از خروج، استفاده از هر دو روی برگه‌ها و جلوگیری از دور ریختن خوراک.\nاین راهکارها هزینه مدرسه را کم می‌کند و الگوی درست مصرف را به دانش‌آموزان می‌آموزد.\nراه‌سنجی: راهکار باید مشخص، ساده و قابل انجام باشد؛ نتیجه آن را هم بیان کنید."}]}]},{"title":"عربی هفتم","subject":"عربی","description":"لغت و قواعد عربی با تمرین‌های کاربردی","color":"teal","icon":"languages","chapters":[{"number":1,"title":"اَلَّذي - هٰذِهِ","pages":"۸ تا ۱۸","contents":[{"type":"answer","title":"ترجمه کنید: «هٰذِهِ سَیّارَةٌ وَ ذٰلِکَ دَرّاجَةٌ»","body":"ترجمه: این یک ماشین است و آن یک دوچرخه است.\nتوضیح: هٰذِهِ اسم اشاره برای مفرد مؤنث است و معنی «این» می‌دهد؛ ذٰلِکَ اسم اشاره برای مفرد مذکر است و معنی «آن» می‌دهد.\nبعد از اسم اشاره، اسم نکره می‌آید؛ به همین دلیل در ترجمه فارسی «یک» اضافه می‌شود.","pageRef":"صفحه ۱۰"},{"type":"answer","title":"«اَلکِتابُ اَلَّذي عَلَی اَلطّاوِلَةِ» را ترجمه کنید و نقش اَلَّذي را بگویید.","body":"ترجمه: کتابی که روی میز است.\nنقش: اَلَّذي اسم موصول است و برای مذکر مفرد به کار می‌رود و معنی «که / آن‌که» می‌دهد.\nبرای مؤنث از اَلَّتی استفاده می‌شود؛ مثال: اَلزَّهرَةُ اَلَّتی عَلَی اَلطّاوِلَةِ (گلی که روی میز است).","pageRef":"صفحه ۱۱"},{"type":"note","title":"اسم‌های اشاره در یک نگاه","body":"هٰذا = این (مذکر)، هٰذِهِ = این (مؤنث).\nذٰلِکَ = آن (مذکر)، تِلکَ = آن (مؤنث).\nبعد از اسم اشاره، اسم نکره می‌آید و در فارسی «یک» اضافه می‌شود؛ مثل: هٰذِهِ زَهرَةٌ = این یک گل است."},{"type":"note","title":"ترفند ترجمه جمله‌های اسمیه","body":"جمله اسمیه از مبتدا و خبر ساخته می‌شود؛ در ترجمه، اول اسم اشاره، بعد اسم را بگویید.\nهٰذَا کِتابٌ = این یک کتاب است.\nهٰذِهِ مَدرَسَةٌ = این یک مدرسه است.\n«هـ» آخر واژه‌های عربی مثل مدرسه و زهره در تلفظ خوانده نمی‌شود."},{"type":"exam","title":"جای خالی را با اسم اشاره مناسب پر کنید: «....... جَبَلٌ عالٍ» (آن کوه بلندی است).","body":"پاسخ: ذٰلِکَ.\nچون جَبَل اسم مذکر است و معنی «آن» خواسته شده، از ذٰلِکَ استفاده می‌کنیم؛ جمله کامل: ذٰلِکَ جَبَلٌ عالٍ.\nنکته: همیشه اول جنسیت اسم (مذکر یا مؤنث) را مشخص کنید، بعد اسم اشاره را انتخاب کنید."},{"type":"exam","title":"معنی واژه‌های زیر را بنویسید: سَیّارَة، باب، مُعَلِّمَة، قَمَر","body":"سَیّارَة = ماشین، باب = در، مُعَلِّمَة = معلم زن، قَمَر = ماه.\nنکته: «هـ» آخر مُعَلِّمَة خوانده نمی‌شود و واژه با «اَت» تلفظ می‌شود (مُعَلِّمَه).\nبرای حفظ لغت‌ها، کارت‌های کوچک بسازید و هر شب ده واژه مرور کنید."}]},{"number":6,"title":"أَنتَ طالِبٌ - أَنتُم طُلّابٌ","pages":"۶۲ تا ۷۲","contents":[{"type":"answer","title":"ترجمه کنید: «أَنتَ مُجتَهِدٌ وَ أَنتِ مُجتَهِدَةٌ»","body":"ترجمه: تو (پسر) کوشایی و تو (دختر) کوشا هستی.\nتوضیح: أَنتَ ضمیر جدا برای مخاطب مذکر است و کلمه بعد از آن باید مذکر باشد؛ أَنتِ ضمیر مخاطب مؤنث است و با کلمه مؤنث می‌آید.\nقاعده کلی: ضمیر و کلمه بعد از آن باید مطابق (هم‌جنس) باشند.","pageRef":"صفحه ۶۴"},{"type":"answer","title":"جمع کلمه‌های زیر را بنویسید و معنی کنید: طالِب، طالِبَة، مُعَلِّمَة","body":"طالِب → طُلّاب (دانش‌آموزان پسر).\nطالِبَة → طالِبات (دانش‌آموزان دختر)، مُعَلِّمَة → مُعَلِّمات (معلم‌های زن).\nتوضیح: جمع مذکر با تغییر ساختار کلمه ساخته می‌شود (جمع تکسیر)؛ اما جمع مؤنث سالم با افزودن «ات» به آخر واژه ساخته می‌شود.","pageRef":"صفحه ۶۷"},{"type":"note","title":"ضمیرهای جدا برای مخاطب","body":"أَنتَ = تو (پسر)، أَنتِ = تو (دختر).\nأَنتُما = شما دو نفر، أَنتُم = شما (پسرها یا گروه مختلط)، أَنتُنَّ = شما (دخترها).\nضمیر جدا همیشه قبل از کلمه می‌آید و کلمه باید با ضمیر مطابق باشد."},{"type":"note","title":"جمع مؤنث سالم؛ ساده‌ترین جمع عربی","body":"برای جمع کردن اسم مؤنث، «ات» به آخر آن اضافه می‌شود؛ مثل زَهرَة → زَهرَات و مُدَرِّسَة → مُدَرِّسات.\nدر جمع مؤنث سالم ساختار واژه عوض نمی‌شود، فقط «ات» اضافه می‌شود؛ به همین دلیل ساده‌ترین نوع جمع است."},{"type":"exam","title":"با ضمیر مناسب جمله را کامل کنید: «....... طالِباتٌ» (شما دخترها دانش‌آموز هستید).","body":"پاسخ: أَنتُنَّ.\nچون طالِبات جمع مؤنث است، ضمیر مخاطب مؤنث جمع یعنی أَنتُنَّ به کار می‌رود.\nنکته: در سؤال‌های مطابقت، هم جنسیت و هم تعداد را چک کنید؛ مؤنث مفرد با أَنتِ و مؤنث جمع با أَنتُنَّ می‌آید."},{"type":"exam","title":"ترجمه کنید: «هِیَ مُعَلِّمَةٌ وَ هُما مُعَلِّمَتانِ»","body":"ترجمه: او (زن) معلم است و آن دو (زن) معلم‌اند.\nتوضیح: هِیَ ضمیر مؤنث مفرد و هُما ضمیر مثنی است؛ مثنی با افزودن «ان» ساخته می‌شود و معنی «دو نفر» می‌دهد.\nدر ترجمه مثنی همیشه «دو» را لحاظ کنید: مُعَلِّمَتانِ = دو معلم زن."}]},{"number":12,"title":"صَنَعتُ - صَنَعتُما","pages":"۱۲۶ تا ۱۳۸","contents":[{"type":"answer","title":"صیغه‌های «ذَهَبَ» را برای من، تو (پسر) و شما دو نفر بنویسید و معنی کنید.","body":"ذَهَبتُ = رفتم.\nذَهَبتَ = رفتی (به پسر).\nذَهَبتُما = شما دو نفر رفتید.\nتوضیح: در صیغه‌های ماضی، ضمیر به آخر فعل می‌چسبد؛ «تُ» علامت متکلم، «تَ» علامت مخاطب مذکر و «تُما» علامت مخاطب مثنی است.","pageRef":"صفحه ۱۲۸"},{"type":"answer","title":"ترجمه کنید: «کَتَبتُ الدَّرسَ وَ صَنَعتُ نَموذَجاً جَمیلاً»","body":"ترجمه: درس را نوشتم و نمونه زیبایی ساختم.\nتوضیح: کَتَبتُ = نوشتم و صَنَعتُ = ساختم؛ هر دو فعل ماضی متکلم مفرد هستند و علامتشان «تُ» در آخر فعل است.\nفعل ماضی برای کاری به کار می‌رود که در گذشته انجام شده است.","pageRef":"صفحه ۱۳۰"},{"type":"note","title":"فعل ماضی را از پسوند آخرش بشناس","body":"ـ تُ = من (کَتَبتُ = نوشتم)، ـ تَ = تو پسر (کَتَبتَ = نوشتی)، ـ تِ = تو دختر (کَتَبتِ = نوشتی).\nـ نا = ما (کَتَبنا = نوشتیم)، ـ تُم = شما (کَتَبتُم)، ـ تُما = شما دو نفر.\nفعل بدون پسوند مثل ذَهَبَ برای «او» است."},{"type":"note","title":"تُ یا تَ؟ اشتباه رایج امتحان","body":"«تُ» با حرکت ضمه علامت متکلم است: کَتَبتُ = نوشتم.\n«تَ» با حرکت فتحه علامت مخاطب مذکر است: کَتَبتَ = نوشتی.\nحرکت آخر فعل را در نوشتن حتماً بگذارید؛ تفاوت یک حرکت، معنی جمله را عوض می‌کند."},{"type":"exam","title":"صیغه درست را انتخاب کنید: «(ذَهَبتُ / ذَهَبتَ) إلَی المَدرَسَةِ هذاکَ الیومَ» (گفت‌وگوی دو پسر).","body":"پاسخ: ذَهَبتَ.\nچون گوینده به مخاطب پسر اشاره می‌کند، صیغه مخاطب مذکر یعنی ذَهَبتَ درست است؛ معنی: تو به مدرسه رفتی.\nاگر گوینده درباره خودش می‌گفت، ذَهَبتُ (رفتم) درست بود."},{"type":"exam","title":"ترجمه کنید: «صَنَعتُما نَموذَجاً مِنَ الخَشَبِ»","body":"ترجمه: شما دو نفر از چوب نمونه‌ای ساختید.\nتوضیح: صَنَعتُما صیغه ماضی مخاطب مثنی است (صَنَعَ + تُما) و به دو مخاطب اشاره دارد.\nپسوند «تُما» همیشه معنی «شما دو نفر» می‌دهد؛ همین پسوند را در عربی هشتم هم خواهید دید."}]}]},{"title":"زبان انگلیسی هفتم","subject":"انگلیسی","description":"English Book 7 - Learn, Practice, Communicate","color":"pink","icon":"message","chapters":[{"number":1,"title":"My Name","pages":"۶ تا ۱۶","contents":[{"type":"answer","title":"مکالمه زیر را به فارسی معنی کنید: Hello! What's your name? — Hi! My name is Sara. — How are you today? — I'm fine, thank you.","body":"معنی:\nسلام! اسم تو چیست؟\nسلام! اسم من سارا است.\nامروز چطوری؟ حالت چطور است؟\nخوبم، ممنون.\nنکته: What's مخفف What is و I'm مخفف I am است؛ این شکل کوتاه فقط در مکالمه به کار می‌رود.","pageRef":"صفحه ۸"},{"type":"answer","title":"حروف صدادار الفبای انگلیسی را نام ببرید و تلفظ هر یک را به فارسی بنویسید.","body":"حروف صدادار پنج‌تا هستند: A (اِی)، E (اِی)، I (آی)، O (اُ)، U (یو).\nبقیه ۲۱ حرف، حروف بی‌صدا (Consonants) نامیده می‌شوند.\nحروف صدادار در نوشتن همه واژه‌ها نقش مهمی دارند؛ هر واژه انگلیسی دست‌کم یک حرف صدادار دارد.","pageRef":"صفحه ۹"},{"type":"note","title":"معرفی خود به انگلیسی","body":"برای معرفی خود بگویید: My name is Ali. یا I am Ali.\nبرای پرسیدن اسم دیگران بگویید: What's your name?\nبرای معرفی دوستتان بگویید: This is my friend, Ali."},{"type":"note","title":"حرف بزرگ و حرف کوچک","body":"اول هر جمله و همه اسم‌های خاص با حرف بزرگ نوشته می‌شود: My name is Ali.\nاسم کشور، شهر و روزهای هفته همیشه با حرف بزرگ شروع می‌شود: Iran, Tehran, Saturday.\nدر املا، بزرگ و کوچک بودن حرف نمره دارد."},{"type":"exam","title":"Complete the conversation: A: Hi! ... your name? B: ... name is Reza.","body":"پاسخ: What's your name? / My name is Reza.\nتوضیح: بعد از What حتماً صفت ملکی your و قبل از اسم شخص صفت ملکی my می‌آید.\nنکته امتحانی: در نوشتن مکالمه، علامت سؤال و حرف بزرگ اول جمله را جا نیندازید."},{"type":"exam","title":"معنی عبارت‌های زیر را بنویسید: Good morning / Nice to meet you / See you later","body":"Good morning = صبح بخیر، Nice to meet you = از آشنایی‌ات خوشبختم، See you later = بعداً می‌بینمت.\nعبارت‌های احوال‌پرسی معمولاً جفت می‌آیند؛ هر عبارت را با جواب خودش حفظ کنید.\nمثال جواب: Nice to meet you, too = من هم از آشنایی‌ات خوشبختم."}]},{"number":4,"title":"My Family","pages":"۳۸ تا ۴۸","contents":[{"type":"answer","title":"Translate: This is my family. My father is a teacher and my mother is a nurse. I have one brother and one sister.","body":"ترجمه: این خانواده من است. پدرم معلم است و مادرم پرستار است. من یک برادر و یک خواهر دارم.\nنکته: I have برای «دارم» به کار می‌رود و بعد از آن a یا عدد می‌آید: I have a brother.\nنکته: شغل‌ها بعد از فعل is با a/an می‌آیند: is a teacher.","pageRef":"صفحه ۴۰"},{"type":"answer","title":"Answer in English: Who is he? (او پدر من است)","body":"پاسخ: He is my father.\nتوضیح: برای معرفی مرد از He is و برای زن از She is استفاده می‌کنیم.\nmy یعنی «... من» و همیشه قبل از اسم می‌آید: my mother, my brother, my family.","pageRef":"صفحه ۴۱"},{"type":"note","title":"واژه‌های خانواده","body":"father پدر، mother مادر، brother برادر، sister خواهر، grandfather پدربزرگ، grandmother مادربزرگ.\nuncle برای عمو و دایی و aunt برای خاله و عمه هر دو به کار می‌رود؛ در انگلیسی این تفکیک وجود ندارد."},{"type":"note","title":"a یا an؟","body":"قبل از اسم مفردی که با حرف صدادار (a, e, i, o, u) شروع می‌شود، an می‌آید: an apple, an uncle.\nقبل از بقیه اسم‌ها a می‌آید: a teacher, a sister.\nبه تلفظ نگاه کنید نه به حرف اول نوشتاری واژه."},{"type":"exam","title":"Fill in the blanks: My mother's mother is my ....... and my father's brother is my .......","body":"پاسخ: grandmother / uncle.\nمادرِ مادرم یعنی مادربزرگ (grandmother) و برادرِ پدرم یعنی عمو (uncle) است.\nنکته: ترکیب مالکیت با 's نشان‌دهنده رابطه خانوادگی است؛ جمله را از آخر به اول ترجمه کنید."},{"type":"exam","title":"مکالمه را کامل کنید: A: How many people are there in your family? B: .......","body":"پاسخ نمونه: There are five people in my family: my father, my mother, my brother, my sister and me.\nنکته: برای شمارش افراد از There are (جمع) و There is (مفرد) استفاده می‌شود.\nدر پاسخ، اعضای خانواده را با کاما جدا کنید و خودتان را در آخر بگویید."}]},{"number":6,"title":"My House","pages":"۵۸ تا ۶۸","contents":[{"type":"answer","title":"Translate: My house has two bedrooms, a kitchen and a living room. My room is small but beautiful.","body":"ترجمه: خانه من دو اتاق‌خواب، یک آشپزخانه و یک اتاق پذیرایی دارد. اتاق من کوچک ولی زیباست.\nنکته: has برای «دارد» به کار می‌رود و but برای «ولی» است.\nعدد قبل از اسم جمع می‌آید: two bedrooms (اتاق‌خواب‌ها جمع می‌شوند).","pageRef":"صفحه ۶۰"},{"type":"answer","title":"Answer in English: Where is the cat? (گربه زیر میز است)","body":"پاسخ: The cat is under the table.\nتوضیح: under یعنی زیر، on یعنی روی، in یعنی داخل، next to یعنی کنار.\nترتیب جمله: فاعل + فعل (is) + حرف اضافه مکان + مکان.","pageRef":"صفحه ۶۲"},{"type":"note","title":"اتاق‌های خانه به انگلیسی","body":"living room اتاق پذیرایی، bedroom اتاق خواب، kitchen آشپزخانه، bathroom حمام، yard حیاط، balcony بالکن.\nکلمه room در ترکیب‌های اتاق‌ها تکرار می‌شود؛ آن را جدا حفظ کنید تا واژه‌های تازه راحت یادتان بماند."},{"type":"note","title":"حروف اضافه مکان","body":"in داخل، on روی، under زیر، near نزدیک، next to کنار، behind پشت.\nمثال: The ball is under the chair. (توپ زیر صندلی است.)\nاین حروف اضافه در تصویرنویسی امتحان‌ها زیاد سؤال می‌شوند."},{"type":"exam","title":"Choose the correct word: The book is (on / under / in) the desk.","body":"پاسخ: on — اگر کتاب روی میز باشد on درست است؛ زیر میز under و داخل کشو یا میز in است.\nنکته: در تست‌های مکان حتماً به تصویر سؤال دقیق نگاه کنید و رابطه شیء با میز را پیدا کنید."},{"type":"exam","title":"به انگلیسی بنویسید: آشپزخانه کجاست؟ — آن کنار پذیرایی است.","body":"پاسخ: Where is the kitchen? — It is next to the living room.\nWhere برای پرسیدن مکان به کار می‌رود و در پاسخ از It is استفاده می‌کنیم.\nپاسخ هر سؤال با Where با It is (مفرد) یا They are (جمع) شروع می‌شود."}]}]},{"title":"پیام‌های آسمان هفتم","subject":"پیام‌های آسمان","description":"آموزش‌های قرآنی و پیام‌های تربیتی","color":"amber","icon":"sparkles","chapters":[{"number":1,"title":"هُوَ اللّٰه","pages":"۸ تا ۱۸","contents":[{"type":"answer","title":"آیه «یا أَیُّهَا الَّذینَ آمَنُوا اتَّقُوا اللّٰهَ حَقَّ تُقاتِهِ» را ترجمه و مفهوم آن را توضیح دهید.","body":"ترجمه: ای کسانی که ایمان آورده‌اید، از خدا پروا کنید؛ آن‌گونه که سزاوار پروا از اوست و جز در حال تسلیم (اسلام) نمیرید.\nمفهوم: خداوند مؤمنان را به تقوا دعوت می‌کند؛ تقوا یعنی مراقبت دائمی از اعمال و دور ماندن از گناه.\nتقوا مانند سپر است و انسان را از آسیب گناه محافظت می‌کند.","pageRef":"صفحه ۱۰"},{"type":"answer","title":"چگونه می‌توان خدا را شناخت؟ سه راه را با توضیح بنویسید.","body":"۱) نگاه به آفرینش: نظم آسمان، بدن انسان و طبیعت نشان‌دهنده آفریننده حکیم است.\n۲) گوش سپردن به پیامبران و کتاب‌های آسمانی که از سوی خدا فرستاده شده‌اند.\n۳) مراجعه به فطرت درونی؛ انسان به طور طبیعی به آفریدگار گرایش دارد، مخصوصاً در سختی‌ها.\nاین سه راه در کنار هم، شناخت خدا را کامل می‌کنند.","pageRef":"صفحه ۱۲"},{"type":"note","title":"معنای هُوَ اللّٰه","body":"هُوَ یعنی «او» و هُوَ اللّٰه یعنی «او خداست».\nبرای خدا از ضمیر «هُوَ» استفاده می‌شود چون هیچ‌کس شبیه او نیست و او قابل وصف کامل نیست.\nخداوند آفریدگار همه چیز است و به همه چیز دانا و تواناست."},{"type":"note","title":"تقوا در یک خط","body":"تقوا یعنی مراقبت از خود در برابر گناه؛ مانند راننده‌ای که همیشه به تابلوها توجه می‌کند.\nراه‌های تقویت تقوا: نماز اول وقت، یاد خدا، همنشین خوب و حساب‌کردن اعمال در پایان روز."},{"type":"exam","title":"سه صفت از صفات خداوند را با معنی بنویسید.","body":"خالق یعنی آفریننده، عالم یعنی دانا، رحیم یعنی بسیار مهربان.\nخداوند همه چیز را آفریده، به همه چیز داناست و به بندگانش مهربان است.\nنکته: صفات خدا را با یک مثال از آفرینش به خاطر بسپارید تا در توضیح بنویسید."},{"type":"exam","title":"از دیدگاه این درس، هدف زندگی انسان چیست؟","body":"هدف زندگی، شناخت خدا و رسیدن به کمال و نزدیکی به اوست؛ انسان با ایمان و عمل شایسته به سعادت دنیا و آخرت می‌رسد.\nمانند مسافری که مقصدش روشن است، کسی که هدفش را بشناسد، مسیر درست را انتخاب می‌کند.\nنکته: در پاسخ تشریحی، اول مفهوم را بنویسید و بعد مثال بزنید."}]},{"number":5,"title":"روزه، برنامه‌ای برای تقویت تقوا","pages":"۵۶ تا ۶۶","contents":[{"type":"answer","title":"آیه «یا أَیُّهَا الَّذینَ آمَنُوا کُتِبَ عَلَیْکُمُ الصِّیامُ» را ترجمه کنید و فلسفه روزه را بنویسید.","body":"ترجمه: ای کسانی که ایمان آورده‌اید، روزه بر شما واجب شده است؛ همان‌گونه که بر کسانی که پیش از شما بودند واجب شده بود، تا پرهیزگار شوید.\nفلسفه: هدف اصلی روزه تقویت تقواست؛ روزه‌دار با کنترل خواسته‌های خود، قدرت در برابر گناه پیدا می‌کند.\nروزه هم برای سلامت بدن و هم برای رشد روح سودمند است.","pageRef":"صفحه ۵۸"},{"type":"answer","title":"چهار فایده روزه برای فرد و جامعه را بنویسید.","body":"۱) تقویت تقوا و اراده.\n۲) همدلی با گرسنگان و محرومان جامعه.\n۳) آرامش روح و سبکی روحیه.\n۴) سلامت بدن و استراحت دستگاه گوارش.\nدر سطح جامعه نیز روزه، روح بخشش و مهربانی را تقویت می‌کند.","pageRef":"صفحه ۶۰"},{"type":"note","title":"شرط‌های روزه در یک نگاه","body":"روزه برای هر مسلمان بالغ و عاقل واجب است؛ بیمار و مسافر می‌توانند افطار کنند و بعداً قضا کنند.\nروزه با نیت و پرهیز از خوردن و آشامیدن، از اذان صبح تا اذان مغرب صحیح است.\nآسان‌گیری در ضرر داشتن، از قواعد روزه است."},{"type":"note","title":"روزه؛ باشگاه اراده","body":"روزه مانند باشگاه اراده است؛ هر روز صبح تصمیم می‌گیریم و تا مغرب پای آن می‌ایستیم.\nهرچه اراده قوی‌تر باشد، ترک گناه آسان‌تر می‌شود؛ این همان پیوند روزه و تقواست."},{"type":"exam","title":"فلسفه روزه چیست؟ با اشاره به آیه توضیح دهید.","body":"فلسفه روزه رسیدن به تقواست؛ خداوند در آیه ۱۸۳ سوره بقره می‌فرماید روزه واجب شده «لَعَلَّکُم تَتَّقون» یعنی تا پرهیزگار شوید.\nروزه‌دار با کنترل خواسته‌هایش بر نفس خود مسلط می‌شود.\nنکته: عبارت «لَعَلَّکُم تَتَّقون» با معنی آن را حفظ کنید؛ در امتحان‌ها زیاد پرسیده می‌شود."},{"type":"exam","title":"اگر روزه برای شخصی ضرر داشته باشد، حکم آن چیست؟","body":"بیماری که روزه برایش ضرر دارد، باید افطار کند و روزه‌اش را بعد از ماه رمضان قضا نماید؛ خداوند سختی نمی‌خواهد.\nآیه: «یُریدُ اللّٰهُ بِکُمُ الیُسرَ وَ لا یُریدُ بِکُمُ العُسرَ»؛ خداوند برای شما آسانی می‌خواهد نه سختی.\nنکته: در پاسخ، هم حکم و هم دلیل آن (ضرر) را بنویسید."}]},{"number":8,"title":"هفده رکعت","pages":"۸۶ تا ۹۶","contents":[{"type":"answer","title":"نمازهای واجب روزانه را با تعداد رکعت هر کدام بنویسید و مجموع را حساب کنید.","body":"صبح ۲ رکعت، ظهر ۴ رکعت، عصر ۴ رکعت، مغرب ۳ رکعت و عشا ۴ رکعت.\nمجموع: ۲ + ۴ + ۴ + ۳ + ۴ = ۱۷ رکعت.\nبه همین دلیل نام این درس «هفده رکعت» است.","pageRef":"صفحه ۸۸"},{"type":"answer","title":"نمازهای مستحب (نافله) را تعریف کنید و چند نمونه نام ببرید.","body":"نافله‌ها نمازهای مستحبی هستند که واجب نیستند ولی ثواب زیادی دارند و رابطه انسان با خدا را قوی‌تر می‌کنند.\nنمونه‌ها: نافله شب، نافله صبح، نافله ظهر و نافله مغرب.\nنافله‌ها جبران کاستی‌های نمازهای واجب در قیامت شمرده می‌شوند؛ پس اول واجب‌ها را درست بخوانیم.","pageRef":"صفحه ۹۰"},{"type":"note","title":"رکعت‌ها را چطور حفظ کنیم؟","body":"صبح ۲ / ظهر ۴ / عصر ۴ / مغرب ۳ / عشا ۴ = ۱۷ رکعت.\nترفند: الگوی «۲ ۴ ۴ ۳ ۴» را با ترتیب صبح، ظهر، عصر، مغرب، عشا مرور کنید.\nمغرب تنها نماز ۳ رکعتی روز است؛ همین نقطه تمایز آن است."},{"type":"note","title":"تفاوت نماز واجب و مستحب","body":"نمازهای واجب (۱۷ رکعت روزانه) ترک‌شان گناه است، اما نافله‌ها مستحب و اختیاری‌اند.\nنافله، جبران کاستی‌های نمازهای واجب در قیامت است.\nبرنامه درست: اول نمازهای واجب را دقیق بخوانیم، سپس سراغ مستحب‌ها برویم."},{"type":"exam","title":"چرا نام این درس «هفده رکعت» گذاشته شده است؟","body":"چون مجموع رکعت‌های نمازهای واجب روزانه ۱۷ رکعت است: صبح ۲، ظهر ۴، عصر ۴، مغرب ۳، عشا ۴.\n۲ + ۴ + ۴ + ۳ + ۴ = ۱۷ رکعت.\nنکته: جدول رکعت‌ها را در دفتر رسم کنید و هر شب یک بار با صدای بلند بازگویی کنید."},{"type":"exam","title":"سه اثر نماز در زندگی انسان را بنویسید.","body":"۱) یاد خدا و آرامش قلب.\n۲) بازداشتن از زشتی و گناه؛ خداوند می‌فرماید نماز انسان را از زشتی‌ها بازمی‌دارد.\n۳) نظم و وقت‌شناسی در برنامه روزانه.\nنماز مانند ستون، دین را نگه می‌دارد؛ یاد آیه «اِنَّ الصَّلاةَ تَنهی عَنِ الفَحشاءِ وَ المُنکَر» امتیاز پاسخ را بالا می‌برد."}]}]},{"title":"کار و فناوری هفتم","subject":"کار و فناوری","description":"نمونه‌سازی، فناوری و مهارت‌های کاربردی","color":"red","icon":"wrench","chapters":[{"number":1,"title":"نمونه‌سازی با کارتون","pages":"۶ تا ۲۴","contents":[{"type":"answer","title":"مراحل ساخت یک نمونه با کارتون را به ترتیب بنویسید.","body":"۱) انتخاب طرح و ایده.\n۲) طراحی و اندازه‌گیری روی کارتون.\n۳) بریدن قطعه‌ها با قیچی یا کاتر.\n۴) مونتاژ و چسباندن قطعه‌ها.\n۵) بهسازی و اصلاح نمونه.\n۶) تزئین و ارائه به دیگران.\nترتیب مراحل، ستون فقرات ارزشیابی این فصل است.","pageRef":"صفحه ۱۰"},{"type":"answer","title":"چرا برای شروع نمونه‌سازی از کارتون استفاده می‌شود؟","body":"کارتون ارزان و در دسترس است، بریدن و چسباندن آن آسان است و در صورت خرابی می‌توان دوباره ساخت.\nهمچنین سبک است و با ماژیک و رنگ به‌خوبی تزئین می‌شود.\nبرای تمرین همه مراحل طراحی تا عرضه با کمترین هزینه، بهترین ماده اولیه است.","pageRef":"صفحه ۸"},{"type":"note","title":"ابزارهای نمونه‌سازی با کارتون","body":"قیچی، کاتر، خط‌کش، مداد، چسب مایع یا چسب حرارتی و سنجاق از ابزارهای اصلی هستند.\nبا کاتر حتماً روی تخته‌برش کار کنید و تیغه را فقط به اندازه لازم بیرون بکشید."},{"type":"note","title":"ایمنی هنگام برش","body":"قطعه‌ها را همیشه با خط‌کش (بریده‌نشان) برش بزنید تا برش صاف و دست سالم بماند.\nتیغه کاتر را هرگز به سمت بدن نگیرید و ابزار تیز را وسط میز رها نکنید.\nپس از کار، ابزارها را جمع کنید و تیغه کاتر را جمع‌شو کنید."},{"type":"exam","title":"در مرحله «بهسازی» چه کاری انجام می‌شود؟ با مثال توضیح دهید.","body":"در بهسازی، نمونه ساخته‌شده بررسی می‌شود تا نقص‌هایش برطرف شود؛ مثل محکم‌کردن درپوش جعبه با نوار چسب یا اصلاح اندازه قطعه‌ها.\nهدف، رساندن نمونه به طرح اصلی و بهتر شدن عملکرد آن است.\nنکته: بهسازی یعنی اصلاح کارکرد، اما تزئین یعنی زیباسازی؛ این دو را اشتباه نگیرید."},{"type":"exam","title":"سه ویژگی یک نمونه خوب با کارتون را بنویسید.","body":"۱) استحکام کافی؛ قطعه‌ها محکم و درست به هم چسبیده باشند.\n۲) اندازه‌های دقیق و متناسب با طرح.\n۳) ظاهر مرتب و تزئین‌شده مطابق طرح اصلی.\nنمونه خوب نمونه‌ای است که وظیفه خود را به‌خوبی انجام دهد."}]},{"number":2,"title":"دوخت","pages":"۲۶ تا ۴۴","contents":[{"type":"answer","title":"مراحل دوختن یک جاسوزنی ساده را به ترتیب بنویسید.","body":"۱) انتخاب و طراحی الگو روی پارچه.\n۲) بریدن دو لایه پارچه مطابق الگو.\n۳) اتصال دو لایه با سنجاق و کوک راه‌انداز.\n۴) برگرداندن رو و پرکردن با وک (پارچه اسفنجی).\n۵) دوخت سوراخ ورودی و تزئین با دکمه و گلدوزی.\nترتیب را با کلمه کلیدی «طراحی، برش، کوک، پر کردن، تزئین» به خاطر بسپارید.","pageRef":"صفحه ۲۸"},{"type":"answer","title":"کوک راه‌انداز چگونه زده می‌شود و چه کاربردی دارد؟","body":"در کوک راه‌انداز، سوزن از پشت پارچه وارد می‌شود، سپس به اندازه حدود ۰/۵ سانتی‌متر جلوتر بیرون می‌آید و دوباره از همان نقطه به عقب برمی‌گردد؛ این کار زنجیره‌ای از کوک‌های محکم می‌سازد.\nکاربرد: شروع دوخت، ترمیم پارچه و اتصال‌هایی که استحکام لازم دارند.\nفاصله کوک‌ها باید یکنواخت باشد تا دوخت زیبا و مقاوم شود.","pageRef":"صفحه ۳۲"},{"type":"note","title":"ابزارهای دوخت","body":"سوزن، نخ، قیچی، سنجاق و متر خیاطی ابزارهای اصلی فصل دوخت هستند.\nنخ را به اندازه طول ساعد دست بگیرید؛ نخ بلندتر گره می‌خورد و نخ خیلی کوتاه باعث عوض کردن مداوم نخ می‌شود."},{"type":"note","title":"گره اول نخ","body":"برای شروع دوخت، دو سر نخ را روی هم بگذارید و گره بیندازید تا هنگام کشیدن، نخ از پارچه بیرون نپرد.\nپس از گره‌زدن، نخ را از پشت پارچه وارد کنید تا گره در روی کار پیدایش نشود."},{"type":"exam","title":"در دوخت، سنجاق چه کاربردی دارد و چگونه زده می‌شود؟","body":"سنجاق الگو را روی پارچه ثابت نگه می‌دارد و دو لایه پارچه را در برابر جابه‌جایی هنگام دوخت محافظت می‌کند؛ در نتیجه برش و کوک دقیق‌تر انجام می‌شود.\nسنجاق‌ها باید عرضی و عمود بر خط کوک زده شوند تا زیر دست سوزن نگیرند.\nنکته: در ارزشیابی عملی، رعایت ایمنی با سنجاق و سوزن هم نمره دارد."},{"type":"exam","title":"چهار نکته ایمنی هنگام کار با سوزن و قیچی را بنویسید.","body":"۱) سوزن را هرگز بین لب‌ها نگه ندارید.\n۲) سوزن و سنجاق‌های باقی‌مانده را در جاسوزنی جمع کنید.\n۳) قیچی را هنگام دادن به دیگران، دسته‌به‌سوی آن‌ها بدهید.\n۴) ابزار برنده را روی لبه میز رها نکنید و خرده‌ریزها را جمع کنید.\nایمنی در همه فصل‌های کار و فناوری سؤال ثابت امتحان است."}]},{"number":6,"title":"الکترونیک","pages":"۹۶ تا ۱۱۴","contents":[{"type":"answer","title":"اجزای مدار ساده روشنایی با LED را نام ببرید و نقش هر کدام را بنویسید.","body":"۱) باتری (منبع تغذیه): انرژی الکتریکی مدار را فراهم می‌کند.\n۲) سیم رابط: راه عبور جریان را می‌سازد.\n۳) کلید: جریان را وصل و قطع می‌کند.\n۴) LED (دیود نورانی): انرژی الکتریکی را به نور تبدیل می‌کند.\n۵) مقاومت: جریان را محدود می‌کند تا LED نسوزد.\nبدون مقاومت، LED با جریان زیاد می‌سوزد.","pageRef":"صفحه ۱۰۰"},{"type":"answer","title":"مراحل ساخت یک مدار ساده با LED را بنویسید.","body":"۱) پایه بلند LED (آند) را به قطب مثبت باتری و پایه کوتاه (کاتد) را از طریق مقاومت به قطب منفی وصل کنید.\n۲) اتصال‌ها را با سیم رابط محکم کنید.\n۳) کلید را در مسیر قرار دهید و مدار را ببندید تا LED روشن شود.\n۴) اگر LED روشن نشد، جهت پایه‌ها و سلامت باتری را بررسی کنید.\nهمیشه اول مدار را روی تخته بچینید، بعد وصل کنید.","pageRef":"صفحه ۱۰۴"},{"type":"note","title":"پایه‌های LED را اشتباه نگیرید","body":"پایه بلندتر LED آند (مثبت) و پایه کوتاه‌تر کاتد (منفی) است.\nLED فقط در یک جهت جریان را عبور می‌دهد؛ اگر روشن نشد، جای پایه‌ها را عوض کنید.\nLED را همیشه با مقاومت سری ببندید."},{"type":"note","title":"ایمنی در فصل الکترونیک","body":"فقط با باتری‌های کم‌ولتاژ مثل ۱/۵ ولت و ۹ ولت کار کنید و به برق شهری و پریز نزدیک نشوید.\nسر مفتول‌های برش‌خورده را جمع و دور بیندازید و کار با هویه فقط با نظارت مربی انجام می‌شود."},{"type":"exam","title":"در مدار سری اگر یکی از LEDها بسوزد، بقیه چه می‌شوند؟ چرا؟","body":"در مدار سری کل مدار خاموش می‌شود؛ چون راه جریان فقط یک مسیر است و با قطع شدن یک LED، مسیر جریان کامل نمی‌ماند.\nدر مدار موازی هر شاخه مستقل است و بقیه چراغ‌ها روشن می‌مانند.\nنکته: تفاوت مدار سری و موازی یکی از پرتکرارترین سؤال‌های امتحان این فصل است."},{"type":"exam","title":"چهار کاربرد LED در زندگی روزمره را بنویسید.","body":"۱) چراغ‌قوه و چراغ مطالعه.\n۲) لامپ‌های روشنایی خانه و خیابان.\n۳) صفحه‌نمایش تلویزیون و مانیتور.\n۴) چراغ راهنما و تزئینات وسایل.\nLED نسبت به لامپ رشته‌ای انرژی کمتری مصرف می‌کند و عمر طولانی‌تری دارد."}]}]}]},{"number":8,"name":"پایه هشتم","subtitle":"تنظیم دانش و مهارت","books":[{"title":"ریاضی هشتم","subject":"ریاضی","description":"اعداد گویا، توان و ریشه، جبر و معادله","color":"blue","icon":"calculator","chapters":[{"number":1,"title":"اعداد گویا","pages":"۱۰ تا ۲۶","contents":[{"type":"answer","title":"حاصل عبارت ۳/۲ + (−۴/۵) را حساب کنید.","body":"برای جمع کسرها باید آن‌ها را هم‌مخرج کنیم.\nکوچک‌ترین مخرج مشترک ۲ و ۵ برابر ۱۰ است.\n۳/۲ = ۱۵/۱۰ و ۴/۵ = ۸/۱۰\nپس: ۳/۲ + (−۴/۵) = ۱۵/۱۰ − ۸/۱۰ = ۷/۱۰\nحاصل نهایی ۷/۱۰ است؛ جواب را یک بار دیگر مرور کن.","pageRef":"صفحه ۱۴"},{"type":"answer","title":"حاصل (−۲/۳) ÷ (−۴/۹) را حساب کنید.","body":"در تقسیم کسرها، تقسیم را به ضرب در معکوس تبدیل می‌کنیم.\nمعکوس ۴/۹ برابر ۹/۴ است.\nپس: (−۲/۳) ÷ (−۴/۹) = (−۲/۳) × (۹/۴) = −۱۸/۱۲\nمنفی در منفی مثبت می‌شود، بنابراین حاصل ۱۸/۱۲ است.\nکسر را ساده می‌کنیم: ۱۸/۱۲ = ۳/۲\nحاصل نهایی ۳/۲ است.","pageRef":"صفحه ۱۶"},{"type":"note","title":"قواعد جمع و تفریق اعداد گویا","body":"جمع دو عدد هم‌علامت: قدرمطلق‌ها را جمع کن و علامت مشترک را بگذار.\nجمع دو عدد مخالف‌علامت: قدرمطلق کوچک‌تر را از بزرگ‌تر کم کن و علامت عدد بزرگ‌تر را بنویس.\nتفریق یعنی جمع با عدد مخالف: ۵ − (−۳) = ۵ + ۳ = ۸"},{"type":"note","title":"ریشه دوم و مربع کامل","body":"اگر عددی گویا حاصل‌ضرب عددی گویا در خودش باشد، مربع کامل نامیده می‌شود؛ مثل ۹ = ۳ × ۳.\nریشه دوم ۹ برابر ۳ و ریشه دوم ۱/۴ برابر ۱/۲ است.\nمربع کامل‌ها ریشه گویا دارند؛ اما ریشه ۵ عددی گویا نیست."},{"type":"exam","title":"با استفاده از خاصیت توزیعی حاصل عبارت ۵ × ۳/۷ + ۵ × ۴/۷ را حساب کنید.","body":"پاسخ:\nعامل مشترک ۵ را با خاصیت توزیعی بیرون می‌کشیم:\n۵ × ۳/۷ + ۵ × ۴/۷ = ۵ × (۳/۷ + ۴/۷)\n۳/۷ + ۴/۷ = ۷/۷ = ۱\nپس حاصل عبارت ۵ × ۱ = ۵ است.\nنکته برای نمره کامل: ذکر خاصیت توزیعی در ابتدای پاسخ الزامی است."},{"type":"exam","title":"توان‌های عدد گویا: حاصل (−۳/۲) × (−۳/۲) و ۳/۲ × ۳/۲ × ۳/۲ را حساب و مقایسه کنید.","body":"پاسخ:\n(−۳/۲) × (−۳/۲) = ۹/۴؛ چون توان زوج است حاصل مثبت می‌شود.\n۳/۲ × ۳/۲ × ۳/۲ = ۲۷/۸\nبرای مقایسه، مخرج‌ها را یکی می‌کنیم: ۹/۴ = ۱۸/۸\nچون ۱۸/۸ کمتر از ۲۷/۸ است، ۲۷/۸ بزرگ‌تر است.\nنکته برای نمره کامل: علامت هر مرحله از ضرب را جداگانه بنویس."}]},{"number":4,"title":"معادله","pages":"۵۸ تا ۷۰","contents":[{"type":"answer","title":"معادله ۲x + ۵ = ۱۳ را حل کنید.","body":"جمله عددی را به طرف دیگر معادله منتقل می‌کنیم؛ هنگام انتقال علامت عوض می‌شود:\n۲x = ۱۳ − ۵\n۲x = ۸\nهر دو طرف را بر ۲ تقسیم می‌کنیم:\nx = ۴\nامتحان: ۲ × ۴ + ۵ = ۱۳ درست است، پس ریشه معادله x = ۴ است.","pageRef":"صفحه ۶۰"},{"type":"answer","title":"جمع سه عدد طبیعی متوالی ۴۵ است؛ آن اعداد را بیابید.","body":"عدد اول را x می‌گیریم؛ دو عدد بعدی x + ۱ و x + ۲ هستند.\nمعادله مسئله: x + (x + ۱) + (x + ۲) = ۴۵\nجمله‌های مشابه را جمع می‌کنیم: ۳x + ۳ = ۴۵\n۳x = ۴۲ و در نتیجه x = ۱۴\nپس اعداد ۱۴ و ۱۵ و ۱۶ هستند.\nامتحان: ۱۴ + ۱۵ + ۱۶ = ۴۵ درست است.","pageRef":"صفحه ۶۴"},{"type":"note","title":"معادله و ریشه معادله","body":"معادله، تساوی دو عبارت جبری است که در آن یک متغیر وجود دارد؛ مثل ۳x − ۴ = ۱۱.\nریشه معادله مقداری از متغیر است که تساوی را درست می‌کند.\nبرای اطمینان از درستی جواب، همیشه مقدار به‌دست‌آمده را در معادله امتحان کن."},{"type":"note","title":"قاعده انتقال جمله‌ها در معادله","body":"جمله را که از یک طرف تساوی به طرف دیگر می‌بری، علامتش تغییر می‌کند: + به − و × به ÷.\nخطای رایج: فراموش کردن تغییر علامت جمله‌های منفی هنگام انتقال.\nابتدا جمله‌های دارای x را در یک طرف و اعداد را در طرف دیگر جمع کن، سپس طرفین را ضرب یا تقسیم کن."},{"type":"exam","title":"معادله x/۲ + x/۳ = ۱۰ را حل کنید.","body":"پاسخ:\nهر دو طرف معادله را در مخرج مشترک یعنی ۶ ضرب می‌کنیم:\n۳x + ۲x = ۶۰\n۵x = ۶۰ پس x = ۱۲\nامتحان: ۱۲/۲ + ۱۲/۳ = ۶ + ۴ = ۱۰ درست است.\nنکته برای نمره کامل: نوشتن مخرج مشترک و امتحان جواب، نمره روش به تو می‌دهد."},{"type":"exam","title":"سن پدر ۴ برابر سن پسر است و مجموع سن آن‌ها ۵۰ سال است؛ سن هر کدام را با معادله بیابید.","body":"پاسخ:\nسن پسر را x و سن پدر را ۴x می‌گیریم.\nمعادله: x + ۴x = ۵۰\n۵x = ۵۰ پس x = ۱۰\nسن پسر ۱۰ سال و سن پدر ۴ × ۱۰ = ۴۰ سال است.\nنکته برای نمره کامل: در مسائل کلامی، تعریف متغیر و امتحان نهایی جواب را بنویس."}]},{"number":9,"title":"محیط و مساحت اشکال چهارضلعی","pages":"۱۲۰ تا ۱۳۴","contents":[{"type":"answer","title":"قاعده‌های یک ذوزنقه ۶ و ۱۰ سانتی‌متر و ارتفاع آن ۴ سانتی‌متر است؛ مساحت آن را حساب کنید.","body":"فرمول مساحت ذوزنقه: (جمع دو قاعده × ارتفاع) ÷ ۲\nجمع قاعده‌ها: ۶ + ۱۰ = ۱۶\n۱۶ × ۴ = ۶۴\n۶۴ ÷ ۲ = ۳۲\nمساحت ذوزنقه ۳۲ سانتی‌متر مربع است.","pageRef":"صفحه ۱۲۸"},{"type":"answer","title":"قطرهای یک لوزی ۸ و ۶ سانتی‌متر هستند؛ مساحت و محیط لوزی را حساب کنید.","body":"مساحت لوزی: (قطر اول × قطر دوم) ÷ ۲\nمساحت = (۸ × ۶) ÷ ۲ = ۲۴ سانتی‌متر مربع\nقطرهای لوزی نصف می‌شوند و بر هم عمودند؛ پس نصف قطرها ۴ و ۳ است.\nطبق رابطه ریشه دوم: مربع ضلع = (۴ × ۴) + (۳ × ۳) = ۲۵، پس ضلع = ۵\nمحیط = ۴ × ۵ = ۲۰ سانتی‌متر","pageRef":"صفحه ۱۲۶"},{"type":"note","title":"فرمول‌های مساحت","body":"متوازی‌الاضلاع: مساحت = قاعده × ارتفاع\nلوزی: مساحت = (قطر اول × قطر دوم) ÷ ۲ که همان قاعده × ارتفاع است.\nذوزنقه: مساحت = (جمع دو قاعده × ارتفاع) ÷ ۲\nمثلث: مساحت = (قاعده × ارتفاع) ÷ ۲"},{"type":"note","title":"ارتفاع شکل و واحدها","body":"ارتفاع، فاصله عمودی بین دو ضلع موازی است و همیشه عمود بر قاعده رسم می‌شود.\nخطای رایج: به‌جای ارتفاع، طول ضلع مورب را در فرمول گذاشتن.\nواحد مساحت «سانتی‌متر مربع» و واحد محیط «سانتی‌متر» است."},{"type":"exam","title":"مساحت یک متوازی‌الاضلاع ۴۸ سانتی‌متر مربع و قاعده آن ۸ سانتی‌متر است؛ ارتفاع آن را بیابید.","body":"پاسخ:\nطبق فرمول: قاعده × ارتفاع = مساحت\n۸ × ارتفاع = ۴۸\nارتفاع = ۴۸ ÷ ۸ = ۶ سانتی‌متر\nنکته برای نمره کامل: جواب را با محاسبه دوباره ۸ × ۶ = ۴۸ امتحان کن."},{"type":"exam","title":"به ضلع یک مربع به ضلع ۶ سانتی‌متر، مثلثی با قاعده ۶ و ارتفاع ۴ سانتی‌متر چسبیده است؛ مساحت کل شکل را حساب کنید.","body":"پاسخ:\nمساحت مربع = ۶ × ۶ = ۳۶ سانتی‌متر مربع\nمساحت مثلث = (۶ × ۴) ÷ ۲ = ۱۲ سانتی‌متر مربع\nمساحت کل = ۳۶ + ۱۲ = ۴۸ سانتی‌متر مربع\nنکته برای نمره کامل: شکل ترکیبی را به بخش‌های معلوم تقسیم و مساحت هر بخش را جداگانه بنویس."}]}]},{"title":"علوم تجربی هشتم","subject":"علوم تجربی","description":"رفتار و سازگاری، فشار، ماشین‌ها و ساختمان مواد","color":"green","icon":"flask","chapters":[{"number":2,"title":"رفتار و سازگاری","pages":"۲۰ تا ۳۴","contents":[{"type":"answer","title":"رفتار غریزی و رفتار آموختنی چه تفاوتی دارند؟ برای هر کدام دو مثال بزنید.","body":"رفتار غریزی (ذاتی) با تولد همراه است و به یادگیری و تجربه نیاز ندارد؛ مانند تار تنیدن عنکبوت و خزیدن مار به لانه.\nرفتار آموختنی بر اثر تجربه، تکرار و تمرین به دست می‌آید؛ مانند دوچرخه‌سواری، نوشتن و راه رفتن کودک.\nتفاوت اصلی: رفتار غریزی در همه افراد تقریبا یکسان و ثابت است، اما رفتار آموختنی با تمرین کامل‌تر و بهتر می‌شود.","pageRef":"صفحه ۲۲"},{"type":"answer","title":"چرا رفلکس سریع‌ترین نوع رفتار است؟ توضیح دهید.","body":"رفلکس، پاسخی خودکار و ناخودآگاه بدن در برابر محرک است.\nدر رفتار رفلکسی، پیام در نخاع پاسخ داده می‌شود و لازم نیست تا مغز برود و برگردد.\nبه همین دلیل زمان پاسخ بسیار کوتاه است و از آسیب به بدن جلوگیری می‌کند.\nمثال: وقتی دست به جسم داغ می‌خورد، بی‌درنگ جمع می‌شود.","pageRef":"صفحه ۲۳"},{"type":"note","title":"انواع سازگاری جانداران","body":"سازگاری ساختاری: هماهنگی شکل بدن با محیط، مانند استخوان‌های توخالی و سبک پرندگان برای پرواز.\nسازگاری رفتاری: مهاجرت پرندگان در فصل سرما و زندگی گروهی حیوانات.\nسازگاری فیزیولوژیک: واکنش‌های درون بدن مانند تولید پادتن در برابر میکروب و تعریق در گرما."},{"type":"note","title":"محرک و رفتار","body":"هر عاملی که در موجود زنده واکنش ایجاد کند، محرک نامیده می‌شود و پاسخ به آن، رفتار است.\nخطای رایج: همه رفتارها غریزی نیستند؛ مثلا دوچرخه‌سواری آموختنی است اما مکیدن شیر نوزاد غریزی است.\nبرای تشخیص بپرس: آیا این رفتار بدون آموزش و تجربه هم انجام می‌شود؟"},{"type":"exam","title":"رفتارهای زیر غریزی است یا آموختنی؟ استدلال کنید: الف) جمع کردن دست هنگام لمس جسم داغ ب) دوچرخه‌سواری","body":"پاسخ:\nالف) غریزی است؛ این رفتار رفلکسی و خودکار است و نوزادان نیز بدون آموزش آن را انجام می‌دهند.\nب) آموختنی است؛ دوچرخه‌سواری با تمرین و تجربه یاد گرفته می‌شود و در آغاز تعادل حفظ نمی‌شود.\nنکته برای نمره کامل: کنار هر مورد، دلیل انتخاب خود را بنویس."},{"type":"exam","title":"چرا شتر برای زندگی در بیابان سازگار است؟","body":"پاسخ:\nدر کوهانه شتر چربی ذخیره می‌شود که در نبود غذا انرژی بدن را تأمین می‌کند؛ این یک سازگاری ساختاری است.\nپلک و مژه‌های بلند، چشم را از شن و باد بیابان حفظ می‌کند.\nکف پای پهن باعث می‌شود شتر روی شن‌های نرم فرو نرود و ساعتی‌ها راه برود.\nنکته برای نمره کامل: نام نوع سازگاری را کنار هر ویژگی بنویس."}]},{"number":6,"title":"فشار و آثار آن","pages":"۸۰ تا ۹۴","contents":[{"type":"answer","title":"جسمی با وزن ۶۰۰ نیوتون روی سطحی به مساحت ۲ متر مربع قرار گرفته است؛ فشار آن بر سطح را حساب کنید.","body":"فرمول فشار: فشار = نیرو (وزن) ÷ مساحت سطح تماس\nفشار = ۶۰۰ ÷ ۲ = ۳۰۰\nواحد فشار، نیوتون بر متر مربع یا پاسکال است.\nپس فشار جسم روی سطح ۳۰۰ پاسکال است.","pageRef":"صفحه ۸۲"},{"type":"answer","title":"چرا راه رفتن روی برف با چوب اسکی آسان‌تر از کفش معمولی است؟","body":"فشار با مساحت تماس رابطه معکوس دارد: فشار = نیرو ÷ مساحت.\nوزن شخص در هر دو حالت یکسان است.\nچوب اسکی سطح تماس با برف را بسیار بزرگ می‌کند، پس فشار وارد بر برف کم می‌شود.\nبا فشار کمتر، پا در برف فرو نمی‌رود و حرکت آسان‌تر انجام می‌شود.","pageRef":"صفحه ۸۴"},{"type":"note","title":"فرمول و واحد فشار","body":"فشار = نیرو ÷ مساحت تماس؛ واحد آن نیوتون بر متر مربع یا پاسکال است.\nبا ثابت بودن نیرو، هر چه مساحت بیشتر باشد فشار کمتر است و هر چه مساحت کمتر باشد فشار بیشتر است.\nمثال: تیغ برنده سطح تماس کوچک و فشار زیادی دارد و به راحتی می‌برد."},{"type":"note","title":"فشار در مایعات","body":"فشار مایع به عمق و چگالی مایع بستگی دارد؛ هر چه عمق بیشتر باشد، فشار بیشتر است.\nخطای رایج: فشار مایع به مساحت و شکل ظرف بستگی ندارد.\nمایع فشار را در همه جهت‌ها مانند بالا، پایین و کناره‌ها به یک اندازه وارد می‌کند."},{"type":"exam","title":"جسمی با وزن ۱۵۰۰ نیوتون روی پایه‌ای به مساحت ۰٫۵ متر مربع قرار دارد؛ فشار آن را حساب کنید.","body":"پاسخ:\nفشار = نیرو ÷ مساحت\nفشار = ۱۵۰۰ ÷ ۰٫۵ = ۳۰۰۰\nفشار جسم روی پایه ۳۰۰۰ پاسکال است.\nنکته برای نمره کامل: در تقسیم بر ۰٫۵ حاصل بزرگ‌تر می‌شود و نوشتن واحد پاسکال در جواب الزامی است."},{"type":"exam","title":"دو کاربرد فشار هوا را در زندگی روزمره نام ببرید و یکی را توضیح دهید.","body":"پاسخ:\nکاربردها: بمب مکش (چسب ناخنی)، سرنگ و قطره‌چکان، جاروبرقی و بستن درب‌های لاستیکی.\nتوضیح بمب مکش: هنگام فشردن، هوای داخل آن خارج می‌شود؛ هوای کم داخل یعنی فشار پایین و فشار هوای بیرون، چسب را محکم به سطح می‌چسباند.\nنکته برای نمره کامل: به اختلاف فشار داخل و بیرون اشاره کن."}]},{"number":9,"title":"ساختمان مواد","pages":"۱۳۰ تا ۱۴۴","contents":[{"type":"answer","title":"نظریه ذره‌ای ماده را بیان کنید و دو نتیجه از آن بنویسید.","body":"طبق نظریه ذره‌ای، ماده از ذره‌های بسیار ریز و ناپیدایی ساخته شده است.\nنتیجه اول: ذره‌های ماده در حرکت دائمی‌اند؛ برای نمونه بوی غذا در هوای اتاق پخش می‌شود.\nنتیجه دوم: بین ذره‌های ماده فاصله وجود دارد؛ به همین دلیل ماده می‌تواند تغییر حالت دهد و حجمش تغییر کند.","pageRef":"صفحه ۱۳۰"},{"type":"answer","title":"چرا بوی غذا در تمام خانه پخش می‌شود؟","body":"ذره‌های ماده در حرکت دائمی‌اند؛ ذره‌های گاز و بخار غذا از ظرف جدا می‌شوند.\nاین ذره‌ها در هوای خانه حرکت می‌کنند و در همه جا پخش می‌شوند.\nبه این پدیده پخش یا نفوذ می‌گویند.\nهر چه دما بالاتر باشد، حرکت ذره‌ها سریع‌تر و پخش بوی غذا زودتر انجام می‌شود.","pageRef":"صفحه ۱۳۲"},{"type":"note","title":"مقایسه ذره‌ها در سه حالت ماده","body":"جامد: فاصله ذره‌ها خیلی کم است، ذره‌ها فقط در جای خود ارتعاش می‌کنند و شکل و حجم ثابت است.\nمایع: فاصله ذره‌ها بیشتر از جامد است، ذره‌ها روی هم می‌لغزند و حجم ثابت اما شکل متغیر است.\nگاز: فاصله ذره‌ها زیاد است، ذره‌ها آزاد و سریع حرکت می‌کنند و شکل و حجم متغیر است."},{"type":"note","title":"تغییر حالت‌های ماده","body":"ذوب: جامد به مایع؛ انجماد: مایع به جامد.\nتبخیر: مایع به گاز؛ میعان (چگالش): گاز به مایع.\nخطای رایج: شبنم صبحگاهی نتیجه تبخیر نیست؛ بخار آب به ذره‌های آب مایع تبدیل شده است، پس میعان است."},{"type":"exam","title":"چرا جامدها شکل ثابت دارند ولی گازها شکل ثابت ندارند؟","body":"پاسخ:\nدر جامد، ذره‌ها خیلی به هم نزدیک‌اند، نیروی چسبندگی قوی بین آن‌ها وجود دارد و فقط در جای خود ارتعاش می‌کنند.\nدر گاز، فاصله ذره‌ها زیاد و نیروی چسبندگی بسیار کم است و ذره‌ها آزادانه در همه جهت‌ها حرکت می‌کنند.\nبه همین دلیل گاز شکل ظرف خود را می‌گیرد اما جامد شکل خود را حفظ می‌کند.\nنکته برای نمره کامل: به فاصله ذره‌ها، نیروی چسبندگی و حرکت ذره‌ها هر سه اشاره کن."},{"type":"exam","title":"دو شاهد بر ذره‌ای بودن ماده بنویسید و یکی را توضیح دهید.","body":"پاسخ:\nشاهدها: پخش بوی عطر در اتاق، حل شدن قند در آب و پخش رنگ در آب.\nتوضیح حل شدن قند: قند از ذره‌های ریز ساخته شده است؛ در آب ذره‌های قند جدا شده و بین ذره‌های آب جای می‌گیرند، به‌طوری که قند ناپدید می‌شود اما شیرینی در همه آب پخش می‌شود.\nنکته برای نمره کامل: برای هر شاهد یک توضیح کوتاه بنویس."}]}]},{"title":"فارسی هشتم","subject":"فارسی","description":"ادبیات، واژه‌آموزی و دانش‌های زبانی","color":"purple","icon":"book","chapters":[{"number":1,"title":"جمال و کمال","pages":"۱۲ تا ۱۷","contents":[{"type":"answer","title":"مس‌مقدم چه کسی بود و دو ویژگی اخلاقی او را بنویسید.","body":"مس‌مقدم مردی ساده‌زی از اهالی اصفهان بود که در خانه‌ای محقر زندگی می‌کرد.\nویژگی اول: سخاوت و مهمان‌نوازی؛ با اینکه فقیر بود، مهمان را گرامی می‌داشت.\nویژگی دوم: خوش‌خلقی و قناعت؛ همیشه شاد بود و به اندازه توانش به دیگران کمک می‌کرد.\nاو نشان داد که ارزش انسان به اخلاق است نه به ثروت.","pageRef":"صفحه ۱۲"},{"type":"answer","title":"پیام اصلی درس جمال و کمال چیست؟","body":"در این داستان، جمال به زیبایی ظاهر و کمال به زیبایی درون و اخلاق اشاره دارد.\nنویسنده نشان می‌دهد که فقر و خانه محقر، مانع بزرگواری و سخاوت نیست.\nانسان با رفتار نیک، مهمان‌نوازی و خوش‌قلقی شناخته می‌شود نه با ثروت و ظاهر.\nپیام درس: بزرگواری و کمالِ واقعی انسان در درون اوست.","pageRef":"صفحه ۱۵"},{"type":"note","title":"واژه‌آموزی درس جمال و کمال","body":"سخاوت یعنی بخشندگی و جوانمردی؛ متضاد آن بخل است.\nقناعت یعنی رضایت به اندازه‌ای که دارد؛ با صرفه‌جویی هم‌معنی نیست.\nمهمان‌نوازی از نشانه‌های بزرگ‌منشی است و در ادبیات فارسی، مهمان برکت خانه شمرده می‌شود."},{"type":"note","title":"معرفی شخصیت داستان","body":"برای معرفی شخصیت، به گفتار، رفتار و ظاهر او در متن توجه کن.\nدر این درس، مس‌مقدم با توصیف ظاهر، خانه و رفتار با مهمان معرفی می‌شود.\nخطای رایج: نام بردن از شخصیت کافی نیست؛ در پاسخ، ویژگی اخلاقی او را هم بنویس."},{"type":"exam","title":"داستان جمال و کمال را در سه یا چهار سطر خلاصه کنید.","body":"پاسخ نمونه:\nراوی در سفر به اصفهان با مردی ساده‌زی به نام مس‌مقدم آشنا می‌شود.\nاو با اینکه در خانه‌ای محقر و با درآمدی کم زندگی می‌کند، بسیار سخاوتمند و مهمان‌نواز است.\nمس‌مقدم با خوش‌خلقی نشان می‌دهد که فقر با بزرگواری منافاتی ندارد.\nنکته برای نمره کامل: در خلاصه، ماجرا، شخصیت اصلی و پیام داستان را بدون جزئیات اضافه بنویس."},{"type":"exam","title":"چرا نویسنده عنوان جمال و کمال را برای این داستان برگزیده است؟","body":"پاسخ:\nجمال به زیبایی ظاهری و کمال به زیبایی درونی و اخلاقی اشاره دارد.\nخانه و ظاهر مس‌مقدم جمال چشمگیری ندارد، اما رفتار او سرشار از کمال است.\nبا انتخاب این عنوان، برتری کمال بر جمال روشن می‌شود.\nنکته برای نمره کامل: به تضاد میان ظاهر ساده و درون بزرگ‌وار شخصیت اشاره کن."}]},{"number":2,"title":"در سایه‌سار نخل ولایت","pages":"۱۸ تا ۲۵","contents":[{"type":"answer","title":"شعر در سایه‌سار نخل ولایت درباره کدام شخصیت است و چه ویژگی‌هایی از او ستوده شده است؟","body":"شعر درباره امام علی (ع) است؛ نخل ولایت کنایه از ایشان است که س
