رپرست و پناه مردم شمرده می‌شود.\nشاعر شجاعت و جوانمردی ایشان در میدان نبرد را ستایش می‌کند.\nبخشندگی و انفاق مخفیانه و نیز عدالت‌ورزی از ویژگی‌های ستوده‌شده است.\nساده‌زیستی و ایثار نیز در شعر برجسته شده است.","pageRef":"صفحه ۱۸"},{"type":"answer","title":"منظور از عنوان سایه‌سار نخل ولایت چیست؟ توضیح دهید.","body":"نخل درختی سایه‌گستر است که در بیابان پناه می‌دهد؛ پس نخل ولایت استعاره از امام علی (ع) است.\nسایه‌سار یعنی سایه‌بان و پناهگاه؛ مردم در پناه عدالت و رهبری ایشان آرامش دارند.\nاین تصویر، نقش حضرت را در سرپرستی و حمایت از مردم نشان می‌دهد.\nپس عنوان شعر یعنی امام علی (ع) پناهگاه و رهبر ولایت‌مداران است.","pageRef":"صفحه ۱۹"},{"type":"note","title":"واژه‌آموزی درس شعر","body":"ولایت یعنی سرپرستی، دوستی و رهبری؛ سایه‌سار یعنی سایه‌بان و پناهگاه.\nسخاوت و جود هم‌معنی بخشش و انفاق هستند و متضاد آن‌ها بخل است.\nعدل یعنی عدالت و انصاف؛ متضاد آن جور و ستم است."},{"type":"note","title":"قافیه و ردیف","body":"واژه‌های هم‌آهنگ در پایان مصرع‌ها قافیه نامیده می‌شوند.\nواژه‌ای که پس از قافیه و به‌صورت تکراری می‌آید، ردیف است.\nمثال ساده: در واژه‌های دریا و دنیا، بخش یا هم‌آهنگ است.\nموسیقی شعر این درس نیز با قافیه و ردیف ساخته شده است."},{"type":"exam","title":"دو ویژگی اخلاقی امام علی (ع) که در این شعر ستوده شده است را با توضیح بنویسید.","body":"پاسخ:\nبخشندگی: ایشان انگشتر خود را به نیازمند بخشید و انفاق خود را مخفیانه انجام می‌داد.\nعدالت: در داوری و حکومت، حق همه افراد حتی غیرمسلمانان را رعایت می‌کرد.\nنکته برای نمره کامل: برای هر ویژگی یک مثال یا توضیح کوتاه بیاور."},{"type":"exam","title":"ارکان تشبیه را نام ببرید و با یک مثال ساده نشان دهید.","body":"پاسخ:\nارکان تشبیه چهار مورد است: مشبه، مشبه‌به، ادات تشبیه و وجه شبه.\nمثال: علی مانند شیر است؛ علی مشبه، شیر مشبه‌به، مانند ادات تشبیه و شجاعت وجه شبه است.\nنکته برای نمره کامل: ابتدا ارکان را به ترتیب بنویس و سپس مثال بزن."}]},{"number":4,"title":"سنگ صبور","pages":"۳۴ تا ۴۱","contents":[{"type":"answer","title":"شخصیت اصلی داستان سنگ صبور چه کسی است و در چه شرایطی زندگی می‌کند؟","body":"شخصیت اصلی داستان ابراهیم نام دارد؛ معلمی در یک روستا است.\nزندگی او ساده و فقیرانه است و در اتاقی کوچک با امکانات اندک زندگی می‌کند.\nهمسرش بیمار است و این نگرانی، خواب را از چشمان او می‌رباید.\nبا وجود همه سختی‌ها، به شغل معلمی و مسئولیت خود وفادار است.","pageRef":"صفحه ۳۴"},{"type":"answer","title":"چرا این داستان سنگ صبور نامیده شده است؟","body":"سنگ صبور کنایه از کسی است که درد و سختی فراوان را با صبر تحمل می‌کند.\nابراهیم مانند سنگ صبور، فقر و بیماری همسر و شب‌های بی‌خوابی را شکیبا تحمل می‌کند.\nاو گله و شکایت نمی‌کند و به زندگی ادامه می‌دهد.\nبه همین دلیل این عنوان بهترین توصیف حال اوست.","pageRef":"صفحه ۳۶"},{"type":"note","title":"واژه‌آموزی درس سنگ صبور","body":"چونان یعنی مانند و همچون؛ ناگزیر یعنی اجتناب‌ناپذیر.\nبی‌تاب یعنی بی‌قرار و آشفته؛ هم‌معنی آن ناآرام است.\nسختی و آسایش، فقر و غنا از واژه‌های متضاد این درس هستند."},{"type":"note","title":"شخصیت اصلی و شخصیت فرعی","body":"شخصیت اصلی، محور رخدادهای داستان است و بیشتر متن درباره اوست؛ مانند ابراهیم در این درس.\nشخصیت فرعی نقش مکمل دارد و کمتر در داستان حضور پیدا می‌کند؛ مانند همسر و همکار ابراهیم.\nخطای رایج: هر شخصیتی که در داستان نام برده می‌شود، اصلی نیست."},{"type":"exam","title":"حال و هوای حاکم بر داستان سنگ صبور را توصیف کنید.","body":"پاسخ نمونه:\nفضای داستان اندوهگین و سنگین است؛ شب‌های طولانی، سکوت و فقر بر آن سایه انداخته است.\nنگرانی ابراهیم برای همسر بیمار و بی‌خوابی و خستگی، این حال را تشدید می‌کند.\nبا این حال، صبر و امید در رفتار ابراهیم دیده می‌شود.\nنکته برای نمره کامل: از واژه‌های مناسب مانند سکوت، تاریکی و اندوه برای توصیف فضا استفاده کن."},{"type":"exam","title":"از زبان ابراهیم سه سطر درباره درد و سختی‌های زندگی‌اش بنویسید.","body":"پاسخ نمونه:\nشب باز هم گذشت و من تا بامداد بیدار ماندم؛ درد در وجودم چونان سنگی نشسته است.\nهمسرم بیمار است و دستم برای درمان او تهی است؛ اما باید صبور باشم.\nفردا باز در کلاس، شاد و پرانرژی درس می‌دهم؛ زیرا من معلمم.\nنکته برای نمره کامل: از واژه‌های خود درس مانند چونان و صبور در نوشته استفاده کن."}]}]},{"title":"مطالعات اجتماعی هشتم","subject":"مطالعات اجتماعی","description":"تعاون، ایران و همسایگان، تاریخ و مدنی","color":"orange","icon":"globe","chapters":[{"number":1,"title":"زمین، مسکن ما","pages":"۸ تا ۱۸","contents":[{"type":"answer","title":"حرکت وضعی زمین چیست و چه پیامدهایی دارد؟","body":"زمین مانند فرفره به دور محور فرضی خود می‌چرخد؛ به این حرکت، حرکت وضعی می‌گویند.\nچرخش زمین از غرب به شرق است و حدود ۲۴ ساعت طول می‌کشد.\nمهم‌ترین پیامد آن پیدایش شب و روز است؛ هر زمان نیمی از زمین رو به خورشید و نیم دیگر در تاریکی است.\nاختلاف ساعت میان شهرهای مختلف جهان نیز از همین حرکت ناشی می‌شود.","pageRef":"صفحه ۸"},{"type":"answer","title":"حرکت انتقالی زمین چیست و چه پیامدهایی دارد؟","body":"زمین علاوه بر چرخش به دور خود، در مداری به دور خورشید می‌گردد؛ به این حرکت، حرکت انتقالی می‌گویند.\nیک دور کامل آن حدود ۳۶۵ روز و ۶ ساعت طول می‌کشد که یک سال شمرده می‌شود.\nمهم‌ترین پیامد آن پیدایش چهار فصل است؛ زیرا محور زمین کج است.\nتغییر طول شب و روز در طول سال نیز از پیامدهای آن است.","pageRef":"صفحه ۱۰"},{"type":"note","title":"مقایسه دو حرکت زمین","body":"حرکت وضعی: چرخش زمین به دور محور خود؛ مدت حدود ۲۴ ساعت؛ پیامد: شب و روز و اختلاف ساعت.\nحرکت انتقالی: گردش زمین به دور خورشید؛ مدت ۳۶۵ روز و ۶ ساعت؛ پیامد: پیدایش فصل‌ها.\nهر دو حرکت از غرب به شرق انجام می‌شوند."},{"type":"note","title":"زمین، مسکن زیبای ما","body":"زمین تنها سیاره شناخته‌شده‌ای است که آب مایع و هوای مناسب برای زندگی دارد.\nاز فضا زمین آبی‌رنگ دیده می‌شود، زیرا حدود ۷۰ درصد سطح آن را آب پوشانده است.\nخطای رایج: خورشید به دور زمین نمی‌گردد؛ بلکه زمین به دور خورشید می‌گردد."},{"type":"exam","title":"دو پیامد حرکت انتقالی زمین را نام ببرید و یکی را توضیح دهید.","body":"پاسخ:\nپیامدها: پیدایش فصل‌های سال و تغییر طول شب و روز در طول سال.\nتوضیح پیدایش فصل‌ها: محور زمین کج است؛ هنگام گردش به دور خورشید، گاهی نیمکره شمالی و گاهی نیمکره جنوبی بیشتر رو به خورشید قرار می‌گیرد؛ در نتیجه تابش خورشید و دما تغییر می‌کند و فصل‌ها پدید می‌آیند.\nنکته برای نمره کامل: بدون اشاره به کج بودن محور زمین، پاسخ کامل نیست."},{"type":"exam","title":"اگر زمین حرکت وضعی نداشت، چه تغییری در زندگی ما پیش می‌آمد؟","body":"پاسخ:\nیک نیمه زمین همیشه رو به خورشید می‌ماند و همیشه روز و نیمه دیگر همیشه شب بود.\nشب و روز و اختلاف ساعت میان نقاط مختلف زمین به وجود نمی‌آمد.\nزندگی جاندارانی که به چرخه شب و روز وابسته‌اند دگرگون می‌شد.\nنکته برای نمره کامل: پیامدها را مرتب و جدا از هم بنویس."}]},{"number":7,"title":"ایران و سرزمین‌های همسایه","pages":"۶۶ تا ۷۶","contents":[{"type":"answer","title":"همسایگان خاکی و آبی ایران را با جهت هر یک نام ببرید.","body":"در شمال: ترکمنستان، جمهوری آذربایجان و ارمنستان و نیز دریای خزر.\nدر غرب: ترکیه و عراق.\nدر شرق: افغانستان و پاکستان.\nدر جنوب: خلیج فارس و دریای عمان و کشورهای حاشیه خلیج فارس مانند عراق، کویت، عربستان، قطر، بحرین، امارات و عمان.","pageRef":"صفحه ۶۶"},{"type":"answer","title":"اهمیت خلیج فارس برای ایران چیست؟","body":"خلیج فارس یکی از بزرگ‌ترین ذخایر نفت و گاز جهان را در خود و حاشیه خود جای داده است.\nبخش عمده صادرات و واردات ایران از طریق این پهنه آبی انجام می‌شود.\nاین خلیج، راه اتصال ایران به آب‌های آزاد جهان از طریق تنگه هرمز و دریای عمان است.\nبه همین دلیل خلیج فارس از نظر اقتصادی و سیاسی برای ایران اهمیت راهبردی دارد.","pageRef":"صفحه ۷۰"},{"type":"note","title":"دریای خزر","body":"دریای خزر با نام دیگر دریای مازندران، بزرگ‌ترین دریاچه جهان است و به اقیانوس راه ندارد.\nایران یکی از پنج کشور حاشیه خزر است و در جنوب این دریا جای دارد.\nنفت و گاز و خاویار از منابع مهم این دریا به شمار می‌روند."},{"type":"note","title":"میراث فرهنگی و گردشگری","body":"آثار تاریخی ایران مانند تخت جمشید، چغازنبیل، میدان نقش جهان و ارگ بم در فهرست میراث جهانی یونسکو ثبت شده‌اند.\nجذابیت‌های تاریخی و طبیعی ایران، گردشگران بسیاری را به کشور ما می‌کشاند.\nگردشگری به درآمدزایی و گسترش روابط فرهنگی ایران با دیگر کشورها کمک می‌کند."},{"type":"exam","title":"چرا شناخت کشورهای همسایه برای ایران اهمیت دارد؟","body":"پاسخ:\nهمسایگان در تجارت، فرهنگ، امنیت مرزها و منابع مشترک با ایران ارتباط دارند.\nشناخت آن‌ها به گسترش روابط اقتصادی، صادرات و واردات و همکاری‌های منطقه‌ای کمک می‌کند.\nآگاهی از تحولات کشورهای همسایه، حفظ منافع و امنیت ملی ایران را آسان‌تر می‌کند.\nنکته برای نمره کامل: پاسخ را در سه محور اقتصادی، فرهنگی و امنیتی منظم بنویس."},{"type":"exam","title":"دو اثر تاریخی ایران که در فهرست میراث جهانی ثبت شده‌اند را نام ببرید و یکی را معرفی کنید.","body":"پاسخ:\nنمونه‌ها: تخت جمشید، چغازنبیل، میدان نقش جهان اصفهان و ارگ بم.\nمعرفی تخت جمشید: پایتخت آیینی هخامنشیان در نزدیکی شیراز است؛ داریوش بزرگ آن را با ستون‌های بلند و پله‌های باشکوه ساخت و نشانه شکوه تمدن ایران باستان است.\nنکته برای نمره کامل: معرفی هر اثر را با محل آن و یک ویژگی معماری یا تاریخی کامل کن."}]},{"number":13,"title":"انقلاب اسلامی ایران","pages":"۱۱۲ تا ۱۲۰","contents":[{"type":"answer","title":"ریشه‌ها و عوامل پیدایش انقلاب اسلامی ایران را بنویسید.","body":"استبداد و خفقان رژیم پهلوی: نبود آزادی بیان و سرکوب مخالفان با ساواک.\nوابستگی شدید رژیم به بیگانگان، به‌ویژه امریکا، و دخالت آن‌ها در امور کشور.\nفقر، تبعیض و شکاف طبقاتی میان مردم.\nرهبری امام خمینی (ره) و آگاهی و حضور مردم، انقلاب را ریشه‌دار و پیروزمند کرد.","pageRef":"صفحه ۱۱۲"},{"type":"answer","title":"۲۲ بهمن ۱۳۵۷ چه روزی است و در آن روز چه رخدادی رخ داد؟","body":"۲۲ بهمن ۱۳۵۷ روز پیروزی انقلاب اسلامی ایران است.\nدر این روز با قیام مردم و پیوستن گروهی از نیروهای نظامی به انقلاب، پایگاه‌های رژیم پهلوی تصرف شد.\nحکومت وابسته شاه سقوط کرد و اداره کشور به دست انقلابیون افتاد.\nاین روز در تقویم رسمی به نام روز پیروزی انقلاب اسلامی ثبت شده است.","pageRef":"صفحه ۱۱۸"},{"type":"note","title":"تاریخ‌های مهم انقلاب اسلامی","body":"۱۵ خرداد ۱۳۴۲: نخستین قیام جدی مردم به رهبری امام خمینی (ره) علیه رژیم پهلوی.\n۱۲ بهمن ۱۳۵۷: بازگشت امام خمینی (ره) از تبعید به ایران.\n۲۲ بهمن ۱۳۵۷: پیروزی انقلاب اسلامی و سقوط رژیم شاه.\n۱۲ فروردین ۱۳۵۸: اعلام رسمی جمهوری اسلامی با رأی حدود ۹۸ درصد مردم در همه‌پرسی."},{"type":"note","title":"همه‌پرسی ۱۲ فروردین ۱۳۵۸","body":"چند روز پس از پیروزی انقلاب، نوع حکومت جدید با رأی مردم در همه‌پرسی تعیین شد.\nحدود ۹۸ درصد شرکت‌کنندگان به جمهوری اسلامی رأی آری دادند.\nخطای رایج: تاریخ پیروزی انقلاب یعنی ۲۲ بهمن ۵۷ را با تاریخ همه‌پرسی یعنی ۱۲ فروردین ۵۸ اشتباه نگیر."},{"type":"exam","title":"نقش امام خمینی (ره) در پیروزی انقلاب اسلامی را توضیح دهید.","body":"پاسخ:\nامام خمینی (ره) با افشای وابستگی و استبداد رژیم، مردم را بیدار و آگاه کرد.\nبا پیام‌ها و اعلامیه‌های خود، راه انقلاب را روشن و مردم را به ادامه مبارزه امیدوار نگه داشت.\nبازگشت ایشان از تبعید، روحیه مردم را قوی کرد و با تشکیل دولت موقت، مسیر سقوط رژیم کامل شد.\nنکته برای نمره کامل: پاسخ را در سه بخش بیدارگری، رهبری و سازماندهی بنویس."},{"type":"exam","title":"چرا مردم ایران خواهان سرنگونی رژیم پهلوی بودند؟ دو دلیل بنویسید و یکی را توضیح دهید.","body":"پاسخ:\nدلیل اول: استبداد و سرکوب؛ مردم از نبود آزادی بیان و فعالیت ساواک به تنگ آمده بودند.\nدلیل دوم: وابستگی رژیم به بیگانگان به‌ویژه امریکا و پایمال شدن استقلال کشور.\nتوضیح: فقر و تبعیض نیز شکاف میان مردم و حکومت را عمیق‌تر کرد و مردم به انقلاب روی آوردند.\nنکته برای نمره کامل: هر دلیل را با یک توضیح کوتاه همراه کن؛ فهرست خالی نمره کامل ندارد."}]}]},{"title":"عربی هشتم","subject":"عربی","description":"لغت و قواعد عربی با تمرین‌های کاربردی","color":"teal","icon":"languages","chapters":[{"number":1,"title":"اِستَمِعْ وَنَظُرْ","pages":"۱۰ تا ۲۲","contents":[{"type":"answer","title":"معنی عبارت «اِستَمِعْ إلی الْقُرآنِ» را به فارسی بنویسید.","body":"اِستَمِعْ إلی الْقُرآنِ یعنی «به قرآن گوش کن».\nاِستَمِعْ فعل امر مفرد مخاطب از ماده «سَمِعَ» به معنی شنیدن است.\n«إلی» حرف جر به معنی «به و سوی» است و اسم بعد از خود را مجرور می‌کند: إلی الْقُرآنِ.\nپس ترجمه کامل عبارت می‌شود: «به قرآن گوش کن».","pageRef":"صفحه ۱۲"},{"type":"answer","title":"صیغه‌های امر فعل «جَلَسَ» (نشست) را در سه صیغه مخاطب بنویسید و ترجمه کنید.","body":"اِجْلِسْ (مفرد مذکر مخاطب): بنشین!\nاِجْلِسي (مفرد مؤنث مخاطب): بنشین! (خطاب به دختر یا زن)\nاِجْلِسا (مثنای مخاطب): بنشینید! (خطاب به دو نفر)\nروش ساخت: اول مضارع را می‌نویسیم: تَجْلِسُ؛ سپس علامت مضارعه (تـ) را حذف می‌کنیم و حرف لایه «اِ» را به ابتدای فعل اضافه می‌کنیم.","pageRef":"صفحه ۱۴"},{"type":"note","title":"ساختن فعل امر مخاطب در سه قدم","body":"قدم اول: مضارع فعل را بنویسیم: تَكْتُبُ.\nقدم دوم: علامت مضارعه (تـ) را حذف کنیم: كْتُبُ.\nقدم سوم: حرف لایه را با حرکتی متناسب با حرف دوم فعل اضافه کنیم؛ حرف دومِ مضارعِ «كْتُبُ» مضموم است، پس اُكْتُبْ (بنویس) ساخته می‌شود.\nاگر حرف دوم مضارع مكسور یا مفتوح باشد، حرف لایه کسره می‌گیرد: تَجْلِسُ ← اِجْلِسْ (بنشین)."},{"type":"note","title":"واژه‌های کلیدی درس اول","body":"اِستَمِعْ = بشنو، اُنْظُرْ = بنگر، اِلْعَبْ = بازی کن، اِسْأَلْ = بپرس.\nاُكْتُبْ = بنویس، اِقْرَأْ = بخوان، اِجْلِسْ = بنشین، كَلِّمْ = سخن بگو.\nهمه این واژه‌ها فعل امر مفرد مخاطب‌اند و برای دادن دستور به کار می‌روند."},{"type":"exam","title":"ترجمه عبارت «يَا سَامِي، اُنْظُرْ إلی السَّماءِ وَاِسْتَمِعْ إلی الْمُعَلِّمِ» را بنویسید.","body":"پاسخ: «ای سامي، به آسمان بنگر و به معلم گوش کن».\n«اُنْظُرْ» و «اِسْتَمِعْ» دو فعل امر مخاطب‌اند و «إلی» حرف جر است.\nتوصیه: افعال امر را در ترجمه با صیغه امری فارسی (بنگر، بشنو) برگردانید تا دستور بودن جمله حفظ شود."},{"type":"exam","title":"در عبارت «اِقْرَأِ الْكِتابَ» فعل امر را مشخص کنید و روش ساخت آن را توضیح دهید.","body":"پاسخ: «اِقْرَأْ» فعل امر مفرد مخاطب به معنی «بخوان» است.\nروش ساخت: مضارع آن «تَقْرَأُ» است؛ علامت مضارعه «تـ» حذف می‌شود و چون آغاز فعل ساکن می‌شود، حرف لایه «اِ» اضافه می‌گردد.\n«الْكِتابَ» مفعول است و به فتحه (علامت نصب) خوانده می‌شود.\nتوصیه: برای ساختن درست امر، همیشه اول فعل مضارع را بنویسید."}]},{"number":2,"title":"اِعْرِفْ نَفْسَكَ","pages":"۲۴ تا ۳۶","contents":[{"type":"answer","title":"متنی کوتاه عربی برای معرفی خودتان بنویسید (اسم، سن، محل زندگی و علاقه) و ترجمه کنید.","body":"نمونه متن:\nأَنَا مُحَمَّدٌ. عُمْرِي اِثْنا عَشَرَ سَنَةً. أَسْكُنُ فِي طِهرانَ مَعَ أُسْرَتِي. أَدْرُسُ فِي الْمَدْرَسَةِ. أُحِبُّ قِرَاءَةَ الْكُتُبِ وَلَعِبَ كُرَةِ الْقَدَمِ.\nترجمه: من محمد هستم. سنم دوازده سال است. در تهران با خانواده‌ام زندگی می‌کنم. در مدرسه درس می‌خوانم. کتاب‌خواندن و فوتبال‌بازی کردن را دوست دارم.","pageRef":"صفحه ۲۶"},{"type":"answer","title":"ضمائر منفصل (ضمیرهای جدا) عربی را همراه با ترجمه فارسی بنویسید.","body":"متکلم (گفتارگر): أَنَا (من)، نَحْنُ (ما).\nمخاطب (شنوندگر): أَنْتَ (تو، مذکر)، أَنْتِ (تو، مؤنث)، أَنْتُمْ (شما).\nغایب (پنهانگر): هُوَ (او، مذکر)، هِيَ (او، مؤنث)، هُمْ (آنها).\nضمائر منفصل همیشه مرفوع‌اند و در جمله نقش مبتدا یا خبر دارند.","pageRef":"صفحه ۲۸"},{"type":"note","title":"ضمیر منفصل چیست؟","body":"ضمیر منفصل واژه‌ای است که به تنهایی می‌آید و جای اسم می‌نشیند؛ مانند أَنَا، هُوَ، هُمْ.\nاین ضمائر همیشه مرفوع‌اند؛ یعنی می‌توانند مبتدا یا خبرِ جمله اسمیه باشند.\nمثال: أَنَا طَالِبٌ (من دانش‌آموز هستم)، هُوَ مُعَلِّمٌ (او معلم است).\nدر ترجمه، ضمیر عربی به ضمیر فارسی همان شخص برگردانده می‌شود."},{"type":"note","title":"تنوین؛ نشانه اسم نکره","body":"در عربی، اسم نکره (ناشناس) با تنوین مشخص می‌شود: طَالِبٌ، بَيْتٌ، مَدْرَسَةٌ.\nاسم معرفه (شناخته‌شده) تنوین ندارد: الْطَّالِبُ، مُحَمَّدٌ.\nتنوین ضم (ــٌ) رایج‌ترین نوع تنوین است و در حالت رفع شنیده می‌شود.\nدر ترجمه، اسم نکره با «یک» یا «حرف تعریف» ساخته می‌شود: بَيْتٌ = یک خانه."},{"type":"exam","title":"ترجمه کنید: «أَنَا إِيرَانِيٌّ وَأَسْكُنُ فِي مَدِينَةِ مَشْهَدَ».","body":"پاسخ: «من ایرانی هستم و در شهر مشهد زندگی می‌کنم».\n«أَنَا» ضمیر و مبتداست و «إِيرَانِيٌّ» خبر آن است؛ تنوین ضم نشان نکره بودن است.\n«أَسْكُنُ» فعل مضارع متکلم به معنی «زندگی می‌کنم» و «فِي» حرف جر است.\nتوصیه: در جمله اسمیه، کلمه «هستم» را از خبر بسازید، نه از ضمیر."},{"type":"exam","title":"در جمله «هُمَا صَدِيقَانِ مُجْتَهِدَانِ» ضمیر، خبر و صفت را مشخص کنید و جمله را ترجمه کنید.","body":"پاسخ: «هُمَا» ضمیر منفصل مرفوع (مثنای غایب) و مبتدای جمله است؛ «صَدِيقَانِ» خبر است و «مُجْتَهِدَانِ» صفت برای «صَدِيقَانِ».\nترجمه: «آنان دو دوست کوشا هستند».\nدر مثنی، علامت رفع «الف» و علامت نصب «یاء» است: صَدِيقَانِ (مرفوع) و صَدِيقَيْنِ (منصوب).\nتوصیه: قبل از ترجمه، نقش دستوری هر کلمه را پیدا کنید."}]},{"number":4,"title":"هَلْ أَنْتَ مُتَرْجِمٌ؟","pages":"۵۰ تا ۶۲","contents":[{"type":"answer","title":"ترجمه مکالمه «هَلْ أَنْتَ مُتَرْجِمٌ يَا سَمِير؟ نَعَمْ، أَنَا مُتَرْجِمٌ» را بنویسید.","body":"پاسخ: «آیا تو مترجم هستی ای سمير؟ بله، من مترجم هستم».\n«هَلْ» حرف استفهام است که جمله را به پرسش تبدیل می‌کند و پاسخ آن با «نَعَمْ» (بله) یا «لا» (نه) داده می‌شود.\n«أَنْتَ» ضمیر و مبتدا و «مُتَرْجِمٌ» خبر است؛ «مُتَرْجِمٌ» اسم فاعل از ماده «تَرْجَمَ» است.","pageRef":"صفحه ۵۲"},{"type":"answer","title":"ریشه و معنی واژه‌های «مُتَرْجِم» و «مُعَلِّم» را بنویسید.","body":"مُتَرْجِم: ریشه «ت ر ج م» از فعل «تَرْجَمَ» (ترجمه کرد)؛ اسم فاعل آن «مُتَرْجِم» به معنی مترجم است.\nمُعَلِّم: ریشه «ع ل م» از فعل «عَلَّمَ» (آموزش داد)؛ اسم فاعل آن «مُعَلِّم» به معنی معلم (آموزش‌دهنده) است.\nنکته: اسم فاعل بر کسی که کار را انجام می‌دهد دلالت دارد؛ پس مُعَلِّم کسی است که می‌آموزاند و مُتَرْجِم کسی است که ترجمه می‌کند.","pageRef":"صفحه ۵۵"},{"type":"note","title":"اسم فاعل چگونه ساخته می‌شود؟","body":"برای فعل سه‌حرفی ساده از صیغه «فَاعِل» استفاده می‌کنیم: نَصَرَ ← نَاصِر (یاری‌کننده)، كَتَبَ ← كَاتِب (نویسنده)، طَلَبَ ← طَالِب (خواهنده).\nبرای فعل‌های بیش از سه حرف، «مُـ» را به اول مضارع اضافه می‌کنیم: يَتَرْجَمُ ← مُتَرْجِم (مترجم)، يُعَلِّمُ ← مُعَلِّم (معلم).\nاسم فاعل بر انجام‌دهنده کار دلالت دارد."},{"type":"note","title":"حرف پرسش «هَلْ» و نفی با «لَيْسَ»","body":"«هَلْ» حرف پرسش است و پاسخ آن با «نَعَمْ» (بله) یا «لا» (نه) داده می‌شود.\nهَلْ أَنْتَ مُتَرْجِمٌ؟ ← نَعَمْ، أَنَا مُتَرْجِمٌ / لا، أَنَا لَسْتُ مُتَرْجِماً.\nبرای منفی کردن جمله اسمیه از فعل «لَيْسَ» استفاده می‌کنیم؛ بعد از ليس، خبر با فتحه می‌آید: مُتَرْجِماً."},{"type":"exam","title":"جمله «لَسْتُ مُتَرْجِماً» را ترجمه کنید و علت فتحه آخرِ «مُتَرْجِماً» را توضیح دهید.","body":"پاسخ: «من مترجم نیستم».\n«لَسْتُ» ماضیِ فعل «لَيْسَ» است که برای نفی جمله اسمیه به کار می‌رود؛ وقتی ليس در جمله بیاید، «مُتَرْجِم» از خبرِ مبتدا جدا می‌شود و خبرِ ليس قرار می‌گیرد و علامت آن فتحه است.\nتوصیه: بعد از ليس، آخر اسم را با فتحه بخوانید و بنویسید؛ این نکته در امتحان زیاد پرسیده می‌شود."},{"type":"exam","title":"معادل عربی کلمات «معلم، مترجم، دانش‌آموز» را همراه ریشه فعل هر کدام بنویسید.","body":"مُعَلِّم (معلم) از «عَلَّمَ» به معنی آموزش دادن؛ ریشه: ع ل م.\nمُتَرْجِم (مترجم) از «تَرْجَمَ» به معنی ترجمه کردن؛ ریشه: ت ر ج م.\nطَالِب (دانش‌آموز) از «طَلَبَ» به معنی خواستن؛ ریشه: ط ل ب.\nتوصیه: هر سه واژه اسم فاعل‌اند و بر انجام‌دهنده کار دلالت دارند؛ این نکته را در پاسخ بنویسید."}]}]},{"title":"زبان انگلیسی هشتم","subject":"انگلیسی","description":"English Book 8 - Learn, Practice, Communicate","color":"pink","icon":"message","chapters":[{"number":1,"title":"Lesson 1: My Nationality","pages":"۴ تا ۱۲","contents":[{"type":"answer","title":"ترجمه مکالمه زیر را بنویسید: «Where are you from? — I'm from Iran. I'm Iranian.»","body":"ترجمه: «اهل کجایی؟ — من اهل ایرانم. ایرانی هستم».\nWhere یعنی «کجا» و عبارت are you from یعنی «اهل کجا بودن».\nI'm شکل مخفف I am است.\nبرای سوم شخص: Where is he from? (او اهل کجاست؟) — He is from Turkey. (او اهل ترکیه است.)","pageRef":"صفحه ۶"},{"type":"answer","title":"نام کشور و ملیت‌های زیر را به فارسی بنویسید: «Iran, Iranian, Turkey, Turkish, Germany, German».","body":"Iran = ایران و Iranian = ایرانی (اهل ایران).\nTurkey = ترکیه و Turkish = ترکی (اهل ترکیه).\nGermany = آلمان و German = آلمانی (اهل آلمان).\nنکته: اسم کشور و صفت ملیت هر دو با حرف بزرگ نوشته می‌شوند؛ مانند Iran و Iranian.","pageRef":"صفحه ۷"},{"type":"note","title":"قاعده حرف بزرگ در نگارش","body":"اسم کشورها، ملیت‌ها، زبان‌ها و نام افراد همیشه با حرف بزرگ شروع می‌شوند: Iran, Iranian, Persian, Ali.\nکلمات عادی با حرف کوچک نوشته می‌شوند: boy, city, book.\nضمیر I همیشه با حرف بزرگ است: I am a student.\nرعایت این قاعده در نوشتن، نمره بخش نگارش را بالا می‌برد."},{"type":"note","title":"الگوی پرسش و پاسخ ملیت","body":"پرسش: Where are you from? (اهل کجایی؟)\nپاسخ: I'm from + نام کشور: I'm from Iran.\nمی‌توان ملیت را هم اضافه کرد: I'm Iranian.\nبرای دیگران: Where is she from? — She's from Italy. She's Italian.\nبرای he/she از is استفاده می‌کنیم، نه are."},{"type":"exam","title":"جاهای خالی مکالمه را کامل کنید: «Where are you ...? — I'm ... Iran. — What's your nationality? — I'm ... .»","body":"پاسخ: جای خالی اول: from (Where are you from?)؛ جای خالی دوم: from (I'm from Iran)؛ جای خالی سوم: یک ملیت مانند Iranian.\nتوضیح: بعد از from نام کشور می‌آید و بعد از I'm صفت ملیت می‌آید.\nتوصیه امتحانی: Where are you from? درباره کشور است و What's your nationality? درباره ملیت؛ این دو را با هم اشتباه نگیرید."},{"type":"exam","title":"جمله «She is from Germany. She speaks German.» را به فارسی ترجمه کنید.","body":"ترجمه: «او اهل آلمان است. او آلمانی صحبت می‌کند».\nShe is را می‌توان به شکل مخفف She's نوشت.\nفعل speak با he/she/it حرف s می‌گیرد: speaks.\nتوصیه: برای ترجمه، اول فاعل و فعل جمله را پیدا کنید و بعد معنی را روان برگردانید."}]},{"number":3,"title":"Lesson 3: My Abilities","pages":"۲۲ تا ۳۰","contents":[{"type":"answer","title":"با کلمه «can» سه جمله درباره توانایی خود بسازید: یک جمله مثبت، یک جمله منفی و یک جمله سوالی.","body":"مثبت: I can swim. (من می‌توانم شنا کنم.)\nمنفی: I can't play the piano. (من نمی‌توانم پیانو بنوازم.)\nسوالی: Can you ride a bicycle? (آیا می‌توانی دوچرخه‌سواری کنی؟)\nقاعده: بعد از can همیشه شکل ساده فعل می‌آید و can در هیچ شخصی تغییر نمی‌کند.","pageRef":"صفحه ۲۴"},{"type":"answer","title":"به سوال «Can you cook?» با جواب کوتاه مثبت و منفی پاسخ دهید و ترجمه کنید.","body":"جواب کوتاه مثبت: Yes, I can. (بله، می‌توانم.)\nجواب کوتاه منفی: No, I can't. (نه، نمی‌توانم.)\nدر جواب کوتاه، فعل اصلی تکرار نمی‌شود و فقط can یا can't می‌آید.\nبرای سوم شخص: Can he swim? — Yes, he can. / No, he can't.","pageRef":"صفحه ۲۶"},{"type":"note","title":"ساختار کلمه «can»","body":"مثبت: can + فعل ساده: I can read. (من می‌توانم بخوانم.)\nمنفی: can't یا cannot + فعل ساده: He can't run.\nسوالی: can + فاعل + فعل ساده: Can you dance?\nاشتباه رایج: نوشتن can to swim یا can swims؛ شکل درست فقط can swim است."},{"type":"note","title":"واژه‌های توانایی درس سوم","body":"swim = شنا کردن، ride a bike = دوچرخه‌سواری کردن، cook = آشپزی کردن.\ndraw = نقاشی کشیدن، play the guitar = گیتار نواختن، speak English = انگلیسی صحبت کردن.\nبا این واژه‌ها جمله بسازید: He can draw well. (او خوب نقاشی می‌کشد.)"},{"type":"exam","title":"جاهای خالی را با can یا can't پر کنید: «Birds ... fly, but fish ... fly. They ... swim.»","body":"پاسخ: Birds can fly, but fish can't fly. They can swim.\nترجمه: پرنده‌ها می‌توانند پرواز کنند، اما ماهی‌ها نمی‌توانند پرواز کنند. آنها می‌توانند شنا کنند.\nتوصیه امتحانی: قبل از پر کردن جاهای خالی، معنی جمله را در ذهن بسازید؛ دانستن موضوع، انتخاب can یا can't را ساده می‌کند."},{"type":"exam","title":"به سوال «Can your sister play tennis?» با جواب کوتاه مثبت و منفی پاسخ دهید.","body":"جواب مثبت: Yes, she can. / جواب منفی: No, she can't.\nدر جواب، به جای عبارت your sister از ضمیر she استفاده می‌کنیم.\nجواب کوتاه فقط از ضمیر + can یا can't ساخته می‌شود و فعل اصلی حذف می‌شود.\nتوصیه: در جواب‌های کوتاه هرگز فعل اصلی را تکرار نکنید."}]},{"number":6,"title":"Lesson 6: My Village","pages":"۴۴ تا ۵۲","contents":[{"type":"answer","title":"با «There is» و «There are» چهار جمله درباره روستا یا محل زندگی خود بنویسید.","body":"نمونه جمله‌ها:\nThere is a river in my village. (در روستای من یک رودخانه هست.)\nThere are many trees in my village. (در روستای من درخت‌های زیادی هستند.)\nThere isn't a hospital there. (آنجا بیمارستانی نیست.)\nThere are two schools in my village. (دو مدرسه در روستای من هستند.)\nقاعده: There is برای مفرد و There are برای جمع.","pageRef":"صفحه ۴۶"},{"type":"answer","title":"به سوال «Is there a library in your village?» با جواب کوتاه پاسخ دهید و شکل جمع سوال را هم بنویسید.","body":"جواب مثبت: Yes, there is. (بله، هست.)\nجواب منفی: No, there isn't. (نه، نیست.)\nشکل جمع سوال: Are there any shops? (آیا مغازه‌هایی هست؟) — Yes, there are. / No, there aren't.\nدر سوالی کردن، is یا are به اول جمله منتقل می‌شود: There is ... ← Is there ...?","pageRef":"صفحه ۴۸"},{"type":"note","title":"There is و There are","body":"There is برای یک چیز: There is a mosque. (یک مسجد هست.)\nThere are برای چند چیز: There are many houses. (خانه‌های زیادی هستند.)\nمنفی: There isn't و There aren't.\nبا اسم جمع معمولاً any یا some می‌آید: There aren't any buses. (هیچ اتوبوسی نیست.)"},{"type":"note","title":"واژه‌های درس ششم","body":"village = روستا، river = رودخانه، mountain = کوه، farm = مزرعه.\ngarden = باغ، animal = حیوان، path = مسیر، quiet = آرام، beautiful = زیبا.\nجمله نمونه: My village is small but beautiful. (روستای من کوچک اما زیباست.)"},{"type":"exam","title":"جمله «There are many tall trees near the river.» را به فارسی ترجمه کنید.","body":"ترجمه: «درخت‌های بلند زیادی نزدیک رودخانه هستند».\nThere are = هستند (برای جمع)، many = زیادی، tall = بلند، near = نزدیک.\nتوصیه: صفت‌هایی که در انگلیسی قبل از اسم آمده‌اند، در فارسی هم قبل از اسم ترجمه می‌شوند: tall trees = درخت‌های بلند."},{"type":"exam","title":"جمله‌ها را با There is یا There are کامل کنید: «... a lake in the village.» و «... any cars there.»","body":"پاسخ: There is a lake in the village. — There aren't any cars there.\nترجمه: در روستا یک دریاچه هست. — آنجا هیچ ماشین‌هایی نیست.\nچون lake مفرد است از There is و چون cars جمع است از There aren't استفاده می‌کنیم.\nتوصیه امتحانی: اول مفرد یا جمع بودنِ اسمِ بعد از فعل را پیدا کنید."}]}]},{"title":"پیام‌های آسمان هشتم","subject":"پیام‌های آسمان","description":"آموزش‌های قرآنی و پیام‌های تربیتی","color":"amber","icon":"sparkles","chapters":[{"number":1,"title":"نیکی به دیگران","pages":"۶ تا ۱۴","contents":[{"type":"answer","title":"چرا نیکی به دیگران از کارهای پسندیده نزد خداوند است؟ با اشاره به یک حدیث پاسخ دهید.","body":"پاسخ: نیکی به دیگران نشانه ایمان قلبی است و خداوند نیکوکاران را دوست دارد؛ قرآن می‌فرماید: «إِنَّ اللهَ يُحِبُّ الْمُحْسِنِينَ» (همانا خدا نیکوکاران را دوست دارد).\nپیامبر اکرم (ص) فرمودند: «أَحَبُّ النَّاسِ إِلَى اللهِ أَنْفَعُهُم لِلنَّاس» یعنی محبوب‌ترین مردم نزد خدا، سودمندترین آنان برای مردم است.\nنیکی کردن هم به فرد کمک می‌کند و هم محبت و پیوند اجتماعی را در جامعه تقویت می‌کند.","pageRef":"صفحه ۸"},{"type":"answer","title":"دو راهکار عملی برای نیکی به دیگران در محیط مدرسه بنویسید.","body":"۱. کمک در درس: به هم‌کلاسی‌هایی که در بعضی دروس ضعیف‌تر هستند کمک کنیم تا عقب نمانند؛ این کار هم پاداش الهی دارد و هم دوستی‌ها را زیاد می‌کند.\n۲. خوش‌رفتاری و شادی‌رسانی: با سلام و لبخند و احترام به دانش‌آموزان کوچک‌تر، روحیه دیگران را بالا ببریم؛ پیامبر (ص) فرمودند لبخند تو در برابر برادرت صدقه است.\nمهم این است که نیکی با نیت جلب رضایت خدا انجام شود."},{"type":"note","title":"احسان یعنی چه؟","body":"احسان یعنی خوبی و نیکی کردن به دیگران، حتی بیشتر از انتظار آنان.\nاحسان دو جنبه دارد: نیکی به خدا (عبادت خالصانه) و نیکی به بندگان (کمک، خدمت و مهربانی).\nقرآن: «إِنَّ اللهَ يُحِبُّ الْمُحْسِنِينَ» = خداوند نیکوکاران را دوست دارد."},{"type":"note","title":"راه‌های ساده نیکی به دیگران","body":"کمک به نیازمندان، خوش‌برخوردی با پدر و مادر و معلمان، بخشیدن خطای دیگران و راهنمایی کسی که راهش را گم کرده.\nحتی سلام کردن و لبخند زدن هم نوعی نیکی است.\nخداوند پاداش نیکی را هم در دنیا (آرامش و دوستی مردم) و هم در آخرت (ثواب) می‌دهد."},{"type":"exam","title":"حدیث «أَحَبُّ النَّاسِ إِلَى اللهِ أَنْفَعُهُم لِلنَّاس» را ترجمه و توضیح دهید.","body":"ترجمه: «محبوب‌ترین مردم نزد خداوند، سودمندترین آنها برای مردم است».\nتوضیح: ارزش انسان نزد خدا به میزان فایده رساندن او به دیگران است؛ نه به ثروت یا مقام.\nتوصیه امتحانی: در سوالات حدیث، اول ترجمه دقیق را بنویسید و بعد پیام حدیث را در یک جمله بیان کنید."},{"type":"exam","title":"آیا نیکی به دیگران فقط کمک مالی است؟ توضیح دهید.","body":"پاسخ: خیر. نیکی شکل‌های گوناگونی دارد: کمک مالی، کمک علمی (آموزش دادن)، خدمت جسمی، گفتار نیکو، رفتار محترمانه و حتی دعا برای دیگران.\nهر خوبی که به دیگری سود برساند نیکی است؛ پس هر کس بسته به توان خود می‌تواند نیکوکار باشد.\nتوصیه: در پاسخ‌های تشریحی، چند نمونه مختلف بزنید تا پاسخ کامل شود."}]},{"number":4,"title":"راستگویی","pages":"۳۰ تا ۳۸","contents":[{"type":"answer","title":"چرا راستی از مهم‌ترین صفات انسان مؤمن است؟","body":"پاسخ: راستی زیربنای اعتماد اجتماعی است؛ وقتی سخن انسان راست باشد، مردم به او اعتماد می‌کنند و کارهایش پیش می‌رود.\nقرآن مؤمنان را به همراهی با راستگویان فرمان می‌دهد: «وَكُونُوا مَعَ الصَّادِقِينَ».\nراستگو هم نزد خدا محبوب است و هم در میان مردم آبرو و شخصیت دارد؛ به همین دلیل راستی نشانه ایمان قلبی شمرده می‌شود.","pageRef":"صفحه ۳۲"},{"type":"answer","title":"آیا گفتن حقیقت همیشه لازم است یا در مواردی می‌توان از آن گذشت؟","body":"پاسخ: راستی اصل است، اما اگر گفتن حقیقت باعث ضرر جانی یا نابودی آبروی یک انسان شود، باید از گفتن آن خودداری کرد؛ زیرا حفظ آبروی مؤمن واجب است.\nدر موارد بسیار محدودی (مانند نجات جان یک انسان از خطر)، پنهان کردن حقیقت با اجازه کارشناسان دینی جایز شمرده شده است.\nاما این استثنا بسیار کم است و نمی‌توان به بهانه مصلحت، عادت به دروغ کرد."},{"type":"note","title":"آثار دروغ‌گویی","body":"۱. از بین رفتن اعتماد مردم؛ دیگر سخنان درست دروغگو هم باور نمی‌شود.\n۲. کوچک شدن آبرو و شخصیت دروغگو نزد خانواده و دوستان.\n۳. دوری قلب از خداوند و از دست رفتن آرامش.\nبرای همین تا می‌توانیم از همه شکل‌های دروغ (حتی دروغ شوخی و شایعه) پرهیز کنیم."},{"type":"note","title":"راستگویی در قرآن","body":"قرآن می‌فرماید: «يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللهَ وَكُونُوا مَعَ الصَّادِقِينَ» (ای کسانی که ایمان آورده‌اید، از خدا پروا کنید و با راستگویان باشید).\nراه‌های تقویت راستی: کم‌گویی، فکر کردن قبل از سخن گفتن و پرهیز از نقل شایعه.\nهمراهی با دوستان صادق، انسان را به راستگویی عادت می‌دهد."},{"type":"exam","title":"آیه «وَكُونُوا مَعَ الصَّادِقِينَ» را ترجمه کنید و پیام آن را بنویسید.","body":"ترجمه: «و با راستگویان باشید» (بخشی از آیه ۱۱۹ سوره توبه).\nپیام: خداوند انسان‌ها را به راستگویی و همراهی با افراد صادق دعوت می‌کند؛ دوستان صادق انسان را به سوی نیکی می‌برند.\nتوصیه امتحانی: در ترجمه آیه، نام سوره یا شماره آیه را هم بنویسید تا پاسخ کامل شود."},{"type":"exam","title":"دو نتیجه ناخوشایند دروغ‌گویی را نام ببرید و توضیح دهید.","body":"۱. بی‌اعتمادی: اگر کسی حتی یک بار دروغ بگوید، دیگران سخنان درست او را هم باور نمی‌کنند؛ مانند داستان معروف چوپان دروغگو.\n۲. آسیب آبرو: دروغگو نزد خانواده و دوستان کوچک می‌شود و شخصیت اجتماعی خود را از دست می‌دهد.\nتوصیه: در سوالاتی که تعداد مشخص می‌کنند (مثل دو مورد)، هر مورد را در یک خط جداگانه با توضیح بنویسید."}]},{"number":11,"title":"پیوند مقدس","pages":"۸۲ تا ۹۰","contents":[{"type":"answer","title":"چرا ازدواج در آموزه‌های دینی «پیوند مقدس» نامیده می‌شود؟","body":"پاسخ: زیرا ازدواج بر پایه رضایت، محبت و دلسوزی شکل می‌گیرد و محیط خانواده را می‌سازد؛ قرآن می‌فرماید خداوند میان زن و شوهر «مودّت و رحمت» قرار داده است.\nدر این پیوند، زن و مرد به یکدیگر آرامش می‌دهند و فرزندان در سایه محبت رشد می‌کنند.\nخداوند برای این پیوند آداب، حقوق و مرزهایی قرار داده است؛ به همین دلیل مقدس و ارزشمند شمرده می‌شود.","pageRef":"صفحه ۸۴"},{"type":"answer","title":"دو وظیفه اعضای خانواده در قبال یکدیگر را بنویسید.","body":"۱. احترام و نیکی به پدر و مادر: فرزندان باید با والدین خود با ادب رفتار کنند، از زحمات آنان قدردانی کنند و در سنین بالاتر هم از آنان مراقبت کنند.\n۲. همدلی و مشورت: اعضای خانواده در کارهای خانه کمک می‌کنند، در تصمیم‌های مهم با هم مشورت می‌کنند و در سختی‌ها پشتیبان یکدیگر هستند.\nانجام این وظایف خانواده را آرام و پابرجا می‌کند.","pageRef":"صفحه ۸۶"},{"type":"note","title":"اهمیت خانواده","body":"خانواده نخستین محیط تربیت انسان است؛ بسیاری از خصلت‌ها و رفتارهای ما در خانه شکل می‌گیرد.\nقرآن ازدواج را مایه مودّت (محبت) و رحمت (دلسوزی) میان زن و مرد معرفی می‌کند.\nدر روایات، نیکی به پدر و مادر در کنار پرستش خداوند یاد شده است؛ نشانه جایگاه بسیار والای آن."},{"type":"note","title":"مهربانی در خانه","body":"پیامبر اکرم (ص) فرمودند: بهترین شما کسی است که با خانواده خود بهتر رفتار کند.\nمهربانی با همسر و فرزندان، خانه را به آرامش‌گاه تبدیل می‌کند.\nگفت‌وگوی محترمانه، مشورت و بخشیدن خطای دیگران از نشانه‌های زندگی سالم خانوادگی است."},{"type":"exam","title":"عبارت «وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً» را ترجمه کنید و پیام آن را بنویسید.","body":"ترجمه: «و میان شما مودّت (محبت) و رحمت (دلسوزی) قرار داد» (بخشی از آیه ۲۱ سوره روم).\nپیام: خداوند پایه پیوند زن و شوهر را محبت و دلسوزی قرار داده است؛ خانه‌ای که در آن مودّت باشد، آرامش‌گاه اهل آن است.\nتوصیه امتحانی: مودّت یعنی محبت خالصانه و رحمت یعنی دلسوزی و بخشش؛ این دو را جدا از هم بنویسید."},{"type":"exam","title":"چرا پیامبر اکرم (ص) فرمودند بهترین شما کسی است که با خانواده خود بهتر رفتار کند؟ توضیح دهید.","body":"پاسخ: زیرا مهربانی با افراد بیرون از خانه آسان است، اما رفتار خوبِ مداوم با نزدیک‌ترین افراد زندگی (که بدون تظاهر و در همه روزهاست) نشان‌دهنده اخلاق واقعی انسان است.\nکسی که در خانه صبور و مهربان است، اخلاق نیکو در وجودش ریشه دوانده است.\nتوصیه: در پاسخ‌های تشریحی پیام‌ها، علت را با یک مثال ساده از زندگی بیان کنید."}]}]},{"title":"کار و فناوری هشتم","subject":"کار و فناوری","description":"نمونه‌سازی، فناوری و مهارت‌های کاربردی","color":"red","icon":"wrench","chapters":[{"number":1,"title":"روش تحقیق","pages":"۸ تا ۱۹","contents":[{"type":"answer","title":"مراحل انجام یک تحقیق کلاسی را به ترتیب بنویسید.","body":"۱. انتخاب موضوع: موضوعی که برایمان جالب و مهم باشد.\n۲. تعیین سوال‌ها: درباره موضوع سوال‌های مشخص طرح می‌کنیم.\n۳. گردآوری اطلاعات: از کتاب، اینترنت معتبر، پرسش از افراد آگاه و مشاهده.\n۴. دسته‌بندی اطلاعات: یادداشت‌ها را با جدول یا برچسب مرتب می‌کنیم.\n۵. تهیه گزارش: نتیجه‌ها را می‌نویسیم و به کلاس ارائه می‌دهیم (گزارش نوشتاری یا با پاورپوینت).","pageRef":"صفحه ۱۰"},{"type":"answer","title":"برای تحقیق با موضوع «صرفه‌جویی در مصرف آب مدرسه» دو سوال مناسب طرح کنید و راه‌های گردآوری اطلاعات را بنویسید.","body":"سوال‌های پیشنهادی:\n۱. در مدرسه ما روزانه چه مقدار آب هدر می‌رود و در چه بخش‌هایی؟\n۲. چه راه‌هایی برای کاهش مصرف آب در مدرسه و خانه وجود دارد؟\nراه‌های گردآوری اطلاعات: مشاهده و ثبت وضعیت شیرهای آب، پرسشنامه از دانش‌آموزان، گفت‌وگو با مسئول فنی مدرسه و مطالعه سایت‌های معتبر."},{"type":"note","title":"روش‌های گردآوری اطلاعات","body":"۱. پرسشنامه: طرح سوال‌های کوتاه از افراد و جمع‌آوری پاسخ‌ها.\n۲. مصاحبه: پرسش رودررو از فرد آگاه (مثل پزشک یا کشاورز).\n۳. مشاهده و ثبت: دیدن دقیق پدیده و یادداشت کردن جزئیات.\n۴. کتاب و اینترنت: مطالعه منابع معتبر و ثبت نکته‌ها با ذکر منبع."},{"type":"note","title":"ویژگی‌های موضوع تحقیق خوب","body":"موضوع باید جدید و جالب باشد و به زندگی واقعی ربط داشته باشد.\nدر توان و وقت ما باشد و منابع گردآوری اطلاعات آن در دسترس باشد.\nاز موضوع‌های خیلی وسیع پرهیز کنید؛ موضوع را محدود کنید: به جای «آب» بنویسید «صرفه‌جویی در مصرف آب مدرسه»."},{"type":"exam","title":"تفاوت مشاهده و پرسشنامه در گردآوری اطلاعات چیست؟","body":"پاسخ: مشاهده یعنی دیدن مستقیم پدیده و ثبت وضعیت آن (مثلا شمردن شیرهای خراب مدرسه)؛ پرسشنامه یعنی طرح سوال‌های نوشتاری از افراد و جمع‌آوری پاسخ‌ها (مثلا پرسیدن میزان مصرف آب هر کلاس).\nدر مشاهده، اطلاعات از رفتار و وضعیت واقعی به دست می‌آید و در پرسشنامه از گفته افراد.\nتوصیه امتحانی: برای هر روش یک مثال کوتاه بزنید تا پاسخ کامل شود."},{"type":"exam","title":"چرا در گزارش تحقیق باید منابع را ذکر کنیم؟","body":"پاسخ: ذکر منابع نشان می‌دهد اطلاعات از کجا گرفته شده و چه کسانی به آن اعتبار داده‌اند.\nاین کار احترام به تلاش پژوهشگران است و امکان پیگیری و ادامه کار را برای دیگران فراهم می‌کند.\nاگر منبع ذکر نشود، استفاده از کار دیگران سرقت علمی حساب می‌شود.\nتوصیه: نام کتاب یا سایت، نویسنده و صفحه را همان هنگام یادداشت کنید تا در پایان گم نشود."}]},{"number":2,"title":"ویرایش تصویر","pages":"۲۰ تا ۳۱","contents":[{"type":"answer","title":"برای ویرایش یک عکس دیجیتال چه کارهایی می‌توان انجام داد؟ چهار مورد را نام ببرید.","body":"۱. چرخاندن عکس و صاف کردن زاویه آن.\n۲. بریدن (Crop) بخش‌های اضافی تا سوژه اصلی مشخص شود.\n۳. تنظیم روشنایی، کنتراست و اشباع رنگ.\n۴. حذف قرمزی چشم، تغییر اندازه و افزودن قاب یا نوشته.\nبرای انجام این کارها از نرم‌افزارهای ویرایش تصویر استفاده می‌کنیم.","pageRef":"صفحه ۲۲"},{"type":"answer","title":"عکس ویرایش‌شده را چگونه ذخیره کنیم؟ دو فرمت رایج و کاربرد هر کدام را بنویسید.","body":"مرحله‌ها: از منوی File گزینه Save یا Save As را انتخاب می‌کنیم؛ نام و محل ذخیره فایل را مشخص می‌کنیم و فرمت مناسب را برمی‌گزینیم.\nفرمت JPG: حجم کمتری دارد و برای عکس‌های معمولی مناسب است.\nفرمت PNG: کیفیت را بهتر حفظ می‌کند و برای تصاویر با پس‌زمینه شفاف یا متن‌دار مناسب است.\nانتخاب فرمت نامناسب باعث افت کیفیت یا بزرگ شدن حجم فایل می‌شود.","pageRef":"صفحه ۲۴"},{"type":"note","title":"پیکسل چیست؟","body":"تصویر دیجیتال از هزاران نقطه کوچک ساخته شده که هر نقطه یک پیکسل نام دارد.\nهرچه تعداد پیکسل‌ها (رزولوشن) بیشتر باشد، تصویر دقیق‌تر ولی حجیم‌تر است.\nاگر عکس کوچک را خیلی بزرگ کنیم، پیکسل‌ها دیده می‌شوند و تصویر دانه‌دانه می‌شود."},{"type":"note","title":"انتخاب عکس مناسب برای ارائه کلاسی","body":"عکس باید واضح باشد و موضوع گزارش را به خوبی نشان دهد.\nاندازه و حجم عکس را با نیاز ارائه هماهنگ کنید؛ عکس‌های خیلی بزرگ حجم فایل را بالا می‌برند.\nاز تصاویر دارای محدودیت کپی استفاده نکنید؛ عکس‌های رایگان را انتخاب و در صورت لزوم منبع آن را ذکر کنید."},{"type":"exam","title":"بریدن تصویر (Crop) چه فایده‌هایی دارد؟ توضیح دهید.","body":"پاسخ: بریدن یعنی حذف بخش‌های اضافی حاشیه عکس؛ با این کار سوژه اصلی بزرگ‌تر و واضح‌تر دیده می‌شود، توجه بیننده به نکته اصلی جلب می‌شود و حجم فایل هم کم می‌شود.\nمثال: اگر در عکس کلاس فقط معلم مورد نظر ما است، بقیه قسمت‌ها را بریده و حذف می‌کنیم.\nتوصیه امتحانی: Crop را با تغییر اندازه اشتباه نگیرید؛ تغییر اندازه، کل عکس را کوچک یا بزرگ می‌کند."},{"type":"exam","title":"تفاوت فرمت‌های JPG و PNG را بنویسید.","body":"پاسخ: JPG حجم کمتری دارد و برای عکس‌های معمولی مناسب است، اما در هر بار ذخیره کمی از کیفیت آن کم می‌شود.\nPNG کیفیت و شفافیت را حفظ می‌کند و برای لوگو، متن و تصاویر با پس‌زمینه شفاف مناسب است، ولی حجم بیشتری دارد.\nتوصیه: برای تصویری که باید چاپ یا دوباره ویرایش شود، PNG انتخاب بهتری است."}]},{"number":3,"title":"کاربرد رایانه در محاسبات","pages":"۳۲ تا ۴۳","contents":[{"type":"answer","title":"در نرم‌افزار صفحه‌گسترده چگونه جمع یک ستون از اعداد را حساب می‌کنیم؟ مرحله‌ها را بنویسید.","body":"۱. در خانه‌ای که نتیجه باید نمایش داده شود کلیک می‌کنیم.\n۲. علامت = را تایپ می‌کنیم؛ هر فرمول با این علامت شروع می‌شود.\n۳. فرمول جمع را می‌نویسیم: =SUM(B2:B10) یعنی جمع خانه‌های B2 تا B10.\n۴. کلید Enter را می‌زنیم تا نتیجه نمایش داده شود.\nاگر یکی از اعداد تغییر کند، نتیجه به صورت خودکار به‌روز می‌شود؛ این مهم‌ترین برتری رایانه در محاسبات است.","pageRef":"صفحه ۳۴"},{"type":"answer","title":"جدول نمرات کلاس را چگونه در صفحه‌گسترده تنظیم و میانگین هر دانش‌آموز را حساب کنیم؟","body":"۱. در ردیف اول عنوان ستون‌ها را می‌نویسیم: نام، نمره ریاضی، نمره علوم، میانگین.\n۲. نمره‌ها را در ستون‌های مربوط وارد می‌کنیم.\n۳. در ستون میانگین فرمول =AVERAGE(B2:C2) را می‌نویسیم.\n۴. با کشیدن گوشه خانه، فرمول به ردیف‌های بعدی کپی می‌شود.\n۵. با ابزار مرتب‌سازی می‌توان نمره‌ها را از بیشترین به کمترین چید."},{"type":"note","title":"ساختار صفحه‌گسترده","body":"صفحه‌گسترده از خانه‌های کوچکی به نام سلول ساخته شده است.\nهر سلول با نام ستون و شماره سطر مشخص می‌شود: A1، B3، C7.\nستون‌ها با حروف انگلیسی (A، B، C) و سطرها با اعداد نام‌گذاری می‌شوند.\nهر فرمول باید با علامت = آغاز شود."},{"type":"note","title":"برتری رایانه در محاسبات","body":"سرعت: میلیون‌ها محاسبه در چند ثانیه انجام می‌شود.\nدقت: اگر فرمول درست باشد، خطای انسانی وجود ندارد.\nاصلاح آسان: با تغییر یک عدد، همه نتایج وابسته به‌روز می‌شوند.\nنمودار: از همان داده‌ها می‌توان نمودار ستونی یا دایره‌ای رسم کرد."},{"type":"exam","title":"فرمول =SUM(A1:A5) چه کاری انجام می‌دهد؟","body":"پاسخ: این فرمول اعداد خانه‌های A1 تا A5 را با هم جمع می‌کند و نتیجه را در خانه‌ای که فرمول در آن نوشته شده نمایش می‌دهد.\nعلامت دونقطه یعنی «تا»؛ پس بازه A1 تا A5 شامل پنج سلول می‌شود.\nتوصیه امتحانی: فرمول‌ها همیشه با علامت = شروع می‌شوند؛ در غیر این صورت نرم‌افزار آن را فقط متن ساده در نظر می‌گیرد."},{"type":"exam","title":"برای نمره‌های کلاس، نمودار ستونی مناسب‌تر است یا نمودار دایره‌ای؟ چرا؟","body":"پاسخ: برای مقایسه نمره دانش‌آموزان یا درس‌ها با هم، نمودار ستونی مناسب‌تر است؛ چون بلندی ستون‌ها مقایسه را سریع نشان می‌دهد.\nنمودار دایره‌ای برای نشان دادن سهم هر بخش از کل به کار می‌رود؛ مثل درصد ساعات مطالعه هر درس از کل زمان مطالعه.\nتوصیه: قبل از انتخاب نمودار بپرسید می‌خواهم مقایسه کنم یا سهم از کل را نشان دهم."}]}]}]},{"number":9,"name":"پایه نهم","subtitle":"آماده‌سازی برای آینده","books":[{"title":"ریاضی نهم","subject":"ریاضی","description":"مجموعه‌ها، اعداد حقیقی، تشابه و معادله خط","color":"blue","icon":"calculator","chapters":[{"number":1,"title":"مجموعه‌ها","pages":"۱۰ تا ۲۲","contents":[{"type":"answer","title":"اگر A = {۱ ، ۲ ، ۳ ، ۴} و B = {۳ ، ۴ ، ۵} باشد ، اشتراک و اجتماع دو مجموعه را بنویسید و تعداد زیرمجموعه‌های A را بیابید.","body":"عناصر مشترک دو مجموعه در اشتراک قرار می‌گیرند:\nA ∩ B = {۳ ، ۴}\nعناصر هر دو مجموعه بدون تکرار در اجتماع قرار می‌گیرند:\nA ∪ B = {۱ ، ۲ ، ۳ ، ۴ ، ۵}\nتعداد عناصر مجموعه A برابر ۴ است.\nتعداد زیرمجموعه‌های مجموعه‌ای با n عضو برابر ۲ به توان n است:\n۲ به توان ۴ = ۲ × ۲ × ۲ × ۲ = ۱۶\nپس مجموعه A دارای ۱۶ زیرمجموعه است.","pageRef":"صفحه ۱۴"},{"type":"answer","title":"در دنباله ۳ ، ۷ ، ۱۱ ، ۱۵ ، ... جمله دهم چند است؟","body":"قدر نسبت دنباله را پیدا می‌کنیم:\n۷ - ۳ = ۴ و ۱۱ - ۷ = ۴ ؛ پس قدر نسبت ۴ است.\nهر جمله برابر جمله اول به‌علاوه (شماره جمله منهای ۱) ضربدر قدر نسبت است.\nجمله دهم = ۳ + (۱۰ - ۱) × ۴\nجمله دهم = ۳ + ۹ × ۴ = ۳ + ۳۶ = ۳۹\nپس جمله دهم این دنباله برابر ۳۹ است.","pageRef":"صفحه ۱۲"},{"type":"note","title":"مجموعه متناهی و نامتناهی","body":"مجموعه متناهی مجموعه‌ای است که اعضای آن قابل شمارش باشد و عضو آخر داشته باشد؛ مانند مجموعه روزهای هفته.\nمجموعه نامتناهی عضو آخر ندارد و شمارش اعضای آن تمام نمی‌شود؛ مانند مجموعه اعداد طبیعی.\nنماد: مجموعه اعداد طبیعی را با N و مجموعه اعداد صحیح را با Z نشان می‌دهند."},{"type":"note","title":"زیرمجموعه را ساده بشناسیم","body":"اگر هر عضو مجموعه A عضو مجموعه B هم باشد ، A زیرمجموعه B است.\nمجموعه تهی زیرمجموعه هر مجموعه است و هر مجموعه زیرمجموعه خودش است.\nتعداد کل زیرمجموعه‌های مجموعه n عضوی برابر ۲ به توان n است.\nمثال: مجموعه اعداد طبیعی زیرمجموعه مجموعه اعداد صحیح است."},{"type":"exam","title":"سوال امتحانی: مجموعه A = {الف ، ب ، ج} چند زیرمجموعه واقعی دارد؟ همه را بنویسید.","body":"پاسخ تشریحی:\nتعداد کل زیرمجموعه‌ها: ۲ به توان ۳ = ۸\nزیرمجموعه واقعی یعنی هر زیرمجموعه به‌جز خود A:\nتعداد زیرمجموعه‌های واقعی = ۸ - ۱ = ۷\nفهرست زیرمجموعه‌های واقعی: مجموعه تهی ، {الف} ، {ب} ، {ج} ، {الف ، ب} ، {الف ، ج} ، {ب ، ج}\nنکته امتحانی: خود مجموعه زیرمجموعه واقعی خودش نیست و فقط زیرمجموعه است؛ این نکته در تصحیح ورقه همیشه لحاظ می‌شود."},{"type":"exam","title":"سوال امتحانی: نشان دهید مجموعه اعداد طبیعی زیرمجموعه مجموعه اعداد صحیح است. سپس دو عدد نام ببرید که صحیح باشند ولی طبیعی نباشند.","body":"پاسخ تشریحی:\nاعداد طبیعی عبارت‌اند از ۱ ، ۲ ، ۳ ، ... و اعداد صحیح عبارت‌اند از ... ، منفی ۲ ، منفی ۱ ، ۰ ، ۱ ، ۲ ، ...\nهر عدد طبیعی جزو اعداد صحیح هم هست؛ پس هر عضو N عضو Z است و در نتیجه N زیرمجموعه Z است.\nنمونه‌هایی که صحیح‌اند ولی طبیعی نیستند: منفی ۳ و ۰\nنکته امتحانی: صفر عدد طبیعی نیست ولی عدد صحیح است؛ این نکته در سوال‌های درست و نادرست و چهارگزینه‌ای زیاد پرسیده می‌شود."}]},{"number":5,"title":"تشابه","pages":"۷۰ تا ۸۴","contents":[{"type":"answer","title":"دو مثلث متشابه‌اند و نسبت تشابه آن‌ها ۲ به ۳ است. اگر محیط مثلث کوچک ۱۸ سانتی‌متر باشد ، محیط مثلث بزرگ را بیابید.","body":"در دو شکل متشابه ، نسبت محیط‌ها برابر نسبت تشابه است.\nمحیط کوچک تقسیم بر محیط بزرگ = ۲ تقسیم بر ۳\n۱۸ تقسیم بر محیط بزرگ = ۲ تقسیم بر ۳\nبا ضرب طرفین در ۳ : ۱۸ × ۳ = ۲ × محیط بزرگ\n۵۴ = ۲ × محیط بزرگ\nمحیط بزرگ = ۵۴ تقسیم بر ۲ = ۲۷\nپس محیط مثلث بزرگ ۲۷ سانتی‌متر است.","pageRef":"صفحه ۷۴"},{"type":"answer","title":"میله‌ای به طول ۲ متر در آفتاب سایه‌ای به طول ۳ متر دارد. در همان ساعت ، سایه برجی ۴۵ متر است. ارتفاع برج چقدر است؟","body":"چون پرتوهای خورشید موازی‌اند ، مثلث ساخته‌شده از میله و سایه‌اش با مثلث برج و سایه‌اش متشابه است.\nدر مثلث‌های متشابه نسبت اضلاع متناظر برابر است:\nطول میله تقسیم بر سایه میله = ارتفاع برج تقسیم بر سایه برج\n۲ تقسیم بر ۳ = ارتفاع برج تقسیم بر ۴۵\nارتفاع برج = (۲ × ۴۵) تقسیم بر ۳\nارتفاع برج = ۹۰ تقسیم بر ۳ = ۳۰\nپس ارتفاع برج ۳۰ متر است.","pageRef":"صفحه ۷۷"},{"type":"note","title":"سه شرط تشابه دو مثلث","body":"دو مثلث متشابه‌اند اگر یکی از این سه شرط برقرار باشد:\nزاویه‌زاویه: دو زاویه متناظر برابر.\nضلع‌زاویه‌ضلع: دو ضلع متناظر متناسب و زاویه بین آن‌ها برابر.\nضلع‌ضلع‌ضلع: هر سه ضلع متناظر با یک نسبت واحد متناسب.\nدر مثلث‌های متشابه زاویه‌های متناظر برابر و اضلاع متناظر متناسب‌اند."},{"type":"note","title":"نسبت محیط و مساحت در شکل‌های متشابه","body":"اگر نسبت تشابه دو شکل متشابه k باشد:\nنسبت محیط‌ها برابر k است.\nنسبت مساحت‌ها برابر k به توان ۲ است.\nمثال: اگر نسبت تشابه ۲ باشد ، محیط دو برابر ولی مساحت چهار برابر می‌شود.\nاشتباه رایج: نسبت مساحت‌ها را برابر نسبت تشابه گرفتن."},{"type":"exam","title":"سوال امتحانی: نسبت تشابه دو مثلث ۳ به ۵ است. اگر مساحت مثلث کوچک ۹ سانتی‌متر مربع باشد ، مساحت مثلث بزرگ چقدر است؟","body":"پاسخ تشریحی:\nنسبت مساحت‌ها برابر مربع نسبت تشابه است:\nمساحت کوچک تقسیم بر مساحت بزرگ = ۳ به توان ۲ تقسیم بر ۵ به توان ۲ = ۹ تقسیم بر ۲۵\n۹ تقسیم بر مساحت بزرگ = ۹ تقسیم بر ۲۵\nمساحت بزرگ = ۲۵ سانتی‌متر مربع\nنکته امتحانی: ابتدا نسبت تشابه را مربع کنید و در کنار حل بنویسید؛ یادتان باشد واحد جواب مربع است."},{"type":"exam","title":"سوال امتحانی: پاره‌خطی به طول ۱۵ سانتی‌متر را به نسبت ۲ به ۳ تقسیم کنید.","body":"پاسخ تشریحی:\nمجموع نسبت‌ها: ۲ + ۳ = ۵ قسمت\nطول هر قسمت: ۱۵ تقسیم بر ۵ = ۳ سانتی‌متر\nبخش اول: ۲ × ۳ = ۶ سانتی‌متر\nبخش دوم: ۳ × ۳ = ۹ سانتی‌متر\nکنترل جواب: ۶ + ۹ = ۱۵ درست است.\nنکته امتحانی: برای ترسیم با استفاده از تشابه ، ابتدا محاسبه‌ها را بنویسید و سپس نقاط تقسیم را روی پاره‌خط مشخص و اندازه هر بخش را علامت بزنید."}]},{"number":8,"title":"آمار و احتمال","pages":"۱۲۰ تا ۱۳۲","contents":[{"type":"answer","title":"نمره‌های یک دانش‌آموز در پنج آزمون ریاضی ۱۶ ، ۱۸ ، ۱۴ ، ۲۰ و ۱۲ است. میانگین ، میانه ، نما و دامنه تغییرات را بیابید.","body":"میانگین: مجموع نمره‌ها تقسیم بر تعداد آن‌ها\n(۱۶ + ۱۸ + ۱۴ + ۲۰ + ۱۲) تقسیم بر ۵ = ۸۰ تقسیم بر ۵ = ۱۶\nمیانه: ابتدا نمره‌ها را از کم به زیاد مرتب می‌کنیم:\n۱۲ ، ۱۴ ، ۱۶ ، ۱۸ ، ۲۰\nچون ۵ نمره داریم ، میانه نمره سوم است: ۱۶\nنما: هیچ نمره‌ای تکرار نشده است ؛ پس این مجموعه داده نما ندارد.\nدامنه تغییرات: بزرگترین داده منهای کوچکترین داده = ۲۰ - ۱۲ = ۸\nپس میانگین ۱۶ ، میانه ۱۶ ، نما ندارد و دامنه تغییرات ۸ است.","pageRef":"صفحه ۱۲۲"},{"type":"answer","title":"یک مکعب لاستیکی را دو بار می‌اندازیم. احتمال اینکه مجموع دو عدد ظاهر شده ۷ شود چقدر است؟","body":"هر بار انداختن مکعب ۶ حالت دارد ؛ پس برای دو بار:\nتعداد کل حالت‌ها = ۶ × ۶ = ۳۶\nحالت‌های مطلوب که مجموع آن‌ها ۷ می‌شود:\n(۱ و ۶) ، (۲ و ۵) ، (۳ و ۴) ، (۴ و ۳) ، (۵ و ۲) ، (۶ و ۱)\nتعداد حالت‌های مطلوب = ۶\nاحتمال = تعداد حالت‌های مطلوب تقسیم بر تعداد کل حالت‌ها = ۶ تقسیم بر ۳۶ = ۱ ششم\nپس احتمال مجموع ۷ برابر ۱ ششم است.","pageRef":"صفحه ۱۲۸"},{"type":"note","title":"شاخص‌های آماری یک مجموعه داده","body":"میانگین: مجموع داده‌ها تقسیم بر تعداد آن‌ها.\nمیانه: داده وسط پس از مرتب کردن داده‌ها از کم به زیاد؛ اگر تعداد داده‌ها زوج باشد ، میانگین دو داده وسط است.\nنما: پرتکرارترین داده؛ ممکن است بیش از یک نما وجود داشته باشد یا اصلا نما نداشته باشد.\nدامنه تغییرات: بزرگترین داده منهای کوچکترین داده."},{"type":"note","title":"قواعد مهم احتمال","body":"احتمال پیشامد = تعداد حالت‌های مطلوب تقسیم بر تعداد کل حالت‌های ممکن.\nاحتمال همیشه عددی بین ۰ و ۱ است.\nاحتمال پیشامد یقینی ۱ و پیشامد غیرممکن ۰ است.\nمجموع احتمال یک پیشامد و متمم آن (وقوع نداشتن آن) برابر ۱ است."},{"type":"exam","title":"سوال امتحانی: در کیسه‌ای ۳ توپ سرخ و ۵ توپ سفید داریم. یک توپ را تصادفی بیرون می‌آوریم. احتمال سفید بودن و احتمال سرخ نبودن آن را بیابید.","body":"پاسخ تشریحی:\nتعداد کل توپ‌ها: ۳ + ۵ = ۸\nاحتمال سفید بودن: ۵ تقسیم بر ۸\nسرخ نبودن یعنی سفید بودن ؛ پس احتمال سرخ نبودن هم ۵ تقسیم بر ۸ است.\nراه دوم با متمم: احتمال سرخ بودن ۳ تقسیم بر ۸ است ؛ پس احتمال سرخ نبودن = ۱ منهای ۳ هشتم = ۵ هشتم.\nنکته امتحانی: برای پیشامدهایی که با «نه» بیان می‌شوند از متمم استفاده کنید: ۱ منهای احتمال خود پیشامد."},{"type":"exam","title":"سوال امتحانی: میانگین نمره‌های ۴ درس یک دانش‌آموز ۱۸ و میانگین ۳ درس اول او ۱۷ است. نمره درس چهارم چقدر است؟","body":"پاسخ تشریحی:\nمجموع نمره‌های ۴ درس: ۴ × ۱۸ = ۷۲\nمجموع نمره‌های ۳ درس اول: ۳ × ۱۷ = ۵۱\nنمره درس چهارم: ۷۲ - ۵۱ = ۲۱\nنکته امتحانی: از میانگین همیشه به «مجموع» برگردید؛ این روش برای تقریبا همه سوال‌های میانگین کارساز است."}]}]},{"title":"علوم تجربی نهم","subject":"علوم تجربی","description":"مواد، رفتار اتم‌ها، حرکت و نیرو","color":"green","icon":"flask","chapters":[{"number":1,"title":"مواد و نقش آن در زندگی","pages":"۸ تا ۲۰","contents":[{"type":"answer","title":"چرا برای ساخت قابلمه از آلومینیوم استفاده می‌شود نه پلاستیک؟ با ذکر دو خاصیت ماده توضیح دهید.","body":"خاصیت اول: نقطه ذوب.\nقابلمه باید حرارت زیاد شعله را تحمل کند؛ نقطه ذوب آلومینیوم حدود ۶۶۰ درجه سانتی‌گراد است ولی پلاستیک در حرارت‌های بسیار پایین‌تر ذوب یا تجزیه می‌شود.\nخاصیت دوم: رسانش حرارت.\nآلومینیوم رسانای خوبی برای حرارت است و غذا سریع و یکنواخت می‌پزد؛ پلاستیک نارساناست و برای پختن مناسب نیست.\nنتیجه: انتخاب ماده بر اساس خواص آن انجام می‌شود ، نه فقط قیمت یا شکل ظاهری.","pageRef":"صفحه ۱۰"},{"type":"answer","title":"جرم قطعه‌ای فولاد ۷۸۰ گرم و حجم آن ۱۰۰ سانتی‌متر مکعب است. چگالی آن را حساب کنید و بگویید در آب شناور می‌ماند یا فرو می‌رود. (چگالی آب ۱ گرم بر سانتی‌متر مکعب)","body":"فرمول چگالی: چگالی = جرم تقسیم بر حجم\nچگالی = ۷۸۰ گرم تقسیم بر ۱۰۰ سانتی‌متر مکعب\nچگالی = ۷٫۸ گرم بر سانتی‌متر مکعب\nمقایسه با آب: ۷٫۸ بزرگتر از ۱ است.\nهر ماده‌ای که چگالتر از آب باشد در آب فرو می‌رود.\nپس این قطعه فولادی در آب فرو می‌رود.","pageRef":"صفحه ۱۳"},{"type":"note","title":"خواص مواد و انتخاب ماده مناسب","body":"برای انتخاب ماده مناسب باید خواص آن را بشناسیم: سختی ، استحکام ، انعطاف‌پذیری ، تردی ، چگالی و نقطه ذوب.\nماده سخت به‌سختی خط می‌افتد ؛ ماده انعطاف‌پذیر خم می‌شود و نمی‌شکند ؛ ماده ترد با ضربه می‌شکند.\nهر مصنوعی از ماده‌ای ساخته می‌شود که خواصش با کاربرد آن سازگار باشد؛ مثلا روکش سیم برق باید انعطاف‌پذیر باشد."},{"type":"note","title":"مواد طبیعی ، مصنوعی و پلیمرها","body":"مواد طبیعی از طبیعت به‌دست می‌آیند؛ مانند چوب ، پنبه ، پشم و ابریشم.\nمواد مصنوعی ساخته دست انسان‌اند؛ مانند پلاستیک ، شیشه و الیافی مانند نایلون.\nپلیمرها مولکول‌های زنجیره‌ای بلندی هستند که از تکرار واحدهای کوچک ساخته شده‌اند؛ نشاسته و سلولز پلیمر طبیعی و پلی‌اتیلن پلیمر مصنوعی است."},{"type":"exam","title":"سوال امتحانی: چگالی فلزی ۲٫۷ گرم بر سانتی‌متر مکعب است. اگر حجم آن ۲۰ سانتی‌متر مکعب باشد ، جرم آن چند گرم است؟","body":"پاسخ تشریحی:\nچگالی = جرم تقسیم بر حجم ؛ پس جرم = چگالی × حجم\nجرم = ۲٫۷ × ۲۰\nجرم = ۵۴ گرم\nنکته امتحانی: ابتدا فرمول چگالی را بنویسید ، سپس با جای‌گذاری اعداد جواب را همراه یکا (گرم) بنویسید تا نمره کامل بگیرید."},{"type":"exam","title":"سوال امتحانی: دو خاصیت از خواص مواد را نام ببرید و برای هر یک یک کاربرد در زندگی روزمره ذکر کنید.","body":"پاسخ تشریحی:\nنمونه پاسخ:\nسختی: مته و ابزار برنده را از فولاد سخت می‌سازند تا به‌آسانی خط نیفتند.\nانعطاف‌پذیری: روکش سیم برق را از پلاستیک انعطاف‌پذیر می‌سازند تا خم شدن سیم را تحمل کند.\nمی‌توانید از چگالی ، نقطه ذوب یا تردی هم مثال بزنید.\nنکته امتحانی: خاصیت و کاربرد را کنار هم بنویسید و با یک جمله دلیل انتخاب ماده را توضیح دهید."}]},{"number":5,"title":"نیرو","pages":"۷۰ تا ۸۴","contents":[{"type":"answer","title":"چهار نیرو به جسمی وارد می‌شود: ۱۲ نیوتون به راست ، ۸ نیوتون به راست ، ۵ نیوتون به چپ و ۳ نیوتون به چپ. نیروی خالص را بیابید و جهت حرکت جسم را تعیین کنید.","body":"نیروهای هم‌جهت را با هم جمع می‌کنیم:\nجمع نیروهای رو به راست: ۱۲ + ۸ = ۲۰ نیوتون\nجمع نیروهای رو به چپ: ۵ + ۳ = ۸ نیوتون\nاین دو نیرو در خلاف جهت هم‌اند ؛ پس بزرگی‌شان را از هم کم می‌کنیم:\nنیروی خالص = ۲۰ - ۸ = ۱۲ نیوتون\nجهت نیروی خالص در جهت نیروی بزرگتر یعنی به سمت راست است.\nپس جسم با نیروی خالص ۱۲ نیوتون به سمت راست حرکت می‌کند.","pageRef":"صفحه ۷۵"},{"type":"answer","title":"فنری که ثابت آن ۵۰ نیوتون بر متر است با نیرویی ۱۰ سانتی‌متر کشیده می‌شود. بزرگی این نیرو چند نیوتون است؟","body":"قانون فنر: نیرو = ثابت فنر × تغییر طول\nابتدا تغییر طول را به متر تبدیل می‌کنیم:\n۱۰ سانتی‌متر = ۰٫۱ متر\nنیرو = ۵۰ × ۰٫۱\nنیرو = ۵ نیوتون\nپس نیرویی که فنر را ۱۰ سانتی‌متر کشیده (و نیروی بازگرداننده فنر) برابر ۵ نیوتون است.","pageRef":"صفحه ۸۰"},{"type":"note","title":"انواع نیرو و اندازه‌گیری آن","body":"نیروها دو گروه‌اند:\nنیروهای تماسی که با تماس مستقیم اثر می‌کنند؛ مانند نیروی ماهیچه‌ای ، اصطکاک و نیروی کشسانی.\nنیروهای از راه دور که بدون تماس اثر می‌کنند؛ مانند نیروی گرانش ، مغناطیسی و الکتریکی.\nیکای اندازه‌گیری نیرو نیوتون (N) است و آن را با نیروسنج (فنر مدرج) اندازه می‌گیریم."},{"type":"note","title":"حالت تعادل چیست؟","body":"اگر نیروی خالص وارد بر جسم صفر باشد ، جسم در تعادل است.\nجسم در تعادل ساکن می‌ماند یا با سرعت ثابت در خط راست حرکت می‌کند.\nمثال: کتابی که روی میز ساکن است چون وزن رو به پایین و نیروی میز رو به بالا با هم برابرند.\nاشتباه رایج: فکر کردن ساکن بودن یعنی هیچ نیرویی وارد نمی‌شود؛ در تعادل نیروها وجود دارند ولی همدیگر را خنثی می‌کنند."},{"type":"exam","title":"سوال امتحانی: دو نفر طنابی را از دو طرف می‌کشند؛ نفر اول با نیروی ۳۰ نیوتون به چپ و نفر دوم با نیروی ۵۰ نیوتون به راست. نیروی خالص و جهت حرکت طناب را بیابید.","body":"پاسخ تشریحی:\nدو نیرو خلاف جهت هم‌اند ؛ پس بزرگی آن‌ها را کم می‌کنیم:\nنیروی خالص = ۵۰ - ۳۰ = ۲۰ نیوتون\nجهت نیروی خالص در جهت نیروی بزرگتر یعنی به سمت راست است.\nپس طناب با نیروی خالص ۲۰ نیوتون به سمت راست حرکت می‌کند.\nنکته امتحانی: نیروها را با پیکان رسم کنید ، یکا را بنویسید و جهت نیروی خالص را با پیکان مشخص کنید تا نمره کامل بگیرید."},{"type":"exam","title":"سوال امتحانی: ثابت فنری ۲۰۰ نیوتون بر متر است. اگر با نیروی ۴ نیوتون آن را بکشیم ، فنر چند سانتی‌متر کشیده می‌شود؟","body":"پاسخ تشریحی:\nقانون فنر: نیرو = ثابت فنر × تغییر طول\nپس تغییر طول = نیرو تقسیم بر ثابت فنر\nتغییر طول = ۴ تقسیم بر ۲۰۰ = ۰٫۰۲ متر\n۰٫۰۲ متر = ۲ سانتی‌متر\nنکته امتحانی: قبل از جای‌گذاری در فرمول ، تغییر طول را به متر تبدیل کنید و در جواب نهایی دوباره به سانتی‌متر برگردید."}]},{"number":6,"title":"زمین‌ساخت ورقه‌ای","pages":"۸۶ تا ۹۸","contents":[{"type":"answer","title":"چرا بیشتر زلزله‌ها و آتشفشان‌های جهان در حاشیه ورقه‌های زمین رخ می‌دهند؟","body":"پوسته زمین به چند ورقه بزرگ و کوچک تقسیم شده است که روی مواد نرم گوشته به‌آرامی حرکت می‌کنند.\nدر حاشیه ورقه‌ها سه اتفاق می‌افتد: ورقه‌ها از هم دور می‌شوند ، به هم برخورد می‌کنند یا در کنار هم می‌لغزند.\nاین حرکت‌ها در مرزها تنش و انرژی ذخیره می‌کند؛ وقتی سنگ‌ها می‌شکنند ، انرژی آزاد شده به‌صورت زلزله به سطح می‌رسد.\nهمچنین در این مرزها پوسته ضعیف و شکاف‌دار است و ماگما به‌آسانی می‌تواند بالا بیاید؛ بنابراین آتشفشان‌ها هم بیشتر در حاشیه ورقه‌ها پدید می‌آیند.\nمثال: حلقه آتش اقیانوس آرام که پر از زلزله و آتشفشان است.","pageRef":"صفحه ۸۸"},{"type":"answer","title":"سه نوع مرز میان ورقه‌های زمین را نام ببرید و برای هر یک یک نمونه جهانی بگویید.","body":"مرز واگرایی (دور شدن): دو ورقه از هم دور می‌شوند و ماگمای بالا آمده پوسته جدید می‌سازد؛ مانند پشته‌های میان‌اقیانوسی.\nمرز همگرایی (برخورد): دو ورقه به هم نزدیک می‌شوند؛ ورقه اقیانوسی زیر ورقه قاره‌ای فرو می‌رود یا دو ورقه قاره‌ای برخورد کرده و کوه می‌سازند؛ مانند رشته‌کوه هیمالیا از برخورد ورقه هند و اوراسیا.\nمرز لغزش جانبی: دو ورقه در کنار هم و در خلاف جهت یکدیگر می‌لغزند؛ مانند گسل سان‌آندریاس در آمریکای شمالی.","pageRef":"صفحه ۹۱"},{"type":"note","title":"جریان‌های همرفتی ؛ موتور حرکت ورقه‌ها","body":"حرارت هسته زمین باعث می‌شود مواد نرم گوشته مانند سیال‌ها حرکت کنند.\nمواد گرم بالا می‌روند ، مواد سردتر پایین می‌آیند و این چرخه جریان همرفتی می‌سازد.\nجریان‌های همرفتی مانند نوار نقاله زیر ورقه‌ها عمل می‌کنند و عامل اصلی حرکت ورقه‌های زمین‌اند."},{"type":"note","title":"ابرقاره پانگه‌آ و شواهد آن","body":"حدود ۲۲۵ میلیون سال پیش همه خشکی‌های زمین یک ابرقاره به نام پانگه‌آ بودند که به‌تدریج تکه‌تکه شد و قاره‌های امروزی پدید آمدند.\nشواهد: تطابق شکل سواحل قاره‌ها ، فسیل‌های یکسان جانوران و گیاهان در قاره‌های جدا از هم و پیوستگی سنگ‌ها و کوه‌های ساحل مقابل هم.\nون‌گنر دانشمندی است که نظریه جابه‌جایی قاره‌ها را ارائه کرد."},{"type":"exam","title":"سوال امتحانی: وقتی ورقه اقیانوسی در مرز همگرایی به زیر ورقه قاره‌ای فرو می‌رود ، چه پدیده‌هایی در آن ناحیه ایجاد می‌شود؟","body":"پاسخ تشریحی:\nدر محل فرورانش گودالی عمیق به نام خندق اقیانوسی ایجاد می‌شود.\nشکست سنگ‌ها در این ناحیه زلزله‌های پیاپی و گاه عمیق و شدید به‌وجود می‌آورد.\nمواد فرو رفته ذوب می‌شوند و ماگمای حاصل بالا می‌آید و روی ورقه قاره‌ای رشته‌ای از آتشفشان‌ها می‌سازد.\nنمونه: حاشیه اقیانوس آرام با خندق‌های عمیق و آتشفشان‌های فراوان.\nنکته امتحانی: هر پدیده (خندق ، زلزله ، آتشفشان) را با یک جمله علت بنویسید تا پاسخ کامل شمرده شود."},{"type":"exam","title":"سوال امتحانی: درست یا نادرست؟ ورقه‌های زمین هر سال چند صد کیلومتر جابه‌جا می‌شوند. توضیح دهید.","body":"پاسخ تشریحی:\nنادرست است.\nسرعت حرکت ورقه‌ها بسیار کم و در حدود چند سانتی‌متر در سال است؛ تقریبا به اندازه رشد ناخن دست ما.\nبا وجود سرعت کم ، در طول میلیون‌ها سال این حرکت‌ها قاره‌ها را جابه‌جا کرده و کوه‌ها و اقیانوس‌های جدید ساخته‌اند.\nنکته امتحانی: در سوال‌های درست و نادرست حتما دلیل یا عدد درست را بنویسید؛ پاسخ بدون توضیح نمره کامل ندارد."}]}]},{"title":"فارسی نهم","subject":"فارسی","description":"ادبیات، واژه‌آموزی و دانش‌های زبانی","color":"purple","icon":"book","chapters":[{"number":1,"title":"شکر نعمت","pages":"۸ تا ۱۷","contents":[{"type":"answer","title":"پیام اصلی درس «شکر نعمت» چیست؟ به زبان خودتان توضیح دهید.","body":"پیام اصلی درس ، شکرگزاری و سپاس نعمت‌های خداوند است.\nدر این درس که برگرفته از گلستان سعدی است ، سخن از آن است که انسان به‌جای نگاه به کمبودها ، به نعمت‌های فراوان خود بنگرد و خدا را سپاس گوید.\nنعمت‌هایی مانند سلامتی ، بینایی ، شنوایی ، خانواده و روزی حلال در چشم ما عادی شده‌اند و یادمان می‌رود که هر یک نعمتی بزرگ است.\nشکر نعمت سبب افزون شدن آن می‌شود و ناسپاسی راه کاستی نعمت را باز می‌کند.","pageRef":"صفحه ۹"},{"type":"answer","title":"معنی واژه‌های «توفیق» ، «شکرگزاری» و «قناعت» را بنویسید و هر یک را در جمله‌ای به کار ببرید.","body":"توفیق یعنی موفقیت و یاری الهی برای انجام کار.\nجمله نمونه: از خداوند توفیق در تحصیل می‌خواهم.\nشکرگزاری یعنی سپاس گفتن نعمت‌های خداوند.\nجمله نمونه: شکرگزاری سبب افزونی نعمت می‌شود.\nقناعت یعنی به اندازه نیاز بسنده کردن و دوری از زیاده‌خواهی.\nجمله نمونه: مرد قناعت‌پیشه همیشه آسوده‌خاطر است.","pageRef":"صفحه ۱۵"},{"type":"note","title":"آشنایی با سعدی و سبک گلستان","body":"این درس برگرفته از گلستان سعدی است؛ سعدی شاعر و نویسنده بزرگ قرن هفتم هجری و صاحب گلستان و بوستان است.\nنثر گلستان کوتاه و پرمضمون و آمیخته به شعر است و به سبک «سهل ممتنع» معروف است.\nبرای فهم نثر قدیمی ، ابتدا معنی واژه‌های ناآشنا را از واژه‌نامه انتهای کتاب پیدا کنید."},{"type":"note","title":"روش معنی کردن جمله‌های نثر قدیمی","body":"ابتدا واژه‌های ناآشنا را از پانویس یا واژه‌نامه پیدا کنید.\nسپس فعل‌ها را مشخص کنید تا نهاد و انجام‌دهنده کار روشن شود.\nدر پایان ، معنی را با زبان امروزی و روان بنویسید ، نه ترجمه لفظ به لفظ."},{"type":"exam","title":"سوال امتحانی: از درس شکر نعمت ، دو نعمت بزرگ الهی نام ببرید و بگویید چرا شکرگزاری آن‌ها لازم است.","body":"پاسخ تشریحی:\nنمونه پاسخ: سلامتی و بینایی از نعمت‌های بزرگ خداوند است.\nسلامتی سرمایه کار و زندگی است و تا از دست ندهیم ارزش آن را نمی‌فهمیم؛ بینایی وسیله شناخت جهان زیبای پیرامون است.\nشکرگزاری لازم است چون همه این نعمت‌ها از خداوند است و سپاس او نشانه بندگی و سبب افزونی نعمت است.\nنکته امتحانی: به‌جای فهرست کردن ، برای هر نعمت یک دلیل کوتاه بنویسید تا پاسخ شما تشریحی و کامل باشد."},{"type":"exam","title":"سوال امتحانی: با توجه به درس ، کدام گزینه درست است؟ ۱) شکر نعمت باعث کاستی نعمت می‌شود ۲) انسان باید قدر نعمت‌ها را بداند ۳) ناسپاسی فضیلت است ۴) نعمت‌ها به‌خودی خود به دست می‌آیند","body":"پاسخ تشریحی:\nگزینه ۲ درست است؛ انسان باید قدر نعمت‌ها را بداند و شکرگزار باشد.\nگزینه ۱ نادرست است چون شکر نعمت نعمت را افزون می‌کند.\nگزینه ۳ نادرست است؛ ناسپاسی زشت و مایه کاستی نعمت است.\nگزینه ۴ نادرست است؛ نعمت‌ها از خداوند هستند و بی‌دلیل به دست نمی‌آیند.\nنکته امتحانی: در سوال‌های چهارگزینه‌ای ابتدا گزینه‌های آشکارا نادرست را حذف کنید تا انتخاب ساده‌تر شود."}]},{"number":2,"title":"مهر و وفا","pages":"۱۸ تا ۲۹","contents":[{"type":"answer","title":"در شعر «مهر و وفا» گوینده وفاداری خود را چگونه نشان می‌دهد؟ کنایه «چشم در راه بودن» یعنی چه؟","body":"گوینده شعر با تصویرهای مهربانانه ، انتظار کشیدن و پایداری در دوستی ، مهر و وفای خود را نشان می‌دهد.\nاو خود را در حال انتظار توصیف می‌کند و نشان می‌دهد که مهرش با دوری و سختی‌ها کمرنگ نمی‌شود.\nکنایه «چشم در راه بودن» یعنی مشتاقانه منتظر کسی ماندن.\nپیام شعر این است که مهر و وفا ارزشی والاست و دوست واقعی در سختی هم پایدار می‌ماند.","pageRef":"صفحه ۲۰"},{"type":"answer","title":"اجزای تشبیه را نام ببرید و با مثال «مهر او مانند خورشید است» اجزای تشبیه را مشخص کنید.","body":"اجزای تشبیه چهار جزء است: مشبه ، مشبه‌به ، ادات تشبیه و وجه شبه.\nدر مثال: مهر مشبه است ، خورشید مشبه‌به است ، مانند ادات تشبیه است و روشنایی و گرمی وجه شبه است.\nاگر هر چهار جزء بیاید تشبیه «مفصل» و اگر ادات تشبیه و وجه شبه حذف شود تشبیه «موجز» نامیده می‌شود.","pageRef":"صفحه ۲۴"},{"type":"note","title":"شعر «مهر و وفا» و شاعر آن","body":"شعر این درس از سیمین بهبهانی از شاعران بزرگ معاصر ایران است.\nاو به یکی از چیره‌دست‌ترین شاعران در قالب قطعه و غزل معروف است و تصویرهای نو دارد.\nمضمون شعر درس: پایداری در مهر و دوستی و انتظار وفادارانه."},{"type":"note","title":"کنایه و تفاوت آن با تشبیه","body":"کنایه یعنی بیان معنایی غیرمستقیم به‌جای گفتن مستقیم آن.\nدر تشبیه چیزی به چیزی مانند می‌شود ؛ در کنایه معنا از دل عبارت فهمیده می‌شود.\nمثال: «چشم در راه بودن» کنایه از انتظار کشیدن است.\nدر امتحان ادبیات همیشه ابتدا کنایه‌ها را در متن جدا کنید؛ سوال‌های زیادی از آن‌ها می‌آید."},{"type":"exam","title":"سوال امتحانی: پیام درس «مهر و وفا» را در دو خط بنویسید.","body":"پاسخ تشریحی:\nمهر و وفا از زیباترین ارزش‌های انسانی است و پایداری در دوستی نشانه بزرگی روح انسان است.\nدوست واقعی در روزهای سختی نیز کنار دوستش می‌ماند و قلبش وفادار است.\nاگر در روابطمان مهر و وفاداری را نگه داریم ، زندگی شیرین‌تر و اعتماد میان ما بیشتر می‌شود.\nنکته امتحانی: پیام را با جمله کامل بنویسید؛ پاسخ تک‌کلمه‌ای نمره کامل ندارد."},{"type":"exam","title":"سوال امتحانی: معنی واژه‌های «وفا» ، «بی‌قرار» و «صمیم» را بنویسید.","body":"پاسخ تشریحی:\nوفا: پایداری در دوستی و پایبندی به عهد و پیمان.\nبی‌قرار: ناآرام و بی‌تاب.\nصمیم: صادق و بی‌ریا.\nنکته امتحانی: در معنی واژه‌ها یک کلمه کافی نیست؛ معنی را با یک مترادف یا توضیح کوتاه بنویسید."}]},{"number":4,"title":"درس آزاد","pages":"۴۴ تا ۵۳","contents":[{"type":"answer","title":"برای درس آزاد چگونه یک متن مناسب انتخاب می‌کنید؟ مراحل کار را بنویسید.","body":"ابتدا موضوعی را انتخاب می‌کنم که به آن علاقه دارم؛ مانند داستان ، شعر یا متن دانشی.\nسپس منبع معتبر پیدا می‌کنم؛ مانند کتاب کتابخانه ، نشریه معتبر یا سایت‌های آموزشی مورد تأیید معلم.\nمتن را یک‌بار برای فهم کلی می‌خوانم و واژه‌های ناآشنا را با واژه‌نامه پیدا می‌کنم.\nدر پایان ، بخش‌های زیبا و مهم را علامت می‌زنم تا بتوانم در کلاس گزارش بدهم.","pageRef":"صفحه ۴۵"},{"type":"answer","title":"چگونه از کتابی که خوانده‌ایم گزارش خوبی در کلاس ارائه کنیم؟","body":"گزارش باید با نام کتاب و نویسنده شروع شود.\nموضوع و پیام اصلی کتاب را در دو سه جمله خلاصه می‌کنم.\nبخش مورد علاقه‌ام را توضیح می‌دهم و می‌گویم چرا آن بخش برایم جذاب بود.\nدر پایان نظر خودم را درباره کتاب می‌گویم و توصیه می‌کنم دوستان آن را بخوانند یا نخوانند و دلیل می‌آورم.\nزبان گزارش باید معیار و روان باشد و از جمله‌های بلند و تکراری پرهیز کنم.","pageRef":"صفحه ۴۸"},{"type":"note","title":"هدف درس آزاد","body":"درس آزاد برای پرورش عادت به مطالعه طراحی شده است.\nخود دانش‌آموز متن دلخواهش را انتخاب می‌کند و درباره آن مطالعه و تحقیق می‌کند.\nمهارت‌های این درس: انتخاب منبع معتبر ، خواندن دقیق ، خلاصه‌نویسی و بیان شفاهی در کلاس."},{"type":"note","title":"راز خلاصه‌نویسی خوب","body":"در خلاصه‌نویسی فقط نکته‌های اصلی متن را می‌آوریم؛ جزئیات فرعی و تکراری را حذف می‌کنیم.\nخلاصه باید با جمله‌های خودمان و کوتاه‌تر از متن اصلی باشد.\nنظر شخصی را با مطلب نویسنده ترکیب نکنید؛ نظر خود را جداگانه بنویسید."},{"type":"exam","title":"سوال امتحانی: اگر بخواهید از کتابی که خوانده‌اید در کلاس گزارش بدهید ، گزارش شما باید شامل چه بخش‌هایی باشد؟","body":"پاسخ تشریحی:\nگزارش شامل این بخش‌هاست: نام کتاب و نویسنده ، موضوع و پیام کتاب ، خلاصه بخش‌های خوانده‌شده ، بخش مورد علاقه و دلیل آن و در پایان نظر و پیشنهاد خودم.\nنکته امتحانی: گزارش را با مقدمه کوتاه شروع کنید و با جمع‌بندی پایان دهید؛ نظم و ترتیب گزارش نمره زیادی دارد."},{"type":"exam","title":"سوال امتحانی: کدام مورد نشانه متن معتبر است؟ ۱) بدون نام نویسنده باشد ۲) ناشر یا سایت معتبر داشته باشد ۳) لحن تحریک‌آمیز داشته باشد ۴) منابع آن ذکر نشده باشد","body":"پاسخ تشریحی:\nگزینه ۲ درست است؛ داشتن ناشر یا سایت معتبر نشانه اعتبار متن است.\nمتن معتبر معمولا نام نویسنده و منابع را ذکر می‌کند و لحنی آرام و مستدل دارد؛ پس گزینه‌های ۱ و ۳ و ۴ نشانه بی‌اعتباری متن‌اند.\nنکته امتحانی: در سوال‌های مربوط به اعتبار منبع ، به نام نویسنده ، منابع و ناشر معتبر اشاره کنید."}]}]},{"title":"مطالعات اجتماعی نهم","subject":"مطالعات اجتماعی","description":"جهانی شدن، محیط زیست، تاریخ معاصر و مدنی","color":"orange","icon":"globe","chapters":[{"number":1,"title":"گوی آبی زیبا","pages":"۸ تا ۲۲","contents":[{"type":"answer","title":"چرا به زمین گوی آبی می‌گویند؟ چند درصد سطح زمین را آب پوشانده و سهم آب شیرین چقدر است؟","body":"از فضا زمین به رنگ آبی دیده می‌شود؛ زیرا حدود ۷۱ درصد سطح آن را آب اقیانوس‌ها و دریاها پوشانده است.\nپس بیشتر سطح زمین آب است ولی این آب عمدتا شور است.\nفقط حدود ۳ درصد از کل آب‌های زمین شیرین است.\nبخش بزرگ آب شیرین در یخچال‌های طبیعی و یخ‌های قطبی ذخیره شده و بخشی هم به‌صورت آب‌های زیرزمینی و رودها و دریاچه‌ها است.\nبه همین دلیل باید در مصرف آب شیرین صرفه‌جویی کنیم.","pageRef":"صفحه ۹"},{"type":"answer","title":"اقیانوس‌های اصلی جهان را نام ببرید و بزرگ‌ترین آن‌ها را معرفی کنید.","body":"اقیانوس‌های اصلی جهان عبارت‌اند از: اقیانوس آرام ، اقیانوس اطلس ، اقیانوس هند و اقیانوس منجمد شمالی.\nاقیانوس آرام بزرگ‌ترین و عمیق‌ترین اقیانوس جهان است و میان آسیا و قاره آمریکا قرار دارد.\nاقیانوس اطلس میان قاره‌های آمریکا ، اروپا و آفریقا و اقیانوس هند میان آفریقا ، آسیا و استرالیا است.\nاقیانوس منجمد شمالی در قطب شمال قرار دارد و کوچک‌ترین آن‌ها است.","pageRef":"صفحه ۱۲"},{"type":"note","title":"قاره‌های زمین","body":"خشکی‌های زمین در قاره‌های آسیا ، اروپا ، آفریقا ، آمریکای شمالی ، آمریکای جنوبی ، استرالیا و جنوبگان پراکنده‌اند.\nآسیا بزرگ‌ترین و پرجمعیت‌ترین قاره است و ایران در آن قرار دارد.\nجنوبگان (قطب جنوب) پوشیده از یخ است و ساکن دائمی ندارد."},{"type":"note","title":"آب‌های زمین در یک نگاه","body":"آب‌های زمین دو گروه‌اند: آب شور (اقیانوس‌ها و دریاها) و آب شیرین (رودها ، دریاچه‌های شیرین ، چشمه‌ها و آب‌های زیرزمینی).\nبیشتر آب شیرین زمین به شکل یخ در قطب‌ها و کوه‌های بلند ذخیره شده است.\nبرای آینده بشر ، مصرف درست و صرفه‌جویی در آب شیرین بسیار مهم است."},{"type":"exam","title":"سوال امتحانی: سه ویژگی زمین که زندگی را روی آن ممکن کرده است ، بنویسید.","body":"پاسخ تشریحی:\nوجود آب مایع به مقدار فراوان که پایه حیات است.\nوجود جو (هواکره) مناسب با اکسیژن برای تنفس و لایه ازون برای گرفتن پرتوهای خطرناک خورشید.\nفاصله مناسب از خورشید که دمای مناسبی برای زندگی ایجاد می‌کند.\n(نیروی گرانش مناسب هم از دیگر ویژگی‌های زمین است.)\nنکته امتحانی: ویژگی‌ها را شماره‌گذاری کنید و برای هر یک یک توضیح کوتاه بنویسید."},{"type":"exam","title":"سوال امتحانی: درست یا نادرست؟ بیشتر آب شیرین زمین در رودها و دریاچه‌ها است. دلیل بیاورید.","body":"پاسخ تشریحی:\nنادرست است.\nبیشتر آب شیرین زمین به‌صورت یخ در یخچال‌های طبیعی و قطب‌ها ذخیره شده و بخش قابل توجهی هم در عمق زمین به‌صورت آب زیرزمینی است.\nرودها و دریاچه‌ها فقط بخش کوچکی از آب شیرین زمین را تشکیل می‌دهند.\nنکته امتحانی: در سوال‌های درست و نادرست ، عبارت درست را با توضیح بازنویسی کنید تا نمره کامل بگیرید."}]},{"number":6,"title":"زیست‌بوم‌ها در خطرند","pages":"۷۴ تا ۸۴","contents":[{"type":"answer","title":"سه عامل اصلی که زیست‌بوم‌ها را تهدید می‌کند نام ببرید و یکی را با مثال توضیح دهید.","body":"سه عامل مهم: گسترش شهرها و جاده‌سازی ، شکار بی‌رویه جانوران و آلودگی محیط زیست (همراه با خشکسالی و تغییرات اقلیمی).\nتوضیح نمونه: با گسترش شهرها و ساخت جاده در دل جنگل‌ها و مراتع ، زیستگاه جانوران و گیاهان کوچک‌تر و تکه‌تکه می‌شود.\nجانوران فضای کمتر و خوراک کمتر پیدا می‌کنند و جمعیتشان کاهش می‌یابد؛ مانند کوچک شدن زیستگاه یوزپلنگ آسیایی در دشت‌های ایران.","pageRef":"صفحه ۷۶"},{"type":"answer","title":"برای حفاظت از زیست‌بوم‌ها و گونه‌های در خطر انقراض چه کارهایی انجام می‌شود؟","body":"ایجاد مناطق حفاظت‌شده و پارک‌های ملی که در آن‌ها شکار ممنوع است.\nقانون‌گذاری و نظارت برای جلوگیری از شکار بی‌رویه و فروش غیرقانونی جانوران.\nتکثیر و پرورش گونه‌های در خطر در مراکز پرورش و بازگرداندن آن‌ها به طبیعت.\nآموزش مردم و مشارکت همگانی در حفاظت از محیط زیست.\nبا این کارها زیستگاه‌ها سالم می‌مانند و گونه‌ها از انقراض نجات پیدا می‌کنند.","pageRef":"صفحه ۸۰"},{"type":"note","title":"زیست‌بوم چیست؟","body":"زیست‌بوم منطقه پهناوری است با آب‌وهوا و پوشش گیاهی و جانوری ویژه؛ مانند جنگل‌های سوزنی‌برگ ، جنگل‌های مرطوب استوایی ، علفزارها و بیابان‌ها.\nعوامل زنده (گیاهان و جانوران) و عوامل غیرزنده (آب ، خاک ، هوا) در زیست‌بوم به هم وابسته‌اند.\nایران هم زیست‌بوم‌های متنوعی دارد؛ از جنگل‌های هیرکانی تا بیابان‌های مرکزی."},{"type":"note","title":"گونه‌های در خطر انقراض ایران","body":"برخی گونه‌های در خطر انقراض ایران: یوزپلنگ آسیایی ، آهوی ایرانی ، پلنگ ایرانی و هوبره.\nعلت اصلی: شکار بی‌رویه و نابودی و تکه‌تکه شدن زیستگاه‌ها.\nیوزپلنگ آسیایی از کمیاب‌ترین گربه‌ساران جهان است و تنها در دشت‌های کویری ایران باقی مانده است."},{"type":"exam","title":"سوال امتحانی: گرم شدن آب‌وهوای زمین چگونه زیست‌بوم‌ها را تهدید می‌کند؟ دو مورد بنویسید.","body":"پاسخ تشریحی:\nبا گرم شدن زمین ، یخچال‌ها و یخ‌های قطبی آب می‌شوند و زیستگاه جانورانی مانند خرس قطبی از بین می‌رود.\nتغییر الگوی بارش و افزایش خشکسالی ، تالاب‌ها و دریاچه‌ها را خشک می‌کند و مراتع ضعیف می‌شوند.\nبسیاری از گونه‌ها به مناطق سردتر کوچ می‌کنند و اگر نتوانند خود را با شرایط جدید وفق دهند در خطر انقراض می‌افتند.\nنکته امتحانی: هر مورد را با یک مثال یا پیامد روشن بنویسید تا پاسخ تشریحی کامل شود."},{"type":"exam","title":"سوال امتحانی: اگر شکارچی اصلی یک زیست‌بوم حذف شود ، زنجیره غذایی چه تغییری می‌کند؟ با مثال توضیح دهید.","body":"پاسخ تشریحی:\nبا حذف شکارچی ، تعداد جانوران گیاه‌خوار زیاد می‌شود.\nگیاه‌خواران فراوان ، پوشش گیاهی منطقه را بیش از حد می‌خورند و پوشش گیاهی تخریب می‌شود.\nسپس خاک فرسایش می‌یابد و دیگر جانوران هم خوراک و پناهگاه خود را از دست می‌دهند.\nمثال: اگر شکارچی‌های آهو حذف شوند ، ابتدا تعداد آهو زیاد و سپس با کمبود گیاهان کاهش می‌یابد.\nنکته امتحانی: تغییرها را مرحله به مرحله و به ترتیب بنویسید؛ ترتیب رویدادها در زیست‌شناسی بسیار مهم است."}]},{"number":12,"title":"عصر مشروطیت","pages":"۱۴۶ تا ۱۵۸","contents":[{"type":"answer","title":"چرا مردم ایران در اواخر دوره قاجار به مشروطه‌خواهی برخاستند؟","body":"حکومت قاجار استبدادی بود و شاه پاسخگوی مردم نبود.\nشاهان با امتیاز دادن منابع کشور به بیگانگان (مانند امتیاز تنباکو و امتیاز دارسی) استقلال کشور را به خطر انداخته بودند.\nوضع اقتصادی مردم بد بود؛ گرانی و قحطی گسترده شده بود.\nمردم با مطبوعات و ارتباط با کشورهای دیگر از پیشرفت و قانون‌مندی آگاه شده بودند.\nمفاخر دینی و روشنفکران مردم را همراهی کردند و خواستار تشکیل عدالتخانه و حکومت قانون شدند.","pageRef":"صفحه ۱۴۸"},{"type":"answer","title":"مشروطه یعنی چه؟ فرمان مشروطیت را چه کسی صادر کرد و در پی آن چه اتفاقی افتاد؟","body":"مشروطه یعنی حکومتی که در آن قدرت شاه محدود می‌شود و همه از جمله خود شاه باید قانون را رعایت کنند.\nمظفرالدین‌شاه قاجار در سال ۱۲۸۵ خورشیدی فرمان مشروطیت را امضا کرد.\nدر پی آن نخستین مجلس شورای ملی تشکیل شد تا نمایندگان مردم در تصویب قوانین مشارکت کنند.\nهمچنین قانون اساسی و متمم آن تدوین شد که حقوق ملت و وظایف حکومت را مشخص می‌کرد.","pageRef":"صفحه ۱۵۰"},{"type":"note","title":"رویدادهای آغاز جنبش مشروطه","body":"آغاز جنبش: اعتراض به گرانی قند و شکر و تازیانه زدن بازرگانان تهران ، تحصن علما و مردم در مسجد و پناه بردن به سفارت انگلیس.\nسپس مظفرالدین‌شاه فرمان مشروطه را امضا کرد و نخستین مجلس شورای ملی گشایش یافت.\nشعار اصلی مردم: تشکیل عدالتخانه و قانونی شدن حکومت."},{"type":"note","title":"استبداد صغیر به چه معناست؟","body":"محمدعلی‌شاه با مشروطه مخالف بود و در سال ۱۲۸۷ با کمک نیروهای قزاق مجلس شورای ملی را به توپ بست.\nبه این دوره کوتاه حکومت استبدادی «استبداد صغیر» می‌گویند.\nسرانجام مشروطه‌خواهان از تبریز ، گیلان و اصفهان به تهران آمدند ، شهر را فتح کردند ، محمدعلی‌شاه را خلع و احمدشاه را به سلطنت رساندند و مجلس را دوباره گشودند."},{"type":"exam","title":"سوال امتحانی: مجلس شورای ملی را چه کسی و چرا به توپ بست؟ نتیجه آن چه شد؟","body":"پاسخ تشریحی:\nمحمدعلی‌شاه در سال ۱۲۸۷ با کمک قزاق‌ها مجلس شورای ملی را به توپ بست.\nدلیل آن مخالفت او با مشروطه بود؛ چون مجلس قدرت شاه را محدود می‌کرد و بر کار مستبدها نظارت می‌شد.\nنتیجه: دوره استبداد صغیر آغاز شد ولی مردم تبریز به رهبری ستارخان و باقرخان مقاومت کردند و سرانجام مشروطه‌خواهان تهران را فتح کردند ، شاه را خلع و مجلس را بازگشایی کردند.\nنکته امتحانی: سال رویدادها را دقیق بنویسید (۱۲۸۵ فرمان مشروطه و ۱۲۸۷ به توپ بستن مجلس)؛ در امتحان تاریخ به سال‌ها نمره داده می‌شود."},{"type":"exam","title":"سوال امتحانی: نقش علما و نقش روشنفکران و بازاریان را در پیروزی جنبش مشروطه بنویسید.","body":"پاسخ تشریحی:\nنقش علما: رهبری اعتراض‌ها و تحصن‌ها ، پشتیبانی از خواسته مردم برای عدالتخانه و قانون و هدایت جنبش.\nنقش روشنفکران: آگاه کردن مردم با مطبوعات و تشکیل انجمن‌های مخفی.\nنقش بازاریان: تعطیلی بازار و اعتصاب و تأمین بخشی از هزینه‌های جنبش.\nهمین همراهی گروه‌های مختلف مردم باعث پیروزی مشروطه شد.\nنکته امتحانی: نقش هر گروه را جدا و شماره‌دار بنویسید تا نمره هر بخش جداگانه محاسبه شود."}]}]},{"title":"عربی نهم","subject":"عربی","description":"لغت و قواعد عربی با تمرین‌های کاربردی","color":"teal","icon":"languages","chapters":[{"number":1,"title":"عَوْدَةٌ مِنَ الْحَجّ","pages":"۶ تا ۱۸","contents":[{"type":"answer","title":"ترجمه کنید: هٰذَا کِتَابٌ جَدِیدٌ وَ تِلْکَ سَیّارَةٌ جَمِیلَةٌ.","body":"هٰذَا کِتَابٌ جَدِیدٌ: این یک کتاب نو است.\nتِلْکَ سَیّارَةٌ جَمِیلَةٌ: آن یک خودروی زیباست.\nهٰذَا برای مذکرِ نزدیک و تِلْکَ برای مؤنثِ دور به کار می‌رود؛ در ترجمه، «این» یا «آن» را بسته به نزدیکی یا دوریِ شیء انتخاب می‌کنیم.","pageRef":"صفحه ۸"},{"type":"answer","title":"اگر بگوییم هٰؤُلَاءِ مُدَرِّسَاتٌ وَ أُولٰئِکَ طُلّابٌ، ترجمه درست چیست؟","body":"هٰؤُلَاءِ مُدَرِّسَاتٌ: این‌ها چند آموزگار زن هستند.\nأُولٰئِکَ طُلّابٌ: آن‌ها چند دانش‌آموز هستند.\nاسم اشاره برای جمعِ مکسرِ غیرواوی به همین شکل می‌آید؛ اما توجه کنید که اسم اشاره با مفردِ بعد از خود از نظر جنس مطابقت می‌کند، نه با خودِ جمع: هٰؤُلَاءِ برای مؤنث‌ها و أُولٰئِکَ برای مذکرها.","pageRef":"صفحه ۱۱"},{"type":"note","title":"قاعده اسم اشاره (أسماء الإشارة)","body":"برای نزدیک: هٰذَا (مذکر)، هٰذِهِ (مؤنث)، هٰؤُلَاءِ (جمع مکسر).\nبرای دور: ذٰلِکَ (مذکر)، تِلْکَ (مؤنث)، أُولٰئِکَ (جمع مکسر).\nاسم اشاره با مفردِ پس از خود از نظر مذکر یا مؤنث بودن مطابقت دارد."},{"type":"note","title":"اشتباه رایج در ترجمه اسم اشاره","body":"عرب‌ها با اسم اشاره مذکر، مؤنث را هم نشان می‌دهند: هٰذَا بِنْتٌ یعنی «این دختر است» و صحیح است.\nپس نباید جمله‌ای مثل هٰذِهِ بِنْتٌ ساخت؛ ملاک، جنسِ کلمه‌ای است که بعد از اسم اشاره می‌آید، نه همیشه هٰذَا برای پسر و هٰذِهِ برای دختر."},{"type":"exam","title":"ترجمه صحیح تِلْکَ جِبَالٌ عَالِیَةٌ کدام است؟","body":"پاسخ: آن کوه‌های بلند هستند.\nتِلْکَ در عربی برای دوری به کار می‌رود و با جمع مکسر، «آن‌ها» ترجمه می‌شود؛ چون جِبَال جمع است، در فارسی هم جمع می‌آید.\nنکته امتحانی: اسم اشاره با مفردِ بعد از خود مطابقت دارد، اما در ترجمه به جمع بودنِ معنا دقت کنید."},{"type":"exam","title":"جای خالی را پر کنید: ........ مُعَلِّمَةٌ (این خانم آموزگار است) — هٰذَا یا هٰذِهِ؟","body":"پاسخ: هٰذِهِ مُعَلِّمَةٌ.\nچون مُعَلِّمَة مؤنث است، اسم اشاره مؤنثِ نزدیک یعنی هٰذِهِ می‌آید.\nنکته امتحانی: اول جنسِ (مذکر یا مؤنث) کلمه‌ای را که بعد از اسم اشاره می‌آید پیدا کنید، سپس اسم اشاره مناسب را انتخاب کنید."}]},{"number":5,"title":"اَلْقُرْآنُ الْکَرِیم","pages":"۴۲ تا ۵۴","contents":[{"type":"answer","title":"ترجمه کنید: اَلَّذِینَ یُؤْمِنُونَ بِالْغَیْبِ.","body":"اَلَّذِینَ یُؤْمِنُونَ بِالْغَیْبِ: آنان که به نادیده ایمان می‌آورند.\nاَلَّذِینَ اسم موصول جمعِ مذکر است و در فارسی «کسانی که» یا «آنان که» ترجمه می‌شود.\nیُؤْمِنُونَ فعل مضارعِ جمع مذکر است: ایمان می‌آورند؛ واو آخر فعل نشانه جمع بودن فاعل است.","pageRef":"صفحه ۴۶"},{"type":"answer","title":"ترجمه کنید: اَلطّالِبَةُ اَلَّتِی اجْتَهَدَتْ نَجَحَتْ.","body":"دانش‌آموز زنی که تلاش کرد، موفق شد.\nاَلَّتِی اسم موصول مؤنث است و جمله اَلَّتِی اجْتَهَدَتْ برای توصیفِ اَلطّالِبَة آمده است.\nچون موصول مؤنث است، فعل‌ها هم مؤنث آمده‌اند: اجْتَهَدَتْ (تلاش کرد) و نَجَحَتْ (موفق شد).","pageRef":"صفحه ۴۸"},{"type":"note","title":"قاعده اسم موصول","body":"اَلَّذِی: مذکر مفرد (کسی که)، اَلَّتِی: مؤنث مفرد (کسی که)، اَلَّذِینَ: جمع مذکر (آنان که)، اَللّاتِی و اَللّواتِی: جمع مؤنث (کسانی که).\nمعنی همه اسم‌های موصول «که» است؛ برای ترجمه از «کسی که، چیزی که، آنان که» استفاده می‌کنیم."},{"type":"note","title":"ترفند تشخیص اسم موصول","body":"اسم موصول همیشه بعد از اسم معرفه (کلمه‌ای که ال دارد) می‌آید و به همان اسم برمی‌گردد.\nفعلِ بعد از آن هم از نظر جنس و شمار با اسمِ قبل هماهنگ است:\nاَلطّالِبُ اَلَّذِی ذَهَبَ (دانش‌آموزی که رفت) / اَلطّالِبَاتُ اَلَّتِی ذَهَبْنَ (دانش‌آموزانی که رفتند)."},{"type":"exam","title":"کدام ترجمه درست است؟ اَلْمُؤْمِنُونَ اَلَّذِینَ یُحِبُّونَ اَلْعِلْمَ","body":"پاسخ: آن مؤمنانی که علم را دوست می‌دارند.\nاَلَّذِینَ جمع مذکر است، پس مؤمنان و فعل آن هم به صورت جمع (دوست می‌دارند) ترجمه می‌شود.\nنکته امتحانی: اول شمار و جنسِ موصول را از اسمِ پیش از آن پیدا کنید، سپس فعل را هماهنگ با آن ترجمه کنید."},{"type":"exam","title":"کدام گزینه با اَلَّذِینَ درست است: اَلَّذِینَ یَجْتَهِدُ یا اَلَّذِینَ یَجْتَهِدُونَ؟","body":"پاسخ: اَلَّذِینَ یَجْتَهِدُونَ درست است.\nفعل مضارع برای جمع مذکر باید واو جمع بگیرد: یَجْتَهِدُونَ یعنی تلاش می‌کنند.\nنکته امتحانی: فعلِ بعد از اسم موصولِ جمع نیز باید جمع باشد؛ با حذف واو، فعل مفرد می‌شود و جمله نادرست است."}]},{"number":9,"title":"اَلْعِلْمُ نُور","pages":"۸۲ تا ۹۴","contents":[{"type":"answer","title":"فعل امر از مضارع یَرْفَعُ بسازید و صیغه‌های آن را معنی کنید.","body":"امر مخاطب مذکر: اِرْفَعْ (بلند کن — تو).\nامر مخاطب مؤنث: اِرْفَعِی (بلند کن — تو دختر).\nامر دو نفر مخاطب: اِرْفَعَا (بلند کنید — شما دو نفر).\nامر جمع مخاطب: اِرْفَعُوا (بلند کنید — شماها).\nبرای ساختن امر، حرف مضارعه را حذف می‌کنیم و حرکت اول کلمه را به همزه وصل تبدیل می‌کنیم: یَرْفَعُ ← اِرْفَعْ.","pageRef":"صفحه ۸۴"},{"type":"answer","title":"ترجمه کنید: لَا تَکْتُبْ عَلَی الْجِدَارِ.","body":"لَا تَکْتُبْ عَلَی الْجِدَارِ: روی دیوار ننویس.\nلَا در اینجا حرف نهی است و فعل مضارع را مجزوم می‌کند؛ پس لَا تَکْتُبْ یعنی «ننویس (تو)».\nاگر فعل به وصل یا اَلِف ختم نشود، آخر آن ساکن می‌ماند: لَا تَلْعَبْ (بازی نکن).","pageRef":"صفحه ۸۷"},{"type":"note","title":"قاعده فعل امر","body":"امر یعنی درخواستِ انجام کار از دیگری و چهار صیغه رایج دارد: اِفْعَلْ، اِفْعَلِی، اِفْعَلَا، اِفْعَلُوا.\nفعل امر از مضارعِ مخاطب ساخته می‌شود: تَکْتُبُ ← اُکْتُبْ (بنویس) و تَجْلِسُ ← اِجْلِسْ (بنشین).\nحرکت همزه وصل، از روی حرکت حرف دوم مضارع گرفته می‌شود."},{"type":"note","title":"قاعده فعل نهی و لَای نهی","body":"نهی یعنی بازداشتن از کاری و با لَا + مضارعِ مجزوم ساخته می‌شود: لَا تَخْرُجْ (بیرون نرو).\nدو فعل با حرف فَ به هم وصل می‌شوند: لَا تَخْرُجْ فَلَا تَلْعَبْ یعنی بیرون نرو و بازی نکن.\nدر نهی جمع مخاطب، فعل به این شکل می‌آید: لَا تَخْرُجُوا (بیرون نروید)."},{"type":"exam","title":"کدام ترجمه درست است؟ اِجْلِسُوا هُنَا","body":"پاسخ: اینجا بنشینید.\nهمزه اول و واو جمع در آخر فعل، نشانه امر جمعِ مخاطب است؛ پس ترجمه جمع (بنشینید) می‌آید نه مفرد (بنشین).\nنکته امتحانی: در ترجمه امر و نهی، اول شمارِ مخاطب را از آخرِ فعل پیدا کنید."},{"type":"exam","title":"خطای جمله زیر را پیدا و اصلاح کنید: لَا تَلْعَبُونَ فِی الشّارِعِ","body":"پاسخ: صورت درست آن لَا تَلْعَبْ فِی الشّارِعِ است (در خیابان بازی نکن).\nبعد از لَای نهی، فعل مضارع باید مجزوم بیاید و واو جمع نگیرد.\nنکته امتحانی: اگر بعد از لَای نهی فعل واو جمع یا نون جمع گرفت، جمله از نظر قاعده نادرست است."}]}]},{"title":"زبان انگلیسی نهم","subject":"انگلیسی","description":"English Book 9 - Learn, Practice, Communicate","color":"pink","icon":"message","chapters":[{"number":1,"title":"Lesson 1: Personality","pages":"۶ تا ۱۹","contents":[{"type":"answer","title":"Complete the dialogue: What is your friend like? — He is ....... (three adjectives).","body":"پاسخ نمونه: He is kind, generous and hard-working. (او مهربان، بخشنده و سخت‌کوش است.)\nسوال What is he like? درباره شخصیت و اخلاق است، نه ظاهر.\nپس در پاسخ، صفت‌های شخصیتی مثل kind، shy، funny و honest می‌آوریم.","pageRef":"صفحه ۸"},{"type":"answer","title":"ترجمه کنید: My sister is not talkative; she is a bit shy.","body":"خواهر من پرحرف نیست؛ او کمی خجالتی است.\nصفت در انگلیسی بعد از فعل to be می‌آید: is talkative یعنی پرحرف است.\nعبارت a bit یعنی «کمی» و قبل از صفت می‌آید: a bit shy یعنی کمی خجالتی.","pageRef":"صفحه ۱۰"},{"type":"note","title":"صفت‌های مهم شخصیت","body":"kind = مهربان، generous = بخشنده، hard-working = سخت‌کوش.\ntalkative = پرحرف، shy = خجالتی، funny = بامزه.\nhonest = صادق، lazy = تنبل، friendly = خوش‌برخورد."},{"type":"note","title":"تفاوت What is he like? و What does he look like?","body":"What is he like? درباره شخصیت است: He is kind. (او مهربان است.)\nWhat does he look like? درباره ظاهر است: He is tall with brown hair. (قدبلند است و موی قهوه‌ای دارد.)\nاشتباه گرفتن این دو سوال، از خطاهای رایج امتحان است."},{"type":"exam","title":"Choose the correct option: My brother ...... funny. He makes us laugh. (is / are / am)","body":"پاسخ: is.\nبرای فاعل he/she/it از is استفاده می‌شود: My brother is funny.\nنکته امتحانی: اول فاعل را پیدا کنید، بعد فعل to be را مطابق آن بنویسید: I am، he/she/it is، we/you/they are."},{"type":"exam","title":"با کلمات داده‌شده جمله بسازید: generous / is / My mother /
