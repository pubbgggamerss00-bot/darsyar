ان‌ها شمرده می‌شود."}]},{"number":10,"title":"الگوی عدالت","pages":"۱۱۹ تا ۱۳۰","contents":[{"type":"answer","title":"چرا امام علی ع نماد و الگوی عدالت است؟","body":"زیرا در حکومت خود حق همه، حتی غیرمسلمانان و کارگران را رعایت می‌کرد؛ نزدیکان خود را از بهره‌برداری ناروا از بیت‌المال بازمی‌داشت، شب‌ها با نان خشک و لباس ساده زندگی می‌کرد و کسی را به دلیل مقام بر دیگری برتری نمی‌داد.","pageRef":"صفحه ۱۲۲"},{"type":"answer","title":"مهم‌ترین توصیه‌های امام علی ع در نامه مالک اشتر چیست؟","body":"امام ع توصیه می‌کند دل مردم را بجوید، با آنان نرم‌خُلق باشد، به سبب قدرت به کسی ستم نکند، در کارها مشورت کند و حق هر گروه را بدهد؛ زیرا حاکم خادم مردم است و اگر مردم از حاکم ناخشنود شوند، حکومت پایدار نمی‌ماند.","pageRef":"صفحه ۱۲۶"},{"type":"note","title":"عدالت، پایه حکومت","body":"امام علی ع می‌فرماید: عدالت، اساس و پایه زندگی مردم است. حکومتی که عدالت را رعایت کند پایدار می‌ماند و ملت با جان و دل از آن پشتیبانی می‌کنند؛ اما حکومت ستمگر، هر چند قدرتمند، دیری نمی‌پاید و فرو می‌ریزد."},{"type":"note","title":"حدیث نیکی به مردم","body":"امام علی ع فرمود: أَحسِن إلَى النّاسِ تَستَعبِد قُلوبَهُم\nترجمه: به مردم نیکی کن، دل‌هایشان را در بند خود می‌آوری.\nمحبت‌آفرینی با عدالت و نیکی، پیوند مردم با حاکم عادل را استوار می‌کند."},{"type":"exam","title":"رفتار امام علی ع با بیچارگان چگونه بود؟","body":"پاسخ تشریحی: آن حضرت شب‌ها با نان و نمک ساده افطار می‌کرد و درآمد خود را با بیچارگان تقسیم می‌نمود؛ یتیمان و درماندگان را سرپرستی می‌کرد و از خزانه بیت‌المال، حتی یک درهم بیش از سهم خود و خانواده‌اش برنمی‌داشت."},{"type":"exam","title":"مظلومیت امام علی ع پس از رحلت پیامبر ص را توضیح دهید.","body":"پاسخ تشریحی: پس از پیامبر ص، حق خلافت از آن حضرت گرفته شد؛ اما او برای حفظ وحدت اسلام و پرهیز از خون‌ریزی مسلمانان صبر کرد، در راه دین جانبازی نمود و سرانجام به فرمان خدا، امامت آشکار امت را پذیرفت و به عدالت رفتار کرد."}]},{"number":11,"title":"اخلاق نیکو","pages":"۱۳۱ تا ۱۴۲","contents":[{"type":"answer","title":"چرا اخلاق نیکو در اسلام اهمیت فراوان دارد؟","body":"زیرا هدف پیامبر ص، کامل کردن اخلاق نیکو در جامعه بود. با اخلاق نیک، دوستی، امنیت و آرامش در زندگی پدید می‌آید، انسان نزد خدا محبوب می‌شود و جامعه از دشمنی، کینه و بداخلاقی در امان می‌ماند و پیشرفت می‌کند.","pageRef":"صفحه ۱۳۴"},{"type":"answer","title":"برای خوش‌رفتاری با دیگران چه کارهایی لازم است؟","body":"باید با رخسار گشاده و سخن نیکو با دیگران رفتار کنیم، به آنان احترام بگذاریم، در سختی‌ها یاری‌شان کنیم، عیب‌جو نباشیم، عفو و گذشت داشته باشیم، حقشان را ادا کنیم و در دوستی و پیمان با آنان وفادار بمانیم.","pageRef":"صفحه ۱۳۸"},{"type":"note","title":"سنگینی حسن خلق","body":"پیامبر ص فرمود: ما يُوضَعُ في الميزانِ شَيءٌ أثقَلُ مِن حُسنِ الخُلُقِ\nترجمه: هیچ چیزی سنگین‌تر از خوش‌اخلاقی در ترازوی اعمال گذاشته نمی‌شود.\nخوش‌اخلاقی، سرمایه‌ای گران‌بها برای روز قیامت است."},{"type":"note","title":"برادری مؤمنان","body":"قرآن می‌فرماید: ﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾\nترجمه: مؤمنان تنها برادر یکدیگرند.\nپس باید حق برادر دینی را رعایت کنیم: یاری او در سختی، صداقت با او و دفاع از آبرویش."},{"type":"exam","title":"برخی دستورهای اخلاقی قرآن در برخورد با دیگران را نام ببرید.","body":"پاسخ تشریحی: وفا به عهد و پیمان، راستگویی در سخن، ادای امانت، احترام به پدر و مادر، نیکی به همسایه و مسافر، کمک به نیازمندان، عفو و گذشت و پرهیز از عیب‌جویی، غیبت و مسخره کردن مردم، از دستورهای اخلاقی قرآن است."},{"type":"exam","title":"چرا راستگویی از ارکان اخلاق شمرده می‌شود؟","body":"پاسخ تشریحی: زیرا دروغ اعتماد میان انسان‌ها را از بین می‌برد و جامعه را به بی‌اعتمادی و فساد می‌کشاند. راستی نشانه ایمان است و در روایات، دروغگو از مؤمن شمرده نشده است؛ پس راستگویی پایه همه خوبی‌ها و اعتماد اجتماعی است."}]},{"number":12,"title":"برنامه خداداد","pages":"۱۴۳ تا ۱۶۵","contents":[{"type":"answer","title":"فلسفه روزه چیست؟","body":"روزه برنامه خداداد برای خودسازی است؛ انسان با روزه بر هوای نفس پیروز می‌شود، همدلی با گرسنگان پیدا می‌کند و دلش برای تلاوت قرآن و نیایش آماده می‌شود. قرآن هدف روزه را رسیدن به تقوا و پرهیزکاری معرفی می‌کند.","pageRef":"صفحه ۱۴۶"},{"type":"answer","title":"فواید اجتماعی و جسمی روزه چیست؟","body":"روزه سبب همدلی فقرا و غنی‌ها می‌شود و ثروتمندان را به کمک به نیازمندان برمی‌انگیزد؛ همچنین آرامش جسم، تنظیم خوردن و آشامیدن، پاک شدن بدن و درمان برخی بیماری‌ها، از فواید جسمی و بهداشتی روزه شمرده شده است.","pageRef":"صفحه ۱۵۰"},{"type":"note","title":"شأن ماه رمضان","body":"ماه رمضان، ماه قرآن و ماه مهمانی خداست. در این ماه درهای آسمان به روی نعمت‌های خدا باز می‌شود، شیطان در بند است و گناهکاران با توبه به سوی او بازمی‌گردند؛ شب قدر، نقطه اوج این برنامه خداداد است."},{"type":"note","title":"آیه روزه","body":"قرآن می‌فرماید: ﴿كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ﴾\nترجمه: روزه بر شما واجب شد، چنان‌که بر پیشینیان واجب بود، تا پرهیزگار شوید.\nروزه رمز پرواز به سوی خداست."},{"type":"exam","title":"اثر روزه بر روح و رفتار انسان را توضیح دهید.","body":"پاسخ تشریحی: روزه اراده انسان را نیرومند می‌کند و او را بر خواسته‌های نفس مسلط می‌سازد؛ مهربانی و همدلی را در دل بیدار می‌کند، از غرور و زیاده‌خواهی می‌کاهد و زمینه عبادت، انس با قرآن و بازگشت به خدا را فراهم می‌آورد."},{"type":"exam","title":"چرا گفته می‌شود روزه برنامه‌ای خداداد است؟","body":"پاسخ تشریحی: زیرا روزه را خداوند مقرر کرده است، نه بشر؛ برنامه‌ای که امت‌های پیشین نیز موظف بودند و هدف آن تقواست. خداوند با دانایی بی‌پایان، این برنامه را برای رشد جسم و جان انسان و رسیدن او به کمال برگزیده است."}]}]},{"title":"کار و فناوری نهم","subject":"کار و فناوری","description":"راهنمای کامل کارگاه‌های کتاب کار و فناوری نهم با نکات و سوالات امتحانی","color":"red","icon":"wrench","chapters":[{"number":1,"title":"معماری و سازه","pages":"۶ تا ۲۸","contents":[{"type":"answer","title":"فعالیت: نقشه اتاق خود را با مقیاس یک به پنجاه ترسیم کنید.","body":"ابتدا طول و عرض اتاق را با متر اندازه می‌گیریم؛ مثلاً ۴ متر و ۳ متر. در مقیاس ۱/۵۰ هر ۵۰ سانتی‌متر واقعی برابر ۱ سانتی‌متر روی کاغذ است؛ پس ضلع‌ها ۸ و ۶ سانتی‌متر می‌شوند.\nبا خط‌کش و گونیا مستطیل را رسم می‌کنیم، محل در و پنجره را مشخص و ابعاد را روی نقشه یادداشت می‌کنیم.","pageRef":"صفحه ۱۴"},{"type":"answer","title":"مرحله ساخت ماکت: دیوارهای ماکت را چگونه برش دهیم؟","body":"نخست پلان را روی مقوای نازک انتقال داده و ارتفاع دیوارها را حدود ۱۰ سانتی‌متر انتخاب می‌کنیم.\nسپس با کاتر و خط‌کش فلزی، خط‌ها را چند بار کم‌عمق می‌بریم تا لبه تمیز جدا شود. لبه‌ها را با سوهان نرم کرده و در پایان دیوارها را با چسب مایه روی تخته پایه مونتاژ می‌کنیم.","pageRef":"صفحه ۲۲"},{"type":"note","title":"ایمنی در برش با کاتر","body":"کاتر با زاویه حدود ۴۵ درجه و رو به بیرون از بدن گرفته می‌شود و دست آزاد هرگز پشت خط برش قرار نمی‌گیرد. پس از هر برش تیغه جمع می‌شود.\nمثال: برای بریدن مقوای ضخیم به‌جای یک فشار عمیق، چند بار کم‌عمق می‌بریم تا تیغه نلغزد."},{"type":"note","title":"مقیاس در نقشه‌کشی","body":"مقیاس نسبت اندازه روی نقشه به اندازه واقعی است؛ مقیاس ۱/۱۰۰ یعنی هر ۱ سانتی‌متر نقشه برابر ۱ متر واقعی است. هرچه عدد مقیاس بزرگ‌تر باشد نقشه کوچک‌تر رسم می‌شود.\nمثال: اتاقی به طول ۵ متر با مقیاس ۱/۱۰۰ روی کاغذ ۵ سانتی‌متر می‌شود."},{"type":"exam","title":"سه عنصر سازه‌ای که بار ساختمان را تحمل می‌کنند را نام ببرید و نقش هر یک را بنویسید.","body":"پی: بار کل ساختمان را به زمین منتقل می‌کند و مانند ریشه در خاک قرار دارد.\nستون: بار سقف و طبقات را به‌صورت قائم به پی می‌رساند.\nتیر: به‌صورت افقی بار سقف را روی دیوارها و ستون‌ها پخش می‌کند. در ساختمان‌های بلند، اسکلت بتنی یا فلزی این نقش‌ها را بر عهده دارد."},{"type":"exam","title":"چرا در معماری ایرانی از ایوان، گنبد و طاق استفاده می‌شود؟","body":"ایوان فضای نیمه‌باز و سایه‌دار برای خنک شدن و برگزاری آیین‌ها فراهم می‌کند. گنبد با شکل خمیده بار سقف را به دیوارهای ضخیم می‌رساند و به تیر سنگین نیاز ندارد. طاق هم با آجر، دهانه‌های بزرگ را بدون تیرآهن می‌پوشاند.\nنمونه آن مسجد شیخ لطف‌الله اصفهان است."}]},{"number":2,"title":"نمونه‌سازی","pages":"۳۰ تا ۵۴","contents":[{"type":"answer","title":"مراحل ساخت قاب عکس چوبی را به ترتیب بنویسید.","body":"ابتدا نقشه قاب را به اندازه عکس ترسیم می‌کنیم. چهار قطعه چوب را با اره می‌بریم؛ انتهای هر قطعه با گونیا ۴۵ درجه بریده می‌شود تا گوشه‌ها کامل شوند.\nسطوح را با سوهان و سمباده نرم می‌کنیم، شیار شیشه را می‌بریم و در پایان قطعه‌ها را با چسب چوب و گیره مونتاژ می‌کنیم.","pageRef":"صفحه ۳۸"},{"type":"answer","title":"چگونه سطح چوب را با رنده صاف و یکنواخت کنیم؟","body":"تیغه رنده را هم‌سطح و یکنواخت بیرون‌زده تنظیم می‌کنیم. قطعه را با گیره می‌بندیم و رنده را در جهت الیاف و با فشار یکنواخت هدایت می‌کنیم.\nهر چند حرکت یک‌بار صافی سطح را با خط‌کش و ضخامت را با پرگار کنترل می‌کنیم تا همه لبه‌ها یکنواخت شود.","pageRef":"صفحه ۴۲"},{"type":"note","title":"ایمنی هنگام کار با اره","body":"قطعه کار با گیره محکم می‌شود و دست آزاد هرگز نزدیک خط برش نمی‌رود. اره را با حرکت کشیدنی و وزن خود اره می‌رانیم نه با فشار زیاد.\nمثال: هنگام بریدن تخته باریک، انتهای آزاد قطعه را تکیه می‌دهیم تا نشکند و برش صاف باشد."},{"type":"note","title":"ترتیب مراحل نمونه‌سازی","body":"هر نمونه‌سازی با تعریف نیاز آغاز می‌شود؛ سپس ایده‌پردازی، ترسیم نقشه، انتخاب ماده و ابزار، ساخت قطعه‌ها، مونتاژ و پرداخت نهایی انجام می‌گیرد.\nمثال: برای ساخت جا کلیدی، ابتدا اندازه دیوار و تعداد کلیدها مشخص و بعد نقشه کشیده می‌شود."},{"type":"exam","title":"چرا در نمونه‌سازی ابتدا نقشه‌کشی و سپس برش انجام می‌شود؟","body":"نقشه، اندازه‌ها و زاویه‌ها را دقیق مشخص می‌کند؛ اگر پس از برش اشتباهی پیدا شود ماده هدر رفته و جبران دشوار است.\nبا نقشه می‌توان قطعه‌ها را از قبل چیدمان کرد، زمان کار را کم کرد و به نمونه‌ای تمیز با مونتاژ درست رسید."},{"type":"exam","title":"برای پرداخت سطح یک قطعه چوبی چه ترتیبی از سمباده انتخاب می‌کنید؟","body":"از سمباده درشت به ریز حرکت می‌کنیم: ابتدا شماره ۸۰ برای از بین بردن ناهمواری‌ها، سپس ۱۲۰ برای یکنواخت کردن و در پایان ۲۲۰ برای پرداخت نهایی.\nهمیشه در جهت الیاف سمباده می‌زنیم تا خط عمیق نیندازد و سطح برای رنگ و لاک آماده شود."}]},{"number":3,"title":"الکترونیک","pages":"۵۶ تا ۸۰","contents":[{"type":"answer","title":"مقدار مقاومتی با نوارهای قهوه‌ای، سیاه، قرمز و طلایی را بخوانید.","body":"رقم نخست قهوه‌ای برابر ۱ و رقم دوم سیاه برابر ۰ است؛ ضریب رنگ قرمز یعنی ضرب در ۱۰۰، پس مقدار مقاومت ۱۰۰۰ اهم یا یک کیلواهم است.\nنوار طلایی تلورانس ۵ درصد را نشان می‌دهد؛ یعنی مقدار واقعی بین ۹۵۰ تا ۱۰۵۰ اهم است و مدار درست کار می‌کند.","pageRef":"صفحه ۶۴"},{"type":"answer","title":"مدار چراغ روشن‌شونده با تاریکی را روی برد سوراخ‌دار ببندید.","body":"مقاومت ثابت را بین مثبت باتری و بیس ترانزیستور و مقاومت نوری LDR را بین بیس و منفی قرار می‌دهیم.\nدر نور LDR مثل اتصال کوتاه بیس را زمین می‌کند؛ در تاریکی مقاومتش زیاد شده، ولتاژ بیس بالا می‌رود و ترانزیستور هدایت می‌کند. آنگاه جریان از مقاومت ۴۷۰ اهم و LED عبور کرده و چراغ روشن می‌شود.","pageRef":"صفحه ۷۰"},{"type":"note","title":"ایمنی الکتریکی در کارگاه","body":"مدار فقط با باتری کم‌ولتاژ مثل ۹ ولت بسته می‌شود و هرگز به برق شهر وصل نمی‌گردد. پیش از هر تغییر در مدار، سیم باتری جدا می‌شود و LED همیشه با مقاومت سری بسته می‌شود.\nمثال: اتصال مستقیم LED به باتری بدون مقاومت باعث سوختن آن می‌شود."},{"type":"note","title":"نقش ترانزیستور در مدار","body":"ترانزیستور سه پایه بیس، کلکتور و امیتر دارد و مانند کلید الکترونیکی یا تقویت‌کننده عمل می‌کند؛ جریان کوچک بیس، جریان بزرگ کلکتور را کنترل می‌کند.\nمثال: با جریان ضعیف حسگر نور می‌توان از طریق ترانزیستور یک چراغ پرنور را روشن کرد."},{"type":"exam","title":"مقاومت در مدار چه نقشی دارد و اگر LED را بدون مقاومت به باتری وصل کنیم چه می‌شود؟","body":"مقاومت جریان مدار را محدود و ولتاژ را تقسیم می‌کند تا قطعه‌ها در محدوده مجاز کار کنند.\nبدون مقاومت، جریان از حد مجاز LED بیشتر شده و پیوند نیمه‌هادی داغ و می‌سوزد. جریان مجاز LED معمولی حدود ۲۰ میلی‌آمپر است؛ پس با باتری ۹ ولت مقاومتی حدود ۴۷۰ اهم لازم است."},{"type":"exam","title":"تفاوت ماده اهمی و نیمه‌هادی را با مثال توضیح دهید.","body":"در ماده اهمی مثل مس و نیکروم با تغییر ولتاژ، نسبت جریان ثابت می‌ماند و مقاومت تقریباً ثابت است.\nدر نیمه‌هادی مثل سیلیسیم، رسانایی با دما و ناخالصی تغییر می‌کند و قابل کنترل است؛ به همین دلیل دیود و ترانزیستور از آن ساخته می‌شود. سیم برق مسی اهمی و قطعه داخل LED نیمه‌هادی است."}]},{"number":4,"title":"موتور و انرژی","pages":"۸۲ تا ۱۰۴","contents":[{"type":"answer","title":"یک موتور الکتریکی ساده چگونه ساخته می‌شود؟","body":"حدود ۵۰ دور سیم لاکی را دور باتری می‌پیچیم و دو سر آزاد را صاف کرده و لاک آن‌ها را با سمباده می‌گیریم.\nسیم‌پیچ را روی دو نگهدارنده فلزی متصل به قطب‌های باتری می‌گذاریم و آهنربایی زیر آن قرار می‌دهیم. نیروی میدان مغناطیسی بر سیم جریان‌دار، گشتاور ایجاد کرده و سیم‌پیچ می‌چرخد.","pageRef":"صفحه ۹۰"},{"type":"answer","title":"زمان‌های چهارگانه موتور بنزینی چهارزمانه را به ترتیب توضیح دهید.","body":"مکش: پیستون پایین می‌رود و مخلوط هوا و بنزین از سوپ مکش وارد سیلندر می‌شود.\nتراکم: با بسته بودن سوپ‌ها، مخلوط فشرده می‌شود.\nاحتراق: شمع جرقه زده و انفجار پیستون را به پایین می‌راند؛ تنها زمان کار مفید است.\nتخلیه: پیستون بالا رفته و گاز سوخته از سوپ دود خارج می‌شود.","pageRef":"صفحه ۹۶"},{"type":"note","title":"تبدیل انرژی در موتور الکتریکی","body":"موتور الکتریکی انرژی الکتریکی را به انرژی جنبشی (مکانیکی) تبدیل می‌کند و اصل کار آن، نیروی وارد بر سیم جریان‌دار در میدان مغناطیسی است.\nمثال: پنکه و دریل از این اصل استفاده می‌کنند و با عوض کردن قطبیت باتری، جهت چرخش عوض می‌شود."},{"type":"note","title":"انرژی‌های تجدیدپذیر","body":"انرژی تجدیدپذیر از منبعی به دست می‌آید که با مصرف تمام نمی‌شود مثل خورشید، باد، آب و زیست‌توده. پنل خورشیدی نور را مستقیم به برق تبدیل می‌کند و توربین بادی حرکت باد را به چرخش ژنراتور می‌دهد.\nمثال: چراغ خورشیدی حیاط روز شارژ و شب روشن می‌شود."},{"type":"exam","title":"دو تفاوت اصلی موتور بنزینی و موتور الکتریکی را بنویسید.","body":"در موتور بنزینی انرژی شیمیایی سوخت با احتراق به گرما و سپس حرکت تبدیل می‌شود و دود و صدای زیادی دارد.\nدر موتور الکتریکی انرژی الکتریکی مستقیم به چرخش تبدیل می‌شود، آلایندگی ندارد و بازده بالاتری دارد. با این حال موتور بنزینی به دلیل سوخت‌گیری سریع، برای خودرو و مسیرهای دور مناسب‌تر است."},{"type":"exam","title":"اگر چرخ‌دنده بزرگ ۴۰ دنده با چرخ‌دنده کوچک ۲۰ دنده در تماس باشد نسبت دوران چقدر است؟","body":"چرخ‌دنده‌ها حرکت دورانی و نیرو را منتقل و سرعت و گشتاور را تغییر می‌دهند.\nاگر چرخ بزرگ محرک باشد، چرخ کوچک دو برابر سریع‌تر می‌چرخد؛ پس نسبت دوران ۱ به ۲ است و در حالت برعکس گشتاور دو برابر ولی سرعت نصف می‌شود. جهت چرخش دو چرخ در تماس، مخالف هم است."}]},{"number":5,"title":"صنعت","pages":"۱۰۶ تا ۱۲۸","contents":[{"type":"answer","title":"قطر یک میله فلزی را با کولیس چگونه اندازه می‌گیریم؟","body":"فک‌ها را می‌بندیم و صفر بودن ورنیه با خط اصلی را کنترل می‌کنیم. میله را بین فک‌ها گذاشته و پیچ قفل را می‌بندیم.\nعدد صحیح را از خط‌کش اصلی و رقم اعشار را از خط ورنیه که با یک خط اصلی هم‌راستا شده می‌خوانیم؛ مثلاً ۱۲/۰۵ یعنی ۱۲ و ۵ صدم میلی‌متر.","pageRef":"صفحه ۱۱۲"},{"type":"answer","title":"مراحل ریخته‌گری یک قطعه کوچک فلزی را بنویسید.","body":"نخست مدل قطعه را در قالب ماسه‌ای فرو برده و قالب را باز می‌کنیم تا مدل بیرون بیاید؛ راهگاه و راه هوایی باز می‌شود.\nفلز در بوته ذوب و آرام در قالب ریخته می‌شود. پس از سرد شدن، قالب باز و راهگاه بریده شده و سطح قطعه با سوهان و سمباده پرداخت می‌شود.","pageRef":"صفحه ۱۱۸"},{"type":"note","title":"ایمنی در کار با فلز داغ و جوشکاری","body":"هنگام ذوب فلز و جوشکاری باید عینک محافظ، دستکش چرمی و پیش‌بند پوشیده شود و قطعه داغ فقط با انبر جابه‌جا شود.\nمثال: نور قوس جوشکاری به چشم آسیب جدی می‌زند، پس هرگز بدون نقاب جوش به آن نگاه نکنید."},{"type":"note","title":"فلزات آهنی و غیرآهنی","body":"فلزات آهنی آهن دارند، آهن‌ربا آن‌ها را جذب می‌کند و در رطوبت زنگ می‌زنند مثل فولاد و چدن.\nفلزات غیرآهنی مثل مس، آلومینیوم و برنج آهن ندارند، زنگ نمی‌زنند و رسانای خوبی هستند. مثال: میلگرد ساختمان از فولاد و سیم برق از مس ساخته می‌شود."},{"type":"exam","title":"چرا پیش از جوشکاری لبه‌های قطعه باید تمیز شود و زاویه الکترود چه اثری دارد؟","body":"روغن، رنگ و زنگ سطح، جریان را ناپایدار کرده و در جوش حباب و تخلخل می‌سازد؛ پس لبه‌ها با برس سیمی و سمباده تمیز می‌شوند.\nزاویه و سرعت حرکت الکترود، یکنواختی و عمق نفوذ جوش را کنترل می‌کند و زاویه نامناسب جوش را ناقص و ضعیف می‌گذارد. جوش خوب یکنواخت و بدون سوراخ است."},{"type":"exam","title":"برای هر نمونه کدام روش تولید مناسب است: شیرآلات برنجی، بدنه خودرو، میخ فولادی؟","body":"شیرآلات برنجی با ریخته‌گری ساخته می‌شود چون شکل پیچیده دارد و برنج روانی خوبی برای ریختن است.\nبدنه خودرو با نورد و پرس ورق شکل گرفته و با جوش نقطه‌ای مونتاژ می‌شود. میخ فولادی با کشیدن سیم، برش و سرخ‌گیری تولید می‌شود؛ روش ساخت به شکل، جنس و تعداد تولید بستگی دارد."}]},{"number":6,"title":"کشاورزی","pages":"۱۳۰ تا ۱۴۶","contents":[{"type":"answer","title":"مراحل پیوند اسکنه روی پایه را بنویسید.","body":"پایه سالم را با اره صاف قطع و محل برش را با چاقوی پیوند تمیز می‌کنیم. پیوندک با دو برش مورب از درخت پرورده گرفته می‌شود.\nبرش پایه را باز کرده و پیوندک را طوری جا می‌دهیم که لایه زاینده هر دو روی هم بیفتد. محل پیوند با نوار پیوند محکم و با چسب باغبانی پوشانده می‌شود.","pageRef":"صفحه ۱۳۴"},{"type":"answer","title":"چگونه از یک شاخه گل رز قلمه بگیریم و ریشه‌دار کنیم؟","body":"شاخه نیمه‌چوبی سالم به طول ۱۵ سانتی‌متر با ۳ تا ۴ جوانه می‌بریم؛ برش پایین مورب و برش بالا صاف و بالای جوانه است.\nبرگ‌های اضافی گرفته می‌شود، ته قلمه در هورمون ریشه‌زایی فرو رفته و در مخلوط خاک و ماسه کاشته می‌شود. خاک مرطوب نگه داشته می‌شود و پس از ۴ تا ۶ هفته ریشه‌ها ظاهر می‌شوند.","pageRef":"صفحه ۱۳۸"},{"type":"note","title":"خاک و زهکشی گلدان","body":"خاک خوب سبک، نفوذپذیر و پر از مواد آلی است؛ مخلوطی از خاک باغچه، ماسه، کود پوسیده و پرلیت. زهکشی گلدان حیاتی است.\nمثال: اگر آب در زیرگلدان بماند، ریشه کمبود اکسیژن گرفته و می‌پوسد؛ پس کف گلدان کمی شن و ذغال ریخته می‌شود."},{"type":"note","title":"مزایای ازدیاد غیرجنسی گیاهان","body":"در ازدیاد غیرجنسی مثل قلمه، پیوند و خوابانیدن، گیاه جدید دقیقاً همان ویژگی‌های گیاه مادر را دارد و زودتر به بار می‌نشیند.\nمثال: پرتقال تامسون روی پایه نارنج پیوند می‌شود تا هم میوه باکیفیت بدهد و هم ریشه‌ای مقاوم در برابر بیماری داشته باشد."},{"type":"exam","title":"سه عامل مهم در رشد سالم گیاهان را نام ببرید و برای هر کدام یک راهکار بنویسید.","body":"نور: گلدان کنار پنجره یا زیر لامپ رشد قرار می‌گیرد.\nآب: با کنترل رطوبت خاک، از خشکی و غرقاری جلوگیری می‌شود.\nخاک: با خاک نفوذپذیر و کوددهی مناسب، مواد غذایی فراهم می‌شود. دما نیز مهم است و بیشتر گیاهان آپارتمانی در دمای معتدل ۱۸ تا ۲۵ درجه رشد بهتری دارند."},{"type":"exam","title":"تفاوت پیوند و قلمه چیست و هر کدام برای چه گیاهانی مناسب‌تر است؟","body":"در قلمه، شاخه جدا شده خودش ریشه می‌دهد و گیاه تازه از همان ساخته می‌شود؛ مناسب برای رز، انگور و برخی گیاهان آپارتمانی.\nدر پیوند، قسمت هوایی یک گیاه روی ریشه گیاه دیگر جا می‌گیرد؛ برای مرکبات، سیب و گلابی که ریشه‌زایی شاخه‌شان سخت است به کار می‌رود و پایه مقاوم به بیماری می‌دهد."}]},{"number":7,"title":"برنامه‌نویسی","pages":"۱۴۸ تا ۱۶۴","contents":[{"type":"answer","title":"برای تشخیص زوج بودن یک عدد، الگوریتم و فلوچارت آن را ارائه کنید.","body":"فلوچارت با بیضی شروع می‌شود؛ سپس در مستطیل ورودی، عدد خوانده می‌شود. در لوزی تصمیم بررسی می‌شود که باقیمانده تقسیم عدد بر ۲ صفر است یا نه.\nاگر بله پیام زوج و اگر نه پیام فرد چاپ می‌شود و در پایان، بیضی پایان رسم می‌شود. این الگوریتم با بلوک شرطی در محیط برنامه‌نویسی پیاده‌سازی می‌شود.","pageRef":"صفحه ۱۵۲"},{"type":"answer","title":"برنامه چراغ چشمک‌زن را چگونه در محیط برنامه‌نویسی می‌سازیم؟","body":"داخل حلقه تکرار همیشگی، فرمان روشن کردن پایه خروجی LED، سپس دستور انتظار ۵۰۰ میلی‌ثانیه و بعد فرمان خاموش کردن و دوباره انتظار قرار می‌گیرد.\nچون حلقه بی‌پایان است، LED پیوسته روشن و خاموش می‌شود. برای تغییر سرعت چشمک فقط عدد انتظار را کم و زیاد می‌کنیم.","pageRef":"صفحه ۱۵۸"},{"type":"note","title":"الگوریتم خوب چه ویژگی‌هایی دارد؟","body":"الگوریتم دنباله‌ای مرتب و دقیق از دستورها برای حل مسئله است؛ باید ورودی و خروجی روشن، مرحله‌های بی‌ابهام و پایان‌پذیر داشته باشد.\nمثال: دستور پخت کیک یک الگوریتم است؛ اگر ترتیب مرحله‌ها عوض شود نتیجه درست نمی‌شود، مثل برنامه‌ای که قبل از خواندن عدد، جمع را انجام می‌دهد."},{"type":"note","title":"کاربرد حلقه تکرار و شرط","body":"حلقه برای انجام چندباره دستورها به کار می‌رود و کد را کوتاه می‌کند؛ شرط اجازه انتخاب مسیر می‌دهد.\nمثال: برای روشن کردن آژیر ۱۰ بار از حلقه تکرار استفاده می‌کنیم نه ۱۰ خط جدا؛ و با شرط اگر دما بالای ۳۰ درجه بود، پنکه فقط هنگام گرمای زیاد روشن می‌شود."},{"type":"exam","title":"برنامه‌ای بنویسید که مجموع اعداد ۱ تا ۱۰۰ را حساب کند.","body":"متغیر جمع را صفر و شمارنده را ۱ می‌گیریم. در حلقه تکرار تا ۱۰۰، مقدار شمارنده به جمع اضافه و شمارنده یکی زیاد می‌شود.\nپس از پایان حلقه مقدار جمع چاپ می‌شود که ۵۰۵۰ است. اگر شمارنده از ۱۰۰ شروع و کم شود، نتیجه همان است و فقط ترتیب جمع عوض می‌شود."},{"type":"exam","title":"اگر در برنامه کنترل دمای اتاق، فرمان خاموش کردن پنکه داخل حلقه نوشته نشود چه خطایی رخ می‌دهد و چگونه رفع می‌شود؟","body":"این یک خطای منطقی است؛ چون فرمان خاموش کردن هرگز اجرا نمی‌شود، پنکه پس از روشن شدن همیشه روشن می‌ماند و دما پیوسته پایین می‌رود.\nبرای رفع آن، فرمان خاموشی داخل حلقه و زیر شرط اگر دما کمتر از ۲۲ درجه شد قرار می‌گیرد و برنامه با ورودی گرم و سرد آزمایش می‌شود."}]}]}]}];

    bulb: svg('<path d="M9 18h6M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/>', 18),
    q: svg('<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>', 18),
    fq: svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9.5 12.5a2.5 2.5 0 0 1 4.6 1.3c0 1.7-2.1 2.2-2.1 2.2"/><path d="M12 19h.01"/>', 18),
    layers: svg('<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>', 18),
    spark: svg('<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>', 18),
    globe: svg('<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>', 18),
    x: svg('<path d="M18 6 6 18M6 6l12 12"/>', 10, 2.4)
  };

  /* ---------- وضعیت ---------- */
  var state = { view: "home", grade: null, book: null, chapter: "all", tab: "answer" };
  var stack = [];
  var chat = {
    messages: [{ role: "bot", content: "سلام! من راهنمای درسیار هستم.\nهر سوال درسی از پایه‌های هفتم تا نهم داری بپرس؛ اگر جواب سوالت را در بخش کمک درسی پیدا نکردی، همین‌جا از من بپرس." }],
    sending: false,
    ctx: null
  };

  function getServerUrl() {
    try { return localStorage.getItem("darsyar-url") || ""; } catch (e) { return ""; }
  }
  function setServerUrl(v) {
    try { localStorage.setItem("darsyar-url", v); } catch (e) {}
  }

  function go(data) {
    stack.push(JSON.stringify(state));
    for (var k in data) state[k] = data[k];
    render();
    try { history.pushState({ i: stack.length }, ""); } catch (e) {}
  }
  window.onpopstate = function () {
    if (stack.length) {
      state = JSON.parse(stack.pop());
      render();
    }
  };

  /* ---------- داده کمکی ---------- */
  function findGrade(n) {
    for (var i = 0; i < DATA.length; i++) if (DATA[i].number === n) return DATA[i];
    return null;
  }
  function counts(book) {
    var a = 0, n = 0, e = 0;
    book.chapters.forEach(function (c) {
      c.contents.forEach(function (it) {
        if (it.type === "answer") a++;
        else if (it.type === "note") n++;
        else e++;
      });
    });
    return { a: a, n: n, e: e };
  }

  /* ---------- هدر و نویگیشن ---------- */
  function topbar(titleHtml, rightBtn) {
    return '<header class="topbar">' +
      '<button class="iconbtn" onclick="DY.goHome()" aria-label="خانه">' + I.home + "</button>" +
      '<div class="title"><span class="t">' + titleHtml + "</span></div>" +
      (rightBtn || '<button class="iconbtn" aria-label="اعلان‌ها">' + I.bell + '<span class="dot"></span></button>') +
      "</header>";
  }
  function bottomnav(active) {
    var items = [
      { k: "home", label: "انتخاب پایه", ic: I.grid },
      { k: "grade", label: "درس من", ic: I.book },
      { k: "chat", label: "راهنمای هوشمند", ic: I.bot },
      { k: "more", label: "بیشتر", ic: I.dots }
    ];
    return '<nav class="bottomnav"><div class="nav-in">' +
      items.map(function (t) {
        return '<button class="navbtn' + (t.k === active ? " on" : "") + '" onclick="DY.nav(\'' + t.k + '\')">' + t.ic + "<span>" + t.label + "</span></button>";
      }).join("") +
      "</div></nav>";
  }

  /* ---------- ویوها ---------- */
  function renderHome() {
    var cards = DATA.map(function (g, i) {
      var c = GRADE_COLORS[i] || "blue";
      var ic = i === 0 ? I.book : i === 1 ? I.cap : I.file;
      return '<button class="card" onclick="DY.openGrade(' + g.number + ')">' +
        '<span class="grade-icon" style="background:' + GRADS[c] + '">' + ic + "</span>" +
        '<span class="grade-info"><b>' + g.name + "</b><small>" + g.subtitle + "</small>" +
        '<span class="grade-bar" style="background:' + GRADS[c] + '"></span></span>' +
        '<span class="badge" style="background:' + SOFTS[c] + ";color:" + TEXTS[c] + '">پایه ' + toFa(g.number) + "</span></button>";
    }).join("");

    var last = null;
    try { last = Number(localStorage.getItem("darsyar-grade")) || null; } catch (e) {}
    var lastCard = "";
    if (last && findGrade(last)) {
      lastCard = '<button class="card" style="background:linear-gradient(105deg,#ecfdf5,#fff);border-color:#d1fae5" onclick="DY.openGrade(' + last + ')">' +
        '<span class="grade-icon" style="background:' + GRADS.green + '">' + I.cap + "</span>" +
        '<span class="grade-info"><b>ادامه تحصیل در ' + findGrade(last).name + "</b><small>کتاب‌های درسی آماده مطالعه</small></span>" +
        '<span class="chev">' + I.chev + "</span></button>";
    }

    app.innerHTML =
      topbar('<b>درسیار من</b><small>همراه تحصیلی پایه‌های هفتم تا نهم</small>') +
      '<main class="pad">' +
      '<section class="hero"><div style="flex:1"><h2>پایه تحصیلی خود را انتخاب کنید</h2>' +
      "<p>برای شروع یادگیری، پایه مورد نظر خود را انتخاب کنید و به جواب سوالات، نکات مهم و سوالات امتحانی دسترسی داشته باشید</p></div>" +
      '<img src="img/hero.png" alt="کلاه فارغ‌التحصیلی روی کتاب‌ها"></section>' +
      (lastCard ? '<div style="height:12px"></div>' + lastCard : "") +
      '<div class="section-title">' + I.book + "<span>انتخاب پایه</span></div>" +
      cards +
      '<section class="ai-card" style="margin-top:16px"><div style="flex:1"><h3>نیاز به کمک داری؟</h3>' +
      "<p>اگر جواب سوالت را در بخش کمک درسی پیدا نکردی، همین‌جا از دستیار هوشمند بپرس؛ پاسخ مناسب پایه‌های هفتم تا نهم می‌گیری.</p>" +
      '<button class="pill-btn" onclick="DY.openChat(null)">راهنمای درسیار <span>' + I.chev + '</span></button></div>' +
      '<img src="img/robot.png" alt="ربات دستیار درسیار"></section>' +
      "</main>" +
      bottomnav("home");
  }

  function renderGrade() {
    var g = findGrade(state.grade);
    if (!g) { renderHome(); return; }
    try { localStorage.setItem("darsyar-grade", String(g.number)); } catch (e) {}

    var totalCh = 0, totalIt = 0;
    g.books.forEach(function (b) {
      var c = counts(b);
      totalCh += b.chapters.length;
      totalIt += c.a + c.n + c.e;
    });

    var color = GRADE_COLORS[DATA.indexOf(g)] || "blue";
    var books = g.books.map(function (b) {
      var c = counts(b);
      return '<button class="card" onclick="DY.openBook(' + b.id + ')">' +
        '<span class="cover" style="background:' + GRADS[b.color] + '"><small>' + b.subject + "</small><b>" + b.title + "</b></span>" +
        '<span class="binfo"><b class="t">' + b.title + "</b><p>" + b.description + '</p>' +
        '<span class="chips">' +
        '<span style="background:#ECFDF5;color:#16A34A">' + toFa(c.a) + " جواب سوال</span>" +
        '<span style="background:#FFFBEB;color:#D97706">' + toFa(c.n) + " نکته</span>" +
        '<span style="background:#F5F3FF;color:#9333EA">' + toFa(c.e) + " سوال امتحانی</span></span></span>" +
        '<span class="chev">' + I.chev + "</span></button>";
    }).join("");

    app.innerHTML =
      '<header class="gheader"><div class="row"><div>' +
      '<div class="hi">سلام، آماده یادگیری هستی؟</div><h1>' + g.name + '</h1><div class="sub">' + g.subtitle + "</div></div>" +
      '<button class="iconbtn plain" onclick="DY.goHome()">' + I.back + "</button></div></header>" +
      '<div class="stats">' +
      '<div class="st"><span style="color:#2563EB">' + I.globe + "</span><b>" + toFa(g.books.length) + "</b><span>کتاب درسی</span></div>" +
      '<div class="st"><span style="color:#16A34A">' + I.layers + "</span><b>" + toFa(totalCh) + "</b><span>فصل آماده</span></div>" +
      '<div class="st"><span style="color:#D97706">' + I.spark + "</span><b>" + toFa(totalIt) + "</b><span>پاسخ و نکته</span></div>" +
      "</div>" +
      '<main class="pad" style="padding-top:0"><div class="section-title" style="justify-content:space-between;margin-top:4px"><span>کتاب‌های ' + g.name + '</span><span class="badge" style="background:#EFF6FF;color:#2563EB">' + toFa(g.books.length) + " کتاب</span></div>" +
      books +
      '<button class="ai-cta" onclick="DY.openChat(' + g.number + ')">' +
      '<span class="l"><span class="bot-ic">' + I.bot2 + "</span><span><b>سوالی داری؟ از درسیار بپرس</b><small>دستیار هوشمند مخصوص پایه " + toFa(g.number) + "</small></span></span>" +
      '<span class="go">بپرس</span></button>' +
      "</main>" +
      bottomnav("grade");
  }

  function renderBook() {
    var g = findGrade(state.grade);
    var book = null;
    if (g) g.books.forEach(function (b) { if (b.id === state.book) book = b; });
    if (!g || !book) { renderHome(); return; }

    var c = counts(book);
    var color = book.color;

    var chaptersHtml = '<button class="chip' + (state.chapter === "all" ? " on" : "") + '" onclick="DY.setChapter(\'all\')">همه فصل‌ها</button>';
    book.chapters.forEach(function (ch) {
      chaptersHtml += '<button class="chip' + (state.chapter === ch.number ? " on" : "") + '" onclick="DY.setChapter(' + ch.number + ')"><small>فصل ' + toFa(ch.number) + "</small>" + esc(ch.title) + "</button>";
    });

    function tabBtn(t) {
      var meta = {
        answer: { label: "جواب سوالات", ic: I.q, bg: "#10B981", cnt: c.a },
        note: { label: "نکات مهم", ic: I.bulb, bg: "#F59E0B", cnt: c.n },
        exam: { label: "سوالات امتحانی", ic: I.fq, bg: "#8B5CF6", cnt: c.e }
      }[t];
      var on = state.tab === t;
      return '<button class="tab' + (on ? " on" : "") + '" style="' + (on ? "background:" + meta.bg + ";border-color:" + meta.bg : "") + '" onclick="DY.setTab(\'' + t + '\')">' +
        '<span style="' + (on ? "color:#fff" : "color:" + meta.bg) + '">' + meta.ic + "</span>" + meta.label +
        '<span class="cnt" style="' + (on ? "" : "background:" + SOFTS[color] + ";color:" + TEXTS[color]) + '">' + toFa(meta.cnt) + "</span></button>";
    }

    var tabMeta = {
      answer: { label: "جواب سوال", ic: I.q, soft: "#ECFDF5", txt: "#059669" },
      note: { label: "نکته مهم", ic: I.bulb, soft: "#FFFBEB", txt: "#D97706" },
      exam: { label: "سوال امتحانی", ic: I.fq, soft: "#F5F3FF", txt: "#7C3AED" }
    }[state.tab];

    var visible = state.chapter === "all" ? book.chapters : book.chapters.filter(function (ch) { return ch.number === state.chapter; });
    var body = "";
    var empty = true;
    visible.forEach(function (ch) {
      var items = ch.contents.filter(function (it) { return it.type === state.tab; });
      if (!items.length) return;
      empty = false;
      body += '<div class="chhead"><h3>فصل ' + toFa(ch.number) + ": " + esc(ch.title) + "</h3><span>صفحات " + ch.pages + "</span></div>";
      items.forEach(function (it) {
        body += '<article class="content-card"><div class="content-head">' +
          '<span class="tag" style="background:' + tabMeta.soft + ";color:" + tabMeta.txt + '">' + tabMeta.ic + tabMeta.label + "</span>" +
          (it.pageRef ? '<span class="page-ref">' + esc(it.pageRef) + "</span>" : "") +
          "</div><h4>" + esc(it.title) + "</h4>";
        if (state.tab === "exam") {
          body += "<details><summary>مشاهده پاسخ تشریحی</summary><div class=\"body\">" + esc(it.body) + "</div></details>";
        } else {
          body += '<div class="body">' + esc(it.body) + "</div>";
        }
        body += "</article>";
      });
    });
    if (empty) body = '<div class="empty">فعلاً محتوایی در این بخش ثبت نشده است.</div>';

    app.innerHTML =
      '<header class="gheader" style="background:' + GRADS[color] + '"><div class="row"><div style="flex:1">' +
      '<div class="hi">' + g.name + '</div><h1 style="font-size:19px">' + book.title + '</h1><div class="sub">' + book.description + "</div></div>" +
      '<button class="iconbtn plain" onclick="DY.backToGrade()">' + I.back + "</button></div></header>" +
      '<div class="stats">' +
      '<div class="st"><span style="color:#64748B">' + I.layers + "</span><b>" + toFa(book.chapters.length) + "</b><span>فصل</span></div>" +
      '<div class="st"><span style="color:#059669">' + I.q + "</span><b>" + toFa(c.a) + "</b><span>جواب سوال</span></div>" +
      '<div class="st"><span style="color:#D97706">' + I.bulb + "</span><b>" + toFa(c.n) + "</b><span>نکته مهم</span></div>" +
      '<div class="st"><span style="color:#7C3AED">' + I.fq + "</span><b>" + toFa(c.e) + "</b><span>سوال امتحانی</span></div>" +
      "</div>" +
      '<main class="pad" style="padding-top:0">' +
      '<div class="chapters">' + chaptersHtml + "</div>" +
      '<div class="tabs">' + tabBtn("answer") + tabBtn("note") + tabBtn("exam") + "</div>" +
      body +
      '<button class="ai-cta" onclick="DY.openChat(' + g.number + ", '" + esc(book.subject) + '\')">' +
      '<span class="l"><span class="bot-ic">' + I.bot2 + "</span><span><b>جواب سوالت را پیدا نکردی؟</b><small>همین سوال را از دستیار هوشمند درسیار بپرس</small></span></span>" +
      '<span class="go">بپرس</span></button>' +
      "</main>" +
      bottomnav("grade");
  }

  function renderChat() {
    var url = getServerUrl();
    var msgs = chat.messages.map(function (m) {
      if (m.role === "me") {
        return '<div class="msg me"><div class="bubble">' + esc(m.content) + "</div></div>";
      }
      return '<div class="msg bot"><span class="av">' + I.bot + '</span><div class="bubble">' + esc(m.content) + "</div></div>";
    }).join("");

    var typing = chat.sending ? '<div class="msg bot"><span class="av">' + I.bot + '</span><span class="bubble typing"><i></i><i></i><i></i></span></div>' : "";

    var suggests = "";
    if (chat.messages.length <= 1 && !chat.sending) {
      suggests = '<div style="display:flex;flex-direction:column;gap:8px"><div style="text-align:center;font-size:10.5px;color:#94a3b8">می‌توانی با این سوال‌ها شروع کنی:</div>' +
        ['معادله ساده x + ۵ = ۱۲ را چطور حل کنم؟', "برای امتحان علوم چطور بهتر درس بخوانم؟", "قواعد عربی پایه هفتم را ساده توضیح بده"]
          .map(function (s) { return '<button class="suggest" onclick="DY.suggest(\'' + s.replace(/'/g, "\\'") + '\')">' + s + "</button>"; }).join("") + "</div>";
    }

    var ctxChip = chat.ctx ? '<div class="ctx-chip">درس مرتبط: ' + (chat.ctx.subject ? chat.ctx.subject + " " : "") + "پایه " + toFa(chat.ctx.grade) +
      '<button onclick="DY.clearCtx()">' + I.x + "</button></div>" : "";

    app.innerHTML =
      '<header class="topbar">' +
      '<button class="iconbtn" onclick="DY.goHome()">' + I.back + "</button>" +
      '<div class="title"><span style="width:38px;height:38px;border-radius:12px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center">' + I.bot2 + '</span><span class="t"><b>راهنمای درسیار</b><small>دستیار هوشمند پایه‌های هفتم تا نهم</small></span></div>' +
      '<button class="iconbtn" onclick="DY.toggleUrl()" aria-label="تنظیمات سرور">' + I.gear + "</button>" +
      "</header>" + ctxChip +
      '<div id="url-row" class="url-row" style="display:none">' +
      '<input id="url-input" placeholder="http://آدرس-سرور" value="' + esc(url) + '">' +
      '<button class="save" onclick="DY.saveUrl()">ذخیره</button></div>' +
      '<div class="chat-wrap" id="chat-wrap">' + msgs + typing + suggests + "</div>" +
      '<div class="chatbar"><div class="in">' +
      '<input id="chat-input" placeholder="' + (chat.sending ? "درسیار در حال نوشتن است..." : "سوال درسی خودت را بنویس...") + '" onkeydown="DY.key(event)">' +
      '<button class="send" onclick="DY.send()" ' + (chat.sending ? "disabled" : "") + ">" + I.send + "</button>" +
      "</div></div>";

    var w = document.getElementById("chat-wrap");
    if (w) w.scrollTop = w.scrollHeight;
  }

  function render() {
    if (state.view === "grade") renderGrade();
    else if (state.view === "book") renderBook();
    else if (state.view === "chat") renderChat();
    else renderHome();
    window.scrollTo(0, 0);
  }

  /* ---------- رویدادها ---------- */
  var DY = {
    goHome: function () { go({ view: "home" }); },
    backToGrade: function () { go({ view: "grade" }); },
    nav: function (k) {
      if (k === "home") DY.goHome();
      else if (k === "grade") {
        var last = null;
        try { last = Number(localStorage.getItem("darsyar-grade")) || null; } catch (e) {}
        if (last && findGrade(last)) go({ view: "grade", grade: last });
        else go({ view: "home" });
      } else if (k === "chat") DY.openChat(null);
      else alert("درسیار من — نسخه ۱٫۰٫۰\nکمک درسی متوسطه اول");
    },
    openGrade: function (n) { go({ view: "grade", grade: n }); },
    openBook: function (id) { go({ view: "book", book: id, chapter: "all", tab: "answer" }); },
    setChapter: function (n) { state.chapter = n; render(); },
    setTab: function (t) { state.tab = t; render(); },
    openChat: function (grade, subject) {
      if (grade) chat.ctx = { grade: grade, subject: subject || null };
      go({ view: "chat" });
    },
    clearCtx: function () { chat.ctx = null; render(); },
    toggleUrl: function () {
      var r = document.getElementById("url-row");
      if (r) r.style.display = r.style.display === "none" ? "flex" : "none";
    },
    saveUrl: function () {
      var v = document.getElementById("url-input").value.trim().replace(/\/+$/, "");
      setServerUrl(v);
      render();
    },
    key: function (e) { if (e.key === "Enter") DY.send(); },
    suggest: function (s) {
      var inp = document.getElementById("chat-input");
      if (inp) { inp.value = s; DY.send(); }
    },
    send: function () {
      var inp = document.getElementById("chat-input");
      if (!inp) return;
      var text = inp.value.trim();
      if (!text || chat.sending) return;

      chat.messages.push({ role: "me", content: text });
      inp.value = "";
      chat.sending = true;
      renderChat();

      var url = getServerUrl();
      var finish = function (reply) {
        chat.messages.push({ role: "bot", content: reply });
        chat.sending = false;
        renderChat();
      };

      if (!url) {
        setTimeout(function () {
          finish("برای استفاده از دستیار هوشمند، با دکمه چرخ‌دنده بالای صفحه آدرس سرور (نسخه وب درسیار) را وارد کن.\nتا آن موقع می‌توانی از بخش کمک درسی، جواب سوالات، نکات مهم و سوالات امتحانی را بدون اینترنت ببینی.");
        }, 400);
        return;
      }

      var payload = {
        messages: chat.messages.map(function (m) { return { role: m.role === "me" ? "user" : "assistant", content: m.content }; }),
        context: chat.ctx ? { grade: chat.ctx.grade, subject: chat.ctx.subject } : undefined
      };

      fetch(url + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
        .then(function (r) { return r.json(); })
        .then(function (d) { finish(d.reply || "پاسخی دریافت نشد؛ دوباره تلاش کن."); })
        .catch(function () {
          finish("ارتباط با سرور برقرار نشد؛ اتصال اینترنت و آدرس سرور (چرخ‌دنده بالای صفحه) را بررسی کن.");
        });
    }
  };
  window.DY = DY;

  render();
})();

</script>
</body>
</html>
