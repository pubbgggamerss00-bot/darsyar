very","body":"پاسخ: My mother is very generous. (مادرم خیلی بخشنده است.)\nترتیب جمله: فاعل + فعل to be + قید شدت + صفت.\nنکته امتحانی: قیدهای شدت مثل very، really و a bit قبل از صفت می‌آیند."}]},{"number":4,"title":"Lesson 4: Health","pages":"۴۸ تا ۶۱","contents":[{"type":"answer","title":"What should you do when you have a headache? Answer in a full sentence.","body":"پاسخ نمونه: When I have a headache, I should rest and drink some water.\nترجمه: وقتی سردرد دارم، باید استراحت کنم و کمی آب بنوشم.\nبعد از should فعل به شکل ساده می‌آید؛ نه s سوم شخص می‌گیرد و نه to قبلش می‌آید.","pageRef":"صفحه ۵۰"},{"type":"answer","title":"ترجمه کنید: You shouldn't eat too much sugar; it is bad for your teeth.","body":"نباید شکرِ زیادی بخوری؛ برای دندان‌هایت بد است.\nshouldn't کوتاه‌شده should not است و یعنی «نباید».\nعبارت too much برای اسم‌های غیرقابل شمارش مثل sugar، water و money به کار می‌رود.","pageRef":"صفحه ۵۲"},{"type":"note","title":"کاربرد should و shouldn't","body":"should برای دادن توصیه: You should see a doctor. (باید به پزشک مراجعه کنی.)\nshouldn't برای نهی: You shouldn't stay up late. (نباید دیر بخوابی.)\nبعد از هر دو، فعل همیشه ساده است: should go، shouldn't eat."},{"type":"note","title":"عبارت‌های سلامتی درس ۴","body":"have a headache = سردرد داشتن، have a cold = سرما خوردن.\nhave a fever = تب داشتن، feel tired = خسته بودن.\nstay healthy = سالم ماندن؛ برای بیان بیماری از ساختار have a ... استفاده می‌کنیم."},{"type":"exam","title":"Choose the best advice: I have a fever. — a) You should see a doctor. b) You shouldn't see a doctor.","body":"پاسخ: گزینه a) You should see a doctor. (باید به پزشک مراجعه کنی.)\nوقتی حال کسی بد است، توصیه درست، جمله مثبت با should است.\nنکته امتحانی: در سوال‌های توصیه، گزینه را با منطق سلامت بررسی کنید؛ تب باید پیگیری پزشکی داشته باشد."},{"type":"exam","title":"جای خالی: You ...... stay up late; you have an exam tomorrow. (should / shouldn't)","body":"پاسخ: shouldn't.\nچون فردا امتحان دارد، بیدار ماندن شبانه توصیه نمی‌شود؛ پس shouldn't یعنی «نباید» درست است.\nنکته امتحانی: قبل از انتخاب should یا shouldn't، معنی کل جمله را در ذهن بسازید."}]},{"number":6,"title":"Lesson 6: Skills","pages":"۷۶ تا ۸۹","contents":[{"type":"answer","title":"Answer about yourself: What can you do well? What can't you do at all?","body":"پاسخ نمونه: I can swim very well, but I can't play the guitar.\nترجمه: من خیلی خوب شنا می‌توانم، اما نمی‌توانم گیتار بنوازم.\nبعد از can و can't همیشه فعل ساده می‌آید: can swim، can't play.","pageRef":"صفحه ۷۸"},{"type":"answer","title":"ترجمه کنید: She can speak three languages, but she can't drive a car.","body":"او می‌تواند سه زبان صحبت کند، اما نمی‌تواند خودرو براند.\nبعد از can فعل بدون تغییر می‌آید: he can speak (نه can speaks).\nدر سوال، can به اول جمله می‌آید: Can she drive? و جواب کوتاه: Yes, she can. یا No, she can't.","pageRef":"صفحه ۸۰"},{"type":"note","title":"کاربرد can و can't","body":"can برای توانایی: I can ride a bike. (می‌توانم دوچرخه‌سواری کنم.)\ncan برای اجازه: Can I open the window? (می‌توانم پنجره را باز کنم؟)\nمنفی آن can't یا cannot است: He can't dance. (نمی‌تواند برقصد.)"},{"type":"note","title":"نکته گرامری مهم درباره can","body":"بعد از can و can't هرگز s سوم شخص نمی‌آید: She can cook. (نه can cooks)\nدر سوال، can اول جمله می‌آید: Can you help me?\nجواب کوتاه: Yes, I can. یا No, I can't."},{"type":"exam","title":"جای خالی: My father ...... fix cars, but he ...... cook. (can / can't)","body":"پاسخ: My father can fix cars, but he can't cook.\nترجمه: پدرم می‌تواند خودرو تعمیر کند، اما نمی‌تواند آشپزی کند.\nنکته امتحانی: کلمه but نشانه تضاد است؛ پس یک توانایی مثبت (can) و یک توانایی منفی (can't) می‌آوریم."},{"type":"exam","title":"به سوال جواب کوتاه بدهید: Can they play football? (✓)","body":"پاسخ: Yes, they can. (بله، می‌توانند.)\nدر جواب کوتاه، فعل اصلی تکرار نمی‌شود و فقط can برمی‌گردد.\nنکته امتحانی: جواب کوتاه منفی هم No, they can't. است؛ به فاعل سوال دقت کنید."}]}]},{"title":"پیام‌های آسمان نهم","subject":"پیام‌های آسمان","description":"آموزش‌های قرآنی و پیام‌های تربیتی","color":"amber","icon":"sparkles","chapters":[{"number":1,"title":"خورشید پنهان","pages":"۴ تا ۱۱","contents":[{"type":"answer","title":"چرا در روایات، امام زمان (عج) به خورشید پشت ابر تشبیه شده است؟","body":"همان‌گونه که خورشید پشت ابر هم نور و گرمای خود را دارد و آثارش دیده می‌شود، امام زمان (عج) نیز در دوران غیبت حاضر است و از زندگی مردم غافل نیست.\nآثار وجود او مانند برکت، امنیت و پیروزی اسلام بر حق، نمایان است.\nهمچنین همه به سوی او راه دارند؛ همان‌طور که با کنار رفتن ابر، همه خورشید را می‌بینند، با ظهور نیز همه از وجود او بهره‌مند می‌شوند.","pageRef":"صفحه ۵"},{"type":"answer","title":"دو فایده وجود امام زمان (عج) در دوران غیبت را بنویسید.","body":"۱) خداوند به برکت وجود امام، از هر امت انسان‌های شایسته‌ای را که با ایمان و عمل صالح زندگی می‌کنند، برخوردار کرده است؛ نیکیِ این انسان‌ها سبب برکات امام برای همه می‌شود.\n۲) امام (عج) ناظر بر رفتار مردم است؛ به برکت وجود او، ظلم و فساد همه‌گیر نمی‌شود و شیطان بر همه جان‌ها و زندگی‌ها مسلط نمی‌گردد.","pageRef":"صفحه ۶"},{"type":"note","title":"غیبت صغری و غیبت کبری","body":"غیبت صغری (از ۲۶۰ تا ۳۲۹ هجری) دوره‌ای بود که امام زمان (عج) از طریق چهار نایب خاص با مردم در ارتباط بود.\nدر غیبت کبری، ارتباط از طریق نایب خاص برچیده شد.\nدر این دوره، انتظار برای ظهور و خودسازی، تکلیف اصلی شیعیان است."},{"type":"note","title":"تکلیف ما در زمان غیبت","body":"انتظار واقعی یعنی آمادگی دائمی: خودسازی، انجام واجبات و دوری از گناهان.\nدعای فرج خواندن و یاری برادران دینی از نشانه‌های منتظر واقعی است.\nمنتظر واقعی فقط چشم به راه نمی‌ماند؛ برای ساختن جامعه‌ای صالح تلاش می‌کند."},{"type":"exam","title":"چرا زمان ظهور امام زمان (عج) در دست ما نیست؟ توضیح دهید.","body":"زمان ظهور در دست ما نیست، زیرا برنامه‌ریزی ظهور با خداوند است و به صلاحدید او انجام می‌شود.\nتأخیر ظهور نیز به سبب گناهان و کوتاهی‌های مردم بوده است.\nنکته امتحانی: تأکید کنید که انتظار مسئولیت‌آور است؛ ما باید با خودسازی و تلاش، زمینه‌ساز ظهور باشیم.","pageRef":"صفحه ۹"},{"type":"exam","title":"دو نشانه از نشانه‌های ظهور را نام ببرید و بگویید آیا می‌توان زمان دقیق ظهور را دانست؟","body":"از نشانه‌های ظهور: فراگیر شدن ظلم و فساد و آشکار شدن فتنه‌ها؛ همچنین فراوانی دروغ و بی‌اعتبار شدن امانت در میان مردم.\nزمان دقیق ظهور را کسی جز خداوند نمی‌داند و ادعای دانستن آن بی‌اساس است.\nنکته امتحانی: نشانه‌ها فقط هشداری برای آمادگی‌اند، نه مبنایی برای تعیین تاریخ."}]},{"number":6,"title":"نماز جماعت","pages":"۴۴ تا ۵۱","contents":[{"type":"answer","title":"چرا نماز جماعت فضیلت بیشتری دارد؟ دو دلیل بیان کنید.","body":"۱) نماز جماعت نماد همبستگی و وحدت مسلمانان است؛ صف منظم نمازگزاران، یگانگی و برادری آنان را نشان می‌دهد.\n۲) در نماز جماعت، روحیه نظم و انضباط، تواضع و حضور اجتماعی تقویت می‌شود و پاداش و برکت آن به مراتب بیشتر از نماز خواندن تنهاست.","pageRef":"صفحه ۴۵"},{"type":"answer","title":"شرایط امام جماعت را نام ببرید.","body":"۱) بالغ و عاقل و مؤمن باشد.\n۲) عادل باشد؛ یعنی از گناهان بزرگ دوری کند و بر گناهان کوچک اصرار نورزد.\n۳) برای جماعت مردان، مرد باشد.\n۴) قرائت نماز را درست بداند و به مسائل مربوط به نماز آشنا باشد.\n۵) بهتر است حلال‌زاده باشد.","pageRef":"صفحه ۴۷"},{"type":"note","title":"احکام نماز جماعت","body":"پیوستن به نماز جماعت، بهتر از خواندن نماز به‌تنهایی است.\nدر صف باید پا به پا و شانه به شانه ایستاد؛ فاصله گرفتن صف‌ها و پراکندگی آن مکروه است.\nاگر در رکعت اول یا دوم به جماعت برسیم، نماز ما جماعت محسوب می‌شود."},{"type":"note","title":"آداب مسجد","body":"برای ورود به مسجد باید با وضو بود، با پای راست وارد شد و سلام داد.\nدر مسجد نباید بلند صحبت کرد، دعوا کرد یا کاری انجام داد که مزاحم نمازگزاران شود.\nسجده بر زمین و فرش‌های گیاهی مانند حصیر و کاهه صحیح است."},{"type":"exam","title":"اگر کسی در رکعت سوم به نماز جماعت بپیوندد، چه باید بکند؟","body":"باید بلافاصله به نماز بپیوندد؛ چون رکعت‌های اول و دوم را با امام نخوانده، پس از سلام امام، رکعت‌های باقی‌مانده را به‌صورت فرادی می‌خواند.\nنکته امتحانی: پیوستن در رکعت سوم و چهارم به جماعت اشکالی ندارد، اما نماز باید کامل شود.","pageRef":"صفحه ۴۸"},{"type":"exam","title":"آیا پیروی از امام جماعت در همه چیز واجب است؟ توضیح دهید.","body":"پیروی از امام در اصول و اجزای اصلی نماز واجب است؛ اگر کسی عمداً با امام هماهنگ نباشد، نمازش صحیح نیست.\nاما در مستحبات نماز، تفاوت نیت و احکام خاص مانند نماز مسافر، پیروی لازم نیست.\nنکته امتحانی: ملاک وحدت، اصول نماز است، نه مستحبات آن."}]},{"number":12,"title":"برنامه خداداد","pages":"۸۸ تا ۹۵","contents":[{"type":"answer","title":"چرا گفته می‌شود خداوند برای زندگی انسان برنامه دارد؟ با مثال توضیح دهید.","body":"خداوند که انسان را آفریده، به نیازهای جسمی و روحی او آگاه‌تر از همه است؛ پس برای رشد و سعادت او برنامه‌های کامل داده است.\nمثال: نماز برای آرامش و یاد خدا، روزه برای تقویت تقوا و نظم، و احکام حقوقی برای پیشگیری از ظلم و برقراری عدالت.\nپیروی از این برنامه‌ها، زندگی فردی و اجتماعی را آباد می‌کند.","pageRef":"صفحه ۸۹"},{"type":"answer","title":"تفاوت برنامه‌های الهی با برنامه‌هایی که انسان‌ها می‌سازند چیست؟","body":"برنامه‌های الهی کامل، عادلانه و بی‌نقص‌اند؛ زیرا از سوی خداوندی دانا و مهربان آمده‌اند و منافع همه انسان‌ها در همه زمان‌ها را در نظر دارند.\nاما برنامه‌های ساختگی بشر به دلیل محدودیت دانش و تأثیر خواهش‌ها و منافع شخصی، اغلب ناقص و گاه ستمگرانه است.\nبرای همین، برنامه‌های الهی برتر و پایدارترند.","pageRef":"صفحه ۹۰"},{"type":"note","title":"نمونه برنامه‌های خداداد","body":"برنامه عبادی: نماز، روزه، حج، خمس و زکات.\nبرنامه اخلاقی: راستگویی، امانت‌داری و احترام به پدر و مادر.\nبرنامه اجتماعی: عدالت، رعایت حقوق دیگران، همکاری و برادری."},{"type":"note","title":"پیام اصلی درس","body":"سعادت واقعی در پیروی از برنامه‌ای است که خالقِ زندگی آن را داده است.\nهرچه جامعه بیشتر به برنامه‌های الهی عمل کند، آرامش و عدالت در آن بیشتر خواهد بود.\nراه شناخت این برنامه‌ها، مطالعه قرآن و سخنان پیامبر (ص) و اهل‌بیت (ع) است."},{"type":"exam","title":"چرا پیروی از برنامه‌های خداوند به سود خودِ ماست؟","body":"زیرا خداوند به همه نیازها و آسیب‌های انسان آگاه است و هیچ برنامه‌ای را بدون حکمت قرار نمی‌دهد.\nمثلاً پرهیز از دروغ، اعتماد اجتماعی را حفظ می‌کند و پرهیز از زیاده‌روی در خوراک، سلامتی را.\nنکته امتحانی: یادآوری کنید که خداوند به هیچ سودی از ما نیاز ندارد؛ برنامه‌ها فقط برای رشد ماست.","pageRef":"صفحه ۹۲"},{"type":"exam","title":"اگر کسی بگوید برای زندگی خوب، برنامه الهی لازم نیست، چه پاسخی می‌دهید؟","body":"می‌گوییم: انسان با دانش محدود خود نمی‌تواند همه پیامدهای رفتارهای فردی و اجتماعی را پیش‌بینی کند؛ تجربه نشان داده جوامعی که از برنامه‌های الهی دور شدند، دچار ظلم، فساد و بی‌عدالتی شدند.\nبرنامه الهی با شناخت کامل خداوند از انسان تنظیم شده و کامل‌ترین راه است.\nنکته امتحانی: پاسخ را با مثال آسیب‌های بی‌قانونی پشتیبانی کنید."}]}]},{"title":"کار و فناوری نهم","subject":"کار و فناوری","description":"نمونه‌سازی، فناوری و مهارت‌های کاربردی","color":"red","icon":"wrench","chapters":[{"number":1,"title":"نمونه‌سازی","pages":"۴ تا ۱۱","contents":[{"type":"answer","title":"مراحل نمونه‌سازی را به ترتیب نام ببرید.","body":"۱) تعریف مشکل و نیاز: چه چیزی بسازیم و برای چه کسی؟\n۲) ایده‌پردازی و طراحی: ترسیم طرح‌های مختلف و انتخاب بهترین.\n۳) آماده‌سازی مواد و ابزار.\n۴) ساخت قطعه‌ها و مونتاژ: بریدن، شکل دادن و سوار کردن قطعات.\n۵) آزمایش و ارزشیابی: بررسی عملکرد نمونه و اصلاح اشکالات.","pageRef":"صفحه ۵"},{"type":"answer","title":"برای ساخت نمونه از کدام مواد می‌توان استفاده کرد و هرکدام چه زمانی مناسب است؟","body":"کاغذ و مقوا: برای مدل‌های اولیه و ارزانی که فقط شکل و ابعاد را نشان می‌دهند.\nچوب: برای نمونه‌های محکم‌تر که باید تحمل فشار داشته باشند.\nپلاستیک و فوم: برای قطعات سبک و طرح‌های منحنی.\nفلز: برای قطعاتی که مقاومت بالا می‌خواهند.","pageRef":"صفحه ۷"},{"type":"note","title":"ابزارهای پرکاربرد نمونه‌سازی","body":"قیچی و کاتر: بریدن کاغذ، مقوا و فوم.\nاره دستی: بریدن چوب و پلاستیک.\nچسب و چسب حرارتی: اتصال قطعه‌ها به هم.\nمتر و خط‌کش: اندازه‌گیری دقیق پیش از بریدن."},{"type":"note","title":"ایمنی در کارگاه","body":"هنگام بریدن و سوهان‌کاری، عینک محافظ بزنید.\nکاتر و اره را به سمت بدن نکشید و ابزارهای تیز را در جای امن نگه دارید.\nپس از پایان کار، ابزارها را جمع کنید و محل کار را تمیز کنید."},{"type":"exam","title":"چرا در طراحی، ابتدا طرح روی کاغذ ترسیم و سپس نمونه ساخته می‌شود؟","body":"زیرا ترسیم و ساخت مدل اولیه، هزینه و زمان کمتری دارد و اشکالات طرح پیش از ساخت محصول اصلی پیدا می‌شود.\nاگر مدل اولیه ایراد داشت، به‌راحتی قابل تغییر است؛ اما اصلاح محصول ساخته‌شده، گران و دشوار است.\nنکته امتحانی: نمونه‌سازی یعنی آزمایش خطا با کمترین هزینه.","pageRef":"صفحه ۶"},{"type":"exam","title":"اگر نمونه ساخته‌شده در آزمایش کار نکند، چه باید کرد؟ مراحل اصلاح را بنویسید.","body":"۱) علت خرابی را بررسی می‌کنیم: اندازه، اتصال یا انتخاب نامناسب مواد.\n۲) طرح را بازبینی و تغییرات لازم را روی نقشه اعمال می‌کنیم.\n۳) قطعه معیوب را اصلاح یا تعویض می‌کنیم.\n۴) دوباره آزمایش می‌کنیم؛ این چرخه تا رسیدن به نتیجه مطلوب ادامه دارد."}]},{"number":5,"title":"الکترونیک","pages":"۲۲ تا ۲۹","contents":[{"type":"answer","title":"اجزای یک مدار ساده روشنایی را نام ببرید و شرح دهید.","body":"۱) منبع تغذیه مانند باتری که انرژی مدار را تأمین می‌کند.\n۲) سیم رابط برای عبور جریان.\n۳) مصرف‌کننده مانند لامپ.\n۴) کلید برای وصل و قطع جریان.\nمدار باید بسته باشد تا جریان از باتری به لامپ برسد و لامپ روشن شود.","pageRef":"صفحه ۲۳"},{"type":"answer","title":"تفاوت رسانا و عایق را با مثال توضیح دهید.","body":"رساناها موادی هستند که جریان برق را به‌خوبی عبور می‌دهند، مانند مس، آلومینیم و آهن؛ به همین دلیل، سیم‌های برق از مس ساخته می‌شوند.\nعایق‌ها موادی هستند که جریان را عبور نمی‌دهند، مانند پلاستیک، لاستیک و شیشه؛ روکش پلاستیکی سیم برق، از ما در برابر برق‌گرفتگی محافظت می‌کند.","pageRef":"صفحه ۲۵"},{"type":"note","title":"قوانین ایمنی برق","body":"با دست خیس هرگز به کلید، پریز و سیم برق دست نزنید.\nوصل کردن چند دستگاه پرمصرف به یک پریز، خطر آتش‌سوزی دارد.\nبه سیم پاره یا اتصال کوتاه‌شده دست نزنید؛ ابتدا فیوز را قطع کنید."},{"type":"note","title":"قطعات پرکاربرد الکترونیک","body":"مقاومت: جریان را محدود می‌کند تا قطعه نسوزد.\nLED یعنی دیود نورانی: با جریان کم نور می‌دهد.\nخازن: الکتریسیته را به‌صورت موقت ذخیره می‌کند.\nآداپتور کوچک: ولتاژ برق شهر را کاهش می‌دهد."},{"type":"exam","title":"چرا لامپ‌های یک چراغ خیابانی به‌صورت موازی بسته می‌شوند نه به‌صورت سری؟","body":"در بستن موازی، هر لامپ مستقل کار می‌کند؛ اگر یکی بسوزد، بقیه روشن می‌مانند و ولتاژ هر لامپ کامل است.\nدر بستن سری، سوختن یک لامپ همه مدار را قطع می‌کند و نور همه کم می‌شود.\nنکته امتحانی: بستن موازی، روش استاندارد روشنایی خانه و خیابان است.","pageRef":"صفحه ۲۶"},{"type":"exam","title":"لامپ آزمایش شما با باتری سالم روشن نمی‌شود؛ عیب‌یابی را مرتب و توضیح دهید.","body":"۱) اتصال سیم‌ها را بررسی می‌کنیم که شل نباشند.\n۲) سالم بودن کلید و بسته بودن مدار را چک می‌کنیم.\n۳) لامپ را در مدار سالم دیگری آزمایش می‌کنیم تا معیوب بودنش مشخص شود.\n۴) ولتاژ باتری و قرارگیری درست آن را بررسی می‌کنیم.\nنکته امتحانی: عیب‌یابی باید مرحله‌به‌مرحله از منبع تا مصرف‌کننده انجام شود."}]},{"number":9,"title":"کشاورزی","pages":"۴۸ تا ۵۵","contents":[{"type":"answer","title":"مراحل کاشت بذر و پرورش گیاه در گلدان یا باغچه را بنویسید.","body":"۱) آماده‌سازی خاک: شخم زدن، پاک کردن علف‌های هرز و مخلوط کردن خاک با کود.\n۲) کاشت بذر: قرار دادن بذر در عمق مناسب، حدود دو تا سه برابر قطر بذر.\n۳) آبیاری منظم: مرطوب نگه‌داشتن خاک بدون آب‌گرفتگی.\n۴) نور کافی: قراردادن گلدان در جای روشن.\n۵) مراقبت: وجین علف هرز، مبارزه با آفت و برداشت در زمان مناسب.","pageRef":"صفحه ۴۹"},{"type":"answer","title":"خاک خوب برای کشاورزی چه ویژگی‌هایی دارد؟","body":"نرم باشد و هوای کافی برای تنفس ریشه داشته باشد.\nمقدار مناسبی مواد آلی و کود داشته باشد تا غذای گیاه را تأمین کند.\nآب را خوب نگه دارد ولی آب‌گرفتگی پیش نیاید؛ یعنی زهکشی مناسب داشته باشد.\nعاری از آلودگی‌های شیمیایی و سنگ‌های بزرگ باشد.","pageRef":"صفحه ۵۰"},{"type":"note","title":"نیازهای اصلی گیاه","body":"گیاه برای رشد به آب، نور، هوا، دمای مناسب و مواد غذایی مانند نیتروژن، فسفر و پتاسیم نیاز دارد.\nکمبود هرکدام از این عوامل باعث زرد شدن برگ، رشد کم و کم‌حاصل شدن گیاه می‌شود."},{"type":"note","title":"دشمنان گیاهان و مبارزه با آن‌ها","body":"علف‌های هرز با وجین یا کندن دستی از بین می‌روند؛ زیرا آب و غذای گیاه اصلی را می‌دزدند.\nآفت‌هایی مانند شته و کرم با سموم مجاز یا روش‌های طبیعی مانند معرفی حشرات مفید کنترل می‌شوند.\nاستفاده بی‌رویه از سموم برای محیط زیست و سلامت انسان خطرناک است."},{"type":"exam","title":"چرا نباید در آبیاری گیاهان زیاده‌روی کرد؟","body":"آب زیاد، فضای خاک را می‌گیرد و ریشه از کمبود اکسیژن می‌پوسد.\nآب‌گرفتگی باعث شسته شدن مواد غذایی خاک و رشد قارچ‌ها می‌شود.\nنکته امتحانی: آبیاری باید به اندازه باشد؛ خاک مرطوب بماند، نه خیس و گِلی.","pageRef":"صفحه ۵۲"},{"type":"exam","title":"برگ‌های گیاه گلدان شما زرد شده‌اند؛ سه علت احتمالی را بنویسید.","body":"۱) کمبود آب یا آبیاری بیش از حد و پوسیدگی ریشه.\n۲) کمبود نور؛ گلدان در جای تاریک قرار گرفته است.\n۳) کمبود مواد غذایی و نیاز به کود.\nنکته امتحانی: عیب‌یابی گیاه با بررسی سه عامل آب، نور و خاک انجام می‌شود."}]}]}]}];

    bulb: svg('<path d="M9 18h6M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/>', 18),
    q: svg('<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>', 18),
    fq: svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9.5 12.5a2.5 2.5 0 0 1 4.6 1.3c0 1.7-2.1 2.2-2.1 2.2"/><path d="M12 19h.01"/>', 18),
    layers: svg('<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>', 18),
    spark: svg('<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>', 18),
    globe: svg('<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>', 18),
    x: svg('<path d="M18 6 6 18M6 6l12 12"/>', 10, 2.4)
  };

  /* ---------- وضعیت ---------- */
  var state = { view: "home", grade: null, book: null, chapter: "all", tab: "answer" };
  var stack = [];
  var chat = {
    messages: [{ role: "bot", content: "سلام! من راهنمای درسیار هستم.\nهر سوال درسی از پایه‌های هفتم تا نهم داری بپرس؛ اگر جواب سوالت را در بخش کمک درسی پیدا نکردی، همین‌جا از من بپرس." }],
    sending: false,
    ctx: null
  };

  function getServerUrl() {
    try { return localStorage.getItem("darsyar-url") || ""; } catch (e) { return ""; }
  }
  function setServerUrl(v) {
    try { localStorage.setItem("darsyar-url", v); } catch (e) {}
  }

  function go(data) {
    stack.push(JSON.stringify(state));
    for (var k in data) state[k] = data[k];
    render();
    try { history.pushState({ i: stack.length }, ""); } catch (e) {}
  }
  window.onpopstate = function () {
    if (stack.length) {
      state = JSON.parse(stack.pop());
      render();
    }
  };

  /* ---------- داده کمکی ---------- */
  function findGrade(n) {
    for (var i = 0; i < DATA.length; i++) if (DATA[i].number === n) return DATA[i];
    return null;
  }
  function counts(book) {
    var a = 0, n = 0, e = 0;
    book.chapters.forEach(function (c) {
      c.contents.forEach(function (it) {
        if (it.type === "answer") a++;
        else if (it.type === "note") n++;
        else e++;
      });
    });
    return { a: a, n: n, e: e };
  }

  /* ---------- هدر و نویگیشن ---------- */
  function topbar(titleHtml, rightBtn) {
    return '<header class="topbar">' +
      '<button class="iconbtn" onclick="DY.goHome()" aria-label="خانه">' + I.home + "</button>" +
      '<div class="title"><span class="t">' + titleHtml + "</span></div>" +
      (rightBtn || '<button class="iconbtn" aria-label="اعلان‌ها">' + I.bell + '<span class="dot"></span></button>') +
      "</header>";
  }
  function bottomnav(active) {
    var items = [
      { k: "home", label: "انتخاب پایه", ic: I.grid },
      { k: "grade", label: "درس من", ic: I.book },
      { k: "chat", label: "راهنمای هوشمند", ic: I.bot },
      { k: "more", label: "بیشتر", ic: I.dots }
    ];
    return '<nav class="bottomnav"><div class="nav-in">' +
      items.map(function (t) {
        return '<button class="navbtn' + (t.k === active ? " on" : "") + '" onclick="DY.nav(\'' + t.k + '\')">' + t.ic + "<span>" + t.label + "</span></button>";
      }).join("") +
      "</div></nav>";
  }

  /* ---------- ویوها ---------- */
  function renderHome() {
    var cards = DATA.map(function (g, i) {
      var c = GRADE_COLORS[i] || "blue";
      var ic = i === 0 ? I.book : i === 1 ? I.cap : I.file;
      return '<button class="card" onclick="DY.openGrade(' + g.number + ')">' +
        '<span class="grade-icon" style="background:' + GRADS[c] + '">' + ic + "</span>" +
        '<span class="grade-info"><b>' + g.name + "</b><small>" + g.subtitle + "</small>" +
        '<span class="grade-bar" style="background:' + GRADS[c] + '"></span></span>' +
        '<span class="badge" style="background:' + SOFTS[c] + ";color:" + TEXTS[c] + '">پایه ' + toFa(g.number) + "</span></button>";
    }).join("");

    var last = null;
    try { last = Number(localStorage.getItem("darsyar-grade")) || null; } catch (e) {}
    var lastCard = "";
    if (last && findGrade(last)) {
      lastCard = '<button class="card" style="background:linear-gradient(105deg,#ecfdf5,#fff);border-color:#d1fae5" onclick="DY.openGrade(' + last + ')">' +
        '<span class="grade-icon" style="background:' + GRADS.green + '">' + I.cap + "</span>" +
        '<span class="grade-info"><b>ادامه تحصیل در ' + findGrade(last).name + "</b><small>کتاب‌های درسی آماده مطالعه</small></span>" +
        '<span class="chev">' + I.chev + "</span></button>";
    }

    app.innerHTML =
      topbar('<b>درسیار من</b><small>همراه تحصیلی پایه‌های هفتم تا نهم</small>') +
      '<main class="pad">' +
      '<section class="hero"><div style="flex:1"><h2>پایه تحصیلی خود را انتخاب کنید</h2>' +
      "<p>برای شروع یادگیری، پایه مورد نظر خود را انتخاب کنید و به جواب سوالات، نکات مهم و سوالات امتحانی دسترسی داشته باشید</p></div>" +
      '<img src="img/hero.png" alt="کلاه فارغ‌التحصیلی روی کتاب‌ها"></section>' +
      (lastCard ? '<div style="height:12px"></div>' + lastCard : "") +
      '<div class="section-title">' + I.book + "<span>انتخاب پایه</span></div>" +
      cards +
      '<section class="ai-card" style="margin-top:16px"><div style="flex:1"><h3>نیاز به کمک داری؟</h3>' +
      "<p>اگر جواب سوالت را در بخش کمک درسی پیدا نکردی، همین‌جا از دستیار هوشمند بپرس؛ پاسخ مناسب پایه‌های هفتم تا نهم می‌گیری.</p>" +
      '<button class="pill-btn" onclick="DY.openChat(null)">راهنمای درسیار <span>' + I.chev + '</span></button></div>' +
      '<img src="img/robot.png" alt="ربات دستیار درسیار"></section>' +
      "</main>" +
      bottomnav("home");
  }

  function renderGrade() {
    var g = findGrade(state.grade);
    if (!g) { renderHome(); return; }
    try { localStorage.setItem("darsyar-grade", String(g.number)); } catch (e) {}

    var totalCh = 0, totalIt = 0;
    g.books.forEach(function (b) {
      var c = counts(b);
      totalCh += b.chapters.length;
      totalIt += c.a + c.n + c.e;
    });

    var color = GRADE_COLORS[DATA.indexOf(g)] || "blue";
    var books = g.books.map(function (b) {
      var c = counts(b);
      return '<button class="card" onclick="DY.openBook(' + b.id + ')">' +
        '<span class="cover" style="background:' + GRADS[b.color] + '"><small>' + b.subject + "</small><b>" + b.title + "</b></span>" +
        '<span class="binfo"><b class="t">' + b.title + "</b><p>" + b.description + '</p>' +
        '<span class="chips">' +
        '<span style="background:#ECFDF5;color:#16A34A">' + toFa(c.a) + " جواب سوال</span>" +
        '<span style="background:#FFFBEB;color:#D97706">' + toFa(c.n) + " نکته</span>" +
        '<span style="background:#F5F3FF;color:#9333EA">' + toFa(c.e) + " سوال امتحانی</span></span></span>" +
        '<span class="chev">' + I.chev + "</span></button>";
    }).join("");

    app.innerHTML =
      '<header class="gheader"><div class="row"><div>' +
      '<div class="hi">سلام، آماده یادگیری هستی؟</div><h1>' + g.name + '</h1><div class="sub">' + g.subtitle + "</div></div>" +
      '<button class="iconbtn plain" onclick="DY.goHome()">' + I.back + "</button></div></header>" +
      '<div class="stats">' +
      '<div class="st"><span style="color:#2563EB">' + I.globe + "</span><b>" + toFa(g.books.length) + "</b><span>کتاب درسی</span></div>" +
      '<div class="st"><span style="color:#16A34A">' + I.layers + "</span><b>" + toFa(totalCh) + "</b><span>فصل آماده</span></div>" +
      '<div class="st"><span style="color:#D97706">' + I.spark + "</span><b>" + toFa(totalIt) + "</b><span>پاسخ و نکته</span></div>" +
      "</div>" +
      '<main class="pad" style="padding-top:0"><div class="section-title" style="justify-content:space-between;margin-top:4px"><span>کتاب‌های ' + g.name + '</span><span class="badge" style="background:#EFF6FF;color:#2563EB">' + toFa(g.books.length) + " کتاب</span></div>" +
      books +
      '<button class="ai-cta" onclick="DY.openChat(' + g.number + ')">' +
      '<span class="l"><span class="bot-ic">' + I.bot2 + "</span><span><b>سوالی داری؟ از درسیار بپرس</b><small>دستیار هوشمند مخصوص پایه " + toFa(g.number) + "</small></span></span>" +
      '<span class="go">بپرس</span></button>' +
      "</main>" +
      bottomnav("grade");
  }

  function renderBook() {
    var g = findGrade(state.grade);
    var book = null;
    if (g) g.books.forEach(function (b) { if (b.id === state.book) book = b; });
    if (!g || !book) { renderHome(); return; }

    var c = counts(book);
    var color = book.color;

    var chaptersHtml = '<button class="chip' + (state.chapter === "all" ? " on" : "") + '" onclick="DY.setChapter(\'all\')">همه فصل‌ها</button>';
    book.chapters.forEach(function (ch) {
      chaptersHtml += '<button class="chip' + (state.chapter === ch.number ? " on" : "") + '" onclick="DY.setChapter(' + ch.number + ')"><small>فصل ' + toFa(ch.number) + "</small>" + esc(ch.title) + "</button>";
    });

    function tabBtn(t) {
      var meta = {
        answer: { label: "جواب سوالات", ic: I.q, bg: "#10B981", cnt: c.a },
        note: { label: "نکات مهم", ic: I.bulb, bg: "#F59E0B", cnt: c.n },
        exam: { label: "سوالات امتحانی", ic: I.fq, bg: "#8B5CF6", cnt: c.e }
      }[t];
      var on = state.tab === t;
      return '<button class="tab' + (on ? " on" : "") + '" style="' + (on ? "background:" + meta.bg + ";border-color:" + meta.bg : "") + '" onclick="DY.setTab(\'' + t + '\')">' +
        '<span style="' + (on ? "color:#fff" : "color:" + meta.bg) + '">' + meta.ic + "</span>" + meta.label +
        '<span class="cnt" style="' + (on ? "" : "background:" + SOFTS[color] + ";color:" + TEXTS[color]) + '">' + toFa(meta.cnt) + "</span></button>";
    }

    var tabMeta = {
      answer: { label: "جواب سوال", ic: I.q, soft: "#ECFDF5", txt: "#059669" },
      note: { label: "نکته مهم", ic: I.bulb, soft: "#FFFBEB", txt: "#D97706" },
      exam: { label: "سوال امتحانی", ic: I.fq, soft: "#F5F3FF", txt: "#7C3AED" }
    }[state.tab];

    var visible = state.chapter === "all" ? book.chapters : book.chapters.filter(function (ch) { return ch.number === state.chapter; });
    var body = "";
    var empty = true;
    visible.forEach(function (ch) {
      var items = ch.contents.filter(function (it) { return it.type === state.tab; });
      if (!items.length) return;
      empty = false;
      body += '<div class="chhead"><h3>فصل ' + toFa(ch.number) + ": " + esc(ch.title) + "</h3><span>صفحات " + ch.pages + "</span></div>";
      items.forEach(function (it) {
        body += '<article class="content-card"><div class="content-head">' +
          '<span class="tag" style="background:' + tabMeta.soft + ";color:" + tabMeta.txt + '">' + tabMeta.ic + tabMeta.label + "</span>" +
          (it.pageRef ? '<span class="page-ref">' + esc(it.pageRef) + "</span>" : "") +
          "</div><h4>" + esc(it.title) + "</h4>";
        if (state.tab === "exam") {
          body += "<details><summary>مشاهده پاسخ تشریحی</summary><div class=\"body\">" + esc(it.body) + "</div></details>";
        } else {
          body += '<div class="body">' + esc(it.body) + "</div>";
        }
        body += "</article>";
      });
    });
    if (empty) body = '<div class="empty">فعلاً محتوایی در این بخش ثبت نشده است.</div>';

    app.innerHTML =
      '<header class="gheader" style="background:' + GRADS[color] + '"><div class="row"><div style="flex:1">' +
      '<div class="hi">' + g.name + '</div><h1 style="font-size:19px">' + book.title + '</h1><div class="sub">' + book.description + "</div></div>" +
      '<button class="iconbtn plain" onclick="DY.backToGrade()">' + I.back + "</button></div></header>" +
      '<div class="stats">' +
      '<div class="st"><span style="color:#64748B">' + I.layers + "</span><b>" + toFa(book.chapters.length) + "</b><span>فصل</span></div>" +
      '<div class="st"><span style="color:#059669">' + I.q + "</span><b>" + toFa(c.a) + "</b><span>جواب سوال</span></div>" +
      '<div class="st"><span style="color:#D97706">' + I.bulb + "</span><b>" + toFa(c.n) + "</b><span>نکته مهم</span></div>" +
      '<div class="st"><span style="color:#7C3AED">' + I.fq + "</span><b>" + toFa(c.e) + "</b><span>سوال امتحانی</span></div>" +
      "</div>" +
      '<main class="pad" style="padding-top:0">' +
      '<div class="chapters">' + chaptersHtml + "</div>" +
      '<div class="tabs">' + tabBtn("answer") + tabBtn("note") + tabBtn("exam") + "</div>" +
      body +
      '<button class="ai-cta" onclick="DY.openChat(' + g.number + ", '" + esc(book.subject) + '\')">' +
      '<span class="l"><span class="bot-ic">' + I.bot2 + "</span><span><b>جواب سوالت را پیدا نکردی؟</b><small>همین سوال را از دستیار هوشمند درسیار بپرس</small></span></span>" +
      '<span class="go">بپرس</span></button>' +
      "</main>" +
      bottomnav("grade");
  }

  function renderChat() {
    var url = getServerUrl();
    var msgs = chat.messages.map(function (m) {
      if (m.role === "me") {
        return '<div class="msg me"><div class="bubble">' + esc(m.content) + "</div></div>";
      }
      return '<div class="msg bot"><span class="av">' + I.bot + '</span><div class="bubble">' + esc(m.content) + "</div></div>";
    }).join("");

    var typing = chat.sending ? '<div class="msg bot"><span class="av">' + I.bot + '</span><span class="bubble typing"><i></i><i></i><i></i></span></div>' : "";

    var suggests = "";
    if (chat.messages.length <= 1 && !chat.sending) {
      suggests = '<div style="display:flex;flex-direction:column;gap:8px"><div style="text-align:center;font-size:10.5px;color:#94a3b8">می‌توانی با این سوال‌ها شروع کنی:</div>' +
        ['معادله ساده x + ۵ = ۱۲ را چطور حل کنم؟', "برای امتحان علوم چطور بهتر درس بخوانم؟", "قواعد عربی پایه هفتم را ساده توضیح بده"]
          .map(function (s) { return '<button class="suggest" onclick="DY.suggest(\'' + s.replace(/'/g, "\\'") + '\')">' + s + "</button>"; }).join("") + "</div>";
    }

    var ctxChip = chat.ctx ? '<div class="ctx-chip">درس مرتبط: ' + (chat.ctx.subject ? chat.ctx.subject + " " : "") + "پایه " + toFa(chat.ctx.grade) +
      '<button onclick="DY.clearCtx()">' + I.x + "</button></div>" : "";

    app.innerHTML =
      '<header class="topbar">' +
      '<button class="iconbtn" onclick="DY.goHome()">' + I.back + "</button>" +
      '<div class="title"><span style="width:38px;height:38px;border-radius:12px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center">' + I.bot2 + '</span><span class="t"><b>راهنمای درسیار</b><small>دستیار هوشمند پایه‌های هفتم تا نهم</small></span></div>' +
      '<button class="iconbtn" onclick="DY.toggleUrl()" aria-label="تنظیمات سرور">' + I.gear + "</button>" +
      "</header>" + ctxChip +
      '<div id="url-row" class="url-row" style="display:none">' +
      '<input id="url-input" placeholder="http://آدرس-سرور" value="' + esc(url) + '">' +
      '<button class="save" onclick="DY.saveUrl()">ذخیره</button></div>' +
      '<div class="chat-wrap" id="chat-wrap">' + msgs + typing + suggests + "</div>" +
      '<div class="chatbar"><div class="in">' +
      '<input id="chat-input" placeholder="' + (chat.sending ? "درسیار در حال نوشتن است..." : "سوال درسی خودت را بنویس...") + '" onkeydown="DY.key(event)">' +
      '<button class="send" onclick="DY.send()" ' + (chat.sending ? "disabled" : "") + ">" + I.send + "</button>" +
      "</div></div>";

    var w = document.getElementById("chat-wrap");
    if (w) w.scrollTop = w.scrollHeight;
  }

  function render() {
    if (state.view === "grade") renderGrade();
    else if (state.view === "book") renderBook();
    else if (state.view === "chat") renderChat();
    else renderHome();
    window.scrollTo(0, 0);
  }

  /* ---------- رویدادها ---------- */
  var DY = {
    goHome: function () { go({ view: "home" }); },
    backToGrade: function () { go({ view: "grade" }); },
    nav: function (k) {
      if (k === "home") DY.goHome();
      else if (k === "grade") {
        var last = null;
        try { last = Number(localStorage.getItem("darsyar-grade")) || null; } catch (e) {}
        if (last && findGrade(last)) go({ view: "grade", grade: last });
        else go({ view: "home" });
      } else if (k === "chat") DY.openChat(null);
      else alert("درسیار من — نسخه ۱٫۰٫۰\nکمک درسی متوسطه اول");
    },
    openGrade: function (n) { go({ view: "grade", grade: n }); },
    openBook: function (id) { go({ view: "book", book: id, chapter: "all", tab: "answer" }); },
    setChapter: function (n) { state.chapter = n; render(); },
    setTab: function (t) { state.tab = t; render(); },
    openChat: function (grade, subject) {
      if (grade) chat.ctx = { grade: grade, subject: subject || null };
      go({ view: "chat" });
    },
    clearCtx: function () { chat.ctx = null; render(); },
    toggleUrl: function () {
      var r = document.getElementById("url-row");
      if (r) r.style.display = r.style.display === "none" ? "flex" : "none";
    },
    saveUrl: function () {
      var v = document.getElementById("url-input").value.trim().replace(/\/+$/, "");
      setServerUrl(v);
      render();
    },
    key: function (e) { if (e.key === "Enter") DY.send(); },
    suggest: function (s) {
      var inp = document.getElementById("chat-input");
      if (inp) { inp.value = s; DY.send(); }
    },
    send: function () {
      var inp = document.getElementById("chat-input");
      if (!inp) return;
      var text = inp.value.trim();
      if (!text || chat.sending) return;

      chat.messages.push({ role: "me", content: text });
      inp.value = "";
      chat.sending = true;
      renderChat();

      var url = getServerUrl();
      var finish = function (reply) {
        chat.messages.push({ role: "bot", content: reply });
        chat.sending = false;
        renderChat();
      };

      if (!url) {
        setTimeout(function () {
          finish("برای استفاده از دستیار هوشمند، با دکمه چرخ‌دنده بالای صفحه آدرس سرور (نسخه وب درسیار) را وارد کن.\nتا آن موقع می‌توانی از بخش کمک درسی، جواب سوالات، نکات مهم و سوالات امتحانی را بدون اینترنت ببینی.");
        }, 400);
        return;
      }

      var payload = {
        messages: chat.messages.map(function (m) { return { role: m.role === "me" ? "user" : "assistant", content: m.content }; }),
        context: chat.ctx ? { grade: chat.ctx.grade, subject: chat.ctx.subject } : undefined
      };

      fetch(url + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
        .then(function (r) { return r.json(); })
        .then(function (d) { finish(d.reply || "پاسخی دریافت نشد؛ دوباره تلاش کن."); })
        .catch(function () {
          finish("ارتباط با سرور برقرار نشد؛ اتصال اینترنت و آدرس سرور (چرخ‌دنده بالای صفحه) را بررسی کن.");
        });
    }
  };
  window.DY = DY;

  render();
})();

</script>
</body>
</html>
