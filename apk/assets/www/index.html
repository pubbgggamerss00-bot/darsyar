اط برقرار می‌کنند.\nاین ارتباط می‌تواند شیمیایی باشد مانند ترشح فرمون توسط موریانه‌ها، صوتی باشد مانند زوزه گرگ و ناز کردن گربه یا چشمی باشد.\nمثال معروف: رقص زنبور عسل که به بقیه زنبورهای کندو محل گل‌های پرشهد را نشان می‌دهد."},{"type":"exam","title":"برای هر رفتار زیر بگویید ذاتی است یا آموخته‌ای: تار بافتن عنکبوت، رانندگی کردن، خواب زمستانی خرس، درس خواندن.","body":"تار بافتن ذاتی است؛ عنکبوت بدون هیچ آموزشی و از همان ابتدا تار می‌بافد.\nرانندگی آموخته‌ای است و با آموزش و تمرین فرا گرفته می‌شود.\nخواب زمستانی ذاتی و غریزی است؛ با فرارسیدن سرما به صورت درونی برانگیخته می‌شود.\nدرس خواندن هم آموخته‌ای است؛ رفتاری که با تجربه، تقلید و آموزش شکل می‌گیرد و با تمرین بهتر می‌شود."},{"type":"exam","title":"جانداران مناطق سرد چه سازش‌هایی برای بقا دارند؟","body":"خرس قطبی لایه چربی زیر پوست و موهای ضخیم دارد و رنگ سفید او با برف هم‌رنگ است؛ هم او را پنهان می‌کند و هم شکار آسان‌تر می‌شود.\nبرخی جانوران مانند خرس به خواب زمستانی می‌روند تا در سرمای شدید انرژی کمتری مصرف کنند.\nبعضی پرندگان مانند مرغ برفی پرهای متراکم دارند و دسته‌جمعی زندگی می‌کنند؛ مهاجرت هم از سازش‌های این مناطق است."}]},{"number":5,"title":"خورشید، روشنایی زندگی","pages":"۷۹ تا ۹۶","contents":[{"type":"answer","title":"چرا می‌گویند خورشید منبع اصلی انرژی زمین است؟","body":"گیاهان با نور خورشید غذاسازی می‌کنند و غذا و اکسیژن همه جانداران از همین راه تأمین می‌شود.\nگرمای خورشید آب دریاها را تبخیر می‌کند و چرخه آب و باد را به راه می‌اندازد.\nسوخت‌های فسیلی هم بقایای موجودات زنده‌ای هستند که انرژی خورشید در آن‌ها میلیون‌ها سال ذخیره شده است.\nپس تقریبا همه انرژی‌های مفید زمین به شکلی از خورشید سرچشمه می‌گیرند.","pageRef":"صفحه ۸۲"},{"type":"answer","title":"آزمایش کنید: با تغییر زاویه تابش نور بر یک سطح، روشنایی سطح چه تغییری می‌کند؟","body":"کارت را جلوی نور قرار می‌دهیم؛ وقتی نور عمود بر کارت می‌تابد، روشن‌ترین و متمرکزترین لکه نور را می‌بینیم.\nهرچه کارت را کج‌تر کنیم، همان نور روی سطح بزرگ‌تری پخش می‌شود و لکه نور بزرگ‌تر اما کم‌نورتر می‌شود.\nنتیجه: تابش عمودی شدیدتر و تابش مایل ضعیف‌تر است.\nاین آزمایش دلیل گرم‌تر بودن ظهر نسبت به صبح و تفاوت دمای تابستان و زمستان است.","pageRef":"صفحه ۸۹"},{"type":"note","title":"ساعت آفتابی و اندازه‌گیری زمان","body":"با حرکت ظاهری خورشید در آسمان، جهت و طول سایه اجسام تغییر می‌کند؛ مردم قدیم از همین راه زمان را تشخیص می‌دادند و ساعت آفتابی ساختند.\nدر ساعت آفتابی محل سایه یک میله، ساعت را نشان می‌دهد.\nمثال: اگر میله‌ای عمودی در زمین فرو کنیم، کوتاه‌ترین سایه آن در ظهر است و در آن لحظه جهت سایه به سمت شمال است."},{"type":"note","title":"چرا ظهر گرم‌تر از صبح و غروب است؟","body":"نزدیک ظهر خورشید در بالاترین نقطه آسمان است و نور آن با زاویه تندتر و نزدیک به عمود می‌تابد؛ پس انرژی روی سطح کوچک‌تری متمرکز می‌شود و هوا گرم‌تر است.\nدر صبح و غروب نور با زاویه ملایم می‌تابد، روی سطح بزرگی پخش می‌شود و بخشی از انرژی آن هم در راه جذب هوا می‌شود؛ پس هوا خنک‌تر است."},{"type":"exam","title":"دو کاربرد مستقیم و دو کاربرد غیرمستقیم انرژی خورشید را بنویسید.","body":"کاربرد مستقیم: خشک کردن لباس و میوه با نور خورشید و گرم شدن خانه و پیکر جانداران در روز آفتابی؛ همچنین کار کردن ساعت آفتابی با محل سایه.\nکاربرد غیرمستقیم: غذاسازی گیاهان که پایه همه زنجیره‌های غذایی است، تشکیل سوخت‌های فسیلی در گذشته زمین و تولید باد و چرخه آب که نیروگاه‌های بادی و برق‌آبی از آن‌ها برق می‌گیرند."},{"type":"exam","title":"چرا طول سایه اجسام در طول روز تغییر می‌کند؟ سایه در چه زمانی کوتاه‌ترین است؟","body":"چون مسیر ظاهری خورشید در آسمان در طول روز تغییر می‌کند و زاویه تابش آن فرق می‌کند.\nصبح و غروب که خورشید نزدیک افق است، نور مایل می‌تابد و سایه بلند است؛ نزدیک ظهر خورشید بالاتر می‌رود و تابش عمودتر می‌شود.\nپس سایه کوتاه‌ترین حالت را در ظهر دارد و در آن لحظه جهت سایه در کشور ما به سمت شمال است. ساعت آفتابی از همین تغییر سایه استفاده می‌کند."}]},{"number":6,"title":"زمین‌ساخت ورقه‌ای","pages":"۹۷ تا ۱۱۴","contents":[{"type":"answer","title":"شواهد حرکت ورقه‌ها را نام ببرید.","body":"وگنر شواهدی برای حرکت قاره‌ها پیدا کرد:\nتناسب ساحل قاره‌های آفریقا و آمریکای جنوبی مانند قطعه‌های پازل، فسیل‌های یکسان گیاهان و جانوران در قاره‌های جدا از هم، شباهت سنگ‌ها و رشته کوه‌های دو سوی اقیانوس اطلس و رسوبات یخچالی همسن در نواحی نزدیک استوا.\nامروزه با ماهواره‌های موقعیت‌یاب، حرکت ورقه‌ها را مستقیما اندازه می‌گیریم.","pageRef":"صفحه ۱۰۰"},{"type":"answer","title":"سه نوع مرز ورقه‌ها را معرفی کنید و برای هر کدام یک مثال بزنید.","body":"در مرز واگرا دو ورقه از هم دور می‌شوند و ماگمای بالاآمده پوسته اقیانوسی تازه می‌سازد؛ مانند پشته‌های میان اقیانوسی.\nدر مرز همگرا ورقه‌ها به هم نزدیک می‌شوند و ورقه سنگین‌تر زیر ورقه سبک‌تر فرو می‌رود و کوه، گودال و آتشفشان می‌سازد؛ مانند کوه‌های آند.\nدر مرز لغزشی دو ورقه کنار هم می‌لغزند و زلزله‌های فراوان رخ می‌دهد؛ مانند گسل سان‌آندریاس.","pageRef":"صفحه ۱۰۶"},{"type":"note","title":"ورقه‌ها روی سست‌کره حرکت می‌کنند","body":"سنگ‌کره زمین از پوسته و بخش سخت بالای گوشته ساخته شده و به تکه‌های بزرگ به نام ورقه شکسته شده است.\nورقه‌ها روی لایه نرم و خمیری زیر خود به نام سست‌کره قرار دارند و با سرعتی در حدود چند سانتی‌متر در سال آرام حرکت می‌کنند.\nورقه‌های بزرگ: اوراسیا، آفریقا، آمریکای شمالی، آمریکای جنوبی، هند و استرالیا، اقیانوس آرام و جنوبگان."},{"type":"note","title":"پانژیا؛ ابرقاره باستانی","body":"حدود ۲۲۰ میلیون سال پیش همه خشکی‌های زمین یک ابرقاره به نام پانژیا بودند که اقیانوسی بزرگ آن را فرا گرفته بود.\nبه‌تدریج پانژیا به تکه‌های کوچک‌تر شکسته شد و این تکه‌ها به موقعیت امروزی خود رسیدند.\nمثال: شکل ساحل قاره‌های کنار اقیانوس اطلس مانند تکه‌های یک پازل در هم قرار می‌گیرد؛ نشانه‌ای از جداشدن آن‌ها از یکدیگر."},{"type":"exam","title":"اگر دو ورقه در مرز همگرا به هم برخورد کنند چه پدیده‌هایی رخ می‌دهد؟ توضیح دهید.","body":"اگر دو ورقه اقیانوسی برخورد کنند، ورقه سنگین‌تر فرو می‌رود و جزایر آتشفشانی و گودال‌های عمیق ساخته می‌شود.\nاگر ورقه اقیانوسی زیر ورقه قاره‌ای فرو رود، رشته کوه‌های آتشفشانی مانند آند به وجود می‌آید.\nاگر دو ورقه قاره‌ای برخورد کنند، چون هر دو سبک‌اند هیچ‌کدام فرو نمی‌رود؛ پوسته چین می‌خورد و رشته کوه‌های عظیمی مانند هیمالیا ساخته می‌شود."},{"type":"exam","title":"چرا بیشتر زلزله‌ها و آتشفشان‌ها در حاشیه ورقه‌ها رخ می‌دهد؟","body":"حاشیه ورقه‌ها جایی است که ورقه‌ها به هم فشار می‌آورند، از هم دور می‌شوند یا کنار هم می‌لغزند؛ در این نواحی سنگ‌ها تحت فشار و تنش شدید قرار دارند.\nوقتی سنگ‌ها ناگهان می‌شکنند، انرژی به شکل زلزله آزاد می‌شود و اگر ماگما راهی به سطح پیدا کند، آتشفشان شکل می‌گیرد.\nبه همین دلیل محیط اقیانوس آرام که تقریبا تماما در مرز ورقه‌هاست به حلقه آتش معروف است."}]},{"number":7,"title":"زمین‌شناسی و پژوهش‌های زمینی","pages":"۱۱۵ تا ۱۳۲","contents":[{"type":"answer","title":"زمین‌شناسان چگونه درباره درون زمین اطلاعات به دست می‌آورند؟","body":"به دو روش مستقیم و غیرمستقیم.\nحفاری چاه‌ها و مطالعه معادن تا چند کیلومتر از پوسته ممکن است و سنگ‌هایی که آتشفشان‌ها از عمق بالا می‌آورند هم مستقیما درون زمین را نشان می‌دهند.\nمهم‌ترین روش غیرمستقیم، مطالعه امواج لرزه‌ای زلزله‌هاست؛ زیرا سرعت و مسیر این امواج با تغییر محیط عبور تغییر می‌کند.\nمطالعه شهاب‌سنگ‌ها هم به شناخت مواد اولیه زمین کمک می‌کند.","pageRef":"صفحه ۱۱۸"},{"type":"answer","title":"زمین‌شناسان در سفرهای میدانی از چه ابزارها و روش‌هایی استفاده می‌کنند؟","body":"در پژوهش میدانی، سنگ‌ها و لایه‌ها را مشاهده و توصیف می‌کنند، با چکش زمین‌شناسی نمونه می‌گیرند، با قطب‌نما جهت لایه‌ها را می‌گیرند و عکس و یادداشت تهیه می‌کنند.\nنمونه‌ها به آزمایشگاه برده می‌شوند و با میکروسکوپ و آزمایش‌های شیمیایی بررسی می‌شوند.\nنتیجه کار روی نقشه‌های زمین‌شناسی ثبت می‌شود که نوع و سن سنگ‌ها و محل گسل‌ها را نشان می‌دهد.","pageRef":"صفحه ۱۲۳"},{"type":"note","title":"نقشه زمین‌شناسی؛ ابزار کار زمین‌شناس","body":"نقشه زمین‌شناسی با رنگ‌ها و نشان‌های قراردادی، سن و نوع سنگ‌های سطح یک منطقه و محل گسل‌ها و لایه‌ها را نشان می‌دهد.\nاین نقشه‌ها برای پیدا کردن معادن، آب‌های زیرزمینی و نفت و برای راه‌سازی و ساختمان‌سازی به کار می‌روند.\nمثال: پیش از ساختن سد باید از روی نقشه زمین‌شناسی مطمئن شویم سنگ‌های محل سد مقاوم و بدون گسل هستند."},{"type":"note","title":"فسیل؛ سند گذشته زمین","body":"فسیل باقی‌مانده یا رد جانداران گذشته است که معمولا در سنگ‌های رسوبی حفظ می‌شود.\nبا مطالعه فسیل‌ها می‌فهمیم آن ناحیه در گذشته دریا بوده یا خشکی، آب‌وهوا چگونه بوده و جانداران چگونه تغییر کرده‌اند.\nمثال: یافتن فسیل ماهی و مرجان در کوه‌های البرز و زاگرس نشان می‌دهد این کوه‌ها روزگاری بخشی از کف دریا بوده‌اند و بعدها بالا آمده‌اند."},{"type":"exam","title":"روش‌های غیرمستقیم مطالعه درون زمین را نام ببرید و توضیح دهید.","body":"مهم‌ترین روش، مطالعه امواج لرزه‌ای است؛ سرعت و مسیر این امواج در مواد مختلف فرق می‌کند و بررسی آن‌ها ساختار درون زمین را نشان می‌دهد.\nروش‌های دیگر: مطالعه شهاب‌سنگ‌ها از جنس مواد اولیه منظومه شمسی، بررسی سنگ‌های آذرینی که از عمق بالا آمده‌اند و مطالعه میدان مغناطیسی زمین.\nحفاری مستقیم فقط تا حدود ۱۲ کیلومتر ممکن بوده؛ پس این روش‌ها بسیار مهم‌اند."},{"type":"exam","title":"چرا دانش زمین‌شناسی برای زندگی ما اهمیت دارد؟ سه مورد ذکر کنید.","body":"۱) در پیدا کردن منابع طبیعی مانند نفت، گاز، معادن فلزات و آب زیرزمینی کمک می‌کند.\n۲) در شناخت مناطق پرخطر زلزله و آتشفشان و ساختمان‌سازی ایمن نقش دارد؛ برای مثال بیمارستان‌های مناطق گسل‌دار باید بسیار مقاوم ساخته شوند.\n۳) مطالعه تاریخچه زمین و فسیل‌ها به فهم تغییرهای اقلیمی و مدیریت بهتر منابع طبیعی کمک می‌کند."}]},{"number":8,"title":"کوهزایی","pages":"۱۳۳ تا ۱۴۸","contents":[{"type":"answer","title":"کوه‌های چین‌خورده چگونه به وجود می‌آیند؟ یک مثال بزنید.","body":"وقتی دو ورقه به هم فشار می‌آورند، لایه‌های رسوبی حاشیه قاره‌ها مانند فرش چین می‌خورند و بالا می‌آیند؛ به این فرایند کوهزایی می‌گویند.\nمثال: هیمالیا از برخورد ورقه هند با اوراسیا و چین‌خوردگی رسوبات بستر دریای بین آن‌ها ساخته شده است.\nدر ایران زاگرس هم از فشار ورقه عربستان و چین‌خوردگی رسوبات کف دریای باستانی ساخته شده و هنوز در حال بالا آمدن است.","pageRef":"صفحه ۱۳۶"},{"type":"answer","title":"انواع کوه‌ها را نام ببرید و سازوکار پیدایش هر کدام را بنویسید.","body":"کوه‌ها سه نوع‌اند:\nکوه‌های چین‌خورده از فشار ورقه‌ها در مرز همگرا و چین‌خوردن لایه‌های سنگی ساخته می‌شوند؛ مانند زاگرس.\nکوه‌های گسله‌ای از شکستن پوسته و بالا آمدن قطعه‌های سنگی بین دو گسل ساخته می‌شوند؛ مانند کوه‌های شرق آفریقا.\nکوه‌های آتشفشانی از انباشته شدن گدازه و خاکستر در محل فوران ماگما ساخته می‌شوند؛ مانند دماوند در ایران و فوجی در ژاپن.","pageRef":"صفحه ۱۴۱"},{"type":"note","title":"گسل چیست؟","body":"گسل شکستگی در پوسته زمین است که در آن دو لبه شکستگی نسبت به هم جابه‌جا شده‌اند.\nفشارهای درون زمین سنگ‌ها را آن‌قدر فشار می‌دهد که سرانجام سنگ می‌شکند و گسل و زلزله پدید می‌آید.\nمثال: گسل‌های فعال ایران مانند گسل‌های زاگرس، البرز و شمال تبریز از مناطق اصلی رخداد زمین‌لرزه در کشور ما هستند."},{"type":"note","title":"کوهزایی هنوز ادامه دارد","body":"کوهزایی فرایندی بسیار طولانی و چند میلیون ساله است و امروز هم ادامه دارد.\nشواهد: زمین‌لرزه‌های پرشمار زاگرس و البرز، بالا آمدن سالانه چند میلی‌متری ارتفاع هیمالیا و یافتن فسیل‌های آبزی در قله کوه‌ها.\nمثال: فسیل حلزون‌های دریایی در قله اورست نشان می‌دهد بلندترین کوه جهان از کف دریای باستانی بالا آمده است."},{"type":"exam","title":"تفاوت پیدایش کوه‌های چین‌خورده و گسله‌ای را توضیح دهید.","body":"در کوه‌های چین‌خورده فشار افقی لایه‌های سنگی را بدون شکستن، چین و موج‌دار می‌کند و بالا می‌آورد؛ مانند زاگرس و هیمالیا.\nدر کوه‌های گسله‌ای پوسته می‌شکند و قطعه‌ها در امتداد گسل‌ها جابه‌جا می‌شوند؛ بعضی بالا می‌آیند و کوه و بعضی پایین می‌روند و گودال می‌سازند؛ مانند کوه‌های شرق آفریقا.\nگاهی هر دو سازوکار در یک ناحیه با هم دیده می‌شود."},{"type":"exam","title":"چرا دانستن محل گسل‌ها و ساختار کوه‌های یک منطقه مهم است؟","body":"برای ساختمان‌سازی، طراحی جاده، خط آهن و تونل و سدسازی باید محل گسل‌ها را بشناسیم تا سازه‌های مهم روی گسل‌های فعال ساخته نشوند یا مقاوم‌سازی شوند.\nدر پیدا کردن معادن و منابع زیرزمینی هم ساختار سنگ‌ها راهنماست.\nمثال: شهرهای نزدیک گسل‌های فعال مانند تهران و تبریز باید آیین‌نامه‌های سخت‌گیرانه مقاوم‌سازی ساختمان را رعایت کنند تا خسارت زلزله کم شود."}]},{"number":9,"title":"سفر به اعماق زمین","pages":"۱۴۹ تا ۱۶۶","contents":[{"type":"answer","title":"لایه‌های زمین را از سطح تا مرکز نام ببرید و ویژگی هر لایه را بنویسید.","body":"پوسته نازک‌ترین لایه است، از سنگ‌های جامد ساخته شده و زیر قاره‌ها ضخیم‌تر از زیر اقیانوس‌هاست.\nگوشته ضخیم‌ترین لایه است و از سنگ‌های داغ و نیمه‌خمیری ساخته شده که به آرامی جریان دارند.\nهسته در مرکز زمین قرار دارد و از آهن و نیکل ساخته شده؛ هسته خارجی مایع است و با حرکت خود میدان مغناطیسی زمین را می‌سازد و هسته داخلی به دلیل فشار عظیم جامد است.","pageRef":"صفحه ۱۵۲"},{"type":"answer","title":"اگر کسی نمی‌تواند به درون زمین سفر کند، از کجا می‌دانیم زمین لایه‌لایه است؟","body":"با مطالعه امواج لرزه‌ای.\nهنگام زلزله امواج اولیه و ثانویه ساخته می‌شوند؛ موج اولیه از جامد و مایع می‌گذرد اما موج ثانویه فقط از جامد.\nاز سرعت و مسیر آن‌ها فهمیدیم گوشته نیمه‌خمیری و داغ است، هسته خارجی مایع است زیرا موج ثانویه از آن نمی‌گذرد و هسته داخلی جامد است.\nعمیق‌ترین چاه بشر فقط ۱۲ کیلومتر است؛ پس امواج لرزه‌ای بهترین پنجره به اعماق‌اند.","pageRef":"صفحه ۱۵۸"},{"type":"note","title":"سنگ‌کره و سست‌کره","body":"سنگ‌کره از پوسته و بخش بالایی سخت گوشته ساخته شده و به تکه‌های بزرگی به نام ورقه شکسته شده است.\nزیر آن سست‌کره قرار دارد؛ بخشی از گوشته که سنگ‌هایش به دلیل گرمای زیاد نرم و خمیری است و می‌تواند به آرامی جریان یابد.\nمثال: حرکت ورقه‌های سنگ‌کره مانند ورق‌های یخ شناور روی آب روی سست‌کره انجام می‌شود و همین حرکت، زلزله و کوهزایی می‌سازد."},{"type":"note","title":"چرا با عمق، دما و فشار بیشتر می‌شود؟","body":"با نزدیک شدن به مرکز زمین، دما حدودا هر کیلومتر ۲۵ تا ۳۰ درجه بیشتر می‌شود و فشار نیز به دلیل وزن لایه‌های بالایی زیاد می‌شود.\nمنبع اصلی این گرما، گرمای برجای‌مانده از شکل‌گیری زمین و انرژی آزادشده از فروپاشی مواد پرتوزا است.\nمثال: در معادن عمیق هوا بسیار گرم است و برای کارگران باید با دستگاه‌های تهویه خنک‌سازی انجام شود."},{"type":"exam","title":"چرا هسته داخلی با وجود دمای چند هزار درجه جامد است اما هسته خارجی مایع است؟","body":"عامل مهم فشار است.\nدر مرکز زمین فشار به دلیل وزن همه لایه‌های بالایی بسیار عظیم است؛ این فشار ذرات هسته داخلی را به هم فشرده و در حالت جامد نگه می‌دارد.\nدر هسته خارجی فشار کمتر است و مواد با وجود دمای بسیار زیاد به حالت مایع درمی‌آیند.\nحرکت مواد مایع هسته خارجی میدان مغناطیسی زمین را تولید می‌کند؛ همان میدانی که قطب‌نما بر اساس آن کار می‌کند."},{"type":"exam","title":"عمیق‌ترین چاه حفاری بشر چه چیزی را درباره زمین نشان داد؟","body":"عمیق‌ترین چاه جهان در شبه‌جزیره کولا در روسیه حفر شد و به ۱۲۲۶۲ متر یعنی حدود ۱۲ کیلومتر رسید.\nبا آنکه شعاع زمین حدود ۶۳۷۰ کیلومتر است، این چاه حتی از پوسته هم نگذشته است.\nاین حفاری نشان داد با افزایش عمق، دما به سرعت بالا می‌رود و سنگ‌ها داغ و متراکم‌تر می‌شوند و ادامه کار ممکن نشد.\nبرای همین شناخت اعماق زمین بیشتر بر پایه امواج لرزه‌ای است."}]},{"number":10,"title":"تغییرات سطح زمین","pages":"۱۶۷ تا ۱۸۴","contents":[{"type":"answer","title":"هوازدگی مکانیکی و هوازدگی شیمیایی چه تفاوتی دارند؟ مثال بزنید.","body":"در هوازدگی مکانیکی سنگ‌ها بدون تغییر جنس خرد می‌شوند؛ مانند شکستن سنگ با یخ زدن آب در شکاف‌ها، رشد ریشه گیاهان و تغییر دمای شب و روز.\nدر هوازدگی شیمیایی جنس سنگ و مواد آن تغییر می‌کند؛ مانند حل شدن سنگ آهک در آب‌های اسیدی و زنگ زدن سنگ‌های آهندار.\nبا خرد شدن سنگ، سطح تماس بیشتر می‌شود و هوازدگی شیمیایی تندتر انجام می‌شود.","pageRef":"صفحه ۱۷۰"},{"type":"answer","title":"عوامل فرسایش و ته‌نشست را معرفی کنید.","body":"آب رودخانه‌ها ذرات را می‌برد و در پست‌ها ته‌نشین می‌کند؛ باد در مناطق خشک تپه‌های ماسه‌ای می‌سازد؛ یخچال‌ها سنگ‌های بزرگ را می‌کشند و دره U شکل می‌سازند و موج دریا سواحل را فرسایش می‌دهد.\nانسان هم با قطع درختان و ساخت‌وساز سرعت فرسایش را زیاد می‌کند.\nمواد فرسایش‌یافته در دشت‌ها و مصب رودها ته‌نشین می‌شوند و مثلث (دلتا) می‌سازند.","pageRef":"صفحه ۱۷۵"},{"type":"note","title":"زمین همیشه در حال تغییر است","body":"چهره زمین پیوسته تغییر می‌کند؛ برخی تغییرها ناگهانی‌اند مانند زمین‌لرزه، فوران آتشفشان و زمین‌لغزش و برخی بسیار آهسته و طولانی مانند ساخته شدن دره توسط رودخانه.\nمثال: رودخانه‌ای که میلیون‌ها سال در یک منطقه جریان دارد، بستر خود را می‌کَند و دره‌ای عمیق و V شکل می‌سازد؛ ما این دره را در یک عمر انسانی کامل نمی‌بینیم اما هر روز در حال بزرگ‌تر شدن است."},{"type":"note","title":"سرعت هوازدگی به چه عواملی بستگی دارد؟","body":"نوع سنگ، آب‌وهوا و زمان عوامل اصلی هستند.\nسنگ‌های نرم مانند ماسه‌سنگ زودتر و سنگ‌های سخت مانند گرانیت دیرتر هوازده می‌شوند؛ در مناطق مرطوب هوازدگی شیمیایی و در مناطق خشک و سرد هوازدگی مکانیکی و بادی بیشتر است.\nمثال: درز و شکاف سنگ‌ها سطح تماس آب و هوا را زیاد می‌کند؛ پس سنگ ترک‌دار زودتر از سنگ یکپارچه هوازده می‌شود."},{"type":"exam","title":"چرا دانه سنگی که از بستر رودخانه به دست می‌آوریم گرد و صاف است؟","body":"این سنگ در بالادست تیز و زبر بوده است.\nدر مسیر رودخانه با بستر و سنگ‌های دیگر برخورد می‌کند و ساییده می‌شود؛ گوشه‌های آن کنده می‌شود و با چرخش مداوم در آب گرد و صاف می‌شود.\nدر جایی که سرعت آب کم می‌شود، سنگ ته‌نشین می‌شود.\nبه همین دلیل در بستر رودخانه‌ها و محل ورود آن‌ها به دریا معمولا سنگ‌ریسه گرد و ماسه فراوان یافت می‌شود."},{"type":"exam","title":"انسان چگونه به تغییر سطح زمین کمک می‌کند؟ با مثال توضیح دهید.","body":"انسان با جاده‌سازی و تراش کوه‌ها، کشاورزی بی‌رویه که پوشش گیاهی را از بین می‌برد، قطع درختان و استخراج معادن، سرعت فرسایش را زیاد می‌کند.\nمثال: با قطع درختان، ریشه‌ها دیگر خاک را نگه نمی‌دارند و باران خاک را می‌برد و زمین‌لغزش رخ می‌دهد.\nدر مقابل، انسان با تراس‌بندی زمین‌های شیب‌دار و درختکاری از فرسایش جلوگیری می‌کند."}]}]},{"title":"فارسی هشتم","subject":"فارسی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب فارسی هشتم","color":"purple","icon":"book","chapters":[{"number":1,"title":"به نام کردگار","pages":"۵ تا ۸","contents":[{"type":"answer","title":"ستایش با چه نام‌ها و اوصافی از خداوند سخن می‌گوید؟","body":"سراینده خداوند را «کردگار» یعنی آفریدگار می‌خواند و او را بخشنده، آمرزنده و دادگر وامی‌ستاید؛ کسی که جان و خرد و همه‌ی هستی را سرشته و درهای رحمتش همیشه به روی بندگان گشوده است.","pageRef":"صفحه ۵"},{"type":"answer","title":"واژه‌ی «کردگار» به چه معناست و این درس یادگار کدام دوره از زبان ماست؟","body":"کردگار به معنای آفریدگار و پروردگار است؛ واژه‌ای کهن که از زبان پهلوی (فارسی میانه) به ما رسیده است. ستایش کتاب فارسی هشتم برگردان سروده‌ای باستانی است و نشان می‌دهد ایرانیان از دیرباز کار خود را با نام و یاد خدا آغاز کرده‌اند.","pageRef":"صفحه ۶"},{"type":"note","title":"دستور زبان؛ صفت فاعلی","body":"صفت فاعلی واژه‌ای است که به معنای انجام‌دهنده‌ی کار است و با افزودن «ـَنده» به مصدر ساخته می‌شود؛ مانند: بخشنده، آمرزنده، داننده، آفریننده. این صفت در ستایش برای وصف خداوند فراوان است؛ چون او راست که بخشش و آمرزش را پیوسته انجام می‌دهد."},{"type":"note","title":"واژه‌نامه ستایش","body":"کردگار: آفریدگار و پروردگار. سرشته: آفریده و ساخته‌ی خدا. دادگر: عادل؛ کسی که با همه به داد رفتار می‌کند. بخشنده: کریم و سخاوتمند. این واژه‌ها را در کار ورقه‌ای به درستی به کار ببرید."},{"type":"exam","title":"چرا کتاب درسی با ستایش و نام خدا آغاز می‌شود؟ پاسخ تشریحی بنویسید.","body":"آغاز با نام خدا نشانه‌ی توکل و ادب است؛ سراینده با «به نام کردگار» از او یاری می‌جوید و کارش را وقف خدا می‌کند. این سنت از گذشته تا امروز در کتاب‌های فارسی برقرار است و پیام آن این است که هر آغاز و سرانجام نیک به لطف خداوند است."},{"type":"exam","title":"سه ویژگی خداوند را که در ستایش آمده با توضیح بنویسید.","body":"آفریدنگری: او جان و خرد و جهان را سرشته است. بخشندگی: نعمت‌هایی چون چشم و گوش و اندیشه را بی‌چشم‌داشت به ما داده است. آمرزش و دادگری: توبه‌کاران را می‌آمرزد و میان بندگان به انصاف داوری می‌کند. این اوصاف انسان را به امید و شکرگزاری برمی‌انگیزد."}]},{"number":2,"title":"پیش از باران","pages":"۹ تا ۱۸","contents":[{"type":"answer","title":"شاعر پیش از باریدن باران چه نشانه‌هایی از آمدن آن می‌بیند؟","body":"شاعر بوی خاک و نسیم خنک، سایه‌ی ابرها و نمناکی هوا را نشانه‌های باران می‌شمارد؛ پیش از آن‌که قطره‌ای ببارد، بوی باران به مشام می‌رسد و دل بی‌قرار می‌شود. این نشانه‌ها خبر از رحمت خداوند می‌دهند.","pageRef":"صفحه ۹"},{"type":"answer","title":"پیام اصلی شعر «پیش از باران» چیست؟","body":"پیام شعر امید و تدبیر خداوند در آفرینش است؛ پیش از هر نعمت، نشانه‌های آن پدیدار می‌شود، همان‌گونه که پیش از بهار شکوفه‌ها و پیش از باران بوی خاک می‌آید. انسان باید چشم و دلش به نشانه‌های خدا هوشیار باشد و در سختی‌ها ناامید نشود.","pageRef":"صفحه ۱۱"},{"type":"note","title":"دستور زبان؛ فعل امری و نهی","body":"فعل امری برای فرمان و درخواست است؛ مانند: بنویس، بیاور. فعل نهی برای بازداشتن از کار است و از مضارع با «نَـ» در آغاز و «ـه» در پایان ساخته می‌شود؛ مانند: ننویس، نیاور. شاعر گاه باد و ابر را امری می‌کند تا صحنه‌ی طبیعت زنده شود."},{"type":"note","title":"آرایه تشخیص (جانبخشی)","body":"تشخیص آرایه‌ای است که در آن ویژگی‌های انسان به موجودات دیگر داده می‌شود. در شعر پیش از باران، ابر و باد و خاک چون انسان‌هایی زنده تصویر شده‌اند؛ مانند: «ابر در آسمان می‌گرید». این آرایه شعر را جان‌دار و دلنشین می‌کند."},{"type":"exam","title":"«بوی باران» در این شعر کنایه از چیست؟ توضیح دهید.","body":"بوی باران کنایه از نشانه‌ی نعمت و خبر آمدن رحمت است؛ یعنی هنوز باران نیامده اما همه‌چیز از رسیدنش خبر می‌دهد. شاعر با این تصویر می‌گوید خداوند در تدبیر آفرینش، پیش از هر خیری نشانه‌ها و امدادش را می‌فرستد تا انسان آماده و امیدوار باشد."},{"type":"exam","title":"دو تصویر زیبای طبیعت از این شعر را توصیف کنید.","body":"تصویر ابرهایی که آرام آسمان را می‌پوشانند و زمین تشنه را بشارت می‌دهند و تصویر بوی خاک خوش‌بو پس از نخستین قطره‌ها. این تصویرها با آرایه‌های تشخیص و تشبیه ساخته شده‌اند و حال و هوای انتظار باران را به خواننده منتقل می‌کنند."}]},{"number":3,"title":"سخنی با تو","pages":"۱۹ تا ۲۸","contents":[{"type":"answer","title":"نویسنده در «سخنی با تو» با چه کسی سخن می‌گوید و چه می‌خواهد؟","body":"نویسنده با تو، یعنی خودِ خواننده‌ی جوان، حرف می‌زند؛ او می‌خواهد بدانی که زندگی هدیه‌ای ارزشمند است و ساختن آینده‌ات به تصمیم‌ها و کوشش‌های خودت بستگی دارد. او تو را به اندیشیدن، کتاب‌خوانی و گزینش دوستان خوب فرا می‌خواند.","pageRef":"صفحه ۱۹"},{"type":"answer","title":"چرا نویسنده به جای شیوه‌ی پنددادن، سبک گفت‌وگو را برگزیده است؟","body":"زیرا خطاب قرار دادن خواننده با واژه‌ی «تو» پیام را صمیمی و نزدیک می‌کند؛ خواننده احساس می‌کند با او راز می‌گویند نه آن‌که به او نصیحت کنند. این شیوه اثر سخن را چند برابر می‌کند و خواننده با میل خود به اندیشیدن می‌پردازد.","pageRef":"صفحه ۲۱"},{"type":"note","title":"دستور زبان؛ نهاد","body":"نهاد واژه یا گروهی است که فعل درباره‌ی آن خبر می‌دهد. نهاد واژگانی خودش در جمله می‌آید؛ مانند: تو آینده‌ات را می‌سازی. نهاد پیوندی از فعل شناخته می‌شود؛ مانند «می‌روم» که نشانه‌ی «م» در آن نهاد پیوندی است."},{"type":"note","title":"املا؛ واژه‌های هم‌آوا","body":"هم‌آواها واژه‌هایی‌اند که یکسان تلفظ می‌شوند اما نوشتار و گاه معنای آن‌ها متفاوت است؛ مانند «سیر» (پر شدن) و «سائر» (باقی‌مانده)، «قائم» (برپا) که نباید آن را «قايم» نوشت و «شأن» که با «أ» نوشته می‌شود."},{"type":"exam","title":"مفهوم «زندگی هدیه‌ی خداوند است» را با یادآوری دو نعمت توضیح دهید.","body":"زندگی خود بزرگ‌ترین هدیه است و درون آن نعمت‌های بی‌شماری نهفته است؛ مانند خرد که راه تشخیص نیک و بد را نشان می‌دهد و دوستی که غم‌ها را سبک می‌کند. سپاس این هدیه‌ها با ساختن زندگی شایسته و نیکی کردن به دیگران است."},{"type":"exam","title":"دو ویژگی سبک نثر «سخنی با تو» را بنویسید.","body":"نخست خطاب و مخاطب‌داری است؛ جمله‌ها با «تو» و فعل‌های دوم‌شخص آغاز می‌شوند و صمیمیت می‌آفرینند. دوم زبان ساده و روان همراه با پرسش‌های برانگیزاننده است که خواننده را به تأمل وامی‌دارد؛ این ویژگی‌ها نثر آموزشی را جذاب می‌کند."}]},{"number":4,"title":"چشمه معرفت","pages":"۲۹ تا ۴۰","contents":[{"type":"answer","title":"چرا شناخت خداوند به چشمه‌ای جاری مانند شده است؟","body":"چون چشمه همیشه جاری و شیرین است و هر که به آن نزدیک شود سیراب می‌شود؛ معرفت خدا نیز هرگز پایان نمی‌گیرد و هر چه انسان بیشتر بیندیشد، به شناخت تازه‌ای می‌رسد. دانش‌ها می‌خشکند اما معرفت دل را همیشه زنده نگه می‌دارد.","pageRef":"صفحه ۲۹"},{"type":"answer","title":"در این درس راه رسیدن به معرفت خدا چه معرفی می‌شود؟","body":"اندیشیدن در آفرینش؛ نگاه به آسمان، باران، گیاه و تن خود انسان، راهنمای شناخت خداست. هر پدیده مانند آیینه‌ای حکمت آفریدگار را نشان می‌دهد؛ پس عالم واقعی کسی نیست که فقط واژه بداند، بلکه کسی است که از آفرینش عبرت گیرد.","pageRef":"صفحه ۳۱"},{"type":"note","title":"دستور زبان؛ متمم","body":"متمم اسم یا گروهی است که پس از حرف اضافه می‌آید و نقش تکمیلی دارد؛ مانند: به چشمه‌ی معرفت نزدیک شو که «چشمه‌ی معرفت» متممِ حرف اضافه‌ی «به» است. حرف‌های اضافه‌ی پرکاربرد: به، از، با، در، بر، برای."},{"type":"note","title":"آرایه استعاره","body":"استعاره آرایه‌ای است که در آن یک واژه به جای واژه‌ی دیگری به کار می‌رود و شباهت دو چهره پنهان می‌ماند؛ مانند: «علم چراغ زندگی است» که علم را به چراغ مانند کرده است. استعاره تصویرسازی را قوی‌تر از تشبیه می‌کند."},{"type":"exam","title":"معنی «معرفت» چیست و با «علم» چه تفاوتی دارد؟","body":"معرفت یعنی شناخت عمیق و ایمان‌آمیز؛ علم دانستن امور است اما معرفت، دانسته را با دل پذیرفتن و به آن عمل کردن است. کسی می‌تواند معرفت خدا پیدا کند که آموخته‌هایش را در رفتار خود نشان دهد؛ از این رو معرفت، میوه‌ی رسیده‌ی علم است."},{"type":"exam","title":"از این درس چه نتیجه‌ای درباره‌ی جایگاه دانایی می‌گیرید؟ پاسخ تشریحی.","body":"دانایی ارزشمند است اما هدف نهایی آن شناخت خدا و نیک‌زیستی است؛ اگر علم با معرفت همراه نشود، انسان را مغرور می‌کند. چشمه‌ی معرفت می‌آموزد که دانش را وسیله‌ی خیرخواهی و خودسازی قرار دهیم و در برابر آفرینش فروتن باشیم."}]},{"number":5,"title":"کبوتر طوق‌دار","pages":"۴۱ تا ۵۲","contents":[{"type":"answer","title":"در این شعر، زندگی در قفس با زندگی آزاد چگونه مقایسه می‌شود؟","body":"کبوتر طوق‌دار در قفس، دانه و آب آماده دارد اما از پرواز و هم‌قطارانش دور است؛ کبوتر آزاد شاید سخت‌تر زندگی کند اما بر فراز بام‌ها و میدان‌ها بال می‌زند. شاعر از این مقایسه نتیجه می‌گیرد که آزادی گران‌بهاتر از هر نعمتِ دربندگی است.","pageRef":"صفحه ۴۱"},{"type":"answer","title":"چرا کبوتر طوق‌دار را نماد انسان‌های محبوس می‌دانند؟","body":"زیرا طوق نشان بند و بسته است؛ کبوتری که طوق دارد رام شده و راه بازگشت به آسمان را گم کرده است. انسانی هم که آزادی‌اش را از دست بدهد، حتی با آسایش مادی، مانند همین کبوتر است؛ تنش آسوده اما جانش زندانی است.","pageRef":"صفحه ۴۳"},{"type":"note","title":"دستور زبان؛ صفت و موصوف","body":"صفت واژه‌ای است که ویژگی موصوف را نشان می‌دهد و پس از آن می‌آید؛ مانند: کبوتر طوق‌دار، آسمان باز، بال شکسته. صفت با موصوف در جنسیت و شمار و معرفه یا نکره بودن همراه است؛ مانند: پرنده‌ای رام، پرنده‌ی رام."},{"type":"note","title":"آرایه تلمیح","body":"تلمیح اشاره‌ی هنرمندانه به داستان‌ها و آیین‌های دینی و ملی است؛ مانند آن‌که شاعر از داستان‌های قرآن یا شاهنامه یاد کند تا معنا را روشن‌تر کند. تلمیح سخن را کوتاه و پرمعنا می‌کند و خواننده‌ی آشنا را با خویش همراه می‌سازد."},{"type":"exam","title":"از دیدگاه این شعر، آیا آسایش همیشه بهتر از آزادی است؟ پاسخ تشریحی.","body":"نه؛ شاعر نشان می‌دهد آسایشِ در بند بی‌ارزش است اگر انسان نتواند آرزوهای درست خود را دنبال کند. کبوتر طوق‌دار همه‌چیز دارد مگر پرواز؛ پیام این است که انسان باید آزادی و کرامت خود را حفظ کند و برای به دست آوردن آن از سختی نترسد."},{"type":"exam","title":"شاعر با چه تصویرهایی ارزش آزادی را نشان می‌دهد؟ پاسخ تشریحی بنویسید.","body":"تصویر کبوتر رام که در کنار آب و دانه می‌ماند اما بال‌زدن را فراموش کرده، نشان‌دهنده‌ی انسانی است که آسایش، او را از هدف دور کرده است؛ و تصویر پرواز بر فراز شهر و دشت، نماد امید و بلندپروازی است. مفهوم هر دو، ارج و ارزش آزادی است."}]},{"number":6,"title":"آفرینش همه تنبیه خداست","pages":"۵۳ تا ۶۴","contents":[{"type":"answer","title":"منظور شاعر از «آفرینش همه تنبیه خداست» چیست؟","body":"یعنی همه‌ی پدیده‌های جهان برای انسان عبرت‌آموز و یادآور خداست؛ آسمان، باران، گل و پروانه هر یک پیامی دارند. انسان هوشیار از هر آفریده درس می‌گیرد: از گذر فصل‌ها شکیبایی، از کوه استواری و از باران بخشندگی.","pageRef":"صفحه ۵۳"},{"type":"answer","title":"شاعر در این درس از طبیعت چه درس‌هایی برای زندگی می‌گیرد؟","body":"او می‌آموزد که هر آفریده در جای خود حکمتی دارد؛ خورشید به کار و روشنی فرا می‌خواند، شب دعوت به اندیشه و آسایش است و بهار نشان می‌دهد سختی‌ها پایان‌پذیرند. زندگی از این نمونه‌ها نظم و امید می‌گیرد.","pageRef":"صفحه ۵۵"},{"type":"note","title":"دستور زبان؛ ماضی ساده و ماضی استمراری","body":"ماضی ساده کار را در گذشته یک‌بار و تمام‌شده بیان می‌کند؛ مانند: رفت. ماضی استمراری ادامه‌ی کار را در گذشته نشان می‌دهد و با «می» ساخته می‌شود؛ مانند: می‌رفت. در توصیف طبیعت، ماضی استمراری صحنه را زنده و روان می‌کند."},{"type":"note","title":"آرایه تضمین","body":"تضمین آوردن بیت، آیه یا حدیثی از دیگری در شعر و نثر است؛ شاعر با تضمین پشتوانه‌ی سخنش را می‌افزاید. اگر تضمین از قرآن باشد، خواننده باید آن را با احترام و به‌درستی بخواند. مانند آوردن سخنی از سعدی در میانه‌ی شعر یا نثر."},{"type":"exam","title":"معنی «آفرینش همه تنبیه خداست» را بنویسید و یک مثال طبیعی بیاورید.","body":"یعنی همه‌ی جهان آفریده‌ای است که خداوند به وسیله‌ی آن انسان را پند و هشدار می‌دهد؛ مانند مورچه که در تابستان اندوخته می‌کند و به ما درس کار و تدبیر می‌دهد. پس نگاه هوشیار به آفرینش، آیینه‌ی پندهای الهی است."},{"type":"exam","title":"رابطه‌ی انسان با طبیعت از دیدگاه این درس را توضیح دهید.","body":"طبیعت معلم بی‌کلام انسان است؛ او را به شکر نعمت‌ها، کار و درست‌زیستی فرا می‌خواند. کسی که به آفرینش می‌نگرد، خدا را بهتر می‌شناسد و در برابر طبیعت مسئول است؛ پس نابود کردن طبیعت، ناسپاسی در برابر این معلم بزرگ است."}]},{"number":7,"title":"صبح یک روز نوبهاری","pages":"۶۵ تا ۷۸","contents":[{"type":"answer","title":"صحنه‌ی صبح بهاری در این درس چگونه توصیف شده است؟","body":"نویسنده از دمیدن آفتاب، شبنم روی شکوفه‌ها، بوی گل‌ها و بانگ پرندگان می‌گوید؛ جهان از خواب زمستانی بیدار شده و همه‌چیز تازه و شاداب است. این توصیف نشان می‌دهد آغاز روز و آغاز فصل، فرصت نو شدن است.","pageRef":"صفحه ۶۵"},{"type":"answer","title":"پیام درس «صبح یک روز نوبهاری» چیست؟","body":"پیام آن است که زندگی سرشار از آغازهای نو است؛ همان‌گونه که پس از هر شب صبح می‌دمد و پس از زمستان بهار می‌آید، انسان نیز می‌تواند از دل ناکامی‌ها برخیزد و دوباره آغاز کند. شادی و نشاط نعمت خداست و باید قدر آن را دانست.","pageRef":"صفحه ۶۷"},{"type":"note","title":"دستور زبان؛ ارکان تشبیه","body":"تشبیه از چهار رکن ساخته می‌شود: مشبه، مشبه‌به، ادات تشبیه و وجه شبه. در «آفتاب چون مهمان صبحگاهی»، آفتاب مشبه، مهمان مشبه‌به، «چون» ادات تشبیه و بودن در آغاز روز وجه شبه است. اگر ادات و وجه شبه حذف شوند، استعاره پدید می‌آید."},{"type":"note","title":"واژه‌نامه درس","body":"نوبهار: بهار و آغاز فصل گل و سبزه. شبنم: قطره‌های کوچک آب که شبانگاه روی برگ‌ها می‌نشیند. دمیدن: پدید آمدن و برخاستن؛ مانند دمیدن آفتاب. نشاط: شادی و سرزندگی. این واژه‌ها را با درست‌نویسی آن‌ها به خاطر بسپارید."},{"type":"exam","title":"نویسنده با توصیف طبیعت چه حالی در خواننده پدید می‌آورد؟ پاسخ تشریحی.","body":"با رنگ‌ها، بوها و آواها، خواننده را در دل صحنه‌ی بهار می‌نشاند و شادی و امید را در جانش جاری می‌کند. این شیوه توصیف خواندنی می‌سازد؛ خواننده ناخودآگاه می‌پذیرد که زیبایی آفرینش نعمت خداست و باید آن را پاس داشت و از روزهای نو برای کار تازه بهره گرفت."},{"type":"exam","title":"تشبیه آفتاب به مهمان را تحلیل کنید.","body":"در این تشبیه، آفتاب مشبه و مهمان مشبه‌به است؛ آفتاب مانند مهمان آمدنش شیرین و بی‌قرارکننده است و انرژی و شادی می‌آورد. این تشبیه توصیف را زنده می‌کند و نشان می‌دهد طبیعت چون خانه‌ای مهمان‌نواز است که هر بامداد پذیرای آفتاب است."}]},{"number":8,"title":"نوروز","pages":"۷۹ تا ۹۰","contents":[{"type":"answer","title":"در درس نوروز چه آیین‌هایی از این جشن باستانی یاد شده است؟","body":"پاکیزه کردن خانه و دل، دید و بازدید خویشان، گستردن سفره‌ی هفت‌سین با سبزه و سمنو و سماق، آشتی دادن دل‌ها و هدیه دادن به یکدیگر. نوروز از روزگار کهن، روز آغاز سال نو و جشن پیوند انسان با طبیعت است و آیین‌هایش نسل به نسل به ما رسیده است.","pageRef":"صفحه ۷۹"},{"type":"answer","title":"چرا نوروز از گذشته تا امروز زنده مانده است؟","body":"زیرا با سه چیز عمیق گره خورده است: شادی خانوادگی، پاکی طبیعت و نو شدن دل‌ها. آیین‌های آن مانند هفت‌سین و عیددیدنی سینه‌به‌سینه رسیده و هر بار با لبخند کودکان و آرزوی بزرگ‌ترها دوباره جان می‌گیرد؛ از این رو نوروز میراث زنده‌ی فرهنگ ماست.","pageRef":"صفحه ۸۱"},{"type":"note","title":"دستور زبان؛ مضارع اخباری و التزامی","body":"مضارع اخباری برای خبر دادن است؛ مانند: نوروز می‌آید. مضارع التزامی برای آرزو، دعا، فرمان و جمله‌های پس از «اگر» و «هرگاه» است؛ مانند: نوروزتان پیروز، امیدوارم که سالم باشی. دانستن این تفاوت در نوشتار و انشا اهمیت دارد."},{"type":"note","title":"واژه‌نامه درس نوروز","body":"آیین: رسم و رسوم. نیاکان: پدران و اجداد. سینه‌به‌سینه: از نسلی به نسل دیگر شفاهی و پیوسته. مهرگان و تیرگان: دو جشن باستانی ایرانی. نوروز در کنار این جشن‌ها، یادگار فرهنگ کهن ایران است که با شادی و پاکی همراه بوده است."},{"type":"exam","title":"نوروز چه پیوندهایی با طبیعت دارد؟ پاسخ تشریحی بنویسید.","body":"نوروز در آغاز بهار جشن گرفته می‌شود؛ سبزه‌ی هفت‌سین، سفر به دامن طبیعت در سیزده‌بدر و دیدن شکوفه‌ها همه نشان پیوند این جشن با زنده شدن طبیعت است. ایرانیان باور داشتند نو شدن زمین، فرصتی برای نو کردن دل‌ها و آشتی است؛ پس نوروز هم جشن طبیعت است و هم جشن انسانیت."},{"type":"exam","title":"جمله «نوروز جشن نو شدن است» را با دو شاهد توضیح دهید.","body":"شاهد نخست نو شدن طبیعت است؛ سبزه می‌روید، شکوفه‌ها می‌بارند و هوا معتدل می‌شود. شاهد دوم نو شدن زندگی انسان است؛ خانه‌ها پاکیزه می‌شود، کینه‌ها فراموش و لباس‌های نو پوشیده می‌شود. نوروز می‌آموزد که گذشته را با عبرت بپذیریم و با امید آغاز کنیم."}]},{"number":9,"title":"در نیمه‌شبِ جمعه","pages":"۹۱ تا ۱۰۲","contents":[{"type":"answer","title":"شاعر در قطعه «در نیمه‌شبِ جمعه» چه فصلی را توصیف می‌کند و چه می‌خواهد؟","body":"وحشی بافقی در شب جمعه‌ای به باغی می‌رود و می‌بیند که نشانه‌های خزان و پایان فصل گل آشکار است؛ او می‌خواهد بگوید روزگار چون باغ همیشه یکسان نمی‌ماند و آدمی باید از هر فرصت، پیش از گذشت آن بهره گیرد.","pageRef":"صفحه ۹۱"},{"type":"answer","title":"مفهوم بیت «خیزید و خز آرید که هنگام خزان است» چیست؟","body":"شاعر چون می‌بیند هوا رو به سردی و برگ‌ها رو به افتادن است، دوستان را فرا می‌خواند که با برداشت میوه‌ها از باغ بهره ببرند. کنایه از آن است که از روزگار و فرصت‌های زندگی باید شتاب‌زده بهره گرفت، زیرا فرصت‌ها مانند فصل گل زودگذرند.","pageRef":"صفحه ۹۳"},{"type":"note","title":"شناخت شاعر؛ وحشی بافقی","body":"وحشی بافقی از شاعران بزرگ قرن دهم هجری است؛ منظومه‌ی «فرهاد و شیرین» او را به سبک «خسرو و شیرین» نظامی سروده است و به همین همراهی با شاعران پیشین، سبک «نقض» نام گرفته است. زبان او سرشار از عشق و تصویرهای باغ و بهار است."},{"type":"note","title":"دستور زبان؛ فعل نهی در شعر","body":"در بیت «ترک عهد مکن با گل و مرغ چمن» فعل «مکن» فعل نهی است؛ یعنی نکن. فعل نهی با افزودن «نَـ» به آغاز مضارع و «ـه» به پایان آن ساخته می‌شود؛ مانند: مگو، مخور، مرو. شاعر با این فعل، خواننده را از بی‌وفایی بازمی‌دارد."},{"type":"exam","title":"قطعه «در نیمه‌شبِ جمعه» چه پیامی درباره‌ی گذر عمر دارد؟ پاسخ تشریحی.","body":"باغ وحشی بافقی مانند زندگی انسان است؛ فصل گل مانند جوانی و خزان مانند پیری. شاعر می‌گوید روزگار بازگشت‌پذیر نیست اما بهار دوباره می‌آید؛ پس انسان باید مانند باغبان از فرصت‌ها اندوخته‌ی خیر بریزد و با طبیعت و مردم، عهد و پیمان خود را پاس دارد."},{"type":"exam","title":"مفهوم «نو شود همی بار» را با نگاه به چرخه‌ی طبیعت بنویسید.","body":"شاعر می‌گوید اگر خزان بیاید و برگ‌ها بریزد، دوباره بهار می‌آید و باغ زنده می‌شود؛ این چرخه نشان می‌دهد پایان هر چیز آغاز دیگری است. این نگاه امید را در دل زنده نگه می‌دارد و می‌آموزد که شکست‌ها مقدمه‌ی پیروزی‌های تازه‌اند."}]},{"number":10,"title":"درس آزاد","pages":"۱۰۳ تا ۱۰۸","contents":[{"type":"answer","title":"درس آزاد در کتاب فارسی هشتم چگونه اجرا می‌شود؟","body":"معلم با هم‌فکری دانش‌آموزان یکی از کتاب‌های پیشنهادی «فهرست‌نامه‌ی کتاب‌های فارسی» را برمی‌گزیند و در کلاس بررسی می‌کند؛ از متن آن گزیده می‌خوانند، درباره‌ی واژه‌ها و مفهوم آن گفت‌وگو می‌کنند و نتیجه را به شکل خلاصه یا جمله‌های زیبا ثبت می‌نمایند.","pageRef":"صفحه ۱۰۳"},{"type":"answer","title":"هدف از گذاشتن درس آزاد چیست؟","body":"هدف پرورش علاقه به کتاب‌خوانی و آشنایی دانش‌آموزان با کتاب‌های خوب فارسی است؛ تا یاد بگیرند بیرون از کتاب درسی هم به سراغ کتاب بروند، سلیقه‌ی ادبی خود را بیابند و در گفت‌وگو و نگارش تواناتر شوند.","pageRef":"صفحه ۱۰۵"},{"type":"note","title":"نکته؛ کتاب‌خوانی اصولی","body":"برای خواندن اصولی یک کتاب، نخست فهرست و مقدمه را بخوانید تا با موضوع آشنا شوید؛ سپس با دقت و در بازه‌های زمانی مناسب پیش بروید. زیر واژه‌های تازه خط بکشید و در پایان خلاصه و برداشت خود را بنویسید تا مطلب در ذهن بماند."},{"type":"note","title":"آرایه واج‌آرایی","body":"واج‌آرایی آرایه‌ای است که در آن تکرار یک واج (حرف) آهنگ و زیبایی سخن را می‌افزاید؛ مانند تکرار آوای «س» در «سبزه، سرو، سایه‌سار». این آرایه در شعرهای طبیعت حالت موسیقی‌گونه می‌سازد و معنا را تقویت می‌کند."},{"type":"exam","title":"چرا کتاب‌خوانی از دوران تحصیل باید آغاز شود؟ پاسخ تشریحی.","body":"کتاب‌خوانی از دوران تحصیل عادتی سودمند می‌سازد؛ در این سن ذهن آماده‌ی یادگیری است و کتاب‌های خوب، واژگان و افکار نوجوان را می‌پرورانند. کسی که از همین روزها با کتاب دوست شود، در بزرگسالی دشواری‌ها را با تجربه‌ی دیگران و اندیشه‌ی خود آسان‌تر می‌گشاید."},{"type":"exam","title":"یک کتاب مناسب درس آزاد را معرفی و دو دلیل برای انتخاب آن بنویسید.","body":"می‌توان کتابی از داستان‌های کوتاه فارسی یا زندگی دانش‌مندان برگزید؛ زیرا نخست زبان ساده و داستان‌های کوتاه دارد و خواندنش خسته‌کننده نیست، دوم آکنده از پندهای زندگی است و گفت‌وگو درباره‌ی آن در کلاس، درس‌های اخلاقی و اجتماعی نیز دارد."}]},{"number":11,"title":"با یک دفتر و یک قلم","pages":"۱۰۹ تا ۱۲۰","contents":[{"type":"answer","title":"شاعر در «با یک دفتر و یک قلم» قلم و دفتر را چگونه تصویر می‌کند؟","body":"قلم و دفتر را کلید آینده و وسیله‌ی ساختن سرنوشت می‌نمایاند؛ با همین ابزار ساده، کودک امروز نویسنده و مهندس فردا می‌شود. شاعر می‌گوید اندوخته‌ی امروز صفحه‌های دفتر، فردا روشنی مسیر زندگی خواهد بود.","pageRef":"صفحه ۱۰۹"},{"type":"answer","title":"پیام شعر درباره‌ی کوشش امروز چیست؟","body":"پیام آن است که آینده در دست‌های امروز ساخته می‌شود؛ کسی که امروز با دفتر و قلم می‌کوشد، فردا پشتوانه‌ای دانش‌مندانه دارد. شاعر نوجوانان را به امید، برنامه‌ریزی و دوری از بی‌حوصلگی فرا می‌خواند تا روزهای درس، گنجینه‌ی فردایشان باشد.","pageRef":"صفحه ۱۱۱"},{"type":"note","title":"دستور زبان؛ مفعول","body":"مفعول اسم یا گروهی است که کار بر آن واقع می‌شود و نشانه‌اش «را» است؛ مانند: با قلم، سرنوشت را می‌سازیم که «سرنوشت» مفعول است. اگر مفعول نکره باشد «را» نمی‌گیرد؛ مانند: دفتری خریدم."},{"type":"note","title":"آرایه تکرار","body":"تکرار آرایه‌ای است که واژه یا عبارتی چند بار می‌آید تا تأکید و آهنگ سخن بیشتر شود؛ مانند بازآمدن «با یک دفتر و یک قلم» در شعر که اهمیت ابزار دانش را برجسته می‌کند. تکرار در شعرهای کودک و نوجوان فراوان است."},{"type":"exam","title":"چرا شاعر ابزار ساده‌ای مانند دفتر و قلم را «کلید سرنوشت» می‌نامد؟ پاسخ تشریحی.","body":"زیرا بزرگ‌ترین دگرگونی‌های جهان با نوشتن آغاز شده است؛ اندیشه‌ها با قلم ثبت می‌شوند، درس با دفتر فرا گرفته می‌شود و دانش نسل به نسل می‌رسد. شاعر می‌خواهد بگوید ساختن آینده نیاز به وسایل گران‌قیمت ندارد؛ کوشش همراه با دفتر و قلم، درهای فردا را می‌گشاید."},{"type":"exam","title":"آرایه‌های به کار رفته در این شعر را با مثال توضیح دهید.","body":"تکرار: بازآمدن «دفتر و قلم» در بیت‌ها که بر اهمیت آن تأکید دارد. تشخیص: قلم مانند دوستی دلسوز که راهنمای ماست. کنایه: «کلید سرنوشت» کنایه از وسیله‌ی دستیابی به آینده‌ی روشن. این آرایه‌ها پیام امیدبخش شعر را رساتر می‌کنند."}]},{"number":12,"title":"قاضی بست","pages":"۱۲۱ تا ۱۳۲","contents":[{"type":"answer","title":"حکایت قاضی بست درباره‌ی چیست و پیام آن کدام است؟","body":"از قاضی شهر بست می‌پرسند چرا یکی از دو مرد بدکردار را به دیگری سپردی؛ او می‌گوید امیدوارم از وسوسه‌ی شیطان درآید و به راه راست بازگردد و با شوق به نیکی‌ها بگراید. پیام حکایت، امید به تغییر انسان و دعوت به نیکی است.","pageRef":"صفحه ۱۲۱"},{"type":"answer","title":"از رفتار قاضی چه درسی درباره‌ی برخورد با خطاکاران می‌گیریم؟","body":"قاضی به جای مجازات سخت، امیدوارانه برخورد می‌کند و راه بازگشت را باز می‌گذارد؛ درس می‌گیریم که انسان‌ها می‌توانند تغییر کنند و میدان دادن به توبه و اصلاح، گاه مؤثرتر از تنبیه است. دادگری همراه با مهربانی، کارگشاتر است.","pageRef":"صفحه ۱۲۳"},{"type":"note","title":"واژه‌نامه قاضی بست","body":"حواله کردن: سپردن کار به دیگری. شریر: بدکار و تبهکار. وسوسه: انگیزه‌ی درونی برای بدی که از شیطان است. طرف راستی: راه درست. این واژه‌ها را در معنی جمله‌های حکایت به درستی به کار ببرید."},{"type":"note","title":"دستور زبان؛ جمله وابسته با «که»","body":"در «امیدوارم که از وسوسه‌ی شیطان درآید»، جمله‌ی پس از «که» جمله‌ی وابسته‌ی ماشابه است؛ یعنی کامل‌کننده‌ی معنای فعل «امیدوارم». جمله‌های وابسته به تنهایی معنای کاملی نمی‌دهند و باید با جمله‌ی اصلی بیایند."},{"type":"exam","title":"چرا سخنان سعدی پس از گذشت قرن‌ها هنوز تازه است؟ پاسخ تشریحی.","body":"زیرا سعدی از تجربه‌ی زندگی و دل آدمیان می‌گوید، نه از خیال‌های زودگذر؛ زبانش ساده و آهنگین است و حکایت‌هایش کوتاه اما پرمعنا. عدالت، مهربانی و امید که در حکایت قاضی بست می‌بینیم، نیاز همیشگی بشر است؛ از این رو این سخنان در هر زمان خواننده دارد."},{"type":"exam","title":"معنی آغاز حکایت «قاضی بست را گفتند چه سبب شد که...» را بنویسید.","body":"از قاضی شهر بست پرسیدند چه چیز باعث شد که یکی از این دو مرد بدکردار را به دیگری بسپاری تا نگهبان او باشد؟ این پرسش آغاز حکایتی است که در پاسخ آن، اندیشه‌ی مهربانانه و امیدوارانه‌ی قاضی درباره‌ی اصلاح انسان‌ها نشان داده می‌شود."}]},{"number":13,"title":"همای رحمت","pages":"۱۳۳ تا ۱۴۲","contents":[{"type":"answer","title":"پروین اعتصامی در «همای رحمت» چه کسی را ستایش می‌کند؟","body":"او انسانی نیکوکار، دادگر و دانشمند را با پرنده‌ی همای که نشانه‌ی سعادت است مقایسه می‌کند؛ کسی که در زندگی به مردم کمک کرد و پس از مرگ نیز نام نیک و یاد او زنده است. شاعر نشان می‌دهد ارزش واقعی انسان به کارهای نیک اوست نه به مال و مقام.","pageRef":"صفحه ۱۳۳"},{"type":"answer","title":"چرا شعر «همای رحمت» را مرثیه می‌نامند؟","body":"زیرا پروین آن را در سوگ کسی سروده که از میان رفته است؛ اما به جای شکایت، از خوبی‌های او می‌گوید و درس زندگی می‌دهد. مرثیه شعری است درباره‌ی یادبود انسان از دست رفته و این شعر نمونه‌ای برجسته و اندیشمندانه از آن است.","pageRef":"صفحه ۱۳۵"},{"type":"note","title":"شناخت شاعر؛ پروین اعتصامی","body":"رخشنده اعتصامی با تخلص پروین، از شاعران بزرگ زن ایران در دوره‌ی معاصر است؛ دیوان اشعار او پر از قطعه‌هایی درباره‌ی اخلاق، عدالت و آموزش است. زبان او استوار و استدلالی است و به سبب توجه به تربیت، به «شاعر مدرسه» شهرت دارد."},{"type":"note","title":"دستور زبان؛ اسم مفعول (صفت مفعولی)","body":"اسم مفعول واژه‌ای است که از مصدر ساخته می‌شود و معنای انجام‌شده دارد؛ مانند: نوشته، رفته، آفریده، سرشته. این واژه‌ها می‌توانند نقش صفت داشته باشند؛ مانند: نام نیکِ ماندگار، کارِ کرده. در شعرهای یادبود، این صفت‌ها فراوان‌اند."},{"type":"exam","title":"معنای کنایی «همای رحمت» را توضیح دهید.","body":"همای پرنده‌ای است افسانه‌ای که سایه‌اش را نشانه‌ی سعادت و پادشاهی می‌دانستند؛ شاعر انسان نیک را به این پرنده مانند می‌کند تا بگوید او سرچشمه‌ی رحمت و خیر بود و سایه‌ی مهربانی‌اش بر مردم گسترده بود. پس «همای رحمت» کنایه از انسان کامل و بخشنده است."},{"type":"exam","title":"از این شعر چه درسی درباره‌ی نیک‌نامی می‌گیریم؟ پاسخ تشریحی.","body":"نیک‌نامی با کارهای خوب ساخته می‌شود و با مرگ نمی‌میرد؛ کسی که در زندگی دست مردم را گرفت، پس از رفتن نیز در دل‌ها زنده است. شعر پروین می‌آموزد که مال و مقام فانی‌اند اما نام نیک ماندگار است؛ پس باید عمر را در نیکی و خدمت به دیگران سپرد."}]},{"number":14,"title":"عهد و پیمان","pages":"۱۴۳ تا ۱۵۴","contents":[{"type":"answer","title":"در درس «عهد و پیمان» اهمیت وفاداری چگونه بیان می‌شود؟","body":"با حکایت‌ها و مثال‌هایی نشان می‌دهد که پیمان‌شکنی آبرو را می‌برد و وفاداری، اعتماد و آبرو می‌آورد؛ انسان وفادار در سختی هم پای عهدش می‌ماند و همین او را بزرگ می‌کند. سخن آدمی با پیمانش گره خورده است؛ پیمان‌شکن حتی اگر دانشمند باشد، سزاوار اعتماد نیست.","pageRef":"صفحه ۱۴۳"},{"type":"answer","title":"چه زمانی عهد و پیمان ارزشمند است؟","body":"وقتی که با راستی بسته شده و با کارهای خوب همراه باشد؛ پیمانی که بر خطا باشد باید ترک شود. پیمان با خدا بر عبادت و نیکی، و پیمان با مردم بر رعایت حق آنان است؛ هر دو نشانه‌ی شخصیت انسان مؤمن و آزاده‌اند.","pageRef":"صفحه ۱۴۵"},{"type":"note","title":"دستور زبان؛ جمله شرط","body":"جمله شرط از دو بخش ساخته می‌شود: شرط (بخش «اگر» یا «هرگاه») و پاسخ شرط. در «اگر پیمان ببندی، پای آن بایست» بخش نخست شرط و بخش دوم پاسخ آن است. در شرط‌ها، فعل بخش پاسخ اغلب مضارع التزامی می‌آید."},{"type":"note","title":"واژه‌نامه درس","body":"پیمان: قرار و عهد. عهد: قول و پیمان. وفادار: پایدار در عهد. خلف وعده: شکستن قول. واژه‌های «عهد» و «پیمان» هم‌معنا هستند و در شعر و نثر برای تأکید کنار هم می‌آیند؛ مانند: عهد و پیمان خود را نشکن."},{"type":"exam","title":"چرا پیمان‌شکنی بدترین ویژگی انسان شمرده می‌شود؟ پاسخ تشریحی.","body":"زیرا جامعه بر اعتماد بنا شده است و پیمان‌شکن این اعتماد را ویران می‌کند؛ سخنش پیش مردم بی‌ارزش می‌شود و کسی به او دل نمی‌بندد. در فرهنگ دینی ما نیز وفای به عهد نشانه‌ی ایمان و پیمان‌شکنی نشانه‌ی بی‌اعتباری است؛ پس حفظ پیمان، حفظ آبرو و شخصیت است."},{"type":"exam","title":"دو نمونه از عهد و پیمان‌های مهم زندگی انسان را نام ببرید و توضیح دهید.","body":"پیمان بندگان با خدا بر پرستش و پرهیز از گناه که در فطرت هر انسان نهاده شده است؛ و پیمان‌های روزمره مانند وعده‌ی درس خواندن به پدر و مادر یا کمک به هم‌کلاسی. پاسداشت هر دو، انسان را سربلند می‌کند و فراموشی آن‌ها اعتماد دیگران را از میان می‌برد."}]},{"number":15,"title":"کویر","pages":"۱۵۵ تا ۱۶۸","contents":[{"type":"answer","title":"زیبایی‌های کویر در این درس چگونه نشان داده می‌شود؟","body":"نویسنده از شب‌های ستاره‌افشان، سکوت گرم، باغ‌های سرسبز لبه‌ی کویر و مهمان‌نوازی مردمانش می‌گوید؛ جایی که آب گران‌بهاست اما دل‌ها دریایی است. کویر با همه‌ی خشکی‌اش رنگ‌ها و آواها و رازهایی دارد که تنها نگاه حوصله‌مند می‌بیند.","pageRef":"صفحه ۱۵۵"},{"type":"answer","title":"از زندگی مردمان کویر چه می‌آموزیم؟","body":"صبر و شکیبایی، قناعت و مهمان‌دوستی؛ آنان با اندک آب، باغ و زندگی می‌سازند و به یکدیگر دل می‌بازند. درس می‌گیریم که خوشبختی به فراوانی مال نیست؛ به دل‌های پاک و کوشش است. کویری‌ها نشان می‌دهند سختی، انسان را خلاق و پایدار می‌کند.","pageRef":"صفحه ۱۵۷"},{"type":"note","title":"دستور زبان؛ جمله ساده و مرکب","body":"جمله ساده یک فعل اصلی دارد؛ مانند: کویر سکوتی ژرف دارد. جمله مرکب از دو یا چند جمله‌ی هم‌پایه یا وابسته ساخته می‌شود؛ مانند: شب می‌آید و ستاره‌ها می‌درخشند. در نثر توصیفی، جمله‌های مرکب تصویر را کامل‌تر می‌کنند."},{"type":"note","title":"آرایه در نثر توصیفی","body":"نثر توصیفی زیبا از آرایه‌ها بهره می‌گیرد؛ تشبیه مانند «کویر همچون دریایی از خاک و آفتاب»، تشخیص مانند «شب، سکوتش را بر زمین می‌گسترد» و واج‌آرایی با آواهای خوش. این آرایه‌ها خواننده را در دل صحنه می‌نشینند."},{"type":"exam","title":"نویسنده چگونه نشان می‌دهد زیبایی به شهرهای بزرگ و سرسبز منحصر نیست؟","body":"او با توصیف آسمان پرستاره‌ی کویر، طلوع و غروب آفتاب و باغ‌های کناره‌ی کویر نشان می‌دهد هر سرزمین به سهم خود زیبا و پر از شگفتی است؛ کافی است نگاه ما آلوده‌ی عادت نباشد. پیام آن است که دوستی وطن با شناخت همه‌ی چهره‌های آن عمیق می‌شود."},{"type":"exam","title":"مفهوم «آب در کویر گران‌بهاست اما دل‌ها دریاست» را توضیح دهید.","body":"در کویر کم‌آب، هر قطره ارزشمند است و مردم با تدبیر از آن بهره می‌برند؛ اما برخلاف کمبود آب، بخشندگی آنان بی‌اندازه است و از اندوخته‌ی اندک خود به مهمان می‌دهند. این تضاد زیبا نشان می‌دهد انسانیت با فراوانی مال سنجیده نمی‌شود؛ با دل گشادگی سنجیده می‌شود."}]},{"number":16,"title":"رستم و اشک بوس","pages":"۱۶۹ تا ۱۸۰","contents":[{"type":"answer","title":"در داستان رستم و اشک بوس، نبرد چگونه توصیف می‌شود؟","body":"به سبک حماسی؛ رستم پهلوان ایرانی با دلیری و تیزهوشی در برابر اشک بوس می‌ایستد و پس از نبردی سخت، او را از پا درمی‌آورد. تصویرها بزرگ و آهنگین‌اند تا بزرگی پهلوان و اهمیت نبرد برای دفاع از مرز و مردم را بنمایانند.","pageRef":"صفحه ۱۶۹"},{"type":"answer","title":"ویژگی‌های سبک حماسی در این درس کدام است؟","body":"واژه‌های کهن و آهنگین، صفات بزرگ‌نمایی‌گونه برای پهلوانان، تشبیه پهلوان به کوه و شیر، و شتاب و هیجان روایت. این سبک خواننده را در میدان نبرد می‌نشاند و از پهلوان تصویری می‌سازد که نماد شجاعت و دادگری است.","pageRef":"صفحه ۱۷۱"},{"type":"note","title":"آرایه اغراق","body":"اغراق بزرگ‌نمایی هنرمندانه در توصیف است؛ مانند آن‌که ضربه‌ی پهلوان صخره را می‌شکافد یا آوازش لشکر دشمن را می‌لرزاند. اغراق در داستان‌های حماسی، بزرگی پهلوان و سنگینی رخدادها را نشان می‌دهد و شاهنامه سرشار از آن است."},{"type":"note","title":"شناخت اثر؛ شاهنامه فردوسی","body":"شاهنامه حماسه‌ی بزرگ ابوالقاسم فردوسی است که سرودن آن نزدیک سی سال به درازا کشید و بیش از پنجاه هزار بیت دارد؛ داستان‌های ایرانی از کیومرث تا یزدگرد را در بر می‌گیرد. فردوسی با شاهنامه، زبان فارسی را زنده و استوار نگه داشت."},{"type":"exam","title":"چرا فردوسی پهلوان را نمونه‌ی کامل انسان ایرانی می‌سازد؟ پاسخ تشریحی.","body":"زیرا پهلوان شاهنامه تنها زورمند نیست؛ او دادگر، دفاع‌کننده‌ی ضعیفان و پایدار در راه ایران است. رستم در نبرد با اشک بوس هم جنگاوری می‌کند و هم حکمت به کار می‌برد. فردوسی با این تصویر می‌گوید بزرگی واقعی، همراهی نیرومندی با درستی است."},{"type":"exam","title":"ویژگی‌های زبان شاهنامه را با مثال بنویسید.","body":"زبان شاهنامه استوار و آهنگین است؛ صفت‌های ترکیبی، تشبیه‌های بزرگ مانند «چون کوه» و فعل‌های پویا، صحنه‌ی نبرد را چشمگیر می‌کنند. کاربرد فراوان واژه‌های جنگاوری و اغراق، روایت را حماسی می‌کند و خواننده را با شور پهلوانی همراه می‌سازد."}]},{"number":17,"title":"از پاریز تا پاریس","pages":"۱۸۱ تا ۱۹۲","contents":[{"type":"answer","title":"در درس «از پاریز تا پاریس» از چه سخن گفته می‌شود؟","body":"از روستای زیبای پاریز در استان کرمان؛ نویسنده با طنز و مهربانی، زیبایی‌های این روستای کوچک را با پاریس مقایسه می‌کند تا بگوید آبشارها و باغ‌های زادگاهش از بسیاری شهرهای نامی جهان کم ندارند و زیبایی با بزرگی شهر سنجیده نمی‌شود.","pageRef":"صفحه ۱۸۱"},{"type":"answer","title":"پیام نویسنده درباره‌ی زادگاه چیست؟","body":"زادگاه، هر کوچک و دور که باشد، جایگاه خاطره‌ها و ریشه‌ی ماست؛ دوست داشتن آن نشانه‌ی وفاداری و خودشناسی است. نویسنده با عشق به پاریز می‌گوید باید زادگاه‌ها را شناخت، دوست داشت و برای آبادانی آن‌ها کوشید؛ تا از پاریز تا پاریس فاصله نماند.","pageRef":"صفحه ۱۸۳"},{"type":"note","title":"دستور زبان؛ ساختار «از ... تا ...»","body":"این ساختار برای بیان گذر و گستره به کار می‌رود؛ «از» و «تا» حرف اضافه‌اند و پس از آن‌ها متمم می‌آید؛ مانند: از پاریز تا پاریس، از کودکی تا جوانی. این ترکیب گاه کنایی است و دگرگونی و پیمودن راه را نشان می‌دهد."},{"type":"note","title":"نکته املایی","body":"در واژه‌های ناآشنا به آوای پایانی دقت کنیم؛ «پاریز» نام روستایی ایرانی است با «ز» فارسی و «پاریس» نام پایتخت فرانسه با «س». اشتباه نکردن واژه‌های مشابه مانند این دو، نشانه‌ی درست‌نویسی و رعایت امانت در نوشتن نام‌هاست."},{"type":"exam","title":"نقش طنز و مهربانی در این درس چیست؟ پاسخ تشریحی.","body":"نویسنده به جای شکایت از کوچکی زادگاه، با لبخند آن را در برابر شهر نامی جهان می‌نشاند؛ این طنز نرم، خواننده را می‌خنداند و اندیشه‌اش را به ژرفای پیام می‌کشاند: غرور به زادگاه و لزوم آبادانی آن. طنز همراه با محبت، درس را ماندگار و دلنشین می‌کند."},{"type":"exam","title":"اگر شما زادگاهی کوچک داشتید چگونه آن را معرفی می‌کردید؟ پاسخ تشریحی.","body":"از طبیعت، آداب و مردمش می‌نوشتم؛ آب‌ها، باغ‌ها، آوای پرندگان و مهربانی اهالی را توصیف می‌کردم و یک خاطره‌ی واقعی می‌گفتم تا متن زنده شود. برای آبادانی نیز دو آرزو می‌نوشتم؛ این‌گونه معرفی، هم عشق به زادگاه را نشان می‌دهد و هم دیگران را به دیدن آن ترغیب می‌کند."}]},{"number":18,"title":"خوب جهان","pages":"۱۹۳ تا ۲۰۲","contents":[{"type":"answer","title":"منظور از «خوب جهان» کیست و چه ویژگی‌هایی دارد؟","body":"انسانی است که با رفتار نیک، جهان را برای خود و دیگران خوش‌آیند می‌کند؛ راست‌گو، مهربان، دفاع‌گر از حق و سودرسان به مردم. چنین کسی پس از رفتنش نیز در دل‌ها و یادها زنده است؛ زیرا خوبی، ماندگارترین یادگار است.","pageRef":"صفحه ۱۹۳"},{"type":"answer","title":"بیت «بنی‌آدم اعضای یک پیکرند» سعدی با مفهوم این درس چه پیوندی دارد؟","body":"سعدی می‌گوید همه‌ی انسان‌ها از یک گوهرند و باید شادی و غم یکدیگر را احساس کنند؛ درس خوب جهان نیز همین همدلی است. خوب جهان درد دیگران را با خود احساس می‌کند، به یاری همنوعان می‌شتابد و با رفتار نیک، پیوند انسان‌ها را استوار می‌کند.","pageRef":"صفحه ۱۹۵"},{"type":"note","title":"دستور زبان؛ فعل‌های اسنادی","body":"فعل اسنادی معنا را کامل می‌کند و حالت نهاد را می‌رساند؛ مانند: است، شد، گشت، بود. در «خوبِ جهان ماندگار است»، «است» فعل اسنادی و «مانندگار» مسند است. جمله‌های اسنادی دو ستون دارند: نهاد و مسند."},{"type":"note","title":"آرایه کنایه","body":"کنایه سخنی است که معنای خواسته دور از معنای واژگانی آن است؛ مانند «دست به دست کردن» کنایه از رساندن متوالی و «سایه‌ی خوبان» کنایه از پشتیبانی آنان. کنایه به کلام لطافت می‌بخشد و معنا را نرم و گیرا می‌کند."},{"type":"exam","title":"چرا گفته می‌شود خوبی کردن سرمایه‌ی جاودانگی است؟ پاسخ تشریحی.","body":"زیرا مال و تن و مقام از انسان جدا می‌شوند اما اثر کارهای نیک در زندگی دیگران می‌ماند؛ مدرسه‌ای که بنا شد، گرسنه‌ای که سیر شد و دل‌شکسته‌ای که آرام گرفت، همه یادگار خوبی‌اند. انسان خوب پس از مرگ نیز در دعاها و خاطره‌ها زنده است؛ این همان جاودانگی است."},{"type":"exam","title":"سه کار کوچک اما نیک را نام ببرید که با انجام آن‌ها «خوب جهان» باشیم.","body":"راست گفتن حتی به زیان خود؛ خواندن دعای خیر برای دیگران؛ و یاری کردن به هم‌کلاسی در درس. این کارها کوچک به چشم می‌آیند اما ستون‌های شخصیت‌اند؛ کسی که در کوچک‌ها خوب باشد، در کارهای بزرگ نیز پای عهدش می‌ماند و جهان برای او و دیگران خوش می‌شود."}]},{"number":19,"title":"درس آزاد","pages":"۲۰۳ تا ۲۱۰","contents":[{"type":"answer","title":"در پایان سال، درس آزاد بار دیگر چه فرصتی می‌سازد؟","body":"فرصتی برای مرور آموخته‌های فارسی در قالب متنی انتخابی؛ دانش‌آموز از کتاب‌های خوانده‌شده‌ی سال، متن یا داستانی را برمی‌گزیند و در کلاس معرفی می‌کند. این کار مهارت خواندن، سخنوری و نوشتن را با میل و انتخاب خود دانش‌آموز پرورش می‌دهد.","pageRef":"صفحه ۲۰۳"},{"type":"answer","title":"چگونه از درس آزاد بهترین بهره را ببریم؟","body":"کتابی را برگزینیم که به آن علاقه داریم، متنش را پیشاپیش بخوانیم و واژه‌های تازه‌اش را بیاموزیم؛ سپس برای معرفی آن در کلاس خلاصه‌ای بنویسیم و یک بخش کوتاه را بخوانیم. گفت‌وگو درباره‌ی برداشت‌ها، درس را به جشن کتاب‌خوانی بدل می‌کند.","pageRef":"صفحه ۲۰۵"},{"type":"note","title":"نکته؛ نوشتن معرفی کتاب","body":"در معرفی کتاب به ترتیب بنویسید: نام کتاب و نویسنده، موضوع، ویژگی‌های جالب آن و دلیل انتخاب. جمله‌ها کوتاه و روشن باشد و از مبالغه بپرهیزید؛ پایان معرفی را با یک پرسش جالب یا پیشنهاد خواندن بسازید."},{"type":"note","title":"دستور زبان؛ جمع واژه‌ها","body":"واژه‌های فارسی با «ها» جمع بسته می‌شوند؛ مانند: کتاب‌ها، درخت‌ها. واژه‌های عربی گاه جمع مکسّر دارند؛ مانند: روایت: روایات و حقیقت: حقایق. در نوشتن یکی از دو صورت را برگزینید و در جمله به درستی به کار ببرید تا معنا روان بماند."},{"type":"exam","title":"کتاب‌خوانی چه اثری بر گفتار و نوشتار ما دارد؟ پاسخ تشریحی.","body":"کتاب‌خوانی واژگان ما را می‌افزاید، جمله‌سازی را روان می‌کند و اندیشه را منظم می‌سازد؛ کسی که زیاد می‌خواند، در نوشتن انشا و در سخن گفتن مثال و تصویر بیشتری دارد. بهترین راه تقویت زبان فارسی، پیوسته خواندن کتاب‌های خوب است."},{"type":"exam","title":"پایان سال را با سه آرزوی کتاب‌خوانی جمع‌بندی کنید.","body":"آرزوی نخست، خواندن چند کتاب از فهرست‌نامه‌ی کتاب‌های فارسی در تابستان؛ دوم، نوشتن خاطره یا خلاصه‌ی هر کتاب در یک دفتر؛ سوم، هدیه دادن یک کتاب خوب به دوستی که کمتر می‌خواند. با این آرزوها دوستی با کتاب از کلاس درس به زندگی می‌رسد."}]}]},{"title":"مطالعات اجتماعی هشتم","subject":"مطالعات اجتماعی","description":"جواب سوال‌ها، نکات مهم و سوالات امتحانی همه درس‌های کتاب مطالعات اجتماعی هشتم","color":"orange","icon":"globe","chapters":[{"number":1,"title":"ظهور اسلام و دعوت پیامبر (ص)","pages":"۸ تا ۲۲","contents":[{"type":"answer","title":"پیامبر اسلام (ص) در چه زمانی و کجا به پیامبری برگزیده شد؟","body":"پیامبر اسلام حضرت محمد (ص) در چهل‌سالگی و در سال ۶۱۰ میلادی، هنگام عبادت در غار حرا در نزدیکی مکه به پیامبری برگزیده شد. نخستین آیه‌های قرآن از سوره علق نازل شد که با واژه اقرأ به معنای بخوان آغاز می‌شود و دعوت او از همین نقطه آغاز گردید.","pageRef":"صفحه ۱۰"},{"type":"answer","title":"دعوت علنی پیامبر (ص) چگونه آغاز شد؟","body":"پس از سه سال دعوت پنهانی، به فرمان خداوند دعوت آشکار شد. پیامبر (ص) نخست بستگان خود را به کوه صفا فراخواند و آنان را به پرستش خدای یگانه دعوت کرد و سپس مردم مکه را آشکارا به توحید فراخواند. مشرکان که منافع خود را در خطر می‌دیدند، آزار پیامبر و پیروانش را آغاز کردند.","pageRef":"صفحه ۱۳"},{"type":"note","title":"دوران جاهلیت","body":"به دوران پیش از اسلام در شبه‌جزیره عربستان، دوران جاهلیت می‌گویند؛ زیرا مردم آن روزگار از وجود پیامبر و کتاب آسمانی بی‌بهره بودند. بت‌پرستی، دخترکشی، جنگ‌های قبیله‌ای و بی‌حقوقی زنان در میان آنان رواج داشت؛ برای مثال عرب‌ها بت‌هایی مانند لات و عزی را در کعبه می‌پرستیدند."},{"type":"note","title":"حمایت ابوطالب و خدیجه","body":"پس از بعثت، ابوطالب عموی پیامبر (ص) از ایشان با همه توان حمایت کرد و حضرت خدیجه (س) همسر پیامبر، همه ثروت خود را در راه اسلام هزینه کرد. برای نمونه ابوطالب با نفوذ خود مانع آزار قریش به پیامبر شد و حضرت خدیجه نخستین زنی بود که به پیامبر ایمان آورد."},{"type":"exam","title":"چرا پیامبر (ص) در سه سال نخست، دعوت خود را پنهانی انجام داد؟","body":"پاسخ تشریحی: اسلام تازه پدید آمده بود و مشرکان مکه قدرتمند و ستمگر بودند؛ به همین دلیل پیامبر (ص) سه سال دعوت را پنهانی انجام داد تا پایگاه‌های نخستین اسلام شکل بگیرد و مسلمانان نوپا زیر فشار مشرکان نابود نشوند. پس از آماده‌شدن افراد نخستین، به فرمان خداوند دعوت علنی آغاز شد."},{"type":"exam","title":"نخستین گروندگان به اسلام چه کسانی بودند و این موضوع چه نکته‌ای را نشان می‌دهد؟","body":"پاسخ تشریحی: حضرت خدیجه (س) همسر پیامبر، امام علی (ع) که در آن زمان جوانی ده‌ساله بود، زید بن حارثه و ابوبکر نخستین گروندگان به اسلام بودند. این موضوع نشان می‌دهد اسلام در آغاز بیشتر میان زنان، جوانان و ستمدیدگان و بی‌پناهان مکه پذیرفته شد؛ زیرا پیام آن آزادی و برابری بود."}]},{"number":2,"title":"هجرت پیامبر (ص) به مدینه","pages":"۲۳ تا ۳۶","contents":[{"type":"answer","title":"مشرکان مکه برای نابودی پیامبر (ص) چه نقشه‌ای کشیدند؟","body":"سران قریش تصمیم گرفتند شب هجرت، جوانانی از هر قبیله پیرامون خانه پیامبر بایستند و ایشان را به قتل برسانند تا همه قبایل در خون پیامبر شریک شوند و بنی‌هاشم نتواند انتقام بگیرد. پیامبر (ص) از راه وحی از این نقشه آگاه شد و امام علی (ع) به جای ایشان در بستر خوابید.","pageRef":"صفحه ۲۶"},{"type":"answer","title":"پیمان‌نامه مدینه چه بندهایی داشت؟","body":"پس از ورود به مدینه، پیامبر (ص) میان مهاجران و انصار پیمان برادری بست و پیمان‌نامه‌ای میان همه گروه‌های مدینه نوشت؛ در این پیمان‌نامه بر همکاری و برادری، آزادی ادیان، دفاع مشترک از شهر و گره‌گشایی اختلاف‌ها به دست پیامبر توافق شد و بدین‌گونه نخستین جامعه اسلامی پدید آمد.","pageRef":"صفحه ۳۱"},{"type":"note","title":"غار ثور","body":"پیامبر (ص) و همراهش در مسیر هجرت سه شب در غار ثور در جنوب مکه پنهان شدند تا گروه‌های تعقیب قریش آنان را نیابند. بر پایه روایات، تار عنکبوت و آشیانه کبوتر بر دهانه غار، دشمنان را از ورود به غار ناامید کرد و پیامبر پس از آرام‌شدن اوضاع به سوی مدینه حرکت کرد."},{"type":"note","title":"مسجد پیامبر در مدینه","body":"نخستین کار پیامبر (ص) در مدینه ساخت مسجد بود؛ این مسجد پایگاه عبادت، آموزش مسلمانان، دادرسی و تصمیم‌گیری‌های حکومتی شد. در کنار آن اتاق‌هایی برای خانواده پیامبر و جای اقامت مهاجران بی‌خانه ساخته شد و شهر مدینه پیرامون همین مسجد رشد کرد."},{"type":"exam","title":"چرا مردم یثرب از پیامبر (ص) برای هجرت به شهرشان دعوت کردند؟","body":"پاسخ تشریحی: مردم یثرب در بیعت عقبه با پیامبر بیعت کرده و اسلام آورده بودند؛ میان قبایل اوس و خزرج این شهر درگیری‌های خونین بود و امید داشتند پیامبر صلح و برادری برقرار کند. یثرب سرزمینی کشاورز و ثروتمندتر از مکه بود و پس از هجرت، این شهر مدینه‌النبی نام گرفت."},{"type":"exam","title":"هجرت پیامبر (ص) چه اهمیتی در تاریخ اسلام دارد؟","body":"پاسخ تشریحی: هجرت نقطه عطف تاریخ اسلام است؛ مسلمانان از آزار مشرکان رهایی یافتند، پایگاه مستقل اسلام در مدینه شکل گرفت، نخستین جامعه و حکومت اسلامی بنیان‌گذاری شد و مسجد مرکز زندگی مسلمانان گردید. همین رویداد مبنای تاریخ هجری مسلمانان است و سال هجرت آغاز گاه تقویم اسلامی است."}]},{"number":3,"title":"سرآغاز دوران پیامبر اسلام (ص)","pages":"۳۷ تا ۵۰","contents":[{"type":"answer","title":"نخستین جنگ بزرگ مسلمانان با مشرکان چه نام داشت و نتیجه آن چه بود؟","body":"نخستین جنگ بزرگ مسلمانان، جنگ بدر در سال دوم هجری بود؛ حدود سیصد و سیزده مسلمان با امکانات اندک بر سپاه مشرکان که تعداد و تجهیزات بیشتری داشت پیروز شدند. این پیروزی روحیه مسلمانان را قوی کرد و نام و شهرت اسلام در شبه‌جزیره عربستان گسترش یافت.","pageRef":"صفحه ۴۱"},{"type":"answer","title":"صلح حدیبیه چه بود و چه فایده‌ای برای اسلام داشت؟","body":"در سال ششم هجری مسلمانان برای زیارت خانه خدا به مکه رفتند، اما مشرکان مانع ورود آنان شدند و پیمان حدیبیه بسته شد که بر پایه آن جنگ ده سال متوقف می‌گشت. هرچند برخی شرایط پیمان سنگین بود، این آتش‌بس فرصتی برای گفتگو و گسترش اسلام فراهم کرد و قرآن آن را فتحی آشکار خواند.","pageRef":"صفحه ۴۵"},{"type":"note","title":"جنگ احزاب و ایده خندق","body":"در سال پنجم هجری قبایل متحد مشرکان برای نابودی اسلام به مدینه هجوم آوردند. به پیشنهاد سلمان فارسی، مسلمانان پیرامون شهر خندق کندند تا دشمن نتواند به شهر نزدیک شود؛ سپاه دشمن پس از هفته‌ها محاصره و تلاش بی‌نتیجه ناامید برگشت و این جنگ احزاب نام گرفت."},{"type":"note","title":"فتح مکه بدون خونریزی","body":"مشرکان با همراهی دیگر قبایل، پیمان حدیبیه را شکستند؛ پیامبر (ص) نیز در سال هشتم هجری با سپاه ده‌هزار نفری به مکه رفت و این شهر را بدون جنگ و خونریزی فتح کرد. ایشان بت‌های کعبه را شکست و عفو عمومی اعلام کرد؛ بخشندگی پیامبر باعث شد بیشتر مردم مکه اسلام بیاورند."},{"type":"exam","title":"در جنگ احد چه رخ داد و مسلمانان از آن چه درسی گرفتند؟","body":"پاسخ تشریحی: در سال سوم هجری مسلمانان در آغاز جنگ احد پیروز بودند، اما کمانداران که پیامبر سفارش کرده بود بر فراز تپه بمانند برای غنیمت جا خالی کردند؛ خالد بن ولید از پشت کوه حمله کرد و مسلمانان تلفات سنگینی دادند و شهیدانی مانند حمزه داشتند. درس این جنگ، اطاعت از فرمانده است."},{"type":"exam","title":"حجةالوداع چه بود و در آن چه رخ داد؟","body":"پاسخ تشریحی: در سال دهم هجری پیامبر (ص) حجی برگزار کرد که حجةالوداع نام گرفت؛ زیرا ایشان احساس می‌کرد عمرش به پایان رسیده و برای مردم خداحافظی می‌کند. در بازگشت، در سرزمین غدیر خم به فرمان خدا مردم را به ولایت امام علی (ع) فراخواند و آیه الیوم اکملت لکم دینکم نازل شد."}]},{"number":4,"title":"امام علی (ع) و خلفا","pages":"۵۱ تا ۶۴","contents":[{"type":"answer","title":"پس از رحلت پیامبر (ص) سرزمین اسلام به دست چه کسانی افتاد؟","body":"پس از رحلت پیامبر (ص) در سال یازدهم هجری، به اعتقاد شیعه امام علی (ع) به نص پیامبر جانشین او بود؛ اما به تدریج سه تن با نام ابوبکر، عمر و عثمان با عنوان خلیفه بر سر کار آمدند. پس از کشته‌شدن عثمان، مردم با امام علی (ع) بیعت کردند و دوران خلافت ایشان آغاز شد.","pageRef":"صفحه ۵۴"},{"type":"answer","title":"ویژگی‌های حکومت امام علی (ع) را بنویسید.","body":"امام علی (ع) عدالت را پایه حکومت خود قرار داد؛ در بیت‌المال میان همه مردم یکسان رفتار می‌کرد و به برادرش عقیل نیز همان سهم اندک را داد. ایشان با سودجویانی که به نام دین ثروت اندوخته بودند برخورد کرد، برای مردم شبانه‌روز کار می‌کرد و ساده‌زیستی را پیشه خود ساخت.","pageRef":"صفحه ۵۸"},{"type":"note","title":"جنگ‌های دوران خلافت امام علی (ع)","body":"در دوران حکومت امام علی (ع) گروه‌های سودجو و قدرت‌طلب سر به شورش برداشتند؛ جنگ جمل با شورشیان بصره، جنگ صفین با معاویه و جنگ نهروان با خوارج رخ داد. برای نمونه در صفین، سپاهیان معاویه قرآن‌ها را بر نیزه بالا بردند تا سپاه امام را فریب دهند."},{"type":"note","title":"شهادت امام علی (ع)","body":"امام علی (ع) در شب نوزدهم ماه رمضان سال چهلم هجری هنگام نماز در محراب مسجد کوفه از سوی ابن‌ملجم مرادی از گروه خوارج با شمشیر زخمی برداشت و دو روز بعد به شهادت رسید. آرامگاه ایشان در نجف اشرف است و او نخستین امام شیعیان و نماد عدالت‌خواهی به شمار می‌رود."},{"type":"exam","title":"چرا امام علی (ع) پس از رحلت پیامبر بلافاصله به حکومت نرسید و در این مدت چه کرد؟","body":"پاسخ تشریحی: شیعه بر پایه رویداد غدیر خم، امام علی (ع) را جانشین پیامبر می‌داند؛ اما برخی یاران در سقیفه با دیگران بیعت کردند و حکومت را گرفتند. امام علی برای حفظ وحدت مسلمانان بیست‌وپنج سال صبر کرد، در امور کشور مشاور بود و پس از کشته‌شدن عثمان مردم با ایشان بیعت کردند."},{"type":"exam","title":"معاویه پس از کشته‌شدن عثمان چه کرد؟","body":"پاسخ تشریحی: معاویه که سال‌ها فرماندار شام بود، به بهانه خونخواهی عثمان با امام علی (ع) مخالفت کرد و جنگ صفین را برانگیخت؛ با بالا بردن قرآن بر نیزه‌ها و فریب داوران حکمیت کار را به سود خود پیش برد و پس از شهادت امام حکومت را در دست گرفت و پایه‌های حکومت امویان را بنیان گذاشت."}]},{"number":5,"title":"حکومت امویان","pages":"۶۵ تا ۷۸","contents":[{"type":"answer","title":"امویان چگونه بر مسند حکومت نشستند؟","body":"پس از شهادت امام علی (ع) و صلح امام حسن (ع) با معاویه، حکومت به دست امویان افتاد؛ معاویه حکومت را موروثی کرد و با پاداش دادن و فریب، برای جانشینی پسرش یزید بیعت گرفت. بدین‌سان حکومت اسلامی به سلطنت خاندانی امویان تبدیل شد.","pageRef":"صفحه ۶۶"},{"type":"answer","title":"واقعه عاشورا را شرح دهید.","body":"پس از مرگ معاویه، یزید از امام حسین (ع) بیعت خواست و امام بیعت با حکومت فاسد او را نپذیرفت. امام حسین (ع) همراه اهل بیت و یاران خود از مدینه به مکه و سپس به سوی کوفه حرکت کرد و در دهم محرم سال شصت‌ویکم هجری در کربلا با سپاه یزید جنگید و یاران اندکش همراه او به شهادت رسیدند.","pageRef":"صفحه ۷۰"},{"type":"note","title":"افشاگری اهل بیت پس از عاشورا","body":"پس از عاشورا، اسیران اهل بیت به رهبری امام سجاد (ع) و حضرت زینب (س) در مسیر اسارت و در کوفه و شام و مدینه، حقایق کربلا را به مردم رساندند. سخنرانی پرشور حضرت زینب در دربار یزید حکومت را رسوا کرد و افکار عمومی مسلمانان علیه امویان برانگیخته شد."},{"type":"note","title":"قیام‌های علیه امویان","body":"پس از عاشورا حرکت‌های گسترده‌ای علیه امویان شکل گرفت؛ قیام مختار در کوفه به انتقام قاتلان امام حسین (ع) پرداخت و قیام عبدالله بن زبیر در حجاز ادامه یافت. این قیام‌ها نشان داد مردم حق را از یزید گرفته‌اند و پایه‌های حکومت امویان را سست کردند."},{"type":"exam","title":"امویان برای حفظ قدرت از چه روش‌هایی استفاده می‌کردند؟","body":"پاسخ تشریحی: امویان با روش‌هایی مانند پاداش و مقام دادن به بزرگان قبایل، خریدن هوادار و شهود جعلی، تبلیغ دروغ علیه اهل بیت و به‌کارگیری زور و شمشیر قدرت را حفظ می‌کردند. معاویه حتی دستور داد در منابر به امام علی (ع) توهین شود و این کار تا دوران عمر بن عبدالعزیز ادامه داشت."},{"type":"exam","title":"پیام قیام عاشورا برای مسلمانان چیست؟","body":"پاسخ تشریحی: قیام امام حسین (ع) نشان داد در برابر حکومت ستمگر باید ایستادگی کرد و شهادت در راه حق از زندگی با ذلت برتر است. این قیام اسلام را نجات داد، ماهیت ستمگری یزید را رسوا کرد و الگوی ایثار، مقاومت و آزادی‌خواهی برای همه آزادگان جهان شد؛ یادمان عاشورا هر سال در ماه محرم زنده می‌شود."}]},{"number":6,"title":"دوران عباسیان","pages":"۷۹ تا ۹۲","contents":[{"type":"answer","title":"عباسیان چگونه به قدرت رسیدند؟","body":"عباسیان با شعار بازگرداندن حکومت به خاندان پیامبر، مردم ایران را با خود همراه کردند؛ ابومسلم خراسانی سپاهی از مردم خراسان ساخت و در سال ۱۳۲ هجری امویان را سرنگون کرد. ابوالعباس سفاح نخستین خلیفه عباسی شد و منصور دوانقی شهر بغداد را پایتخت عباسیان ساخت.","pageRef":"صفحه ۸۱"},{"type":"answer","title":"ایرانیان در برابر عباسیان چه حرکت‌هایی داشتند؟","body":"ایرانیان که عباسیان با یاری آنان به قدرت رسیده بودند، به‌زودی از ستم آنان ناامید شدند؛ سپاه خرم‌دینان به رهبری سنباد، قیام بیست‌ساله بابک خرمدین در آذربایجان و قیام مازیار در طبرستان از این حرکت‌ها بود. عباسیان با زور آنان را سرکوب کردند و ستمشان بیشتر شد.","pageRef":"صفحه ۸۵"},{"type":"note","title":"ابومسلم خراسانی","body":"ابومسلم خراسانی فرمانده سپاه خراسان بود که با همراهی مردم ایران امویان را برانداخت و در پیروزی عباسیان نقشی کلیدی داشت؛ اما منصور خلیفه عباسی از قدرت زیاد او بیمناک شد و سرانجام او را به قتل رساند. این رویداد نشان می‌دهد عباسیان به یاری‌کنندگان خود وفادار نماندند."},{"type":"note","title":"افشین و مازیار","body":"مازیار فرمانروای طبرستان علیه عباسیان قیام کرد؛ افشین سردار ایرانی عباسیان در آغاز با او همداستان بود، اما سرانجام او را سرکوب کرد. سپس افشین به اتهام همدستی با مازیار زندانی و به قتل رسید. این ماجرا ضعف و ناامنی درون حکومت عباسیان را نشان می‌دهد."},{"type":"exam","title":"حکومت عباسیان چگونه و چرا رو به ضعف گذاشت؟","body":"پاسخ تشریحی: عباسیان به سپاهیان ترک‌تبار اتکا می‌کردند و با گذشت زمان فرمانروایان محلی مانند طاهریان، صفاریان و سامانیان در ایران استقلال یافتند؛ فساد دربار، جنگ‌های درونی خلفا و قدرت گرفتن سپاهیان و وزیران نیز خلافت را سست کرد تا آنان تنها نامی از خلافت داشته باشند و کشورهای کوچک پدید آید."},{"type":"exam","title":"موضع مردم ایران در برابر عباسیان چگونه بود؟","body":"پاسخ تشریحی: ایرانیان در آغاز با شعار حق خاندان پیامبر از عباسیان پشتیبانی کردند و ابومسلم خراسانی سپاه آنان را ساخت؛ اما عباسیان مانند امویان ستم روا داشتند و ایرانیان با حرکت‌های سنباد، بابک خرمدین و مازیار بر آنان شوریدند. نتیجه این شورش‌ها پیدایش حکومت‌های ایرانی مستقل مانند سامانیان بود."}]},{"number":7,"title":"تمدن و فرهنگ اسلامی","pages":"۹۳ تا ۱۰۶","contents":[{"type":"answer","title":"بیت‌الحکمه چه بود و چه نقشی در تمدن اسلامی داشت؟","body":"بیت‌الحکمه مرکز علمی بزرگی در بغداد بود که در دوران خلیفه مأمون ساخته شد؛ در آن آثار علمی یونان، ایران و هند ترجمه می‌شد و دانشمندان به تحقیق و نوشتن کتاب می‌پرداختند. حرکت ترجمه از بیت‌الحکمه پایه‌های پیشرفت علمی تمدن اسلامی را استوار کرد.","pageRef":"صفحه ۹۵"},{"type":"answer","title":"چند تن از دانشمندان مسلمان و دستاورد هر یک را نام ببرید.","body":"خوارزمی بنیان‌گذار جبر و معرفی‌کننده صفر و ارقام به جهان، محمد بن زکریای رازی پزشک بزرگ و کشف‌کننده الکل و نویسنده کتاب حاوی، ابوعلی سینا نویسنده کتاب قانون در پزشکی و ابوریحان بیرونی دانشمند ریاضی و نجوم از این دانشمندان بودند؛ کتاب قانون قرن‌ها در اروپا تدریس می‌شد.","pageRef":"صفحه ۹۹"},{"type":"note","title":"نقش ایرانیان در تمدن اسلامی","body":"ایرانیان نقش بزرگی در پیدایش و پیشرفت تمدن اسلامی داشتند؛ بسیاری از وزیران عباسی مانند خاندان برمک ایرانی بودند، دانشمندان بزرگ مانند رازی و ابن‌سینا و خوارزمی ایرانی بودند و با حکومت‌های ایرانی مانند سامانیان، زبان و فرهنگ فارسی دوباره رواج یافت."},{"type":"note","title":"هنر و معماری اسلامی","body":"هنر اسلامی در دوره‌های مختلف درخشید؛ خوشنویسی برای کتابت قرآن، تذهیب و نگارگری کتاب‌ها و معماری زیبای مساجد و کاشی‌کاری از نمونه‌های آن است. برای نمونه، خط کوفی و نقوش کاشی‌کاری در مساجد قدیمی از آثار ماندگار هنر اسلامی به شمار می‌روند."},{"type":"exam","title":"چه عواملی به پیشرفت تمدن اسلامی کمک کرد؟","body":"پاسخ تشریحی: تشویق اسلام به یادگیری دانش، ترجمه آثار علمی ایران و یونان و هند، پشتیبانی حکومت‌ها از دانشمندان، ساخت مراکزی مانند بیت‌الحکمه و کتابخانه‌های بزرگ و امنیت راه‌ها و گسترش شهرها به مبادلات علمی و تجاری کمک کرد؛ نتیجه آن پیدایش دانشمندان بزرگی مانند ابن‌سینا و رازی شد."},{"type":"exam","title":"چرا گفته می‌شود پیشرفت علمی اروپا مدیون تمدن اسلامی است؟","body":"پاسخ تشریحی: دانشمندان مسلمان آثار گذشته را نجات دادند و دانش‌های تازه‌ای مانند جبر، صفر، کتاب‌های پزشکی و ابزارهای نجومی به جهان ارائه کردند؛ این آثار در قرون بعد به لاتین ترجمه شد و مانند کتاب قانون ابن‌سینا قرن‌ها در دانشگاه‌های اروپا تدریس شد. پس اروپا پیش از رنسانس از تمدن اسلامی بهره برد."}]},{"number":8,"title":"مهاجرت علویان به ایران","pages":"۱۰۷ تا ۱۱۸","contents":[{"type":"answer","title":"علویان چه کسانی بودند و چرا به ایران مهاجرت کردند؟","body":"علویان فرزندان و نوادگان امام علی (ع) از اهل بیت بودند؛ عباسیان از هر جنبش آنان بیمناک بودند و آنان را زیر نظر داشت و زندانی و کشت. به همین دلیل بسیاری از علویان به ایران مهاجرت کردند و مردم ایران به پاس احترام به اهل بیت از آنان استقبال کردند.","pageRef":"صفحه ۱۰۹"},{"type":"answer","title":"دولت علویان طبرستان چگونه پدید آمد؟","body":"حسن بن زید علوی با همراهی مردم طبرستان در سال ۲۵۰ هجری حکومت علویان را در طبرستان تشکیل داد؛ این حکومت با عدالت و ساده‌زیستی شناخته می‌شد، مردم گیلان و دیلم و طبرستان را با مذهب تشیع آشنا کرد و پیوند علویان با مردم ایران را استوارتر ساخت.","pageRef":"صفحه ۱۱۲"},{"type":"note","title":"استقبال ایرانیان از علویان","body":"ایرانیان به خاطر مهر و ارادت به اهل بیت از علویان استقبال می‌کردند و به آنان یاری می‌رساندند؛ فرمانروایان ایرانی مانند طاهریان و صفاریان نیز از آنان پشتیبانی می‌کردند. مردم مناطق کوهستانی گیلان و دیلم نیز علویان را پناه دادند و به همین دلیل تشیع در این مناطق رواج یافت."},{"type":"note","title":"پیامدهای مهاجرت علویان به ایران","body":"مهاجرت علویان به گسترش تشیع در ایران، پیدایش حکومت شیعی علویان طبرستان و پیوند نزدیک‌تر ایرانیان با فرهنگ اهل بیت انجامید و فضای علمی و دینی ایران را نیرومند کرد. تا امروز شیعه‌مذهب بودن مردم مازندران و گیلان و برخی دیگر از مناطق ایران از پیامدهای همین مهاجرت‌هاست."},{"type":"exam","title":"چرا عباسیان از علویان می‌ترسیدند و آنان را سرکوب می‌کردند؟","body":"پاسخ تشریحی: علویان از نسل پیامبر و امام علی (ع) بودند و در میان مردم محبوبیت فراوان داشتند؛ عباسیان با شعار دفاع از اهل بیت به قدرت رسیده بودند و می‌ترسیدند مردم حق را به علویان بازپس گیرند. از این رو علویان را زیر نظر می‌گرفتند، زندانی و کشتند و علویان ناچار به مهاجرت شدند."},{"type":"exam","title":"نقش علویان در رواج تشیع در ایران را توضیح دهید.","body":"پاسخ تشریحی: علویان با مهاجرت به ایران و تشکیل حکومت عادلانه در طبرستان، چهره درست اسلام را به مردم نشان دادند؛ مردم گیلان، دیلم و طبرستان با آنان بیعت کردند و تشیع در این مناطق گسترش یافت. پیوند ازدواج و خویشاوندی علویان با خانواده‌های ایرانی نیز مهر مردم ایران به اهل بیت را استوار کرد."}]},{"number":9,"title":"پهنه‌های طبیعی ایران","pages":"۱۱۹ تا ۱۳۲","contents":[{"type":"answer","title":"پهنه‌های طبیعی ایران کدام‌اند؟","body":"پهنه‌های طبیعی ایران به سه گروه تقسیم می‌شود: ناهمواری‌ها مانند کوه‌ها، دشت‌ها یعنی پهنه‌های پست و هموار درون کشور و جلگه‌ها یعنی سرزمین‌های پست و هموار کنار دریاها مانند خزر و خلیج فارس. تنوع همین پهنه‌ها به تنوع آب و هوا و زیست‌بوم‌های کشور انجامیده است.","pageRef":"صفحه ۱۲۱"},{"type":"answer","title":"رشته‌کوه‌های اصلی ایران کدام‌اند و چه ویژگی‌هایی دارند؟","body":"دو رشته‌کوه اصلی ایران البرز در شمال و زاگرس در غرب و جنوب غربی کشور است. قله دماوند در البرز بلندترین قله ایران است و دنا در زاگرس از بلندترین قله‌های این رشته‌کوه به شمار می‌رود. کوه‌ها مانع عبور هوای مرطوب می‌شوند و بر بارش و آب و هوای کشور اثر می‌گذارند.","pageRef":"صفحه ۱۲۴"},{"type":"note","title":"فلات ایران","body":"ایران بخشی از پهنه گسترده فلات ایران است؛ سرزمینی نسبتاً خشک و مرتفع که از شرق ترکیه آغاز می‌شود و تا جنوب افغانستان ادامه دارد و میانگین ارتفاع بیشتر بخش‌های آن بیش از هزار متر است. همین مرتفع بودن، ناهمواری‌های فراوان و تنوع پهنه‌های کشور را پدید آورده است."},{"type":"note","title":"جلگه‌های ایران","body":"جلگه‌ها سرزمین‌های پست و هموار کنار دریا هستند؛ جلگه خزر در شمال کشور و جلگه‌های خلیج فارس در جنوب قرار دارند و جلگه‌های جنوبی به‌ویژه خوزستان گسترده‌تر و حاصلخیزترند. دلتای رودهایی مانند کارون در خوزستان از حاصلخیزترین بخش‌های کشور برای کشاورزی است."},{"type":"exam","title":"تفاوت دشت و جلگه را با ذکر مثال بنویسید.","body":"پاسخ تشریحی: هر دو پهنه پست و هموارند؛ اما دشت در درون کشور و دور از دریا قرار دارد و ممکن است خشک باشد، مانند دشت‌های کویر مرکزی و لوت؛ جلگه در کنار دریا شکل می‌گیرد و منبع آب فراوان دارد، مانند جلگه خزر و جلگه خوزستان. به همین دلیل جلگه‌ها برای کشاورزی و سکونت مناسب‌ترند و جمعیت بیشتری دارند."},{"type":"exam","title":"ناهمواری‌ها چه اثری بر زندگی مردم ایران دارند؟","body":"پاسخ تشریحی: در نواحی کوهستانی مانند البرز و زاگرس بارش بیشتر است، باغداری و کشت دیم رایج است و روستاها کم‌شمارترند؛ در پهنه‌های هموار مانند جلگه‌ها جمعیت، کشاورزی و شهرها بیشتر است. کوه‌ها ساخت راه را پرهزینه می‌کنند، اما چشم‌انداز و هوای پاک آنان گردشگری را رونق می‌دهد."}]},{"number":10,"title":"آب و هوای ایران","pages":"۱۳۳ تا ۱۴۴","contents":[{"type":"answer","title":"چرا آب و هوای ایران متنوع است؟","body":"ایران در کمربند خشک جهان قرار دارد، اما تفاوت ارتفاع، فاصله از دریا و اثر ناهمواری‌ها آب و هوای متنوعی پدید آورده است؛ نواحی شمالی معتدل و مرطوب، نواحی کوهستانی سردسیر، ساحل‌های جنوبی گرم و مرطوب و نواحی مرکزی خشک و بیابانی است.","pageRef":"صفحه ۱۳۵"},{"type":"answer","title":"ناهنجاری‌های آب و هوایی کدام‌اند و چه آسیبی می‌رسانند؟","body":"ناهنجاری‌های آب و هوایی رویدادهایی هستند که با رفتار طبیعی هوا تفاوت دارند و خسارت می‌زنند؛ مانند خشکسالی‌های طولانی، سیل، سرمای شدید و یخبندان، توفان‌های گرد و خاک و رگبارهای سیل‌آسا. این رویدادها به کشاورزی، ساختمان‌ها و جان و مال مردم آسیب می‌رسانند.","pageRef":"صفحه ۱۳۹"},{"type":"note","title":"سایه بارشی کوه‌ها","body":"کوه‌های البرز و زاگرس مانند دیوار در برابر رطوبت دریاها قرار می‌گیرند؛ دامنه‌های شمالی البرز و دامنه‌های غربی زاگرس بارش فراوان دارند، اما پشت کوه بارش بسیار کم است. برای نمونه جنگل‌های انبوه شمال کشور از همین بارش سرشار تغذیه می‌کنند، در حالی که کویر مرکزی کم‌باران است."},{"type":"note","title":"توده‌های هوای مدیترانه","body":"در زمستان توده‌های هوای مرطوب و باران‌زای مدیترانه به ایران راه می‌یابند و در بیشتر نقاط کشور باران و برف پدید می‌آورند؛ به همین دلیل بارش‌ها در بیشتر مناطق کشور در نیمه سرد سال رخ می‌دهد. کم‌بارانی این توده‌ها در سال‌های خشک، خشکسالی و کاهش آب سدها را به همراه دارد."},{"type":"exam","title":"خشکسالی چه اثری بر زندگی و کشاورزی مردم ایران دارد؟","body":"پاسخ تشریحی: خشکسالی‌های پیاپی آب رودخانه‌ها، سدها و چاه‌ها را کم کرده و کشاورزان را به کاهش محصول و حفر چاه‌های عمیق واداشته است؛ مراتع و دامداری نیز آسیب می‌بیند. برای مقابله باید از آبیاری نوین، احیای قنات‌ها، کاهش کشت پرمصرف و برنامه‌ریزی درست مصرف آب بهره گرفت."},{"type":"exam","title":"چرا نواحی مرکزی ایران خشک و کم‌باران است؟","body":"پاسخ تشریحی: نواحی مرکزی ایران دور از دریا قرار دارند و رطوبت خزر و خلیج فارس به آنان نمی‌رسد؛ رشته‌کوه‌های البرز و زاگرس مانند دیوار در برابر هوای مرطوب قرار می‌گیرند و در پشت کوه بارش اندک است. به همین دلیل این پهنه‌ها بیابانی و کم‌باران‌اند و تابستان گرمای شدید و زمستان سرمای زیاد دارند."}]},{"number":11,"title":"منابع آب و خاک ایران","pages":"۱۴۵ تا ۱۵۸","contents":[{"type":"answer","title":"منابع آب ایران به دو گروه تقسیم می‌شود؛ آن‌ها را با مثال بنویسید.","body":"منابع آب ایران به دو گروه آب‌های سطحی و آب‌های زیرزمینی تقسیم می‌شود؛ رودها مانند کارون و زاینده‌رود، دریاچه‌ها مانند ارومیه و دریاها مانند خزر و خلیج فارس آب‌های سطحی هستند و آب‌های زیرزمینی در زیر خاک جمع شده‌اند و چشمه‌ها، چاه‌ها و قنات‌ها از آنان بهره می‌گیرند.","pageRef":"صفحه ۱۴۷"},{"type":"answer","title":"قنات چیست و چه فایده‌هایی دارد؟","body":"قنات کانالی است که از دامنه کوه در زیر زمین حفر می‌شود تا آب زیرزمینی به‌صورت طبیعی و بدون مصرف انرژی به دشت برسد؛ قنات تبخیر کم دارد، به محیط زیست آسیب نمی‌زند و آب را به‌آرامی منتقل می‌کند. قنات‌های یزد و کرمان قرن‌ها باغ‌ها و مزرعه‌های این مناطق را آب داده‌اند.","pageRef":"صفحه ۱۵۰"},{"type":"note","title":"فرسایش خاک و راه‌های پیشگیری","body":"خاک منبعی تجدیدپذیر است، اما جنگل‌زدایی، چرای بی‌رویه دام‌ها و کشت نادرست فرسایش خاک را شدت می‌بخشد و حاصلخیزی را از بین می‌برد. برای نمونه کاشت درخت و پوشش گیاهی در سراسر شیب، خاک را در برابر روان‌آب نگه می‌دارد و کشت پله‌ای در دامنه‌ها جلوی جاری‌شدن خاک را می‌گیرد."},{"type":"note","title":"سدها و مدیریت منابع آب","body":"سدها آب رودخانه‌ها را مهار و ذخیره می‌کنند تا در زمان کم‌آبی، آب کشاورزی و شرب فراهم شود و خطر سیل نیز کاهش یابد؛ اما ساخت بی‌رویه سد می‌تواند رودها و تالاب‌ها را خشک کند. کم‌آبی دریاچه ارومیه تا حدی به ساخت سدهای بیش از اندازه بر رودهای ورودی آن مربوط است."},{"type":"exam","title":"بحران خشکی دریاچه ارومیه را توضیح دهید.","body":"پاسخ تشریحی: دریاچه ارومیه بزرگ‌ترین دریاچه درون‌بومی ایران است؛ کاهش بارش، برداشت بی‌رویه آب‌های زیرزمینی و سطحی، ساخت سدها بر رودهای ورودی و افزایش مصرف آب، سطح آب آن را کاهش داده است. خشکی این دریاچه موجب پخش‌شدن گرد و خاک نمکی، آسیب کشاورزی پیرامون و نابودی گونه‌هایی مانند آرتمیا شده است."},{"type":"exam","title":"برای جلوگیری از فرسایش و آلودگی خاک چه باید کرد؟","body":"پاسخ تشریحی: باید از جنگل‌زدایی و چرای بی‌رویه جلوگیری کرد و پوشش گیاهی را احیا نمود؛ در دامنه‌ها کشت پله‌ای انجام داد، آب‌های جاری را با آب‌بندها مهار کرد و چرای دام را کنترل‌شده و در زمان مناسب انجام داد. همچنین بهره‌گیری درست از کود و پرهیز از مواد آلوده، حاصلخیزی خاک را پایدار نگه می‌دارد."}]},{"number":12,"title":"زیست‌بوم‌های ایران","pages":"۱۵۹ تا ۱۷۰","contents":[{"type":"answer","title":"زیست‌بوم چیست و چه عواملی نوع آن را مشخص می‌کند؟","body":"زیست‌بوم پهنه‌ای است که در آن موجودات زنده با یکدیگر و با عناصر غیرزنده مانند آب، خاک، هوا و نور کنش دارند. آب و هوا و پوشش گیاهی هر ناحیه نوع زیست‌بوم آن را تعیین می‌کند؛ ایران به همین سبب زیست‌بوم‌های متنوعی از جنگل‌های متراکم شمال تا بیابان‌های گرم دارد.","pageRef":"صفحه ۱۶۱"},{"type":"answer","title":"زیست‌بوم‌های ایران را نام ببرید.","body":"ایران زیست‌بوم‌های متنوعی دارد: جنگل‌های هیرکانی در شمال، جنگل‌های بلوط زاگرس، جنگل‌های گرم و خشک جنوب، مراتع و استپ‌های کوهستانی، بیابان‌های مرکزی و پهنه‌های آبی مانند خزر، خلیج فارس، دریاچه‌ها و تالاب‌ها. هر زیست‌بوم گیاهان و جانوران ویژه خود را دارد.","pageRef":"صفحه ۱۶۴"},{"type":"note","title":"جنگل‌های هیرکانی","body":"جنگل‌های هیرکانی در دامنه‌های شمالی البرز گسترده‌اند و با گونه‌های کهنی مانند راش و انجیلی از کهن‌ترین جنگل‌های جهان به شمار می‌روند؛ بخش‌هایی از این جنگل‌ها در فهرست میراث جهانی ثبت شده است. پلنگ ایرانی و پرندگان فراوان در این جنگل زندگی می‌کنند و بارش زیاد شمال آن‌ها را سرسبز نگه می‌دارد."},{"type":"note","title":"مراتع ایران","body":"بخش گسترده‌ای از کشور را مراتع فراگرفته است که خوراک دام‌ها، زیستگاه جانوران وحشی و نگاه‌دارنده آب و خاک است. برای نمونه مراتع دامنه زاگرس زیستگاه بز کوهی و قوچ و میش است؛ چرای بی‌رویه، تبدیل مرتع به زمین کشاورزی و جاده‌سازی این زیست‌بوم را آسیب می‌دهد."},{"type":"exam","title":"چرا حفاظت از زیست‌بوم‌ها برای کشور ضروری است؟","body":"پاسخ تشریحی: زیست‌بوم‌ها منبع آب، خاک، غذا، دارو و چوب هستند و تعادل طبیعت را نگاه می‌دارند؛ نابودی آن‌ها به انقراض جانوران و گیاهان، خشکی تالاب‌ها، گرد و خاک و زیان اقتصادی مردم می‌انجامد. جنگل‌زدایی، چرای بی‌رویه، شکار بی‌رویه و تغییر کاربری اراضی از مهم‌ترین آفت‌های زیست‌بوم‌های ایران‌اند."},{"type":"exam","title":"بیابان‌های ایران بی‌ارزش نیستند؛ با ذکر مثال توضیح دهید.","body":"پاسخ تشریحی: بیابان‌ها زیست‌بوم ویژه‌ای دارند؛ گیاهان سازگاری مانند گز و کَنار و جانورانی مانند شتر، روباه شنی و گورخر در آنان زندگی می‌کنند. چشم‌اندازهای زیبایی مانند کویر مصر و کلوت‌های شهداد گردشگر می‌پذیرند و نور آفتاب فراوان بیابان‌ها برای تولید برق خورشیدی بسیار مناسب است."}]},{"number":13,"title":"جمعیت ایران","pages":"۱۷۱ تا ۱۸۲","contents":[{"type":"answer","title":"جمعیت ایران در سال‌های اخیر چه تحولی داشته است؟","body":"جمعیت ایران در یکصد سال گذشته چند برابر شده است؛ بر پایه سرشماری سال ۱۳۹۵ نزدیک به هشتاد میلیون نفر بود و امروز بیش از هشتادوپنج میلیون نفر است. نرخ رشد جمعیت پس از برنامه‌ریزی‌های جمعیتی کاهش یافت و امروز سیاست‌های تشویق فرزندآوری در کشور اجرا می‌شود.","pageRef":"صفحه ۱۷۳"},{"type":"answer","title":"مهاجرت داخلی چه پیامدهایی به همراه دارد؟","body":"مهاجرت روستاییان به شهرها رشد سریع
